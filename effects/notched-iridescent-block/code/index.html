<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颗粒渐变形变厚块</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #d5e6f8;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="浅蓝背景上的圆角厚块，左右内凹，内部虹彩流动并缓慢形变。"></canvas>
<script>
"use strict";

(function () {
  var canvas = document.getElementById("c");
  var reduce = false;
  var motionQuery = null;
  try {
    motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    reduce = !!motionQuery.matches;
  } catch (err) { reduce = false; }

  var glOpts = {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false
  };
  var vert = "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}";
  var frag = [
    "precision highp float;",
    "uniform vec2 uRes;",
    "uniform float uTime;",
    "float sdRoundBox(vec2 p, vec2 b, float r){",
    "  vec2 q=abs(p)-b+r;",
    "  return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;",
    "}",
    "float shape(vec2 p, float t){",
    "  float breath=0.975+0.028*sin(t*0.85);",
    "  float open=sin(t*0.70);",
    "  float sway=sin(t*0.36);",
    "  float ang=0.035*sin(t*0.31);",
    "  float ca=cos(ang);",
    "  float sa=sin(ang);",
    "  vec2 q=mat2(ca,sa,-sa,ca)*p;",
    "  q.x/=breath*(1.0+0.018*sway);",
    "  q.y/=breath*(1.0-0.014*sway);",
    "  vec2 b=vec2(0.236,0.255+0.006*open);",
    "  float dBox=sdRoundBox(q,b,0.058);",
    "  float nh=0.120+0.006*open;",
    "  float nw=0.210+0.008*open;",
    "  float lift=0.010*sin(t*0.44);",
    "  vec2 lc=vec2(-0.286,lift);",
    "  vec2 rc=vec2(0.286,lift);",
    "  float dL=sdRoundBox(q-lc,vec2(nw,nh),0.045);",
    "  float dR=sdRoundBox(q-rc,vec2(nw,nh),0.045);",
    "  return max(dBox,max(-dL,-dR))*breath;",
    "}",
    "float hash(vec2 p){",
    "  return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);",
    "}",
    "float noise(vec2 p){",
    "  vec2 i=floor(p);",
    "  vec2 f=fract(p);",
    "  f=f*f*(3.0-2.0*f);",
    "  float a=hash(i);",
    "  float b=hash(i+vec2(1.0,0.0));",
    "  float c=hash(i+vec2(0.0,1.0));",
    "  float d=hash(i+vec2(1.0,1.0));",
    "  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);",
    "}",
    "vec3 iri(vec2 p, float t){",
    "  float drift=t*0.35;",
    "  float a=p.x*7.2+p.y*2.4+drift;",
    "  float b=p.y*6.4-p.x*3.1-drift*0.7;",
    "  float c=sin(a)*cos(b+sin(a*0.7));",
    "  float d=sin(p.x*4.0-p.y*3.3+drift*1.1+c);",
    "  vec3 magenta=vec3(1.00,0.28,0.58);",
    "  vec3 violet=vec3(0.46,0.22,0.98);",
    "  vec3 cyan=vec3(0.22,0.78,1.00);",
    "  vec3 deep=vec3(0.36,0.14,0.72);",
    "  float kx=clamp(0.5+p.x*1.7+0.16*c,0.0,1.0);",
    "  vec3 col=mix(magenta,cyan,kx);",
    "  col=mix(col,violet,clamp(0.42+0.38*d,0.0,1.0));",
    "  col=mix(col,deep,clamp(0.08-p.y*1.15+0.08*c,0.0,1.0));",
    "  float grit=noise(p*vec2(38.0,30.0)+vec2(t*1.6,-t*0.7));",
    "  col=mix(col,col*(0.86+0.28*grit),0.22);",
    "  return col;",
    "}",
    "void main(){",
    "  float t=uTime;",
    "  vec2 p=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);",
    "  p.y-=0.015;",
    "  vec2 su=gl_FragCoord.xy/uRes;",
    "  vec3 bgTop=vec3(0.91,0.94,0.99);",
    "  vec3 bgBot=vec3(0.62,0.75,0.95);",
    "  vec3 bg=mix(bgBot,bgTop,su.y);",
    "  float rad=length((su-0.5)*vec2(uRes.x/uRes.y,1.0));",
    "  bg=mix(bg,vec3(0.86,0.91,0.99),(1.0-smoothstep(0.05,0.85,rad))*0.28);",
    "  vec2 shift=vec2(0.0,-0.022);",
    "  float dBack=shape(p-shift,t);",
    "  float dFront=shape(p,t)+0.012;",
    "  float dSh=shape(p-vec2(0.006,-0.046),t);",
    "  float shade=1.0-smoothstep(0.0,0.09,dSh);",
    "  bg*=1.0-shade*0.10;",
    "  float aa=1.35/min(uRes.x,uRes.y);",
    "  float front=1.0-smoothstep(-aa,aa,dFront);",
    "  float back=1.0-smoothstep(-aa,aa,dBack);",
    "  float inside=max(-dFront,0.0);",
    "  vec3 base=iri(p,t);",
    "  float up=smoothstep(-0.16,0.14,p.y);",
    "  vec3 topCol=base*(0.78+0.28*up);",
    "  vec2 sheenP=p-vec2(-0.02,0.105);",
    "  float sheen=exp(-dot(sheenP,sheenP)/0.016);",
    "  topCol+=vec3(1.0,0.95,0.98)*sheen*0.20;",
    "  vec2 specP=p-vec2(0.045,0.09);",
    "  float spec=exp(-dot(specP,specP)/0.0024);",
    "  topCol+=vec3(0.80,0.96,1.0)*spec*0.28;",
    "  float rimSoft=1.0-smoothstep(0.006,0.040,inside);",
    "  float rimCore=(1.0-smoothstep(0.004,0.016,inside))*smoothstep(0.0,0.004,inside);",
    "  vec3 rim=mix(vec3(1.0,0.48,0.78),vec3(0.55,0.96,1.0),clamp(0.5+p.x*2.4,0.0,1.0));",
    "  topCol=mix(topCol,rim,rimSoft*0.72);",
    "  topCol+=vec3(1.0)*rimCore*0.55;",
    "  float sideIn=max(-dBack,0.0);",
    "  float sideRim=1.0-smoothstep(0.0,0.012,sideIn);",
    "  vec3 sideCol=mix(base*0.62,vec3(0.28,0.12,0.52),0.28);",
    "  sideCol*=0.70+0.35*smoothstep(-0.12,0.08,p.y);",
    "  vec3 sideGlow=mix(vec3(1.0,0.62,0.86),vec3(0.55,0.92,1.0),clamp(0.5+p.x*2.2,0.0,1.0));",
    "  sideCol=mix(sideCol,sideGlow,sideRim*0.8);",
    "  vec3 col=bg;",
    "  col=mix(col,sideCol,back);",
    "  col=mix(col,topCol,front);",
    "  float object=clamp(max(front,back),0.0,1.0);",
    "  float grit=noise(gl_FragCoord.xy*0.28+vec2(t*16.0,t*6.0));",
    "  float grit2=noise(gl_FragCoord.xy*0.62+vec2(-t*9.0,t*13.0));",
    "  col+=(grit*0.65+grit2*0.35-0.5)*(0.012+0.046*object);",
    "  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);",
    "}"
  ].join("\n");

  var gl = null;
  var glLost = false;
  var loc = {};

  function compileShader(context, type, source) {
    var shader = context.createShader(type);
    context.shaderSource(shader, source);
    context.compileShader(shader);
    if (!context.getShaderParameter(shader, context.COMPILE_STATUS)) {
      console.error(context.getShaderInfoLog(shader) || "shader compile failed");
      context.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function linkProgram(context) {
    var vs = compileShader(context, context.VERTEX_SHADER, vert);
    var fs = compileShader(context, context.FRAGMENT_SHADER, frag);
    if (!vs || !fs) return null;
    var program = context.createProgram();
    context.attachShader(program, vs);
    context.attachShader(program, fs);
    context.bindAttribLocation(program, 0, "a");
    context.linkProgram(program);
    if (!context.getProgramParameter(program, context.LINK_STATUS)) {
      console.error(context.getProgramInfoLog(program) || "program link failed");
      context.deleteProgram(program);
      return null;
    }
    return program;
  }

  function replaceCanvas() {
    var next = document.createElement("canvas");
    next.id = "c";
    next.setAttribute("role", "img");
    next.setAttribute("aria-label", canvas.getAttribute("aria-label") || "");
    canvas.replaceWith(next);
    canvas = next;
  }

  var glBound = false;
  function bootGL(target) {
    var context = target.getContext("webgl", glOpts);
    if (!context) return false;
    glBound = true;
    var program = linkProgram(context);
    if (!program) return false;
    var buffer = context.createBuffer();
    context.bindBuffer(context.ARRAY_BUFFER, buffer);
    context.bufferData(context.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), context.STATIC_DRAW);
    context.enableVertexAttribArray(0);
    context.vertexAttribPointer(0, 2, context.FLOAT, false, 0, 0);
    context.useProgram(program);
    context.disable(context.DEPTH_TEST);
    gl = context;
    loc.uRes = context.getUniformLocation(program, "uRes");
    loc.uTime = context.getUniformLocation(program, "uTime");
    return true;
  };
  if (!bootGL(canvas) && glBound) replaceCanvas();

  var ctx2d = null;
  var layer = null;
  var lctx = null;
  var noise = null;
  var noisePattern = null;
  if (!gl) {
    ctx2d = canvas.getContext("2d");
    if (ctx2d) {
      layer = document.createElement("canvas");
      lctx = layer.getContext("2d");
      noise = document.createElement("canvas");
      noise.width = 128;
      noise.height = 128;
      var nctx = noise.getContext("2d");
      var dots = nctx.createImageData(128, 128);
      for (var i = 0; i < dots.data.length; i += 4) {
        var v = (Math.random() * 255) | 0;
        dots.data[i] = v;
        dots.data[i + 1] = v;
        dots.data[i + 2] = v;
        dots.data[i + 3] = 255;
      }
      nctx.putImageData(dots, 0, 0);
      noisePattern = lctx.createPattern(noise, "repeat");
    }
  }

  if (gl) {
    canvas.addEventListener("webglcontextlost", function (event) {
      event.preventDefault();
      heldTime = animTime(performance.now());
      glLost = true;
      stopLoop();
    });
    canvas.addEventListener("webglcontextrestored", function () {
      if (!bootGL(canvas)) {
        if (!rafId) {
          looping = true;
          rafId = requestAnimationFrame(frame);
        }
        return;
      }
      glLost = false;
      start = performance.now() - heldTime * 1000;
      resize();
      startLoop();
    });
  }

  var start = performance.now();
  var heldTime = 0;
  var width = 1;
  var height = 1;
  var rafId = 0;
  var looping = false;

  function pose(time) {
    var open = Math.sin(time * 0.70);
    return {
      breath: 0.975 + 0.028 * Math.sin(time * 0.85),
      sway: Math.sin(time * 0.36),
      ang: 0.035 * Math.sin(time * 0.31),
      lift: 0.010 * Math.sin(time * 0.44),
      bx: 0.236,
      by: 0.255 + 0.006 * open,
      bodyR: 0.058,
      ncx: 0.286,
      nw: 0.210 + 0.008 * open,
      nh: 0.120 + 0.006 * open,
      nr: 0.045
    };
  }

  function animTime(now) {
    if (reduce) return 1.15;
    return (now - start) / 1000;
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = canvas.clientWidth || window.innerWidth || 720;
    var cssH = canvas.clientHeight || window.innerHeight || 720;
    width = Math.max(1, Math.round(cssW * dpr));
    height = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      if (gl && !glLost && !gl.isContextLost()) gl.viewport(0, 0, width, height);
      if (layer) {
        layer.width = width;
        layer.height = height;
      }
    }
  }

  function drawGL(time) {
    gl.viewport(0, 0, width, height);
    gl.uniform2f(loc.uRes, width, height);
    gl.uniform1f(loc.uTime, time);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function roundRect(ctx, x, y, w, h, r) {
    var rr = Math.max(0, Math.min(r, w * 0.5, h * 0.5));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawSlab(time, shiftX, shiftY, mode) {
    var s = pose(time);
    var unit = Math.min(width, height);
    var inset = mode === "front" ? 0.012 * unit : 0;
    var bx = s.bx * unit - inset;
    var by = s.by * unit - inset;
    var cr = s.bodyR * unit;
    var ncx = s.ncx * unit;
    var nw = Math.max(0, s.nw * unit - inset);
    var nh = Math.max(0, s.nh * unit - inset);
    var nr = s.nr * unit;
    var lift = s.lift * unit;
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, width, height);
    lctx.save();
    lctx.translate(width * 0.5 + shiftX, height * 0.5 - unit * 0.015 + shiftY);
    lctx.rotate(s.ang);
    lctx.scale(s.breath * (1 + 0.018 * s.sway), s.breath * (1 - 0.014 * s.sway));
    roundRect(lctx, -bx, -by, bx * 2, by * 2, cr);
    lctx.clip();
    var paint;
    if (mode === "side") {
      paint = lctx.createLinearGradient(0, -by, 0, by);
      paint.addColorStop(0, "#7a56e6");
      paint.addColorStop(0.55, "#4a278f");
      paint.addColorStop(1, "#2a1458");
    } else {
      paint = lctx.createLinearGradient(-bx, -by * 0.15, bx, by);
      paint.addColorStop(0, "#ff4d93");
      paint.addColorStop(0.46, "#6d38f2");
      paint.addColorStop(1, "#3ecbff");
    }
    lctx.fillStyle = paint;
    lctx.fillRect(-bx - 4, -by - 4, bx * 2 + 8, by * 2 + 8);
    if (mode === "front") {
      var hi = lctx.createRadialGradient(-bx * 0.08, -by * 0.62, unit * 0.01, 0, -by * 0.35, unit * 0.16);
      hi.addColorStop(0, "rgba(255,255,255,0.55)");
      hi.addColorStop(1, "rgba(255,255,255,0)");
      lctx.fillStyle = hi;
      lctx.fillRect(-bx - 4, -by - 4, bx * 2 + 8, by * 2 + 8);
      lctx.lineWidth = Math.max(2, unit * 0.026);
      lctx.strokeStyle = "rgba(255, 90, 170, 0.95)";
      roundRect(lctx, -ncx - nw, lift - nh, nw * 2, nh * 2, nr);
      lctx.stroke();
      lctx.strokeStyle = "rgba(90, 220, 255, 0.95)";
      roundRect(lctx, ncx - nw, lift - nh, nw * 2, nh * 2, nr);
      lctx.stroke();
      lctx.lineWidth = Math.max(1, unit * 0.008);
      lctx.strokeStyle = "rgba(255,255,255,0.85)";
      roundRect(lctx, -ncx - nw, lift - nh, nw * 2, nh * 2, nr);
      lctx.stroke();
      roundRect(lctx, ncx - nw, lift - nh, nw * 2, nh * 2, nr);
      lctx.stroke();
    }
    lctx.globalCompositeOperation = "destination-out";
    lctx.fillStyle = "#000";
    roundRect(lctx, -ncx - nw, lift - nh, nw * 2, nh * 2, nr);
    lctx.fill();
    roundRect(lctx, ncx - nw, lift - nh, nw * 2, nh * 2, nr);
    lctx.fill();
    lctx.restore();
    if (noisePattern) {
      lctx.save();
      lctx.globalCompositeOperation = "source-atop";
      lctx.globalAlpha = mode === "front" ? 0.22 : 0.12;
      lctx.fillStyle = noisePattern;
      lctx.translate((time * 22) % 128, (time * 9) % 128);
      lctx.fillRect(-128, -128, width + 256, height + 256);
      lctx.restore();
    }
    ctx2d.drawImage(layer, 0, 0);
  }

  function draw2D(time) {
    var unit = Math.min(width, height);
    var bg = ctx2d.createLinearGradient(0, 0, 0, height);
    bg.addColorStop(0, "#e7f1fc");
    bg.addColorStop(1, "#9ec0f2");
    ctx2d.setTransform(1, 0, 0, 1, 0, 0);
    ctx2d.fillStyle = bg;
    ctx2d.fillRect(0, 0, width, height);
    ctx2d.save();
    ctx2d.translate(width * 0.5 + unit * 0.006, height * 0.5 + unit * 0.031);
    ctx2d.scale(1, 0.28);
    ctx2d.fillStyle = "rgba(48, 72, 140, 0.16)";
    ctx2d.beginPath();
    ctx2d.ellipse(0, 0, unit * 0.18, unit * 0.18, 0, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.restore();
    drawSlab(time, 0, unit * 0.022, "side");
    drawSlab(time, 0, 0, "front");
  }

  function paint(time) {
    if (gl && !glLost && !gl.isContextLost()) drawGL(time);
    else if (ctx2d && lctx) draw2D(time);
  }

  function stopLoop() {
    looping = false;
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  function drawOnce() {
    resize();
    paint(animTime(performance.now()));
  }

  function frame(now) {
    if (!looping) return;
    now = now || performance.now();
    if (glLost && bootGL(canvas)) {
      glLost = false;
      start = now - heldTime * 1000;
    }
    resize();
    paint(animTime(now));
    if (!glLost && reduce) {
      stopLoop();
      return;
    }
    rafId = requestAnimationFrame(frame);
  }

  function startLoop() {
    stopLoop();
    if (reduce) {
      drawOnce();
      return;
    }
    looping = true;
    rafId = requestAnimationFrame(frame);
  }

  if (motionQuery && motionQuery.addEventListener) {
    motionQuery.addEventListener("change", function (ev) {
      reduce = !!ev.matches;
      startLoop();
    });
  }
  window.addEventListener("resize", function () {
    if (reduce) drawOnce();
  });

  startLoop();
})();
</script>
</body>
</html>
