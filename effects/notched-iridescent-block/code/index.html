<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颗粒渐变形变厚块</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #d5e6f8;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c" aria-label="浅蓝背景上的圆角厚块，左右内凹，内部虹彩流动并缓慢形变。"></canvas>
<script>
"use strict";

(function () {
  var canvas = document.getElementById("c");
  var reduce = false;
  try {
    var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    reduce = !!mq.matches;
    if (mq.addEventListener) mq.addEventListener("change", function (ev) { reduce = !!ev.matches; });
  } catch (err) { reduce = false; }

  var vert = "attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}";
  var frag = [
    "precision highp float;",
    "uniform vec2 uRes;",
    "uniform float uTime;",
    "float sdRoundBox(vec2 p, vec2 b, float r){",
    "  vec2 q=abs(p)-b+r;",
    "  return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;",
    "}",
    "float sdCircle(vec2 p, float r){return length(p)-r;}",
    "float shape(vec2 p, float t){",
    "  float breath=0.96+0.06*sin(t*0.85);",
    "  float open=sin(t*0.70);",
    "  float sway=sin(t*0.36);",
    "  float ang=0.045*sin(t*0.31);",
    "  float ca=cos(ang);",
    "  float sa=sin(ang);",
    "  vec2 q=mat2(ca,sa,-sa,ca)*p;",
    "  q.x/=breath*(1.0+0.028*sway);",
    "  q.y/=breath*(1.0-0.022*sway);",
    "  vec2 b=vec2(0.236,0.218+0.012*open);",
    "  float cr=0.132+0.012*open;",
    "  float dBox=sdRoundBox(q,b,cr);",
    "  float nr=0.248+0.030*open;",
    "  float lift=0.016*sin(t*0.44);",
    "  vec2 lc=vec2(-0.392,lift+0.010*sin(t*0.61));",
    "  vec2 rc=vec2(0.392,lift-0.010*sin(t*0.57));",
    "  float d=max(dBox,max(-sdCircle(q-lc,nr),-sdCircle(q-rc,nr)));",
    "  return d*breath;",
    "}",
    "float hash(vec2 p){",
    "  return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);",
    "}",
    "vec3 iri(vec2 p, float t){",
    "  float a=p.x*7.2+p.y*2.4+t*0.55;",
    "  float b=p.y*6.4-p.x*3.1-t*0.38;",
    "  float c=sin(a)*cos(b+sin(a*0.7));",
    "  float d=sin(p.x*4.0-p.y*3.3+t*0.62+c);",
    "  vec3 magenta=vec3(1.00,0.28,0.58);",
    "  vec3 violet=vec3(0.46,0.22,0.98);",
    "  vec3 cyan=vec3(0.22,0.78,1.00);",
    "  vec3 deep=vec3(0.36,0.14,0.72);",
    "  float kx=clamp(0.5+p.x*1.7+0.16*c,0.0,1.0);",
    "  vec3 col=mix(magenta,cyan,kx);",
    "  col=mix(col,violet,clamp(0.42+0.38*d,0.0,1.0));",
    "  col=mix(col,deep,clamp(0.08-p.y*1.15+0.08*c,0.0,1.0));",
    "  return col;",
    "}",
    "void main(){",
    "  float t=uTime;",
    "  vec2 p=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);",
    "  p.y-=0.015;",
    "  vec2 su=gl_FragCoord.xy/uRes;",
    "  vec3 bgTop=vec3(0.91,0.94,0.99);",
    "  vec3 bgBot=vec3(0.62,0.75,0.95);",
    "  vec3 bg=mix(bgBot,bgTop,su.y);",
    "  float rad=length((su-0.5)*vec2(uRes.x/uRes.y,1.0));",
    "  bg=mix(bg,vec3(0.86,0.91,0.99),(1.0-smoothstep(0.05,0.85,rad))*0.28);",
    "  vec2 shift=vec2(0.0,-0.022);",
    "  float dBack=shape(p-shift,t);",
    "  float dFront=shape(p,t)+0.012;",
    "  float dSh=shape(p-vec2(0.006,-0.046),t);",
    "  float shade=1.0-smoothstep(0.0,0.09,dSh);",
    "  bg*=1.0-shade*0.10;",
    "  float aa=1.35/min(uRes.x,uRes.y);",
    "  float front=1.0-smoothstep(-aa,aa,dFront);",
    "  float back=1.0-smoothstep(-aa,aa,dBack);",
    "  float inside=max(-dFront,0.0);",
    "  vec3 base=iri(p,t);",
    "  float up=smoothstep(-0.16,0.14,p.y);",
    "  vec3 topCol=base*(0.78+0.28*up);",
    "  vec2 sheenP=p-vec2(-0.02,0.105);",
    "  float sheen=exp(-dot(sheenP,sheenP)/0.016);",
    "  topCol+=vec3(1.0,0.95,0.98)*sheen*0.20;",
    "  vec2 specP=p-vec2(0.045,0.09);",
    "  float spec=exp(-dot(specP,specP)/0.0024);",
    "  topCol+=vec3(0.80,0.96,1.0)*spec*0.28;",
    "  float rimSoft=1.0-smoothstep(0.006,0.040,inside);",
    "  float rimCore=(1.0-smoothstep(0.004,0.016,inside))*smoothstep(0.0,0.004,inside);",
    "  vec3 rim=mix(vec3(1.0,0.48,0.78),vec3(0.55,0.96,1.0),clamp(0.5+p.x*2.4,0.0,1.0));",
    "  topCol=mix(topCol,rim,rimSoft*0.72);",
    "  topCol+=vec3(1.0)*rimCore*0.55;",
    "  float sideIn=max(-dBack,0.0);",
    "  float sideRim=1.0-smoothstep(0.0,0.012,sideIn);",
    "  vec3 sideCol=mix(base*0.62,vec3(0.28,0.12,0.52),0.28);",
    "  sideCol*=0.70+0.35*smoothstep(-0.12,0.08,p.y);",
    "  vec3 sideGlow=mix(vec3(1.0,0.62,0.86),vec3(0.55,0.92,1.0),clamp(0.5+p.x*2.2,0.0,1.0));",
    "  sideCol=mix(sideCol,sideGlow,sideRim*0.8);",
    "  vec3 col=bg;",
    "  col=mix(col,sideCol,back);",
    "  col=mix(col,topCol,front);",
    "  float object=clamp(max(front,back),0.0,1.0);",
    "  float grain=hash(gl_FragCoord.xy);",
    "  float grain2=hash(floor(gl_FragCoord.xy*0.5));",
    "  float grit=grain*0.7+grain2*0.3;",
    "  col+=(grit-0.5)*(0.010+0.040*object);",
    "  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);",
    "}"
  ].join("\n");

  var gl = canvas.getContext("webgl", {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false
  });
  var program = null;
  var loc = {};
  if (gl) {
    function compile(type, source) {
      var shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }
    var vs = compile(gl.VERTEX_SHADER, vert);
    var fs = compile(gl.FRAGMENT_SHADER, frag);
    if (vs && fs) {
      program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.bindAttribLocation(program, 0, "a");
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) program = null;
    }
    if (!program) gl = null;
  }
  if (gl) {
    var buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.useProgram(program);
    gl.disable(gl.DEPTH_TEST);
    loc.uRes = gl.getUniformLocation(program, "uRes");
    loc.uTime = gl.getUniformLocation(program, "uTime");
  }

  var ctx2d = gl ? null : canvas.getContext("2d");
  var layer = null;
  var lctx = null;
  if (!gl && ctx2d) {
    layer = document.createElement("canvas");
    lctx = layer.getContext("2d");
  }

  var start = performance.now();
  var width = 1;
  var height = 1;

  function animTime(now) {
    if (reduce) return 1.15;
    return ((now - start) / 1000) % 600;
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = canvas.clientWidth || window.innerWidth || 720;
    var cssH = canvas.clientHeight || window.innerHeight || 720;
    width = Math.max(1, Math.round(cssW * dpr));
    height = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      if (gl) gl.viewport(0, 0, width, height);
      if (layer) {
        layer.width = width;
        layer.height = height;
      }
    }
  }

  function drawGL(time) {
    gl.uniform2f(loc.uRes, width, height);
    gl.uniform1f(loc.uTime, time);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function roundRect(ctx, x, y, w, h, r) {
    var rr = Math.max(0, Math.min(r, w * 0.5, h * 0.5));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function punch(ctx, unit, open) {
    var nr = (0.248 + 0.030 * open) * unit;
    var ncx = 0.392 * unit;
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(-ncx, 0, nr, 0, Math.PI * 2);
    ctx.arc(ncx, 0, nr, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  function drawSlab(time, shiftX, shiftY, mode) {
    var open = Math.sin(time * 0.70);
    var sway = Math.sin(time * 0.36);
    var breath = 0.96 + 0.06 * Math.sin(time * 0.85);
    var ang = 0.045 * Math.sin(time * 0.31);
    var unit = Math.min(width, height);
    var bx = 0.236 * unit;
    var by = (0.218 + 0.012 * open) * unit;
    var cr = (0.132 + 0.012 * open) * unit;
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, width, height);
    lctx.save();
    lctx.translate(width * 0.5 + shiftX, height * 0.5 + shiftY + unit * 0.015);
    lctx.rotate(ang);
    lctx.scale(breath * (1 + 0.028 * sway), breath * (1 - 0.022 * sway));
    roundRect(lctx, -bx, -by, bx * 2, by * 2, cr);
    lctx.clip();
    var paint;
    if (mode === "side") {
      paint = lctx.createLinearGradient(0, -by, 0, by);
      paint.addColorStop(0, "#6d4de0");
      paint.addColorStop(0.55, "#3a1d86");
      paint.addColorStop(1, "#24124f");
    } else {
      paint = lctx.createLinearGradient(-bx, -by * 0.2, bx, by);
      paint.addColorStop(0, "#ff4d93");
      paint.addColorStop(0.42, "#6d38f2");
      paint.addColorStop(1, "#3ecbff");
    }
    lctx.fillStyle = paint;
    lctx.fillRect(-bx - 4, -by - 4, bx * 2 + 8, by * 2 + 8);
    if (mode === "front") {
      var hi = lctx.createRadialGradient(-bx * 0.05, -by * 0.45, unit * 0.02, 0, -by * 0.05, unit * 0.22);
      hi.addColorStop(0, "rgba(255,255,255,0.72)");
      hi.addColorStop(0.45, "rgba(255,255,255,0.16)");
      hi.addColorStop(1, "rgba(255,255,255,0)");
      lctx.fillStyle = hi;
      lctx.fillRect(-bx - 4, -by - 4, bx * 2 + 8, by * 2 + 8);
    }
    punch(lctx, unit, open);
    lctx.restore();
    ctx2d.drawImage(layer, 0, 0);
  }

  function draw2D(time) {
    var unit = Math.min(width, height);
    var bg = ctx2d.createLinearGradient(0, 0, 0, height);
    bg.addColorStop(0, "#e7f1fc");
    bg.addColorStop(1, "#9ec0f2");
    ctx2d.setTransform(1, 0, 0, 1, 0, 0);
    ctx2d.fillStyle = bg;
    ctx2d.fillRect(0, 0, width, height);
    ctx2d.save();
    ctx2d.translate(width * 0.5, height * 0.56);
    ctx2d.scale(1, 0.28);
    ctx2d.fillStyle = "rgba(48, 72, 140, 0.16)";
    ctx2d.beginPath();
    ctx2d.ellipse(0, 0, unit * 0.20, unit * 0.20, 0, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.restore();
    var thick = unit * 0.026;
    drawSlab(time, unit * 0.003, thick, "side");
    drawSlab(time, 0, 0, "front");
  }

  function frame(now) {
    resize();
    var time = animTime(now || performance.now());
    if (gl) drawGL(time);
    else if (ctx2d && lctx) draw2D(time);
    requestAnimationFrame(frame);
  }

  resize();
  frame(performance.now());
})();
</script>
</body>
</html>
