<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>招聘信封贴纸</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      background: #f7f6f3;
      color: #1c1916;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .bar {
      width: min(640px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hint { margin: 0; min-width: 0; font-size: 13px; color: #5e564c; }
    .again {
      border: 1px solid #1c1916;
      background: #fff;
      color: #1c1916;
      border-radius: 999px;
      padding: 6px 12px;
      font: 600 13px/1 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
    }
    .again:disabled { opacity: 0.45; cursor: default; }
    .again:focus-visible, .mailer:focus-visible {
      outline: 2px solid #1c1916;
      outline-offset: 3px;
    }
    .stage {
      width: min(640px, 100%);
      height: min(460px, calc(100dvh - 72px));
      position: relative;
      overflow: hidden;
    }
    .scene {
      width: 640px;
      height: 460px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.45);
      transform-origin: center center;
    }
    .mailer {
      position: absolute;
      left: 118px;
      top: 128px;
      width: 320px;
      height: 180px;
      padding: 0;
      border: 0;
      background: transparent;
      transform: rotate(-2.4deg);
      cursor: pointer;
      filter: drop-shadow(0 18px 16px rgba(92, 58, 16, 0.18));
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 8px 22px 18px 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.28), transparent 28%),
        linear-gradient(90deg, #e7be78 0%, #e2b15c 46%, #d7a24c 100%);
      box-shadow: inset 0 0 0 1px rgba(120, 72, 18, 0.18);
      overflow: hidden;
    }
    .grain {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.45) 0.6px, transparent 0.7px);
      background-size: 5px 5px;
      opacity: 0.35;
      pointer-events: none;
    }
    .word {
      position: absolute;
      left: 28px;
      top: 26px;
      padding: 4px 10px 5px;
      background: #fff;
      border-radius: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.04em;
      transform: rotate(-6deg);
      box-shadow: 0 6px 10px rgba(80, 48, 10, 0.08);
    }
    .meta {
      position: absolute;
      left: 0;
      right: 72px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: rgba(90, 52, 16, 0.72);
      font-size: 10px;
      letter-spacing: 0.14em;
    }
    .marks { display: flex; gap: 8px; }
    .slot {
      position: absolute;
      right: 18px;
      top: 16px;
      bottom: 16px;
      width: 36px;
      border-radius: 4px;
      background: linear-gradient(90deg, #8a5a28, #c48a45 40%, #6d4520);
    }
    .lip {
      position: absolute;
      right: 0;
      top: 8px;
      bottom: 8px;
      width: 46px;
      border-radius: 4px 12px 12px 4px;
      background: linear-gradient(90deg, #c4893c, #f0d7a4 28%, #e4bc72 70%, #d7a45a);
      box-shadow: inset 1px 0 0 rgba(255,255,255,.35);
      transform-origin: left center;
    }
    .peek {
      position: absolute;
      right: -8px;
      top: 36px;
      width: 18px;
      height: 112px;
      overflow: hidden;
      pointer-events: none;
    }
    .peek i {
      display: block;
      height: 22px;
      margin: 6px 0;
      border-radius: 6px 0 0 6px;
      background: #fff;
      box-shadow: 0 2px 0 rgba(0,0,0,.04);
    }
    .peek i:nth-child(2) { background: #2f6bff; margin-left: 4px; }
    .peek i:nth-child(3) { background: #fff; height: 16px; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .sticker { position: absolute; left: 0; top: 0; opacity: 0; }
    .pad {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 8px 14px rgba(70, 46, 12, 0.1);
    }
    .pad b { font-size: 16px; letter-spacing: 0.04em; }
    .tile, .heart, .flag, .pin, .bubble {
      display: grid;
      place-items: center;
      filter: drop-shadow(0 6px 8px rgba(70, 46, 12, 0.12));
    }
    .stamp {
      width: 62px;
      background: #2f6bff;
      color: #fff;
      border-radius: 8px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.05;
      padding: 7px 6px 8px;
      box-shadow: 0 8px 12px rgba(30, 60, 140, 0.18);
    }
    .person { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .person b { font-size: 13px; background: #fff; border-radius: 8px; padding: 2px 6px; }
    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <div class="bar">
    <p class="hint" id="hint">点信封，或按 Enter</p>
    <button type="button" class="again" id="again" disabled>再开一次</button>
  </div>
  <div class="stage" id="stage">
    <div class="scene" id="scene">
      <button type="button" class="mailer" id="open" aria-label="打开招聘信封">
        <span class="face">
          <span class="grain"></span>
          <span class="word">入伙</span>
          <span class="meta">
            <span class="marks" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg width="14" height="14" viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2.5 11 11H3Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2.2 8.4 5.6 12 6.1 9.4 8.6 10 12.2 7 10.4 4 12.2 4.6 8.6 2 6.1 5.6 5.6Z" fill="currentColor"/></svg>
            </span>
            牛皮纸袋
          </span>
          <span class="slot"></span>
          <span class="lip" id="lip"></span>
          <span class="peek" id="peek" aria-hidden="true"><i></i><i></i><i></i></span>
        </span>
      </button>
      <div class="layer" id="layer" aria-hidden="true"></div>
    </div>
  </div>
  <p class="status" id="status" role="status"></p>
  <script>
    const W = 640;
    const H = 460;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const stage = document.querySelector("#stage");
    const scene = document.querySelector("#scene");
    const lip = document.querySelector("#lip");
    const peek = document.querySelector("#peek");
    const layer = document.querySelector("#layer");
    const openBtn = document.querySelector("#open");
    const again = document.querySelector("#again");
    const hint = document.querySelector("#hint");
    const status = document.querySelector("#status");

    const items = [
      { kind: "tile", delay: 0.08, dur: 0.9, sx: 424, sy: 196, cx: 500, cy: 70, ex: 456, ey: 78, sr: 16, er: 8, spin: -5 },
      { kind: "house", delay: 0.26, dur: 0.92, sx: 428, sy: 208, cx: 560, cy: 60, ex: 512, ey: 92, sr: -10, er: -6, spin: 4 },
      { kind: "sprout", delay: 0.44, dur: 1.0, sx: 418, sy: 186, cx: 260, cy: 48, ex: 214, ey: 74, sr: 18, er: -8, spin: -6 },
      { kind: "pin", delay: 0.64, dur: 0.9, sx: 430, sy: 214, cx: 580, cy: 100, ex: 548, ey: 136, sr: 12, er: -8, spin: 5 },
      { kind: "flex", delay: 0.84, dur: 0.96, sx: 426, sy: 200, cx: 590, cy: 70, ex: 520, ey: 168, sr: -8, er: 7, spin: -4 },
      { kind: "heart", delay: 1.06, dur: 0.9, sx: 422, sy: 220, cx: 540, cy: 130, ex: 468, ey: 176, sr: 20, er: 12, spin: 6 },
      { kind: "meal", delay: 1.28, dur: 0.96, sx: 432, sy: 206, cx: 600, cy: 150, ex: 548, ey: 214, sr: 8, er: 4, spin: -3 },
      { kind: "chats", delay: 1.5, dur: 0.98, sx: 420, sy: 228, cx: 580, cy: 210, ex: 500, ey: 250, sr: -12, er: -4, spin: 4 },
      { kind: "flag", delay: 1.74, dur: 0.92, sx: 416, sy: 234, cx: 520, cy: 250, ex: 456, ey: 292, sr: 14, er: 8, spin: -5 },
      { kind: "tea", delay: 2.02, dur: 0.95, sx: 420, sy: 210, cx: 400, cy: 150, ex: 330, ey: 258, sr: 10, er: -6, spin: 4 },
      { kind: "bubble", delay: 2.26, dur: 0.9, sx: 428, sy: 222, cx: 470, cy: 180, ex: 386, ey: 272, sr: -8, er: 6, spin: -4 },
      { kind: "hello", delay: 2.52, dur: 1.12, sx: 424, sy: 230, cx: 470, cy: 350, ex: 292, ey: 392, sr: 8, er: -3, spin: 5 }
    ];

    const markup = {
      sprout: '<div class="pad"><svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 31V16" stroke="#2f7d3a" stroke-width="2" fill="none"/><path d="M18 18C10 18 8 10 14 8c2 8 4 10 4 10Z" fill="#3caa4e"/><path d="M18 16c8-2 10-8 4-10-2 8-4 10-4 10Z" fill="#67c36a"/></svg><b>午后</b></div>',
      tile: '<div class="tile"><svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#2f6bff"/><path d="M11 20a7 7 0 0 1 12-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M23 11v5h-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>',
      house: '<div class="tile"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 16 17 7l11 9v11H6Z" fill="#2f9d4a"/><rect x="14" y="19" width="6" height="8" fill="#f7f6f3"/></svg></div>',
      flex: '<div class="pad"><b style="color:#2f6bff">弹性</b></div>',
      pin: '<div class="pin"><svg width="30" height="36" viewBox="0 0 30 36" aria-hidden="true"><path d="M15 2C8 2 3 8 3 15c0 9 12 19 12 19S27 24 27 15C27 8 22 2 15 2Z" fill="#3aa0ff"/><circle cx="15" cy="15" r="4" fill="#fff"/></svg></div>',
      meal: '<div class="pad" style="border-radius:999px"><b>团建</b></div>',
      heart: '<div class="heart"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><path d="M15 25S2 17 2 9a7 7 0 0 1 13-3 7 7 0 0 1 13 3c0 8-13 16-13 16Z" fill="#ff4d4d"/></svg></div>',
      chats: '<div class="pad"><svg width="64" height="32" viewBox="0 0 64 32" aria-hidden="true"><rect x="1" y="4" width="30" height="20" rx="8" fill="#e8f0ff" stroke="#2f6bff"/><circle cx="11" cy="14" r="1.4" fill="#2f6bff"/><circle cx="17" cy="14" r="1.4" fill="#2f6bff"/><rect x="28" y="8" width="34" height="20" rx="8" fill="#fff" stroke="#1c1916"/><path d="M36 16h12M36 21h8" stroke="#1c1916" stroke-width="1.4" stroke-linecap="round"/></svg></div>',
      flag: '<div class="flag"><svg width="28" height="34" viewBox="0 0 28 34" aria-hidden="true"><path d="M6 3v28" stroke="#1c1916" stroke-width="2"/><path d="M8 5h14l-3 6 3 6H8Z" fill="#2f6bff"/></svg></div>',
      tea: '<div class="stamp">茶歇</div>',
      bubble: '<div class="bubble"><svg width="40" height="36" viewBox="0 0 40 36" aria-hidden="true"><path d="M8 2h20a8 8 0 0 1 8 8v8a8 8 0 0 1-8 8H16l-8 8v-8a8 8 0 0 1-8-8v-8a8 8 0 0 1 8-8Z" fill="#fff"/><path d="M20 22s-7-4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5-7 9-7 9Z" fill="#ff4d4d"/></svg></div>',
      hello: '<div class="person"><svg width="72" height="64" viewBox="0 0 72 64" aria-hidden="true"><path d="M16 22h40l-4 8H20Z" fill="#2f6bff"/><circle cx="36" cy="28" r="12" fill="#f3d2b0"/><path d="M18 62c2-14 10-18 18-18s16 4 18 18" fill="#1c1916"/><circle cx="31" cy="27" r="1.4" fill="#1c1916"/><circle cx="41" cy="27" r="1.4" fill="#1c1916"/></svg><b>欢迎</b></div>'
    };

    const nodes = items.map((item) => {
      const el = document.createElement("div");
      el.className = "sticker";
      el.innerHTML = markup[item.kind];
      layer.appendChild(el);
      return { ...item, el };
    });

    let raf = 0;
    let arm = 0;
    let state = "closed";

    function stopRaf() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }
    function clearArm() {
      if (arm) clearTimeout(arm);
      arm = 0;
    }
    function fit() {
      const s = Math.min(stage.clientWidth / W, stage.clientHeight / H);
      scene.style.transform = "translate(-50%, -50%) scale(" + (s || 0.45) + ")";
    }
    function setLip(t) {
      const e = t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
      lip.style.transform = "perspective(520px) rotateY(" + (-28 * e) + "deg)";
    }
    function sample(t) {
      if (t <= 0) return { p: 0, scale: 0.4, fade: 0, kick: 0 };
      if (t >= 1) return { p: 1, scale: 1, fade: 1, kick: 0 };
      if (t < 0.8) {
        const u = t / 0.8;
        const p = 1 - Math.pow(1 - u, 3);
        return { p: p, scale: 0.4 + 0.6 * p, fade: Math.min(1, p / 0.18), kick: 0 };
      }
      const u = (t - 0.8) / 0.2;
      const wave = Math.sin(u * Math.PI) * (1 - u);
      return { p: 1 + wave * 0.05, scale: 1 + wave * 0.08, fade: 1, kick: wave };
    }
    function quad(a, b, c, t) {
      const u = 1 - t;
      return u * u * a + 2 * u * t * b + t * t * c;
    }
    function draw(item, local) {
      const m = sample(local);
      const x = quad(item.sx, item.cx, item.ex, m.p);
      const y = quad(item.sy, item.cy, item.ey, m.p);
      const rot = item.sr + (item.er - item.sr) * Math.min(m.p, 1) + m.kick * item.spin;
      item.el.style.transform = "translate(" + x + "px," + y + "px) translate(-50%,-50%) rotate(" + rot + "deg) scale(" + m.scale + ")";
      item.el.style.opacity = String(m.fade);
    }
    function paint(localForAll) {
      nodes.forEach((item) => draw(item, localForAll));
    }
    function say(visible, spoken) {
      hint.textContent = visible;
      status.textContent = spoken || visible;
    }
    function showEnd() {
      clearArm();
      stopRaf();
      peek.hidden = true;
      setLip(1);
      paint(1);
      state = "open";
      openBtn.setAttribute("aria-label", "招聘信封已贴好");
      again.disabled = true;
      say("已贴好", "已贴好。减少动态效果时不再播放飞出。");
    }
    function resetClosed() {
      stopRaf();
      peek.hidden = false;
      setLip(0);
      paint(0);
      state = "closed";
      openBtn.setAttribute("aria-label", "打开招聘信封");
      again.disabled = true;
      say("点信封，或按 Enter");
    }
    function play() {
      if (reduce.matches) {
        showEnd();
        return;
      }
      clearArm();
      stopRaf();
      peek.hidden = true;
      state = "playing";
      again.disabled = true;
      openBtn.setAttribute("aria-label", "贴纸正在飞出");
      say("正在飞出", "袋口打开，贴纸分批飞出");
      const t0 = performance.now();
      const step = (now) => {
        const t = (now - t0) / 1000;
        setLip(Math.min(1, t / 0.42));
        let pending = t < 0.42;
        nodes.forEach((item) => {
          const local = (t - item.delay) / item.dur;
          if (local < 1) pending = true;
          draw(item, local);
        });
        if (pending) {
          raf = requestAnimationFrame(step);
          return;
        }
        raf = 0;
        state = "open";
        openBtn.setAttribute("aria-label", "再开一次");
        again.disabled = false;
        say("可以再开一次", "贴纸已贴上。可以再开一次");
      };
      raf = requestAnimationFrame(step);
    }
    function trigger() {
      if (reduce.matches) {
        showEnd();
        return;
      }
      if (state === "playing") return;
      if (state === "open") resetClosed();
      play();
    }

    fit();
    addEventListener("resize", fit);
    stage.addEventListener("click", trigger);
    again.addEventListener("click", (event) => {
      event.stopPropagation();
      trigger();
    });
    addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const key = event.key;
      if (key !== "Enter" && key !== " " && key !== "r" && key !== "R") return;
      event.preventDefault();
      trigger();
    });
    reduce.addEventListener("change", () => {
      if (reduce.matches) showEnd();
    });

    if (reduce.matches) showEnd();
    else {
      resetClosed();
      arm = setTimeout(play, 800);
    }
  </script>
</body>
</html>
