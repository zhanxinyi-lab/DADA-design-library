<!doctype html><html><head><meta name=viewport content=width=device-width,initial-scale=1><meta charset="utf-8"><title>Glass Reveal</title><style>body{margin:0;display:grid;place-items:center;height:100vh;background:#090b10;color:#fff;font:800 12vw/1 Arial}svg{position:absolute;width:70vw;height:30vh}.mark{position:relative;z-index:2;letter-spacing:-.06em}</style></head><body><svg viewBox="0 0 1000 300"><path id="p" d="M80 230 C180 40 320 40 420 230 S680 420 920 70" fill="none" stroke="#9be7ff" stroke-width="8"/></svg><div class="mark" id="m"></div><script>const BRAND={name:"DADA",speed:3};document.getElementById("m").textContent=BRAND.name;const path=document.getElementById("p"),len=path.getTotalLength();path.style.strokeDasharray=len;function draw(t){path.style.strokeDashoffset=len-(t/1000*BRAND.speed%1)*len;requestAnimationFrame(draw)}draw(0);</script></body></html>
