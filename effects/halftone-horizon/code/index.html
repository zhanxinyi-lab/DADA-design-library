<!DOCTYPE html>
<html lang="zh-CN">
<!-- AI 复刻：半色调地平线。clean-room，不是原组件或着色器。 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半色调地平线</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #100201; color: #fff4ec; overflow: hidden; }
  body { font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: system-ui, sans-serif; }
  #fallback.show { display: flex; }
  h1 {
    position: fixed; z-index: 2; left: 0; right: 0; top: 16%;
    text-align: center; font-weight: 500; pointer-events: none;
    font-size: clamp(28px, 5.4vw, 68px); letter-spacing: 0.14em;
    color: rgba(255, 236, 226, 0.9);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
  }
  .note {
    position: fixed; z-index: 2; right: 16px; bottom: 14px; pointer-events: none;
    font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 0.16em;
    color: rgba(90, 42, 28, 0.55);
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="全屏半色调地平线，指针会照亮附近网点，点击发出涟漪"></canvas>
<p id="fallback">这个浏览器没有可用的 WebGL，画面开不了。</p>
<h1>Halftone Horizon</h1>
<p class="note">CLEAN-ROOM</p>
<script>
'use strict';
(function () {
  var canvas = document.getElementById('gl');
  var fallback = document.getElementById('fallback');
  var gl = canvas.getContext('webgl', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: false
  });
  if (!gl) {
    fallback.className = 'show';
    return;
  }

  var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}';
  var FS = [
    'precision highp float;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform float uPitch;',
    'uniform float uReduce;',
    'uniform vec2 uPointer;',
    'uniform float uPointerOn;',
    'uniform vec3 uR0,uR1,uR2,uR3;',
    'uniform sampler2D uTrail;',
    'vec3 ramp(float t){',
    '  vec3 c0=vec3(0.275,0.016,0.008);',
    '  vec3 c1=vec3(0.549,0.063,0.024);',
    '  vec3 c2=vec3(0.824,0.188,0.063);',
    '  vec3 c3=vec3(0.961,0.392,0.188);',
    '  vec3 c4=vec3(0.988,0.588,0.392);',
    '  vec3 c5=vec3(0.992,0.784,0.659);',
    '  vec3 c6=vec3(0.992,0.910,0.847);',
    '  vec3 c7=vec3(0.992,0.976,0.957);',
    '  if(t<0.15) return mix(c0,c1,t/0.15);',
    '  if(t<0.30) return mix(c1,c2,(t-0.15)/0.15);',
    '  if(t<0.45) return mix(c2,c3,(t-0.30)/0.15);',
    '  if(t<0.58) return mix(c3,c4,(t-0.45)/0.13);',
    '  if(t<0.70) return mix(c4,c5,(t-0.58)/0.12);',
    '  if(t<0.82) return mix(c5,c6,(t-0.70)/0.12);',
    '  return mix(c6,c7,clamp((t-0.82)/0.18,0.0,1.0));',
    '}',
    'float ring(vec3 rip, vec2 frag, float time){',
    '  if(rip.z<0.0) return 0.0;',
    '  float age=time-rip.z;',
    '  if(age<0.0||age>2.6) return 0.0;',
    '  float d=length((frag-rip.xy)/min(uRes.x,uRes.y));',
    '  float band=d-age*0.42;',
    '  return exp(-band*band*780.0)*exp(-age*0.85);',
    '}',
    'void main(){',
    '  vec2 frag=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);',
    '  vec2 uv=frag/uRes;',
    '  float edge=(uv.x-0.5)*(uv.x-0.5)*4.0;',
    '  float motion=uReduce>0.5?0.0:uTime;',
    '  float wave=0.030*sin(motion*0.47+uv.x*5.2)+0.016*sin(motion*0.71-uv.x*2.4+1.7);',
    '  float breath=0.026*sin(motion*0.23);',
    '  float t=clamp((uv.y-0.06+edge*0.16+wave+breath)*1.15,0.0,1.0);',
    '  float light=0.0;',
    '  if(uPointerOn>0.5){',
    '    vec2 q=(frag-uPointer)/min(uRes.x,uRes.y);',
    '    light+=exp(-dot(q,q)*18.0)*0.28;',
    '  }',
    '  light+=texture2D(uTrail,vec2(uv.x,1.0-uv.y)).r*0.20;',
    '  light+=ring(uR0,frag,uTime)*0.36;',
    '  light+=ring(uR1,frag,uTime)*0.36;',
    '  light+=ring(uR2,frag,uTime)*0.36;',
    '  light+=ring(uR3,frag,uTime)*0.36;',
    '  float field=clamp(t+light,0.0,1.0);',
    '  float cover=clamp(field/0.72,0.0,1.0);',
    '  cover=cover*cover*(3.0-2.0*cover);',
    '  float rad=uPitch*(0.07+0.78*cover);',
    '  vec2 cell=mod(frag,uPitch)-0.5*uPitch;',
    '  float dist=length(cell);',
    '  float x=clamp((rad-dist)/0.85+0.5,0.0,1.0);',
    '  float ink=x*x*(3.0-2.0*x);',
    '  float fill=clamp((t-0.30)/0.14,0.0,1.0);',
    '  fill=fill*fill*(3.0-2.0*fill);',
    '  ink=max(ink,fill);',
    '  gl_FragColor=vec4(ramp(field)*ink,1.0);',
    '}'
  ].join('\n');

  function makeShader(type, src) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return null;
    return shader;
  }

  var vs = makeShader(gl.VERTEX_SHADER, VS);
  var fs = makeShader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) {
    fallback.className = 'show';
    return;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    fallback.className = 'show';
    return;
  }
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  function uni(name) { return gl.getUniformLocation(prog, name); }
  var uRes = uni('uRes');
  var uTime = uni('uTime');
  var uPitch = uni('uPitch');
  var uReduce = uni('uReduce');
  var uPointer = uni('uPointer');
  var uPointerOn = uni('uPointerOn');
  var uR = [uni('uR0'), uni('uR1'), uni('uR2'), uni('uR3')];
  var uTrail = uni('uTrail');

  var TW = 180;
  var TH = 140;
  var trail = new Float32Array(TW * TH);
  var trailBytes = new Uint8Array(TW * TH);
  var trailTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, trailTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TW, TH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, trailBytes);
  gl.uniform1i(uTrail, 0);

  var pointer = [0, 0];
  var pointerOn = 0;
  var lastStamp = null;
  var ripples = [];
  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var start = performance.now();
  var pitch = 12;

  function nowSec() { return (performance.now() - start) / 1000; }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    pitch = 12.5 * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function stamp(u, v, amount) {
    var cx = u * (TW - 1);
    var cy = v * (TH - 1);
    var rad = 7;
    var x0 = Math.max(0, Math.floor(cx - rad));
    var x1 = Math.min(TW - 1, Math.ceil(cx + rad));
    var y0 = Math.max(0, Math.floor(cy - rad));
    var y1 = Math.min(TH - 1, Math.ceil(cy + rad));
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var dx = x - cx;
        var dy = y - cy;
        var add = amount * Math.exp(-(dx * dx + dy * dy) / 10);
        var i = y * TW + x;
        trail[i] = trail[i] < add ? add : trail[i];
      }
    }
  }

  function paintPointer(u, v) {
    if (!lastStamp) {
      stamp(u, v, 1);
    } else {
      var dist = Math.hypot(u - lastStamp[0], v - lastStamp[1]);
      var steps = Math.max(1, Math.ceil(dist * TW));
      for (var s = 1; s <= steps; s++) {
        var k = s / steps;
        stamp(lastStamp[0] + (u - lastStamp[0]) * k, lastStamp[1] + (v - lastStamp[1]) * k, 1);
      }
    }
    lastStamp = [u, v];
  }

  function decayTrail() {
    for (var i = 0; i < trail.length; i++) trail[i] *= 0.975;
  }

  function uploadTrail() {
    for (var i = 0; i < trail.length; i++) {
      var v = trail[i];
      if (v < 0) v = 0;
      else if (v > 1) v = 1;
      trailBytes[i] = v * 255;
    }
    gl.bindTexture(gl.TEXTURE_2D, trailTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TW, TH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, trailBytes);
  }

  function localPoint(e) {
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / Math.max(1, rect.width);
    var y = (e.clientY - rect.top) / Math.max(1, rect.height);
    pointer[0] = x * canvas.width;
    pointer[1] = y * canvas.height;
    return [x, y];
  }

  canvas.addEventListener('pointermove', function (e) {
    var uv = localPoint(e);
    pointerOn = 1;
    paintPointer(uv[0], uv[1]);
  });
  canvas.addEventListener('pointerdown', function (e) {
    var uv = localPoint(e);
    pointerOn = 1;
    paintPointer(uv[0], uv[1]);
    ripples.push({ x: pointer[0], y: pointer[1], t: nowSec() });
    if (ripples.length > 4) ripples.shift();
  });
  canvas.addEventListener('pointerleave', function () {
    pointerOn = 0;
    lastStamp = null;
  });
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    resize();
    decayTrail();
    uploadTrail();
    var time = nowSec();
    var live = [];
    for (var i = 0; i < ripples.length; i++) {
      if (time - ripples[i].t < 2.7) live.push(ripples[i]);
    }
    ripples = live;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, time);
    gl.uniform1f(uPitch, pitch);
    gl.uniform1f(uReduce, reduceQuery.matches ? 1 : 0);
    gl.uniform2f(uPointer, pointer[0], pointer[1]);
    gl.uniform1f(uPointerOn, pointerOn);
    for (var r = 0; r < 4; r++) {
      var rip = ripples[r];
      if (rip) gl.uniform3f(uR[r], rip.x, rip.y, rip.t);
      else gl.uniform3f(uR[r], 0, 0, -1);
    }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
