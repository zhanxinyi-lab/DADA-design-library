<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能相框 OS · Ambient UI</title>
<!-- AI 复刻：@TallTidjane 为 Amazon Alexa 相框设计的 OS UX。实体相框 mockup + 环境模式（Ken Burns 轮播 + 时钟/天气）+ 点击唤出控制层。程序化渐变"照片"，无外部图片 -->
<style>*{margin:0;box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(#d9cfc2,#b9a994);font-family:-apple-system,"SF Pro Display","PingFang SC",system-ui,sans-serif}
.shelf{position:relative;width:min(760px,94vw)}
.frame{width:100%;aspect-ratio:16/10;padding:3.2%;background:linear-gradient(135deg,#c79a6a,#8d6239);border-radius:6px;box-shadow:0 30px 40px -20px #3b2a18aa,inset 0 0 0 2px #ffffff22;transform:perspective(1400px) rotateY(-6deg)}
.mat{width:100%;height:100%;background:#f4f1ec;padding:3%;box-shadow:inset 0 2px 6px #0004}
.scr{position:relative;width:100%;height:100%;overflow:hidden;background:#000;cursor:pointer}
.ph{position:absolute;inset:-6%;opacity:0;transition:opacity 1.6s;animation:kb 12s linear infinite}
.ph.on{opacity:1}@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1%)}}
.clock{position:absolute;left:5%;bottom:7%;color:#fff;text-shadow:0 2px 12px #0006}
.clock b{font-size:clamp(28px,6vw,54px);font-weight:300;letter-spacing:-.02em}.clock div{font-size:clamp(10px,1.5vw,14px);opacity:.9}
.cap{position:absolute;right:5%;bottom:7%;color:#fff;font-size:12px;opacity:.85;text-align:right}
.ui{position:absolute;inset:0;background:linear-gradient(#0000,#000a);opacity:0;transition:.4s;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-bottom:6%}
.scr.ctl .ui{opacity:1}.scr.ctl .clock{opacity:0}
.ui button{all:unset;width:46px;height:46px;border-radius:50%;background:#ffffff26;backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;font-size:18px;cursor:pointer}
.ui button:hover{background:#ffffff44}.ui .alexa{width:58px;height:58px;background:radial-gradient(#3dd8ff,#0a7bd6)}
.ring{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#0ff0,#36c6ff,#0ff0);opacity:0}.scr.listen .ring{opacity:1;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.4}}
.wood{height:26px;margin-top:-6px;background:linear-gradient(#a57a4f,#7a5532);border-radius:3px;box-shadow:0 20px 30px -10px #0005}
</style></head><body><div class="shelf"><div class="frame"><div class="mat"><div class="scr" id="s">
<div class="ph on" style="background:radial-gradient(60% 50% at 30% 70%,#f2c27b,#0000),linear-gradient(160deg,#7ab3d6,#e9a76b 70%,#5c3a2a)"></div>
<div class="ph" style="background:radial-gradient(40% 40% at 70% 40%,#fff3,#0000),linear-gradient(200deg,#2e5e4e,#a9c67a 60%,#e8e2b0)"></div>
<div class="ph" style="background:radial-gradient(50% 40% at 50% 30%,#ffd9e0,#0000),linear-gradient(180deg,#f48fb1,#6a5acd 70%,#1e1b3a)"></div>
<div class="clock"><b id="t">9:41</b><div id="d">Thursday · 18° Sunny</div></div><div class="cap" id="cap">Lisbon · 2024</div>
<div class="ui"><button>⏮</button><button class="alexa" id="ax">◯</button><button>⏭</button><button>♡</button></div><div class="ring"></div>
</div></div></div><div class="wood"></div></div>
<script>
const ph=[...document.querySelectorAll('.ph')],caps=['Lisbon · 2024','Kyoto garden · 2023','Mom’s birthday · 2025'];let i=0;
const next=()=>{ph[i].classList.remove('on');i=(i+1)%ph.length;ph[i].classList.add('on');cap.textContent=caps[i]};setInterval(next,5000);
const tk=()=>{const d=new Date();t.textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/,'');document.getElementById('d').textContent=d.toLocaleDateString('en',{weekday:'long'})+' · 18° Sunny'};tk();setInterval(tk,1000);
let to;s.onclick=e=>{if(e.target.id=='ax'){s.classList.add('listen');setTimeout(()=>s.classList.remove('listen'),2500);return}
 if(e.target.textContent=='⏭'){next();return}s.classList.add('ctl');clearTimeout(to);to=setTimeout(()=>s.classList.remove('ctl'),4000)};
</script></body></html>
