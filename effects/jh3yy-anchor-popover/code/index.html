<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>锚点变形 Popover</title>
  <style>
    :root {
      --bg: #070707;
      --ink: #f4f1ec;
      --muted: #9a958e;
      --card: #12110f;
      --line: rgba(244, 241, 236, 0.14);
      --menu-w: min(36rem, calc(100vw - 1.25rem));
      --menu-h: min(17.5rem, calc(100dvh - 4.5rem));
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }
    .stage {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 1.25rem 1.5rem 1.5rem;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .mark {
      width: 1.75rem;
      height: 1.75rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      flex: none;
    }
    .links {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-width: 0;
    }
    .nav button,
    .dock button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 600 0.78rem/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.14em;
      padding: 0.7rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .nav button:focus-visible,
    .dock button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
    .nav button:hover,
    .dock button:hover,
    .nav button.active,
    .dock button.active { background: rgba(244, 241, 236, 0.08); }
    .hero {
      display: grid;
      align-content: end;
      padding-bottom: 8vh;
      max-width: 18ch;
    }
    .hero p {
      margin: 0 0 0.8rem;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .hero h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(3.2rem, 9vw, 7.5rem);
      letter-spacing: -0.06em;
      line-height: 0.86;
    }
    .dock {
      display: flex;
      justify-content: space-between;
    }
    .menu {
      --anchor: --a1;
      position: fixed;
      inset: auto;
      width: var(--menu-w);
      height: var(--menu-h);
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
      position-anchor: var(--anchor);
      container-type: anchored;
      /* 基础位置故意放到视口外，让命名 fallback 成为生效项。 */
      position-area: center;
      margin-top: 100vh;
      position-try-fallbacks: --top-left, --top-right, --bottom-left, --bottom-right;
    }
    @position-try --top-left {
      position-area: bottom span-right;
      margin: 0.6rem 0 0;
    }
    @position-try --top-right {
      position-area: bottom span-left;
      margin: 0.6rem 0 0;
    }
    @position-try --bottom-left {
      position-area: top span-right;
      margin: 0 0 0.6rem;
    }
    @position-try --bottom-right {
      position-area: top span-left;
      margin: 0 0 0.6rem;
    }
    .menu { display: grid; }
    .card {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      background: var(--card);
      color: var(--ink);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      transform-origin: top left;
      scale: 0;
      opacity: 0;
      transition: scale 0.48s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease;
    }
    .menu {
      transition: display 0.48s allow-discrete, overlay 0.48s allow-discrete;
    }
    .menu:popover-open .card { scale: 1; opacity: 1; }
    @starting-style {
      .menu:popover-open .card { scale: 0; opacity: 0; }
    }
    .origin::before { content: "--top-left"; }
    @container anchored(fallback: --top-left) {
      .card { transform-origin: top left; }
      .origin::before { content: "--top-left"; }
    }
    @container anchored(fallback: --top-right) {
      .card { transform-origin: top right; }
      .origin::before { content: "--top-right"; }
    }
    @container anchored(fallback: --bottom-left) {
      .card { transform-origin: bottom left; }
      .origin::before { content: "--bottom-left"; }
    }
    @container anchored(fallback: --bottom-right) {
      .card { transform-origin: bottom right; }
      .origin::before { content: "--bottom-right"; }
    }
    .copy {
      padding: 1.15rem 1.2rem 1rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .origin {
      margin: 0 0 0.9rem;
      color: var(--muted);
      font: 500 0.68rem/1 ui-monospace, "Cascadia Code", monospace;
      letter-spacing: 0.04em;
    }
    .copy button {
      appearance: none;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      padding: 0.85rem 0;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      color: inherit;
      font: 500 1.05rem/1.2 "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .copy button span { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.08em; }
    .swatch {
      background:
        radial-gradient(120% 80% at 20% 10%, #efe7dc 0%, transparent 46%),
        linear-gradient(160deg, #8d8478 0%, #2a2724 48%, #0e0d0c 100%);
    }
    html[data-manual-anchor] .menu {
      position: fixed;
      margin: 0;
      top: var(--top, 4.5rem);
      left: var(--left, 1rem);
      right: auto;
      bottom: auto;
    }
    @media (max-width: 640px) {
      .stage { padding: 0.8rem; }
      .hero h1 { font-size: 3.4rem; }
      .card { grid-template-columns: 1fr 0.7fr; }
      .copy button { font-size: 0.95rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .menu { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="nav">
      <div class="mark" aria-hidden="true"></div>
      <div class="links">
        <button type="button" popovertarget="m1" style="anchor-name:--a1">01</button>
        <button type="button" popovertarget="m2" style="anchor-name:--a2">02</button>
        <button type="button" popovertarget="m3" style="anchor-name:--a3">03</button>
        <button type="button" popovertarget="m4" style="anchor-name:--a4">04</button>
      </div>
    </header>
    <section class="hero">
      <p>Popover</p>
      <h1>从锚点长出来</h1>
    </section>
    <div class="dock">
      <button type="button" popovertarget="m5" style="anchor-name:--a5" data-corner="bottom-left">左下</button>
      <button type="button" popovertarget="m6" style="anchor-name:--a6" data-corner="bottom-right">右下</button>
    </div>
  </div>

  <div class="menu" id="m1" popover="auto" style="--anchor:--a1"><div class="card"><div class="copy"><p class="origin"></p><button type="button">外观<span>01</span></button><button type="button">结构<span>02</span></button><button type="button">位置<span>03</span></button></div><div class="swatch"></div></div></div>
  <div class="menu" id="m2" popover="auto" style="--anchor:--a2"><div class="card"><div class="copy"><p class="origin"></p><button type="button">外观<span>01</span></button><button type="button">结构<span>02</span></button><button type="button">位置<span>03</span></button></div><div class="swatch"></div></div></div>
  <div class="menu" id="m3" popover="auto" style="--anchor:--a3"><div class="card"><div class="copy"><p class="origin"></p><button type="button">外观<span>01</span></button><button type="button">结构<span>02</span></button><button type="button">位置<span>03</span></button></div><div class="swatch"></div></div></div>
  <div class="menu" id="m4" popover="auto" style="--anchor:--a4"><div class="card"><div class="copy"><p class="origin"></p><button type="button">外观<span>01</span></button><button type="button">结构<span>02</span></button><button type="button">位置<span>03</span></button></div><div class="swatch"></div></div></div>
  <div class="menu" id="m5" popover="auto" style="--anchor:--a5"><div class="card"><div class="copy"><p class="origin"></p><button type="button">外观<span>01</span></button><button type="button">结构<span>02</span></button><button type="button">位置<span>03</span></button></div><div class="swatch"></div></div></div>
  <div class="menu" id="m6" popover="auto" style="--anchor:--a6"><div class="card"><div class="copy"><p class="origin"></p><button type="button">外观<span>01</span></button><button type="button">结构<span>02</span></button><button type="button">位置<span>03</span></button></div><div class="swatch"></div></div></div>

  <script>
    const menus = [...document.querySelectorAll(".menu")];
    const buttons = [...document.querySelectorAll("[popovertarget]")];
    const manual = !CSS.supports("container-type", "anchored");
    if (manual) document.documentElement.dataset.manualAnchor = "1";

    function placeManual(menu) {
      const id = menu.id;
      const button = buttons.find((b) => b.getAttribute("popovertarget") === id);
      if (!button) return;
      const r = button.getBoundingClientRect();
      const w = menu.offsetWidth || Math.min(576, innerWidth - 20);
      const h = menu.offsetHeight || Math.min(280, innerHeight - 72);
      const below = r.bottom + 10 + h <= innerHeight - 8;
      const rightRoom = r.left + w <= innerWidth - 8;
      const origin = (below ? "top" : "bottom") + "-" + (rightRoom ? "left" : "right");
      const top = below ? r.bottom + 10 : Math.max(8, r.top - 10 - h);
      const left = rightRoom ? r.left : Math.max(8, r.right - w);
      menu.style.setProperty("--top", top + "px");
      menu.style.setProperty("--left", left + "px");
      menu.querySelector(".card").style.transformOrigin = origin.replace("-", " ");
      const label = menu.querySelector(".origin");
      if (label) label.textContent = "--" + origin;
    }

    if (manual) {
      for (const menu of menus) {
        menu.addEventListener("toggle", () => {
          if (menu.matches(":popover-open")) placeManual(menu);
        });
      }
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stopped = false;
    let step = 0;
    function tour() {
      if (stopped) return;
      menus.forEach((menu, index) => {
        const open = menu.matches(":popover-open");
        if (index === step && !open) menu.showPopover();
        if (index !== step && open) menu.hidePopover();
      });
      buttons.forEach((button, index) => button.classList.toggle("active", index === step));
      step = (step + 1) % menus.length;
    }
    addEventListener("pointerdown", () => { stopped = true; }, { once: true });
    addEventListener("keydown", () => { stopped = true; }, { once: true });
    if (!reduce) {
      tour();
      setInterval(tour, 2200);
    }
  </script>
</body>
</html>
