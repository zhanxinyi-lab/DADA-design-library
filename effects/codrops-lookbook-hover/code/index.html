<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>悬停时装</title>
  <style>
    :root { --paper: #efeae3; --ink: #1b1916; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.4 Palatino, "Iowan Old Style", "Songti SC", "Noto Serif SC", serif;
    }
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 28px 22px 36px;
    }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .kicker { letter-spacing: 0.18em; font-size: 12px; }
    .hint { font-size: 13px; opacity: 0.72; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      padding: 0;
      border: 0;
      overflow: hidden;
      background: #d9d2c8;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .art { position: absolute; inset: -18px; }
    .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .shape { position: absolute; display: block; font-style: normal; }
    .a0 { background: #e7d7c4; }
    .a0 .shape-a { width: 54%; height: 70%; left: 22%; top: 16%; background: #f7f1e8; border-radius: 80px 80px 16px 16px; }
    .a0 .shape-b { width: 10%; height: 100%; left: 58%; top: 0; background: #8d3b2d; }
    .a1 { background: #d5e4df; }
    .a1 .shape-a { width: 46%; height: 62%; left: 27%; top: 20%; background: rgba(255, 255, 255, 0.72); border-radius: 40% 40% 18px 18px; }
    .a1 .shape-b { width: 70%; height: 8%; left: 15%; top: 58%; background: #9fd0c4; transform: rotate(-8deg); }
    .a2 { background: #cfc8c2; }
    .a2 .shape-a { width: 18%; height: 78%; right: 18%; top: 12%; background: #6e1230; }
    .a2 .shape-b { width: 48%; height: 34%; left: 16%; top: 28%; background: #4a403c; }
    .a3 { background: #c5cbb8; }
    .a3 .shape-a { width: 62%; height: 46%; left: 18%; top: 28%; background: #6d7a52; }
    .a3 .shape-b { width: 100%; height: 7%; left: 0; top: 46%; background: rgba(27, 25, 22, 0.35); }
    .a4 { background: #ddd4ea; }
    .a4 .shape-a { width: 50%; height: 58%; left: 25%; top: 22%; background: #8d79b0; border-radius: 16px 16px 8px 8px; }
    .a4 .shape-b { width: 34%; height: 18%; right: 8%; bottom: 10%; background: #f4efe8; transform: rotate(-18deg); }
    .a5 { background: #f3efe6; }
    .a5 .shape-a { width: 58%; height: 64%; left: 20%; top: 18%; background: #e6c84a; }
    .a5 .shape-b { width: 22%; height: 100%; left: 48%; top: 0; background: #1b1916; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 640px) {
      .page { padding: 18px 14px 24px; gap: 14px; }
      .grid { gap: 7px; }
      header { align-items: flex-start; flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">LOOKBOOK</p>
      <p class="hint">指针停在格子上，卡片用不同方式盖住它</p>
    </header>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const looks = [
      { fx: "melt", index: "01", name: "融化", note: "边缘滴下来", ink: "#f4f7ff", card: "#1d4ed8", art: "a0", shapes: 2, label: "融化，蓝色沿人物轮廓滴开" },
      { fx: "glass", index: "02", name: "液态玻璃", note: "中间涌出来", ink: "#f4fffb", card: "#0f6e62", art: "a1", shapes: 2, label: "液态玻璃，半透明色块从中间胀开" },
      { fx: "curtain", index: "03", name: "侧帘", note: "从右缘推进", ink: "#fff6f8", card: "#6e1230", art: "a2", shapes: 2, label: "侧帘，色块从右缘推过来" },
      { fx: "static", index: "04", name: "换台", note: "雪花条扫过", ink: "#f6f3ea", card: "#3d4f32", art: "a3", shapes: 2, label: "换台，横条雪花扫成色块" },
      { fx: "peel", index: "05", name: "翻角", note: "从右下揭开", ink: "#f7f3ff", card: "#4c1d95", art: "a4", shapes: 2, label: "翻角，从右下角揭开" },
      { fx: "tear", index: "06", name: "揭皮", note: "纸边撕开", ink: "#1b1916", card: "#e6c84a", art: "a5", shapes: 2, label: "揭皮，锯齿纸边撕开" }
    ];

    const grid = document.getElementById("grid");
    const tiles = looks.map((look) => {
      const tile = document.createElement("button");
      tile.className = "tile";
      tile.type = "button";
      tile.setAttribute("aria-pressed", "false");
      const art = document.createElement("span");
      art.className = "art " + look.art;
      art.setAttribute("aria-hidden", "true");
      for (let s = 0; s < look.shapes; s++) {
        const shape = document.createElement("i");
        shape.className = "shape shape-" + (s === 0 ? "a" : "b");
        art.appendChild(shape);
      }
      const canvas = document.createElement("canvas");
      canvas.className = "fx";
      canvas.setAttribute("aria-hidden", "true");
      const sr = document.createElement("span");
      sr.className = "sr-only";
      sr.textContent = look.label;
      tile.append(art, canvas, sr);
      grid.appendChild(tile);
      return { tile, canvas, look };
    });

    const order = [0, 1, 2, 5, 4, 3];
    const motion = matchMedia("(prefers-reduced-motion: reduce)");
    const progress = tiles.map(() => 0);
    let reduced = motion.matches;
    let held = null;
    let autoOn = !reduced;
    let step = 0;
    let phase = "in";
    let phaseTime = 0;
    let last = performance.now();
    let frame = 0;
    let clock = 0;
    let noise;

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2; }
    function easeOut(t) { return 1 - (1 - t) ** 3; }
    function hash(n) {
      const x = Math.sin(n * 127.1) * 43758.5453;
      return x - Math.floor(x);
    }
    function noiseTile() {
      if (noise) return noise;
      noise = document.createElement("canvas");
      noise.width = 128;
      noise.height = 128;
      const g = noise.getContext("2d");
      const img = g.createImageData(128, 128);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = (hash(i * 0.17) * 255) | 0;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      return noise;
    }
    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }
    function cardText(ctx, w, h, look, alpha) {
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.fillStyle = look.ink;
      ctx.font = "600 12px Palatino, serif";
      ctx.fillText("LOOK", w * 0.08, h * 0.16);
      ctx.font = "500 " + Math.round(Math.min(w * 0.28, 64)) + "px Palatino, serif";
      ctx.fillText(look.index, w * 0.08, h * 0.46);
      ctx.font = "500 " + Math.round(Math.max(14, w * 0.075)) + "px Palatino, serif";
      ctx.fillText(look.name, w * 0.08, h * 0.82);
      ctx.globalAlpha *= 0.78;
      ctx.font = "12px Palatino, serif";
      ctx.fillText(look.note, w * 0.08, h * 0.9);
      ctx.restore();
    }
    function fillCard(ctx, w, h, look) {
      ctx.fillStyle = look.card;
      ctx.fillRect(0, 0, w, h);
      cardText(ctx, w, h, look, 1);
    }
    function drawMelt(ctx, w, h, t, look) {
      const p = easeInOut(t);
      const cx = w * 0.48;
      const cy = h * 0.4;
      const base = Math.hypot(w, h) * 0.62 * (0.12 + p);
      const dripAmp = Math.sin(Math.PI * t) * h * 0.32;
      ctx.save();
      ctx.beginPath();
      const steps = 42;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const down = Math.max(0, Math.sin(a));
        const drip = down * down * Math.max(0, Math.sin(a * 5.5 + 0.7)) ** 2 * dripAmp;
        const wobble = (hash(i * 2.3 + 4) - 0.5) * 20 * (1 - p);
        const rr = base + wobble;
        const x = cx + Math.cos(a) * rr;
        const y = cy + Math.sin(a) * rr + drip;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.clip();
      fillCard(ctx, w, h, look);
      ctx.restore();
    }
    function drawGlass(ctx, w, h, t, look) {
      const p = easeInOut(t);
      const grow = Math.min(p, 0.94) / 0.94;
      const rw = w * (0.22 + 0.9 * grow);
      const rh = h * (0.26 + 0.86 * grow);
      const x = (w - rw) / 2;
      const y = (h - rh) / 2;
      const rad = Math.min(rw, rh) * (0.48 * (1 - p) + 0.05);
      const shifts = [[-3.5, 0, "rgba(255,60,90,0.7)"], [3.5, 1, "rgba(70,220,255,0.65)"], [0, -2.5, "rgba(190,255,140,0.4)"]];
      ctx.save();
      ctx.globalAlpha = 1 - clamp((p - 0.94) / 0.06, 0, 1);
      for (const [dx, dy, color] of shifts) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2 + 5 * (1 - p);
        roundRect(ctx, x + dx, y + dy, rw, rh, rad);
        ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      roundRect(ctx, x, y, rw, rh, rad);
      ctx.clip();
      ctx.fillStyle = look.card;
      ctx.globalAlpha *= 0.4 + 0.55 * p;
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 0.32 * (1 - p * 0.5);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(x + rw * 0.36, y + rh * 0.3, rw * 0.22, rh * 0.07, -0.6, 0, Math.PI * 2);
      ctx.fill();
      cardText(ctx, w, h, look, clamp((p - 0.28) / 0.45, 0, 1));
      ctx.restore();
      ctx.restore();
      if (p > 0.94) {
        ctx.save();
        ctx.globalAlpha = (p - 0.94) / 0.06;
        fillCard(ctx, w, h, look);
        ctx.restore();
      }
    }
    function drawCurtain(ctx, w, h, t, look) {
      const p = easeInOut(t);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(w, 0);
      const steps = 18;
      for (let i = 0; i <= steps; i++) {
        const y = (i / steps) * h;
        const bow = Math.sin((i / steps) * Math.PI) * w * 0.04 * Math.sin(Math.PI * p);
        ctx.lineTo(w * (1 - p) - bow, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.clip();
      fillCard(ctx, w, h, look);
      ctx.restore();
    }
    function tearX(i, steps, w, p) {
      const jag = (hash(i * 9.2 + 1) - 0.5) * w * 0.18;
      const lobe = Math.sin(i * 0.72) * w * 0.07;
      return p * w * 1.42 - w * 0.1 + jag + lobe;
    }
    function drawTear(ctx, w, h, t, look) {
      const p = easeInOut(t);
      const steps = 34;
      ctx.save();
      ctx.strokeStyle = "rgba(255,252,245,0.92)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const x = tearX(i, steps, w, p);
        const y = (i / steps) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-20, -20);
      for (let i = 0; i <= steps; i++) ctx.lineTo(tearX(i, steps, w, p), (i / steps) * h);
      ctx.lineTo(-20, h + 20);
      ctx.closePath();
      ctx.clip();
      fillCard(ctx, w, h, look);
      ctx.restore();
    }
    function drawPeel(ctx, w, h, t, look) {
      const p = easeInOut(t);
      const reach = 0.02 + p * 2.2;
      const x = w - reach * w;
      const y = h - reach * h;
      if (p < 0.98) {
        const dx = x - w;
        const dy = h - y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const fold = Math.min(w, h) * 0.18;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(w, y);
        ctx.lineTo(x, h);
        ctx.lineTo(x + nx * fold, h + ny * fold);
        ctx.lineTo(w + nx * fold, y + ny * fold);
        ctx.closePath();
        ctx.fillStyle = "rgba(244,240,248,0.94)";
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(w, y);
        ctx.lineTo(x, h);
        ctx.lineWidth = 7;
        ctx.strokeStyle = "rgba(24,16,32,0.28)";
        ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(w + 2, h + 2);
      ctx.lineTo(w + 2, y);
      ctx.lineTo(x, h + 2);
      ctx.closePath();
      ctx.clip();
      fillCard(ctx, w, h, look);
      ctx.restore();
    }
    function drawStatic(ctx, w, h, t, look) {
      const p = easeInOut(t);
      const bands = [0.2, 0.46, 0.72];
      const grain = noiseTile();
      const tick = Math.floor(clock / 40);
      for (let b = 0; b < bands.length; b++) {
        const cy = bands[b] * h + (hash(tick + b * 5) - 0.5) * 6;
        const half = p * h * 0.3;
        if (half < 1) continue;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, cy - half, w, half * 2);
        ctx.clip();
        const ox = (tick * 19 + b * 30) % 128;
        ctx.drawImage(grain, -ox, cy - half - (tick % 64), w + 128, half * 2 + 128);
        ctx.fillStyle = look.card;
        ctx.globalAlpha = 0.62;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }
      ctx.save();
      ctx.globalAlpha = clamp((p - 0.42) / 0.58, 0, 1);
      fillCard(ctx, w, h, look);
      ctx.restore();
    }
    const drawers = { melt: drawMelt, glass: drawGlass, curtain: drawCurtain, tear: drawTear, peel: drawPeel, static: drawStatic };

    function surface(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) return null;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      return { ctx, w: rect.width, h: rect.height };
    }
    function paint() {
      for (let i = 0; i < tiles.length; i++) {
        const amount = reduced ? (held === i ? 1 : 0) : progress[i];
        const view = surface(tiles[i].canvas);
        if (!view || view.w < 2 || view.h < 2) continue;
        const { ctx, w, h } = view;
        if (amount > 0.004) drawers[tiles[i].look.fx](ctx, w, h, clamp(amount, 0, 1), tiles[i].look);
        const open = amount > 0.5;
        if (tiles[i].tile.getAttribute("aria-pressed") !== String(open)) tiles[i].tile.setAttribute("aria-pressed", String(open));
      }
    }
    function ensureLoop() {
      if (frame || reduced) return;
      last = performance.now();
      frame = requestAnimationFrame(tick);
    }
    function tick(now) {
      frame = requestAnimationFrame(tick);
      const dt = Math.min(48, now - last);
      last = now;
      clock += dt;
      if (reduced) {
        cancelAnimationFrame(frame);
        frame = 0;
        return;
      }
      if (autoOn && held == null && document.visibilityState !== "hidden") {
        phaseTime += dt;
        const i = order[step];
        const dur = phase === "in" ? 880 : phase === "hold" ? 620 : phase === "out" ? 520 : 200;
        const t = clamp(phaseTime / dur, 0, 1);
        if (phase === "in") progress[i] = t;
        else if (phase === "hold") progress[i] = 1;
        else if (phase === "out") progress[i] = 1 - t;
        else progress[i] = 0;
        if (t === 1) {
          phaseTime = 0;
          if (phase === "in") phase = "hold";
          else if (phase === "hold") phase = "out";
          else if (phase === "out") { progress[i] = 0; phase = "gap"; }
          else { phase = "in"; step = (step + 1) % order.length; }
        }
      }
      for (let i = 0; i < tiles.length; i++) {
        if (!autoOn || held != null || order[step] !== i || phase === "gap") {
          const target = held === i ? 1 : 0;
          progress[i] += (target - progress[i]) * (1 - Math.exp(-dt / 180));
          if (Math.abs(target - progress[i]) < 0.004) progress[i] = target;
        }
      }
      paint();
    }
    function hold(index) {
      held = index;
      autoOn = false;
      if (reduced) paint();
    }
    function release(index) {
      if (index !== held) return;
      held = null;
      autoOn = !reduced;
      phase = "gap";
      phaseTime = 0;
      if (reduced) paint();
    }
    tiles.forEach((entry, index) => {
      entry.tile.addEventListener("pointerenter", () => hold(index));
      entry.tile.addEventListener("pointerleave", () => release(index));
      entry.tile.addEventListener("focus", () => hold(index));
      entry.tile.addEventListener("blur", () => release(index));
    });
    motion.addEventListener("change", () => {
      reduced = motion.matches;
      autoOn = !reduced && held == null;
      if (reduced) {
        for (let i = 0; i < progress.length; i++) progress[i] = held === i ? 1 : 0;
        if (frame) { cancelAnimationFrame(frame); frame = 0; }
      } else ensureLoop();
      paint();
    });
    document.addEventListener("visibilitychange", () => { last = performance.now(); });
    paint();
    ensureLoop();
  </script>
</body>
</html>
