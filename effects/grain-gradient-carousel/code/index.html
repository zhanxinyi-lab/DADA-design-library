<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颗粒渐变轮播瓦片</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  canvas:focus-visible {
    outline: 2px solid #fff;
    outline-offset: -6px;
  }
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 16px;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 8px;
    pointer-events: none;
  }
  button {
    pointer-events: auto;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font: 14px/1.2 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    cursor: pointer;
  }
  button:focus {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
  button:focus:not(:focus-visible) { outline: none; }
  button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  #fail {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2;
    margin: 0;
    padding: 32px 24px;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #000;
    color: #fff;
    font: 16px/1.6 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #fail.on { display: flex; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="group" aria-roledescription="轮播" aria-label="颗粒渐变轮播。当前是 Product&amp;Design。可以拖动，或用左右方向键切换。"></canvas>
<div class="bar">
  <button type="button" id="prev">上一张</button>
  <button type="button" id="pause" aria-pressed="false" aria-describedby="motion-note">暂停</button>
  <button type="button" id="next">下一张</button>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<p id="motion-note" class="sr"></p>
<p id="fail" role="status"></p>
<script>
"use strict";

(function () {
  var STAGE_W = 720;
  var STAGE_H = 900;
  var PITCH = 336;
  var FOCUS_W = 424;
  var FOCUS_H = 286;
  var SIDE_W = 214;
  var SIDE_H = 248;
  var HOLD = 1780;
  var SLIDE = 720;
  var PERIOD = HOLD + SLIDE;

  var canvas = document.getElementById("c");
  var live = document.getElementById("live");
  var failEl = document.getElementById("fail");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var pauseBtn = document.getElementById("pause");
  var ctx = canvas.getContext("2d", { alpha: false });
  if (!ctx) {
    failEl.textContent = "这个浏览器打不开画布，轮播显示不了。";
    failEl.className = "on";
    return;
  }

  var reducedQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  var reduced = reducedQuery.matches;
  var autoplay = !reduced;
  var beatTimer = 0;
  var pos = 0;
  var elapsed = 0;
  var dragging = false;
  var dragMoved = false;
  var lastX = 0;
  var anim = null;
  var shown = -1;
  var stageScale = 1;
  var dpr = 1;
  var ticking = false;
  var lastNow = 0;
  var filterOK = detectFilter();
  var scratch = document.createElement("canvas");
  var sctx = scratch.getContext("2d");
  var noise = makeNoise();
  var binary = makeBinary();
  var cards = [
    { label: "Product&Design", name: "Product&Design", paint: paintProduct, motif: motifProduct, textY: 0.6 },
    { label: "Engineering", name: "Engineering", paint: paintEngineering, motif: motifFlare, textY: 0.52 },
    { label: "Data", name: "Data", paint: paintData, motif: motifBinary, textY: 0.54 },
    { label: "", name: "暖色光斑", paint: paintWarm, motif: motifCross, textY: 0.5 },
    { label: "Business", name: "Business", paint: paintBusiness, motif: motifGrid, textY: 0.48 },
    { label: "Security", name: "Security", paint: paintSecurity, motif: motifStreaks, textY: 0.52 }
  ];

  function makeNoise() {
    var c = document.createElement("canvas");
    c.width = 128;
    c.height = 128;
    var g = c.getContext("2d");
    var img = g.createImageData(128, 128);
    var d = img.data;
    var i;
    for (i = 0; i < d.length; i += 4) {
      var v = 118 + Math.random() * 80;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function makeBinary() {
    var c = document.createElement("canvas");
    c.width = 520;
    c.height = 340;
    var g = c.getContext("2d");
    g.font = "13px ui-monospace, Consolas, monospace";
    g.fillStyle = "rgba(18, 78, 28, 0.62)";
    var n = 19;
    var y;
    for (y = 26; y < 320; y += 24) {
      var chunk = "";
      var k;
      for (k = 0; k < 6; k++) {
        var bits = "";
        var b;
        for (b = 0; b < 8; b++) {
          n = (n * 1103515245 + 12345) & 0x7fffffff;
          bits += (n >>> 16) & 1;
        }
        chunk += bits + " ";
      }
      g.fillText(chunk, 16, y);
    }
    g.globalCompositeOperation = "destination-in";
    var fade = g.createLinearGradient(0, 0, 0, 340);
    fade.addColorStop(0, "rgba(0,0,0,0)");
    fade.addColorStop(0.22, "rgba(0,0,0,0.55)");
    fade.addColorStop(0.72, "rgba(0,0,0,0.4)");
    fade.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = fade;
    g.fillRect(0, 0, 520, 340);
    return c;
  }

  function roundPath(g, x, y, w, h, r) {
    var rr = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  function ease(t) {
    return t * t * (3 - 2 * t);
  }

  function wrapDist(i, at) {
    var d = i - at;
    var n = cards.length;
    d -= n * Math.round(d / n);
    return d;
  }

  function focusOf(d) {
    var ad = Math.abs(d);
    if (ad >= 1) return 0;
    return ease(1 - ad);
  }

  function posAt(ms) {
    var n = cards.length;
    var span = PERIOD * n;
    var t = ((ms % span) + span) % span;
    var i = Math.floor(t / PERIOD);
    var local = t - i * PERIOD;
    var u = local <= HOLD ? 0 : ease((local - HOLD) / SLIDE);
    return i + u;
  }

  function paintProduct(g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#ffd0e4");
    bg.addColorStop(0.38, "#ff4d98");
    bg.addColorStop(0.72, "#ff7eb8");
    bg.addColorStop(1, "#9ebfff");
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    var hot = g.createRadialGradient(w * 0.5, h * 0.36, 4, w * 0.5, h * 0.42, w * 0.42);
    hot.addColorStop(0, "rgba(255, 186, 78, 1)");
    hot.addColorStop(0.22, "rgba(255, 120, 86, 0.72)");
    hot.addColorStop(1, "rgba(255, 80, 140, 0)");
    g.fillStyle = hot;
    g.fillRect(0, 0, w, h);
    fanLight(g, w, h);
  }

  function fanLight(g, w, h) {
    var cx = w * 0.5;
    var cy = h * 0.36;
    var reach = h * 0.95;
    g.save();
    g.beginPath();
    g.moveTo(cx, cy);
    g.arc(cx, cy, reach, Math.PI / 2 - 1.2, Math.PI / 2 + 1.2);
    g.closePath();
    g.clip();
    var rad = g.createRadialGradient(cx, cy, 0, cx, cy, reach);
    rad.addColorStop(0, "rgba(255, 246, 232, 0.92)");
    rad.addColorStop(0.22, "rgba(255, 206, 170, 0.5)");
    rad.addColorStop(0.62, "rgba(255, 170, 196, 0.12)");
    rad.addColorStop(1, "rgba(255, 170, 196, 0)");
    g.fillStyle = rad;
    g.fillRect(0, 0, w, h);
    g.restore();
  }

  function motifProduct(g, w, h) {
    var cx = w * 0.5;
    var cy = h * 0.36;
    var span = w * 0.34;
    g.save();
    g.strokeStyle = "rgba(255,255,255,0.94)";
    g.fillStyle = "rgba(255,255,255,0.94)";
    g.lineWidth = Math.max(1.2, w * 0.0035);
    g.lineJoin = "round";
    g.lineCap = "round";
    g.beginPath();
    var y0 = cy - h * 0.01;
    var y1 = cy + h * 0.02;
    g.moveTo(cx - span, y0);
    g.quadraticCurveTo(cx, y1, cx + span, y0);
    g.stroke();
    diamond(g, cx - span, y0, Math.max(3.5, w * 0.012));
    diamond(g, cx + span, y0, Math.max(3.5, w * 0.012));
    g.beginPath();
    g.arc(cx, (y0 + y1) * 0.5, Math.max(4.5, w * 0.016), 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }

  function diamond(g, x, y, s) {
    g.beginPath();
    g.moveTo(x, y - s);
    g.lineTo(x + s * 0.72, y);
    g.lineTo(x, y + s);
    g.lineTo(x - s * 0.72, y);
    g.closePath();
    g.stroke();
  }

  function paintEngineering(g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#9fd4ff");
    bg.addColorStop(0.45, "#3d7dff");
    bg.addColorStop(1, "#1d4fe0");
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    var core = g.createRadialGradient(w * 0.32, h * 0.5, 2, w * 0.32, h * 0.5, w * 0.28);
    core.addColorStop(0, "rgba(186, 244, 255, 0.95)");
    core.addColorStop(0.4, "rgba(80, 190, 255, 0.35)");
    core.addColorStop(1, "rgba(80, 190, 255, 0)");
    g.fillStyle = core;
    g.fillRect(0, 0, w, h);
  }

  function motifFlare(g, w, h) {
    g.save();
    g.translate(w * 0.5, h * 0.5);
    g.scale(1.15, 0.16);
    var rad = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.48);
    rad.addColorStop(0, "rgba(255,255,255,0.92)");
    rad.addColorStop(0.35, "rgba(170, 230, 255, 0.45)");
    rad.addColorStop(1, "rgba(170, 230, 255, 0)");
    g.fillStyle = rad;
    g.beginPath();
    g.arc(0, 0, w * 0.48, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  function paintData(g, w, h) {
    var bg = g.createRadialGradient(w * 0.5, h * 0.5, h * 0.1, w * 0.5, h * 0.5, w * 0.72);
    bg.addColorStop(0, "#3fbf45");
    bg.addColorStop(0.55, "#7dff62");
    bg.addColorStop(1, "#d4ff9a");
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
  }

  function motifBinary(g, w, h) {
    g.save();
    g.globalAlpha = 0.7;
    g.drawImage(binary, 0, h * 0.12, w, h * 0.76);
    g.restore();
  }

  function paintWarm(g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#fff8ea");
    bg.addColorStop(0.5, "#ffe39a");
    bg.addColorStop(1, "#fff3d2");
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
  }

  function motifCross(g, w, h) {
    var rad = g.createRadialGradient(w * 0.5, h * 0.52, 0, w * 0.5, h * 0.52, w * 0.42);
    rad.addColorStop(0, "rgba(255,255,255,0.95)");
    rad.addColorStop(0.22, "rgba(255, 206, 80, 0.75)");
    rad.addColorStop(1, "rgba(255, 206, 80, 0)");
    g.fillStyle = rad;
    g.fillRect(0, 0, w, h);
    softBand(g, w, h, 1.4, 0.13);
    softBand(g, w, h, 0.1, 0.55);
  }

  function softBand(g, w, h, sx, sy) {
    g.save();
    g.translate(w * 0.5, h * 0.52);
    g.scale(sx, sy);
    var rad = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.5);
    rad.addColorStop(0, "rgba(255,255,255,0.88)");
    rad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rad;
    g.beginPath();
    g.arc(0, 0, w * 0.5, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  function paintBusiness(g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#f0b6ff");
    bg.addColorStop(0.42, "#8a48ff");
    bg.addColorStop(1, "#3a208c");
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
  }

  function motifGrid(g, w, h) {
    g.save();
    g.strokeStyle = "rgba(255,255,255,0.2)";
    g.lineWidth = 1;
    g.beginPath();
    var top = h * 0.28;
    var i;
    for (i = 0; i <= 6; i++) {
      var t = i / 6;
      var y = top + Math.pow(t, 1.45) * h * 0.78;
      var inset = (1 - t) * w * 0.22;
      g.moveTo(inset, y);
      g.lineTo(w - inset, y);
    }
    for (i = 0; i <= 8; i++) {
      var u = i / 8;
      g.moveTo(w * 0.18 + u * w * 0.64, top);
      g.lineTo(u * w, h * 1.02);
    }
    g.stroke();
    g.restore();
  }

  function paintSecurity(g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#ffc27a");
    bg.addColorStop(0.4, "#ff7a22");
    bg.addColorStop(1, "#ff5a18");
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
  }

  function motifStreaks(g, w, h) {
    var xs = [0.22, 0.36, 0.5, 0.63, 0.76];
    var i;
    for (i = 0; i < xs.length; i++) {
      var band = g.createLinearGradient(w * xs[i] - 22, 0, w * xs[i] + 22, 0);
      band.addColorStop(0, "rgba(255, 226, 186, 0)");
      band.addColorStop(0.5, "rgba(255, 236, 210, 0.62)");
      band.addColorStop(1, "rgba(255, 226, 186, 0)");
      g.fillStyle = band;
      g.fillRect(w * xs[i] - 22, 0, 44, h);
    }
  }

  function grain(g, w, h) {
    g.save();
    g.globalAlpha = 0.34;
    g.globalCompositeOperation = "overlay";
    var shift = (Math.floor(elapsed / 80) % 9) * 4;
    var y;
    var x;
    for (y = -128; y < h; y += 128) {
      for (x = -128; x < w; x += 128) {
        g.drawImage(noise, x + shift, y + (shift % 16));
      }
    }
    g.restore();
  }

  function detectFilter() {
    try {
      var c = document.createElement("canvas");
      var g = c.getContext("2d");
      if (!g) return false;
      g.filter = "blur(2px)";
      return String(g.filter).indexOf("blur") !== -1;
    } catch (err) {
      return false;
    }
  }

  function paintDown(src, dw, dh, dest, dctx) {
    if (dest.width !== dw || dest.height !== dh) {
      dest.width = dw;
      dest.height = dh;
    } else {
      dctx.setTransform(1, 0, 0, 1, 0, 0);
      dctx.clearRect(0, 0, dw, dh);
    }
    dctx.imageSmoothingEnabled = true;
    dctx.drawImage(src, 0, 0, dw, dh);
  }

  function blitBlur(src, x, y, w, h, blur) {
    if (filterOK) {
      ctx.filter = "blur(" + blur.toFixed(2) + "px)";
      ctx.drawImage(src, x, y, w, h);
      return;
    }
    if (!sctx) {
      ctx.drawImage(src, x, y, w, h);
      return;
    }
    var px = Math.max(1, dpr * stageScale);
    var hw = Math.max(2, Math.round(w * px * 0.5));
    var hh = Math.max(2, Math.round(h * px * 0.5));
    paintDown(src, hw, hh, scratch, sctx);
    var spread = Math.max(6, blur * 0.55);
    var grid = [-1, 0, 1];
    var iy;
    var ix;
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1 / 9;
    for (iy = 0; iy < 3; iy++) {
      for (ix = 0; ix < 3; ix++) {
        ctx.drawImage(scratch, x + grid[ix] * spread, y + grid[iy] * spread * 0.85, w, h);
      }
    }
  }

  function ensureCardBuf(card) {
    var px = Math.max(1, dpr * stageScale);
    var bw = Math.max(2, Math.round(FOCUS_W * px));
    var bh = Math.max(2, Math.round(FOCUS_H * px));
    if (!card.buf) {
      card.buf = document.createElement("canvas");
      card.bctx = card.buf.getContext("2d");
    }
    if (card.bufPx === px && card.buf.width === bw && card.buf.height === bh) return;
    card.buf.width = bw;
    card.buf.height = bh;
    card.bufPx = px;
    var g = card.bctx;
    g.setTransform(px, 0, 0, px, 0, 0);
    var radius = 72;
    roundPath(g, 0.5, 0.5, FOCUS_W - 1, FOCUS_H - 1, radius);
    g.save();
    g.clip();
    card.paint(g, FOCUS_W, FOCUS_H);
    card.motif(g, FOCUS_W, FOCUS_H);
    grain(g, FOCUS_W, FOCUS_H);
    g.restore();
    roundPath(g, 1, 1, FOCUS_W - 2, FOCUS_H - 2, radius - 1);
    g.strokeStyle = "rgba(255,255,255,0.4)";
    g.lineWidth = 1.5;
    g.stroke();
    if (card.label) {
      g.fillStyle = "#fff";
      g.font = "500 23px system-ui, \"Segoe UI\", sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      if ("letterSpacing" in g) g.letterSpacing = "0.4px";
      g.fillText(card.label, FOCUS_W / 2, FOCUS_H * card.textY);
    }
  }

  function drawCard(card, x, y, w, h, f) {
    ensureCardBuf(card);
    ctx.save();
    var blur = (1 - f) * (1 - f) * 18;
    if (blur > 0.45) blitBlur(card.buf, x, y, w, h, blur);
    else ctx.drawImage(card.buf, x, y, w, h);
    ctx.restore();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
    canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
  }

  function announceIndex(index) {
    var n = cards.length;
    var i = ((Math.round(index) % n) + n) % n;
    if (i === shown) return;
    shown = i;
    var name = cards[i].name;
    live.textContent = name;
    canvas.setAttribute("aria-label", "颗粒渐变轮播。当前是 " + name + "。可以拖动，或用左右方向键切换。");
  }

  function easeInv(u) {
    var s = u;
    var n;
    for (n = 0; n < 6; n++) {
      var e = s * s * (3 - 2 * s);
      var d = 6 * s * (1 - s);
      if (Math.abs(d) < 1e-4) break;
      s = Math.max(0, Math.min(1, s - (e - u) / d));
    }
    return s;
  }

  function syncElapsed() {
    var i = Math.floor(pos);
    var u = pos - i;
    if (u <= 0.001) elapsed = i * PERIOD;
    else elapsed = i * PERIOD + HOLD + SLIDE * easeInv(u);
  }

  function clearBeat() {
    if (!beatTimer) return;
    clearTimeout(beatTimer);
    beatTimer = 0;
  }

  function armBeat() {
    clearBeat();
    if (!autoplay || !reduced || dragging || anim) return;
    var local = ((elapsed % PERIOD) + PERIOD) % PERIOD;
    var wait = local <= HOLD ? HOLD - local : PERIOD - local;
    if (wait < 32) wait = 32;
    beatTimer = setTimeout(function () {
      beatTimer = 0;
      if (!autoplay || !reduced) return;
      pos = Math.round(pos) + 1;
      elapsed = pos * PERIOD;
      draw();
      armBeat();
    }, wait);
  }

  function needsFrame() {
    return !!(dragging || anim || (autoplay && !reduced));
  }

  function kick() {
    if (ticking) return;
    ticking = true;
    lastNow = 0;
    requestAnimationFrame(frame);
  }

  function cardGeom(index, at) {
    var d = wrapDist(index, at);
    var f = focusOf(d);
    var w = SIDE_W + (FOCUS_W - SIDE_W) * f;
    var h = SIDE_H + (FOCUS_H - SIDE_H) * f;
    return {
      d: d,
      f: f,
      w: w,
      h: h,
      x: STAGE_W / 2 + d * PITCH - w / 2,
      y: 430 - h / 2
    };
  }

  function goTo(target, instant) {
    if (instant || reduced) {
      pos = target;
      elapsed = target * PERIOD;
      anim = null;
      armBeat();
      return;
    }
    clearBeat();
    anim = {
      from: pos,
      target: target,
      start: performance.now(),
      dur: 680
    };
  }

  function step(dir) {
    var base = anim ? anim.target : Math.round(pos);
    var target = base + dir;
    announceIndex(target);
    goTo(target, !autoplay);
    kick();
  }

  function frame(now) {
    ticking = false;
    if (!lastNow) lastNow = now;
    var dt = Math.min(40, now - lastNow);
    lastNow = now;
    if (anim) {
      var t = (now - anim.start) / anim.dur;
      if (t >= 1) {
        pos = anim.target;
        elapsed = anim.target * PERIOD;
        anim = null;
      } else {
        pos = anim.from + (anim.target - anim.from) * ease(t);
      }
    } else if (!dragging && autoplay && !reduced) {
      elapsed += dt;
      pos = posAt(elapsed);
    }
    draw();
    if (needsFrame()) {
      ticking = true;
      requestAnimationFrame(frame);
    }
  }

  function draw() {
    var viewW = window.innerWidth;
    var viewH = window.innerHeight;
    stageScale = Math.min(viewW / STAGE_W, viewH / STAGE_H);
    var ox = (viewW - STAGE_W * stageScale) / 2;
    var oy = (viewH - STAGE_H * stageScale) / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, viewW, viewH);
    ctx.translate(ox, oy);
    ctx.scale(stageScale, stageScale);

    var order = [];
    var i;
    for (i = 0; i < cards.length; i++) {
      var d = wrapDist(i, pos);
      if (Math.abs(d) > 1.65) continue;
      order.push({ i: i, d: d, f: focusOf(d) });
    }
    order.sort(function (a, b) { return Math.abs(b.d) - Math.abs(a.d); });
    for (i = 0; i < order.length; i++) {
      var item = order[i];
      var box = cardGeom(item.i, pos);
      drawCard(cards[item.i], box.x, box.y, box.w, box.h, box.f);
    }
  }

  function pointerX(event) {
    return event.clientX;
  }

  canvas.addEventListener("pointerdown", function (event) {
    if (event.button !== undefined && event.button !== 0) return;
    dragging = true;
    dragMoved = false;
    lastX = pointerX(event);
    clearBeat();
    anim = null;
    pos = Math.round(pos);
    syncElapsed();
    canvas.setPointerCapture(event.pointerId);
    kick();
  });
  canvas.addEventListener("pointermove", function (event) {
    if (!dragging) return;
    var x = pointerX(event);
    var dx = x - lastX;
    if (Math.abs(dx) > 2) dragMoved = true;
    lastX = x;
    if (!stageScale) return;
    pos -= dx / stageScale / PITCH;
    syncElapsed();
    kick();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (!dragMoved) {
      var settled = Math.round(pos);
      announceIndex(settled);
      goTo(settled, !autoplay);
      kick();
      return;
    }
    var target = Math.round(pos);
    announceIndex(target);
    goTo(target, !autoplay);
    kick();
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("keydown", function (event) {
    if (event.key === "ArrowRight") {
      event.preventDefault();
      step(1);
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      step(-1);
    }
  });
  canvas.addEventListener("click", function (event) {
    if (dragMoved) return;
    var rect = canvas.getBoundingClientRect();
    var viewX = event.clientX - rect.left;
    var viewY = event.clientY - rect.top;
    var scale = Math.min(rect.width / STAGE_W, rect.height / STAGE_H);
    if (!scale) return;
    var ox = (rect.width - STAGE_W * scale) / 2;
    var oy = (rect.height - STAGE_H * scale) / 2;
    var stageX = (viewX - ox) / scale;
    var stageY = (viewY - oy) / scale;
    var hit = null;
    var best = 1.2;
    var i;
    for (i = 0; i < cards.length; i++) {
      var box = cardGeom(i, pos);
      var ad = Math.abs(box.d);
      if (ad < 0.25 || ad > best) continue;
      if (stageX >= box.x && stageX <= box.x + box.w && stageY >= box.y && stageY <= box.y + box.h) {
        hit = i;
        best = ad;
      }
    }
    if (hit === null) return;
    var dist = wrapDist(hit, pos);
    var target = Math.round(pos + dist);
    announceIndex(target);
    goTo(target, !autoplay);
    kick();
  });

  prevBtn.addEventListener("click", function () { step(-1); });
  nextBtn.addEventListener("click", function () { step(1); });
  pauseBtn.addEventListener("click", function () {
    autoplay = !autoplay;
    anim = null;
    pos = Math.round(pos);
    elapsed = pos * PERIOD;
    pauseBtn.setAttribute("aria-pressed", autoplay ? "false" : "true");
    if (autoplay && reduced) armBeat();
    else clearBeat();
    kick();
  });

  function syncMotionNote() {
    motionNote.textContent = reduced
      ? "系统正在减少动态。暂停键只决定是否按节奏跳到下一张，不会滑动。前后按钮和方向键都是立刻换卡。"
      : "";
  }

  function onReduce(event) {
    reduced = event.matches;
    anim = null;
    pos = Math.round(pos);
    elapsed = pos * PERIOD;
    if (reduced) {
      autoplay = false;
      clearBeat();
      pauseBtn.setAttribute("aria-pressed", "true");
    } else {
      clearBeat();
    }
    syncMotionNote();
    kick();
  }
  if (reducedQuery.addEventListener) reducedQuery.addEventListener("change", onReduce);
  else if (reducedQuery.addListener) reducedQuery.addListener(onReduce);
  var motionNote = document.getElementById("motion-note");
  if (reduced) pauseBtn.setAttribute("aria-pressed", "true");
  syncMotionNote();

  window.addEventListener("resize", function () {
    resize();
    kick();
  });
  resize();
  kick();
})();
</script>
</body>
</html>
