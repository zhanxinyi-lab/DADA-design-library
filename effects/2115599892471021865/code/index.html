if(t<2.6){ctx.fillStyle='#5811c2';ctx.fillRect(0,0,1280,720);for(let i=0;i<340;i++){let x=rand(i+1)*1280,y=rand(i+401)*720,sz=1+rand(i+900)*3,alpha=.25+.72*(.5+.5*Math.sin(now/470+i));ctx.fillStyle=`rgba(231,204,255,${alpha})`;ctx.fillRect(x,y,sz,sz)}text('Motion to code',645,220,74,'#efddff',700);ctx.fillStyle='#d9bcff';ctx.font='600 22px ui-monospace,monospace';ctx.textAlign='left';ctx.fillText('fal-ai/motion-to-code/gsap',72,294);ctx.fillText('fal-ai/motion-to-code/glsl',72,328);ctx.fillStyle='#eee0ff';ctx.beginPath();ctx.roundRect(70,570,212,70,8);ctx.fill();text('✿ fal',176,622,48,'#5712b9',750);}

else if(t<11.4){let p=ease((t-8.4)/.8);let cols=[purple,lav,lime];[520,640,760].forEach((x,i)=>{let r=34;ctx.save();ctx.translate(x,350);ctx.rotate(Math.sin(now/900+i)*.03);ctx.fillStyle=cols[i];let wh=34+Math.sin(p*Math.PI)*8;ctx.fillRect(-wh,-wh,wh*2,wh*2);ctx.restore()});let captions=['square','faster',"that’s not a video"];let idx=t<9.55?0:t<10.45?1:2;text(captions[idx],640,625,17,lav,500)}

else if(t<18.3){let p=ease((t-14.1)/.5),n=178,cols=[purple,lav,lime,white,'#6617d0'];for(let i=0;i<n;i++){let x=rand(i+300)*1280,y=rand(i+800)*720;let burst=Math.sin(p*Math.PI/2);let bx=640+(x-640)*(1+burst*1.35),by=355+(y-355)*(1+burst*1.25);let ww=4+rand(i+90)*70,hh=3+rand(i+33)*24;if(t>16.25){bx=rand(i+1450)*1280;by=rand(i+7777)*720;ww=12+rand(i+832)*95;hh=5+rand(i+383)*25}ctx.globalAlpha=.58+.42*Math.sin(now/250+i);ctx.fillStyle=cols[i%cols.length];ctx.fillRect(bx,by,ww,hh)}ctx.globalAlpha=1;if(t>17.05)text("it’s code.",640,650,17,lav,500)}else{ctx.fillStyle='#5710bf';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#dfc2ff';ctx.beginPath();ctx.arc(640,360,56,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(640,360,18,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.arc(640,360,78,0,Math.PI*2);ctx.fillStyle='#dfc2ff';ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(640,360,21,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.arc(640,360,38,0,Math.PI*2);ctx.fillStyle='#5710bf';ctx.fill();}
