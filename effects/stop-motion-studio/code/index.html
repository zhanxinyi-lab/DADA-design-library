<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定格动画工作室</title>
<style>
  :root {
    --bg: #101113;
    --orange: #ef8b3c;
    --paper: #f4f1eb;
    --ink: #1a1c1e;
    --face: #2a2e32;
    --key: #3c4146;
    --bezel: #c5c7ca;
    --line: #8d9298;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: #eee; }
  body { font-family: "Segoe UI", system-ui, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  #stage { flex: 1 1 auto; width: 100%; min-height: 220px; display: block; touch-action: none; cursor: default; }
  #stage.pin { cursor: grab; }
  #stage.pin:active { cursor: grabbing; }
  .dock { flex: none; padding: 0 10px 12px; }
  .console {
    width: min(760px, 100%);
    margin: 0 auto;
    background: linear-gradient(#d7d8da, #b7b9bc 18%, #8e9296);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 16px 30px rgba(0,0,0,.45), inset 0 1px 0 #fff;
    position: relative;
  }
  .console:before, .console:after {
    content: "";
    position: absolute;
    top: 18%;
    width: 14px;
    height: 46%;
    background: linear-gradient(#4a4e52, #2a2d31);
    border-radius: 3px;
  }
  .console:before { left: -16px; }
  .console:after { right: -16px; }
  .rail {
    position: absolute;
    top: 42%;
    width: 8px;
    height: 16px;
    background: var(--orange);
  }
  .rail.l { left: -13px; }
  .rail.r { right: -13px; }
  .panel { background: #1a1d20; border-radius: 6px; padding: 8px; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0d0e10;
    color: #d5d6d4;
    font: 10px/1.2 ui-monospace, Consolas, monospace;
    letter-spacing: .08em;
    padding: 5px 8px;
    border-radius: 3px;
  }
  .led { width: 10px; height: 8px; background: var(--orange); border-radius: 1px; box-shadow: 0 0 6px var(--orange); }
  .row { display: grid; grid-template-columns: 1fr 148px; gap: 8px; margin-top: 8px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot, .act, .frame, .scale {
    font: inherit;
    color: inherit;
    background: #16181b;
    border: 1px solid #6d7278;
    border-radius: 50%;
    aspect-ratio: 1;
    position: relative;
    padding: 0;
    cursor: pointer;
  }
  .slot canvas { width: 70%; height: 70%; display: block; margin: 8% auto 0; }
  .slot span, .frame b {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    font: 9px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .04em;
    color: #c8c9c6;
    pointer-events: none;
  }
  .slot span { bottom: 16%; }
  .slot small {
    position: absolute; left: 0; right: 0; bottom: 6%;
    text-align: center; font: 7px/1 ui-monospace, Consolas, monospace; color: #8b8e92;
  }
  .slot.on { box-shadow: 0 0 0 3px var(--orange); border-color: #f0c09a; }
  .readout {
    background: #070808;
    border: 1px solid #34383c;
    border-radius: 4px;
    padding: 7px 8px 6px;
    font: 11px/1.35 ui-monospace, Consolas, monospace;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 86px;
  }
  .readout .a, .readout .b { display: flex; justify-content: space-between; gap: 6px; }
  .readout .a { color: var(--orange); letter-spacing: .06em; }
  .readout .b { color: #f2f2f0; font-size: 20px; letter-spacing: .02em; }
  .readout .b i { font-style: normal; font-size: 12px; color: #d0d0cc; align-self: end; margin-bottom: 3px; }
  .readout .c { color: #8d9394; font-size: 9px; letter-spacing: .03em; white-space: nowrap; }
  .acts { display: grid; grid-template-columns: 1.15fr 1.15fr 1fr 1fr 1.05fr; gap: 6px; margin-top: 8px; }
  .act {
    border-radius: 4px;
    aspect-ratio: auto;
    min-height: 54px;
    background: #3a3f44;
    color: #f3f3f1;
    border-color: #9aa0a6;
    font: 700 11px/1.15 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .04em;
  }
  .act.save { background: var(--orange); color: #fff; border-color: #ffd0a8; }
  .act.load { background: var(--paper); color: var(--ink); border-color: #fff; }
  .act.inv { position: relative; }
  .act.inv:before {
    content: "";
    position: absolute;
    top: 6px; left: 7px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--orange);
  }
  .bottom { display: grid; grid-template-columns: 1.35fr .85fr; gap: 8px; margin-top: 8px; align-items: end; }
  .frames { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
  .frame {
    border-radius: 3px;
    aspect-ratio: auto;
    min-height: 38px;
    background: #2f3438;
    border-color: #5c636a;
    color: #ddd;
    font: 8px/1 ui-monospace, Consolas, monospace;
  }
  .frame.on { background: #4d5968; box-shadow: inset 0 2px 0 var(--orange); }
  .scalebox { color: #bbb; font: 8px/1 ui-monospace, Consolas, monospace; letter-spacing: .08em; }
  .scalebox .ends { display: flex; justify-content: space-between; margin-bottom: 3px; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    background: transparent;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 16px;
    border-radius: 2px;
    border: 1px solid #3a3e42;
    background:
      repeating-linear-gradient(90deg, #8e949a 0 1px, transparent 1px 9px) center/100% 10px no-repeat,
      #121416;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 24px;
    margin-top: -5px;
    border: 0;
    border-radius: 1px;
    background: linear-gradient(#f7f7f5, #f7f7f5) left/8px 100% no-repeat, var(--orange);
  }
  input[type="range"]::-moz-range-track {
    height: 16px;
    border-radius: 2px;
    border: 1px solid #3a3e42;
    background: #121416;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 24px;
    border: 0;
    border-radius: 1px;
    background: var(--orange);
  }
  .stand {
    width: min(420px, 70%);
    height: 16px;
    margin: 8px auto 0;
    border-radius: 8px;
    background: linear-gradient(#6a6e72, #b9bcbf 40%, #5c6064);
    box-shadow: inset 0 1px 0 #fff;
    position: relative;
  }
  .stand:before, .stand:after {
    content: "";
    position: absolute;
    left: 18%; right: 18%;
    height: 3px;
    background: var(--orange);
  }
  .stand:before { top: 4px; }
  .stand:after { top: 9px; }
  button:focus-visible, input:focus-visible, #stage:focus-visible {
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
  }
  @media (max-width: 640px) {
    .console:before, .console:after, .rail { display: none; }
    .row { grid-template-columns: 1fr; }
    .readout { min-height: 0; }
    .acts { grid-template-columns: 1fr 1fr; }
    .act.inv { grid-column: 1 / -1; }
    .bottom { grid-template-columns: 1fr; }
    .readout .b { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" tabindex="0" aria-label="人偶舞台。拖动手腕或脚踝上的圆点摆姿势，方向键微调。鼠标双击钉住，触控点一下钉住、再点一下解开。"></canvas>
  <div class="dock">
    <div class="console">
      <span class="rail l"></span><span class="rail r"></span>
      <div class="panel">
        <div class="topbar"><span>RW-05 // ANATOMICAL MANNEQUIN CONSOLE</span><i class="led"></i></div>
        <div class="row">
          <div class="slots" id="slots"></div>
          <div class="readout" aria-live="polite">
            <div class="a"><span id="slotLabel">SLOT 01</span><span>LIMB IK</span></div>
            <div class="b"><span id="heightLabel">1.82m</span><i id="lifeLabel">1:1 LIFE</i></div>
            <div class="c" id="rigLabel">RIG:MANQ&nbsp;&nbsp;PINS:2&nbsp;&nbsp;DBL-PINCH</div>
          </div>
        </div>
        <div class="acts">
          <button class="act save" id="save" type="button">SAVE<br>POSE</button>
          <button class="act load" id="load" type="button">LOAD<br>POSE</button>
          <button class="act" id="mlr" type="button">MIRROR<br>L → R</button>
          <button class="act" id="mrl" type="button">MIRROR<br>R → L</button>
          <button class="act inv" id="invert" type="button">INVERT<br>SIDES</button>
        </div>
        <div class="bottom">
          <div class="frames" id="frames"></div>
          <label class="scalebox">
            <span class="ends"><span>1 FT</span><span>1:1</span></span>
            <input id="scale" type="range" min="0" max="1000" value="1000" aria-label="比例，从 1 英尺到 1:1">
            <span class="ends"><span></span><span>SCALE</span><span></span></span>
          </label>
        </div>
      </div>
    </div>
    <div class="stand" aria-hidden="true"></div>
  </div>
</div>
<p class="sr">素材 2119989643697606763 的干净房间复刻。人偶几何是自拟的。</p>
<script>
(function () {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LIFE = 1.82;
  const FOOT = 0.3048;
  const yaw = -0.22;
  const names = { lHand: 'L.WRIST', rHand: 'R.WRIST', lFoot: 'L.ANKLE', rFoot: 'R.ANKLE' };
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
  const mul = (a, s) => ({ x: a.x * s, y: a.y * s, z: a.z * s });
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const len = (a) => Math.hypot(a.x, a.y, a.z);
  const norm = (a) => { const l = len(a) || 1; return mul(a, 1 / l); };
  const cross = (a, b) => ({ x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const v3 = (x, y, z) => ({ x, y, z });
  const clone = (p) => ({
    lHand: { ...p.lHand }, rHand: { ...p.rHand }, lFoot: { ...p.lFoot }, rFoot: { ...p.rFoot }
  });

  const leap = {
    lHand: v3(-0.7, 1.2, 0.32),
    rHand: v3(0.3, 2.0, 0.05),
    lFoot: v3(-0.06, 0.9, 0.52),
    rFoot: v3(0.36, 0.4, -0.48)
  };
  const presets = [
    leap,
    { lHand: v3(-0.46, 1.35, 0.12), rHand: v3(0.46, 1.35, 0.12), lFoot: v3(-0.16, 0.08, 0.06), rFoot: v3(0.16, 0.08, 0.06) },
    { lHand: v3(-0.22, 1.55, 0.2), rHand: v3(0.55, 1.2, 0.15), lFoot: v3(-0.28, 0.42, 0.3), rFoot: v3(0.22, 0.2, -0.05) },
    { lHand: v3(-0.34, 2.02, 0.05), rHand: v3(0.34, 2.02, 0.05), lFoot: v3(-0.2, 0.1, 0.16), rFoot: v3(0.28, 0.1, -0.08) }
  ];

  const slots = presets.map(clone);
  const frames = Array.from({ length: 11 }, () => clone(leap));
  let frame = 0;
  let slot = 0;
  let scaleT = 1;
  let pose = clone(leap);
  let shown = clone(leap);
  let lock = { lHand: false, rHand: false, lFoot: false, rFoot: false };
  let hover = null;
  let drag = null;
  let touchPin = null;
  let label = 'RIG:MANQ';
  let anim = null;

  const pelvis = v3(0, 1.08, 0);
  const chest = v3(0, 1.5, 0.03);
  const head = v3(0, 1.76, 0.04);
  const chains = {
    lHand: { root: v3(-0.24, 1.5, 0.02), a: 0.32, b: 0.3, pole: v3(-0.55, 1.05, -0.15) },
    rHand: { root: v3(0.24, 1.5, 0.02), a: 0.32, b: 0.3, pole: v3(0.72, 1.72, 0.2) },
    lFoot: { root: v3(-0.11, 1.02, 0), a: 0.44, b: 0.42, pole: v3(-0.12, 1.45, 0.7) },
    rFoot: { root: v3(0.11, 1.02, 0), a: 0.44, b: 0.42, pole: v3(0.32, 0.72, -0.15) }
  };

  function solve(root, target, len1, len2, pole) {
    let delta = sub(target, root);
    let dist = len(delta);
    if (dist < 1e-4) delta = v3(0, -1, 0), dist = 1;
    const max = len1 + len2 - 1e-3;
    const min = Math.abs(len1 - len2) + 1e-3;
    const clamped = clamp(dist, min, max);
    const dir = norm(delta);
    const cosA = clamp((len1 * len1 + clamped * clamped - len2 * len2) / (2 * len1 * clamped), -1, 1);
    const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
    const rel = sub(pole, root);
    let bend = sub(rel, mul(dir, dot(rel, dir)));
    if (len(bend) < 1e-4) bend = cross(dir, v3(0, 0, 1));
    bend = norm(bend);
    const wrist = add(root, mul(dir, clamped));
    const elbow = add(add(root, mul(dir, len1 * cosA)), mul(bend, len1 * sinA));
    return { elbow, end: wrist };
  }

  function yawOf(p) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    return v3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c);
  }
  function unyaw(p) {
    const c = Math.cos(-yaw), s = Math.sin(-yaw);
    return v3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c);
  }
  function worldOf(p) {
    return yawOf(v3(p.x * scaleT, p.y * scaleT, p.z * scaleT));
  }
  function localOf(p) {
    const q = unyaw(p);
    return v3(q.x / scaleT, q.y / scaleT, q.z / scaleT);
  }

  const eye = v3(0.08, 1.28, 2.55);
  const at = v3(0, 1.18, 0);
  const HORIZON = 0.6;
  let basis;
  function camera() {
    const zaxis = norm(sub(eye, at));
    const xaxis = norm(cross(v3(0, 1, 0), zaxis));
    const yaxis = cross(zaxis, xaxis);
    basis = { xaxis, yaxis, zaxis };
  }
  camera();
  function viewOf(p) {
    const d = sub(p, eye);
    return {
      x: dot(d, basis.xaxis),
      y: dot(d, basis.yaxis),
      z: -dot(d, basis.zaxis)
    };
  }

  let viewW = 1, viewH = 1, dpr = 1;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    viewW = canvas.clientWidth;
    viewH = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(viewW * dpr));
    canvas.height = Math.max(1, Math.round(viewH * dpr));
  }
  function focal() { return viewH * 1.28; }
  function project(p) {
    const v = viewOf(p);
    if (v.z < 0.15) return null;
    const s = focal() / v.z;
    return { x: viewW * 0.5 + v.x * s, y: viewH * HORIZON - v.y * s, z: v.z, s };
  }
  function unproject(sx, sy, viewZ) {
    const s = focal() / viewZ;
    const vx = (sx - viewW * 0.5) / s;
    const vy = (viewH * HORIZON - sy) / s;
    return add(eye, add(add(mul(basis.xaxis, vx), mul(basis.yaxis, vy)), mul(basis.zaxis, -viewZ)));
  }

  function skeleton(p) {
    const solved = {};
    for (const key of Object.keys(chains)) {
      const c = chains[key];
      solved[key] = solve(c.root, p[key], c.a, c.b, c.pole);
    }
    return solved;
  }

  function bodyOf(p) {
    const sk = skeleton(p);
    const segs = [];
    const addSeg = (a, b, r0, r1) => segs.push({ a, b, r0, r1 });
    addSeg(pelvis, v3(0, 1.28, 0.015), 0.145, 0.13);
    addSeg(v3(0, 1.28, 0.015), chest, 0.13, 0.17);
    addSeg(chest, v3(0, 1.64, 0.035), 0.075, 0.05);
    addSeg(v3(-0.02, 1.5, 0.02), chains.lHand.root, 0.1, 0.07);
    addSeg(v3(0.02, 1.5, 0.02), chains.rHand.root, 0.1, 0.07);
    for (const key of Object.keys(chains)) {
      const c = chains[key];
      const s = sk[key];
      const arm = key.includes('Hand');
      addSeg(c.root, s.elbow, arm ? 0.062 : 0.085, arm ? 0.052 : 0.068);
      addSeg(s.elbow, s.end, arm ? 0.05 : 0.064, arm ? 0.04 : 0.048);
      const dir = norm(sub(s.end, s.elbow));
      const side = norm(cross(dir, Math.abs(dir.y) > 0.82 ? v3(0, 0, 1) : v3(0, 1, 0)));
      if (arm) {
        const palm = add(s.end, mul(dir, 0.05));
        addSeg(s.end, palm, 0.04, 0.046);
        for (let i = -1; i <= 1; i++) addSeg(palm, add(add(palm, mul(dir, 0.055)), mul(side, i * 0.022)), 0.02, 0.014);
      } else {
        addSeg(s.end, add(s.end, add(mul(dir, 0.07), v3(0, -0.02, 0.03))), 0.046, 0.03);
      }
    }
    return { sk, segs };
  }

  function shadeDisc(x, y, r) {
    const grd = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    grd.addColorStop(0, '#f4f4f2');
    grd.addColorStop(0.62, '#c9cbc8');
    grd.addColorStop(1, '#a3a6a8');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    resize();
    const g = ctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sky = g.createLinearGradient(0, 0, 0, viewH);
    sky.addColorStop(0, '#16171a');
    sky.addColorStop(1, '#0c0d0f');
    g.fillStyle = sky;
    g.fillRect(0, 0, viewW, viewH);

    g.strokeStyle = '#2c3034';
    g.lineWidth = 1;
    for (let i = -4; i <= 4; i++) {
      line(v3(i * 0.28, 0, -1.4), v3(i * 0.28, 0, 1.5));
      line(v3(-1.2, 0, i * 0.28), v3(1.2, 0, i * 0.28));
    }

    const model = bodyOf(shown);
    const guideKey = drag || hover || 'lHand';
    const guide = worldOf(model.sk[guideKey].end);
    const floor = v3(guide.x, 0, guide.z);
    g.strokeStyle = 'rgba(120,190,140,.85)';
    g.lineWidth = 1.5;
    line(guide, floor);
    g.beginPath();
    const ring = [];
    for (let i = 0; i <= 32; i++) {
      const a = i / 32 * Math.PI * 2;
      ring.push(project(v3(floor.x + Math.cos(a) * 0.16, 0.01, floor.z + Math.sin(a) * 0.16)));
    }
    g.beginPath();
    ring.forEach((pt, i) => { if (!pt) return; i ? g.lineTo(pt.x, pt.y) : g.moveTo(pt.x, pt.y); });
    g.stroke();

    const parts = [];
    for (const seg of model.segs) {
      const pa = project(worldOf(seg.a));
      const pb = project(worldOf(seg.b));
      if (!pa || !pb) continue;
      const dx = pb.x - pa.x, dy = pb.y - pa.y;
      const L = Math.hypot(dx, dy) || 1;
      parts.push({
        pa, pb,
        w0: Math.max(3, seg.r0 * scaleT * pa.s),
        w1: Math.max(3, seg.r1 * scaleT * pb.s),
        nx: -dy / L, ny: dx / L,
        z: (pa.z + pb.z) / 2
      });
    }
    parts.sort((a, b) => b.z - a.z);
    for (const part of parts) {
      const { pa, pb, w0, w1, nx, ny } = part;
      g.fillStyle = '#c4c6c4';
      g.beginPath();
      g.moveTo(pa.x + nx * w0, pa.y + ny * w0);
      g.lineTo(pb.x + nx * w1, pb.y + ny * w1);
      g.lineTo(pb.x - nx * w1, pb.y - ny * w1);
      g.lineTo(pa.x - nx * w0, pa.y - ny * w0);
      g.closePath();
      g.fill();
      shadeDisc(pa.x, pa.y, w0);
      shadeDisc(pb.x, pb.y, w1);
    }
    const hp = project(worldOf(head));
    if (hp) shadeDisc(hp.x, hp.y, 0.125 * scaleT * hp.s);

    const pins = [];
    for (const key of Object.keys(chains)) {
      const w = worldOf(model.sk[key].end);
      const pr = project(w);
      if (!pr) continue;
      pins.push({ key, pr, z: pr.z });
      g.beginPath();
      g.fillStyle = lock[key] ? '#e7b15a' : '#f08a3a';
      g.arc(pr.x, pr.y, key === hover || key === drag ? 7 : 5, 0, Math.PI * 2);
      g.fill();
      g.lineWidth = 1;
      g.strokeStyle = '#1b1c1e';
      g.stroke();
    }
    for (const key of ['lHand', 'rHand', 'lFoot', 'rFoot']) {
      const w = worldOf(model.sk[key].elbow);
      const pr = project(w);
      if (!pr) continue;
      g.beginPath();
      g.fillStyle = '#8fd0d4';
      g.arc(pr.x, pr.y, 3.5, 0, Math.PI * 2);
      g.fill();
    }
    return pins;
  }

  let pinCache = [];
  function frameDraw() {
    pinCache = draw();
  }
  function line(a, b) {
    const pa = project(a), pb = project(b);
    if (!pa || !pb) return;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }

  function hit(x, y) {
    let best = null;
    let bestD = 26;
    for (const pin of pinCache) {
      const d = Math.hypot(pin.pr.x - x, pin.pr.y - y);
      if (d < bestD) { best = pin; bestD = d; }
    }
    return best;
  }

  function lerpPose(a, b, t) {
    const o = {};
    for (const k of Object.keys(a)) o[k] = add(mul(a[k], 1 - t), mul(b[k], t));
    return o;
  }
  function go(next) {
    const from = clone(shown);
    pose = clone(next);
    frames[frame] = clone(pose);
    if (reduce) { shown = clone(pose); anim = null; return; }
    const t0 = performance.now();
    anim = { from, to: clone(pose), t0 };
  }
  function tick(now) {
    if (anim) {
      const t = clamp((now - anim.t0) / 180, 0, 1);
      const e = t * t * (3 - 2 * t);
      shown = lerpPose(anim.from, anim.to, e);
      if (t >= 1) anim = null;
    } else if (drag) {
      shown = clone(pose);
    }
    frameDraw();
    requestAnimationFrame(tick);
  }

  function pinsCount() {
    return Object.values(lock).filter(Boolean).length;
  }
  function refreshReadout() {
    document.getElementById('slotLabel').textContent = 'SLOT 0' + (slot + 1);
    const stature = LIFE * scaleT;
    document.getElementById('heightLabel').textContent = stature.toFixed(2) + 'm';
    document.getElementById('lifeLabel').textContent = scaleT > 0.985 ? '1:1 LIFE' : (stature / FOOT).toFixed(2) + ' FT';
    const who = (drag && names[drag]) || (hover && names[hover]) || label;
    document.getElementById('rigLabel').textContent = who + '   PINS:' + pinsCount() + '   DBL-PINCH';
    document.querySelectorAll('.slot').forEach((el, i) => el.classList.toggle('on', i === slot));
    document.querySelectorAll('.frame').forEach((el, i) => el.classList.toggle('on', i === frame));
  }

  function mirror(ontoRight) {
    const src = ontoRight ? 'l' : 'r';
    const dst = ontoRight ? 'r' : 'l';
    const next = clone(pose);
    for (const part of ['Hand', 'Foot']) {
      const a = src + part, b = dst + part;
      if (lock[b]) continue;
      next[b] = v3(-next[a].x, next[a].y, next[a].z);
    }
    go(next);
  }
  function invert() {
    const next = clone(pose);
    for (const part of ['Hand', 'Foot']) {
      const L = 'l' + part, R = 'r' + part;
      const a = next[L], b = next[R];
      if (!lock[L]) next[L] = v3(-b.x, b.y, b.z);
      if (!lock[R]) next[R] = v3(-a.x, a.y, a.z);
    }
    go(next);
  }

  function dial(canvas, p) {
    const g = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    g.clearRect(0, 0, w, h);
    const pt = (x, y) => [w * 0.5 + x * 34, h * 0.82 - y * 28];
    const sk = skeleton(p);
    const hip = pt(0, 1.05), chestP = pt(0, 1.46), headP = pt(0, 1.74);
    const joints = {
      lHand: pt(sk.lHand.end.x, sk.lHand.end.y),
      rHand: pt(sk.rHand.end.x, sk.rHand.end.y),
      lFoot: pt(sk.lFoot.end.x, sk.lFoot.end.y),
      rFoot: pt(sk.rFoot.end.x, sk.rFoot.end.y),
      le: pt(sk.lHand.elbow.x, sk.lHand.elbow.y),
      re: pt(sk.rHand.elbow.x, sk.rHand.elbow.y),
      lk: pt(sk.lFoot.elbow.x, sk.lFoot.elbow.y),
      rk: pt(sk.rFoot.elbow.x, sk.rFoot.elbow.y)
    };
    g.strokeStyle = '#e8e8e4';
    g.lineWidth = 2;
    g.lineCap = 'round';
    g.beginPath();
    const segs = [
      [hip, chestP], [chestP, headP],
      [pt(-0.22, 1.46), joints.le], [joints.le, joints.lHand],
      [pt(0.22, 1.46), joints.re], [joints.re, joints.rHand],
      [pt(-0.11, 1), joints.lk], [joints.lk, joints.lFoot],
      [pt(0.11, 1), joints.rk], [joints.rk, joints.rFoot]
    ];
    for (const [a, b] of segs) { g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
    g.stroke();
    g.fillStyle = '#f2f2ee';
    g.beginPath();
    g.arc(headP[0], headP[1], 4, 0, Math.PI * 2);
    g.fill();
  }

  const slotHost = document.getElementById('slots');
  const frameHost = document.getElementById('frames');
  slots.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'slot' + (i === 0 ? ' on' : '');
    btn.setAttribute('aria-label', '姿势槽 ' + (i + 1));
    const c = document.createElement('canvas');
    c.width = 96; c.height = 96;
    btn.appendChild(c);
    const n = document.createElement('span');
    n.textContent = String(i + 1).padStart(2, '0');
    const s = document.createElement('small');
    s.textContent = 'SLOT';
    btn.append(n, s);
    btn.addEventListener('click', () => { slot = i; refreshReadout(); });
    slotHost.appendChild(btn);
    dial(c, p);
  });
  for (let i = 0; i < 11; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'frame' + (i === 0 ? ' on' : '');
    btn.textContent = String(i + 1);
    btn.setAttribute('aria-label', '时间轴第 ' + (i + 1) + ' 帧');
    btn.addEventListener('click', () => {
      frame = i;
      go(frames[i]);
      refreshReadout();
    });
    frameHost.appendChild(btn);
  }

  function redrawDials() {
    document.querySelectorAll('.slot canvas').forEach((c, i) => dial(c, slots[i]));
  }
  document.getElementById('save').addEventListener('click', () => {
    slots[slot] = clone(pose);
    redrawDials();
  });
  document.getElementById('load').addEventListener('click', () => { go(slots[slot]); refreshReadout(); });
  document.getElementById('mlr').addEventListener('click', () => mirror(true));
  document.getElementById('mrl').addEventListener('click', () => mirror(false));
  document.getElementById('invert').addEventListener('click', invert);
  document.getElementById('scale').addEventListener('input', (e) => {
    const t = Number(e.target.value) / 1000;
    scaleT = (FOOT + (LIFE - FOOT) * t) / LIFE;
    refreshReadout();
  });

  function localPoint(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  const TAP = 8;
  function toggleLock(key) {
    lock[key] = !lock[key];
    drag = null;
    touchPin = null;
    hover = key;
    label = names[key];
    refreshReadout();
  }
  canvas.addEventListener('pointermove', (ev) => {
    const p = localPoint(ev);
    if (touchPin && !drag && Math.hypot(p.x - touchPin.x, p.y - touchPin.y) > TAP) {
      if (!lock[touchPin.key]) drag = touchPin.key;
      touchPin = null;
    }
    if (drag) {
      if (lock[drag]) return;
      const pin = pinCache.find((item) => item.key === drag);
      if (!pin) return;
      const world = unproject(p.x, p.y, pin.z);
      const local = localOf(world);
      pose[drag] = v3(clamp(local.x, -1.25, 1.25), clamp(local.y, 0.05, 2.25), clamp(local.z, -1.1, 1.1));
      frames[frame] = clone(pose);
      shown = clone(pose);
      anim = null;
      label = names[drag];
      refreshReadout();
      return;
    }
    const next = hit(p.x, p.y);
    hover = next ? next.key : null;
    canvas.classList.toggle('pin', !!hover);
    if (hover) label = names[hover];
    else if (!drag) label = 'RIG:MANQ';
    refreshReadout();
  });
  canvas.addEventListener('pointerdown', (ev) => {
    const p = localPoint(ev);
    const next = hit(p.x, p.y);
    if (!next) return;
    if (ev.pointerType !== 'touch' && ev.detail >= 2) {
      toggleLock(next.key);
      return;
    }
    if (ev.pointerType === 'touch') {
      touchPin = { key: next.key, x: p.x, y: p.y, id: ev.pointerId };
      try { canvas.setPointerCapture(ev.pointerId); } catch (err) { /* 指针已经结束时捕获会失败 */ }
      canvas.focus();
      hover = next.key;
      label = names[next.key];
      refreshReadout();
      return;
    }
    if (lock[next.key]) { hover = next.key; refreshReadout(); return; }
    drag = next.key;
    try { canvas.setPointerCapture(ev.pointerId); } catch (err) { /* 指针已经结束时捕获会失败 */ }
    canvas.focus();
  });
  canvas.addEventListener('pointerup', (ev) => {
    if (touchPin && touchPin.id === ev.pointerId) {
      const p = localPoint(ev);
      if (Math.hypot(p.x - touchPin.x, p.y - touchPin.y) <= TAP) toggleLock(touchPin.key);
      touchPin = null;
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', () => { drag = null; touchPin = null; });
  canvas.addEventListener('keydown', (ev) => {
    const key = hover || drag || 'lHand';
    const step = ev.shiftKey ? 0.06 : 0.03;
    const arrow = ev.key === 'ArrowLeft' || ev.key === 'ArrowRight' || ev.key === 'ArrowUp' || ev.key === 'ArrowDown';
    if (arrow && lock[key]) return;
    let moved = false;
    if (ev.key === 'ArrowLeft') { pose[key].x -= step; moved = true; }
    if (ev.key === 'ArrowRight') { pose[key].x += step; moved = true; }
    if (ev.key === 'ArrowUp') { pose[key].y += step; moved = true; }
    if (ev.key === 'ArrowDown') { pose[key].y -= step; moved = true; }
    if (moved) {
      ev.preventDefault();
      frames[frame] = clone(pose);
      shown = clone(pose);
      anim = null;
      refreshReadout();
    }
    if (ev.key >= '1' && ev.key <= '4') { slot = Number(ev.key) - 1; refreshReadout(); }
    if (ev.key === '[') { frame = (frame + 10) % 11; go(frames[frame]); refreshReadout(); }
    if (ev.key === ']') { frame = (frame + 1) % 11; go(frames[frame]); refreshReadout(); }
  });
  window.addEventListener('keydown', (ev) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT') return;
    if (ev.key === 's' || ev.key === 'S') document.getElementById('save').click();
    if (ev.key === 'l' || ev.key === 'L') document.getElementById('load').click();
  });
  window.addEventListener('resize', resize);

  // The first draw() defined a broken line(); the later function replaces it before use.
  shown = clone(pose);
  refreshReadout();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
