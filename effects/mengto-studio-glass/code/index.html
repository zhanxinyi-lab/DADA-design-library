<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>书桌光源</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f0e8;
      --muted: #b7b1a6;
      --panel: #14181c;
      --line: rgba(255, 248, 236, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow-x: hidden;
      background: var(--panel);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1120px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    .stage {
      position: relative;
      flex: none;
      width: min(100%, calc((100svh - 188px) * 1.6));
      aspect-ratio: 16 / 10;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      background: #1a2328;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lights {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hit {
      position: absolute;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 42%;
      min-height: 40px;
      margin: 0;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 248, 236, 0.38);
      background: rgba(12, 16, 20, 0.62);
      color: #f6f2ea;
      font: 600 13px/1.2 "Segoe UI", "PingFang SC", system-ui, sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .hit .state {
      font-weight: 650;
      opacity: 0.8;
    }

    .hit[aria-pressed="true"] {
      background: rgba(255, 244, 220, 0.92);
      color: #1c160f;
      border-color: transparent;
    }

    .hit[aria-pressed="true"] .state { opacity: 1; }

    .hit:focus { outline: none; }
    .hit:focus-visible {
      outline: 3px solid #fff8e8;
      outline-offset: 2px;
      box-shadow: 0 0 0 6px rgba(10, 12, 16, 0.9);
    }

    .hit.window { left: 14px; top: 14px; }
    .hit.sunset { left: 14px; top: 62px; }
    .hit.lamp { right: 14px; top: 30%; }
    .hit.screen { left: 50%; top: 63%; transform: translateX(-50%); }

    .panel {
      display: grid;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .meter {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .bars {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
      width: 100%;
      min-width: 0;
    }

    .bars li {
      display: grid;
      grid-template-columns: 3.2em minmax(0, 1fr) 3em;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .bars span, .bars em {
      font-size: 12px;
      font-style: normal;
      color: var(--muted);
    }

    .bars em { text-align: right; }

    .track {
      display: block;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .track b {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
    }

    .track.window b { background: #9fd7e4; }
    .track.sunset b { background: #ff8a4a; }
    .track.lamp b { background: #ffc27a; }
    .track.screen b { background: #d5e4ff; }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .live {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 390px) {
      .page { padding: 8px; gap: 8px; }
      .stage { border-radius: 14px; min-height: 250px; }
      .hit { font-size: 12px; padding: 6px 8px; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="stage" id="stage">
      <canvas id="room" aria-hidden="true"></canvas>
      <div class="lights" role="toolbar" aria-label="光源">
        <button type="button" class="hit window" data-light="window" aria-pressed="true">窗光 <span class="state">开</span></button>
        <button type="button" class="hit sunset" data-light="sunset" aria-pressed="false">夕照 <span class="state">关</span></button>
        <button type="button" class="hit lamp" data-light="lamp" aria-pressed="true">台灯 <span class="state">开</span></button>
        <button type="button" class="hit screen" data-light="screen" aria-pressed="true">屏幕 <span class="state">开</span></button>
      </div>
    </div>
    <section class="panel">
      <p class="meter" id="meter">混合色温</p>
      <ul class="bars" id="bars" aria-hidden="true">
        <li><span>窗光</span><i class="track window"><b data-bar="window"></b></i><em data-pct="window">0%</em></li>
        <li><span>夕照</span><i class="track sunset"><b data-bar="sunset"></b></i><em data-pct="sunset">0%</em></li>
        <li><span>台灯</span><i class="track lamp"><b data-bar="lamp"></b></i><em data-pct="lamp">0%</em></li>
        <li><span>屏幕</span><i class="track screen"><b data-bar="screen"></b></i><em data-pct="screen">0%</em></li>
      </ul>
      <p class="hint">点一盏灯，或用 Tab / 方向键聚焦后按回车。几盏可以同时亮，照度相加。减少动态效果时，光照直接跳到目标。</p>
    </section>
    <p class="live" id="live" aria-live="polite"></p>
  </main>
  <script>
    const FADE_MS = 880;
    const IDS = ["window", "sunset", "lamp", "screen"];
    const NAMES = { window: "窗光", sunset: "夕照", lamp: "台灯", screen: "屏幕" };
    const SPEC = {
      window: { kelvin: 6500, gain: 1.22, tint: [0.72, 0.95, 0.92] },
      sunset: { kelvin: 2400, gain: 1.08, tint: [1, 0.58, 0.24] },
      lamp: { kelvin: 2700, gain: 1.12, tint: [1, 0.74, 0.4] },
      screen: { kelvin: 5600, gain: 0.72, tint: [0.78, 0.88, 1] }
    };
    const ON = { window: 0.82, sunset: 1, lamp: 0.9, screen: 0.72 };
    const lights = {
      window: { level: ON.window, target: ON.window, from: ON.window, started: 0 },
      sunset: { level: 0, target: 0, from: 0, started: 0 },
      lamp: { level: ON.lamp, target: ON.lamp, from: ON.lamp, started: 0 },
      screen: { level: ON.screen, target: ON.screen, from: ON.screen, started: 0 }
    };

    const stage = document.getElementById("stage");
    const canvas = document.getElementById("room");
    const ctx = canvas.getContext("2d");
    const meter = document.getElementById("meter");
    const live = document.getElementById("live");
    const buttons = {};
    const bars = {};
    const pcts = {};
    for (const id of IDS) {
      buttons[id] = stage.querySelector('[data-light="' + id + '"]');
      bars[id] = document.querySelector('[data-bar="' + id + '"]');
      pcts[id] = document.querySelector('[data-pct="' + id + '"]');
    }

    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    let W = 1;
    let H = 1;
    let raf = 0;
    let pendingNote = "";

    function reduced() { return motionQuery.matches; }

    function kelvinToRgb(kelvin) {
      const k = Math.max(1000, Math.min(40000, kelvin)) / 100;
      let r;
      let g;
      let b;
      if (k <= 66) {
        r = 255;
        g = 99.4708025861 * Math.log(k) - 161.1195681661;
      } else {
        r = 329.698727446 * Math.pow(k - 60, -0.1332047592);
        g = 288.1221695283 * Math.pow(k - 60, -0.0755148492);
      }
      if (k >= 66) b = 255;
      else if (k <= 19) b = 0;
      else b = 138.5177312231 * Math.log(k - 10) - 305.0447927307;
      const clamp = (v) => Math.max(0, Math.min(255, v)) / 255;
      return [clamp(r), clamp(g), clamp(b)];
    }

    const kelvinRgb = {};
    for (const id of IDS) kelvinRgb[id] = kelvinToRgb(SPEC[id].kelvin);

    function lighting(weight) {
      // Cool night floor so the room stays readable with every lamp off. Not a fifth light.
      const lin = [0.3, 0.32, 0.4];
      for (const id of IDS) {
        const amount = lights[id].level * SPEC[id].gain * (weight[id] || 0);
        const base = kelvinRgb[id];
        const tint = SPEC[id].tint;
        lin[0] += base[0] * tint[0] * amount;
        lin[1] += base[1] * tint[1] * amount;
        lin[2] += base[2] * tint[2] * amount;
      }
      return lin;
    }

    function expose(albedo, lin) {
      return albedo.map((channel, i) => {
        const x = Math.max(0, channel * lin[i]);
        const mapped = x / (1 + 0.72 * x);
        return Math.max(0, Math.min(255, Math.pow(mapped, 0.9) * 280));
      });
    }

    function css(rgb) {
      return "rgb(" + (rgb[0] | 0) + "," + (rgb[1] | 0) + "," + (rgb[2] | 0) + ")";
    }

    function mixKelvin() {
      let num = 0;
      let den = 0;
      for (const id of IDS) {
        const weight = lights[id].level * SPEC[id].gain;
        num += weight * SPEC[id].kelvin;
        den += weight;
      }
      if (den < 0.04) return null;
      return Math.round(num / den);
    }

    function smooth(t) {
      const x = Math.max(0, Math.min(1, t));
      return x * x * (3 - 2 * x);
    }

    function step(now) {
      let moving = false;
      for (const id of IDS) {
        const light = lights[id];
        if (reduced()) {
          light.level = light.target;
          continue;
        }
        const t = (now - light.started) / FADE_MS;
        if (t >= 1) light.level = light.target;
        else {
          light.level = light.from + (light.target - light.from) * smooth(t);
          moving = true;
        }
      }
      return moving;
    }

    function paint() {
      const g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, css(expose([0.62, 0.7, 0.72], lighting({ window: 1, sunset: 0.72, lamp: 0.12, screen: 0.08 }))));
      g.addColorStop(0.55, css(expose([0.58, 0.62, 0.6], lighting({ window: 0.42, sunset: 0.4, lamp: 0.38, screen: 0.22 }))));
      g.addColorStop(1, css(expose([0.66, 0.58, 0.48], lighting({ window: 0.16, sunset: 0.2, lamp: 1, screen: 0.18 }))));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const floor = ctx.createLinearGradient(0, H * 0.74, 0, H);
      floor.addColorStop(0, css(expose([0.34, 0.36, 0.34], lighting({ window: 0.35, sunset: 0.3, lamp: 0.35, screen: 0.16 }))));
      floor.addColorStop(1, css(expose([0.16, 0.17, 0.16], lighting({ window: 0.2, sunset: 0.18, lamp: 0.22, screen: 0.08 }))));
      ctx.fillStyle = floor;
      ctx.fillRect(0, H * 0.74, W, H * 0.26);

      drawWindow();
      drawRays();
      drawLampGlow();
      drawShelf();
      drawDesk();
      drawChair();
      drawMonitor();
      drawProps();
      drawLamp();
    }

    function roundRect(x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function fillRound(x, y, w, h, r, albedo, weight) {
      roundRect(x, y, w, h, r);
      ctx.fillStyle = css(expose(albedo, lighting(weight)));
      ctx.fill();
    }

    function drawWindow() {
      const x = W * 0.045;
      const y = H * 0.07;
      const w = W * 0.25;
      const h = H * 0.5;
      fillRound(x, y, w, h, 8, [0.28, 0.2, 0.14], { window: 0.55, sunset: 0.45, lamp: 0.12, screen: 0.05 });
      const inset = Math.max(6, w * 0.07);
      const gx = x + inset;
      const gy = y + inset;
      const gw = w - inset * 2;
      const gh = h - inset * 2;
      const day = lights.window.level;
      const warm = lights.sunset.level;
      const sky = expose(
        [0.55, 0.72, 0.7],
        lighting({ window: 1.35 + day * 0.4, sunset: 0.15 + warm * 1.1, lamp: 0.02, screen: 0 })
      );
      const low = expose(
        [0.85, 0.45, 0.22],
        [0.18 + warm * 0.9, 0.12 + warm * 0.35, 0.1]
      );
      const night = [36 + day * 8, 52 + day * 12, 78 + day * 14];
      const blend = night.map((channel, i) => channel * (1 - Math.max(day, warm)) + sky[i] * day * 0.65 + low[i] * warm * 0.7);
      const glass = ctx.createLinearGradient(gx, gy, gx, gy + gh);
      glass.addColorStop(0, css(blend));
      glass.addColorStop(1, css(blend.map((channel) => channel * 0.72)));
      ctx.fillStyle = glass;
      ctx.fillRect(gx, gy, gw, gh);

      ctx.fillStyle = "rgba(18, 42, 36, 0.55)";
      ctx.beginPath();
      ctx.ellipse(gx + gw * 0.28, gy + gh * 0.62, gw * 0.16, gh * 0.22, 0, 0, Math.PI * 2);
      ctx.ellipse(gx + gw * 0.55, gy + gh * 0.56, gw * 0.2, gh * 0.26, 0, 0, Math.PI * 2);
      ctx.ellipse(gx + gw * 0.78, gy + gh * 0.66, gw * 0.14, gh * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      const disc = Math.max(day, warm);
      if (disc > 0.03) {
        const yNorm = warm + day < 0.001 ? 0.3 : warm / (warm + day);
        const cx = gx + gw * 0.62;
        const cy = gy + gh * (0.22 + yNorm * 0.42);
        const rad = Math.min(gw, gh) * (0.1 + disc * 0.06);
        const color = expose([1, 0.9, 0.7], [0.35 + day * 0.9, 0.25 + day * 0.7 + warm * 0.2, 0.15 + day * 0.45]);
        const warmColor = expose([1, 0.55, 0.2], [0.4 + warm, 0.2 + warm * 0.4, 0.08]);
        const mixed = color.map((channel, i) => channel * day + warmColor[i] * warm + 12);
        ctx.fillStyle = css(mixed.map((channel) => Math.min(255, channel)));
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = css(expose([0.2, 0.14, 0.1], lighting({ window: 0.4, sunset: 0.35, lamp: 0.1, screen: 0.04 })));
      const mullion = Math.max(3, w * 0.035);
      ctx.fillRect(gx + gw / 2 - mullion / 2, gy, mullion, gh);
      ctx.fillRect(gx, gy + gh / 2 - mullion / 2, gw, mullion);
      for (let i = 0; i < 5; i += 1) {
        ctx.fillRect(gx, gy + i * (gh * 0.08), gw, Math.max(2, gh * 0.025));
      }
    }

    function drawRays() {
      const day = lights.window.level;
      const warm = lights.sunset.level;
      const alpha = day * 0.22 + warm * 0.1;
      if (alpha < 0.02) return;
      ctx.save();
      ctx.globalAlpha = Math.min(0.38, alpha);
      const red = 210 + warm * 45;
      const green = 220 - warm * 70;
      const blue = 190 - warm * 110 - (1 - day) * 30;
      ctx.fillStyle = "rgb(" + (red | 0) + "," + Math.max(40, green | 0) + "," + Math.max(20, blue | 0) + ")";
      ctx.beginPath();
      ctx.moveTo(W * 0.2, H * 0.16);
      ctx.lineTo(W * 0.58, H * 0.74);
      ctx.lineTo(W * 0.4, H * 0.74);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = Math.min(0.22, alpha * 0.7);
      ctx.beginPath();
      ctx.moveTo(W * 0.16, H * 0.28);
      ctx.lineTo(W * 0.36, H * 0.74);
      ctx.lineTo(W * 0.24, H * 0.74);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawLampGlow() {
      const glow = lights.lamp.level;
      if (glow < 0.02) return;
      const cx = W * 0.915;
      const cy = H * 0.4;
      const g = ctx.createRadialGradient(cx, cy, 8, cx, cy, W * 0.24);
      g.addColorStop(0, "rgba(255, 186, 96, " + (0.5 * glow) + ")");
      g.addColorStop(1, "rgba(255, 150, 60, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, W * 0.24, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawShelf() {
      fillRound(W * 0.74, H * 0.5, W * 0.22, H * 0.028, 3, [0.4, 0.26, 0.16], { window: 0.16, sunset: 0.2, lamp: 0.95, screen: 0.08 });
      const books = [
        [0.735, 0.038, [0.55, 0.22, 0.18]],
        [0.778, 0.044, [0.25, 0.32, 0.38]],
        [0.826, 0.034, [0.62, 0.48, 0.22]]
      ];
      for (const book of books) {
        fillRound(W * book[0], H * 0.5 - H * 0.11, W * book[1], H * 0.11, 2, book[2], { window: 0.12, sunset: 0.16, lamp: 1, screen: 0.05 });
      }
    }

    function drawDesk() {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(W * 0.07, H * 0.69);
      ctx.lineTo(W * 0.93, H * 0.65);
      ctx.lineTo(W * 0.97, H * 0.78);
      ctx.lineTo(W * 0.03, H * 0.83);
      ctx.closePath();
      ctx.clip();
      const strips = 12;
      for (let i = 0; i < strips; i += 1) {
        const t = strips === 1 ? 0 : i / (strips - 1);
        const weight = {
          window: 0.95 + (0.16 - 0.95) * t,
          sunset: 0.78 + (0.26 - 0.78) * t,
          lamp: 0.18 + (1 - 0.18) * t,
          screen: 0.22 + Math.max(0, 0.55 - Math.abs(t - 0.52) * 0.9)
        };
        ctx.fillStyle = css(expose([0.48, 0.29, 0.16], lighting(weight)));
        ctx.fillRect((W * i) / strips, H * 0.6, W / strips + 1, H * 0.26);
      }
      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(W * 0.03, H * 0.83);
      ctx.lineTo(W * 0.97, H * 0.78);
      ctx.lineTo(W * 0.97, H * 0.9);
      ctx.lineTo(W * 0.03, H * 0.95);
      ctx.closePath();
      ctx.fillStyle = css(expose([0.28, 0.16, 0.1], lighting({ window: 0.4, sunset: 0.34, lamp: 0.55, screen: 0.2 })));
      ctx.fill();
      fillRound(W * 0.1, H * 0.9, W * 0.035, H * 0.08, 2, [0.22, 0.13, 0.08], { window: 0.3, sunset: 0.25, lamp: 0.2, screen: 0.08 });
      fillRound(W * 0.86, H * 0.86, W * 0.035, H * 0.1, 2, [0.22, 0.13, 0.08], { window: 0.12, sunset: 0.14, lamp: 0.45, screen: 0.08 });
    }

    function drawChair() {
      const weight = { window: 0.45, sunset: 0.3, lamp: 0.22, screen: 0.12 };
      fillRound(W * 0.145, H * 0.56, W * 0.1, H * 0.16, H * 0.03, [0.11, 0.13, 0.15], weight);
      fillRound(W * 0.13, H * 0.69, W * 0.145, H * 0.045, 8, [0.09, 0.1, 0.12], weight);
    }

    function drawMonitor() {
      const x = W * 0.46;
      const y = H * 0.36;
      const w = W * 0.26;
      const h = H * 0.26;
      fillRound(x, y, w, h, 10, [0.22, 0.23, 0.25], { window: 0.28, sunset: 0.24, lamp: 0.4, screen: 0.35 });
      const pad = Math.max(6, w * 0.045);
      const sx = x + pad;
      const sy = y + pad;
      const sw = w - pad * 2;
      const sh = h - pad * 2.4;
      const screenOn = lights.screen.level;
      if (screenOn < 0.04) {
        ctx.fillStyle = css(expose([0.05, 0.06, 0.08], lighting({ window: 0.2, sunset: 0.15, lamp: 0.2, screen: 0.05 })));
        ctx.fillRect(sx, sy, sw, sh);
      } else {
        const sky = expose([0.45, 0.68, 0.82], [0.25 + screenOn, 0.3 + screenOn * 0.8, 0.35 + screenOn]);
        const warmShift = lights.sunset.level * 0.35;
        sky[0] = Math.min(255, sky[0] + warmShift * 80);
        sky[2] = Math.max(0, sky[2] - warmShift * 70);
        const ground = expose([0.2, 0.38, 0.32], [0.2 + screenOn * 0.5, 0.25 + screenOn * 0.45, 0.2 + screenOn * 0.3]);
        const g = ctx.createLinearGradient(sx, sy, sx, sy + sh);
        g.addColorStop(0, css(sky));
        g.addColorStop(0.62, css(sky.map((channel) => channel * 0.8)));
        g.addColorStop(1, css(ground));
        ctx.fillStyle = g;
        ctx.fillRect(sx, sy, sw, sh);
        ctx.fillStyle = css([Math.max(0, 40 - screenOn * 20), 50 + screenOn * 30, 70]);
        ctx.beginPath();
        ctx.moveTo(sx + sw * 0.18, sy + sh * 0.68);
        ctx.lineTo(sx + sw * 0.42, sy + sh * 0.38);
        ctx.lineTo(sx + sw * 0.62, sy + sh * 0.68);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(220, 235, 240, " + (0.25 + screenOn * 0.35) + ")";
        ctx.fillRect(sx, sy + sh * 0.72, sw, sh * 0.08);
      }
      fillRound(x + w * 0.42, y + h - pad * 0.2, w * 0.16, H * 0.045, 2, [0.7, 0.71, 0.72], { window: 0.3, sunset: 0.25, lamp: 0.45, screen: 0.4 });
      fillRound(x + w * 0.3, y + h + H * 0.03, w * 0.4, H * 0.012, 2, [0.55, 0.56, 0.58], { window: 0.25, sunset: 0.2, lamp: 0.4, screen: 0.3 });

      if (screenOn > 0.02) {
        const g = ctx.createRadialGradient(x + w / 2, y + h, 8, x + w / 2, y + h + H * 0.08, W * 0.16);
        g.addColorStop(0, "rgba(186, 214, 255, " + (0.28 * screenOn) + ")");
        g.addColorStop(1, "rgba(186, 214, 255, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h + H * 0.06, W * 0.12, H * 0.04, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawProps() {
      fillRound(W * 0.3, H * 0.66, W * 0.035, H * 0.055, 4, [0.42, 0.3, 0.18], { window: 0.7, sunset: 0.5, lamp: 0.25, screen: 0.2 });
      ctx.fillStyle = css(expose([0.15, 0.16, 0.18], lighting({ window: 0.5, sunset: 0.35, lamp: 0.3, screen: 0.25 })));
      for (let i = 0; i < 3; i += 1) ctx.fillRect(W * (0.308 + i * 0.008), H * 0.635, W * 0.004, H * 0.03);

      fillRound(W * 0.4, H * 0.7, W * 0.2, H * 0.035, 6, [0.32, 0.24, 0.16], { window: 0.4, sunset: 0.32, lamp: 0.55, screen: 0.45 });
      ctx.fillStyle = css(expose([0.55, 0.5, 0.42], lighting({ window: 0.35, sunset: 0.28, lamp: 0.5, screen: 0.4 })));
      for (let i = 0; i < 8; i += 1) ctx.fillRect(W * (0.415 + i * 0.022), H * 0.708, W * 0.012, H * 0.018);

      ctx.fillStyle = css(expose([0.2, 0.2, 0.22], lighting({ window: 0.28, sunset: 0.22, lamp: 0.6, screen: 0.35 })));
      ctx.beginPath();
      ctx.ellipse(W * 0.66, H * 0.715, W * 0.02, H * 0.016, -0.4, 0, Math.PI * 2);
      ctx.fill();

      fillRound(W * 0.055, H * 0.5, W * 0.05, H * 0.035, 3, [0.35, 0.24, 0.16], { window: 0.8, sunset: 0.55, lamp: 0.1, screen: 0.05 });
      ctx.fillStyle = css(expose([0.18, 0.38, 0.28], lighting({ window: 0.9, sunset: 0.4, lamp: 0.08, screen: 0.04 })));
      ctx.beginPath();
      ctx.arc(W * 0.07, H * 0.47, W * 0.02, 0, Math.PI * 2);
      ctx.arc(W * 0.09, H * 0.45, W * 0.018, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLamp() {
      const cx = W * 0.915;
      const shelfY = H * 0.5;
      const weight = { window: 0.1, sunset: 0.12, lamp: 1.05, screen: 0.05 };
      fillRound(cx - W * 0.006, shelfY - H * 0.09, W * 0.012, H * 0.09, 2, [0.42, 0.32, 0.2], weight);
      const glow = 0.22 + lights.lamp.level * 0.95;
      ctx.fillStyle = css(expose([0.98, 0.8, 0.5], [glow, glow * 0.82, glow * 0.4]));
      ctx.beginPath();
      ctx.ellipse(cx, shelfY - H * 0.1, H * 0.075, H * 0.05, 0, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = css(expose([0.28, 0.18, 0.1], lighting(weight)));
      ctx.beginPath();
      ctx.ellipse(cx, shelfY, H * 0.04, H * 0.012, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function syncControls() {
      for (const id of IDS) {
        const on = lights[id].target > 0.02;
        const button = buttons[id];
        button.setAttribute("aria-pressed", on ? "true" : "false");
        button.querySelector(".state").textContent = on ? "开" : "关";
      }
    }

    function updateMeter() {
      const kelvin = mixKelvin();
      const parts = IDS.map((id) => NAMES[id] + " " + Math.round(lights[id].level * 100) + "%");
      meter.textContent = (kelvin == null ? "几乎没有光源" : "混合 " + kelvin + " K") + " · " + parts.join(" · ");
      for (const id of IDS) {
        const pct = Math.round(lights[id].level * 100);
        bars[id].style.width = pct + "%";
        pcts[id].textContent = pct + "%";
      }
    }

    function describe() {
      const kelvin = mixKelvin();
      const on = IDS.filter((id) => lights[id].target > 0.02).map((id) => NAMES[id]);
      const temp = kelvin == null ? "房间几乎没被照亮。" : "混合色温 " + kelvin + " K。";
      const who = on.length ? on.join("、") + "亮着。" : "四盏都关着。";
      return temp + who;
    }

    function render(now) {
      step(now);
      paint();
      updateMeter();
    }

    function kick() {
      if (reduced()) {
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        for (const id of IDS) lights[id].level = lights[id].target;
        render(performance.now());
        live.textContent = pendingNote + describe();
        return;
      }
      if (raf) return;
      const loop = (now) => {
        const moving = step(now);
        paint();
        updateMeter();
        if (moving) raf = requestAnimationFrame(loop);
        else {
          raf = 0;
          live.textContent = pendingNote + describe();
        }
      };
      raf = requestAnimationFrame(loop);
    }

    function toggle(id) {
      const light = lights[id];
      light.from = light.level;
      light.target = light.target > 0.02 ? 0 : ON[id];
      light.started = performance.now();
      syncControls();
      pendingNote = NAMES[id] + (light.target > 0.02 ? "打开。" : "关上。");
      if (reduced()) pendingNote += "已直接切到目标。";
      kick();
    }

    stage.querySelector(".lights").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-light]");
      if (!button) return;
      toggle(button.dataset.light);
    });

    stage.querySelector(".lights").addEventListener("keydown", (event) => {
      const key = event.key;
      if (key !== "ArrowRight" && key !== "ArrowDown" && key !== "ArrowLeft" && key !== "ArrowUp") return;
      const current = document.activeElement && document.activeElement.dataset
        ? IDS.indexOf(document.activeElement.dataset.light)
        : -1;
      if (current < 0) return;
      event.preventDefault();
      const dir = key === "ArrowRight" || key === "ArrowDown" ? 1 : -1;
      buttons[IDS[(current + dir + IDS.length) % IDS.length]].focus();
    });

    motionQuery.addEventListener("change", () => {
      if (reduced()) {
        for (const id of IDS) lights[id].level = lights[id].target;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
      }
      render(performance.now());
    });

    function resize() {
      const rect = stage.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = Math.max(1, rect.width);
      H = Math.max(1, rect.height);
      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render(performance.now());
    }

    new ResizeObserver(resize).observe(stage);
    syncControls();
    resize();
  </script>
</body>
</html>
