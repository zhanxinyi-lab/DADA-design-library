<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image→3D 胸像 · Detail Enhancer 对比</title>
<!-- AI 复刻：@MiladKambari Blender「Image to 3D」插件 Detail Enhancer 前后对比。Three.js（CDN）：程序化生成盔甲胸像，GLSL 噪声位移=细节增强；拖动分割线对比 -->
<style>html,body{margin:0;height:100%;background:#2a2b2e;overflow:hidden;font-family:system-ui,"PingFang SC";color:#eee}
.l{position:fixed;top:14px;font-size:14px;font-weight:600;text-shadow:0 1px 4px #000}#a{left:16px}#b{right:16px}
#bar{position:fixed;top:0;bottom:0;width:2px;background:#fff;left:50%;cursor:ew-resize}#bar:after{content:"⇆";position:absolute;top:50%;left:-14px;width:30px;height:30px;border-radius:50%;background:#fff;color:#222;display:grid;place-items:center}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body>
<div class="l" id="a">Without Detail Enhancer · 1M faces</div><div class="l" id="b">With Detail Enhancer · PBR</div><div id="bar"></div>
<script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.setScissorTest(true);document.body.appendChild(r.domElement);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,50);cam.position.set(0,.2,8.5);cam.lookAt(0,.1,0);
function scene(detail){const s=new THREE.Scene();s.background=new THREE.Color(detail?0x2d2a28:0x606266);
 s.add(new THREE.HemisphereLight(0xffffff,0x333344,detail?.6:1.1));const d=new THREE.DirectionalLight(0xffffff,detail?2.2:1.4);d.position.set(3,4,5);s.add(d);
 const rim=new THREE.DirectionalLight(0xffb070,detail?2:0);rim.position.set(-4,2,-3);s.add(rim);
 const mat=new THREE.MeshStandardMaterial({color:detail?0x2b2420:0xbdbdbd,metalness:detail?.75:0,roughness:detail?.35:.8,flatShading:false});
 if(detail)mat.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>',`
  vec3 p=position*4.;float n=sin(p.x*3.1+sin(p.y*2.3))*cos(p.y*2.7+sin(p.z*3.3))*sin(p.z*2.9+p.x);
  float g=abs(fract(p.y*1.5+n*.3)-.5);vec3 transformed=position+normal*(n*.04-smoothstep(.0,.06,g)*.0+ (g<.04?-.03:0.));`);
  sh.fragmentShader=sh.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
  float st=step(.92,fract(vViewPosition.y*3.+vViewPosition.x*.5));diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.85,.45,.15),st*.8);`)};
 const g=new THREE.Group();
 const sub=detail?200:48;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.55,sub,sub),mat);head.scale.set(.8,1.15,1);head.position.y=1.2;g.add(head);
 const beak=new THREE.Mesh(new THREE.ConeGeometry(.28,1.2,sub/2),mat);beak.rotation.x=Math.PI/2.4;beak.position.set(0,1.05,.65);g.add(beak);
 for(let i=0;i<7;i++){const fin=new THREE.Mesh(new THREE.ConeGeometry(.12,.9,sub/4),mat);const a=(i/6-.5)*2.4;fin.position.set(Math.sin(a)*.45,1.55,Math.cos(a)*-.2-.2);fin.rotation.set(-.9,0,-a*.6);g.add(fin)}
 const chest=new THREE.Mesh(new THREE.SphereGeometry(1,sub,sub,0,Math.PI*2,0,Math.PI*.55),mat);chest.scale.set(1.25,1,.8);chest.position.y=-.2;g.add(chest);
 for(const sx of[-1,1])for(let k=0;k<3;k++){const pl=new THREE.Mesh(new THREE.ConeGeometry(.35-k*.06,1.1-k*.2,sub/4,1,true),mat);pl.position.set(sx*(1.05+k*.2),.35-k*.3,0);pl.rotation.z=sx*(1.1+k*.2);g.add(pl)}
 const base=new THREE.Mesh(new THREE.CylinderGeometry(.7,.85,.35,64),new THREE.MeshStandardMaterial({color:detail?0x1a1816:0x9a9a9a,roughness:.6}));base.position.y=-.52;g.add(base);
 s.add(g);return{s,g}}
const A=scene(false),B=scene(true);let split=.5;
const bar=document.getElementById('bar');let drag=false;bar.onpointerdown=()=>drag=true;onpointerup=()=>drag=false;
onpointermove=e=>{if(drag){split=e.clientX/innerWidth;bar.style.left=split*100+'%'}};
function loop(t){const a=t/2400;A.g.rotation.y=B.g.rotation.y=Math.sin(a)*.9;const W=innerWidth,H=innerHeight,sx=Math.round(W*split);
 r.setScissor(0,0,sx,H);r.setViewport(0,0,W,H);r.render(A.s,cam);r.setScissor(sx,0,W-sx,H);r.render(B.s,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
</script></body></html>
