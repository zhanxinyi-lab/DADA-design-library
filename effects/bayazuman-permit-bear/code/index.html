<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>许可框小熊</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #c6c78d;
      color: #2c291f;
      font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    .stage {
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
    }
    .card {
      width: min(420px, 100%);
      margin: 0;
      padding: 16px 16px 14px;
      background: #f4f1e6;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(70, 68, 30, 0.16);
    }
    .ask { margin: 0; }
    .actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .choice, .again {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .choice {
      min-width: 64px;
      min-height: 44px;
      padding: 8px 18px;
      border: 0;
      border-radius: 999px;
      color: #f7f4ea;
    }
    .choice:disabled { cursor: default; opacity: 0.58; }
    .choice[aria-pressed="true"] {
      opacity: 1;
      box-shadow: inset 0 0 0 3px #fffaf0;
    }
    .choice:active:not(:disabled) { transform: translateY(1px); }
    #yes { background: #5c6840; }
    #no { background: #8d4e36; }
    .bear {
      width: min(280px, 100%);
      aspect-ratio: 1;
      display: block;
    }
    .again {
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid rgba(44, 41, 31, 0.35);
      border-radius: 999px;
      background: transparent;
      color: inherit;
    }
    .choice:focus-visible, .again:focus-visible {
      outline: 3px solid #fffaf0;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px #2a2618;
    }
    .choice[aria-pressed="true"]:focus-visible {
      box-shadow: inset 0 0 0 3px #fffaf0, 0 0 0 6px #2a2618;
    }
    .live {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-height: 700px) {
      .stage { padding: 12px; gap: 6px; }
      .bear { width: min(220px, 100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .choice, .again { transition: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="ask">
      <p class="ask" id="ask">小熊抬着头，正在看这个框。要允许通知吗？</p>
      <div class="actions" id="actions">
        <button class="choice" type="button" id="yes" aria-pressed="false">是</button>
        <button class="choice" type="button" id="no" aria-pressed="false">否</button>
      </div>
    </section>
    <canvas class="bear" id="bear" width="560" height="560" aria-hidden="true"></canvas>
    <button class="again" type="button" id="again" hidden>再看一次</button>
  </main>
  <p class="live" id="live" role="status"></p>
  <script>
    const yesBtn = document.querySelector("#yes");
    const noBtn = document.querySelector("#no");
    const again = document.querySelector("#again");
    const actions = document.querySelector("#actions");
    const live = document.querySelector("#live");
    const canvas = document.querySelector("#bear");
    const ctx = canvas.getContext("2d");
    const reduceMq = matchMedia("(prefers-reduced-motion: reduce)");
    const reduced = () => reduceMq.matches;
    const YES_MS = 1040;
    const NO_MS = 2680;
    const FUR = "#8d5a3c";
    const FUR_DEEP = "#6e412c";
    const EAR = "#d59a84";
    const SHIRT = "#6f8f5e";
    const APRON = "#f3ead4";
    const NOSE = "#3b261c";
    const EYE = "#24180f";
    const BLUSH = "rgba(214, 120, 110, 0.5)";

    let phase = "watch";
    let choice = "";
    let started = 0;
    let busy = false;

    const clamp01 = (t) => Math.max(0, Math.min(1, t));
    const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
    const easeInOut = (t) => {
      t = clamp01(t);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };

    function glance() {
      if (document.activeElement === yesBtn || yesBtn.matches(":hover")) return 1;
      if (document.activeElement === noBtn || noBtn.matches(":hover")) return -1;
      return 0;
    }

    function watchStill() {
      return {
        yaw: 0, smile: 0, ear: 0.12, look: 0.82, eyeOpen: 1, arm: 0,
        hop: 0, x: 0, y: 0, scale: 1, leg: 0, blink: false, glance: 0
      };
    }

    function watchAt(now) {
      const breath = Math.sin(now / 480);
      return {
        ...watchStill(),
        ear: 0.12 + breath * 0.04,
        look: 0.8 + Math.sin(now / 900) * 0.04,
        x: Math.sin(now / 1400) * 3,
        y: breath * 1.2,
        scale: 1 + breath * 0.012,
        blink: (now % 3800) < 130,
        glance: glance()
      };
    }

    function yesEnd() {
      return { ...watchStill(), smile: 1, ear: 1, look: 0.5, eyeOpen: 1, arm: 1 };
    }

    function noEnd() {
      return {
        ...watchStill(),
        yaw: Math.PI, smile: -1, ear: -1, look: 0, arm: 0,
        x: 68, y: -50, scale: 0.64
      };
    }

    function yesAt(ms) {
      const base = watchStill();
      if (ms < 240) {
        const u = easeOut(ms / 240);
        return { ...base, smile: 0.15 * u, ear: u, look: 0.94, eyeOpen: 1 + 0.4 * u, glance: 1 };
      }
      if (ms < 620) {
        const u = (ms - 240) / 380;
        return {
          ...base, smile: 0.2, ear: 1, look: 0.9, eyeOpen: 1.35, glance: 1,
          hop: Math.sin(clamp01(u) * Math.PI) * 20
        };
      }
      const u = easeOut((ms - 620) / 420);
      return {
        ...base, smile: 0.2 + 0.8 * u, ear: 1, look: 0.7, eyeOpen: 1.2 - 0.2 * u,
        arm: u, glance: 0
      };
    }

    function noAt(ms) {
      const base = watchStill();
      if (ms < 420) {
        const u = easeOut(ms / 420);
        return { ...base, smile: -u, look: 0.82 - 1.2 * u, ear: 0.12 - 1.15 * u, glance: -1, y: 8 * u };
      }
      if (ms < 1280) {
        const t = ms - 420;
        let yaw;
        if (t < 220) yaw = easeOut(t / 220) * Math.PI * 0.45;
        else if (t < 620) yaw = Math.PI * (0.45 + ((t - 220) / 400) * 0.2);
        else yaw = Math.PI * (0.65 + easeInOut((t - 620) / 240) * 0.35);
        const u = t / 860;
        return { ...base, smile: -1, look: -0.3, ear: -1, yaw, y: 8 * (1 - u) };
      }
      const u = clamp01((ms - 1280) / 1400);
      const e = easeInOut(u);
      const end = noEnd();
      return {
        ...end,
        x: end.x * e,
        y: end.y * e,
        scale: 1 + (end.scale - 1) * e,
        leg: u * Math.PI * 8,
        hop: Math.abs(Math.sin(u * Math.PI * 8)) * 6 * (u < 0.94 ? 1 : 0)
      };
    }

    function paint(pose) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const cssW = canvas.clientWidth || 280;
      const cssH = canvas.clientHeight || cssW;
      const w = Math.max(1, Math.round(cssW * dpr));
      const h = Math.max(1, Math.round(cssH * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);

      const unit = Math.min(cssW, cssH) / 280;
      const cx = cssW * 0.5 + pose.x * unit;
      const cy = cssH * 0.78 + pose.y * unit - pose.hop * unit;
      const sc = pose.scale * unit;
      ctx.save();
      ctx.translate(cx, cy + 6 * sc);
      ctx.scale(sc, sc * 0.42);
      ctx.fillStyle = "rgba(78, 76, 36, 0.18)";
      ctx.beginPath();
      ctx.ellipse(0, 0, 52, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(sc, sc);
      drawBear(pose);
      ctx.restore();
    }

    function drawBear(pose) {
      const yaw = pose.yaw || 0;
      const c = Math.cos(yaw);
      const s = Math.sin(yaw);
      const parts = [];
      const place = (x, y, z) => ({ x: x * c + z * s, y, z: -x * s + z * c });
      const ell = (x, y, z, rx, ry, rz, color) => {
        const p = place(x, y, z);
        parts.push({
          z: p.z,
          draw() {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, Math.max(0.8, Math.hypot(rx * c, rz * s)), ry, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      };
      const capsule = (x1, y1, z1, x2, y2, z2, r, color) => {
        const a = place(x1, y1, z1);
        const b = place(x2, y2, z2);
        parts.push({
          z: (a.z + b.z) / 2,
          draw() {
            ctx.strokeStyle = color;
            ctx.lineWidth = r * 2;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        });
      };

      const step = Math.sin(pose.leg || 0);
      const legSides = Math.abs(c) < 0.42 ? [s >= 0 ? -1 : 1] : [-1, 1];
      legSides.forEach((side) => {
        const swing = step * side;
        const footY = -4 - Math.max(0, swing) * 10;
        const footZ = swing * 10;
        const hip = place(side * 12, -42, 0);
        const foot = place(side * 14, footY, footZ);
        parts.push({
          z: Math.min(hip.z, foot.z) - 6,
          draw() {
            ctx.strokeStyle = FUR;
            ctx.lineWidth = 12;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(hip.x, hip.y);
            ctx.lineTo(foot.x, foot.y);
            ctx.stroke();
          }
        });
        ell(side * 14, footY, footZ - 4, 9, 5, 7, FUR_DEEP);
      });
      if (c < -0.4) ell(0, -34, -12, 7, 6, 6, FUR_DEEP);
      ell(0, -74, 0, 38, 34, 26, SHIRT);
      if (c > 0.4) {
        const apron = [[-16, -84, 18], [16, -84, 18], [20, -48, 16], [-20, -48, 16]].map((p) => place(p[0], p[1], p[2]));
        parts.push({
          z: apron.reduce((sum, p) => sum + p.z, 0) / apron.length,
          draw() {
            ctx.fillStyle = APRON;
            ctx.beginPath();
            ctx.moveTo(apron[0].x, apron[0].y);
            apron.slice(1).forEach((p) => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.fill();
          }
        });
        capsule(-16, -104, 14, -10, -84, 18, 2.4, APRON);
        capsule(16, -104, 14, 10, -84, 18, 2.4, APRON);
      }

      const lift = pose.arm || 0;
      [-1, 1].forEach((side) => {
        const shoulder = { x: side * 30, y: -90, z: 4 };
        const hand = {
          x: side * (40 + lift * 8),
          y: -46 + (-86 * lift),
          z: 8 + lift * 6
        };
        const mid = {
          x: shoulder.x + (hand.x - shoulder.x) * 0.42,
          y: shoulder.y + (hand.y - shoulder.y) * 0.42,
          z: shoulder.z + (hand.z - shoulder.z) * 0.42
        };
        capsule(shoulder.x, shoulder.y, shoulder.z, mid.x, mid.y, mid.z, 8, SHIRT);
        capsule(mid.x, mid.y, mid.z, hand.x, hand.y, hand.z, 7, FUR);
        ell(hand.x, hand.y, hand.z + 1, 8, 8, 8, FUR);
      });

      ell(0, -104, 0, 12, 10, 10, FUR);
      const earY = -150 - pose.ear * 8 - pose.look * 6;
      [-1, 1].forEach((side) => {
        ell(side * 26, earY, -6, 12, 12, 8, FUR);
        ell(side * 26, earY, -2, 6, 6, 4, EAR);
      });
      const head = place(0, -116 - pose.look * 10, 2);
      parts.push({
        z: head.z,
        draw() {
          ctx.fillStyle = FUR;
          ctx.beginPath();
          ctx.ellipse(head.x, head.y, Math.max(1, Math.hypot(36 * c, 30 * s)), 34, 0, 0, Math.PI * 2);
          ctx.fill();
          if (c <= -0.55) return;
          const headRx = Math.max(10, Math.hypot(36 * c, 30 * s));
          const sign = s >= 0 ? 1 : -1;
          const stick = Math.abs(s);
          const muzzle = { x: head.x + sign * headRx * stick * 0.92, y: head.y + 12 };
          const muzzleW = 8 + 7 * Math.max(c, 0) + 4 * stick;
          ctx.fillStyle = "#c98970";
          ctx.beginPath();
          ctx.ellipse(muzzle.x, muzzle.y, muzzleW, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          const nose = { x: muzzle.x + sign * 2.5 * stick, y: muzzle.y - 3 };
          ctx.fillStyle = NOSE;
          ctx.beginPath();
          ctx.ellipse(nose.x, nose.y, Math.max(2, 4.2 * Math.max(c, 0.4)), 3.4, 0, 0, Math.PI * 2);
          ctx.fill();
          const eyeXs = c > 0.45
            ? [-1, 1].map((side) => head.x + side * headRx * 0.34 + pose.glance * 2)
            : [head.x + sign * headRx * 0.2];
          const eyeY = head.y - 12;
          eyeXs.forEach((ex) => {
            if (pose.smile > 0.72 && !pose.blink && c > 0.35) {
              ctx.strokeStyle = EYE;
              ctx.lineWidth = 2.4;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.arc(ex, eyeY, Math.max(2, 5 * Math.max(c, 0.4)), Math.PI * 0.15, Math.PI * 0.85);
              ctx.stroke();
              return;
            }
            const eh = Math.max(1.4, pose.blink ? 1.3 : 7 * pose.eyeOpen);
            ctx.fillStyle = "#f6f1e6";
            ctx.beginPath();
            ctx.ellipse(ex, eyeY, Math.max(1.6, 5 * Math.max(c, 0.45)), eh, 0, 0, Math.PI * 2);
            ctx.fill();
            if (!pose.blink) {
              ctx.fillStyle = EYE;
              ctx.beginPath();
              const pupilLift = Math.max(-eh * 0.32, Math.min(eh * 0.32, pose.look * 4.2));
              ctx.arc(ex + pose.glance * Math.max(c, 0.3), eyeY - pupilLift, Math.max(1.1, 2 * Math.max(c, 0.45)), 0, Math.PI * 2);
              ctx.fill();
            }
          });
          if (pose.smile > 0.6 && c > 0.35) {
            [-1, 1].forEach((side) => {
              ctx.fillStyle = BLUSH;
              ctx.beginPath();
              ctx.ellipse(head.x + side * headRx * 0.48, head.y + 6, Math.max(1, 5 * c), 3, 0, 0, Math.PI * 2);
              ctx.fill();
            });
          }
          const mouth = { x: muzzle.x, y: muzzle.y + 5 };
          ctx.strokeStyle = "#4a2c22";
          ctx.lineWidth = 2.2;
          ctx.lineCap = "round";
          ctx.beginPath();
          const radius = Math.max(3, 7 * Math.max(c, 0.4));
          if (pose.smile >= 0) {
            const span = 0.16 + pose.smile * 0.32;
            ctx.arc(mouth.x, mouth.y - 1, radius, Math.PI * (0.5 - span), Math.PI * (0.5 + span));
          } else {
            const span = 0.16 + -pose.smile * 0.24;
            ctx.arc(mouth.x, mouth.y + 5, radius, Math.PI * (1.5 - span), Math.PI * (1.5 + span));
          }
          ctx.stroke();
        }
      });

      parts.sort((a, b) => a.z - b.z);
      parts.forEach((part) => part.draw());
    }

    let rafId = 0;

    function restPose() {
      if (choice === "yes") return yesEnd();
      if (choice === "no") return noEnd();
      return watchStill();
    }

    function stopLoop() {
      if (!rafId) return;
      cancelAnimationFrame(rafId);
      rafId = 0;
    }

    function startLoop() {
      if (rafId || reduced() || document.hidden) return;
      rafId = requestAnimationFrame(tick);
    }

    function markPressed(next) {
      yesBtn.setAttribute("aria-pressed", next === "yes" ? "true" : "false");
      noBtn.setAttribute("aria-pressed", next === "no" ? "true" : "false");
    }

    function settle() {
      phase = "hold";
      busy = false;
      stopLoop();
      paint(restPose());
      again.hidden = false;
      if (choice === "yes") {
        live.textContent = reduced()
          ? "小熊高兴地举着爪子。"
          : "小熊先睁大眼睛，再跳起来，然后举起爪子。";
      } else {
        live.textContent = reduced()
          ? "小熊背过身，站在远处。"
          : "小熊先低下头，再转身，然后走开。";
      }
      again.focus();
    }

    function choose(next) {
      if (busy || phase === "react") return;
      busy = true;
      choice = next;
      started = performance.now();
      yesBtn.disabled = true;
      noBtn.disabled = true;
      markPressed(next);
      if (reduced() || document.hidden) {
        stopLoop();
        paint(next === "yes" ? yesEnd() : noEnd());
        settle();
        return;
      }
      phase = "react";
      startLoop();
    }

    function tick(now) {
      if (reduced() || document.hidden || phase === "hold") {
        rafId = 0;
        paint(phase === "watch" ? watchStill() : restPose());
        return;
      }
      if (phase === "react") {
        const dur = choice === "yes" ? YES_MS : NO_MS;
        const elapsed = now - started;
        if (elapsed >= dur) {
          rafId = 0;
          paint(choice === "yes" ? yesEnd() : noEnd());
          settle();
          return;
        }
        paint(choice === "yes" ? yesAt(elapsed) : noAt(elapsed));
      } else {
        paint(watchAt(now));
      }
      rafId = requestAnimationFrame(tick);
    }

    yesBtn.addEventListener("click", () => choose("yes"));
    noBtn.addEventListener("click", () => choose("no"));
    again.addEventListener("click", () => {
      phase = "watch";
      choice = "";
      busy = false;
      yesBtn.disabled = false;
      noBtn.disabled = false;
      markPressed("");
      again.hidden = true;
      live.textContent = "小熊又看着许可框。";
      paint(watchStill());
      yesBtn.focus();
      startLoop();
    });
    actions.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      if (yesBtn.disabled) return;
      event.preventDefault();
      (event.key === "ArrowRight" ? noBtn : yesBtn).focus();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || reduced()) {
        stopLoop();
        if (phase === "react") {
          const elapsed = performance.now() - started;
          paint(choice === "yes" ? yesAt(elapsed) : noAt(elapsed));
        } else {
          paint(phase === "watch" ? watchStill() : restPose());
        }
        return;
      }
      if (phase === "watch" || phase === "react") startLoop();
    });
    reduceMq.addEventListener("change", () => {
      if (reduced()) {
        stopLoop();
        if (phase === "react") {
          paint(choice === "yes" ? yesEnd() : noEnd());
          settle();
          return;
        }
        paint(restPose());
        return;
      }
      if (phase === "watch" || phase === "react") startLoop();
    });
    paint(watchStill());
    startLoop();
  </script>
</body>
</html>
