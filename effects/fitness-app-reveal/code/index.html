<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>健身 App 界面入场</title>
  <style>
    :root {
      --page: #f4f4f2;
      --screen: #070708;
      --card: #161618;
      --ink: #f5f5f6;
      --muted: #8d8d93;
      --dim: #5e5e66;
      --lime: #e2ff00;
      --lime-deep: #d4f000;
      --orange: #ff4d1c;
      --water: #2f9dff;
      --gold: #f0a020;
      --line: rgba(255, 255, 255, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .page {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
    }
    .fit {
      width: 100%;
      max-width: 392px;
      min-width: 0;
      height: min(844px, calc(100dvh - 80px));
      overflow: hidden;
    }
    .replay {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: #17181b;
      color: #fff;
      font: 600 13px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .replay:focus-visible {
      outline: 2px solid #17181b;
      outline-offset: 3px;
    }
    .phone {
      width: 392px;
      height: 844px;
      transform-origin: top left;
      background: var(--screen);
      border-radius: 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
    }
    .screen {
      position: absolute;
      inset: 0;
      padding: 14px 16px 78px;
      display: flex;
      flex-direction: column;
    }
    .reveal {
      opacity: 0;
      transform: translateY(14px);
    }
    .is-play .reveal {
      animation: rise 0.62s cubic-bezier(0.16, 0.84, 0.24, 1) var(--d, 0s) forwards;
    }
    .is-settled .reveal {
      opacity: 1;
      transform: none;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 22px;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 650;
    }
    .status svg { display: block; }
    .radios { display: flex; align-items: center; gap: 6px; color: #f2f2f3; }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e7d3c2;
      display: grid;
      place-items: center;
      flex: none;
    }
    .avatar svg { width: 44px; height: 44px; display: block; }
    .name {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: -0.04em;
    }
    .streak {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 68px;
      height: 36px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      background: #1c1c1f;
      font-size: 16px;
      font-weight: 720;
    }
    .streak svg { display: block; }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-top: 14px;
      text-align: center;
    }
    .day { display: grid; justify-items: center; gap: 8px; }
    .day b {
      font-size: 13px;
      font-weight: 650;
      color: var(--muted);
    }
    .day.on b { color: #fff; font-weight: 760; }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--dim);
    }
    .mark.done { background: var(--lime-deep); color: #111; }
    .mark.today {
      position: relative;
      color: #fff;
      background:
        radial-gradient(circle at center, transparent 13px, transparent 13px);
    }
    .mark.today svg {
      position: absolute;
      inset: 0;
      width: 34px;
      height: 34px;
    }
    .mark.today span { position: relative; }

    .steps {
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 16px 14px 12px;
    }
    .steps-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .steps-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 720;
    }
    .steps-title svg { display: block; }
    .metrics-inline {
      margin-left: auto;
      display: flex;
      gap: 16px;
      text-align: right;
    }
    .metrics-inline strong {
      display: block;
      font-size: 26px;
      letter-spacing: -0.04em;
      font-weight: 720;
      line-height: 1;
    }
    .metrics-inline small {
      color: var(--muted);
      font-size: 12px;
    }
    .chart {
      position: relative;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
      height: 116px;
      margin-top: 12px;
      align-items: end;
    }
    .col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .slot {
      position: relative;
      width: 100%;
      height: 96px;
      display: flex;
      align-items: flex-end;
    }
    .bar-fill {
      display: block;
      width: 100%;
      height: 0;
      border-radius: 999px;
      background: var(--lime);
    }
    .bar-fill.ghost {
      height: var(--h);
      background: #3a3a40;
      opacity: 0;
    }
    .is-play .bar-fill.grow {
      animation: grow 0.7s cubic-bezier(0.16, 0.9, 0.24, 1) var(--d) forwards;
    }
    .is-play .bar-fill.ghost {
      animation: fade 0.45s ease 1.12s forwards;
    }
    .is-settled .bar-fill.grow { height: var(--h); }
    .is-settled .bar-fill.ghost { opacity: 1; }
    @keyframes grow { to { height: var(--h); } }
    @keyframes fade { to { opacity: 1; } }
    .col em {
      margin-top: 6px;
      font-style: normal;
      font-size: 11px;
      color: #f0f0f2;
      font-weight: 650;
    }
    .col.later em { color: #6d6d74; }
    .tip {
      position: absolute;
      left: 50%;
      bottom: calc(var(--h) + 6px);
      transform: translate(-50%, 6px);
      padding: 3px 7px;
      border-radius: 8px;
      background: #2a2a2e;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      white-space: nowrap;
    }
    .is-play .tip { animation: tip 0.35s ease 1.62s forwards; }
    .is-settled .tip { opacity: 1; transform: translate(-50%, 0); }
    @keyframes tip { to { opacity: 1; transform: translate(-50%, 0); } }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      min-height: 96px;
      padding: 12px 12px 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto 1fr;
      column-gap: 8px;
    }
    .card h2 {
      margin: 0;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
    }
    .card h2 svg { display: block; }
    .card strong {
      align-self: end;
      font-size: 28px;
      letter-spacing: -0.04em;
      font-weight: 720;
      line-height: 0.9;
    }
    .card strong small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .ring { width: 54px; height: 54px; align-self: center; }
    .ring circle { fill: none; stroke-width: 5; }
    .ring .track { stroke: #2c2c31; }
    .val {
      stroke-linecap: round;
      stroke-dasharray: var(--pct) calc(100 - var(--pct));
      stroke-dashoffset: 100;
      transform-box: fill-box;
      transform-origin: center;
      transform: rotate(var(--rot));
    }
    .is-play .val { animation: draw 0.85s ease var(--d) forwards; }
    .is-settled .val { stroke-dashoffset: calc((100 - var(--pct)) / -2); }
    @keyframes draw { to { stroke-dashoffset: calc((100 - var(--pct)) / -2); } }
    .sleep-bars {
      height: 46px;
      align-self: end;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .sleep-bars i {
      display: block;
      width: 6px;
      height: var(--h);
      border-radius: 999px;
      background: var(--gold);
      transform: scaleY(0);
      transform-origin: bottom;
      opacity: 0.75;
    }
    .sleep-bars i.peak { background: #ffe14a; opacity: 1; }
    .is-play .sleep-bars i { animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.2, 1) var(--d) forwards; }
    .is-settled .sleep-bars i { transform: scaleY(1); }
    @keyframes pop { to { transform: scaleY(1); } }
    .spark { width: 86px; height: 46px; align-self: end; }
    .spark .area { opacity: 0; }
    .spark .line {
      fill: none;
      stroke: var(--lime);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    .is-play .spark .line { animation: dash 0.9s ease 1.36s forwards; }
    .is-play .spark .area { animation: fade 0.4s ease 1.7s forwards; }
    .is-settled .spark .line { stroke-dashoffset: 0; }
    .is-settled .spark .area { opacity: 1; }
    @keyframes dash { to { stroke-dashoffset: 0; } }

    .trend {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 12px 2px 8px;
    }
    .trend h2 { margin: 0; font-size: 18px; font-weight: 740; }
    .trend span { color: var(--muted); font-size: 13px; }
    .work {
      flex: 1;
      min-height: 92px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .shot {
      position: relative;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #121317;
    }
    .shot p {
      position: absolute;
      left: 10px;
      right: 8px;
      bottom: 28px;
      margin: 0;
      font-size: 12px;
      font-weight: 650;
      color: #ececf0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .scene, .gym { position: absolute; inset: 0; }
    .scene { background: linear-gradient(#1c2430, #12161c); }
    .wall {
      position: absolute;
      inset: 0 40% 0 0;
      background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 100% 18px,
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 18px 100%,
        #1a2230;
    }
    .figure { position: absolute; left: 34%; bottom: 18px; width: 70px; height: 108px; }
    .gym {
      background:
        radial-gradient(circle at 70% 30%, rgba(255, 196, 120, 0.45), transparent 28%),
        radial-gradient(circle at 30% 60%, rgba(80, 90, 110, 0.7), transparent 36%),
        linear-gradient(#2a241c, #121418);
      filter: blur(0.2px);
    }
    .bench {
      position: absolute;
      display: block;
      left: 8%;
      right: 8%;
      height: 10px;
      border-radius: 8px;
      background: #2a2e36;
    }

    .dock {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      flex: 1;
      height: 64px;
      border-radius: 999px;
      background: rgba(44, 44, 48, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px;
    }
    .tab {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      color: #bdbdc2;
      font-size: 10px;
      font-weight: 650;
    }
    .tab svg { display: block; }
    .tab.here {
      color: var(--lime);
    }
    .tab.here .bubble {
      width: 36px;
      height: 28px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(226, 255, 0, 0.12);
    }
    .plus {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #2c2c30;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      flex: none;
    }
    .homebar {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 112px;
      height: 4px;
      margin-left: -56px;
      border-radius: 999px;
      background: #f2f2f4;
      opacity: 0;
    }
    .is-play .homebar { animation: fade 0.4s ease 1.7s forwards; }
    .is-settled .homebar { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .bar-fill, .sleep-bars i, .spark .line, .spark .area, .homebar {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .tip { animation: none !important; opacity: 1 !important; transform: translate(-50%, 0) !important; }
      .val { animation: none !important; }
      .bar-fill.grow { height: var(--h) !important; }
      .val { stroke-dashoffset: calc((100 - var(--pct)) / -2) !important; }
      .spark .line { stroke-dashoffset: 0 !important; }
      .sleep-bars i { transform: scaleY(1) !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <button class="replay" id="replay" type="button">再看一次</button>
    <div class="fit">
    <div class="phone" id="phone" lang="en" aria-label="David 的健身概览。周四 9 日，7842 步，5.86 公里。">
      <div class="screen">
        <div class="status reveal" style="--d:0.12s">
          <span>9:41</span>
          <span class="radios" aria-hidden="true">
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="0.6" fill="currentColor"/><rect x="4.5" y="5" width="3" height="7" rx="0.6" fill="currentColor"/><rect x="9" y="2" width="3" height="10" rx="0.6" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="currentColor"/></svg>
            <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 10.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6ZM2.2 7.4a7.4 7.4 0 0 1 10.6 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M0.4 4.6a10.6 10.6 0 0 1 14.2 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.6" y="0.6" width="20" height="10.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="2" width="14" height="8" rx="1.2" fill="currentColor"/><rect x="21.4" y="3.6" width="1.6" height="4.8" rx="0.6" fill="currentColor"/></svg>
          </span>
        </div>

        <div class="profile reveal" style="--d:0.24s">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="24" fill="#e7d3c2"/>
              <path d="M10 22c1-12 8-16 14-16s13 5 14 16c-4-3-8-2-14-2s-10-1-14 2z" fill="#2c261f"/>
              <circle cx="18" cy="24" r="1.4" fill="#2c261f"/>
              <circle cx="30" cy="24" r="1.4" fill="#2c261f"/>
              <path d="M20 30c1.4 1.4 6.6 1.4 8 0" fill="none" stroke="#a57b68" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="name">David</h1>
          <div class="streak" aria-label="连续 14 天">
            <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7.2 0 2 9.2h4.1L5.4 18 12.2 7.4H7.8L7.2 0z" fill="#e2ff00"/></svg>
            14
          </div>
        </div>

        <div class="week reveal" style="--d:0.4s" aria-label="本周，周四进行中">
          <div class="day"><b>Mon</b><span class="mark done" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.2 6.3 11.5 13 4.5" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="day"><b>Tue</b><span class="mark done" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.2 6.3 11.5 13 4.5" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="day"><b>Wed</b><span class="mark done" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.2 6.3 11.5 13 4.5" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
          <div class="day on"><b>Thu</b><span class="mark today"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#3a3a40" stroke-width="2"/><circle class="val" cx="18" cy="18" r="15" fill="none" stroke="#e2ff00" stroke-width="2.4" stroke-linecap="round" pathLength="100" style="--pct:22;--rot:18deg;--d:0.85s"/></svg><span>9</span></span></div>
          <div class="day"><b>Fri</b><span class="mark">10</span></div>
          <div class="day"><b>Sat</b><span class="mark">11</span></div>
          <div class="day"><b>Sun</b><span class="mark">12</span></div>
        </div>

        <section class="steps reveal" style="--d:0.55s" aria-label="步数 7842，5.86 公里">
          <div class="steps-top">
            <div class="steps-title">
              <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <ellipse cx="6" cy="11" rx="2.2" ry="3.3" transform="rotate(-18 6 11)" fill="#e2ff00"/>
                <ellipse cx="12" cy="8.5" rx="2.2" ry="3.3" transform="rotate(16 12 8.5)" fill="#e2ff00"/>
              </svg>
              Steps
            </div>
            <div class="metrics-inline">
              <div><strong>7,842</strong><small>steps</small></div>
              <div><strong>5.86</strong><small>km</small></div>
            </div>
          </div>
          <div class="chart" aria-hidden="true">
            <div class="col"><div class="slot"><i class="bar-fill grow" style="--h:61%;--d:0.78s"></i></div><em>5</em></div>
            <div class="col"><div class="slot"><i class="bar-fill grow" style="--h:85%;--d:0.84s"></i></div><em>6</em></div>
            <div class="col"><div class="slot"><i class="bar-fill grow" style="--h:52%;--d:0.9s"></i></div><em>7</em></div>
            <div class="col"><div class="slot"><i class="bar-fill grow" style="--h:76%;--d:0.98s"></i></div><em>8</em></div>
            <div class="col" style="--h:100%"><div class="slot"><b class="tip">7,842</b><i class="bar-fill grow" style="--h:100%;--d:1.06s"></i></div><em>9</em></div>
            <div class="col later"><div class="slot"><i class="bar-fill ghost" style="--h:66%"></i></div><em>10</em></div>
            <div class="col later"><div class="slot"><i class="bar-fill ghost" style="--h:80%"></i></div><em>11</em></div>
            <div class="col later"><div class="slot"><i class="bar-fill ghost" style="--h:66%"></i></div><em>12</em></div>
            <div class="col later"><div class="slot"><i class="bar-fill ghost" style="--h:80%"></i></div><em>13</em></div>
          </div>
        </section>

        <div class="grid">
          <article class="card reveal" style="--d:0.98s">
            <h2><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M7 0s4 3.2 4 7.2A4 4 0 0 1 3 7.2C3 3.2 7 0 7 0z" fill="#ff4d1c"/></svg>Calories</h2>
            <strong>1,284<small>kcal</small></strong>
            <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="14"/><circle class="val" cx="18" cy="18" r="14" stroke="#ff4d1c" pathLength="100" style="--pct:84;--rot:-70deg;--d:1.15s"/></svg>
          </article>
          <article class="card reveal" style="--d:1.06s">
            <h2><svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 0C6 0 1 6 1 10a5 5 0 0 0 10 0C11 6 6 0 6 0z" fill="#2f9dff"/></svg>Water</h2>
            <strong>1,750<small>ml</small></strong>
            <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="14"/><circle class="val" cx="18" cy="18" r="14" stroke="#2f9dff" pathLength="100" style="--pct:76;--rot:-80deg;--d:1.22s"/></svg>
          </article>
          <article class="card reveal" style="--d:1.18s">
            <h2><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 1.5a6 6 0 1 0 4 10.2 5.2 5.2 0 1 1-4-10.2z" fill="#f0a020"/></svg>Sleep</h2>
            <strong>8<small>hrs</small></strong>
            <div class="sleep-bars" aria-hidden="true">
              <i style="--h:42%;--d:1.28s"></i>

  <script>
    (function () {
      var phone = document.getElementById("phone");
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var fit = document.querySelector(".fit");
      function size() {
        var bounds = fit.getBoundingClientRect();
        var scale = Math.min(bounds.width / 392, bounds.height / 844);
        if (!isFinite(scale) || scale <= 0) scale = 1;
        phone.style.transform = "scale(" + scale + ")";
        phone.style.marginLeft = Math.max(0, (bounds.width - 392 * scale) / 2) + "px";
      }
      function play() {
        phone.classList.remove("is-play", "is-settled");
        size();
        if (reduced) {
          phone.classList.add("is-settled");
          return;
        }
        void phone.offsetWidth;
        phone.classList.add("is-play");
      }
      document.getElementById("replay").addEventListener("click", play);
      window.addEventListener("resize", size);
      play();
    }());
  </script>
