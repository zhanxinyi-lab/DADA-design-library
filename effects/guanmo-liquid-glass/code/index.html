<!DOCTYPE html>
<html lang="zh-CN">
<!-- 原创预览：液态玻璃。clean-room，不是上游合成、着色器或令牌。 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液态玻璃</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #f3f2ee; color: #0b0c10; overflow: hidden; }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #glass { touch-action: none; cursor: crosshair; }
  #glass:focus { outline: none; }
  #glass:focus-visible { outline: 2px solid #0b0c10; outline-offset: -8px; }
  #scene { visibility: hidden; }
  #scene.show { visibility: visible; }
  .note {
    position: fixed; z-index: 2; left: 16px; top: 14px; max-width: 34em;
    font-size: 12px; line-height: 1.45; letter-spacing: 0.02em;
    color: rgba(11, 12, 16, 0.62); pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="glass" tabindex="0" aria-describedby="note" aria-label="液态玻璃表面。中间的字保持平直，边缘把后面的内容弯过来。移动指针或按方向键可以扰动折射。"></canvas>
<p class="note" id="note">移动指针或方向键。边缘会弯，中间的字仍然可读。</p>
<script>
'use strict';
(function () {
  var glass = document.getElementById('glass');
  var scene = document.getElementById('scene');
  var note = document.getElementById('note');
  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var solidQuery = window.matchMedia('(prefers-reduced-transparency: reduce)');
  var gl = glass.getContext('webgl', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: false
  });

  var pointer = { x: 0, y: 0, on: 0 };
  var ripples = [];
  var lastRipple = 0;
  var layout = null;

  function measure(w, h) {
    var cx = w * 0.5;
    var cy = h * 0.5;
    var halfW = w * 0.28;
    var halfH = Math.min(h * 0.3, w * 0.46);
    var radius = Math.min(halfW, halfH) * 0.9;
    var bevel = Math.min(w, h) * 0.12;
    var cap = Math.min(halfW, halfH) * 0.68;
    if (bevel > cap) bevel = cap;
    return { cx: cx, cy: cy, halfW: halfW, halfH: halfH, radius: radius, bevel: bevel };
  }

  function disc(g, x, y, r, hex) {
    var grd = g.createRadialGradient(x, y, r * 0.08, x, y, r);
    grd.addColorStop(0, hex);
    grd.addColorStop(1, 'rgba(243,242,238,0)');
    g.fillStyle = grd;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }

  function paintScene(w, h, box) {
    var g = scene.getContext('2d');
    scene.width = w;
    scene.height = h;
    g.clearRect(0, 0, w, h);
    g.fillStyle = '#F3F2EE';
    g.fillRect(0, 0, w, h);
    var reach = box.bevel * 2.15;
    disc(g, box.cx, box.cy - box.halfH, reach, '#FF5A1F');
    disc(g, box.cx + box.halfW, box.cy, reach, '#FF2E7E');
    disc(g, box.cx, box.cy + box.halfH, reach, '#2BD9A0');
    disc(g, box.cx - box.halfW, box.cy, reach, '#2E4BFF');
    disc(g, w * 0.12, h * 0.16, Math.min(w, h) * 0.22, '#8B5CFF');
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = Math.max(1, w / 900);
    var step = Math.max(28, Math.round(Math.min(w, h) / 16));
    g.beginPath();
    var x;
    var y;
    for (x = step; x < w; x += step) {
      g.moveTo(x, 0);
      g.lineTo(x, h);
    }
    for (y = step; y < h; y += step) {
      g.moveTo(0, y);
      g.lineTo(w, y);
    }
    g.stroke();
    g.fillStyle = '#0B0C10';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if ('letterSpacing' in g) g.letterSpacing = '-0.04em';
    g.font = '700 ' + Math.round(Math.min(w * 0.105, h * 0.16)) + 'px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillText('LIQUID GLASS', box.cx, box.cy - box.halfH + box.bevel * 0.42);
    g.font = '700 ' + Math.round(Math.min(w * 0.072, h * 0.1)) + 'px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillText('只有边缘在弯', box.cx, box.cy + box.halfH - box.bevel * 1.35);
    if ('letterSpacing' in g) g.letterSpacing = '0em';
    g.font = '700 ' + Math.round(Math.max(Math.min(w, h) * 0.046, 16)) + 'px "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif';
    g.fillText('中间是平的，字照常可读', box.cx, box.cy);
  }

  function noteText() {
    if (solidQuery.matches) {
      note.textContent = '系统要求降低透明度，这块玻璃改成了实底。';
      return;
    }
    if (reduceQuery.matches) {
      note.textContent = '减少动态已开启：没有自动涟漪。移动指针或方向键仍会改变折射。';
      return;
    }
    note.textContent = '移动指针或方向键。边缘会弯，中间的字仍然可读。';
  }

  function showScene() {
    scene.className = 'show';
    glass.style.display = 'none';
  }

  noteText();
  if (typeof reduceQuery.addEventListener === 'function') {
    reduceQuery.addEventListener('change', noteText);
    solidQuery.addEventListener('change', noteText);
  }

  if (!gl) {
    var box0 = measure(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
    paintScene(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight), box0);
    showScene();
    return;
  }

  var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}';
  var FS = [
    'precision highp float;',
    'uniform vec2 uRes;',
    'uniform vec2 uCenter;',
    'uniform vec2 uHalf;',
    'uniform float uRadius;',
    'uniform float uBevel;',
    'uniform float uTime;',
    'uniform float uReduce;',
    'uniform float uSolid;',
    'uniform float uPointerOn;',
    'uniform vec2 uPointer;',
    'uniform vec3 uRip0,uRip1,uRip2,uRip3;',
    'uniform sampler2D uTex;',
    'vec2 toUv(vec2 px){return vec2(px.x/uRes.x,1.0-px.y/uRes.y);}',
    'vec3 roundBox(vec2 p,vec2 b,float r){',
    '  vec2 q=abs(p)-b+vec2(r);',
    '  float sd; vec2 outward;',
    '  if(q.x>0.0&&q.y>0.0){',
    '    float lenq=length(q);',
    '    sd=lenq-r;',
    '    outward=sign(p)*q/max(lenq,0.0001);',
    '  }else{',
    '    sd=max(q.x,q.y)-r;',
    '    outward=sign(p)*(q.x>q.y?vec2(1.0,0.0):vec2(0.0,1.0));',
    '  }',
    '  if(dot(outward,outward)<0.0001) outward=vec2(0.0,-1.0);',
    '  return vec3(sd,outward);',
    '}',
    'vec2 rippleShift(vec3 rip,vec2 s){',
    '  if(rip.z<0.0||uReduce>0.5) return vec2(0.0);',
    '  float age=uTime-rip.z;',
    '  if(age<0.0||age>1.7) return vec2(0.0);',
    '  vec2 d=s-rip.xy;',
    '  float dist=length(d);',
    '  vec2 dir=dist>0.001?d/dist:vec2(0.0);',
    '  float band=dist-age*460.0;',
    '  float wave=exp(-band*band/160.0)*exp(-age*1.55);',
    '  return dir*wave*uBevel*0.34;',
    '}',
    'vec3 sampleAt(vec2 px){',
    '  vec2 c=clamp(px,vec2(0.0),uRes-vec2(1.0));',
    '  return texture2D(uTex,toUv(c)).rgb;',
    '}',
    'void main(){',
    '  vec2 s=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);',
    '  vec3 box=roundBox(s-uCenter,uHalf,uRadius);',
    '  float sd=box.x;',
    '  vec2 outward=box.yz;',
    '  vec2 inward=-outward;',
    '  float t=clamp(1.0+sd/max(uBevel,1.0),0.0,1.0);',
    '  float slope=pow(t,2.4);',
    '  float idle=uReduce>0.5?0.0:sin(uTime*0.75+s.x*0.008)*uBevel*0.035*slope;',
    '  vec2 bend=inward*(uBevel*0.9*slope+idle);',
    '  vec2 toward=s+(uCenter-s)*0.045;',
    '  vec2 toPtr=uPointer-s;',
    '  float sigma=uBevel*1.2;',
    '  float fall=uPointerOn*exp(-dot(toPtr,toPtr)/max(sigma*sigma,1.0));',
    '  vec2 poke=toPtr*fall*0.85;',
    '  vec2 flow=rippleShift(uRip0,s)+rippleShift(uRip1,s)+rippleShift(uRip2,s)+rippleShift(uRip3,s);',
    '  vec2 basePx=toward+poke+flow;',
    '  vec3 glassCol=vec3(sampleAt(basePx+bend*1.06).r,sampleAt(basePx+bend).g,sampleAt(basePx+bend*0.94).b);',
    '  float luma=dot(glassCol,vec3(0.299,0.587,0.114));',
    '  glassCol=mix(vec3(luma),glassCol,1.12);',
    '  glassCol=mix(glassCol,vec3(1.0),0.06);',
    '  vec2 pool=uCenter+vec2(uHalf.x*0.05,uHalf.y*0.34);',
    '  if(uReduce<0.5) pool+=vec2(sin(uTime*0.55)*12.0,cos(uTime*0.4)*8.0);',
    '  vec2 pn=(s-pool)/max(uHalf*vec2(0.62,0.42),vec2(1.0));',
    '  float caustic=exp(-dot(pn,pn)*2.2);',
    '  glassCol+=vec3(1.0,0.98,0.94)*caustic*0.14;',
    '  if(uSolid>0.5) glassCol=vec3(0.953,0.949,0.933);',
    '  float rim=1.0-smoothstep(0.0,max(uBevel*0.085,1.6),abs(sd));',
    '  float sheen=1.0-smoothstep(0.0,uBevel*0.5,abs(sd));',
    '  float facing=clamp(dot(outward,normalize(vec2(-0.82,-0.57))),0.0,1.0);',
    '  float back=clamp(dot(outward,normalize(vec2(0.72,0.7))),0.0,1.0);',
    '  glassCol+=vec3(1.0)*facing*(rim*0.92+sheen*0.2);',
    '  glassCol*=1.0-back*(1.0-smoothstep(0.0,uBevel*0.22,abs(sd)))*0.38;',
    '  vec3 outside=sampleAt(s);',
    '  vec3 sh=roundBox(s-uCenter-vec2(uBevel*0.16,uBevel*0.42),uHalf,uRadius);',
    '  float shadow=(1.0-smoothstep(0.0,uBevel*1.05,sh.x))*smoothstep(-6.0,14.0,sd);',
    '  outside*=1.0-shadow*0.22;',
    '  float cover=1.0-smoothstep(-1.0,1.4,sd);',
    '  gl_FragColor=vec4(mix(outside,glassCol,cover),1.0);',
    '}'
  ].join('\n');

  function makeShader(type, src) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  var vs = makeShader(gl.VERTEX_SHADER, VS);
  var fs = makeShader(gl.FRAGMENT_SHADER, FS);
  var program = vs && fs ? gl.createProgram() : null;
  if (program) {
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.bindAttribLocation(program, 0, 'a');
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) program = null;
  }
  if (!program) {
    paintScene(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight), measure(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight)));
    showScene();
    return;
  }

  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.useProgram(program);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  var uRes = gl.getUniformLocation(program, 'uRes');
  var uCenter = gl.getUniformLocation(program, 'uCenter');
  var uHalf = gl.getUniformLocation(program, 'uHalf');
  var uRadius = gl.getUniformLocation(program, 'uRadius');
  var uBevel = gl.getUniformLocation(program, 'uBevel');
  var uTime = gl.getUniformLocation(program, 'uTime');
  var uReduce = gl.getUniformLocation(program, 'uReduce');
  var uSolid = gl.getUniformLocation(program, 'uSolid');
  var uPointerOn = gl.getUniformLocation(program, 'uPointerOn');
  var uPointer = gl.getUniformLocation(program, 'uPointer');
  var uRip = [
    gl.getUniformLocation(program, 'uRip0'),
    gl.getUniformLocation(program, 'uRip1'),
    gl.getUniformLocation(program, 'uRip2'),
    gl.getUniformLocation(program, 'uRip3')
  ];
  var start = performance.now();

  function uploadScene() {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(glass.clientWidth * dpr));
    var h = Math.max(1, Math.round(glass.clientHeight * dpr));
    if (glass.width !== w || glass.height !== h) {
      glass.width = w;
      glass.height = h;
    }
    layout = measure(w, h);
    paintScene(w, h, layout);
    if (!pointer.on) {
      pointer.x = layout.cx;
      pointer.y = layout.cy;
    }
    gl.viewport(0, 0, w, h);
    uploadScene();
  }

  function pointFromEvent(e) {
    var rect = glass.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / Math.max(1, rect.width)) * glass.width;
    pointer.y = ((e.clientY - rect.top) / Math.max(1, rect.height)) * glass.height;
    pointer.on = 1;
  }

  function spawnRipple() {
    if (reduceQuery.matches) return;
    var now = (performance.now() - start) / 1000;
    if (now - lastRipple < 0.08) return;
    lastRipple = now;
    ripples.push({ x: pointer.x, y: pointer.y, t: now });
    if (ripples.length > 4) ripples.shift();
  }

  glass.addEventListener('pointerdown', function (e) {
    glass.setPointerCapture(e.pointerId);
    glass.focus();
    pointFromEvent(e);
    spawnRipple();
  });
  glass.addEventListener('pointermove', function (e) {
    if (!pointer.on && e.buttons === 0 && e.pointerType === 'mouse') {
      pointFromEvent(e);
      return;
    }
    pointFromEvent(e);
    if (e.buttons) spawnRipple();
  });
  glass.addEventListener('pointerenter', function (e) { pointFromEvent(e); });
  glass.addEventListener('pointerleave', function () { pointer.on = 0; });
  glass.addEventListener('keydown', function (e) {
    var key = e.key;
    if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'ArrowUp' && key !== 'ArrowDown') return;
    e.preventDefault();
    if (!layout) return;
    var step = Math.min(glass.width, glass.height) * (e.shiftKey ? 0.06 : 0.028);
    if (!pointer.on) {
      pointer.x = layout.cx;
      pointer.y = layout.cy;
    }
    pointer.on = 1;
    if (key === 'ArrowLeft') pointer.x -= step;
    if (key === 'ArrowRight') pointer.x += step;
    if (key === 'ArrowUp') pointer.y -= step;
    if (key === 'ArrowDown') pointer.y += step;
    pointer.x = Math.max(0, Math.min(glass.width, pointer.x));
    pointer.y = Math.max(0, Math.min(glass.height, pointer.y));
    spawnRipple();
  });
  window.addEventListener('resize', resize);
  resize();

  function frame() {
    var time = (performance.now() - start) / 1000;
    var live = [];
    var i;
    for (i = 0; i < ripples.length; i++) {
      if (time - ripples[i].t < 1.75) live.push(ripples[i]);
    }
    ripples = live;
    gl.uniform2f(uRes, glass.width, glass.height);
    gl.uniform2f(uCenter, layout.cx, layout.cy);
    gl.uniform2f(uHalf, layout.halfW, layout.halfH);
    gl.uniform1f(uRadius, layout.radius);
    gl.uniform1f(uBevel, layout.bevel);
    gl.uniform1f(uTime, time);
    gl.uniform1f(uReduce, reduceQuery.matches ? 1 : 0);
    gl.uniform1f(uSolid, solidQuery.matches ? 1 : 0);
    gl.uniform1f(uPointerOn, pointer.on);
    gl.uniform2f(uPointer, pointer.x, pointer.y);
    for (i = 0; i < 4; i++) {
      var rip = ripples[i];
      if (rip) gl.uniform3f(uRip[i], rip.x, rip.y, rip.t);
      else gl.uniform3f(uRip[i], 0, 0, -1);
    }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
