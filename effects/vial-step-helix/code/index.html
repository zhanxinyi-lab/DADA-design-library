<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>试管拧成螺旋</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; max-width: 100%; }
    body {
      min-height: 100%;
      overflow-x: hidden;
      background: #ebe6dc;
      color: #1b3330;
      font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 20px 16px 32px;
      min-width: 0;
    }
    .hint {
      margin: 0 0 12px;
      color: #4d675f;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .card {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
      min-width: 0;
      background: #e7f3ef;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(40, 50, 45, 0.12);
    }
    .stage, .steps { min-width: 0; }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 5 / 6;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .steps {
      padding: 28px 22px 22px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kicker {
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #6d857c;
      font-size: 12px;
      letter-spacing: 0.14em;
    }
    .kicker i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e06a78;
      display: block;
    }
    .step {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      width: 100%;
      margin: 0;
      padding: 14px 8px;
      border: 0;
      border-bottom: 1px solid rgba(27, 51, 48, 0.1);
      background: transparent;
      color: #1b3330;
      text-align: left;
      cursor: pointer;
      opacity: 1;
    }
    .step:last-child { border-bottom: 0; }
    .step.is-dim { opacity: 0.38; }
    .step.is-on { opacity: 1; }
    .mark {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .mark::after {
      content: "";
      width: 8px;
      height: 5px;
      border-left: 2px solid transparent;
      border-bottom: 2px solid transparent;
      transform: rotate(-45deg) translate(1px, -1px);
    }
    .step.is-on .mark {
      background: #0f6e56;
      border-color: #0f6e56;
      color: #fff;
    }
    .step.is-on .mark::after {
      border-left-color: #fff;
      border-bottom-color: #fff;
    }
    .name {
      display: block;
      font-size: 22px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .step.is-on .name { font-weight: 700; }
    .sub {
      display: none;
      margin-top: 4px;
      color: #3e5c54;
      font-size: 14px;
      font-weight: 400;
      overflow-wrap: anywhere;
    }
    .step.is-on .sub { display: block; }
    .step:focus { outline: none; }
    .step:focus-visible {
      outline: 3px solid #08382f;
      outline-offset: 3px;
      border-radius: 12px;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 720px) {
      .wrap { padding: 12px 10px 24px; }
      .card { grid-template-columns: minmax(0, 1fr); border-radius: 20px; }
      .stage { aspect-ratio: 5 / 4; }
      .steps { padding: 8px 12px 16px; }
      .name { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="hint" id="hint">点右侧步骤，左边一排试管拧成螺旋。方向键、Home、End 也能切换。当前步骤高亮，其余变淡。</p>
    <div class="card">
      <div class="stage">
        <canvas id="stage" width="640" height="760" aria-hidden="true"></canvas>
      </div>
      <div class="steps" role="radiogroup" aria-label="步骤" aria-describedby="hint">
        <p class="kicker"><i></i>步骤</p>
        <button type="button" class="step" role="radio" id="step-0" aria-checked="false" tabindex="0">
          <span class="mark" aria-hidden="true"></span>
          <span><span class="name">分装</span><span class="sub" hidden>拧进第一圈</span></span>
        </button>
        <button type="button" class="step" role="radio" id="step-1" aria-checked="false" tabindex="-1">
          <span class="mark" aria-hidden="true"></span>
          <span><span class="name">标记</span><span class="sub" hidden>再转半圈，盖子换边</span></span>
        </button>
        <button type="button" class="step" role="radio" id="step-2" aria-checked="false" tabindex="-1">
          <span class="mark" aria-hidden="true"></span>
          <span><span class="name">封存</span><span class="sub" hidden>收到更紧的一圈</span></span>
        </button>
      </div>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var STEPS = ["分装", "标记", "封存"];
      var PHASES = [0.35, 0.35 + Math.PI * 0.95, 0.35 + Math.PI * 1.9];
      var COUNT = 12;
      var PITCH = 0.58;
      var DUR = 880;
      var CAPS = ["#e06a78", "#2c3336", "#e06a78", "#2c3336"];
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var canvas = document.getElementById("stage");
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".step"));
      var live = document.getElementById("live");
      var state = { spiral: 0, phase: 0 };
      var selected = -1;
      var raf = 0;
      var gen = 0;

      function reduced() { return motion.matches; }

      function stop() {
        gen += 1;
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
      }

      function paintSteps() {
        buttons.forEach(function (btn, i) {
          var on = i === selected;
          btn.classList.toggle("is-on", on);
          btn.classList.toggle("is-dim", selected !== -1 && !on);
          btn.setAttribute("aria-checked", on ? "true" : "false");
          btn.tabIndex = (selected === -1 ? i === 0 : on) ? 0 : -1;
          var sub = btn.querySelector(".sub");
          if (sub) sub.hidden = !on;
        });
      }

      function announce() {
        if (selected < 0) return;
        live.textContent = "当前是" + STEPS[selected] + "。试管已拧成螺旋。其余步骤变淡。";
      }

      function capsule(ctx, len, thick) {
        var r = thick / 2;
        var hw = Math.max(len, thick) / 2;
        ctx.beginPath();
        ctx.moveTo(-hw + r, -r);
        ctx.lineTo(hw - r, -r);
        ctx.arc(hw - r, 0, r, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(-hw + r, r);
        ctx.arc(-hw + r, 0, r, Math.PI / 2, Math.PI * 1.5);
        ctx.closePath();
        return hw;
      }

      function drawTube(ctx, len, thick, capColor, face, showMouth, angle) {
        var r = thick / 2;
        var hw = capsule(ctx, len, thick);
        var ySign = Math.cos(angle) >= 0 ? 1 : -1;
        var glass = ctx.createLinearGradient(0, -r * ySign, 0, r * ySign);
        glass.addColorStop(0, "#ffffff");
        glass.addColorStop(0.48, "#f7fbfa");
        glass.addColorStop(1, "#d7e2de");
        ctx.fillStyle = glass;
        ctx.fill();
        ctx.lineWidth = 1.1;
        ctx.strokeStyle = "rgba(80, 104, 98, 0.35)";
        ctx.stroke();
        var cap = Math.min(r * 1.05, Math.max(r * 0.78, hw * 0.2));
        ctx.beginPath();
        ctx.moveTo(hw - cap, -r + 0.6);
        ctx.lineTo(hw - r, -r + 0.6);
        ctx.arc(hw - r, 0, r - 0.6, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(hw - cap, r - 0.6);
        ctx.closePath();
        ctx.fillStyle = capColor;
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(hw - cap, -r + 1.2);
        ctx.lineTo(hw - cap, r - 1.2);
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 1.3;
        ctx.stroke();
        if (showMouth && face < 0.38) {
          ctx.beginPath();
          ctx.arc(hw - r, 0, r * 0.55, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.45)";
          ctx.fill();
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = "rgba(90, 112, 106, 0.4)";
          ctx.stroke();
        }
      }

      function draw() {
        var rect = canvas.getBoundingClientRect();
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var bw = Math.max(1, Math.round(rect.width * dpr));
        var bh = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== bw || canvas.height !== bh) {
          canvas.width = bw;
          canvas.height = bh;
        }
        var ctx = canvas.getContext("2d");
        var w = rect.width;
        var h = rect.height;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        if (w < 2 || h < 2) return;
        ctx.fillStyle = "#e7f3ef";
        ctx.fillRect(0, 0, w, h);

        var k = state.spiral;
        var cx = w * 0.48;
        var cy = h * 0.5;
        var thick = Math.max(13, Math.min(w * 0.05, 26));
        var spacing = Math.min(Math.max(thick * 1.25, w * 0.045), (w - thick) / (COUNT - 1));
        var radius = Math.min(w * 0.13, thick * 2.6);
        var rackLen = Math.min(h * 0.46, thick * 8.2);
        var fullLen = Math.max(thick + 10, Math.min(w - 36, 340));
        var gap = Math.min(thick * 1.05, (h * 0.74) / (COUNT - 1));
        var tubes = [];
        var i;
        for (i = 0; i < COUNT; i++) {
          var u = i - (COUNT - 1) / 2;
          var theta = state.phase + u * PITCH;
          var s = Math.sin(theta);
          var c = Math.cos(theta);
          var face = Math.abs(c);
          var side = c >= 0 ? 0 : -Math.PI;
          var rackX = cx + u * spacing;
          var rackY = cy;
          var helixX = cx + s * radius;
          var helixY = cy + u * gap;
          var len = rackLen + ((thick + (fullLen - thick) * face) - rackLen) * k;
          var persp = 1 - (i / (COUNT - 1)) * 0.12 * k;
          var depth = (c + 1) / 2;
          var angle = -Math.PI / 2 * (1 - k) + side * k + s * 0.045 * k;
          tubes.push({
            i: i,
            z: k * c + (1 - k) * (i * 0.001),
            x: rackX + (helixX - rackX) * k,
            y: rackY + (helixY - rackY) * k,
            len: Math.max(thick, len) * persp,
            thick: thick * (0.9 + 0.18 * (1 - k + k * depth)) * persp,
            angle: angle,
            face: face,
            alpha: 0.98 + (0.62 + 0.38 * depth - 0.98) * k,
            cap: CAPS[i % CAPS.length],
            mouth: k > 0.72 && face < 0.38
          });
        }
        tubes.sort(function (a, b) { return a.z - b.z; });
        tubes.forEach(function (tube) {
          var along = Math.abs(Math.sin(tube.angle));
          var across = Math.abs(Math.cos(tube.angle));
          ctx.save();
          ctx.translate(tube.x, tube.y + tube.thick * 0.55 + tube.len * along * 0.48);
          ctx.scale(1, 0.32);
          ctx.globalAlpha = 0.14 * tube.alpha;
          ctx.fillStyle = "#1c3330";
          ctx.beginPath();
          ctx.ellipse(0, 0, tube.len * across * 0.42 + tube.thick * 0.7, tube.thick, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.translate(tube.x, tube.y);
          ctx.rotate(tube.angle);
          ctx.globalAlpha = Math.max(0.35, Math.min(1, tube.alpha));
          drawTube(ctx, tube.len, tube.thick, tube.cap, tube.face, tube.mouth, tube.angle);
          ctx.restore();
        });

        if (k > 0.05) {
          var fade = ctx.createLinearGradient(0, h * 0.78, 0, h);
          fade.addColorStop(0, "rgba(231, 243, 239, 0)");
          fade.addColorStop(1, "rgba(231, 243, 239, " + (0.92 * k) + ")");
          ctx.globalAlpha = 1;
          ctx.fillStyle = fade;
          ctx.fillRect(0, h * 0.78, w, h * 0.22);
        }
      }

      function go(index) {
        if (index < 0 || index >= STEPS.length) return;
        selected = index;
        paintSteps();
        announce();
        var toS = 1;
        var toP = PHASES[index];
        if (reduced()) {
          stop();
          state.spiral = toS;
          state.phase = toP;
          draw();
          return;
        }
        var fromS = state.spiral;
        var fromP = state.phase;
        stop();
        if (fromS === toS && fromP === toP) {
          draw();
          return;
        }
        var id = ++gen;
        var t0 = performance.now();
        function frame(now) {
          if (id !== gen) return;
          var t = Math.min(1, (now - t0) / DUR);
          var e = 1 - Math.pow(1 - t, 3);
          state.spiral = fromS + (toS - fromS) * e;
          state.phase = fromP + (toP - fromP) * e;
          draw();
          if (t < 1) raf = requestAnimationFrame(frame);
          else raf = 0;
        }
        raf = requestAnimationFrame(frame);
      }

      function focusStep(index) {
        var btn = buttons[index];
        if (!btn) return;
        try { btn.focus({ preventScroll: true }); }
        catch (err) { btn.focus(); }
      }

      buttons.forEach(function (btn, i) {
        btn.addEventListener("click", function () {
          go(i);
          focusStep(i);
        });
        btn.addEventListener("keydown", function (e) {
          var next = null;
          if (e.key === "ArrowDown" || e.key === "ArrowRight") next = (i + 1) % STEPS.length;
          else if (e.key === "ArrowUp" || e.key === "ArrowLeft") next = (i - 1 + STEPS.length) % STEPS.length;
          else if (e.key === "Home") next = 0;
          else if (e.key === "End") next = STEPS.length - 1;
          if (next === null) return;
          e.preventDefault();
          go(next);
          focusStep(next);
        });
      });

      function onReduce() {
        stop();
        if (reduced() && selected >= 0) {
          state.spiral = 1;
          state.phase = PHASES[selected];
        }
        draw();
      }
      if (motion.addEventListener) motion.addEventListener("change", onReduce);
      else if (motion.addListener) motion.addListener(onReduce);
      window.addEventListener("resize", function () { draw(); });

      paintSteps();
      draw();
      window.addEventListener("load", function () { draw(); });
    })();
  </script>
</body>
</html>
