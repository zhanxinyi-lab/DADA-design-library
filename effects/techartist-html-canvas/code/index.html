<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML in Canvas</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #1c2433;
    background: #d9dee8;
  }
  .app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 30%, #f7f8fb 0%, #e6eaf1 52%, #d5dae3 100%);
  }
  .bar {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
  }
  .bar.top { padding-bottom: 0; }
  .bar.bot { padding-top: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .pill {
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    background: #fff;
    border-radius: 999px;
    padding: 7px 14px 7px 9px;
    box-shadow: 0 8px 22px rgba(20, 30, 50, .08), 0 0 0 1px rgba(20, 30, 50, .05);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.2;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: #e39b12;
    box-shadow: 0 0 0 4px rgba(227, 155, 18, .16);
  }
  .dot.ok { background: #1f9d55; box-shadow: 0 0 0 4px rgba(31, 157, 85, .16); }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 650;
    color: #1c2433;
    background: #fff;
    border: 1px solid #d5dae3;
    border-radius: 999px;
    min-height: 44px;
    min-width: 92px;
    padding: 0 18px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  button:hover { background: #f5f7fb; }
  button:focus-visible, .stage:focus-visible { outline: 3px solid #2457d6; outline-offset: 3px; }
  .hint { margin: 0; font-size: 12px; line-height: 1.35; color: #5c6578; text-align: center; }
  .fit { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 960px;
    height: 640px;
    margin: -320px 0 0 -480px;
    transform-origin: center center;
    border-radius: 20px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 36%, #fbfcfe 0%, #eef1f6 46%, #dfe4ed 100%);
  }
  .stage:focus { outline: none; }
  .stage:focus-visible { outline: 3px solid #2457d6; outline-offset: 0; }
  .desk {
    position: absolute;
    left: -180px; right: -180px; top: 286px; height: 760px;
    background-color: #e3e8f0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .7) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .7) 1px, transparent 1px);
    background-size: 72px 72px;
    transform: perspective(760px) rotateX(64deg);
    transform-origin: 50% 0;
    z-index: 0;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(14px); z-index: 1; background: rgba(36, 48, 70, .16); }
  .blob.board { left: 168px; top: 418px; width: 400px; height: 34px; }
  .blob.base { left: 612px; top: 548px; width: 180px; height: 26px; }
  .rig { position: absolute; left: 112px; top: 34px; width: 508px; z-index: 2; }
  .bezel {
    background: linear-gradient(#fcfdff, #e7ebf1);
    border-radius: 22px;
    padding: 12px 12px 14px;
    box-shadow: 0 22px 40px rgba(28, 40, 64, .16), inset 0 0 0 1px rgba(255, 255, 255, .85);
  }
  .page {
    height: 332px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 0 0 1px #e5e9f0;
  }
  .chrome {
    height: 22px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 10px;
    border-bottom: 1px solid #eef1f5;
    background: #fbfcfe;
  }
  .chrome span { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .chrome span:nth-child(1) { background: #ff5f57; }
  .chrome span:nth-child(2) { background: #febc2e; }
  .chrome span:nth-child(3) { background: #28c840; }
  .cols { flex: 1; min-height: 0; display: flex; }
  .sidebar {
    width: 104px;
    flex: none;
    background: #f4f6fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 8px 10px;
    gap: 6px;
  }
  .mark { display: grid; grid-template-columns: 16px 16px; gap: 4px; margin-bottom: 6px; }
  .mark i { width: 16px; height: 16px; border-radius: 4px; display: block; }
  .mark i:nth-child(1) { background: #ef7d6d; }
  .mark i:nth-child(2) { background: #f0c14a; }
  .mark i:nth-child(3) { background: #5b8def; }
  .mark i:nth-child(4) { background: #3cbaa2; }
  .nav {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 8px;
    color: #5d6778;
    font-size: 10px;
    font-weight: 650;
  }
  .nav.on { background: #e6eefc; color: #1d3f86; }
  .ic { width: 14px; height: 14px; flex: none; position: relative; }
  .ic.grid { background:
    linear-gradient(#5d6778, #5d6778) 0 0 / 6px 6px no-repeat,
    linear-gradient(#5d6778, #5d6778) 8px 0 / 6px 6px no-repeat,
    linear-gradient(#5d6778, #5d6778) 0 8px / 6px 6px no-repeat,
    linear-gradient(#5d6778, #5d6778) 8px 8px / 6px 6px no-repeat;
  }
  .nav.on .ic.grid { background:
    linear-gradient(#1d3f86, #1d3f86) 0 0 / 6px 6px no-repeat,
    linear-gradient(#1d3f86, #1d3f86) 8px 0 / 6px 6px no-repeat,
    linear-gradient(#1d3f86, #1d3f86) 0 8px / 6px 6px no-repeat,
    linear-gradient(#1d3f86, #1d3f86) 8px 8px / 6px 6px no-repeat;
  }
  .ic.bars { background:
    linear-gradient(#5d6778, #5d6778) 0 6px / 3px 8px no-repeat,
    linear-gradient(#5d6778, #5d6778) 5px 2px / 3px 12px no-repeat,
    linear-gradient(#5d6778, #5d6778) 10px 4px / 3px 10px no-repeat;
  }
  .ic.dot { border: 2px solid #5d6778; border-radius: 50%; }
  .ic.ring { border: 2px solid #5d6778; border-radius: 50%; box-shadow: inset 0 0 0 2px #f4f6fa, inset 0 0 0 4px #5d6778; }
  .avatar {
    margin-top: auto;
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(#d5e2f8, #7f9ed4);
    position: relative;
  }
  .avatar::before {
    content: "";
    position: absolute; left: 9px; top: 5px; width: 10px; height: 10px;
    border-radius: 50%; background: #fff;
  }
  .avatar::after {
    content: "";
    position: absolute; left: 6px; bottom: 3px; width: 16px; height: 8px;
    border-radius: 8px 8px 2px 2px; background: #fff;
  }
  .main { flex: 1; min-width: 0; padding: 14px 12px 12px; display: flex; flex-direction: column; }
  .kicker { margin: 0 0 3px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #8b93a3; font-weight: 700; }
  .display {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    font-size: 38px; line-height: .95; font-weight: 500; letter-spacing: -.03em; color: #1a2744;
  }
  .headline { margin-bottom: 12px; }
  .cards { display: flex; gap: 8px; flex: 1; min-height: 0; }
  .card {
    flex: 1; min-width: 0;
    border: 1px solid #e6eaf1;
    border-radius: 12px;
    padding: 8px 8px 6px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 16px rgba(28, 40, 64, .04);
    background: #fff;
  }
  .card h2 { margin: 0 0 6px; font-size: 12px; font-weight: 700; }
  .chart { flex: 1; min-height: 64px; display: flex; align-items: flex-end; gap: 4px; }
  .chart i, .mbars span {
    flex: 1; display: block; border-radius: 2px 2px 0 0; background: #2c4c86; min-height: 4px;
  }
  .chart i:nth-child(2n), .mbars span:nth-child(2n) { background: #9bb6e2; }
  .rail {
    width: 116px; flex: none;
    border-left: 1px solid #e8ecf2;
    background: #fcfdff;
    padding: 12px 8px 8px;
    display: flex; flex-direction: column; align-items: center;
  }
  .rail-label { margin: 0; font-size: 12px; line-height: 1.25; font-weight: 750; text-align: center; }
  .pct { margin-top: 4px; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .vtrack {
    width: 10px; height: 104px; margin: 8px 0 10px;
    background: #e6eaf1; border-radius: 99px; position: relative; overflow: hidden;
  }
  .vfill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: linear-gradient(#8eb0ff, #2457d6);
    border-radius: 99px;
  }
  .checks { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .checks li { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5c6578; }
  .checks li.done { color: #1c2433; }
  .box {
    width: 12px; height: 12px; flex: none;
    border: 1.5px solid #c5cad6; border-radius: 3px;
    display: inline-grid; place-items: center;
  }
  .done .box { background: #2457d6; border-color: #2457d6; }
  .done .box::after {
    content: "";
    width: 6px; height: 3px;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(0, -1px);
  }
  .piece { opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .4s ease; }
  .piece.show { opacity: 1; transform: none; }
  .stand { position: relative; height: 112px; }
  .leg {
    position: absolute; top: 0; width: 8px; height: 96px;
    background: linear-gradient(#d7dde6, #8d97a6);
    border-radius: 4px;
  }
  .leg.l { left: 86px; transform: rotate(8deg); transform-origin: top center; }
  .leg.r { right: 86px; transform: rotate(-8deg); transform-origin: top center; }
  .foot {
    position: absolute; left: 46px; right: 46px; bottom: 8px; height: 8px;
    background: #7f8998; border-radius: 4px;
  }
  #robot { position: absolute; width: 0; height: 0; z-index: 5; filter: drop-shadow(10px 16px 8px rgba(20, 28, 40, .18)); }
  .seg { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #seg2 { top: var(--l1); }
  #seg3 { top: var(--l2); }
  .bone {
    position: absolute; top: 0; left: 0;
    width: var(--bw); height: var(--bl);
    transform: translateX(-50%);
    border-radius: 999px;
    background: linear-gradient(90deg, #7f8998 0%, #d9e0e8 14%, #ffffff 40%, #f3f5f8 55%, #c3cad4 80%, #7d8796 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .85), 0 0 0 1px #667182;
  }
  .b1 { --bw: 62px; --bl: var(--l1); }
  .b2 { --bw: 50px; --bl: var(--l2); }
  .b3 { --bw: 34px; --bl: var(--l3); }
  .bone::before, .bone::after { content: ""; position: absolute; border-radius: 4px; }
  .bone::before { top: 16px; bottom: 16px; right: 8px; width: 3px; background: linear-gradient(#9ec4ff, #2f6fe4); }
  .bone::after { top: 18px; bottom: 18px; left: 8px; width: 5px; background: #232833; opacity: .5; }
  .joint {
    position: absolute; left: 0; top: 0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    background:
      radial-gradient(circle at 50% 50%, #141820 0 30%, #2f7bff 32% 48%, #f4f7fb 50% 66%, #aeb6c2 68% 100%);
    box-shadow: 0 0 0 2px #1d4ed8, 0 8px 14px rgba(0, 0, 0, .22);
  }
  .j-shoulder { width: 76px; height: 76px; z-index: 4; }
  .j-elbow { width: 62px; height: 62px; }
  .j-wrist { width: 44px; height: 44px; }
  .pedestal { position: absolute; left: -78px; top: 20px; width: 156px; z-index: 0; }
  .ped-neck {
    width: 84px; height: 46px; margin: 0 auto;
    background: linear-gradient(90deg, #2a303a, #555d6c 42%, #171a20 72%);
    border-radius: 0 0 12px 12px;
  }
  .ped-base {
    width: 156px; height: 26px; margin-top: -2px;
    border-radius: 7px;
    background:
      radial-gradient(circle at 18px 50%, #c5ccd6 0 3px, transparent 4px),
      radial-gradient(circle at 138px 50%, #c5ccd6 0 3px, transparent 4px),
      linear-gradient(#3a4150, #101218);
    box-shadow: 0 14px 18px rgba(0, 0, 0, .25);
  }
  #gripper { position: absolute; left: 0; top: var(--l3); width: 0; height: 0; }
  .palm {
    position: absolute; left: -48px; top: -16px; width: 96px; height: 12px;
    background: #1b1e26; border-radius: 6px;
  }
  .claw {
    position: absolute; top: -8px; width: 14px; height: 84px;
    border-radius: 7px;
    background: linear-gradient(#3a4150, #12141a);
    box-shadow: inset -3px 0 0 rgba(255, 255, 255, .12);
    transform-origin: 50% 8px;
  }
  .claw.l { left: -60px; transform: rotate(calc((1 - var(--grip)) * 22deg)); }
  .claw.r { left: 46px; transform: rotate(calc((1 - var(--grip)) * -22deg)); }
  .modcard {
    width: 126px; height: 78px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 12px 22px rgba(24, 32, 48, .18), 0 0 0 1px rgba(20, 28, 40, .06);
    padding: 8px 8px 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .modcard strong { font-size: 12px; line-height: 1; }
  .mbars { flex: 1; display: flex; align-items: flex-end; gap: 4px; }
  #cargo { position: absolute; left: -63px; top: 4px; transform-origin: 50% 50%; }
  #waiting { position: absolute; z-index: 4; transform: translate(-50%, -50%); }
  .off { display: none !important; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 420px) {
    .pill { font-size: 12px; }
    .hint { font-size: 11px; }
    .bar { padding: 8px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .piece { opacity: 1 !important; transform: none !important; }
    .vfill { height: 100% !important; }
    .checks li { color: #1c2433; }
    .checks li .box { background: #2457d6; border-color: #2457d6; }
    .checks li .box::after {
      content: "";
      width: 6px; height: 3px;
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(0, -1px);
    }
  }
</style>
</head>
<body>
  <div class="app">
    <h1 class="sr">HTML in Canvas</h1>
    <header class="bar top">
      <p class="pill" id="status" role="status" aria-live="polite"><span class="dot" id="dot" aria-hidden="true"></span><span id="status-text">Reaching in</span></p>
    </header>
    <div class="fit" id="fit">
      <div class="stage" id="stage" tabindex="0" role="application" aria-label="Robot arm assembling a dashboard on a white board">
        <div class="desk" aria-hidden="true"></div>
        <div class="blob board" aria-hidden="true"></div>
        <div class="blob base" aria-hidden="true"></div>
        <div class="rig">
          <div class="bezel">
            <div class="page">
              <div class="chrome" aria-hidden="true"><span></span><span></span><span></span></div>
              <div class="cols">
                <div class="sidebar piece" id="piece-sidebar">
                  <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                  <div class="nav on"><i class="ic grid" aria-hidden="true"></i><span>Overview</span></div>
                  <div class="nav"><i class="ic bars" aria-hidden="true"></i><span>Activity</span></div>
                  <div class="nav"><i class="ic dot" aria-hidden="true"></i><span>Reports</span></div>
                  <div class="nav"><i class="ic ring" aria-hidden="true"></i><span>Settings</span></div>
                  <div class="avatar" role="img" aria-label="Profile"></div>
                </div>
                <div class="main">
                  <div class="headline piece" id="piece-header">
                    <p class="kicker">Overview</p>
                    <p class="display">Dashboard</p>
                  </div>
                  <div class="cards">
                    <article class="card piece" id="piece-charts">
                      <h2>Visitors</h2>
                      <div class="chart" aria-hidden="true"><i style="height:42%"></i><i style="height:68%"></i><i style="height:54%"></i><i style="height:86%"></i><i style="height:62%"></i></div>
                    </article>
                    <article class="card piece" id="piece-summary">
                      <h2>Workload</h2>
                      <div class="chart" aria-hidden="true"><i style="height:58%"></i><i style="height:40%"></i><i style="height:76%"></i><i style="height:64%"></i><i style="height:88%"></i></div>
                    </article>
                  </div>
                </div>
                <aside class="rail">
                  <p class="rail-label" id="rail-label">Building interface</p>
                  <div class="pct" id="pct">0%</div>
                  <div class="vtrack" id="meter" role="progressbar" aria-labelledby="rail-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 percent">
                    <div class="vfill" id="vfill"></div>
                  </div>
                  <ul class="checks" id="checks">
                    <li><span class="box" aria-hidden="true"></span>Sidebar</li>
                    <li><span class="box" aria-hidden="true"></span>Header</li>
                    <li><span class="box" aria-hidden="true"></span>Charts</li>
                    <li><span class="box" aria-hidden="true"></span>Summary</li>
                  </ul>
                </aside>
              </div>
            </div>
          </div>
          <div class="stand" aria-hidden="true"><div class="leg l"></div><div class="leg r"></div><div class="foot"></div></div>
        </div>
        <div id="waiting" class="modcard off" aria-hidden="true"></div>
        <div id="robot" aria-hidden="true">
          <div class="pedestal"><div class="ped-neck"></div><div class="ped-base"></div></div>
          <div class="seg" id="seg1">
            <div class="bone b1"></div>
            <div class="seg" id="seg2">
              <div class="joint j-elbow"></div>
              <div class="bone b2"></div>
              <div class="seg" id="seg3">
                <div class="joint j-wrist"></div>
                <div class="bone b3"></div>
                <div id="gripper">
                  <div class="palm"></div>
                  <div class="claw l"></div>
                  <div class="claw r"></div>
                  <div id="cargo" class="modcard off"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="joint j-shoulder"></div>
        </div>
      </div>
    </div>
    <footer class="bar bot">
      <div class="controls">
        <button type="button" id="btn-play">Pause</button>
        <button type="button" id="btn-replay">Replay</button>
      </div>
      <p class="hint">Space or K plays or pauses. R replays.</p>
    </footer>
  </div>
<script>
(function () {
  var DURATION = 15000;
  var SHOULDER = { x: 690, y: 478 };
  var L1 = 320, L2 = 300, L3 = 46, CARD = 43;
  var POSES = {
    park: { x: 660, y: 160 },
    supply: { x: 455, y: 468 },
    drop0: { x: 250, y: 255 },
    drop1: { x: 400, y: 160 },
    drop2: { x: 400, y: 305 },
    drop3: { x: 520, y: 315 }
  };
  var MODULES = [
    { id: "sidebar", name: "Sidebar", bars: [46, 72, 55, 84, 63] },
    { id: "header", name: "Header", bars: [38, 66, 48, 80, 54] },
    { id: "charts", name: "Charts", bars: [52, 78, 60, 92, 70] },
    { id: "summary", name: "Summary", bars: [44, 62, 86, 58, 74] }
  ];
  var cues = [
    { t: 0, pose: "park", grip: 0, hold: null, placed: 0, status: "Reaching in" },
    { t: 1.35, pose: "supply", grip: 0, hold: null, placed: 0, status: "Reaching in" },
    { t: 1.85, pose: "supply", grip: 1, hold: 0, placed: 0, status: "Caught it" },
    { t: 3.45, pose: "drop0", grip: 1, hold: 0, placed: 0, status: "Placing the module" },
    { t: 4.05, pose: "drop0", grip: 0, hold: null, placed: 1, status: "Placing the module" },
    { t: 4.85, pose: "supply", grip: 0, hold: null, placed: 1, status: "Reaching in" },
    { t: 5.35, pose: "supply", grip: 1, hold: 1, placed: 1, status: "Caught it" },
    { t: 6.95, pose: "drop1", grip: 1, hold: 1, placed: 1, status: "Placing the module" },
    { t: 7.5, pose: "drop1", grip: 0, hold: null, placed: 2, status: "Placing the module" },
    { t: 8.3, pose: "supply", grip: 0, hold: null, placed: 2, status: "Reaching in" },
    { t: 8.8, pose: "supply", grip: 1, hold: 2, placed: 2, status: "Caught it" },
    { t: 10.25, pose: "drop2", grip: 1, hold: 2, placed: 2, status: "Placing the module" },
    { t: 10.8, pose: "drop2", grip: 0, hold: null, placed: 3, status: "Placing the module" },
    { t: 11.55, pose: "supply", grip: 0, hold: null, placed: 3, status: "Reaching in" },
    { t: 12.05, pose: "supply", grip: 1, hold: 3, placed: 3, status: "Caught it" },
    { t: 13.45, pose: "drop3", grip: 1, hold: 3, placed: 3, status: "Placing the module" },
    { t: 13.95, pose: "drop3", grip: 0, hold: null, placed: 4, status: "Page complete" },
    { t: 15, pose: "park", grip: 0, hold: null, placed: 4, status: "Page complete" }
  ];

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var fit = document.getElementById("fit");
  var stage = document.getElementById("stage");
  var robot = document.getElementById("robot");
  var seg1 = document.getElementById("seg1");
  var seg2 = document.getElementById("seg2");
  var seg3 = document.getElementById("seg3");
  var gripper = document.getElementById("gripper");
  var cargo = document.getElementById("cargo");
  var waiting = document.getElementById("waiting");
  var statusText = document.getElementById("status-text");
  var dot = document.getElementById("dot");
  var pct = document.getElementById("pct");
  var meter = document.getElementById("meter");
  var vfill = document.getElementById("vfill");
  var btnPlay = document.getElementById("btn-play");
  var btnReplay = document.getElementById("btn-replay");
  var pieces = [
    document.getElementById("piece-sidebar"),
    document.getElementById("piece-header"),
    document.getElementById("piece-charts"),
    document.getElementById("piece-summary")
  ];
  var checks = Array.prototype.slice.call(document.querySelectorAll("#checks li"));

  robot.style.left = SHOULDER.x + "px";
  robot.style.top = SHOULDER.y + "px";
  robot.style.setProperty("--l1", L1 + "px");
  robot.style.setProperty("--l2", L2 + "px");
  robot.style.setProperty("--l3", L3 + "px");
  gripper.style.setProperty("--grip", "0");
  waiting.style.left = POSES.supply.x + "px";
  waiting.style.top = POSES.supply.y + "px";

  var t = 0;
  var shown = 0;
  var playing = false;
  var raf = 0;
  var last = 0;

  function smooth(u) {
    if (u < 0) u = 0;
    if (u > 1) u = 1;
    return u * u * (3 - 2 * u);
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function deg(rad) { return rad * 180 / Math.PI; }

  function cardHTML(mod) {
    var bars = mod.bars.map(function (h) { return "<span style=\"height:" + h + "%\"></span>"; }).join("");
    return "<strong>" + mod.name + "</strong><div class=\"mbars\">" + bars + "</div>";
  }
  function paintCard(el, mod) {
    if (el.getAttribute("data-mod") === mod.id) return;
    el.setAttribute("data-mod", mod.id);
    el.innerHTML = cardHTML(mod);
  }

  function sample(time) {
    var i = 0;
    while (i < cues.length - 1 && cues[i + 1].t <= time) i += 1;
    var a = cues[i];
    var b = cues[i + 1] || a;
    var span = b.t - a.t;
    var u = span <= 0.0001 ? 0 : smooth((time - a.t) / span);
    var pa = POSES[a.pose];
    var pb = POSES[b.pose];
    return {
      x: lerp(pa.x, pb.x, u),
      y: lerp(pa.y, pb.y, u),
      grip: lerp(a.grip, b.grip, u),
      hold: a.hold,
      placed: a.placed,
      status: a.status
    };
  }

  function solve(tx, ty) {
    var tilt = (tx - SHOULDER.x) / 1000;
    if (tilt > 0.22) tilt = 0.22;
    if (tilt < -0.22) tilt = -0.22;
    var theta = tilt;
    var along = L3 + CARD;
    var dx = -Math.sin(theta) * along;
    var dy = Math.cos(theta) * along;
    var x = tx - dx - SHOULDER.x;
    var y = ty - dy - SHOULDER.y;
    var dist = Math.hypot(x, y) || 0.001;
    var max = L1 + L2 - 2;
    var min = Math.abs(L1 - L2) + 2;
    if (dist > max) {
      var sMax = max / dist;
      x *= sMax; y *= sMax; dist = max;
    } else if (dist < min) {
      var sMin = min / dist;
      x *= sMin; y *= sMin; dist = min;
    }
    var phi = Math.atan2(-x, y);
    var cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    if (cosA > 1) cosA = 1;
    if (cosA < -1) cosA = -1;
    var ang = Math.acos(cosA);
    var cands = [phi + ang, phi - ang];
    var j1 = cands[0];
    var bestEy = Infinity;
    for (var n = 0; n < cands.length; n += 1) {
      var ey = Math.cos(cands[n]) * L1;
      if (ey < bestEy) { bestEy = ey; j1 = cands[n]; }
    }
    var ex = -Math.sin(j1) * L1;
    var ey2 = Math.cos(j1) * L1;
    var j2abs = Math.atan2(-(x - ex), y - ey2);
    var j2 = Math.atan2(Math.sin(j2abs - j1), Math.cos(j2abs - j1));
    return { j1: j1, j2: j2, j3: theta - j1 - j2 };
  }

  function renderAt(ms, snap) {
    var time = ms / 1000;
    if (time > 15) time = 15;
    var s = sample(time);
    var arm = solve(s.x, s.y);
    seg1.style.transform = "rotate(" + deg(arm.j1) + "deg)";
    seg2.style.transform = "rotate(" + deg(arm.j2) + "deg)";
    seg3.style.transform = "rotate(" + deg(arm.j3) + "deg)";
    gripper.style.setProperty("--grip", String(s.grip));
    var world = arm.j1 + arm.j2 + arm.j3;
    cargo.style.transform = "rotate(" + deg(-world) + "deg)";
    var holding = s.hold !== null;
    cargo.classList.toggle("off", !holding);
    if (holding) paintCard(cargo, MODULES[s.hold]);
    var showWait = !holding && s.placed < MODULES.length;
    waiting.classList.toggle("off", !showWait);
    if (showWait) paintCard(waiting, MODULES[s.placed]);
    for (var i = 0; i < pieces.length; i += 1) {
      var on = i < s.placed;
      pieces[i].classList.toggle("show", on);
      pieces[i].setAttribute("aria-hidden", on ? "false" : "true");
      checks[i].classList.toggle("done", on);
    }
    var target = s.placed * 25;
    if (snap) shown = target;
    else {
      shown += (target - shown) * 0.22;
      if (Math.abs(target - shown) < 0.4) shown = target;
    }
    var rounded = Math.round(shown);
    pct.textContent = rounded + "%";
    if (!reduce.matches) vfill.style.height = shown + "%";
    meter.setAttribute("aria-valuenow", String(rounded));
    meter.setAttribute("aria-valuetext", rounded + " percent");
    if (statusText.textContent !== s.status) statusText.textContent = s.status;
    dot.className = s.placed >= 4 ? "dot ok" : "dot";
    return Math.abs(target - shown) > 0.4;
  }

  function syncBtn() {
    var label = playing ? "Pause" : "Play";
    if (btnPlay.textContent !== label) btnPlay.textContent = label;
    btnPlay.setAttribute("aria-pressed", playing ? "true" : "false");
  }

  function requestTick() {
    if (!raf) raf = window.requestAnimationFrame(frame);
  }

  function frame(now) {
    raf = 0;
    if (!last) last = now;
    var dt = now - last;
    if (dt > 34) dt = 34;
    if (dt < 0) dt = 0;
    last = now;
    if (playing) {
      t += dt;
      if (t >= DURATION) {
        t = DURATION;
        playing = false;
        syncBtn();
      }
    }
    var easing = renderAt(t, false);
    if (playing || easing) requestTick();
  }

  function showDone() {
    playing = false;
    t = DURATION;
    shown = 100;
    renderAt(DURATION, true);
    syncBtn();
  }

  function replay() {
    if (reduce.matches) { showDone(); return; }
    t = 0;
    shown = 0;
    playing = true;
    last = 0;
    renderAt(0, true);
    syncBtn();
    requestTick();
  }

  function togglePlay() {
    if (reduce.matches) { showDone(); return; }
    if (!playing && t >= DURATION) { replay(); return; }
    playing = !playing;
    if (playing) last = 0;
    syncBtn();
    if (playing) requestTick();
  }

  function layout() {
    var rect = fit.getBoundingClientRect();
    var s = Math.min(rect.width / 960, rect.height / 640);
    if (!isFinite(s) || s <= 0) s = 0.2;
    stage.style.transform = "scale(" + s + ")";
  }

  btnPlay.addEventListener("click", togglePlay);
  btnReplay.addEventListener("click", replay);
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var onBtn = e.target && e.target.closest && e.target.closest("button");
    if (e.key === "Enter") return;
    if ((e.key === " " || e.key === "Spacebar") && onBtn) return;
    if (e.key === " " || e.key === "Spacebar" || e.key === "k" || e.key === "K") {
      e.preventDefault();
      togglePlay();
    } else if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      replay();
    }
  });
  window.addEventListener("resize", layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(fit);
  if (reduce.addEventListener) {
    reduce.addEventListener("change", function () {
      if (reduce.matches) showDone();
      else replay();
    });
  }
  layout();
  if (reduce.matches) showDone();
  else {
    playing = true;
    renderAt(0, true);
    syncBtn();
    requestTick();
  }
})();
</script>
</body>
</html>
