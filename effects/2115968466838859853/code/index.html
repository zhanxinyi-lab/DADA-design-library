*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f4f5f3}.wall{width:100%;height:100%;padding:clamp(5px,1.4vw,14px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:clamp(4px,.8vw,8px);background:#101216}.panel{position:relative;overflow:hidden;border-radius:4px;transition:background .65s;color:#fff}.label{position:absolute;left:10px;top:8px;z-index:5;font:8px ui-monospace,monospace;letter-spacing:.12em;color:#aab0b4;opacity:.75}.books{background:#f1f0ed;color:#242527;padding:23px 8px 8px;display:flex;gap:3px;align-items:stretch;justify-content:center;perspective:500px}.book{width:9%;max-width:55px;border-radius:2px 4px 4px 2px;background:var(--book);box-shadow:inset 3px 0 #0002,2px 2px 3px #0003;position:relative;transform:rotateY(-5deg);display:flex;align-items:center;justify-content:center;transition:transform .6s,width .6s}.book span{font:700 clamp(5px,.75vw,9px) ui-monospace,monospace;writing-mode:vertical-rl;letter-spacing:.08em;color:var(--ink,#fff);overflow:hidden}.book.feature{width:13%;transform:translateY(-4px) rotateY(-7deg);box-shadow:inset 3px 0 #0003,4px 6px 8px #0003}.book:after{content:"";position:absolute;left:5px;right:3px;top:5px;height:2px;background:#fff5}.water{background:#050b1d}.water canvas{width:100%;height:100%;display:block}.waterTitle{position:absolute;left:10%;bottom:16%;z-index:2;font:clamp(11px,2vw,23px)/1.05 Georgia,serif;letter-spacing:-.04em;color:#edf6ff;max-width:55%;text-shadow:0 3px 12px #001}.waterTitle small{display:block;font:7px ui-monospace,monospace;letter-spacing:.16em;color:#85a5d7;margin-bottom:7px}.kin{background:#040507;display:grid;place-items:center}.kin:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 83%,#697c71 0,#25342f 20%,transparent 42%)}.kin h2{position:absolute;z-index:3;left:8%;top:26%;font-size:clamp(16px,3vw,32px);letter-spacing:-.06em;margin:0;font-weight:650;color:#fff}.kin h2 span{color:transparent;-webkit-text-stroke:1px #e5eee5}.wireface{height:72%;width:38%;position:absolute;left:51%;bottom:-2%;border-radius:46% 46% 20% 20%;background:repeating-linear-gradient(0deg,transparent 0 6px,#d8ffda99 7px,#d8ffda99 8px),repeating-linear-gradient(90deg,transparent 0 8px,#d8ffda66 9px,#d8ffda66 10px),linear-gradient(110deg,#1d302a,#d8e2d2,#192821);clip-path:polygon(23% 0,76% 0,95% 35%,83% 74%,73% 100%,17% 100%,7% 54%);filter:drop-shadow(0 0 8px #cfffdf88);animation:scan 2s ease-in-out infinite alternate}@keyframes scan{to{filter:drop-shadow(0 0 16px #d7ffe9dd);transform:scale(1.02)}}.mascot{background:#0f8585;display:flex;align-items:center;justify-content:center;transition:background .6s}.mascot .animal{font-size:clamp(51px,10vw,115px);filter:drop-shadow(0 15px 8px #061b2a66);transform:translateY(3px);animation:bob 1.9s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}.mascot h3{position:absolute;left:8%;bottom:7%;z-index:2;margin:0;font-size:clamp(12px,2.1vw,23px);line-height:.9;letter-spacing:-.04em}.mascot h3 span{font-size:.52em;letter-spacing:.1em}.mars{background:linear-gradient(180deg,#334663 0%,#edaa7a 47%,#9f503d 76%,#2d2527 100%)}.mars:before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:44%;background:linear-gradient(168deg,#ae5f49,#4c3333 58%,#25292a);clip-path:polygon(0 62%,20% 35%,39% 64%,62% 25%,80% 52%,100% 19%,100% 100%,0 100%)}.mars:after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(175deg,transparent 0 14px,#d58b6b44 15px 17px);opacity:.7}.marsTitle{position:absolute;left:7%;bottom:4%;font-size:clamp(20px,4vw,43px);font-weight:900;line-height:.8;letter-spacing:-.06em;z-index:2}.planet{position:absolute;left:48%;top:32%;width:clamp(28px,5vw,56px);aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#c4d8e4,#293943 55%,#111a20);box-shadow:0 10px 12px #17242a77;z-index:2}.gallery{background:linear-gradient(180deg,#31343b,#94969a 78%,#56585d);perspective:400px;display:grid;place-items:center}.gallery:before{content:"";position:absolute;left:5%;right:5%;top:0;bottom:0;background:linear-gradient(90deg,transparent 49.5%,#d6d7d788 50%,transparent 50.5%),linear-gradient(180deg,transparent 52%,#d0d0d088 52.5%,transparent 53%);opacity:.7}.hall{position:absolute;inset:18% 6% 10%;transform:rotateX(8deg);background:repeating-linear-gradient(90deg,#dce0e4 0 1px,transparent 1px 16%),linear-gradient(180deg,#363c45,#aeb4b8);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);opacity:.55}.galleryCards{display:flex;gap:clamp(3px,.8vw,9px);position:relative;z-index:2;align-items:center}.galleryCard{width:clamp(22px,4vw,43px);height:clamp(38px,7vw,76px);border:1px solid #ffffff99;border-radius:3px;background:linear-gradient(140deg,#f2c7b7,#1b2631 55%,#e0e5df);box-shadow:0 5px 12px #0006;animation:slide 3s ease-in-out infinite alternate}.galleryCard:nth-child(2){background:linear-gradient(150deg,#d2e9ed,#24323b 52%,#b5bdc2);animation-delay:.2s}.galleryCard:nth-child(3){background:linear-gradient(150deg,#bbcfe0,#26333c 52%,#d39b8b);animation-delay:.4s}.galleryCard:nth-child(4){background:linear-gradient(150deg,#f0e2cb,#2d353c 54%,#b9d2ca);animation-delay:.6s}@keyframes slide{to{transform:translateY(-6px) rotate(2deg)}}

</style></head><body><main class="wall"><section class="panel books"><span class="label">BOOKMARKS / INSPIRATION</span><div class="book" style="--book:#284e69"><span>DESIGN SYSTEMS</span></div><div class="book" style="--book:#b94d4a"><span>WEB MOTION</span></div><div class="book" style="--book:#2b3333"><span>BRAND BOOK</span></div><div class="book" style="--book:#d6b36d;--ink:#232323"><span>TYPE FOUNDATIONS</span></div><div class="book" style="--book:#53776a"><span>CREATIVE CODE</span></div><div class="book" style="--book:#30495f"><span>GOOD UI</span></div><div class="book" style="--book:#bb7453"><span>THE WEB</span></div><div class="book" style="--book:#59665a"><span>ART DIRECTION</span></div><div class="book" style="--book:#353642"><span>LAYOUT</span></div><div class="book" style="--book:#bd4f55"><span>DESIGNING</span></div></section><section class="panel water"><canvas id="water"></canvas><div class="waterTitle"><small>STREAMLINED</small>Insurance<br>Operations</div><span class="label">WEB DESIGN / 01</span></section><section class="panel kin"><span class="label">PORTFOLIO / 02</span><h2>HELLO I’M <span>KIN</span></h2><div class="wireface"></div></section><section class="panel mascot" id="mascot"><span class="label">CHARACTER / 03</span><div class="animal" id="animal">🦛</div><h3><span id="petLabel">HAPPY</span><br><b id="petName">HIPPO</b></h3></section><section class="panel mars"><span class="label">LANDING PAGE / 04</span><div class="planet"></div><div class="marsTitle">MARS</div></section><section class="panel gallery"><span class="label">GALLERY / 05</span><div class="hall"></div><div class="galleryCards"><div class="galleryCard"></div><div class="galleryCard"></div><div class="galleryCard"></div><div class="galleryCard"></div></div></section></main><script>
const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d');let W,H,D;function size(){D=Math.min(devicePixelRatio||1,2);let r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*D;canvas.height=H*D}new ResizeObserver(size).observe(canvas);size();let start=performance.now();const pets=[['🦛','HAPPY','HIPPO','#0c8587'],['🐻‍❄️','POLAR','PUFFBALL','#1466cc'],['🐸','FANCY','FROGGY','#75bb14'],['🦛','HAPPY','HIPPO','#0c8587']];function paint(now){let t=now/1000;ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#050a19';ctx.fillRect(0,0,W,H);let cx=W*.53,base=H*.61;for(let i=0;i<210;i++){let x=(i*53.17+t*(18+(i%7)*5))%(W+25),y=(i*29.71+t*(28+(i%11)*12))%(H*.77);let spread=(x-cx)/(W*.28);let alpha=Math.max(0,.76-Math.abs(spread)*.62)*(.4+.6*Math.sin(t*2+i));let r=.6+(i%4)*.5;ctx.beginPath();ctx.fillStyle=`rgba(${80+i%60},${145+i%80},255,${alpha})`;ctx.arc(x,base-y,r,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.moveTo(cx,base);for(let x=0;x<W;x+=3){let y=base+7*Math.sin(x*.045+t*2)*Math.exp(-Math.abs(x-cx)/Math.max(20,W*.29));ctx.lineTo(x,y)}ctx.strokeStyle='#568cffaa';ctx.lineWidth=2;ctx.stroke();for(let r=16;r<Math.min(W,H)*.27;r+=17){ctx.beginPath();ctx.ellipse(cx,base+8,r*1.55,r*.28,0,0,Math.PI*2);ctx.strokeStyle=`rgba(91,135,255,${.3-r/(Math.min(W,H)*2)})`;ctx.stroke()}requestAnimationFrame(paint)}requestAnimationFrame(paint);function update(now){let t=((now-start)/1000)%6.4,step=Math.floor(t/.8);document.querySelectorAll('.book').forEach((b,i)=>b.classList.toggle('feature',i===(step+2)%10));let p=pets[Math.min(3,Math.floor(step/2))];document.querySelector('#animal').textContent=p[0];document.querySelector('#petLabel').textContent=p[1];document.querySelector('#petName').textContent=p[2];document.querySelector('#mascot').style.background=p[3];document.querySelectorAll('.galleryCard').forEach((c,i)=>{c.style.transform=`translateY(${Math.sin(now/400+i)*5}px) rotate(${Math.sin(now/800+i)*4}deg)`});requestAnimationFrame(update)}requestAnimationFrame(update);
</script></body></html>
