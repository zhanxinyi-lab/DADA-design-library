<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>徽章流光渐变环</title>
  <style>
    :root {
      --page: #e8e8ec;
      --badge: #a3a4ac;
      --size: clamp(68px, 22vw, 172px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--page);
      color: #3a3a40;
      font-family: system-ui, sans-serif;
    }
    .stage {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      padding: 28px 12px;
      overflow-x: hidden;
    }
    .row {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3.5vw, 68px);
      width: 100%;
      max-width: 720px;
      min-width: 0;
    }
    .badge {
      position: relative;
      flex: 0 0 var(--size);
      width: var(--size);
      height: var(--size);
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .badge:focus { outline: none; }
    .badge:focus-visible {
      outline: 2px solid #6d6e76;
      outline-offset: 8px;
    }
    .badge svg,
    .badge canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .badge .icon { z-index: 2; }
    @media (prefers-reduced-motion: reduce) {
      .badge { transition: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="row" id="row"></div>
  </main>
  <script>
    (function () {
      var VIEW = 260;
      var CX = 130;
      var CY = 130;
      var STOPS = [
        [0, [255, 64, 104]],
        [0.13, [255, 132, 28]],
        [0.27, [255, 214, 46]],
        [0.40, [126, 226, 64]],
        [0.52, [36, 214, 198]],
        [0.64, [58, 148, 255]],
        [0.76, [122, 92, 255]],
        [0.89, [255, 64, 206]],
        [1, [255, 64, 104]]
      ];
      var SPECS = [
        { kind: 'seal', lobes: 10, amp: 7.6, radius: 74, phase: 0.03, icon: 'check', label: '对勾徽章' },
        { kind: 'hex', radius: 78, corner: 20, phase: 0.41, icon: 'bolt', label: '闪电徽章' },
        { kind: 'star', outer: 80, inner: 46, corner: 7, radius: 80, phase: 0.73, icon: 'star', label: '星形徽章' }
      ];

      function num(n) { return n.toFixed(2); }

      function scallopPath(lobes, amp, radius) {
        var steps = lobes * 36;
        var d = '';
        var i, t, rad, x, y;
        for (i = 0; i <= steps; i++) {
          t = -Math.PI / 2 + (Math.PI * 2 * i) / steps;
          rad = radius + amp * Math.cos(lobes * t);
          x = CX + rad * Math.cos(t);
          y = CY + rad * Math.sin(t);
          d += (i ? 'L ' : 'M ') + num(x) + ' ' + num(y) + ' ';
        }
        return d + 'Z';
      }

      function roundedPoly(verts, corner) {
        var n = verts.length;
        var cuts = [];
        var i, p0, p1, p2, v1x, v1y, v2x, v2y, l1, l2, dot, ang, dist, ar, cross, c, next, d;
        for (i = 0; i < n; i++) {
          p0 = verts[(i + n - 1) % n];
          p1 = verts[i];
          p2 = verts[(i + 1) % n];
          v1x = p0[0] - p1[0];
          v1y = p0[1] - p1[1];
          v2x = p2[0] - p1[0];
          v2y = p2[1] - p1[1];
          l1 = Math.hypot(v1x, v1y);
          l2 = Math.hypot(v2x, v2y);
          v1x /= l1; v1y /= l1; v2x /= l2; v2y /= l2;
          dot = Math.max(-1, Math.min(1, v1x * v2x + v1y * v2y));
          ang = Math.acos(dot);
          dist = corner / Math.tan(ang / 2);
          dist = Math.min(dist, l1 * 0.45, l2 * 0.45);
          ar = dist * Math.tan(ang / 2);
          cross = v1x * v2y - v1y * v2x;
          cuts.push({
            t1: [p1[0] + v1x * dist, p1[1] + v1y * dist],
            t2: [p1[0] + v2x * dist, p1[1] + v2y * dist],
            ar: ar,
            sweep: cross > 0 ? 0 : 1
          });
        }
        d = 'M ' + num(cuts[0].t1[0]) + ' ' + num(cuts[0].t1[1]);
        for (i = 0; i < n; i++) {
          c = cuts[i];
          next = cuts[(i + 1) % n];
          d += ' A ' + num(c.ar) + ' ' + num(c.ar) + ' 0 0 ' + c.sweep + ' ' + num(c.t2[0]) + ' ' + num(c.t2[1]);
          d += ' L ' + num(next.t1[0]) + ' ' + num(next.t1[1]);
        }
        return d + ' Z';
      }

      function roundedHex(radius, corner) {
        var verts = [];
        var i, a;
        for (i = 0; i < 6; i++) {
          a = i * Math.PI / 3;
          verts.push([CX + radius * Math.cos(a), CY + radius * Math.sin(a)]);
        }
        return roundedPoly(verts, corner);
      }

      function pointedSeal(tips, outer, inner, corner) {
        var verts = [];
        var i, a, r;
        for (i = 0; i < tips * 2; i++) {
          a = -Math.PI / 2 + i * Math.PI / tips;
          r = i % 2 === 0 ? outer : inner;
          verts.push([CX + r * Math.cos(a), CY + r * Math.sin(a)]);
        }
        return roundedPoly(verts, corner);
      }

      function starPath(outer, inner) {
        var d = '';
        var i, r, a, x, y;
        for (i = 0; i < 10; i++) {
          r = i % 2 === 0 ? outer : inner;
          a = -Math.PI / 2 + i * Math.PI / 5;
          x = CX + r * Math.cos(a);
          y = CY + r * Math.sin(a);
          d += (i ? 'L ' : 'M ') + num(x) + ' ' + num(y) + ' ';
        }
        return d + 'Z';
      }

      function shapePath(spec) {
        if (spec.kind === 'hex') return roundedHex(spec.radius, spec.corner);
        if (spec.kind === 'star') return pointedSeal(8, spec.outer, spec.inner, spec.corner);
        return scallopPath(spec.lobes, spec.amp, spec.radius);
      }

      function iconMarkup(kind) {
        if (kind === 'check') {
          return '<path d="M102 132 L124 156 L166 104" fill="none" stroke="#f7f7f8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>';
        }
        if (kind === 'bolt') {
          return '<path fill="#f7f7f8" d="M146 78 L112 136 H132 L116 184 L164 120 H142 Z"/>';
        }
        return '<path fill="#f7f7f8" d="' + starPath(40, 16) + '"/>';
      }

      function sampleRgb(t) {
        var i, a, b, u;
        t = ((t % 1) + 1) % 1;
        i = 0;
        while (i < STOPS.length - 2 && STOPS[i + 1][0] < t) i++;
        a = STOPS[i];
        b = STOPS[i + 1];
        u = (t - a[0]) / (b[0] - a[0] || 1);
        return [
          Math.round(a[1][0] + (b[1][0] - a[1][0]) * u),
          Math.round(a[1][1] + (b[1][1] - a[1][1]) * u),
          Math.round(a[1][2] + (b[1][2] - a[1][2]) * u)
        ];
      }

      function rgbCss(rgb) { return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')'; }

      function falloff(dist, inner, outer) {
        var t;
        if (dist <= inner) return 1;
        if (dist >= outer) return 0;
        t = (dist - inner) / (outer - inner);
        return 1 - t * t * (3 - 2 * t);
      }

      function mixByte(a, b, t) { return Math.round(a + (b - a) * t); }

      var row = document.getElementById('row');
      var stage = document.querySelector('.stage');
      var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      var reduce = reduceQuery.matches;
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var badges = [];
      var pinned = -1;
      var touchUntil = 0;
      var pointer = { x: 0, y: 0, on: false };
      var rafId = 0;
      var conicMode = null;
      var last = 0;

      function syncPressed() {
        var i;
        for (i = 0; i < badges.length; i++) {
          badges[i].button.setAttribute('aria-pressed', pinned === i ? 'true' : 'false');
        }
      }

      SPECS.forEach(function (spec, index) {
        var d = shapePath(spec);
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'badge';
        button.setAttribute('aria-label', spec.label);
        button.setAttribute('aria-pressed', 'false');
        button.innerHTML =
          '<svg class="base" viewBox="0 0 ' + VIEW + ' ' + VIEW + '" aria-hidden="true">' +
            '<path fill="#a3a4ac" d="' + d + '"></path>' +
          '</svg>' +
          '<canvas aria-hidden="true"></canvas>' +
          '<svg class="icon" viewBox="0 0 ' + VIEW + ' ' + VIEW + '" aria-hidden="true">' +
            iconMarkup(spec.icon) +
          '</svg>';
        row.appendChild(button);
        badges.push({
          spec: spec,
          button: button,
          canvas: button.querySelector('canvas'),
          iconShape: button.querySelector('.icon path'),
          path: new Path2D(d),
          shown: 0,
          lift: 0,
          targetLight: 0,
          targetLift: 0,
          cssW: 0,
          cssH: 0,
          cx: 0,
          cy: 0,
          rad: 1
        });
        button.addEventListener('click', function () {
          if (!finePointer) {
            pinned = pinned === index ? -1 : index;
            syncPressed();
          }
          kick();
        });
        button.addEventListener('focus', kick);
        button.addEventListener('blur', kick);
      });

      function cacheLayout() {
        var rowRect = row.getBoundingClientRect();
        var i, item, w, h;
        for (i = 0; i < badges.length; i++) {
          item = badges[i];
          w = item.button.offsetWidth;
          h = item.button.offsetHeight;
          item.cssW = w;
          item.cssH = h;
          item.cx = rowRect.left + item.button.offsetLeft + w / 2;
          item.cy = rowRect.top + item.button.offsetTop + h / 2;
          item.rad = Math.max(1, w * (item.spec.radius / VIEW));
          item.bufW = 0;
        }
      }

      function ensureBuffer(item) {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var pw = Math.max(1, Math.round((item.cssW || 1) * dpr));
        var ph = Math.max(1, Math.round((item.cssH || 1) * dpr));
        if (item.canvas.width !== pw || item.canvas.height !== ph) {
          item.canvas.width = pw;
          item.canvas.height = ph;
        }
      }

      function addStops(g) {
        var i, rgb;
        for (i = 0; i < STOPS.length; i++) {
          rgb = sampleRgb(STOPS[i][0]);
          g.addColorStop(STOPS[i][0], rgbCss(rgb));
        }
        return g;
      }

      function ringStyle(ctx, angle, phase) {
        var rot = angle + phase * Math.PI * 2;
        var c, s, len, g;
        if (conicMode !== false && typeof ctx.createConicGradient === 'function') {
          try {
            g = ctx.createConicGradient(rot, CX, CY);
            conicMode = true;
            return addStops(g);
          } catch (err) {
            conicMode = false;
          }
        }
        c = Math.cos(rot);
        s = Math.sin(rot);
        len = 140;
        g = ctx.createLinearGradient(CX - c * len, CY - s * len, CX + c * len, CY + s * len);
        return addStops(g);
      }

      function iconInk(shown, rgb) {
        var lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
        var t = lum > 0.72 ? Math.min(1, shown) : 0;
        return 'rgb(' + mixByte(247, 42, t) + ',' + mixByte(247, 33, t) + ',' + mixByte(248, 28, t) + ')';
      }

      function paint(item, angle, aim) {
        var canvas = item.canvas;
        var ctx = canvas.getContext('2d');
        var shown = item.shown;
        var side, ox, oy, hue, c1, c2, radial, x1, y1, x2, y2, mask, edge, soft, ink;
        ensureBuffer(item);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.filter = 'none';
        hue = angle / (Math.PI * 2) + item.spec.phase;
        c1 = sampleRgb(hue);
        ink = iconInk(shown, c1);
        if (item.spec.icon === 'check') item.iconShape.setAttribute('stroke', ink);
        else item.iconShape.setAttribute('fill', ink);
        if (shown < 0.012) return;
        side = Math.min(canvas.width, canvas.height);
        ox = (canvas.width - side) / 2;
        oy = (canvas.height - side) / 2;
        ctx.setTransform(side / VIEW, 0, 0, side / VIEW, ox, oy);
        c2 = sampleRgb(hue + 0.16);

        ctx.save();
        ctx.filter = 'blur(22px)';
        ctx.strokeStyle = ringStyle(ctx, angle, item.spec.phase);
        ctx.lineWidth = 36;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke(item.path);
        ctx.restore();

        ctx.save();
        ctx.clip(item.path);
        radial = ctx.createRadialGradient(CX - 6, CY - 8, 10, CX, CY + 4, item.spec.radius * 1.05);
        radial.addColorStop(0, rgbCss(c1));
        radial.addColorStop(1, rgbCss(c2));
        ctx.globalAlpha = 1;
        ctx.fillStyle = radial;
        ctx.fill(item.path);
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = ringStyle(ctx, angle, item.spec.phase);
        ctx.fill(item.path);
        ctx.globalAlpha = 0.42;
        ctx.fillStyle = radial;
        ctx.fill(item.path);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = ringStyle(ctx, angle, item.spec.phase);
        ctx.lineWidth = 18;
        ctx.lineJoin = 'round';
        ctx.stroke(item.path);
        ctx.restore();

        if (shown < 0.97) {
          x1 = CX - Math.cos(aim) * 160;
          y1 = CY - Math.sin(aim) * 160;
          x2 = CX + Math.cos(aim) * 160;
          y2 = CY + Math.sin(aim) * 160;
          mask = ctx.createLinearGradient(x1, y1, x2, y2);
          edge = 1 - shown * 0.85;
          soft = Math.max(0, edge - 0.34);
          mask.addColorStop(0, 'rgba(0,0,0,0)');
          mask.addColorStop(soft, 'rgba(0,0,0,0)');
          mask.addColorStop(Math.min(0.999, Math.max(soft + 0.04, edge)), 'rgba(0,0,0,' + shown + ')');
          mask.addColorStop(1, 'rgba(0,0,0,' + shown + ')');
          ctx.globalCompositeOperation = 'destination-in';
          ctx.fillStyle = mask;
          ctx.fillRect(-20, -20, VIEW + 40, VIEW + 40);
          ctx.globalCompositeOperation = 'source-over';
        }
      }

      function settled() {
        var i, item;
        for (i = 0; i < badges.length; i++) {
          item = badges[i];
          if (Math.abs(item.shown - item.targetLight) > 0.004) return false;
          if (Math.abs(item.lift - item.targetLift) > 0.004) return false;
        }
        return true;
      }

      function anyLit() {
        var i;
        for (i = 0; i < badges.length; i++) {
          if (badges[i].shown > 0.02 || badges[i].lift > 0.02) return true;
        }
        return false;
      }

      function frame(now) {
        var dt = last ? Math.min(48, now - last) : 16;
        var ease = reduce ? 1 : (1 - Math.exp(-dt / 120));
        var angle = reduce ? 0.65 : (now / 5400) * Math.PI * 2;
        var i, item, dist, keyed, held, light, liftTarget, aim, transform;
        rafId = 0;
        last = now;
        for (i = 0; i < badges.length; i++) {
          item = badges[i];
          dist = pointer.on ? Math.hypot(pointer.x - item.cx, pointer.y - item.cy) : 1e6;
          keyed = document.activeElement === item.button && item.button.matches(':focus-visible');
          held = pinned === i || keyed;
          light = held ? 1 : (pointer.on ? falloff(dist, item.rad * 0.9, item.rad * 5.8) : 0);
          liftTarget = held ? 1 : (pointer.on ? falloff(dist, item.rad * 0.25, item.rad * 1.45) : 0);
          aim = pointer.on ? Math.atan2(pointer.y - item.cy, pointer.x - item.cx) : -Math.PI / 2;
          item.targetLight = light;
          item.targetLift = liftTarget;
          item.shown += (light - item.shown) * ease;
          item.lift += (liftTarget - item.lift) * ease;
          if (item.shown < 0.004) item.shown = 0;
          if (item.lift < 0.004) item.lift = 0;
          transform = 'translateY(' + (-12 * item.lift).toFixed(2) + 'px) scale(' + (1 + 0.08 * item.lift).toFixed(4) + ')';
          if (item.button.style.transform !== transform) item.button.style.transform = transform;
          try {
            paint(item, angle, aim);
          } catch (err) {
            conicMode = false;
          }
        }
        if (reduce) {
          if (!settled()) rafId = requestAnimationFrame(frame);
          return;
        }
        if (!settled() || anyLit() || pointer.on) rafId = requestAnimationFrame(frame);
      }

      function kick() {
        if (rafId) return;
        rafId = requestAnimationFrame(frame);
      }

      stage.addEventListener('pointerdown', function (event) {
        var badge = event.target.closest ? event.target.closest('.badge') : null;
        if (event.pointerType === 'touch') touchUntil = performance.now() + 900;
        if (!badge && pinned !== -1) {
          pinned = -1;
          syncPressed();
        }
        cacheLayout();
        kick();
      });
      stage.addEventListener('pointermove', function (event) {
        if (event.pointerType === 'touch' || performance.now() < touchUntil) return;
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        pointer.on = true;
        kick();
      });
      stage.addEventListener('pointerleave', function () {
        pointer.on = false;
        kick();
      });
      window.addEventListener('scroll', function () { cacheLayout(); kick(); }, true);
      window.addEventListener('resize', function () { cacheLayout(); kick(); });
      if (window.ResizeObserver) {
        var observer = new ResizeObserver(function () { cacheLayout(); kick(); });
        observer.observe(row);
      }
      if (reduceQuery.addEventListener) {
        reduceQuery.addEventListener('change', function () {
          reduce = reduceQuery.matches;
          kick();
        });
      }

      cacheLayout();
      kick();
    })();
  </script>
</body>
</html>
