<!doctype html><html><head><meta name=viewport content=width=device-width,initial-scale=1><meta charset="utf-8"><title>Fluted Gradient</title><style>body{margin:0;overflow:hidden;background:#111}canvas{width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>const BRAND={colors:["#79d7c3","#3157d5","#f26d3d"],segments:42,speed:.35};const c=document.getElementById("c"),x=c.getContext("2d");function rs(){c.width=innerWidth;c.height=innerHeight}addEventListener("resize",rs);rs();function draw(t){const w=c.width/BRAND.segments;x.clearRect(0,0,c.width,c.height);for(let i=0;i<BRAND.segments;i++){const p=i/BRAND.segments,k=(Math.sin(p*18+t*BRAND.speed)+1)/2,g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,BRAND.colors[0]);g.addColorStop(.5,BRAND.colors[1]);g.addColorStop(1,BRAND.colors[2]);x.globalAlpha=.55+k*.45;x.fillStyle=g;x.beginPath();x.moveTo(i*w,0);x.quadraticCurveTo(i*w+w*.5,c.height*(.15+k*.2),i*w+w,0);x.lineTo(i*w+w,c.height);x.quadraticCurveTo(i*w+w*.5,c.height*(.85-k*.2),i*w,c.height);x.fill()}requestAnimationFrame(n=>draw(n/1000))}draw(0);</script></body></html>
