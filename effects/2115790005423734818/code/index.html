<!-- Cindy 复刻：@dingyi 的极简「过去 30 天」下拉选择器，轻边框、大圆角与克制的向下箭头 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日期范围选择</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#25292d}body{background:#f8f9fa;display:grid;place-items:center}.wrap{width:min(560px,calc(100% - 44px));position:relative}.select{width:100%;height:82px;border:1px solid #d9dde0;background:#fff;border-radius:20px;padding:0 27px 0 32px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:#25292d;font-size:clamp(19px,3vw,25px);letter-spacing:.015em;transition:border-color .16s ease,box-shadow .16s ease;appearance:none;text-align:left}.select:hover{border-color:#c6cbd0}.select:focus-visible{outline:none;border-color:#aeb8c0;box-shadow:0 0 0 3px #dfe5e955}.chevron{width:11px;height:11px;border-right:1.6px solid #272d32;border-bottom:1.6px solid #272d32;transform:rotate(45deg) translate(-3px,-3px);transition:transform .18s ease}.select[aria-expanded="true"] .chevron{transform:rotate(225deg) translate(-2px,-2px)}.options{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 8px);padding:5px;background:#fff;border:1px solid #e1e4e6;border-radius:16px;box-shadow:0 8px 24px #1d252b12;opacity:0;transform:translateY(-5px);pointer-events:none;transition:opacity .16s,transform .16s}.options.open{opacity:1;transform:none;pointer-events:auto}.option{border:0;width:100%;height:52px;background:transparent;text-align:left;padding:0 22px;border-radius:11px;font:inherit;font-size:17px;color:#363b3e;cursor:pointer}.option:hover,.option[aria-selected="true"]{background:#f5f6f6}.option[aria-selected="true"]:after{content:"✓";float:right;color:#6c747a;font-size:15px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-height:330px){.select{height:64px;border-radius:17px;padding:0 20px 0 23px}.option{height:42px}.options{border-radius:13px}}
</style></head><body><main class="wrap"><button class="select" id="select" aria-haspopup="listbox" aria-expanded="false"><span id="value">过去 30 天</span><i class="chevron" aria-hidden="true"></i></button><div class="options" id="options" role="listbox" aria-label="日期范围"><button class="option" role="option" aria-selected="false">过去 7 天</button><button class="option" role="option" aria-selected="true">过去 30 天</button><button class="option" role="option" aria-selected="false">过去 90 天</button><button class="option" role="option" aria-selected="false">今年至今</button></div><span class="sr" aria-live="polite" id="announce"></span></main><script>
const select=document.querySelector('#select'),options=document.querySelector('#options'),items=[...document.querySelectorAll('.option')],value=document.querySelector('#value');function close(){select.setAttribute('aria-expanded','false');options.classList.remove('open')}select.addEventListener('click',()=>{let open=select.getAttribute('aria-expanded')!=='true';select.setAttribute('aria-expanded',String(open));options.classList.toggle('open',open)});items.forEach(item=>item.addEventListener('click',()=>{value.textContent=item.textContent;items.forEach(x=>x.setAttribute('aria-selected',String(x===item)));document.querySelector('#announce').textContent='已选择'+item.textContent;close();select.focus()}));document.addEventListener('click',e=>{if(!e.target.closest('.wrap'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
