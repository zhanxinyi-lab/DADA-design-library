<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导航共享高亮</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; background: #f7f4ee; color: #1d1a16;
      font: 16px/1.4 "Segoe UI", "PingFang SC", sans-serif;
    }
    nav { position: relative; display: grid; gap: 8px; width: min(280px, calc(100% - 32px)); padding: 10px; }
    .hl {
      position: absolute; left: 0; top: 0; border-radius: 14px; pointer-events: none;
      background: rgba(29, 26, 22, .08); box-shadow: inset 0 0 0 2px #1d1a16;
      transition: transform .28s ease, width .28s ease, height .28s ease;
    }
    button {
      position: relative; border: 0; border-radius: 14px; background: transparent; color: #1d1a16;
      text-align: left; padding: 14px 16px; font: inherit; cursor: pointer;
    }
    button[aria-current="true"] { font-weight: 700; }
    button:focus-visible { outline: 2px solid #1d1a16; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .hl { transition: none; } }
  </style>
</head>
<body>
  <nav id="nav" aria-label="章节">
    <span class="hl" id="hl"></span>
    <button type="button" aria-current="true">总览</button>
    <button type="button" aria-current="false">材料</button>
    <button type="button" aria-current="false">工艺</button>
    <button type="button" aria-current="false">交付</button>
  </nav>
  <script>
    const nav = document.querySelector("#nav");
    const hl = document.querySelector("#hl");
    const items = [...nav.querySelectorAll("button")];
    const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    function move(item) {
      const navBox = nav.getBoundingClientRect();
      const box = item.getBoundingClientRect();
      hl.style.width = box.width + "px";
      hl.style.height = box.height + "px";
      hl.style.transform = "translate(" + (box.left - navBox.left) + "px," + (box.top - navBox.top) + "px)";
    }
    function select(item) {
      for (const entry of items) entry.setAttribute("aria-current", entry === item ? "true" : "false");
      move(item);
    }
    function current() { return items.find((item) => item.getAttribute("aria-current") === "true") || items[0]; }
    for (const item of items) {
      item.addEventListener("click", () => select(item));
      item.addEventListener("focus", () => select(item));
      if (!fine) continue;
      item.addEventListener("pointerenter", (event) => {
        if (event.pointerType !== "touch") move(item);
      });
    }
    nav.addEventListener("pointerleave", () => move(current()));
    move(items[0]);
    window.addEventListener("resize", () => move(current()));
  </script>
</body>
</html>
