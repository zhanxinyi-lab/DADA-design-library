<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North Margin Press</title>
  <style>
    :root {
      --paper: #f1eee7;
      --ink: #141414;
      --void: #070707;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      --sans: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    body {
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font-family: var(--sans);
    }
    .track { height: 380vh; }
    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--void);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .sheet {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      z-index: 2;
    }
    #follow { z-index: 3; }
    .paper { background: var(--paper); color: var(--ink); }
    .ink { background: var(--void); color: var(--paper); }
    .pane {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: clamp(20px, 4.2vh, 52px) clamp(22px, 4.4vw, 72px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .open { background: transparent; pointer-events: none; }
    .kicker, .stack, .statement, .nav, .float-cue { margin: 0; }
    .kicker {
      position: absolute;
      top: clamp(18px, 3.2vh, 36px);
      left: clamp(22px, 4.4vw, 72px);
      right: clamp(22px, 4.4vw, 72px);
      font-size: 12px;
      font-weight: 560;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .stack {
      font-family: var(--serif);
      font-weight: 450;
      font-size: clamp(52px, 7.6vw, 128px);
      line-height: 0.84;
      letter-spacing: -0.04em;
    }
    .stack span { display: block; }
    .ink .stack {
      font-family: var(--sans);
      font-weight: 560;
      font-size: clamp(48px, 7.1vw, 124px);
      line-height: 0.78;
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }
    .statement {
      font-family: var(--serif);
      font-size: clamp(30px, 3.5vw, 58px);
      line-height: 1.08;
      letter-spacing: -0.035em;
      max-width: 9em;
    }
    .nav {
      position: absolute;
      left: clamp(22px, 4.4vw, 72px);
      right: clamp(22px, 4.4vw, 72px);
      bottom: clamp(16px, 3vh, 34px);
      display: flex;
      justify-content: space-between;
      gap: 10px 16px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.01em;
      padding: 8px 0;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 4px;
    }
    .float-cue {
      position: absolute;
      z-index: 4;
      top: clamp(18px, 3.2vh, 36px);
      right: clamp(20px, 3.6vw, 48px);
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: #fff;
      mix-blend-mode: difference;
      font-size: 12px;
      font-weight: 560;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .chev {
      width: 7px;
      height: 7px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 760px) and (min-height: 481px) {
      .sheet { grid-template-columns: 1fr; grid-template-rows: 1.05fr 0.95fr; }
      .stack { font-size: clamp(46px, 14vw, 84px); }
      .ink .stack { font-size: clamp(42px, 13vw, 78px); }
      .statement { font-size: clamp(28px, 8vw, 44px); }
      .nav { font-size: 12px; }
    }
    @media (max-height: 420px) and (orientation: landscape) {
      .sheet { grid-template-columns: 1fr 1fr; grid-template-rows: none; }
      .pane { padding: 28px 16px 30px; }
      .kicker {
        top: 8px;
        left: 16px;
        right: 16px;
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      .stack { font-size: clamp(26px, 8.2vh, 40px); }
      .ink .stack { font-size: clamp(24px, 7.4vh, 36px); }
      .statement { font-size: clamp(16px, 5.2vh, 26px); }
      .nav {
        left: 16px;
        right: 16px;
        bottom: 6px;
        gap: 4px 10px;
      }
      button { font-size: 11px; padding: 2px 0; }
      .float-cue { top: 8px; right: 16px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="track" id="track">
    <div class="stage">
      <canvas id="tunnel" aria-hidden="true"></canvas>
      <section class="sheet" id="landing" aria-label="Opening split">
        <div class="pane paper">
          <p class="kicker" id="kicker">North Margin Press</p>
          <h1 class="stack" id="mark">
            <span>North</span>
            <span>Margin</span>
            <span>Press</span>
          </h1>
          <nav class="nav" aria-label="Sections">
            <button type="button" data-to="0">Index</button>
            <button type="button" data-to="0.42">Notes</button>
            <button type="button" data-to="0.7">Atlas</button>
            <button type="button" data-to="1">Signal</button>
          </nav>
        </div>
        <div class="pane open"></div>
      </section>
      <section class="sheet" id="follow" aria-label="Closing split" aria-hidden="true" inert>
        <div class="pane ink">
          <h2 class="stack" id="mark-echo" aria-hidden="true"></h2>
        </div>
        <div class="pane paper">
          <p class="statement" id="statement">Ink settles in the margin.</p>
        </div>
      </section>
      <p class="float-cue" id="cue"><span id="cue-label">Scroll</span><span class="chev" aria-hidden="true"></span></p>
    </div>
  </div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <script>
    const SERIF = '"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif';
    const track = document.getElementById('track');
    const canvas = document.getElementById('tunnel');
    const ctx = canvas.getContext('2d');
    const landing = document.getElementById('landing');
    const follow = document.getElementById('follow');
    const cue = document.getElementById('cue');
    const live = document.getElementById('live');
    const echo = document.getElementById('mark-echo');
    const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');

    const lines = [...document.querySelectorAll('#mark span')]
      .map((node) => node.textContent.trim())
      .filter(Boolean);
    const phrase = lines.join(' ') || 'North Margin Press';
    const statement = document.getElementById('statement').textContent.trim();
    document.getElementById('kicker').textContent = phrase;
    echo.replaceChildren(...lines.map((line) => {
      const span = document.createElement('span');
      span.textContent = line;
      return span;
    }));

    let reduced = motionQuery.matches;
    let width = 0;
    let height = 0;
    let progress = 0;
    let spin = 0;
    let last = 0;
    let frame = 0;
    let stage = -1;
    let ribbon = null;
    const pointer = { x: 0.5, y: 0.5 };

    function ramp(start, end, value) {
      if (value <= start) return 0;
      if (value >= end) return 1;
      const t = (value - start) / (end - start);
      return t * t * (3 - 2 * t);
    }

    function buildRibbon() {
      const size = 220;
      const probe = document.createElement('canvas').getContext('2d');
      probe.font = `${size}px ${SERIF}`;
      const textWidth = Math.ceil(probe.measureText(phrase).width);
      const next = document.createElement('canvas');
      next.width = textWidth + Math.ceil(size * 0.55);
      next.height = Math.ceil(size * 1.35);
      const pen = next.getContext('2d');
      pen.clearRect(0, 0, next.width, next.height);
      pen.font = `${size}px ${SERIF}`;
      pen.fillStyle = '#f4f0e6';
      pen.textBaseline = 'middle';
      pen.fillText(phrase, size * 0.2, next.height / 2);
      ribbon = next;
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildRibbon();
      measure();
      draw();
    }

    function measure() {
      const max = Math.max(1, track.offsetHeight - window.innerHeight);
      progress = Math.min(1, Math.max(0, window.scrollY / max));
    }

    function conceal(el, hidden) {
      const next = hidden ? 'true' : 'false';
      if (el.getAttribute('aria-hidden') !== next) el.setAttribute('aria-hidden', next);
      if (hidden) {
        if (!el.hasAttribute('inert')) el.setAttribute('inert', '');
      } else if (el.hasAttribute('inert')) {
        el.removeAttribute('inert');
      }
    }

    function layout() {
      const open = ramp(0.14, 0.36, progress);
      const close = ramp(0.6, 0.82, progress);
      landing.style.transform = `translate3d(${(-open * 100).toFixed(2)}%,0,0)`;
      follow.style.transform = `translate3d(0,${((1 - close) * 100).toFixed(2)}%,0)`;
      conceal(landing, open > 0.85);
      conceal(follow, close < 0.2);
      const next = progress < 0.36 ? 0 : progress < 0.7 ? 1 : 2;
      if (next !== stage) {
        stage = next;
        live.textContent = stage === 2 ? statement : `${phrase}. ${stage === 0 ? 'Split landing.' : 'Spiral tunnel.'}`;
      }
    }

    function drawTunnel(shift) {
      const cx = width * (0.5 + (pointer.x - 0.5) * (reduced ? 0 : 0.03));
      const cy = height * (0.5 + (pointer.y - 0.5) * (reduced ? 0 : 0.03));
      ctx.fillStyle = '#070707';
      ctx.fillRect(0, 0, width, height);
      if (!ribbon) return;

      const turns = 6.4;
      const maxR = Math.hypot(width, height) * 0.46;
      const maxFont = Math.min(width, height) * (width < 760 ? 0.085 : 0.1);
      let theta = shift * Math.PI * 2;
      const start = theta;
      let guard = 0;
      const stamps = [];
      while (guard++ < 90) {
        const lap = (theta - start) / (Math.PI * 2);
        if (lap > turns) break;
        const t = lap / turns;
        const radius = Math.pow(Math.max(t, 0.001), 0.82) * maxR;
        const fontPx = 12 + Math.pow(t, 1.05) * maxFont;
        const scale = fontPx / 220;
        const arc = ribbon.width * scale * 0.9;
        const step = arc / Math.max(radius, 8);
        stamps.push({ theta, t, radius, scale });
        theta += Math.max(0.18, Math.min(step, 1.15));
      }

      for (let i = 0; i < stamps.length; i++) {
        const stamp = stamps[i];
        const x = cx + Math.cos(stamp.theta) * stamp.radius;
        const y = cy + Math.sin(stamp.theta) * stamp.radius;
        const fade = ramp(0.045, 0.16, stamp.t);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(stamp.theta + Math.PI / 2);
        ctx.globalAlpha = fade * (0.42 + stamp.t * 0.58);
        ctx.drawImage(ribbon, -ribbon.width * stamp.scale / 2, -ribbon.height * stamp.scale / 2, ribbon.width * stamp.scale, ribbon.height * stamp.scale);
        ctx.restore();
      }

      const glowR = Math.min(width, height) * 0.2;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      glow.addColorStop(0, 'rgba(255,250,242,0.95)');
      glow.addColorStop(0.28, 'rgba(255,246,232,0.38)');
      glow.addColorStop(1, 'rgba(255,246,232,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = glow;
      ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

      const edge = Math.hypot(width, height) * 0.55;
      const vignette = ctx.createRadialGradient(cx, cy, edge * 0.25, cx, cy, edge);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);
    }

    function draw() {
      layout();
      const shift = reduced ? progress * 0.45 : spin + progress * 1.35;
      drawTunnel(shift);
    }

    function tick(now) {
      const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
      last = now;
      if (!reduced) spin += dt * 0.055;
      if (spin > 40) spin -= 40;
      measure();
      draw();
      if (!reduced) frame = requestAnimationFrame(tick);
    }

    function start() {
      cancelAnimationFrame(frame);
      last = 0;
      if (reduced) {
        measure();
        draw();
      } else {
        frame = requestAnimationFrame(tick);
      }
    }

    document.querySelectorAll('[data-to]').forEach((button) => {
      button.addEventListener('click', () => {
        const max = Math.max(1, track.offsetHeight - window.innerHeight);
        const to = Number(button.getAttribute('data-to')) * max;
        window.scrollTo({ top: to, behavior: reduced ? 'auto' : 'smooth' });
      });
    });

    window.addEventListener('scroll', () => {
      measure();
      if (reduced) draw();
    }, { passive: true });
    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', (event) => {
      pointer.x = event.clientX / Math.max(1, window.innerWidth);
      pointer.y = event.clientY / Math.max(1, window.innerHeight);
      if (reduced) draw();
    }, { passive: true });
    motionQuery.addEventListener('change', () => {
      reduced = motionQuery.matches;
      start();
    });

    resize();
    start();
  </script>
</body>
</html>
