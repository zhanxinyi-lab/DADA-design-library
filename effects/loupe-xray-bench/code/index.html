<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>放大镜工作台</title>
  <style>
    :root {
      --paper: #f3efe6;
      --ink: #1c1915;
      --muted: #6f685c;
      --line: #d9d1c3;
      --red: #c4382c;
      --d: 168px;
      --scale: 1.8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    button, .loupe { font: inherit; }
    button { cursor: pointer; }
    #stage { position: relative; min-height: 100vh; background: var(--paper); }
    .wrap { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 36px; }
    .bar, .hero-tools, .card-row, .foot { display: flex; align-items: center; }
    .bar { justify-content: space-between; gap: 12px; min-height: 44px; }
    .brand, .card, .foot > span { position: relative; }
    .brand { margin: 0; font-family: Georgia, "Iowan Old Style", Palatino, serif; font-size: 28px; letter-spacing: -0.04em; }
    .dot { display: inline-block; width: 0.28em; height: 0.28em; margin-left: 0.08em; background: var(--ink); transform: translateY(-0.05em); }
    .bar-side { display: flex; align-items: center; gap: 10px; }
    .readout, .count, .corner, .foot, .dock-hint, .legend {
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .count b { color: var(--ink); font-weight: 650; }
    .count.done b { color: var(--red); }
    .xray, .btn {
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      padding: 0 14px;
      background: transparent;
      color: var(--ink);
    }
    .xray[aria-pressed="true"], .btn.solid { background: var(--ink); color: var(--paper); }
    .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(220px, 0.85fr); gap: 28px; align-items: end; padding: 28px 0 18px; }
    h1 { position: relative; width: fit-content; max-width: 8em; margin: 0; font-family: Georgia, "Iowan Old Style", Palatino, serif; font-size: clamp(40px, 6vw, 68px); font-weight: 560; letter-spacing: -0.045em; line-height: 0.96; }
    .lead { position: relative; width: fit-content; max-width: 100%; margin: 40px 0 0; color: var(--muted); font-size: 18px; line-height: 1.45; }
    .hero-tools { gap: 10px; margin-top: 22px; position: relative; }
    .dock { min-height: 280px; display: grid; place-items: center; position: relative; }
    .pedestal { width: min(220px, 78%); aspect-ratio: 1; border: 1px dashed var(--line); border-radius: 50%; }
    .specimen { position: absolute; left: 50%; top: 50%; margin: 0; transform: translate(-50%, -50%); font-family: Georgia, Palatino, serif; font-size: 22px; letter-spacing: 0.42em; white-space: nowrap; }
    .dock-hint { position: absolute; left: 12px; bottom: 18px; margin: 0; }
    .card-row { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 18px; }
    .card { min-height: 132px; padding-top: 12px; border-top: 1px solid var(--ink); }
    .card h2 { margin: 0 0 8px; font-size: 18px; font-family: Georgia, Palatino, serif; font-weight: 560; }
    .card p { margin: 0; color: var(--muted); line-height: 1.45; }
    .foot { justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); }
    .legend { display: none; margin: 14px 0 0; }
    body.is-xray .legend { display: block; }
    .corner { position: absolute; top: 22px; left: 16px; margin: 0; }
    .secret {
      position: absolute;
      z-index: 2;
      width: max-content;
      max-width: 12em;
      margin: 0;
      color: var(--red);
      font-family: Georgia, Palatino, serif;
      font-size: 14px;
      font-style: italic;
      line-height: 1.3;
      opacity: 0;
      transform: rotate(var(--tilt, -4deg));
      pointer-events: none;
    }
    .s-mark { left: calc(100% + 10px); top: 4px; }
    .s-title { left: 0; top: calc(100% + 6px); }
    .s-lead { right: 0; top: calc(100% + 4px); }
    .s-btn { left: 0; top: calc(100% + 6px); }
    .s-gap { right: calc(100% + 4px); left: auto; top: 28px; max-width: 8em; }
    .s-foot { right: 0; top: calc(100% + 6px); }
    .annos { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; display: none; }
    body.is-xray .annos { display: block; }
    .annos line { stroke: var(--red); stroke-width: 1; }
    .annos .ext { opacity: 0.55; }
    .annos .sel { fill: none; stroke: var(--red); }
    .annos .pill { fill: #fffdf8; stroke: var(--red); }
    .annos text { fill: var(--red); font: 11px/1 ui-monospace, "Cascadia Mono", monospace; }
    .loupe { position: fixed; z-index: 30; width: var(--d); height: var(--d); left: calc(100% - 250px); top: 180px; touch-action: none; cursor: grab; border-radius: 50%; }
    .loupe:focus-visible { outline: 2px solid var(--ink); outline-offset: 10px; }
    body.is-dragging .loupe { cursor: grabbing; }
    .glass { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--paper); box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -16px 22px rgba(0,0,0,.12), 0 0 0 8px #2b261f, 0 0 0 11px #d9c7a4, 0 0 0 13px #16130f, 0 18px 28px rgba(40,28,16,.28); }
    body.is-dragging .glass { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -16px 22px rgba(0,0,0,.12), 0 0 0 8px #2b261f, 0 0 0 11px #d9c7a4, 0 0 0 13px #16130f, 0 28px 36px rgba(40,28,16,.34); }
    #clone, .clone-root { pointer-events: none; }
    .clone-root { position: absolute; left: 0; top: 0; background: var(--paper); transform-origin: 0 0; }
    .clone-root .secret { opacity: 1; }
    .sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(90% 70% at 28% 22%, rgba(255,255,255,.5), transparent 46%), linear-gradient(115deg, transparent 46%, rgba(255,255,255,.18) 52%, transparent 58%); }
    .handle { position: absolute; width: 18px; height: 96px; left: calc(100% - 30px); top: calc(100% - 16px); border-radius: 999px; background: linear-gradient(90deg, #14110e 0%, #8a7350 42%, #f0e2c4 55%, #6d5a3e 78%, #1a1612 100%); transform: rotate(34deg); box-shadow: 4px 8px 10px rgba(0,0,0,.22); }
    .handle::after { content: ""; position: absolute; left: -3px; right: -3px; bottom: 0; height: 14px; border-radius: 8px; background: #1a1612; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    @media (max-width: 720px) {
      :root { --d: 124px; }
      .wrap { width: min(100% - 24px, 1040px); }
      .hero, .card-row { grid-template-columns: 1fr; }
      .dock { min-height: 210px; }
      .handle { height: 72px; }
      .corner { display: none; }
      .readout { display: none; }
      .s-gap { right: auto; left: 0; top: -1.8em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loupe, .glass { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <p class="corner">先看结构</p>
    <div class="wrap">
      <header class="bar">
        <p class="brand">尺页<span class="dot" aria-hidden="true"></span><span class="secret s-mark" data-egg="mark" aria-hidden="true">方点是停靠记号，不是按钮。</span></p>
        <div class="bar-side">
          <span class="readout" id="readout">—, —</span>
          <p class="count" id="count">彩蛋 <b id="count-n">0</b>/6</p>
          <button type="button" class="xray" id="xray" aria-pressed="false">X 光</button>
        </div>
      </header>
      <section class="hero">
        <div class="copy">
          <h1>拖着放大镜，看这页怎么搭。<span class="secret s-title" data-egg="title" aria-hidden="true">标题按栏折行，不把整段拉大。</span></h1>
          <p class="lead">纸色和墨色就够，红线只拿来量尺寸。<span class="secret s-lead" data-egg="lead" aria-hidden="true">这一句不到二十六字。</span></p>
          <div class="hero-tools">
            <button type="button" class="btn solid" id="open-structure">打开结构</button>
            <button type="button" class="btn" id="reset-loupe">放大镜回位</button>
            <span class="secret s-btn" data-egg="button" aria-hidden="true">热区至少四十四像素高。</span>
          </div>
        </div>
        <div class="dock" id="dock">
          <div class="pedestal" aria-hidden="true"></div>
          <p class="specimen">纸色 · 墨色 · 红线</p>
          <p class="dock-hint">按住拖动</p>
        </div>
      </section>
      <p class="legend">红线是当前布局的实测像素。</p>
      <div class="card-row" id="cards">
        <article class="card"><h2>行宽</h2><p>标题按栏折行，不跟着窗口整段变大。</p></article>
        <article class="card"><h2>间距</h2><p>卡片之间留一条固定的缝。</p><span class="secret s-gap" data-egg="gap" aria-hidden="true">缝宽是二十，跟着格子走。</span></article>
        <article class="card"><h2>热区</h2><p>按钮够高，拇指不用瞄准。</p></article>
      </div>
      <footer class="foot"><span>批注只在镜片里。方向键也能移动放大镜。</span><span>BENCH 04<span class="secret s-foot" data-egg="foot" aria-hidden="true">尺寸标在结构上，不写进句子里。</span></span></footer>
    </div>
    <svg class="annos" id="annos" aria-hidden="true"></svg>
  </div>
  <div class="loupe" id="loupe" tabindex="0" aria-label="放大镜，按住拖动或用方向键移动">
    <div class="glass" id="lens"><div id="clone"></div><div class="sheen"></div></div>
    <div class="handle" aria-hidden="true"></div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
  <script>
    const stage = document.querySelector('#stage');
    const loupe = document.querySelector('#loupe');
    const lens = document.querySelector('#lens');
    const clone = document.querySelector('#clone');
    const annos = document.querySelector('#annos');
    const dockEl = document.querySelector('#dock');
    const xrayBtn = document.querySelector('#xray');
    const openBtn = document.querySelector('#open-structure');
    const resetBtn = document.querySelector('#reset-loupe');
    const count = document.querySelector('#count');
    const countN = document.querySelector('#count-n');
    const readout = document.querySelector('#readout');
    const live = document.querySelector('#live');
    const eggs = [...stage.querySelectorAll('.secret')];
    const found = new Set();
    const ns = 'http://www.w3.org/2000/svg';
    let userMoved = false;
    let loupeLeft = 0;
    let loupeTop = 0;
    let grabX = 0;
    let grabY = 0;

    function glassSize() { return lens.offsetWidth || 168; }

    function rel(el) {
      const s = stage.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
    }

    function svgEl(name, attrs) {
      const node = document.createElementNS(ns, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
      return node;
    }

    function line(x1, y1, x2, y2, extra) {
      annos.append(svgEl('line', { x1, y1, x2, y2, class: extra || '' }));
    }

    function pill(x, y, text) {
      const width = Math.max(28, String(text).length * 7.4 + 12);
      annos.append(svgEl('rect', { class: 'pill', x: x - width / 2, y: y - 11, width, height: 16, rx: 2 }));
      const label = svgEl('text', { x, y: y + 1, 'text-anchor': 'middle' });
      label.textContent = text;
      annos.append(label);
    }

    function hMeasure(x1, x2, y, edgeY) {
      const x = Math.min(x1, x2);
      const span = Math.abs(x2 - x1);
      if (span < 8) return;
      const right = x + span;
      line(x, edgeY, x, y, 'ext');
      line(right, edgeY, right, y, 'ext');
      line(x, y, right, y);
      line(x, y - 4, x, y + 4);
      line(right, y - 4, right, y + 4);
      pill(x + span / 2, y, String(Math.round(span)));
    }

    function vMeasure(y1, y2, x, edgeX) {
      const y = Math.min(y1, y2);
      const span = Math.abs(y2 - y1);
      if (span < 8) return;
      const bottom = y + span;
      line(edgeX, y, x, y, 'ext');
      line(edgeX, bottom, x, bottom, 'ext');
      line(x, y, x, bottom);
      line(x - 4, y, x + 4, y);
      line(x - 4, bottom, x + 4, bottom);
      pill(x, y + span / 2, String(Math.round(span)));
    }

    function box(r) {
      annos.append(svgEl('rect', { class: 'sel', x: r.x, y: r.y, width: r.w, height: r.h }));
    }

    function drawAnnos() {
      annos.replaceChildren();
      const title = rel(document.querySelector('h1'));
      const button = rel(openBtn);
      const cards = [...document.querySelectorAll('.card')].map(rel);
      const widthY = title.y > 28 ? title.y - 16 : title.y + title.h + 16;
      box(title);
      hMeasure(title.x, title.x + title.w, widthY, widthY < title.y ? title.y : title.y + title.h);
      box(button);
      vMeasure(button.y, button.y + button.h, Math.max(12, button.x - 18), button.x);
      if (cards.length >= 2) {
        const a = cards[0];
        const b = cards[1];
        const sideBySide = Math.abs(a.y - b.y) < 12;
        if (sideBySide) hMeasure(a.x + a.w, b.x, a.y - 12, a.y);
        else vMeasure(a.y + a.h, b.y, a.x + Math.min(36, a.w / 2), a.x);
      }
    }

    function rebuildClone() {
      const root = document.createElement('div');
      root.className = 'clone-root';
      root.style.width = stage.offsetWidth + 'px';
      root.innerHTML = stage.innerHTML;
      root.querySelectorAll('[id]').forEach((node) => node.removeAttribute('id'));
      clone.replaceChildren(root);
    }

    function hits(rect, cx, cy, radius) {
      const x = Math.max(rect.left, Math.min(cx, rect.right));
      const y = Math.max(rect.top, Math.min(cy, rect.bottom));
      return (cx - x) ** 2 + (cy - y) ** 2 <= radius ** 2;
    }

    function discover(cx, cy, radius) {
      let changed = false;
      for (const egg of eggs) {
        const id = egg.dataset.egg;
        if (found.has(id)) continue;
        const rect = egg.getBoundingClientRect();
        if (rect.width < 2 || !hits(rect, cx, cy, radius)) continue;
        found.add(id);
        changed = true;
        live.textContent = '找到 ' + found.size + ' / ' + eggs.length + '。' + egg.textContent.trim();
      }
      if (!changed) return;
      countN.textContent = String(found.size);
      count.classList.toggle('done', found.size === eggs.length);
    }

    function syncLens() {
      const size = glassSize();
      const scale = 1.8;
      const rect = loupe.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const origin = stage.getBoundingClientRect();
      const localX = cx - origin.left;
      const localY = cy - origin.top;
      const root = clone.firstElementChild;
      if (root) {
        root.style.width = stage.offsetWidth + 'px';
        root.style.transform = 'translate(' + (size / 2 - scale * localX) + 'px,' + (size / 2 - scale * localY) + 'px) scale(' + scale + ')';
      }
      readout.textContent = Math.round(cx) + ', ' + Math.round(cy);
      discover(cx, cy, size * 0.42);
    }

    function place(x, y) {
      const size = glassSize();
      loupeLeft = Math.max(-size * 0.35, Math.min(window.innerWidth - size * 0.55, x));
      loupeTop = Math.max(-size * 0.2, Math.min(window.innerHeight - size * 0.45, y));
      loupe.style.left = loupeLeft + 'px';
      loupe.style.top = loupeTop + 'px';
      syncLens();
    }

    function dock() {
      const rect = dockEl.getBoundingClientRect();
      const size = glassSize();
      place(rect.left + rect.width / 2 - size / 2, rect.top + rect.height / 2 - size / 2);
    }

    function layout() {
      drawAnnos();
      rebuildClone();
      if (userMoved) place(loupeLeft, loupeTop);
      else dock();
    }

    function setXray(on) {
      document.body.classList.toggle('is-xray', on);
      xrayBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      xrayBtn.textContent = on ? '关闭 X 光' : 'X 光';
      openBtn.textContent = on ? '关闭结构' : '打开结构';
      layout();
    }

    loupe.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      loupe.setPointerCapture(event.pointerId);
      loupe.focus({ preventScroll: true });
      userMoved = true;
      document.body.classList.add('is-dragging');
      const rect = loupe.getBoundingClientRect();
      grabX = event.clientX - rect.left;
      grabY = event.clientY - rect.top;
    });
    loupe.addEventListener('pointermove', (event) => {
      if (!document.body.classList.contains('is-dragging')) return;
      place(event.clientX - grabX, event.clientY - grabY);
    });
    function endDrag() { document.body.classList.remove('is-dragging'); }
    loupe.addEventListener('pointerup', endDrag);
    loupe.addEventListener('pointercancel', endDrag);
    loupe.addEventListener('keydown', (event) => {
      const step = event.shiftKey ? 36 : 14;
      const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key];
      if (!move) return;
      event.preventDefault();
      userMoved = true;
      place(loupeLeft + move[0], loupeTop + move[1]);
    });
    xrayBtn.addEventListener('click', () => setXray(!document.body.classList.contains('is-xray')));
    openBtn.addEventListener('click', () => setXray(!document.body.classList.contains('is-xray')));
    resetBtn.addEventListener('click', () => { userMoved = false; dock(); });
    window.addEventListener('resize', layout);
    window.addEventListener('scroll', () => { if (userMoved) syncLens(); else dock(); }, { passive: true });
    layout();
  </script>
</body>
</html>
