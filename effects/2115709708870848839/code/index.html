<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHKIN 阿甚金 · 暗黑 RPG 主菜单</title>
<!-- AI 复刻：@Kawakistudio《Ashkin: Path of the Returning Soul》游戏 UI/UX 概念主菜单。Canvas 体积雾 + 余烬粒子 + 视差 + 菜单悬停/键盘导航 -->
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;background:#070605;overflow:hidden;color:#cfc3ad;font-family:"Cinzel","Trajan Pro",Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.logo{position:fixed;top:16%;left:50%;transform:translateX(-50%);font-size:clamp(48px,11vw,140px);letter-spacing:.06em;font-weight:700;
 background:linear-gradient(#f4ecdc,#9c8d77 60%,#4a4034);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #ffb46a33);font-style:italic}
.cn{position:fixed;right:6%;top:18%;writing-mode:vertical-rl;font:600 clamp(20px,3vw,40px) "Songti SC","Noto Serif SC",serif;color:#8a7d68;letter-spacing:.3em}
ul{position:fixed;left:8%;bottom:16%;list-style:none}
li{font-size:clamp(12px,1.4vw,16px);letter-spacing:.25em;padding:.55em 0 .55em 1.6em;position:relative;cursor:pointer;color:#8f846f;transition:.3s}
li:before{content:"";position:absolute;left:0;top:50%;width:0;height:1px;background:#e1a65a;transition:.3s}
li.on{color:#f5e9d2;text-shadow:0 0 12px #ffae5a88;padding-left:2.4em}li.on:before{width:1.6em}
li.on:after{content:"◆";position:absolute;left:-.9em;color:#e1a65a;font-size:.7em;top:50%;transform:translateY(-50%)}
.foot{position:fixed;bottom:4%;left:0;right:0;text-align:center;font:11px system-ui;letter-spacing:.3em;color:#5d5444}
</style></head><body><canvas id="c"></canvas>
<div class="logo">ASHKIN</div><div class="cn">阿甚金</div>
<ul id="menu"><li class="on">CONTINUE</li><li>NEW JOURNEY</li><li>LOAD SOUL</li><li>OPTIONS</li><li>CODEX</li><li>QUIT</li></ul>
<div class="foot">↑ ↓ SELECT · ENTER CONFIRM</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();onresize=rs;
let mx=0,my=0;onpointermove=e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5};
const fog=Array.from({length:26},()=>({x:Math.random(),y:.45+Math.random()*.6,r:.2+Math.random()*.35,v:(Math.random()-.5)*.00015,a:.03+Math.random()*.05}));
const em=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),v:.0005+Math.random()*.0015,s:Math.random()*2+.5,p:Math.random()*6}));
function gate(d,col){// silhouette ruined gate & pillars, parallax depth d
 x.fillStyle=col;const ox=-mx*40*d,oy=-my*20*d;x.save();x.translate(ox,oy);
 const cx=W/2;x.beginPath();x.moveTo(cx-W*.26,H);x.lineTo(cx-W*.26,H*.42);x.quadraticCurveTo(cx,H*.12,cx+W*.26,H*.42);x.lineTo(cx+W*.26,H);
 x.lineTo(cx+W*.2,H);x.lineTo(cx+W*.2,H*.46);x.quadraticCurveTo(cx,H*.22,cx-W*.2,H*.46);x.lineTo(cx-W*.2,H);x.fill();
 for(const s of[-1,1]){for(let i=0;i<3;i++){const px=cx+s*(W*.34+i*W*.08),h=H*(.35+i*.05);x.fillRect(px-14-i*4,h,28+i*8,H-h);x.fillRect(px-24-i*4,h-10,48+i*8,12)}}
 x.restore()}
function draw(t){const g=x.createRadialGradient(W/2,H*.45,0,W/2,H*.45,W*.7);g.addColorStop(0,'#3a2a1c');g.addColorStop(.35,'#17110c');g.addColorStop(1,'#050404');x.fillStyle=g;x.fillRect(0,0,W,H);
 // glow behind gate
 const gl=x.createRadialGradient(W/2-mx*20,H*.5,0,W/2,H*.5,H*.5);gl.addColorStop(0,`rgba(255,170,90,${.35+Math.sin(t/900)*.05})`);gl.addColorStop(1,'rgba(255,170,90,0)');x.fillStyle=gl;x.fillRect(0,0,W,H);
 gate(.4,'#0f0b08');
 x.globalCompositeOperation='lighter';
 for(const f of fog){f.x+=f.v;if(f.x>1.3)f.x=-.3;if(f.x<-.3)f.x=1.3;const r=f.r*W,fx=f.x*W-mx*60,fy=f.y*H;const fg=x.createRadialGradient(fx,fy,0,fx,fy,r);fg.addColorStop(0,`rgba(160,140,120,${f.a})`);fg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=fg;x.fillRect(fx-r,fy-r,2*r,2*r)}
 for(const e of em){e.y-=e.v;e.x+=Math.sin(t/1000+e.p)*.0004;if(e.y<-.02){e.y=1.02;e.x=Math.random()}const a=.5+.5*Math.sin(t/200+e.p);x.fillStyle=`rgba(255,${140+a*60|0},70,${.35+a*.5})`;x.beginPath();x.arc(e.x*W-mx*80,e.y*H,e.s,0,7);x.fill()}
 x.globalCompositeOperation='source-over';
 const v=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.85)');x.fillStyle=v;x.fillRect(0,0,W,H);
 requestAnimationFrame(draw)}requestAnimationFrame(draw);
const li=[...document.querySelectorAll('li')];let i=0;const set=n=>{i=(n+li.length)%li.length;li.forEach((l,k)=>l.classList.toggle('on',k==i))};
li.forEach((l,k)=>l.onmouseenter=()=>set(k));onkeydown=e=>{if(e.key=='ArrowDown')set(i+1);if(e.key=='ArrowUp')set(i-1)};
</script></body></html>
