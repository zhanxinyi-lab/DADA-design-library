<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emoji Picker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111112;
      --panel: #242426;
      --text: #f2f2f3;
      --muted: #96969c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Helvetica, Arial, system-ui, sans-serif;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: var(--bg);
    }
    .stage {
      width: min(420px, 90vw);
      height: min(320px, 67vw, 96vh);
      perspective: 900px;
      position: relative;
    }
    .panel {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 17px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48);
    }
    .search-row {
      height: 48px;
      flex: 0 0 48px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
    }
    .search {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 16px;
    }
    .search::placeholder { color: var(--muted); opacity: 1; }
    .list {
      flex: 1;
      overflow: auto;
      padding: 8px 14px 24px;
      scrollbar-width: none;
      overscroll-behavior: contain;
      perspective: 900px;
    }
    .list::-webkit-scrollbar { display: none; }
    .category { margin: 0 0 6px; }
    .category-label {
      padding: 7px 2px 3px;
      color: #b9b9be;
      font-size: 12px;
      font-weight: 550;
      letter-spacing: .01em;
    }
    .emoji-row {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      transform-origin: center center;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform, filter;
    }
    .emoji {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: clamp(19px, 5.5vw, 25px);
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .emoji:hover, .emoji:focus-visible { background: rgba(255, 255, 255, .09); outline: none; }
    .empty { padding: 22px 2px; color: var(--muted); font-size: 14px; }
    .fold {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 2;
      pointer-events: none;
    }
    .fold.top {
      top: 48px;
      height: 34px;
      background: linear-gradient(180deg, rgba(0, 0, 0, .28), transparent);
    }
    .fold.bottom {
      bottom: 0;
      height: 48px;
      background: linear-gradient(0deg, rgba(12, 12, 14, .88), transparent);
      backdrop-filter: blur(1.2px);
    }
    @media (max-width: 360px) {
      .stage { width: calc(100vw - 24px); }
      .search-row { padding: 0 14px; }
      .list { padding-right: 10px; padding-left: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .emoji-row { will-change: auto; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="stage" aria-label="Emoji picker">
      <div class="panel">
        <label class="search-row">
          <span class="visually-hidden" hidden>Search emoji</span>
          <input class="search" id="search" type="search" placeholder="Search emoji..." aria-label="Search emoji" autocomplete="off">
        </label>
        <div class="list" id="list" aria-label="Emoji results"></div>
      </div>
      <div class="fold top" aria-hidden="true"></div>
      <div class="fold bottom" aria-hidden="true"></div>
    </section>
  </main>
  <script>

        ['🤪', 'zany face'], ['😝', 'squinting face tongue'], ['🤑', 'money mouth face'], ['🤗', 'hugging face'],
        ['🤭', 'face hand over mouth'], ['🫢', 'face open eyes hand over mouth'], ['🫣', 'peeking eye'], ['🤫', 'shushing face'],

        ['😐', 'neutral face'], ['😑', 'expressionless face'], ['😶', 'face without mouth'], ['🫥', 'dotted line face'],

        ['🙏', 'folded hands'], ['💅', 'nail polish'], ['💪', 'flexed biceps'], ['🦾', 'mechanical arm']
      ]},
      { label: 'Animals & Nature', items: [
        ['🐵', 'monkey face'], ['🐶', 'dog face'], ['🐱', 'cat face'], ['🐭', 'mouse face'], ['🐹', 'hamster'], ['🐰', 'rabbit face'],
        ['🦊', 'fox'], ['🐻', 'bear'], ['🐼', 'panda'], ['🐨', 'koala'], ['🐯', 'tiger face'], ['🦁', 'lion'],
        ['🐮', 'cow face'], ['🐷', 'pig face'], ['🐸', 'frog'], ['🐵', 'monkey'], ['🙈', 'see no evil monkey'], ['🙉', 'hear no evil monkey'],
        ['🙊', 'speak no evil monkey'], ['🐔', 'chicken'], ['🐧', 'penguin'], ['🐦', 'bird'], ['🐤', 'baby chick'], ['🦆', 'duck'],
        ['🦅', 'eagle'], ['🦉', 'owl'], ['🦇', 'bat'], ['🐺', 'wolf'], ['🐗', 'boar'], ['🐴', 'horse face'],
        ['🦄', 'unicorn'], ['🐝', 'honeybee'], ['🪱', 'worm'], ['🦋', 'butterfly'], ['🐌', 'snail'], ['🐞', 'lady beetle'],
        ['🐜', 'ant'], ['🪰', 'fly'], ['🕷️', 'spider'], ['🦂', 'scorpion'], ['🐢', 'turtle'], ['🐍', 'snake'],
        ['🦎', 'lizard'], ['🦖', 't-rex'], ['🐙', 'octopus'], ['🦑', 'squid'], ['🦀', 'crab'], ['🐠', 'tropical fish'],
        ['🐬', 'dolphin'], ['🐳', 'spouting whale'], ['🦈', 'shark'], ['🌵', 'cactus'], ['🌲', 'evergreen tree'], ['🌴', 'palm tree'],
        ['🌱', 'seedling'], ['🌷', 'tulip'], ['🌹', 'rose'], ['🌻', 'sunflower'], ['🌼', 'blossom'], ['🍀', 'four leaf clover'],
        ['🍁', 'maple leaf'], ['🍂', 'fallen leaf'], ['🍄', 'mushroom'], ['🌾', 'sheaf of rice'], ['🌍', 'globe europe africa'], ['🌙', 'crescent moon']
      ]},
      { label: 'Food & Drink', items: [
        ['🍎', 'red apple'], ['🍐', 'pear'], ['🍊', 'tangerine'], ['🍋', 'lemon'], ['🍌', 'banana'], ['🍉', 'watermelon'],
        ['🍇', 'grapes'], ['🍓', 'strawberry'], ['🫐', 'blueberries'], ['🍒', 'cherries'], ['🍑', 'peach'], ['🥭', 'mango'],
        ['🍍', 'pineapple'], ['🥥', 'coconut'], ['🥝', 'kiwi fruit'], ['🍅', 'tomato'], ['🥑', 'avocado'], ['🍆', 'eggplant'],
        ['🥕', 'carrot'], ['🌽', 'ear of corn'], ['🌶️', 'hot pepper'], ['🥒', 'cucumber'], ['🥬', 'leafy green'], ['🥦', 'broccoli'],
        ['🍔', 'hamburger'], ['🍟', 'french fries'], ['🍕', 'pizza'], ['🌭', 'hot dog'], ['🍿', 'popcorn'], ['🧋', 'bubble tea'],
        ['☕', 'hot beverage coffee'], ['🍵', 'teacup'], ['🥤', 'cup with straw'], ['🍰', 'shortcake'], ['🍩', 'doughnut'], ['🍪', 'cookie']
      ]},
      { label: 'Travel & Places', items: [
        ['🚗', 'automobile car'], ['🚕', 'taxi'], ['🚌', 'bus'], ['🚎', 'trolleybus'], ['🏎️', 'racing car'], ['🚓', 'police car'],
        ['🚑', 'ambulance'], ['🚒', 'fire engine'], ['🚲', 'bicycle'], ['🛵', 'motor scooter'], ['✈️', 'airplane'], ['🚀', 'rocket'],
        ['🛸', 'flying saucer'], ['🚁', 'helicopter'], ['⛵', 'sailboat'], ['🚢', 'ship'], ['🚂', 'locomotive'], ['🚆', 'train'],
        ['🏠', 'house'], ['🏡', 'house garden'], ['🏢', 'office building'], ['🏰', 'castle'], ['🗼', 'tokyo tower'], ['⛲', 'fountain'],
        ['🏖️', 'beach umbrella'], ['🏝️', 'desert island'], ['🌋', 'volcano'], ['⛰️', 'mountain'], ['🌇', 'sunset city'], ['🌃', 'night stars']
      ]}
    ];

    (function () {
      const list = document.getElementById('list');
      const search = document.getElementById('search');
      const columns = 8;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function render() {
        const query = search.value.trim().toLocaleLowerCase();
        list.replaceChildren();
        let count = 0;

        GROUPS.forEach(function (group) {
          const items = group.items.filter(function (item) {
            return !query || item[0].includes(query) || item[1].toLocaleLowerCase().includes(query);
          });
          if (!items.length) return;
          count += items.length;

          const section = document.createElement('section');
          section.className = 'category';
          const heading = document.createElement('h2');
          heading.className = 'category-label';
          heading.textContent = group.label;
          section.appendChild(heading);

          for (let i = 0; i < items.length; i += columns) {
            const row = document.createElement('div');
            row.className = 'emoji-row';
            items.slice(i, i + columns).forEach(function (item) {
              const button = document.createElement('button');
              button.className = 'emoji';
              button.type = 'button';
              button.textContent = item[0];
              button.setAttribute('aria-label', item[1]);
              button.title = item[1];
              row.appendChild(button);
            });
            section.appendChild(row);
          }
          list.appendChild(section);
        });

        if (!count) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No emoji found';
          list.appendChild(empty);
        }
        requestAnimationFrame(fold);
      }

      function fold() {
        const box = list.getBoundingClientRect();
        const edge = 48;
        const maxAngle = 34;
        list.querySelectorAll('.emoji-row').forEach(function (row) {
          const rect = row.getBoundingClientRect();
          const topDistance = rect.top - box.top;
          const bottomDistance = box.bottom - rect.bottom;
          let angle = 0;
          if (topDistance < edge) angle = maxAngle * (1 - Math.max(0, Math.min(1, topDistance / edge)));
          if (bottomDistance < edge) angle = -maxAngle * (1 - Math.max(0, Math.min(1, bottomDistance / edge)));
          row.style.transform = 'rotateX(' + angle + 'deg) translateZ(' + Math.abs(angle) * 0.45 + 'px)';
          row.style.filter = 'brightness(' + (1 - Math.abs(angle) / 190) + ')';
        });
      }

      search.addEventListener('input', function () {
        list.scrollTop = 0;
        render();
      });
      list.addEventListener('scroll', fold, { passive: true });
      window.addEventListener('resize', fold);
      render();

      if (!reducedMotion) {
        let direction = 1;
        function autoScroll() {
          if (!search.value && document.activeElement !== search) {
            const max = list.scrollHeight - list.clientHeight;
            if (max > 0) {
              list.scrollTop += direction * 0.55;
              if (list.scrollTop >= max - 1) direction = -1;
              else if (list.scrollTop <= 0) direction = 1;
            }
          }
          requestAnimationFrame(autoScroll);
        }
        requestAnimationFrame(autoScroll);
      }
    })();
  </script>
</body>
</html>
