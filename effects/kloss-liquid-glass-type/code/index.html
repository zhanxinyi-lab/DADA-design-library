<!DOCTYPE html>
<html lang="en">
<!-- AI 复刻：@kloss_xyz Y3K 液态玻璃字 — 液面冒出透明泡泡 → 悬浮 → 分裂成水珠 → 融成玻璃字 → 定版；改顶部 BRAND 即可换字和配色 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Type</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#020304;overflow:hidden;color:#fff;font-family:Inter,Helvetica,Arial,system-ui,sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #replay{position:fixed;right:16px;bottom:14px;z-index:2;background:rgba(255,255,255,.08);color:#fff;
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;font:12px/1 inherit;letter-spacing:.12em;cursor:pointer;opacity:.0;transition:opacity .3s}
  body:hover #replay{opacity:.85}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button id="replay">REPLAY</button>
<script>
// ===== 改这里 =====
const BRAND = {
  word: 'DADA',                 // 最后成形的字
  font: '900 300px "Arial Black", Inter, Helvetica, sans-serif',
  rim:  [0.70, 1.00, 0.90],       // 边缘虹彩往这个颜色收（0~1）
  glowA:[0.10, 0.55, 0.45],       // 背景两团柔光的颜色
  glowB:[0.20, 0.35, 0.75],
  loop: true                      // 播完自动重播
};
// ==================
(function(){
'use strict';
const W = 1920, H = 1080, CX = 960, CY = 520, LINEY = 640, BR = 120;
const T = { line:[0.2,0.9], emerge:[0.8,2.1], float:[2.1,3.1], split:[3.1,3.85], morph:[3.7,4.9], end:7.5 };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const seg=(r,x)=>clamp((x-r[0])/(r[1]-r[0]),0,1);
const eOut=t=>1-Math.pow(1-t,3), eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', {alpha:false, antialias:true});
function fit(){ const d=Math.min(devicePixelRatio||1,2); const w=Math.round(innerWidth*d), h=Math.round(innerHeight*d);
  if (cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; } }
addEventListener('resize', fit); fit();

// 字形场：画布上写字 → 模糊，R 通道 = 清晰字形场，G 通道 = 膨胀后的“胖字”
function wordField(){
  const c=document.createElement('canvas'); c.width=1024; c.height=576; const x=c.getContext('2d');
  const k=1024/W; x.fillStyle='#000'; x.fillRect(0,0,1024,576);
  x.save(); x.scale(k,k); x.font=BRAND.font; x.textAlign='center'; x.textBaseline='middle';
  let size=parseFloat(BRAND.font.match(/(\d+)px/)[1]); let wd=x.measureText(BRAND.word).width;
  let fontStr=BRAND.font; if (wd>W*.78){ size*= W*.78/wd; fontStr=BRAND.font.replace(/\d+px/, Math.round(size)+'px'); }
  // 自己做盒式模糊（3 次 ≈ 高斯），不依赖 ctx.filter
  const blurA=(src,r)=>{ const w=1024,h=576; let a=Float32Array.from(src), t=new Float32Array(w*h);
    for (let pass=0;pass<3;pass++){
      for (let y=0;y<h;y++){ let acc=0; for (let x=-r;x<=r;x++) acc+=a[y*w+Math.min(w-1,Math.max(0,x))];
        for (let x=0;x<w;x++){ t[y*w+x]=acc/(2*r+1); acc+=a[y*w+Math.min(w-1,x+r+1)]-a[y*w+Math.max(0,x-r)]; } }
      for (let x=0;x<w;x++){ let acc=0; for (let y=-r;y<=r;y++) acc+=t[Math.min(h-1,Math.max(0,y))*w+x];
        for (let y=0;y<h;y++){ a[y*w+x]=acc/(2*r+1); acc+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x]; } } }
    return a; };
  const draw=(blur,grow)=>{ const o=document.createElement('canvas'); o.width=1024; o.height=576; const y=o.getContext('2d');
    y.fillStyle='#000'; y.fillRect(0,0,1024,576); y.scale(k,k); y.font=fontStr; y.textAlign='center'; y.textBaseline='middle';
    y.fillStyle='#fff'; y.strokeStyle='#fff'; y.lineWidth=grow; y.lineJoin='round';
    if (grow>0) y.strokeText(BRAND.word,CX,CY); y.fillText(BRAND.word,CX,CY);
    const d=y.getImageData(0,0,1024,576).data, g=new Float32Array(1024*576);
    for (let i=0;i<g.length;i++) g[i]=d[i*4];
    return blurA(g, blur); };
  x.restore();
  const a=draw(2,0), b=draw(5,8), out=x.getImageData(0,0,1024,576);
  for (let i=0,j=0;i<out.data.length;i+=4,j++){ out.data[i]=a[j]; out.data[i+1]=b[j]; out.data[i+2]=0; out.data[i+3]=255; }
  x.putImageData(out,0,0); return c;
}
// 字形内部取 12 个落点给水珠
function beadTargets(fc){
  const d=fc.getContext('2d').getImageData(0,0,1024,576).data, pts=[];
  for (let i=0;i<12;i++){ let best=null;
    const gx=Math.round((W*.14 + (W*.72)*(i+.5)/12)*1024/W);
    for (let dx=0;dx<60&&!best;dx+=3) for (const sg of [1,-1]){ const xx=gx+sg*dx; let ys=[];
      for (let y=0;y<576;y++) if (d[(y*1024+xx)*4]>200) ys.push(y);
      if (ys.length){ best=[xx*W/1024, ys[[ys.length>>1, (ys.length*.25)|0, (ys.length*.75)|0][i%3]]*H/576]; break; } }
    pts.push(best||[W*.14+(W*.72)*(i+.5)/12, CY]); }
  return pts;
}

const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uRes; uniform float uTime; uniform sampler2D uField;
uniform vec4 uB[16]; uniform float uMorph; uniform float uLine; uniform float uClip; uniform float uSettle;
uniform vec3 uRim; uniform vec3 uGA; uniform vec3 uGB;
const vec2 BOARD=vec2(${W}.,${H}.); const vec2 C=vec2(${CX}.,${CY}.); const float LINEY=${LINEY}.;
vec3 backdrop(vec2 b){
  vec2 u=b/BOARD; vec3 c=vec3(.008,.012,.014);
  c+=uGA*.22*exp(-dot((u-vec2(.28,.62))*vec2(1.6,2.2),(u-vec2(.28,.62))*vec2(1.6,2.2)));
  c+=uGB*.20*exp(-dot((u-vec2(.74,.38))*vec2(1.6,2.2),(u-vec2(.74,.38))*vec2(1.6,2.2)));
  vec2 g=abs(fract(b/96.)-.5); c+=vec3(.025)*smoothstep(.49,.5,max(g.x,g.y));   // 很淡的网格，折射时能看出扭曲
  return c;
}
float blobs(vec2 b){ float fb=0.;
  for(int i=0;i<16;i++){ vec4 d=uB[i]; if(d.z>0.){ vec2 q=b-d.xy;
    if(d.w>0.){ float th=atan(q.y,q.x); q/=1.+d.w*(.045*sin(3.*th+uTime*3.1)+.028*sin(5.*th-uTime*2.3)+.025*sin(2.*th+uTime*1.7)); }
    else if(d.w<0.){ q*=vec2(.22,1.7); }
    fb+=d.z*d.z/(dot(q,q)+1.); } }
  return fb; }
float field(vec2 b){
  float fb=blobs(b); vec4 tx=texture2D(uField,b/BOARD); float fm=tx.r*2., fmB=tx.g*2.;
  float letters=mix(fmB,fm,smoothstep(.45,1.,uMorph))*(.3+.7*smoothstep(0.,.5,uMorph));
  return min(max(fb*(1.-smoothstep(.35,.85,uMorph)),letters),3.); }
void main(){
  vec2 f=gl_FragCoord.xy; f.y=uRes.y-f.y;
  float s=min(uRes.x/BOARD.x,uRes.y/BOARD.y); vec2 b=(f-uRes*.5)/s+BOARD*.5;
  vec3 col=backdrop(b);
  float lw=smoothstep(0.,1.,uLine)*(1.-smoothstep(0.,1.,abs(b.x-C.x)/(700.*uLine+1.)));
  col+=vec3(.85,1.,.95)*exp(-pow((b.y-LINEY)/1.4,2.))*lw*.9 + vec3(.4,.9,.75)*exp(-pow((b.y-LINEY)/12.,2.))*lw*.1;
  float fv=field(b); float a=smoothstep(.97,1.03,fv);
  if(uClip>0.) a*=mix(1.,smoothstep(LINEY+2.,LINEY-2.,b.y),uClip);
  if(a>0.){
    float e=2.;
    float ex=smoothstep(1.,1.9,field(b+vec2(e,0.)))-smoothstep(1.,1.9,field(b-vec2(e,0.)));
    float ey=smoothstep(1.,1.9,field(b+vec2(0.,e)))-smoothstep(1.,1.9,field(b-vec2(0.,e)));
    float inner=smoothstep(1.,1.9,fv), rim=1.-inner;
    vec3 n=normalize(vec3(-ex*3.,ey*3.,1.));
    vec2 rb=b+n.xy*vec2(60.,-60.)-(b-C)*.12*inner;
    vec3 refr=vec3(backdrop(rb+n.xy*4.).r,backdrop(rb).g,backdrop(rb-n.xy*4.).b)*1.3+.02;
    float hue=atan(n.y,n.x)*2.+uTime*.8+fv*2.;
    vec3 iri=mix(.5+.5*cos(hue+vec3(0.,2.1,4.2)),uRim,.45);
    vec3 c=refr*(1.-.2*rim)+pow(rim,2.2)*(iri*.75+.35);
    c+=pow(max(dot(n,normalize(vec3(-.5,.55,.68))),0.),40.)*1.1+.05*inner;
    c=mix(c,vec3(.97),uSettle*inner);                                   // 定版：玻璃字慢慢变成实心白字
    col=mix(col,c,a);
  }
  gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(prog,0,'p'); gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ['uRes','uTime','uField','uB','uMorph','uLine','uClip','uSettle','uRim','uGA','uGB'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
const fc=wordField(); const BEADS=beadTargets(fc);
const tx=gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tx);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,fc);
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR));
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE));
gl.uniform1i(U.uField,0); gl.uniform3fv(U.uRim,BRAND.rim); gl.uniform3fv(U.uGA,BRAND.glowA); gl.uniform3fv(U.uGB,BRAND.glowB);

const SATS=[{x:-420,y:-140,r:22,d:.10},{x:450,y:100,r:17,d:.35}];
function blobsAt(t){
  const out=new Float32Array(64), em=seg(T.emerge,t), fl=seg(T.float,t), sp=seg(T.split,t);
  let r=0, x=CX, y=LINEY+BR;
  if (t>=T.emerge[0]){ y=LINEY+BR*.9-(LINEY+BR*.9-CY)*eIO(em)-22*Math.sin(Math.PI*ss(.55,1,em)); r=BR*(.55+.45*eOut(em));
    y+=Math.sin(t*1.6)*6*ss(0,.3,fl); x+=Math.sin(t*1.1)*4*ss(0,.3,fl); }
  if (t>=T.split[0]){ r*=1-.45*ss(0,.35,sp); r*=1-ss(.3,.85,sp); }
  out.set([x,y,r,r>0?1+.8*ss(.2,.6,sp):0],0);
  SATS.forEach((s,i)=>{ const k=clamp((fl-s.d)/.55,0,1), e=eIO(k); const rr=t>=T.float[0]&&k<1?s.r*(1-ss(.75,1,k)):0;
    out.set([CX+s.x*(1-e),CY+s.y*(1-e)+Math.sin(t*2+i)*5,rr,0],(1+i)*4); });
  const pool=t>=T.emerge[0]?58*Math.sin(Math.PI*clamp(em*1.1,0,1)):0; out.set([CX,LINEY+7,Math.max(0,pool),-1],12);
  BEADS.forEach((p,i)=>{ const dl=Math.abs(i-5.5)/5.5*.25, k=clamp((sp-.25-dl)/.6,0,1), e=eOut(k);
    const br=t>=T.split[0]?30*ss(0,.35,k):0;
    out.set([x+(p[0]-x)*e, y+(p[1]-y)*e-34*Math.sin(Math.PI*e)*(i%2?1:-1), br, br>0?.5:0],(4+i)*4); });
  return out;
}
let t0=performance.now(); document.getElementById('replay').onclick=()=>{t0=performance.now();};
const freeze=new URLSearchParams(location.search).get('freeze');
function frame(now){
  fit(); let t=freeze!==null?parseFloat(freeze):(now-t0)/1000;
  if (BRAND.loop && t>T.end+1.5){ t0=now; t=0; }
  gl.viewport(0,0,cv.width,cv.height);
  gl.uniform2f(U.uRes,cv.width,cv.height); gl.uniform1f(U.uTime,t);
  gl.uniform4fv(U.uB,blobsAt(t)); gl.uniform1f(U.uMorph,eIO(seg(T.morph,t)));
  gl.uniform1f(U.uLine,ss(T.line[0],T.line[1],t)*(1-ss(T.emerge[0]+.6,T.float[0]+.4,t)));
  gl.uniform1f(U.uClip,1-ss(.55,.8,seg(T.emerge,t)));
  gl.uniform1f(U.uSettle,ss(T.morph[1]+.3,T.morph[1]+1.2,t)*.75);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
