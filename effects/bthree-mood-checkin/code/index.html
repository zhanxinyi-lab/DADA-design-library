<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mood check-in</title>
  <script>
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("reduce");
    }
  </script>
  <style>
    :root {
      --stage: #efeae3;
      --bg-top: #faf7f2;
      --bg-mid: #f7f1e6;
      --bg-bot: #f6e2bf;
      --bloom: rgba(237, 171, 25, 0.45);
      --ink: #241f12;
      --face: #edab19;
      --card: #fdd880;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--stage);
      color: #241f12;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    button { font: inherit; color: inherit; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .fit {
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .phone {
      width: min(420px, calc(100vw - 32px), calc((100dvh - 32px) * 0.48));
      aspect-ratio: 390 / 820;
      background: #111;
      border-radius: 36px;
      padding: 10px;
      box-shadow: 0 24px 60px rgba(40, 32, 24, 0.16);
    }
    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(90% 48% at 50% 74%, var(--bloom), transparent 72%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 46%, var(--bg-bot) 100%);
      color: var(--ink);
      container-type: size;
    }
    .status, .bar, .ask, .words, .hint, .deck, .noted, .face, .home {
      position: absolute;
    }
    .status {
      top: 1.6%;
      left: 8%;
      right: 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 3.3cqw;
      font-weight: 700;
      letter-spacing: -0.02em;
      z-index: 3;
    }
    .glyphs { display: inline-flex; align-items: flex-end; gap: 1.1cqw; height: 2.6cqw; }
    .glyphs i, .bat {
      display: block;
      background: currentColor;
      border-radius: 1px;
    }
    .glyphs i { width: 0.55cqw; }
    .glyphs i:nth-child(1) { height: 30%; }
    .glyphs i:nth-child(2) { height: 55%; }
    .glyphs i:nth-child(3) { height: 80%; }
    .glyphs i:nth-child(4) { height: 100%; }
    .bat {
      width: 5.2cqw;
      height: 2.5cqw;
      border-radius: 0.6cqw;
      background: transparent;
      box-shadow: inset 0 0 0 1.5px currentColor;
      position: relative;
    }
    .bat::after {
      content: "";
      position: absolute;
      inset: 2px 3px 2px 2px;
      border-radius: 0.3cqw;
      background: currentColor;
    }
    .bar {
      z-index: 4;
      top: 6.2%;
      left: 5%;
      right: 5%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .back {
      width: 8.4cqw;
      height: 8.4cqw;
      justify-self: start;
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .back:disabled { cursor: default; }
    .back:focus-visible {
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #1c1915;
    }
    .back svg { width: 46%; height: 46%; }
    .mark {
      margin: 0;
      font-size: 3.6cqw;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .ask {
      z-index: 2;
      top: 15%;
      left: 10%;
      right: 10%;
      text-align: center;
    }
    .ask h1, .noted h2, .noted p { margin: 0; }
    .ask h1 {
      font-size: 4.5cqw;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .ask p {
      margin: 0.7em 0 0;
      font-size: 2.9cqw;
      opacity: 0.72;
    }
    .words {
      z-index: 2;
      top: 27%;
      left: 6%;
      right: 6%;
      height: 16%;
      display: grid;
      place-items: center;
    }
    .word {
      grid-area: 1 / 1;
      margin: 0;
      font-size: 13.2cqw;
      font-weight: 780;
      letter-spacing: -0.055em;
      line-height: 0.9;
      white-space: nowrap;
    }
    .face {
      z-index: 1;
      left: 50%;
      top: 41%;
      width: 78%;
      transform: translate(-50%, 0);
      transition: transform 680ms cubic-bezier(.22, 1, .36, 1);
    }
    .hint {
      z-index: 4;
      left: 50%;
      bottom: 32%;
      transform: translate(-50%, 0);
      margin: 0;
      padding: 0.45em 0.8em;
      border-radius: 999px;
      background: rgba(55, 52, 48, 0.78);
      color: #fff;
      font-size: 2.7cqw;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 180ms linear;
    }
    .is-moving .hint, .is-noted .hint { opacity: 0; }
    .deck {
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34%;
      touch-action: none;
    }
    .card {
      position: absolute;
      left: 50%;
      bottom: -6%;
      width: 46%;
      height: 72%;
      border: 0;
      padding: 0;
      border-radius: 18% 18% 12% 12%;
      background: var(--card-bg, #fdd880);
      cursor: pointer;
      transform-origin: 50% 120%;
    }
    .card svg { width: 58%; height: auto; margin-top: 18%; }
    .card:focus { outline: none; }
    .card[aria-checked="true"],
    .card:focus-visible {
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #1c1915;
    }
    .puck {
      position: absolute;
      z-index: 30;
      left: 50%;
      top: 18%;
      width: 7.2cqw;
      height: 7.2cqw;
      margin-left: -3.6cqw;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0.8cqw 1.8cqw rgba(40, 30, 20, 0.18);
      pointer-events: none;
    }
    .noted {
      z-index: 2;
      top: 16%;
      left: 8%;
      right: 8%;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }
    .noted-mood {
      font-size: 3.2cqw;
      font-weight: 750;
      letter-spacing: 0.14em;
    }
    .noted h2 {
      margin-top: 0.25em;
      font-size: 9.2cqw;
      font-weight: 760;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }
    .is-noted .noted {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }
    .is-noted .ask, .is-noted .words {
      opacity: 0;
      pointer-events: none;
    }
    .is-noted .deck { opacity: 0; }
    .is-noted .face { transform: translate(-50%, 8%); }
    .ask, .words, .deck, .noted, .face {
      transition: opacity 680ms cubic-bezier(.22, 1, .36, 1), transform 680ms cubic-bezier(.22, 1, .36, 1);
    }
    .home {
      z-index: 2;
      left: 50%;
      bottom: 1.6%;
      width: 28%;
      height: 0.7cqw;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(20, 16, 12, 0.82);
      pointer-events: none;
    }
    @media (max-width: 560px) {
      .fit { padding: 0; }
      .phone {
        width: 100vw;
        height: 100dvh;
        aspect-ratio: auto;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .screen { border-radius: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ask, .words, .deck, .noted, .face, .hint { transition: none; }
    }
  </style>
</head>
<body>
  <div class="fit">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="glyphs"><i></i><i></i><i></i><i></i><span class="bat"></span></span>
        </div>
        <div class="bar">
          <button class="back" id="back" type="button" disabled aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <p class="mark">check-in</p>
        </div>
        <svg class="face" id="face" viewBox="0 0 200 168" aria-hidden="true">
          <ellipse id="head" cx="100" cy="96" rx="74" ry="66" fill="var(--face)"/>
          <g id="brows" opacity="0" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round">
            <path d="M62 78l16 8"/>
            <path d="M138 78l-16 8"/>
          </g>
          <g id="dot-eyes" fill="var(--ink)">
            <circle cx="76" cy="98" r="6"/>
            <circle cx="124" cy="98" r="6"/>
          </g>
          <g id="arc-eyes" opacity="0" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round">
            <path d="M66 100c6-10 16-10 22 0"/>
            <path d="M112 100c6-10 16-10 22 0"/>
          </g>
          <path id="mouth" d="M74 118h52" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="ask" id="ask">
          <h1>How are you feeling right now?</h1>
          <p>Slide to check in. There is no wrong answer.</p>
        </div>
        <div class="words" id="words" aria-hidden="true"></div>
        <p class="hint" id="hint">Tap the mood to select it</p>
        <div class="deck" id="deck" role="radiogroup" aria-label="How are you feeling right now?" aria-describedby="keys"></div>
        <div class="noted" id="noted">
          <p class="noted-mood" id="noted-mood" aria-hidden="true">OKAY</p>
          <h2>Noted, gently.</h2>
        </div>
        <div class="home" aria-hidden="true"></div>
        <div class="sr" id="live" aria-live="polite"></div>
        <p class="sr" id="keys">Left and right move the mood. Enter confirms the current one.</p>
      </div>
    </div>
  </div>
  <script>
    const moods = [
      { id: "low", label: "LOW", smile: -1, ink: "#1a305c", top: "#f3f6fb", mid: "#e7eefb", bot: "#d5e2f8", bloom: "rgba(53,122,223,0.42)", face: "#357adf", card: "#b9d4f8" },
      { id: "okay", label: "OKAY", smile: 0, ink: "#2a2414", top: "#faf7f2", mid: "#f6f0e4", bot: "#f8e3b8", bloom: "rgba(237,171,25,0.5)", face: "#edab19", card: "#fdd880" },
      { id: "good", label: "GOOD", smile: 0.52, ink: "#14321c", top: "#f4f7ef", mid: "#e7f3e4", bot: "#c9e6c2", bloom: "rgba(74,160,61,0.42)", face: "#4aa03d", card: "#9dd29a" },
      { id: "great", label: "GREAT", smile: 1, ink: "#4e261e", top: "#fbf6f1", mid: "#fdeee8", bot: "#f8d0c4", bloom: "rgba(247,91,69,0.42)", face: "#f75b45", card: "#febeb4" }
    ];
    const N = moods.length;
    const screen = document.getElementById("screen");
    const deck = document.getElementById("deck");
    const words = document.getElementById("words");
    const back = document.getElementById("back");
    const notedMood = document.getElementById("noted-mood");
    const live = document.getElementById("live");
    const mouth = document.getElementById("mouth");
    const brows = document.getElementById("brows");
    const dotEyes = document.getElementById("dot-eyes");
    const arcEyes = document.getElementById("arc-eyes");
    const motion = matchMedia("(prefers-reduced-motion: reduce)");

    const cards = moods.map((mood, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card";
      btn.dataset.i = String(i);
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-label", mood.label);
      btn.innerHTML = '<svg viewBox="0 0 80 70" aria-hidden="true"><ellipse cx="40" cy="40" rx="22" ry="18" fill="#241f12" opacity="0.9"/><g class="mini-dot" fill="#f7f4ee"><circle cx="32" cy="38" r="2.3"/><circle cx="48" cy="38" r="2.3"/></g><g class="mini-arc" fill="none" stroke="#f7f4ee" stroke-width="2" stroke-linecap="round" opacity="0"><path d="M28 39c3-5 8-5 11 0"/><path d="M41 39c3-5 8-5 11 0"/></g><path class="mini-brow" d="M28 32l8 4M52 32l-8 4" fill="none" stroke="#f7f4ee" stroke-width="2" stroke-linecap="round" opacity="0"/><path class="mini-mouth" d="M30 48h20" fill="none" stroke="#f7f4ee" stroke-width="2.2" stroke-linecap="round"/></svg>';
      deck.appendChild(btn);
      const word = document.createElement("p");
      word.className = "word";
      word.textContent = mood.label;
      words.appendChild(word);
      return { btn, word, miniMouth: btn.querySelector(".mini-mouth"), miniDot: btn.querySelector(".mini-dot"), miniArc: btn.querySelector(".mini-arc"), miniBrow: btn.querySelector(".mini-brow") };
    });
    const puck = document.createElement("div");
    puck.className = "puck";
    puck.setAttribute("aria-hidden", "true");
    deck.appendChild(puck);

    let pos = 1;
    let thumb = 0;
    let noted = false;
    let dragging = false;
    let dragged = false;
    let suppressClick = false;
    let pointerId = null;
    let captureEl = null;
    let originX = 0;
    let originPos = 1;
    let anim = null;
    let animGen = 0;
    let intent = 1;

    function mod(n) { return ((n % N) + N) % N; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function reduced() { return document.documentElement.classList.contains("reduce") || motion.matches; }
    function spacing() { return Math.max(120, deck.clientWidth * 0.46); }
    function cdist(i, value) {
      let d = i - mod(value);
      if (d > N / 2) d -= N;
      if (d < -N / 2) d += N;
      return d;
    }
    function mix(a, b, t) {
      const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
      const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
      return "rgb(" + pa.map((v, k) => Math.round(v + (pb[k] - v) * t)).join(" ") + ")";
    }
    function mixAlpha(a, b, t) {
      const ra = a.match(/[\d.]+/g).map(Number);
      const rb = b.match(/[\d.]+/g).map(Number);
      const c = ra.map((v, k) => v + (rb[k] - v) * t);
      return "rgba(" + c[0].toFixed(0) + "," + c[1].toFixed(0) + "," + c[2].toFixed(0) + "," + c[3].toFixed(3) + ")";
    }
    function sample(value) {
      const base = Math.floor(value);
      const t = value - base;
      const a = moods[mod(base)];
      const b = moods[mod(base + 1)];
      return {
        t: t,
        smile: a.smile + (b.smile - a.smile) * t,
        ink: mix(a.ink, b.ink, t),
        top: mix(a.top, b.top, t),
        mid: mix(a.mid, b.mid, t),
        bot: mix(a.bot, b.bot, t),
        bloom: mixAlpha(a.bloom, b.bloom, t),
        face: mix(a.face, b.face, t)
      };
    }
    function mouthPath(smile, x, y, w) {
      const bend = smile * w * 0.34;
      if (smile > 0.78) {
        return "M" + x + " " + y + " Q" + (x + w / 2) + " " + (y + bend) + " " + (x + w) + " " + y + " Q" + (x + w / 2) + " " + (y + bend * 0.45) + " " + x + " " + y;
      }
      return "M" + x + " " + y + " Q" + (x + w / 2) + " " + (y + bend) + " " + (x + w) + " " + y;
    }
    function paintFace(smile) {
      const happy = clamp((smile - 0.55) / 0.45, 0, 1);
      mouth.setAttribute("d", mouthPath(smile, 74, 118, 52));
      mouth.setAttribute("fill", smile > 0.78 ? "var(--ink)" : "none");
      dotEyes.style.opacity = String(1 - happy);
      arcEyes.style.opacity = String(happy);
      brows.style.opacity = String(clamp(-smile, 0, 1));
    }
    function currentIndex() { return mod(Math.round(pos)); }
    function apply() {
      const look = sample(pos);
      const root = document.documentElement.style;
      root.setProperty("--ink", look.ink);
      root.setProperty("--bg-top", look.top);
      root.setProperty("--bg-mid", look.mid);
      root.setProperty("--bg-bot", look.bot);
      root.setProperty("--bloom", look.bloom);
      root.setProperty("--face", look.face);
      paintFace(look.smile);
      const space = spacing();
      const current = currentIndex();
      cards.forEach((card, i) => {
        const d = cdist(i, pos);
        const ad = Math.abs(d);
        const shown = reduced() ? (i === current ? 1 : 0) : (ad >= 1 ? 0 : Math.cos(ad * Math.PI / 2));
        const blur = reduced() ? 0 : ad * 18;
        card.word.style.opacity = String(shown);
        card.word.style.filter = blur < 0.4 ? "none" : "blur(" + blur.toFixed(2) + "px)";
        card.word.style.transform = "translateX(" + (d * 58).toFixed(1) + "%)";
        const mood = moods[i];
        card.miniMouth.setAttribute("d", mouthPath(mood.smile, 30, 48, 20));
        card.miniMouth.setAttribute("fill", mood.smile > 0.78 ? "#f7f4ee" : "none");
        card.miniDot.style.opacity = String(mood.smile > 0.78 ? 0 : 1);
        card.miniArc.style.opacity = String(mood.smile > 0.78 ? 1 : 0);
        card.miniBrow.style.opacity = String(mood.smile < 0 ? 1 : 0);
        card.btn.style.setProperty("--card-bg", mood.card);
        card.btn.style.opacity = ad > 1.55 ? "0" : "1";
        card.btn.style.zIndex = String(20 - Math.round(ad * 8));
        card.btn.style.transform = "translate(calc(-50% + " + (d * space).toFixed(1) + "px), 0) rotate(" + (d * -13).toFixed(2) + "deg) scale(" + (1 - Math.min(0.2, ad * 0.12)).toFixed(3) + ")";
        const on = i === current;
        card.btn.setAttribute("aria-checked", on ? "true" : "false");
        card.btn.tabIndex = on ? 0 : -1;
      });
      puck.style.transform = "translateX(" + thumb.toFixed(1) + "px)";
      screen.classList.toggle("is-moving", dragging || !!anim);
    }
    function say(text) {
      if (live.textContent !== text) live.textContent = text;
    }
    function finishAt(value) {
      pos = mod(value);
      intent = pos;
      thumb = 0;
      anim = null;
      apply();
      if (!noted) say(moods[intent].label);
    }
    function stopAnim() {
      animGen += 1;
      if (anim) cancelAnimationFrame(anim);
      anim = null;
      dragging = false;
      if (pointerId !== null && captureEl) {
        try { captureEl.releasePointerCapture(pointerId); } catch (err) { void err; }
      }
      pointerId = null;
      captureEl = null;
    }
    function startAnim(target) {
      stopAnim();
      intent = mod(target);
      if (reduced()) {
        finishAt(intent);
        return;
      }
      const token = animGen;
      const from = pos;
      const fromThumb = thumb;
      const dist = Math.abs(target - from);
      const dur = Math.min(760, 420 + dist * 280);
      const t0 = performance.now();
      const step = (now) => {
        if (token !== animGen || noted) return;
        const t = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - t, 3);
        pos = from + (target - from) * e;
        thumb = fromThumb * (1 - e);
        apply();
        if (token !== animGen || noted) return;
        if (t < 1) anim = requestAnimationFrame(step);
        else finishAt(target);
      };
      anim = requestAnimationFrame(step);
    }
    function go(index) {
      if (noted) return;
      let target = index;
      while (target - pos > N / 2) target -= N;
      while (pos - target > N / 2) target += N;
      startAnim(target);
      const btn = cards[mod(index)].btn;
      if (deck.contains(document.activeElement) || document.activeElement === document.body) btn.focus();
    }
    function nearestTarget() {
      let target = Math.round(pos);
      while (target - pos > N / 2) target -= N;
      while (pos - target > N / 2) target += N;
      return target;
    }
    function focusIntent() {
      const btn = cards[intent].btn;
      btn.tabIndex = 0;
      btn.focus();
    }
    function confirmMood() {
      stopAnim();
      pos = intent;
      thumb = 0;
      const mood = moods[intent];
      noted = true;
      notedMood.textContent = mood.label;
      screen.classList.add("is-noted");
      back.disabled = false;
      back.setAttribute("aria-label", "Change this check-in");
      deck.removeAttribute("inert");
      apply();
      say("Noted, gently. " + mood.label);
      focusIntent();
    }
    function reopen() {
      if (!noted) return;
      noted = false;
      screen.classList.remove("is-noted");
      back.disabled = true;
      back.setAttribute("aria-label", "Back");
      deck.removeAttribute("inert");
      apply();
      focusIntent();
      say(moods[intent].label);
    }
    deck.addEventListener("pointerdown", (event) => {
      if (noted || event.button !== 0) return;
      const held = event.target.closest("button");
      if (!held) return;
      stopAnim();
      pointerId = event.pointerId;
      captureEl = held;
      held.setPointerCapture(event.pointerId);
      originX = event.clientX;
      originPos = pos;
      dragged = false;
      dragging = true;
      apply();
    });
    deck.addEventListener("pointermove", (event) => {
      if (event.pointerId !== pointerId) return;
      const dx = event.clientX - originX;
      if (Math.abs(dx) > 6) dragged = true;
      const space = spacing();
      pos = originPos - dx / space;
      thumb = clamp(dx, -space * 0.62, space * 0.62);
      apply();
    });
    function endDrag(event) {
      if (event.pointerId !== pointerId) return;
      pointerId = null;
      dragging = false;
      if (dragged) {
        suppressClick = true;
        startAnim(nearestTarget());
      } else apply();
    }
    deck.addEventListener("pointerup", endDrag);
    deck.addEventListener("pointercancel", endDrag);
    deck.addEventListener("click", (event) => {
      const btn = event.target.closest("button") || document.elementFromPoint(event.clientX, event.clientY)?.closest("button");
      if (!btn) return;
      if (suppressClick) {
        suppressClick = false;
        event.preventDefault();
        return;
      }
      const index = Number(btn.dataset.i);
      if (noted) {
        if (index === intent) confirmMood();
        else {
          reopen();
          go(index);
          cards[mod(index)].btn.focus();
        }
        return;
      }
      if (index === intent) confirmMood();
      else go(index);
    });
    deck.addEventListener("keydown", (event) => {
      if (noted) return;
      if (event.key === "ArrowRight") {
        event.preventDefault();
        go(intent + 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        go(intent - 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        go(0);
      } else if (event.key === "End") {
        event.preventDefault();
        go(N - 1);
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        confirmMood();
      }
    });
    back.addEventListener("click", reopen);
    document.addEventListener("keydown", (event) => {
      if (!noted) return;
      if (event.key === "Escape") {
        event.preventDefault();
        reopen();
      } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        const next = intent + (event.key === "ArrowRight" ? 1 : -1);
        reopen();
        go(next);
      }
    });
    motion.addEventListener("change", () => {
      document.documentElement.classList.toggle("reduce", motion.matches);
      if (motion.matches) {
        stopAnim();
        finishAt(intent);
      }
    });
    window.addEventListener("resize", apply);
    apply();
    say(moods[1].label);
  </script>
</body>
</html>
