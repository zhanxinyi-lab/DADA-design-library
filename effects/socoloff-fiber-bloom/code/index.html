<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiber Bloom</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #b7b5cb;
    }
    #bloom {
      display: block;
      width: 100vw;
      height: 100svh;
      touch-action: none;
      background: #b7b5cb;
    }
  </style>
</head>
<body>
  <canvas id="bloom" aria-label="抽象纤维绽放动画"></canvas>
  <script>
    (() => {
      const PALETTE = {
        mist: '#b7b5cb',
        peach: '#d09c92',
        ember: '#c16760',
        navy: '#141d41',
        plum: '#683a4a',
        blue: '#435796'
      };
      const CUTS = [0, 2367, 3300, 5533, 8000];
      const STATES = [
        { name: 'light-a', density: 260, exposure: 1.00, spread: 0.96, opacity: 0.46, zoom: 1.00, turn: 0.00, focusU: 0.46, focusV: 0.58 },
        { name: 'dark-a', density: 460, exposure: 0.88, spread: 1.02, opacity: 0.52, zoom: 1.58, turn: 0.06, focusU: 0.42, focusV: 0.62 },
        { name: 'light-b', density: 280, exposure: 1.00, spread: 0.98, opacity: 0.46, zoom: 1.08, turn: -0.42, focusU: 0.48, focusV: 0.54 },
        { name: 'dark-b', density: 480, exposure: 0.86, spread: 1.04, opacity: 0.54, zoom: 1.66, turn: 0.16, focusU: 0.44, focusV: 0.60 }
      ];
      const PETALS = [
        { s: 0.90, ang: -0.05, r: 0.345, warm: 0.88 },
        { s: 0.74, ang: -1.05, r: 0.315, warm: 0.14 },
        { s: 0.78, ang: 0.92, r: 0.335, warm: 0.94 },
        { s: 0.40, ang: 2.35, r: 0.185, warm: 0.20 },
        { s: 0.52, ang: 1.55, r: 0.165, warm: 0.66 }
      ];
      const PETAL_ORDER = [0, 1, 2, 0, 1, 2, 0, 2, 3, 4];
      const FIBER_COUNT = 490;
      const SAMPLES = 12;

      function hexToRgb(hex) {
        const value = Number.parseInt(hex.slice(1), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
      }

      const RGB = {
        mist: hexToRgb(PALETTE.mist),
        peach: hexToRgb(PALETTE.peach),
        ember: hexToRgb(PALETTE.ember),
        navy: hexToRgb(PALETTE.navy),
        plum: hexToRgb(PALETTE.plum),
        blue: hexToRgb(PALETTE.blue)
      };

      const fibers = [];
      const scratch = { pts: new Array(SAMPLES * 2), n: 0 };
      let width = 1;
      let height = 1;
      let lightFit = { scale: 1, tx: 0, ty: 0 };
      let lightFitKey = '';
      let fittingLight = false;
      let raf = 0;
      let resizeQueued = 0;
      let reducedMotion = false;
      let origin = 0;
      let ctx = null;
      let motionQuery = null;

      function seeded(index, salt) {
        let n = (index + 1) * 374761393 + (salt + 1) * 668265263;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) / 4294967296;
      }

      function clamp(value, min, max) {
        if (value < min) return min;
        if (value > max) return max;
        return value;
      }

      function mix(a, b, t) {
        return a + (b - a) * clamp(t, 0, 1);
      }

      function easeInOut(t) {
        const u = clamp(t, 0, 1);
        return u * u * (3 - 2 * u);
      }

      function mixRgb(a, b, t) {
        return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
      }

      function rgbCss(channels) {
        return 'rgb(' + (channels[0] | 0) + ',' + (channels[1] | 0) + ',' + (channels[2] | 0) + ')';
      }

      function rgba(channels, alpha) {
        return 'rgba(' + (channels[0] | 0) + ',' + (channels[1] | 0) + ',' + (channels[2] | 0) + ',' + clamp(alpha, 0, 1) + ')';
      }

      function cubic(a, b, c, d, t) {
        const u = 1 - t;
        return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d;
      }

      function bloomBox() {
        const aspect = 960 / 720;
        let boxW = width * 0.98;
        let boxH = boxW * aspect;
        if (boxH > height * 0.98) {
          boxH = height * 0.98;
          boxW = boxH / aspect;
        }
        return {
          x: (width - boxW) * 0.5,
          y: (height - boxH) * 0.5,
          w: Math.max(1, boxW),
          h: Math.max(1, boxH)
        };
      }

      function ensureLightFit() {
        const key = width + 'x' + height;
        if (key === lightFitKey) return;
        const state = STATES[0];
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        fittingLight = true;
        for (let openEnd = 0; openEnd < 2; openEnd += 1) {
          for (let swayEnd = -1; swayEnd <= 1; swayEnd += 2) {
            for (let index = 0; index < state.density; index += 1) {
              const path = fiberPath(fibers[index], openEnd, state, swayEnd);
              const pts = path.pts;
              for (let point = 0; point < path.n; point += 2) {
                const x = pts[point];
                const y = pts[point + 1];
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }
        }
        fittingLight = false;
        const envelopeW = Math.max(1, maxX - minX);
        const envelopeH = Math.max(1, maxY - minY);
        if (minX >= 0 && minY >= 0 && maxX <= width && maxY <= height) {
          lightFit = { scale: 1, tx: 0, ty: 0 };
          lightFitKey = key;
          return;
        }
        const pad = 1;
        const scale = Math.min(1, Math.max(1, width - pad * 2) / envelopeW, Math.max(1, height - pad * 2) / envelopeH);
        lightFit = {
          scale: scale,
          tx: (width - envelopeW * scale) * 0.5 - minX * scale,
          ty: (height - envelopeH * scale) * 0.5 - minY * scale
        };
        lightFitKey = key;
      }

      function spinePoint(box, s) {
        return [
          box.x + cubic(0.38, 0.20, 0.32, 0.48, s) * box.w,
          box.y + cubic(0.90, 0.78, 0.64, 0.50, s) * box.h
        ];
      }

      function createFibers() {
        fibers.length = 0;
        for (let index = 0; index < FIBER_COUNT; index += 1) {
          const petal = PETALS[PETAL_ORDER[index % PETAL_ORDER.length]];
          const warm = clamp(petal.warm + (seeded(index, 9) - 0.5) * 0.12, 0, 1);
          const layerRoll = seeded(index, 5);
          const layer = layerRoll > 0.8 ? 0.46 + layerRoll * 0.22 : 0.84 + layerRoll * 0.16;
          const mid = warm > 0.45 ? mixRgb(RGB.blue, RGB.ember, warm) : mixRgb(RGB.blue, RGB.plum, 0.35);
          const rim = mixRgb(RGB.mist, RGB.peach, warm);
          fibers.push({
            petal: PETAL_ORDER[index % PETAL_ORDER.length],
            across: seeded(index, 4) * 2 - 1,
            layer: layer,
            phase: seeded(index, 3) * Math.PI * 2,
            girth: 0.75 + seeded(index, 7) * 0.7,
            veil: 0.55 + seeded(index, 2) * 0.45,
            rootColor: rgbCss(mixRgb(RGB.navy, RGB.blue, 0.3)),
            midColor: rgbCss(mid),
            rimColor: rgbCss(rim)
          });
        }
      }

      function resizeCanvas() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        width = Math.max(1, window.innerWidth || 1);
        height = Math.max(1, window.innerHeight || 1);
        const canvas = ctx.canvas;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function stateAt(ms) {
        const span = CUTS[CUTS.length - 1];
        const t = ((ms % span) + span) % span;
        let index = 0;
        for (let cut = 1; cut < CUTS.length - 1; cut += 1) {
          if (t >= CUTS[cut]) index = cut;
        }
        const start = CUTS[index];
        const end = CUTS[index + 1];
        return { state: STATES[index], localT: (t - start) / (end - start) };
      }

      function fiberPath(fiber, localT, state, swayLimit) {
        if (!fittingLight && state.name === 'light-a') ensureLightFit();
        const box = bloomBox();
        const petal = PETALS[fiber.petal];
        const open = 0.975 + 0.025 * easeInOut(localT);
        const reach = petal.r * box.w * state.spread * open * fiber.layer;
        const swayUnit = swayLimit === undefined ? Math.sin(localT * Math.PI * 2 + fiber.phase) : swayLimit;
        const sway = swayUnit * box.w * 0.012;
        const ax = [Math.sin(petal.ang), -Math.cos(petal.ang)];
        const nm = [Math.cos(petal.ang), Math.sin(petal.ang)];
        const root = spinePoint(box, petal.s);
        const centerX = root[0] + ax[0] * reach * 0.92;
        const centerY = root[1] + ax[1] * reach * 0.92;
        const pts = scratch.pts;
        for (let step = 0; step < SAMPLES; step += 1) {
          const t = step / (SAMPLES - 1);
          const d = (-0.9 + t * 1.86) * reach;
          const half = Math.sqrt(Math.max(0, reach * reach - Math.min(reach * reach, d * d)));
          const taper = t < 0.14 ? Math.min(1, t / 0.14) : 1;
          pts[step * 2] = centerX + ax[0] * d + nm[0] * fiber.across * half * taper + sway * t;
          pts[step * 2 + 1] = centerY + ax[1] * d + nm[1] * fiber.across * half * taper;
        }
        if (!fittingLight && state.name === 'light-a' && (lightFit.scale !== 1 || lightFit.tx !== 0 || lightFit.ty !== 0)) {
          const scale = lightFit.scale;
          const tx = lightFit.tx;
          const ty = lightFit.ty;
          for (let step = 0; step < SAMPLES; step += 1) {
            const x = pts[step * 2];
            const y = pts[step * 2 + 1];
            pts[step * 2] = x * scale + tx;
            pts[step * 2 + 1] = y * scale + ty;
          }
        }
        scratch.n = SAMPLES * 2;
        return scratch;
      }

      function drawBackground() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.filter = 'none';
        ctx.fillStyle = PALETTE.mist;
        ctx.fillRect(0, 0, width, height);
      }

      function drawPetalFills(state, localT) {
        const box = bloomBox();
        const open = 0.975 + 0.025 * easeInOut(localT);
        if (state.name === 'light-a') ensureLightFit();
        const fitted = state.name === 'light-a' && (lightFit.scale !== 1 || lightFit.tx !== 0 || lightFit.ty !== 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        for (let index = 0; index < PETALS.length; index += 1) {
          const petal = PETALS[index];
          let reach = petal.r * box.w * state.spread * open;
          const ax = [Math.sin(petal.ang), -Math.cos(petal.ang)];
          const root = spinePoint(box, petal.s);
          let cx = root[0] + ax[0] * reach * 0.92;
          let cy = root[1] + ax[1] * reach * 0.92;
          if (fitted) {
            cx = cx * lightFit.scale + lightFit.tx;
            cy = cy * lightFit.scale + lightFit.ty;
            reach *= lightFit.scale;
          }
          const inner = petal.warm > 0.45 ? RGB.ember : RGB.blue;
          const outer = petal.warm > 0.45 ? RGB.peach : RGB.mist;
          const wash = ctx.createRadialGradient(cx, cy, reach * 0.08, cx, cy, reach);
          wash.addColorStop(0, rgba(inner, 0.22 * state.exposure));
          wash.addColorStop(0.62, rgba(outer, 0.10 * state.exposure));
          wash.addColorStop(1, rgba(outer, 0));
          ctx.fillStyle = wash;
          ctx.beginPath();
          ctx.arc(cx, cy, reach, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawCore(state) {
        const box = bloomBox();
        const fitted = state.name === 'light-a';
        if (fitted) ensureLightFit();
        const scale = fitted ? lightFit.scale : 1;
        const tx = fitted ? lightFit.tx : 0;
        const ty = fitted ? lightFit.ty : 0;
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'none';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        const first = spinePoint(box, 0);
        ctx.moveTo(first[0] * scale + tx, first[1] * scale + ty);
        for (let step = 1; step <= 16; step += 1) {
          const point = spinePoint(box, step / 16);
          ctx.lineTo(point[0] * scale + tx, point[1] * scale + ty);
        }
        ctx.globalAlpha = 0.92;
        ctx.strokeStyle = PALETTE.navy;
        ctx.lineWidth = Math.max(8, box.w * 0.034) * scale;
        ctx.stroke();
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = PALETTE.blue;
        ctx.lineWidth = Math.max(2, box.w * 0.01) * scale;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function strokeFiber(g) {
        const pts = g.pts;
        ctx.beginPath();
        ctx.moveTo(pts[0], pts[1]);
        for (let index = 2; index < g.n; index += 2) ctx.lineTo(pts[index], pts[index + 1]);
        ctx.stroke();
      }

      function drawFiber(fiber, localT, state, soft) {
        const g = fiberPath(fiber, localT, state);
        const last = g.n - 2;
        const grad = ctx.createLinearGradient(g.pts[0], g.pts[1], g.pts[last], g.pts[last + 1]);
        grad.addColorStop(0, fiber.rootColor);
        grad.addColorStop(0.38, fiber.midColor);
        grad.addColorStop(1, fiber.rimColor);
        ctx.strokeStyle = grad;
        ctx.globalAlpha = clamp(state.opacity * state.exposure * fiber.veil * (soft ? 0.55 : 0.9), 0, 0.9);
        ctx.lineWidth = soft
          ? clamp(fiber.girth * 2.1, 1.1, 3.2)
          : clamp(fiber.girth * 0.85, 0.55, 1.45);
        strokeFiber(g);
      }

      function renderBloom(state, localT) {
        const count = clamp(state.density, 0, fibers.length) | 0;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        drawPetalFills(state, localT);
        drawCore(state);
        ctx.filter = 'blur(1.1px)';
        for (let index = 0; index < count; index += 1) drawFiber(fibers[index], localT, state, true);
        ctx.filter = 'none';
        for (let index = 0; index < count; index += 1) drawFiber(fibers[index], localT, state, false);
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      function render(now) {
        const elapsed = reducedMotion ? 0 : now - origin;
        const frame = stateAt(elapsed);
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawBackground();
        const box = bloomBox();
        const focusX = box.x + box.w * frame.state.focusU;
        const focusY = box.y + box.h * frame.state.focusV;
        ctx.translate(focusX, focusY);
        if (frame.state.turn) ctx.rotate(frame.state.turn);
        if (frame.state.zoom !== 1) ctx.scale(frame.state.zoom, frame.state.zoom);
        ctx.translate(-focusX, -focusY);
        renderBloom(frame.state, frame.localT);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function stop() {
        if (!raf) return;
        window.cancelAnimationFrame(raf);
        raf = 0;
      }

      function start() {
        if (raf || reducedMotion) return;
        raf = window.requestAnimationFrame(tick);
      }

      function tick(now) {
        render(now);
        raf = reducedMotion ? 0 : window.requestAnimationFrame(tick);
      }

      function drawStill() {
        render(0);
      }

      function onResize() {
        if (reducedMotion) {
          resizeCanvas();
          drawStill();
          return;
        }
        if (resizeQueued) return;
        resizeQueued = window.requestAnimationFrame(() => {
          resizeQueued = 0;
          resizeCanvas();
        });
      }

      function applyMotion() {
        reducedMotion = !!(motionQuery && motionQuery.matches);
        stop();
        if (resizeQueued) {
          window.cancelAnimationFrame(resizeQueued);
          resizeQueued = 0;
        }
        if (reducedMotion) {
          drawStill();
          return;
        }
        origin = performance.now();
        render(origin);
        start();
      }

      const canvas = document.getElementById('bloom');
      ctx = canvas ? canvas.getContext('2d', { alpha: false }) : null;
      if (!ctx) return;
      createFibers();
      resizeCanvas();
      motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      window.addEventListener('resize', onResize);
      if (motionQuery.addEventListener) motionQuery.addEventListener('change', applyMotion);
      applyMotion();
    })();
  </script>
</body>
</html>
