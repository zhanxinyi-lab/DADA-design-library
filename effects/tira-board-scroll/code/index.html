<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夹板翻开的滚动</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #161616;
      --paper: #e4ddd4;
      --sky: #9fd0ea;
      --pink: #ff2f86;
      --skin: #f0c2a4;
      --hair: #2a211c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .track { height: 480vh; }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(90% 70% at 78% 42%, var(--sky) 0%, rgba(159, 208, 234, 0) 58%),
        linear-gradient(180deg, #ddd6cc 0%, var(--paper) 42%, #cfc6bb 100%);
    }
    .grain, .specks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .grain {
      opacity: .45;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.55'/></svg>");
    }
    .specks span {
      position: absolute;
      border-radius: 50%;
      background: var(--ink);
    }
    .top {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      padding: 18px 22px 0;
    }
    .mark {
      width: 108px;
      min-height: 64px;
      padding: 8px 10px 10px;
      background: var(--ink);
      color: #fff;
      transform: rotate(-6deg);
      box-shadow: 6px 8px 0 rgba(255, 47, 134, .85);
    }
    .mark b {
      display: block;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 28px;
      letter-spacing: .04em;
      line-height: .9;
    }
    .mark span {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      letter-spacing: .16em;
    }
    .nav {
      position: relative;
      display: flex;
      gap: 22px;
      margin: 10px auto 0;
      padding: 0 8px 10px;
      font-size: 12px;
      letter-spacing: .14em;
    }
    .nav span { position: relative; }
    .nav i {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 28px;
      height: 4px;
      border-radius: 4px;
      background: var(--pink);
    }
    .tools {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .tools i {
      width: 28px;
      height: 28px;
      border: 2px solid var(--ink);
      border-radius: 7px;
      background:
        linear-gradient(var(--ink), var(--ink)) center / 10px 2px no-repeat,
        #fff;
    }
    .tools i:nth-child(2) { border-radius: 50%; background: radial-gradient(circle at 50% 50%, var(--ink) 3px, transparent 4px), #fff; }
    .copy, .figure, .stickers, .wall, .board { position: absolute; }
    .copy { z-index: 2; left: 7%; top: 18%; width: min(46vw, 560px); }
    .line {
      margin: 0;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(46px, 7vw, 92px);
      line-height: .86;
      letter-spacing: -.02em;
    }
    .stack { position: relative; }
    #lineB {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
    }
    .line span, .script {
      display: inline-block;
      will-change: transform, opacity;
    }
    .script {
      margin: 10px 0 0;
      color: var(--pink);
      font-family: "Segoe Script", "Comic Sans MS", cursive;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1;
    }
    .brush {
      display: block;
      width: min(240px, 46vw);
      height: 16px;
      margin-top: -6px;
    }
    .subs { position: relative; min-height: 4.2em; margin-top: 16px; }
    .sub {
      max-width: 240px;
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
    }
    #subB { position: absolute; left: 0; top: 0; }
    .figure {
      z-index: 3;
      right: 4%;
      bottom: 0;
      width: min(42vw, 460px);
      height: 78%;
    }
    .figure svg { width: 100%; height: 100%; overflow: visible; }
    .pose { transform-origin: 50% 70%; }
    .stickers { z-index: 2; inset: 0; pointer-events: none; }
    .bird, .bloom, .sketch {
      position: absolute;
    }
    .bird { left: 1%; top: 58%; width: 118px; }
    .bloom { left: 18%; bottom: 5%; width: 72px; }
    .sketch {
      right: 0;
      top: 12%;
      width: 150px;
      transform: rotate(8deg);
    }
    .wall { z-index: 2; inset: 0; pointer-events: none; }
    .bandage, .drip, .note { position: absolute; opacity: 0; }
    .bandage { left: 8%; bottom: 22%; width: 92px; transform: rotate(-18deg); }
    .drip { left: 30%; bottom: 16%; width: 54px; }
    .note {
      right: 28%;
      bottom: 18%;
      width: 150px;
      padding: 16px 14px 12px;
      background: #f7f4ee;
      clip-path: polygon(4% 8%, 96% 0, 100% 78%, 88% 100%, 0 92%);
      box-shadow: 0 8px 0 rgba(22, 22, 22, .08);
      font-family: "Segoe Script", "Comic Sans MS", cursive;
      font-size: 22px;
    }
    .note svg { display: block; width: 100px; height: 12px; }
    .board {
      z-index: 4;
      left: 5%;
      right: 7%;
      bottom: 0;
      height: 44%;
      transform-origin: 82% 18%;
      filter: drop-shadow(0 18px 0 rgba(22, 22, 22, .18));
    }
    .sheet {
      position: absolute;
      left: 10%;
      right: 14%;
      top: -28px;
      height: 54px;
      background: linear-gradient(#f3e6cf, #e7d3ae);
      border: 2px solid #2b241c;
      transform-origin: 50% 100%;
    }
    .slab {
      position: absolute;
      inset: 18px 0 0;
      background:
        radial-gradient(12px 18px at 8% 30%, var(--pink) 0 70%, transparent 72%),
        linear-gradient(180deg, #2a2a2a, #111 70%);
      border: 3px solid #0c0c0c;
      border-radius: 18px;
    }
    .grommet {
      position: absolute;
      top: 10px;
      width: 22px;
      height: 22px;
      border: 3px solid #d7d7d7;
      border-radius: 50%;
      background: #222;
      z-index: 2;
    }
    .grommet.a { left: 18%; }
    .grommet.b { left: 68%; }
    .cord {
      position: absolute;
      top: 18px;
      width: 8px;
      height: 120%;
      background: #2c241c;
      border-radius: 8px;
      z-index: 1;
    }
    .cord.a { left: 20%; transform: rotate(28deg); }
    .cord.b { left: 70%; transform: rotate(-24deg); }
    .label {
      position: absolute;
      left: 7%;
      bottom: 16%;
      width: 150px;
      padding: 8px 10px;
      background: #f4f1ea;
      color: var(--ink);
      transform: rotate(-3deg);
    }
    .label b {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 28px;
      line-height: .85;
    }
    .label span { display: block; font-size: 11px; letter-spacing: .08em; }
    .drop {
      position: absolute;
      right: 8%;
      top: 28%;
      width: 70px;
    }
    .hint {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 16px;
      margin: 0;
      padding: 6px 10px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, .72);
      font-size: 12px;
      letter-spacing: .08em;
    }
    @media (max-width: 720px) {
      .nav { display: none; }
      .copy { top: 18%; width: 78%; }
      .line { font-size: 56px; }
      .script { font-size: 32px; }
      .figure { width: 54vw; height: 46%; }
      .bird { width: 84px; }
      .sketch { display: none; }
      .board { height: 36%; left: 0; right: 0; }
      .note { right: 6%; bottom: 40%; }
    }
  </style>
</head>
<body>
  <div class="track" id="track"></div>
  <main class="stage" id="stage">
    <div class="grain"></div>
    <div class="specks" aria-hidden="true">
      <span style="left:14%;top:18%;width:7px;height:7px"></span>
      <span style="left:22%;top:46%;width:4px;height:4px"></span>
      <span style="left:48%;top:12%;width:5px;height:5px"></span>
      <span style="left:63%;top:28%;width:8px;height:8px;background:#ff2f86"></span>
      <span style="left:80%;top:70%;width:6px;height:6px"></span>
      <span style="left:36%;top:72%;width:5px;height:9px;border-radius:40%"></span>
    </div>
    <header class="top">
      <div class="mark"><b>INK</b><span>WALL STUDY</span></div>
      <nav class="nav" id="nav">
        <span>START</span><span>LINES</span><span>FOLIO</span><span>NOTE</span>
        <i id="marker"></i>
      </nav>
      <div class="tools" aria-hidden="true"><i></i><i></i><i></i></div>
    </header>
    <section class="copy">
      <div class="stack">
        <h1 class="line" id="lineA">DRAW IT
LOUD</h1>
        <h2 class="line" id="lineB">THE BOOK</h2>
      </div>
      <p class="script" id="script">keep going</p>
      <svg class="brush" id="brush" viewBox="0 0 240 16" aria-hidden="true">
        <path d="M2 10 C40 2 70 14 110 8 C150 2 190 13 238 6" fill="none" stroke="#ff2f86" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <div class="subs">
        <p class="sub" id="subA">A paper wall. Scroll turns the page.</p>
        <p class="sub" id="subB">The folio swings aside.</p>
      </div>
    </section>
    <div class="stickers" id="leftBits" aria-hidden="true">
      <svg class="bird" viewBox="0 0 160 110">
        <path d="M10 70 Q40 20 78 48 Q96 18 132 36 Q90 58 70 88 Q48 74 10 70" fill="#f7f4ee" stroke="#161616" stroke-width="3"/>
        <path d="M78 48 Q110 40 148 62" fill="none" stroke="#161616" stroke-width="3"/>
        <circle cx="40" cy="52" r="3" fill="#161616"/>
      </svg>
      <svg class="bloom" viewBox="0 0 90 120">
        <path d="M45 120 Q48 70 45 46" stroke="#3f6b3a" stroke-width="4" fill="none"/>
        <ellipse cx="45" cy="36" rx="16" ry="22" fill="#ff4f98"/>
        <ellipse cx="28" cy="48" rx="14" ry="18" fill="#ffd1e4"/>
        <ellipse cx="62" cy="48" rx="14" ry="18" fill="#ff7eb6"/>
      </svg>
      <svg class="sketch" viewBox="0 0 140 160">
        <path d="M20 20 H120 V130 L100 150 H16 Z" fill="#f7f4ee" stroke="#161616" stroke-width="3"/>
        <circle cx="70" cy="68" r="22" fill="none" stroke="#161616" stroke-width="3"/>
        <path d="M40 112 Q70 96 104 116" fill="none" stroke="#161616" stroke-width="3"/>
      </svg>
    </div>
    <div class="figure" id="figure" aria-hidden="true">
      <svg viewBox="0 0 300 460">
        <defs>
          <filter id="cut" x="-20%" y="-20%" width="140%" height="140%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="d"/>
            <feFlood flood-color="#fff" result="w"/>
            <feComposite in="w" in2="d" operator="in" result="o"/>
            <feMerge>
              <feMergeNode in="o"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g class="pose" id="pose0" filter="url(#cut)">
          <path fill="#2a211c" d="M92 78 Q150 18 214 78 Q226 150 196 162 Q150 128 104 162 Q78 146 92 78"/>
          <ellipse cx="152" cy="128" rx="54" ry="62" fill="#f0c2a4"/>
          <ellipse cx="134" cy="126" rx="5" ry="6" fill="#161616"/>
          <ellipse cx="172" cy="126" rx="5" ry="6" fill="#161616"/>
          <path d="M138 154 Q152 166 168 154" fill="none" stroke="#161616" stroke-width="3"/>
          <path d="M126 186 Q152 198 180 186" fill="none" stroke="#161616" stroke-width="3"/>
          <path d="M120 202 Q152 216 184 202" fill="none" stroke="#161616" stroke-width="3"/>
          <path fill="#161616" d="M78 214 Q152 188 226 214 L248 450 H54 Z"/>
          <path fill="#f0c2a4" d="M78 230 Q36 290 58 352 Q78 356 86 324 Q98 270 108 236 Z"/>
          <path fill="#f0c2a4" d="M222 230 Q266 286 244 350 Q224 356 214 322 Q202 268 192 236 Z"/>
        </g>
        <g class="pose" id="pose1" filter="url(#cut)">
          <path fill="#2a211c" d="M118 70 Q186 24 214 96 Q198 168 150 156 Q112 140 108 96 Z"/>
          <ellipse cx="168" cy="124" rx="42" ry="60" fill="#f0c2a4"/>
          <ellipse cx="184" cy="122" rx="5" ry="6" fill="#161616"/>
          <path d="M176 150 Q190 158 198 148" fill="none" stroke="#161616" stroke-width="3"/>
          <path d="M150 184 Q176 196 196 180" fill="none" stroke="#161616" stroke-width="3"/>
          <path fill="#161616" d="M96 220 Q168 196 230 230 L246 450 H70 Z"/>
          <path fill="#f0c2a4" d="M96 236 Q58 300 84 356 Q104 348 108 318 Q118 270 126 240 Z"/>
        </g>
        <g class="pose" id="pose2" filter="url(#cut)">
          <path fill="#2a211c" d="M108 92 Q156 28 214 70 Q236 40 250 78 Q210 120 196 150 Q150 132 112 156 Q86 130 108 92"/>
          <ellipse cx="156" cy="132" rx="52" ry="60" fill="#f0c2a4"/>
          <ellipse cx="140" cy="128" rx="5" ry="6" fill="#161616"/>
          <ellipse cx="176" cy="130" rx="5" ry="6" fill="#161616"/>
          <path d="M146 156 Q158 164 170 156" fill="none" stroke="#161616" stroke-width="3"/>
          <path fill="#161616" d="M84 230 Q156 200 228 228 L246 450 H64 Z"/>
          <path fill="#f0c2a4" d="M150 150 Q118 96 168 78 Q196 108 184 156 Q166 168 150 150"/>
          <path fill="#f0c2a4" d="M228 236 Q270 210 286 164 Q300 158 292 184 Q274 230 236 250 Z"/>
        </g>
        <g class="pose" id="pose3" filter="url(#cut)">
          <path fill="#2a211c" d="M150 36 Q176 18 188 48 Q210 40 196 72 Q214 96 196 120 Q150 100 112 124 Q96 80 124 58 Q112 36 150 36"/>
          <ellipse cx="156" cy="132" rx="50" ry="58" fill="#f0c2a4"/>
          <circle cx="138" cy="128" r="12" fill="none" stroke="#161616" stroke-width="3"/>
          <circle cx="174" cy="128" r="12" fill="none" stroke="#161616" stroke-width="3"/>
          <path d="M146 156 Q156 166 170 156" fill="none" stroke="#161616" stroke-width="3"/>
          <path fill="#161616" d="M86 224 Q156 198 226 224 L244 450 H62 Z"/>
          <path fill="#f0c2a4" d="M90 240 Q52 292 74 348 Q92 344 98 316 Q108 270 118 242 Z"/>
          <path fill="#f0c2a4" d="M214 238 Q258 286 238 346 Q218 342 214 314 Q206 270 198 240 Z"/>
        </g>
      </svg>
    </div>
    <div class="wall" id="wall" aria-hidden="true">
      <svg class="bandage" viewBox="0 0 92 36">
        <rect x="2" y="8" width="88" height="20" rx="10" fill="#f7f4ee" stroke="#161616" stroke-width="3"/>
        <circle cx="46" cy="18" r="5" fill="#ff2f86"/>
      </svg>
      <svg class="drip" viewBox="0 0 54 80">
        <path d="M27 4 C40 28 50 40 50 54 A23 23 0 1 1 4 54 C4 40 14 28 27 4" fill="#ff2f86"/>
        <path d="M27 70 V80" stroke="#161616" stroke-width="3"/>
      </svg>
      <div class="note" id="note">It holds.
        <svg viewBox="0 0 100 12"><path id="noteLine" d="M2 8 C30 2 60 10 98 4" fill="none" stroke="#ff2f86" stroke-width="4" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="board" id="board" aria-hidden="true">
      <div class="sheet" id="sheet"></div>
      <div class="slab">
        <i class="cord a"></i><i class="cord b"></i>
        <i class="grommet a"></i><i class="grommet b"></i>
        <div class="label"><b>FOLIO</b><span>PAGE ONE</span></div>
        <svg class="drop" viewBox="0 0 70 70" aria-hidden="true">
          <path d="M18 8 C40 6 58 28 48 48 C40 64 16 60 12 42 C8 24 8 12 18 8" fill="none" stroke="#f4f1ea" stroke-width="4"/>
          <path d="M30 18 C34 30 28 40 22 36" fill="none" stroke="#ff2f86" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <p class="hint" id="hint">滚动、触摸或按方向键</p>
  </main>
  <script>
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const lineA = document.getElementById("lineA");
    const lineB = document.getElementById("lineB");
    const script = document.getElementById("script");
    const subA = document.getElementById("subA");
    const subB = document.getElementById("subB");
    const brush = document.querySelector("#brush path");
    const noteLine = document.getElementById("noteLine");
    const poses = [0, 1, 2, 3].map((i) => document.getElementById("pose" + i));
    const figure = document.getElementById("figure");
    const leftBits = document.getElementById("leftBits");
    const board = document.getElementById("board");
    const sheet = document.getElementById("sheet");
    const wallBits = [...document.querySelectorAll("#wall .bandage, #wall .drip, #wall .note")];
    const hint = document.getElementById("hint");
    const marker = document.getElementById("marker");
    const navItems = [...document.querySelectorAll("#nav span")];
    const brushLen = brush.getTotalLength();
    const noteLen = noteLine.getTotalLength();
    brush.style.strokeDasharray = String(brushLen);
    noteLine.style.strokeDasharray = String(noteLen);

    function split(el) {
      const text = el.textContent;
      el.textContent = "";
      [...text].forEach((ch, i) => {
        if (ch === "\n" || ch === "\r") {
          el.appendChild(document.createElement("br"));
          return;
        }
        const s = document.createElement("span");
        s.textContent = ch === " " ? "\u00a0" : ch;
        s.dataset.i = String(i);
        el.appendChild(s);
      });
      return [...el.children];
    }
    const lettersA = split(lineA);
    const lettersB = split(lineB);

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const ramp = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
    const smooth = (t) => t * t * (3 - 2 * t);
    const seg = (p, a, b) => smooth(ramp(p, a, b));

    let user = false;
    let shown = 0;
    let autoStart = 0;
    const keys = [[0, .04], [.12, .1], [.18, .26], [.4, .32], [.56, .58], [.64, .6], [.76, .74], [.82, .76], [.94, .98], [1, .98]];
    function autoAt(u) {
      let i = 1;
      while (i < keys.length && keys[i][0] < u) i++;
      const a = keys[i - 1];
      const b = keys[Math.min(i, keys.length - 1)];
      const t = a[0] === b[0] ? 0 : (u - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * clamp(t, 0, 1);
    }
    function maxScroll() {
      return Math.max(1, document.documentElement.scrollHeight - innerHeight);
    }
    function takeOver() { user = true; }
    addEventListener("wheel", (e) => {
      takeOver();
      e.preventDefault();
      scrollBy(0, e.deltaY);
    }, { passive: false });
    let lastY = null;
    addEventListener("touchstart", (e) => {
      takeOver();
      lastY = e.touches[0].clientY;
    }, { passive: true });
    addEventListener("touchmove", (e) => {
      takeOver();
      const y = e.touches[0].clientY;
      if (lastY != null) {
        e.preventDefault();
        scrollBy(0, lastY - y);
      }
      lastY = y;
    }, { passive: false });
    addEventListener("touchend", () => { lastY = null; });
    addEventListener("keydown", (e) => {
      const step = { ArrowDown: 90, ArrowUp: -90, PageDown: innerHeight * .85, PageUp: -innerHeight * .85, " ": innerHeight * .7 };
      if (!(e.key in step)) return;
      takeOver();
      e.preventDefault();
      scrollBy(0, step[e.key]);
    });

    function placeMarker(t) {
      const from = navItems[0];
      const to = navItems[2];
      if (!from || !to) return;
      const left = from.offsetLeft + (to.offsetLeft - from.offsetLeft) * t;
      marker.style.transform = "translateX(" + left + "px)";
    }

    function apply(p) {
      lettersA.forEach((sp, i) => {
        const t = seg(p, .5 + i * .01, .64 + i * .008);
        sp.style.opacity = String(1 - t);
        sp.style.transform = "translateY(" + (t * 36) + "px) rotate(" + (t * 8) + "deg)";
      });
      lettersB.forEach((sp, i) => {
        const t = seg(p, .56 + i * .012, .72 + i * .01);
        sp.style.opacity = String(t);
        sp.style.transform = "translateY(" + ((1 - t) * 28) + "px)";
      });
      const scriptOut = seg(p, .48, .62);
      script.style.opacity = String(1 - scriptOut);
      script.style.transform = "translateY(" + (scriptOut * 16) + "px)";
      brush.style.strokeDashoffset = "0";
      brush.style.opacity = String(1 - scriptOut);
      subA.style.opacity = String(1 - seg(p, .46, .6));
      subB.style.opacity = String(seg(p, .6, .74));

      const poseT = [seg(p, 0, .16), 0, 0, 0];
      poseT[0] = 1 - seg(p, .12, .24);
      poseT[1] = seg(p, .12, .24) * (1 - seg(p, .32, .44));
      poseT[2] = seg(p, .32, .44) * (1 - seg(p, .52, .64));
      poseT[3] = seg(p, .52, .64);
      poses.forEach((g, i) => { g.style.opacity = String(poseT[i]); });
      const figureOut = seg(p, .6, .74);
      figure.style.opacity = String(1 - figureOut);
      figure.style.transform = "translateY(" + (figureOut * -8) + "%)";

      const drift = seg(p, .38, .7);
      leftBits.style.opacity = String(1 - seg(p, .56, .72));
      leftBits.style.transform = "translate(" + (-drift * 18) + "%, " + (-drift * 8) + "%)";

      const rise = seg(p, .34, .54);
      const away = seg(p, .74, .96);
      board.style.transform = "translate(" + (away * 58) + "%, " + ((1 - rise) * 112 - away * 8) + "%) rotate(" + (away * 72) + "deg)";
      sheet.style.transform = "rotateX(" + (away * 62) + "deg) translateY(" + (-away * 10) + "px)";

      wallBits.forEach((el, i) => {
        const t = seg(p, .8 + i * .03, .94 + i * .02);
        el.style.opacity = String(t);
        el.style.transform = (el.classList.contains("bandage") ? "rotate(-18deg) " : "") + "scale(" + (.8 + t * .2) + ")";
      });
      noteLine.style.strokeDashoffset = String(noteLen * (1 - seg(p, .88, 1)));
      placeMarker(seg(p, .6, .82));
      hint.style.opacity = String(1 - seg(p, .04, .16));
    }

    function frame(now) {
      if (!autoStart) autoStart = now;
      if (!user && !reduce) {
        const u = clamp((now - autoStart) / 8000, 0, 1);
        scrollTo(0, autoAt(u) * maxScroll());
      }
      const raw = scrollY / maxScroll();
      shown += (raw - shown) * (reduce ? 1 : .14);
      if (reduce) shown = raw;
      if (Math.abs(raw - shown) < .0008) shown = raw;
      apply(shown);
      requestAnimationFrame(frame);
    }
    apply(0);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
