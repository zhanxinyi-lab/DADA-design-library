<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网格遮罩溶解揭示</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      color: #f4f1ea;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      min-height: 100dvh;
      overflow: hidden;
    }
    .stage {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .view {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #e4e1db;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .dock {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      padding: 12px;
      background: #161616;
    }
    .dock label {
      display: flex;
      flex: 1 1 200px;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
    }
    input[type="range"] {
      flex: 1;
      min-width: 88px;
      height: 44px;
      margin: 0;
      accent-color: #e24a4a;
    }
    button, .note {
      font: inherit;
    }
    button {
      min-height: 44px;
      min-width: 72px;
      padding: 0 14px;
      border: 1px solid #f4f1ea;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .note {
      flex: 1 0 100%;
      margin: 0;
      color: #d9d3c8;
      font-size: 14px;
      line-height: 1.4;
    }
    @media (max-width: 420px) {
      .dock { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="view">
      <canvas id="view" aria-hidden="true"></canvas>
    </div>
    <div class="dock">
      <label for="scrub">揭示进度
        <input id="scrub" type="range" min="0" max="100" step="1" value="0">
      </label>
      <button type="button" id="replay">重播</button>
      <p class="note" id="status" aria-live="polite">灰色海报。红色会从左下进入，再由网格纹理的不规则遮罩揭开。</p>
    </div>
  </main>
  <script>
    const RED = "#c41722";
    const DURATION = 5600;
    const CELL = 28;

    const view = document.querySelector("#view");
    const scrub = document.querySelector("#scrub");
    const replay = document.querySelector("#replay");
    const status = document.querySelector("#status");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");

    const grayC = document.createElement("canvas");
    const redC = document.createElement("canvas");
    const maskC = document.createElement("canvas");
    const clipC = document.createElement("canvas");
    const gtx = grayC.getContext("2d");
    const rtx = redC.getContext("2d");
    const mtx = maskC.getContext("2d");
    const clip = clipC.getContext("2d");
    const ctx = view.getContext("2d");

    let cssW = 1;
    let cssH = 1;
    let dpr = 1;
    let playing = false;
    let startedAt = 0;
    let manual = 0;
    let raf = 0;

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function smoothstep(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function hash01(x, y) {
      let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
    }
    function phases(p) {
      const block = smoothstep(0.1, 0.3, p);
      const dissolve = smoothstep(0.26, 0.9, p);
      const gridFade = 1 - smoothstep(0.9, 1, p);
      return { block, dissolve, gridFade };
    }
    function phaseName(p) {
      if (p < 0.1) return "灰色海报";
      if (p < 0.3) return "红色从左下进入";
      if (p < 0.9) return "网格遮罩正在揭开红色海报";
      return "红色海报";
    }
    function threshold(c, r, cols, rows) {
      const u = cols <= 1 ? 0 : c / (cols - 1);
      const v = rows <= 1 ? 0 : r / (rows - 1);
      const dist = Math.hypot(u, 1 - v) / Math.SQRT2;
      return clamp(dist * 0.58 + hash01(c, r) * 0.3 + hash01(c >> 1, r >> 1) * 0.12, 0, 1);
    }

    function drawGray(g, w, h) {
      g.fillStyle = "#e4e1db";
      g.fillRect(0, 0, w, h);
      g.fillStyle = "#c9c4bb";
      g.fillRect(w * 0.07, h * 0.07, w * 0.26, h * 0.86);
      g.fillStyle = "#f6f3ed";
      g.fillRect(w * 0.4, h * 0.12, w * 0.48, h * 0.32);
      g.strokeStyle = "#2a2a2a";
      g.lineWidth = Math.max(2, w * 0.004);
      g.strokeRect(w * 0.4, h * 0.52, w * 0.36, h * 0.3);
      g.fillStyle = "#8e8980";
      g.beginPath();
      g.arc(w * 0.7, h * 0.27, Math.min(w, h) * 0.075, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#b9b3a9";
      for (let i = 0; i < 4; i++) g.fillRect(w * 0.44, h * (0.58 + i * 0.05), w * (0.24 - i * 0.03), Math.max(3, h * 0.012));
    }
    function drawRed(g, w, h) {
      g.fillStyle = RED;
      g.fillRect(0, 0, w, h);
      g.fillStyle = "#9b1018";
      g.beginPath();
      g.arc(w * 0.63, h * 0.44, Math.min(w, h) * 0.3, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#f3d8d1";
      g.fillRect(w * 0.12, h * 0.18, w * 0.24, Math.max(6, h * 0.014));
      g.fillStyle = "#6d0c12";
      g.fillRect(w * 0.15, h * 0.62, w * 0.2, h * 0.22);
      g.strokeStyle = "#f7e8e3";
      g.lineWidth = Math.max(2, w * 0.007);
      g.beginPath();
      g.moveTo(w * 0.72, h * 0.14);
      g.lineTo(w * 0.9, h * 0.8);
      g.stroke();
    }

    function resize() {
      const rect = view.parentElement.getBoundingClientRect();
      cssW = Math.max(1, rect.width);
      cssH = Math.max(1, rect.height);
      dpr = Math.min(2, window.devicePixelRatio || 1);
      const bw = Math.round(cssW * dpr);
      const bh = Math.round(cssH * dpr);
      for (const c of [view, grayC, redC, clipC]) {
        if (c.width !== bw || c.height !== bh) {
          c.width = bw;
          c.height = bh;
        }
      }
      const mw = Math.max(1, Math.round(cssW));
      const mh = Math.max(1, Math.round(cssH));
      if (maskC.width !== mw || maskC.height !== mh) {
        maskC.width = mw;
        maskC.height = mh;
      }
      drawGray(gtx, bw, bh);
      drawRed(rtx, bw, bh);
    }

    function paint(p) {
      const { block, dissolve, gridFade } = phases(p);
      const cols = Math.max(2, Math.round(cssW / CELL));
      const rows = Math.max(2, Math.round(cssH / CELL));
      const cellW = cssW / cols;
      const cellH = cssH / rows;
      mtx.setTransform(1, 0, 0, 1, 0, 0);
      mtx.clearRect(0, 0, maskC.width, maskC.height);
      mtx.fillStyle = "#fff";
      const edge = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const t = threshold(c, r, cols, rows);
          const local = (dissolve - t) / 0.075;
          if (local <= 0) continue;
          const x = c * cellW;
          const y = r * cellH;
          if (local >= 1) {
            mtx.fillRect(x, y, cellW + 0.5, cellH + 0.5);
          } else {
            const n = 4;
            const sw = cellW / n;
            const sh = cellH / n;
            for (let sy = 0; sy < n; sy++) {
              for (let sx = 0; sx < n; sx++) {
                if (hash01(c * 8 + sx, r * 8 + sy) < local) mtx.fillRect(x + sx * sw, y + sy * sh, sw + 0.5, sh + 0.5);
              }
            }
          }
          if (gridFade > 0.02 && local < 1.05) edge.push([x, y, cellW, cellH, clamp(1 - local, 0, 1)]);
        }
      }

      const bw = Math.round(cssW * dpr);
      const bh = Math.round(cssH * dpr);
      clip.setTransform(1, 0, 0, 1, 0, 0);
      clip.globalCompositeOperation = "source-over";
      clip.clearRect(0, 0, bw, bh);
      clip.drawImage(redC, 0, 0);
      clip.globalCompositeOperation = "destination-in";
      clip.drawImage(maskC, 0, 0, bw, bh);
      clip.globalCompositeOperation = "source-over";

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, bw, bh);
      ctx.drawImage(grayC, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (block > 0) {
        ctx.fillStyle = RED;
        ctx.fillRect(0, cssH - cssH * 0.42 * block, cssW * 0.34 * block, cssH * 0.42 * block);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(clipC, 0, 0);
      if (edge.length && gridFade > 0.02) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineWidth = 1;
        for (const [x, y, w, h, strength] of edge) {
          ctx.strokeStyle = "rgba(20,20,20," + (0.55 * gridFade * strength).toFixed(3) + ")";
          ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
        }
      }
    }

    function show(p, announce) {
      const shown = String(Math.round(p * 100));
      if (scrub.value !== shown) scrub.value = shown;
      scrub.setAttribute("aria-valuetext", phaseName(p));
      const text = phaseName(p) + (reduce.matches ? "。减少动态效果已开启，拖动进度查看，不会自动播放。" : "。");
      if (announce && status.textContent !== text) status.textContent = text;
    }

    function stop() {
      playing = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }
    function tick(now) {
      if (!playing) return;
      const p = clamp((now - startedAt) / DURATION, 0, 1);
      manual = p;
      paint(p);
      show(p, true);
      if (p >= 1) { stop(); return; }
      raf = requestAnimationFrame(tick);
    }
    function playFrom(p) {
      manual = p;
      paint(p);
      show(p, true);
      if (reduce.matches || p >= 1) { stop(); return; }
      playing = true;
      startedAt = performance.now() - p * DURATION;
      raf = requestAnimationFrame(tick);
    }

    scrub.addEventListener("input", () => {
      stop();
      manual = Number(scrub.value) / 100;
      paint(manual);
      show(manual, true);
    });
    replay.addEventListener("click", () => playFrom(0));
    reduce.addEventListener("change", () => {
      if (reduce.matches) stop();
      paint(manual);
      show(manual, true);
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (playing) manual = clamp((performance.now() - startedAt) / DURATION, 0, 1);
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        return;
      }
      if (playing) {
        startedAt = performance.now() - manual * DURATION;
        raf = requestAnimationFrame(tick);
      }
    });
    window.addEventListener("keydown", (event) => {
      if (event.key !== " " || event.target === scrub || event.target === replay) return;
      event.preventDefault();
      if (playing) { stop(); manual = Number(scrub.value) / 100; }
      else playFrom(manual >= 1 ? 0 : manual);
    });

    const box = new ResizeObserver(() => {
      resize();
      paint(playing ? clamp((performance.now() - startedAt) / DURATION, 0, 1) : manual);
    });
    box.observe(view.parentElement);
    resize();
    playFrom(0);
  </script>
</body>
</html>
