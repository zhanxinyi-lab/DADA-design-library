<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceOrbs</title>
<style>
:root {
  color-scheme: dark;
  font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  background: #101218;
  color: #f4f4f5;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: #ddd6fe; }
:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 2px; }
.vo-sr, .vo-skip {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
.vo-skip:focus {
  position: fixed;
  left: 12px;
  top: 12px;
  width: auto;
  height: auto;
  clip: auto;
  z-index: 30;
  background: #fff;
  color: #111;
  padding: 8px 12px;
}
.vo-hero, main, .vo-filters, .vo-foot {
  width: min(1080px, calc(100% - 28px));
  margin-inline: auto;
}
.vo-hero {
  display: grid;
  gap: 24px;
  padding: 32px 0 12px;
}
.vo-kicker { color: #c4b5fd; font-size: 12px; letter-spacing: 0.04em; }
h1 { margin: 8px 0; font-size: clamp(32px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.04em; }
h2 { margin: 28px 0 12px; font-size: 22px; }
h3 { margin: 0; font-size: 18px; }
.vo-lead, .vo-tagline, .vo-note, .vo-cost, .vo-meta, .vo-count { color: #c6c6d0; line-height: 1.55; }
.vo-meta { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 14px; }
.vo-heroorb {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  justify-items: center;
  align-items: center;
  min-height: 280px;
  border: 1px solid #2c3142;
  border-radius: 24px;
  background: radial-gradient(circle at 50% 20%, #31245a, #12141c 68%);
}
.vo-filters { display: grid; gap: 10px; padding-top: 8px; }
.vo-search input, .vo-btn, .vo-pills button, .vo-row > button, .vo-linkbtn {
  min-height: 40px;
  border-radius: 10px;
  border: 1px solid #3a4054;
  background: #1b1e29;
}
.vo-search input { width: 100%; padding: 0 12px; }
.vo-pills, .vo-row { display: flex; flex-wrap: wrap; gap: 6px; }
.vo-pills button, .vo-row > button, .vo-linkbtn, .vo-btn {
  padding: 8px 12px;
  background: #1b1e29;
  cursor: pointer;
}
.vo-btn-solid, .is-on, [aria-checked="true"], [aria-pressed="true"].is-on {
  background: #6d5ef0;
  border-color: #6d5ef0;
  color: white;
}
.vo-grid { display: grid; gap: 16px; }
.vo-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  border: 1px solid #2c3142;
  border-radius: 18px;
  background: rgb(22 24 34 / 0.9);
}
.vo-card .vo-btn { align-self: flex-start; text-decoration: none; }
.vo-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.vo-tags li { border: 1px solid #3a4054; border-radius: 999px; padding: 4px 8px; font-size: 12px; }
.vo-stage, .vo-preview {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 230px;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid #2c3142;
  background: radial-gradient(circle at 50% 30%, #34275f, #12141c 72%);
}
.vo-statechip {
  position: absolute;
  left: 10px;
  bottom: 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 0;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgb(16 18 24 / 0.78);
  font-size: 12px;
}
.vo-dots { display: flex; gap: 4px; }
.vo-dots i { width: 6px; height: 6px; border-radius: 99px; background: #3a4054; display: block; }
.vo-dots i.is-on { background: #c4b5fd; }
.vo-modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  overflow: auto;
  padding: 16px;
  background: rgb(0 0 0 / 0.64);
}
.vo-dialog {
  width: min(880px, 100%);
  margin: 0 auto 24px;
  padding: 16px;
  border-radius: 18px;
  background: #171924;
  border: 1px solid #323750;
}
.vo-dialoghead, .vo-colors, .vo-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.vo-colors label { display: flex; align-items: center; gap: 8px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
legend { color: #c6c6d0; font-size: 13px; }
.vo-controls { display: grid; gap: 14px; }
.vo-source pre, .vo-foot pre {
  white-space: pre-wrap;
  max-height: 280px;
  overflow: auto;
  padding: 12px;
  border-radius: 12px;
  background: #0d0e14;
  color: #e4e4e7;
}
.vo-empty { padding: 28px; text-align: center; border: 1px dashed #3a4054; border-radius: 16px; }
.vo-foot { padding: 28px 0 48px; display: grid; }
@media (min-width: 800px) {
  .vo-hero { grid-template-columns: 1.1fr 0.9fr; align-items: center; }
  .vo-grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .vo-card, .vo-btn, .vo-dialog { transition: none; }
}

</style>
</head>
<body>
<div id="vo-root"></div>

.v6_copy {\r
  position: relative;\r
  display: block;\r
  flex: none;\r
  height: 1.4em;\r
  line-height: 1.4;\r
  overflow: hidden;\r
  white-space: nowrap;\r
  transition: width 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);\r
}\r
\r
.v6_line {\r
  position: absolute;\r
  inset: 0 auto 0 0;\r
  display: flex;\r
  align-items: center;\r
  line-height: inherit;\r
  white-space: nowrap;\r
}\r
\r
.v6_base {\r
  display: inline-flex;\r
  color: color-mix(in oklab, currentColor 72%, transparent);\r
  transition: color 0.4s ease;\r
}\r
\r
.v6_copy[data-shimmer] .v6_base {\r
  color: color-mix(in oklab, currentColor 48%, transparent);\r
}\r
\r
.v6_char {\r
  display: inline-block;\r
  animation: v6_char-in 0.46s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;\r
  animation-delay: calc(var(--pill-char-delay, 120ms) + var(--i) * var(--pill-char-step, 16ms));\r
}\r
\r
.v6_leaving {\r
  animation: v6_line-out 0.2s ease-in forwards;\r
  color: color-mix(in oklab, currentColor 55%, transparent);\r
}\r
\r
.v6_sheen {\r
  position: absolute;\r
  inset: 0;\r
  color: transparent;\r
  background-image: linear-gradient(\r
    105deg,\r
    transparent 0% 38%,\r
    currentColor 49%,\r
    color-mix(in oklab, currentColor 60%, transparent) 56%,\r
    transparent 68% 100%\r
  );\r
  background-size: 260% 100%;\r
  background-position: 135% 0;\r
  -webkit-background-clip: text;\r
  background-clip: text;\r
  opacity: 0;\r
  transition: opacity 0.4s ease;\r
  pointer-events: none;\r
}\r
\r
.v6_copy[data-shimmer] .v6_sheen {\r
  opacity: 1;\r
  animation: v6_sweep 2.35s ease-in-out infinite;\r
}\r
\r
.v6_srOnly {\r
  position: absolute;\r
  width: 1px;\r
  height: 1px;\r
  overflow: hidden;\r
  clip-path: inset(50%);\r
  white-space: nowrap;\r
}\r
\r
@keyframes v6_char-in {\r
  from {\r
    opacity: 0;\r
    transform: translateY(0.45em);\r
    filter: blur(4px);\r
  }\r
  to {\r
    opacity: 1;\r
    transform: none;\r
    filter: none;\r
  }\r
}\r
\r
@keyframes v6_line-out {\r
  to {\r
    opacity: 0;\r
    transform: translateY(-0.5em);\r
    filter: blur(4px);\r
  }\r
}\r
\r
@keyframes v6_sweep {\r
  0%,\r
  12% {\r
    background-position: 135% 0;\r
  }\r
  70%,\r
  100% {\r
    background-position: -55% 0;\r
  }\r
}\r
\r
@media (prefers-reduced-motion: reduce) {\r
  .v6_char,\r
  .v6_leaving {\r
    animation-duration: 0.01ms;\r
    animation-delay: 0ms;\r
  }\r
\r
  .v6_copy {\r
    transition: none;\r
  }\r
\r
  .v6_sheen {\r
    animation: none;\r
    background-position: 50% 0;\r
  }\r
}\r

.v2_orb {\r

  --eq-talk: 0;\r
  --orb-dur: 0.2s;\r
  --orb-ease: cubic-bezier(0.16, 1, 0.3, 1);\r
  --eq-ink: color-mix(in oklab, var(--eq-from) 45%, #0f172a);\r
  --eq-halo-mix: color-mix(in oklab, var(--eq-from), var(--eq-to) 60%);\r
  --eq-surface-hi: color-mix(in oklab, var(--eq-from) 10%, #ffffff);\r
  --eq-surface-lo: color-mix(in oklab, var(--eq-to) 16%, #e9edf7);\r
  --eq-rim: color-mix(in oklab, var(--eq-from) 38%, #b9c3d8);\r

  --eq-vignette: color-mix(in oklab, #0f172a, transparent 84%);\r
  --eq-glow-halo: color-mix(in oklab, var(--eq-halo-mix), transparent 35%);\r
  --eq-glow-core: color-mix(in oklab, var(--eq-from), transparent 25%);\r
  --eq-shadow-tint: color-mix(in oklab, var(--eq-ink), transparent 40%);\r
  --eq-shadow-tint-active: color-mix(in oklab, var(--eq-ink), transparent 28%);\r
  --eq-shadow-glow: transparent;\r
  --eq-shadow-glow-active: transparent;\r
  --eq-shadow:\r
    0 14px 28px -16px var(--eq-shadow-tint),\r
    0 0 26px -8px var(--eq-shadow-glow);\r
  --eq-shadow-active:\r
    0 16px 34px -16px var(--eq-shadow-tint-active),\r
    0 0 40px -6px var(--eq-shadow-glow-active);\r
  position: relative;\r

  transition-property:\r

\r
.v2_orb:is([data-state='idle'], [data-state='disabled']) {\r

  --orb-ease: cubic-bezier(0.65, 0, 0.35, 1);\r
}\r
\r
@media (prefers-color-scheme: dark) {\r
  .v2_orb {\r
    --eq-surface-hi: color-mix(in oklab, var(--eq-from) 20%, #0b0e17);\r
    --eq-surface-lo: color-mix(in oklab, var(--eq-to) 11%, #05070d);\r
    --eq-rim: color-mix(in oklab, var(--eq-from) 42%, #141824);\r
    --eq-sheen: rgb(255 255 255 / 0.09);\r
    --eq-vignette: rgb(0 0 0 / 0.55);\r
    --eq-glow-halo: var(--eq-halo-mix);\r
    --eq-glow-core: var(--eq-from);\r
    --eq-shadow-tint: rgb(0 0 0 / 0.6);\r
    --eq-shadow-tint-active: rgb(0 0 0 / 0.55);\r
    --eq-shadow-glow: color-mix(in oklab, var(--eq-from), transparent 68%);\r
    --eq-shadow-glow-active: color-mix(in oklab, var(--eq-from), transparent 55%);\r
  }\r
}\r
\r
@supports (color: light-dark(#fff, #000)) {\r
  .v2_orb {\r
    --eq-surface-hi: light-dark(\r
      color-mix(in oklab, var(--eq-from) 10%, #ffffff),\r
      color-mix(in oklab, var(--eq-from) 20%, #0b0e17)\r
    );\r
    --eq-surface-lo: light-dark(\r
      color-mix(in oklab, var(--eq-to) 16%, #e9edf7),\r
      color-mix(in oklab, var(--eq-to) 11%, #05070d)\r
    );\r
    --eq-rim: light-dark(\r
      color-mix(in oklab, var(--eq-from) 38%, #b9c3d8),\r
      color-mix(in oklab, var(--eq-from) 42%, #141824)\r
    );\r
    --eq-sheen: light-dark(rgb(255 255 255 / 0.65), rgb(255 255 255 / 0.09));\r
    --eq-vignette: light-dark(color-mix(in oklab, #0f172a, transparent 84%), rgb(0 0 0 / 0.55));\r
    --eq-glow-halo: light-dark(\r
      color-mix(in oklab, var(--eq-halo-mix), transparent 35%),\r
      var(--eq-halo-mix)\r
    );\r
    --eq-glow-core: light-dark(\r
      color-mix(in oklab, var(--eq-from), transparent 25%),\r
      var(--eq-from)\r
    );\r
    --eq-shadow-tint: light-dark(\r
      color-mix(in oklab, var(--eq-ink), transparent 40%),\r
      rgb(0 0 0 / 0.6)\r
    );\r
    --eq-shadow-tint-active: light-dark(\r
      color-mix(in oklab, var(--eq-ink), transparent 28%),\r

    );\r
    --eq-shadow-glow: light-dark(\r

    );\r
    --eq-shadow-glow-active: light-dark(\r
      transparent,\r
      color-mix(in oklab, var(--eq-from), transparent 55%)\r
    );\r
  }\r
}\r
\r
.v2_orb[data-state='idle'] {\r
  --v2_eq-breathe: 1;\r
}\r
\r
.v2_orb[data-state='listening'] {\r
  --eq-ring: 1;\r
}\r
\r
.v2_orb[data-state='speaking'] {\r
  --eq-talk: 1;\r
}\r
\r
.v2_orb[data-state='error'] {\r
  --eq-from: #fb7185;\r
  --eq-to: #f43f5e;\r
  --v2_eq-shake: 1;\r
}\r
\r
.v2_orb[data-state='disabled'] {\r
  opacity: 0.5;\r
  filter: grayscale(0.85);\r
}\r
\r
.v2_ring {\r
  position: absolute;\r
  inset: 0;\r
  z-index: 0;\r
  border-radius: 50%;\r
  border: 1.5px solid color-mix(in oklab, var(--eq-from), var(--eq-to) 45%);\r

}\r
\r
.v2_disc {\r

  inset: 3.5%;\r
  z-index: 1;\r
  display: grid;\r
  place-items: center;\r
  overflow: hidden;\r

  animation: v2_eq-breathe calc(4s / var(--orb-speed)) ease-in-out infinite paused;\r
}\r
\r
.v2_orb[data-state='idle'] .v2_disc {\r
  animation-play-state: running;\r
}\r
\r
.v2_disc::before {\r

  inset: 0;\r

  pointer-events: none;\r
}\r
\r
.v2_disc::after {\r
  content: '';\r
  position: absolute;\r
  inset: 0;\r
  z-index: 4;\r
  border-radius: 50%;\r
  background: radial-gradient(100% 100% at 50% 45%, transparent 58%, var(--eq-vignette));\r
  pointer-events: none;\r
}\r
\r
.v2_orb[data-state='listening'] .v2_disc,\r
.v2_orb[data-state='speaking'] .v2_disc {\r

    inset 0 0 0 1px var(--eq-rim),\r
    var(--eq-shadow-active);\r

\r

\r

precision highp float;

uniform float uSize;
uniform float uPhase;
uniform float uLevel;
uniform float uWarp;
uniform float uRidge;
uniform float uSharp;
uniform float uZoom;
uniform float uExposure;
uniform float uGlow;
uniform float uRim;
uniform float uHear;
uniform float uFade;
uniform vec3 uColA;
uniform vec3 uColB;
uniform vec3 uColC;
uniform vec3 uColD;
uniform vec3 uHi;
uniform vec3 uCool;
uniform vec3 uWarm;
uniform vec3 uGlowCol;

const float RAD = 0.86;
const float SOFT = 0.005;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),

float fbm(vec2 p) {
  float s = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    s += a * noise(p);
    p = mat2(0.8, 0.6, -0.6, 0.8) * p * 2.03;

  syntax: '<color>';\r
  inherits: true;\r
  initial-value: #818cf8;\r
}\r
\r
@property --min-to {\r
  syntax: '<color>';\r
  inherits: true;\r
  initial-value: #a5b4fc;\r
}\r
\r
@property --min-v7_breathe {\r
  syntax: '<number>';\r
  inherits: true;\r
  initial-value: 1;\r
}\r
\r
@property --min-pulse {\r
  syntax: '<number>';\r
  inherits: true;\r
  initial-value: 0;\r
}\r
\r
@property --min-swell {\r
  syntax: '<number>';\r
  inherits: true;\r
  initial-value: 0;\r
}\r
\r
@property --min-v7_flow {\r
  syntax: '<number>';\r
  inherits: true;\r
  initial-value: 0;\r
}\r
\r
@property --min-mark {\r
  syntax: '<number>';\r
  inherits: true;\r
  initial-value: 0;\r
}\r
\r
.v7_orb {\r
  --orb-size: 168px;\r
  --orb-speed: 1;\r
  --orb-color-from: #818cf8;\r
  --orb-color-to: #a5b4fc;\r
  --orb-level: 0;\r
  --min-from: var(--orb-color-from);\r
  --min-to: var(--orb-color-to);\r
  --min-v7_breathe: 1;\r
  --min-pulse: 0;\r
  --min-mark: 0;\r
  --min-swell: 0;\r
  --min-v7_flow: 0;\r
  --orb-dur: 0.2s;\r
  --orb-ease: cubic-bezier(0.16, 1, 0.3, 1);\r
  position: relative;\r
  display: grid;\r
  place-items: center;\r
  width: var(--orb-size);\r
  height: var(--orb-size);\r
  isolation: isolate;\r
  transition-property:\r
    opacity, filter, --min-from, --min-to, --min-v7_breathe, --min-pulse, --min-mark, --min-swell,\r
    --min-v7_flow;\r
  transition-duration: var(--orb-dur);\r
  transition-timing-function: var(--orb-ease);\r
}\r
\r
.v7_orb:is([data-state='idle'], [data-state='disabled']) {\r
  --orb-dur: 0.6s;\r
  --orb-ease: cubic-bezier(0.65, 0, 0.35, 1);\r
}\r
\r
.v7_orb[data-state='connecting'] {\r
  --min-v7_breathe: 0;\r
  --min-pulse: 1;\r
  --min-from: color-mix(in oklab, var(--orb-color-from) 70%, #94a3b8);\r
  --min-to: color-mix(in oklab, var(--orb-color-to) 70%, #94a3b8);\r
}\r
\r
.v7_orb[data-state='listening'] {\r
  --min-v7_breathe: 0;\r
  --min-swell: 1;\r
}\r
\r
.v7_orb[data-state='speaking'] {\r
  --min-v7_breathe: 0;\r
  --min-v7_flow: 1;\r
  --min-from: color-mix(in oklab, var(--orb-color-from) 86%, white);\r
  --min-to: color-mix(in oklab, var(--orb-color-to) 86%, white);\r
}\r
\r
.v7_orb[data-state='error'] {\r
  --min-v7_breathe: 0;\r
  --min-mark: 1;\r
  --min-from: color-mix(in oklab, #fb7185 68%, #9ca3af);\r
  --min-to: color-mix(in oklab, #f43f5e 68%, #9ca3af);\r
}\r
\r
.v7_orb[data-state='disabled'] {\r
  --min-v7_breathe: 0;\r
  filter: grayscale(1);\r
  opacity: 0.45;\r
}\r
\r
.v7_shaker {\r
  position: absolute;\r
  width: 60%;\r
  height: 60%;\r
  display: grid;\r
  place-items: center;\r
}\r
\r
.v7_orb[data-state='error'] .v7_shaker {\r
  animation: v7_shake 0.45s ease-out 1;\r
}\r
\r
.v7_disc {\r
  position: absolute;\r
  inset: 0;\r
  border-radius: 50%;\r
  overflow: hidden;\r
  clip-path: circle(50%);\r
  border: 1px solid\r
    light-dark(\r
      color-mix(in oklab, var(--min-to), black 22%),\r
      color-mix(in oklab, var(--min-from), transparent 55%)\r
    );\r
  scale: calc(1 + (0.02 + 0.07 * var(--min-swell)) * var(--orb-level));\r
  animation:\r
    v7_breathe calc(4.4s / var(--orb-speed)) ease-in-out infinite,\r
    v7_settle calc(2.8s / var(--orb-speed)) ease-in-out infinite;\r
  will-change: transform, opacity;\r
}\r
\r
.v7_ring {\r
  position: absolute;\r
  inset: 0;\r
  border-radius: 50%;\r
  border: 1.5px solid color-mix(in oklab, var(--min-from), transparent 30%);\r
  opacity: calc(var(--min-swell) * (0.18 + 0.62 * var(--orb-level)));\r
  scale: calc(1.05 + var(--min-swell) * 0.16 * var(--orb-level));\r
  pointer-events: none;\r
}\r
\r
.v7_flow {\r
  position: absolute;\r
  inset: -25%;\r
  background: radial-gradient(\r
    32% 32% at 50% 50%,\r
    color-mix(in oklab, white 72%, var(--min-to)),\r
    transparent 72%\r
  );\r
  mix-blend-mode: soft-light;\r
  opacity: calc(var(--min-v7_flow) * (0.2 + 0.8 * var(--orb-level)));\r
  animation: v7_flow calc(5.2s / var(--orb-speed)) ease-in-out infinite;\r
  will-change: transform;\r
}\r
\r
.v7_spin {\r
  position: absolute;\r
  inset: -28%;\r
  animation: v7_turn calc(90s / var(--orb-speed)) linear infinite;\r
}\r
\r
.v7_spinTurbo {\r
  position: absolute;\r
  inset: 0;\r
  background: linear-gradient(135deg, var(--min-from), var(--min-to));\r
  animation: v7_turn calc(18s / var(--orb-speed)) linear infinite;\r
  animation-play-state: paused;\r
}\r
\r
.v7_orb[data-state='thinking'] .v7_spinTurbo {\r
  animation-play-state: running;\r
}\r
\r
.v7_mark {\r
  position: absolute;\r
  width: 18%;\r
  height: 4%;\r
  border-radius: 999px;\r
  background: color-mix(in oklab, white 84%, var(--min-from));\r
  opacity: calc(0.9 * var(--min-mark));\r
}\r
\r
@keyframes v7_breathe {\r
  0%,\r
  100% {\r
    transform: scale(1);\r
  }\r
  50% {\r
    transform: scale(calc(1 + 0.035 * var(--min-v7_breathe)));\r
  }\r
}\r
\r
@keyframes v7_settle {\r
  0%,\r
  100% {\r
    opacity: 1;\r
  }\r
  50% {\r
    opacity: calc(1 - 0.12 * var(--min-pulse));\r
  }\r
}\r
\r
@keyframes v7_flow {\r
  0%,\r
  100% {\r
    transform: translate(-14%, -10%);\r
  }\r
  33% {\r
    transform: translate(12%, -6%);\r
  }\r
  66% {\r
    transform: translate(2%, 14%);\r
  }\r
}\r
\r
@keyframes v7_turn {\r
  to {\r
    transform: rotate(360deg);\r
  }\r
}\r
\r
@keyframes v7_shake {\r
  0% {\r
    transform: translateX(0);\r
  }\r
  18% {\r
    transform: translateX(-2.5%);\r
  }\r
  42% {\r
    transform: translateX(3%);\r
  }\r
  66% {\r
    transform: translateX(-1.8%);\r
  }\r
  84% {\r
    transform: translateX(0.8%);\r
  }\r
  100% {\r
    transform: translateX(0);\r
  }\r
}\r
\r
@media (prefers-reduced-motion: reduce) {\r
  .v7_orb .v7_disc,\r
  .v7_orb .v7_spin,\r
  .v7_orb .v7_spinTurbo,\r
  .v7_orb .v7_flow,\r
  .v7_orb[data-state='error'] .v7_shaker {\r
    animation: none;\r

.v8_frame {\r
  --orb-size: 168px;\r
  --orb-speed: 1;\r
  --orb-color-from: #f472b6;\r
  --orb-color-to: #60a5fa;\r
  --orb-level: 0;\r
  --edge-from: var(--orb-color-from);\r
  --edge-to: var(--orb-color-to);\r
  --edge-width: clamp(1.5px, calc(var(--orb-size) * 0.014), 3px);\r
  --edge-radius: 24px;\r
  --edge-inset: 4px;\r
  --edge-glow: 0.3;\r
  --edge-line: 0.5;\r
  --edge-boost: 0;\r
  --edge-err: 0;\r
  --orb-dur: 0.2s;\r
  --orb-ease: cubic-bezier(0.16, 1, 0.3, 1);\r
  position: relative;\r
  border-radius: var(--edge-radius);\r
  isolation: isolate;\r
  transition-property:\r
    opacity, filter, --edge-from, --edge-to, --edge-glow, --edge-line, --edge-boost, --edge-err;\r
  transition-duration: var(--orb-dur);\r
  transition-timing-function: var(--orb-ease);\r
}\r
\r
.v8_frame:is([data-state='idle'], [data-state='disabled']) {\r
  --orb-dur: 0.6s;\r
  --orb-ease: cubic-bezier(0.65, 0, 0.35, 1);\r
}\r
\r
.v8_frame[data-state='connecting'] {\r
  --edge-glow: 0.22;\r
  --edge-line: 0.35;\r
}\r
\r
.v8_frame[data-state='listening'] {\r
  --edge-glow: 0.42;\r
  --edge-line: 0.62;\r
  --edge-boost: 1;\r
}\r
\r
.v8_frame[data-state='thinking'] {\r
  --edge-glow: 0.34;\r
}\r
\r
.v8_frame[data-state='speaking'] {\r
  --edge-glow: 0.52;\r
  --edge-line: 0.72;\r
  --edge-boost: 1;\r
}\r
\r
.v8_frame[data-state='error'] {\r
  --edge-glow: 0.48;\r
  --edge-line: 0.75;\r
  --edge-err: 1;\r
}\r
\r
.v8_frame[data-state='disabled'] {\r
  filter: grayscale(0.85);\r
  opacity: 0.55;\r
}\r
\r
.v8_aura,\r
.v8_band,\r
.v8_sweep,\r
.v8_chase {\r
  position: absolute;\r
  inset: 0;\r
  border-radius: inherit;\r
  pointer-events: none;\r
  padding: var(--edge-width);\r
  -webkit-mask:\r
    linear-gradient(#000 0 0) content-box,\r
    linear-gradient(#000 0 0);\r
  -webkit-mask-composite: xor;\r
  mask:\r
    linear-gradient(#000 0 0) content-box,\r
    linear-gradient(#000 0 0);\r
  mask-composite: exclude;\r
  transition-property: opacity, padding;\r
  transition-duration: var(--orb-dur);\r
  transition-timing-function: var(--orb-ease);\r
}\r
\r
.v8_aura {\r
  padding: calc(var(--edge-width) * 3);\r
  background: conic-gradient(\r
    from var(--edge-angle) in oklab,\r
    var(--edge-from),\r
    var(--edge-to),\r
    var(--edge-from)\r
  );\r
  filter: blur(9px)\r
    brightness(\r

    );\r

  animation:\r
    v8_edgeSpin calc(14s / var(--orb-speed)) linear infinite,\r
    v8_edgeSpin calc(25.2s / var(--orb-speed)) linear infinite,\r
    v8_edgeSpin calc(3.818s / var(--orb-speed)) linear infinite,\r
    v8_edgeSpin calc(18.667s / var(--orb-speed)) linear infinite,\r
    v8_edgeThrob calc(1.3s / var(--orb-speed)) ease-in-out infinite;\r
  animation-composition: replace, add, add, add, replace;\r
  animation-play-state: running, paused, paused, paused, running;\r
}\r
\r
.v8_band {\r
  background: conic-gradient(\r
    from var(--edge-angle) in oklab,\r
    var(--edge-from),\r
    var(--edge-to),\r
    var(--edge-from)\r
  );\r
  opacity: calc(var(--edge-line) + 0.32 * var(--orb-level) * var(--edge-boost));\r
  animation:\r
    v8_edgeSpin calc(14s / var(--orb-speed)) linear infinite,\r
    v8_edgeSpin calc(25.2s / var(--orb-speed)) linear infinite,\r
    v8_edgeSpin calc(3.818s / var(--orb-speed)) linear infinite,\r
    v8_edgeSpin calc(18.667s / var(--orb-speed)) linear infinite;\r
  animation-composition: replace, add, add, add;\r
  animation-play-state: running, paused, paused, paused;\r
}\r
\r
.v8_sweep {\r
  background: conic-gradient(\r
    from var(--edge-angle) in oklab,\r
    var(--edge-from) 0deg,\r
    transparent 85deg,\r
    transparent 160deg,\r
    var(--edge-to) 180deg,\r
    transparent 265deg,\r
    transparent 340deg,\r
    var(--edge-from) 360deg\r
  );\r
  opacity: 0;\r
  animation: v8_edgeSpin calc(7s / var(--orb-speed)) linear infinite;\r
}\r
\r
.v8_chase {\r
  background: conic-gradient(\r
    from var(--edge-angle),\r
    transparent 0deg,\r
    transparent 220deg,\r
    color-mix(in oklab, var(--edge-from), transparent 70%) 280deg,\r
    color-mix(in oklab, var(--edge-from) 35%, var(--edge-to)) 330deg,\r
    var(--edge-to) 352deg,\r
    transparent 356deg\r
  );\r
  opacity: 0;\r
  animation: v8_edgeSpin calc(1.4s / var(--orb-speed)) linear infinite;\r
}\r
\r
.v8_frame:is([data-state='connecting'], [data-state='thinking']) .v8_band {\r
  opacity: 0;\r
}\r
\r
.v8_frame[data-state='connecting'] .v8_chase {\r
  opacity: 1;\r
}\r
\r
.v8_frame[data-state='thinking'] .v8_sweep {\r
  opacity: 0.9;\r
}\r
\r
.v8_frame[data-state='listening'] .v8_aura {\r
  animation-play-state: running, running, paused, paused, running;\r
}\r
\r
.v8_frame[data-state='listening'] .v8_band {\r
  animation-play-state: running, running, paused, paused;\r
}\r
\r
.v8_frame[data-state='speaking'] .v8_aura {\r
  animation-play-state: running, paused, running, paused, running;\r
}\r
\r
.v8_frame[data-state='speaking'] .v8_band {\r
  animation-play-state: running, paused, running, paused;\r
}\r
\r
.v8_frame[data-state='error'] .v8_aura {\r
  animation-play-state: running, paused, paused, running, running;\r
}\r
\r
.v8_frame[data-state='error'] .v8_band {\r
  animation-play-state: running, paused, paused, running;\r
}\r
\r
.v8_frame[data-state='disabled'] .v8_aura,\r
.v8_frame[data-state='disabled'] .v8_sweep,\r
.v8_frame[data-state='disabled'] .v8_chase {\r
  opacity: 0;\r
}\r
\r
.v8_frame[data-state='disabled'] .v8_band {\r
  padding: 1px;\r
  opacity: 0.5;\r
  animation-play-state: paused;\r
}\r
\r
.v8_content {\r
  position: absolute;\r
  inset: var(--edge-inset);\r
  border-radius: calc(var(--edge-radius) - var(--edge-inset));\r
  overflow: hidden;\r
}\r
\r
.v8_demo {\r
  display: grid;\r
  place-items: center;\r
  background: light-dark(rgb(255 255 255 / 0.72), rgb(10 12 20 / 0.78));\r
}\r
\r
.v8_demoLabel {\r
  font-size: clamp(11px, calc(var(--orb-size) * 0.085), 17px);\r
  letter-spacing: 0.02em;\r
  color: light-dark(rgb(30 41 59 / 0.75), rgb(226 232 240 / 0.8));\r
  opacity: var(--orb-label-opacity, 1);\r
  transition: opacity var(--orb-label-duration, 0.3s) ease var(--orb-label-delay, 0s);\r
}\r
\r
@keyframes v8_edgeSpin {\r
  to {\r
    --edge-angle: 360deg;\r
  }\r
}\r
\r
@keyframes v8_edgeThrob {\r
  0%,\r
  100% {\r
    --edge-throb: 0;\r
  }\r
  50% {\r
    --edge-throb: 1;\r
  }\r
}\r
\r

  .v8_sweep,\r
  .v8_chase {\r

  }\r

    opacity: 0.4;\r
  }\r
\r
  .v8_frame[data-state='idle'] .v8_aura {\r
    opacity: 0.22;\r
  }\r
\r
  .v8_frame[data-state='listening'] .v8_band {\r
    opacity: 0.85;\r
  }\r
\r
  .v8_frame[data-state='listening'] .v8_aura {\r
    opacity: 0.55;\r
  }\r
\r
  .v8_frame[data-state='speaking'] .v8_band {\r
    opacity: 1;\r
  }\r
\r
  .v8_frame[data-state='speaking'] .v8_aura {\r
    opacity: 0.8;\r
  }\r
\r
  .v8_frame[data-state='thinking'] .v8_sweep {\r
    opacity: 0.95;\r
  }\r
\r
  .v8_frame[data-state='connecting'] .v8_chase {\r
    opacity: 1;\r
  }\r
\r
  .v8_frame[data-state='error'] .v8_band {\r
    opacity: 0.9;\r
  }\r
}\r
