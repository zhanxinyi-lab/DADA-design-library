<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Robot Avatar</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(900px 420px at 50% 28%, #fff, transparent 70%),
      #f3efe6;
    color: #1c1915;
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  main {
    width: min(880px, 100%);
    margin: 0 auto;
    padding: 28px 16px 36px;
    display: grid;
    justify-items: center;
    gap: 18px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: 0; }
  .lead { margin: 0; max-width: 38em; text-align: center; color: #5c564c; font-size: 14px; line-height: 1.5; }
  .stage {
    display: grid;
    place-items: center;
    width: min(100%, 420px);
    min-height: 240px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: min(100%, 640px);
    margin: 0;
    padding: 0;
  }
  button {
    appearance: none;
    border: 1px solid #d9d0c2;
    background: #fffdf8;
    color: #1c1915;
    border-radius: 999px;
    padding: 8px 12px;
    font: inherit;
    font-size: 14px;
    line-height: 1.2;
    cursor: pointer;
  }
  button:hover { border-color: #1c1915; }
  button:focus-visible { outline: 3px solid #1c1915; outline-offset: 2px; }
  button[aria-pressed="true"] { background: #1c1915; color: #fffdf8; border-color: #1c1915; }
  .now { margin: 0; color: #5c564c; font-size: 13px; }
  .credit { margin: 8px 0 0; max-width: 40em; text-align: center; color: #6f685e; font-size: 12px; line-height: 1.5; }
  .credit a { color: #1c1915; }
</style>
</head>
<body>
<main>
  <h1>Agent Robot Avatar</h1>
  <p class="lead">BoopFace 的 lite 头像。眼睛跟着指针，按住头部可以拖，松手会弹回去。下面每个按钮只播放组件自己的一个动作。</p>
  <div class="stage">
    <agent-robot-avatar id="avatar" size="180" auto-sleep="0"></agent-robot-avatar>
  </div>
  <div class="actions" role="group" aria-label="表情">
    <button type="button" data-action="idle" aria-pressed="true">待机</button>
    <button type="button" data-action="bored">无聊</button>
    <button type="button" data-action="waiting-spin">等待</button>
    <button type="button" data-action="input">输入</button>
    <button type="button" data-action="affirm">点头</button>
    <button type="button" data-action="success">成功</button>
    <button type="button" data-action="failure">失败</button>
    <button type="button" data-action="wary">警惕</button>
    <button type="button" data-action="inspect">检查</button>
    <button type="button" data-action="angry">生气</button>
    <button type="button" data-action="refuse">拒绝</button>
    <button type="button" data-action="surprise">惊讶</button>
    <button type="button" data-action="love">喜欢</button>
    <button type="button" data-action="random">随机</button>
    <button type="button" data-action="sleep">睡觉</button>
    <button type="button" data-action="wake">醒来</button>
  </div>
  <p class="now">当前：<span id="action-name">待机</span></p>
  <p class="credit">MIT · Copyright (c) 2026 CX ART Lab · v0.7.2 lite，不含皮肤。<a href="https://github.com/CX-ArtLab/BoopFace">CX-ArtLab/BoopFace</a> · <a href="https://github.com/zhanxinyi-lab/agent-robot-avatar">agent-robot-avatar</a></p>
</main>
