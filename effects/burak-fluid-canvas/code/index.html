<!DOCTYPE html>
<html lang="zh-CN">
<!-- AI 复刻：流体作品墙。clean-room，不是原站脚本。 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流体作品墙</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #e6e6e6; color: #2a2a2a; }
  body { font-family: system-ui, sans-serif; }
  #stage {
    position: fixed; inset: 12px;
    border-radius: 18px; overflow: hidden;
    background: #fbfbfb;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.08);
  }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pad { position: absolute; inset: 0; z-index: 1; touch-action: none; }
  #hits { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #hits button {
    position: absolute; padding: 0; border: 0; background: transparent;
    pointer-events: auto; touch-action: none; cursor: grab; color: transparent;
  }
  #hits button:focus-visible { outline: 2px solid #2a2a2a; outline-offset: -2px; }
  .top {
    position: absolute; z-index: 3; top: 0; left: 0; right: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 18px 0; pointer-events: none;
    font-size: 12.5px; letter-spacing: -0.01em;
  }
  .name { font-weight: 560; color: #2c2c2c; }
  #nav { pointer-events: auto; display: flex; gap: 16px; justify-content: center; }
  #nav button {
    border: 0; background: transparent; font: inherit; color: #8d8d8d;
    cursor: pointer; min-height: 44px; padding: 0 2px;
  }
  #nav button[aria-current="page"] { color: #1c1c1c; font-weight: 650; }
  #nav button:focus-visible { outline: 2px solid #2a2a2a; outline-offset: 2px; }
  .role { justify-self: end; color: #8d8d8d; font-size: 12px; }
  #search {
    position: absolute; z-index: 4; left: 50%; bottom: 16px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    min-height: 42px; padding: 0 16px;
    background: #fff; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.04);
  }
  #search svg { flex: 0 0 auto; color: #9a9a9a; }
  #search input {
    border: 0; outline: none; background: transparent; font: inherit;
    font-size: 13px; width: 128px; color: #222; min-height: 40px;
  }
  #search input:focus-visible { outline: none; }
  #search:focus-within { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06), 0 0 0 2px #2a2a2a; }
  #debug {
    position: absolute; z-index: 4; left: 12px; bottom: 12px;
    border: 0; background: #fff; color: #444; cursor: pointer;
    height: 28px; padding: 0 10px; border-radius: 8px;
    font: 11px/1 system-ui, sans-serif;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.04);
  }
  #debug::before { content: ""; position: absolute; inset: -10px; }
  #debug:focus-visible, #debug[aria-pressed="true"] { outline: 2px solid #2a2a2a; outline-offset: 2px; }
  #stage.is-debug .top, #stage.is-debug #search {
    opacity: 0; pointer-events: none; visibility: hidden;
  }
  .top, #search { transition: opacity 0.35s linear; }
  #fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #fallback.show { display: flex; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 720px) {
    #stage { inset: 0; border-radius: 0; }
    .top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding-left: 12px; padding-right: 12px;
    }
    .role { display: none; }
    .name { min-width: 0; }
    #nav { gap: 8px; flex: 0 0 auto; }
    #nav button { font-size: 12px; }
    #search { bottom: 12px; }
    #search input { width: 92px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" aria-hidden="true"></canvas>
  <div id="pad" aria-hidden="true"></div>
  <div id="hits" role="group" aria-label="作品"></div>
  <header class="top">
    <p class="name">Burak Aslan</p>
    <nav id="nav" aria-label="页面">
      <button type="button" data-mode="index" aria-current="page">Index</button>
      <button type="button" data-mode="writing">Writing</button>
      <button type="button" data-mode="about">About</button>
    </nav>
    <p class="role">Designer / Developer</p>
  </header>
  <form id="search" role="search">
    <label class="sr-only" for="q">Search</label>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
      <path d="M9.2 9.2 L12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
    </svg>
    <input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
  </form>
  <button id="debug" type="button" aria-pressed="false">Debug</button>
  <p id="fallback">这个浏览器画不了这块画布。</p>
  <p class="sr-only">浅灰作品格子铺满画面。移动指针时网格会像布一样弯曲，松手后弹回。格子会在密格和大区块之间重新划分。</p>
  <p id="status" class="sr-only" aria-live="polite"></p>
</div>
<script>
'use strict';
(function () {
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('view');
  var hits = document.getElementById('hits');
  var nav = document.getElementById('nav');
  var search = document.getElementById('search');
  var input = document.getElementById('q');
  var debugBtn = document.getElementById('debug');
  var status = document.getElementById('status');
  var fallback = document.getElementById('fallback');
  var ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) { fallback.className = 'show'; return; }

  var TITLES = [
    'North Room', 'Soft Grid', 'Paper Court', 'Harbor', 'Folded Noon',
    'Quiet Index', 'Atelier', 'Low Table', 'Cedar', 'Window',
    'Field Notes', 'Studio Two', 'Pale Arc', 'Terrace', 'Sample',
    'Linen', 'Courtyard', 'Morning'
  ];
  var TONES = [
    '#e3e3e3', '#d5d5d5', '#e8e8e8', '#cfcfcf', '#dedede', '#e6e6e6',
    '#d8d8d8', '#e1e1e1', '#d2d2d2', '#e7e7e7', '#dbdbdb', '#e4e4e4',
    '#d6d6d6', '#ececec', '#dfdfdf', '#d9d9d9', '#e5e5e5', '#d4d4d4'
  ];
  var LABEL = {
    wall: '作品墙',
    fine: '较密的分格',
    coarse: '较大的区块',
    writing: '横向的区块',
    about: '四块大面'
  };
  var SEQ = ['wall', 'fine', 'coarse'];
  var COLS = 16;
  var ROWS = 11;
  var GAP = 0.012;

  function cell(x, y, w, h, item) {
    return {
      x: x + GAP * 0.5,
      y: y + GAP * 0.5,
      w: Math.max(0.02, w - GAP),
      h: Math.max(0.02, h - GAP),
      item: item
    };
  }
  function rows(heights, ids, x, w) {
    var y = 0;
    var out = [];
    for (var i = 0; i < heights.length; i++) {
      out.push(cell(x, y, w, heights[i], ids[i]));
      y += heights[i];
    }
    return out;
  }

  var layouts = {
    wall: [].concat(
      rows([0.20, 0.32, 0.26, 0.22], [0, 1, 2, 3], 0.00, 0.20),
      rows([0.36, 0.30, 0.34], [4, 5, 6], 0.20, 0.18),
      rows([0.32, 0.38, 0.30], [7, 8, 9], 0.38, 0.28),
      rows([0.16, 0.22, 0.28, 0.34], [10, 11, 12, 13], 0.66, 0.18),
      rows([0.24, 0.40, 0.36], [14, 15, 16], 0.84, 0.16)
    ),
    fine: [].concat(
      rows([0.22, 0.40, 0.38], [0, 1, 2], 0.00, 0.15),
      rows([0.34, 0.28, 0.38], [3, 4, 5], 0.15, 0.15),
      rows([0.18, 0.30, 0.52], [6, 7, 8], 0.30, 0.20),
      rows([0.42, 0.26, 0.32], [9, 10, 11], 0.50, 0.20),
      rows([0.26, 0.36, 0.38], [12, 13, 14], 0.70, 0.15),
      rows([0.20, 0.46, 0.34], [15, 16, 17], 0.85, 0.15)
    ),
    coarse: [].concat(
      rows([0.58, 0.42], [0, 1], 0.00, 0.34),
      rows([0.30, 0.36, 0.34], [4, 8, 9], 0.34, 0.36),
      rows([0.46, 0.54], [7, 13], 0.70, 0.30)
    ),
    writing: [
      cell(0, 0, 1, 0.22, 0),
      cell(0, 0.22, 0.62, 0.28, 4),
      cell(0.62, 0.22, 0.38, 0.28, 7),
      cell(0, 0.50, 1, 0.22, 8),
      cell(0, 0.72, 0.33, 0.28, 1),
      cell(0.33, 0.72, 0.34, 0.28, 9),
      cell(0.67, 0.72, 0.33, 0.28, 13)
    ],
    about: [
      cell(0, 0, 0.56, 0.58, 7),
      cell(0.56, 0, 0.44, 0.58, 0),
      cell(0, 0.58, 0.40, 0.42, 8),
      cell(0.40, 0.58, 0.60, 0.42, 4)
    ]
  };

  function unit(i, salt) {
    var n = Math.sin(i * 127.1 + salt * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }

  var items = TITLES.map(function (title, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', title);
    hits.appendChild(b);
    return {
      id: i,
      title: title,
      color: TONES[i],
      match: true,
      el: b,
      rest: { x: 0.5, y: 0.5, w: 0.001, h: 0.001, a: 0 },
      from: null,
      to: null,
      scatter: {
        nx: 0.16 + unit(i, 1) * 0.68,
        ny: 0.14 + unit(i, 2) * 0.68,
        nw: 0.26 + unit(i, 3) * 0.18,
        nh: 0.2 + unit(i, 4) * 0.18,
        z: (unit(i, 5) - 0.5) * 120,
        rx: (unit(i, 6) - 0.5) * 0.7,
        ry: (unit(i, 7) - 0.5) * 0.9,
        spin: 0.35 + unit(i, 8) * 0.55
      }
    };
  });

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = mq.matches;
  var mode = 'index';
  var layoutName = 'wall';
  var morphT = 1;
  var morphDur = 0;
  var debugOn = false;
  var debugMix = 0;
  var holdUntil = 0;
  var query = '';
  var width = 1;
  var height = 1;
  var lattice = [];
  var pointer = { x: 0, y: 0, ready: false, down: false, travel: 0 };
  var last = 0;
  var running = true;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(u) { return u * u * (3 - 2 * u); }

  function setStatus(text) { status.textContent = text; }

  function placeInstant(name) {
    var slots = layouts[name];
    var byItem = {};
    slots.forEach(function (s) { byItem[s.item] = s; });
    items.forEach(function (item) {
      var s = byItem[item.id];
      if (s) item.rest = { x: s.x, y: s.y, w: s.w, h: s.h, a: 1 };
      else item.rest = { x: 0.5, y: 0.5, w: 0.001, h: 0.001, a: 0 };
      item.from = { x: item.rest.x, y: item.rest.y, w: item.rest.w, h: item.rest.h, a: item.rest.a };
      item.to = { x: item.rest.x, y: item.rest.y, w: item.rest.w, h: item.rest.h, a: item.rest.a };
    });
    layoutName = name;
    morphT = 1;
    morphDur = 0;
  }

  function setLayout(name) {
    if (name === layoutName && morphT >= morphDur) {
      holdUntil = performance.now() + 3400;
      return;
    }
    var slots = layouts[name];
    var byItem = {};
    slots.forEach(function (s) { byItem[s.item] = s; });
    items.forEach(function (item) {
      item.from = { x: item.rest.x, y: item.rest.y, w: item.rest.w, h: item.rest.h, a: item.rest.a };
      var s = byItem[item.id];
      if (s) item.to = { x: s.x, y: s.y, w: s.w, h: s.h, a: 1 };
      else {
        var cx = item.rest.x + item.rest.w * 0.5;
        var cy = item.rest.y + item.rest.h * 0.5;
        item.to = { x: cx, y: cy, w: 0.001, h: 0.001, a: 0 };
      }
      if (item.from.a < 0.05 && s) {
        item.from = { x: s.x + s.w * 0.5, y: s.y + s.h * 0.5, w: 0.001, h: 0.001, a: 0 };
      }
    });
    layoutName = name;
    morphT = 0;
    morphDur = reduced ? 0 : 980;
    holdUntil = performance.now() + (reduced ? 0 : 980) + 3200;
    setStatus(LABEL[name]);
  }

  function advance() {
    var i = SEQ.indexOf(layoutName);
    if (i < 0) i = 0;
    setLayout(SEQ[(i + 1) % SEQ.length]);
  }

  function setMode(next) {
    mode = next;
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (btn) {
      if (btn.getAttribute('data-mode') === next) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
    if (next === 'index') setLayout('wall');
    else setLayout(next);
  }

  function setDebug(on) {
    debugOn = on;
    debugBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    stage.classList.toggle('is-debug', on);
    if (!on && mode === 'index') holdUntil = performance.now() + 2600;
    setStatus(on ? '线框里的卡片' : LABEL[layoutName]);
  }

  nav.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    setMode(btn.getAttribute('data-mode'));
  });
  debugBtn.addEventListener('click', function () { setDebug(!debugOn); });
  search.addEventListener('submit', function (e) { e.preventDefault(); });
  input.addEventListener('input', function () {
    query = input.value.trim().toLowerCase();
    var n = 0;
    items.forEach(function (item) {
      item.match = !query || item.title.toLowerCase().indexOf(query) !== -1;
      if (item.match) n++;
    });
    setStatus(query ? (n + ' 件') : '');
    if (!query && mode === 'index') holdUntil = performance.now() + 3200;
  });

  items.forEach(function (item) {
    item.el.addEventListener('click', function () {
      if (pointer.travel > 8) return;
      if (debugOn) return;
      if (mode === 'index') advance();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.activeElement === input && input.value) {
      input.value = '';
      input.dispatchEvent(new Event('input'));
      return;
    }
    if (debugOn) setDebug(false);
  });

  function onMotionChange() { reduced = mq.matches; }
  if (mq.addEventListener) mq.addEventListener('change', onMotionChange);
  else if (mq.addListener) mq.addListener(onMotionChange);

  function localPoint(e) {
    var r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  stage.addEventListener('pointerdown', function (e) {
    pointer.down = true;
    pointer.travel = 0;
    var p = localPoint(e);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.ready = true;
  });
  stage.addEventListener('pointermove', function (e) {
    var p = localPoint(e);
    if (!pointer.ready) {
      pointer.ready = true;
      pointer.x = p.x;
      pointer.y = p.y;
      return;
    }
    var dx = p.x - pointer.x;
    var dy = p.y - pointer.y;
    pointer.x = p.x;
    pointer.y = p.y;
    if (pointer.down) pointer.travel += Math.hypot(dx, dy);
    var scale = reduced ? 0.16 : 1;
    impart(p.x, p.y, dx * scale, dy * scale);
  });
  stage.addEventListener('pointerup', function () { pointer.down = false; });
  stage.addEventListener('pointerleave', function () {
    pointer.ready = false;
    pointer.down = false;
  });

  function impart(x, y, dx, dy) {
    var radius = Math.max(160, Math.min(width, height) * 0.28);
    var i, p, ddx, ddy, fall;
    for (i = 0; i < lattice.length; i++) {
      p = lattice[i];
      ddx = p.x - x;
      ddy = p.y - y;
      fall = Math.exp(-(ddx * ddx + ddy * ddy) / (radius * radius));
      p.vx += dx * fall * 0.62;
      p.vy += dy * fall * 0.36;
      p.vx += (x - p.x) * fall * 0.015;
      p.vy += (y - p.y) * fall * 0.015;
    }
  }

  function rebuildLattice() {
    var next = [];
    var j, i, old;
    for (j = 0; j < ROWS; j++) {
      for (i = 0; i < COLS; i++) {
        old = lattice[j * COLS + i];
        next.push({
          x: (i / (COLS - 1)) * width,
          y: (j / (ROWS - 1)) * height,
          ox: old ? old.ox : 0,
          oy: old ? old.oy : 0,
          vx: old ? old.vx : 0,
          vy: old ? old.vy : 0
        });
      }
    }
    lattice = next;
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    width = Math.max(1, r.width);
    height = Math.max(1, r.height);
    canvas.width = Math.max(1, Math.round(width * dpr));
    canvas.height = Math.max(1, Math.round(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuildLattice();
  }

  function stepPhysics(dt) {
    var s = clamp(dt / 16.67, 0.2, 2.2);
    var prev = lattice.map(function (p) { return { ox: p.ox, oy: p.oy }; });
    var i, p, sx, sy, n, col, row, k, lim;
    var spring = reduced ? 0.28 : 0.055;
    var tension = reduced ? 0.08 : 0.2;
    for (i = 0; i < lattice.length; i++) {
      col = i % COLS;
      row = Math.floor(i / COLS);
      sx = 0; sy = 0; n = 0;
      if (col > 0) { k = i - 1; sx += prev[k].ox; sy += prev[k].oy; n++; }
      if (col < COLS - 1) { k = i + 1; sx += prev[k].ox; sy += prev[k].oy; n++; }
      if (row > 0) { k = i - COLS; sx += prev[k].ox; sy += prev[k].oy; n++; }
      if (row < ROWS - 1) { k = i + COLS; sx += prev[k].ox; sy += prev[k].oy; n++; }
      sx /= n; sy /= n;
      p = lattice[i];
      p.vx += ((sx - p.ox) * tension - p.ox * spring) * s;
      p.vy += ((sy - p.oy) * tension - p.oy * spring) * s;
      p.vx *= Math.pow(0.84, s);
      p.vy *= Math.pow(0.84, s);
      p.ox += p.vx * s;
      p.oy += p.vy * s;
      lim = reduced ? 18 : 78;
      if (p.ox > lim) { p.ox = lim; p.vx = 0; }
      if (p.ox < -lim) { p.ox = -lim; p.vx = 0; }
      if (p.oy > lim) { p.oy = lim; p.vy = 0; }
      if (p.oy < -lim) { p.oy = -lim; p.vy = 0; }
    }
  }

  function sample(x, y, now) {
    var gx = clamp(x / width, 0, 0.9999) * (COLS - 1);
    var gy = clamp(y / height, 0, 0.9999) * (ROWS - 1);
    var i = Math.min(COLS - 2, Math.floor(gx));
    var j = Math.min(ROWS - 2, Math.floor(gy));
    var tx = gx - i;
    var ty = gy - j;
    function at(ii, jj) { return lattice[jj * COLS + ii]; }
    var a = at(i, j), b = at(i + 1, j), c = at(i, j + 1), d = at(i + 1, j + 1);
    var ox = (a.ox + (b.ox - a.ox) * tx) * (1 - ty) + (c.ox + (d.ox - c.ox) * tx) * ty;
    var oy = (a.oy + (b.oy - a.oy) * tx) * (1 - ty) + (c.oy + (d.oy - c.oy) * tx) * ty;
    if (!reduced) {
      var bow = Math.sin(now * 0.00055);
      ox += bow * Math.sin((y / Math.max(height, 1)) * Math.PI) * 5;
      oy += Math.cos(now * 0.0004) * Math.sin((x / Math.max(width, 1)) * Math.PI) * 2;
    }
    return { x: x + ox, y: y + oy };
  }

  function shade(hex, light) {
    var n = parseInt(hex.slice(1), 16);
    var r = clamp(((n >> 16) & 255) * light, 0, 255);
    var g = clamp(((n >> 8) & 255) * light, 0, 255);
    var b = clamp((n & 255) * light, 0, 255);
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  function contentRect(item) {
    var pad = 8;
    return {
      x: pad + item.rest.x * (width - pad * 2),
      y: pad + item.rest.y * (height - pad * 2),
      w: item.rest.w * (width - pad * 2),
      h: item.rest.h * (height - pad * 2)
    };
  }

  function frameRect() {
    var w = width * 0.56;
    var h = height * 0.5;
    return { x: (width - w) * 0.5, y: (height - h) * 0.46, w: w, h: h };
  }

  function projectCard(item, now) {
    var s = item.scatter;
    var frame = frameRect();
    var spin = reduced ? 0 : now * 0.001 * s.spin;
    var rx = s.rx + Math.sin(spin) * 0.22;
    var ry = s.ry + spin * 0.4;
    var hw = s.nw * frame.w * 0.5;
    var hh = s.nh * frame.h * 0.5;
    var cx = frame.x + s.nx * frame.w;
    var cy = frame.y + s.ny * frame.h;
    var corners = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    var pts = corners.map(function (p) {
      var x = p[0], y = p[1], z = 0;
      var cxr = Math.cos(rx), sxr = Math.sin(rx);
      var y1 = y * cxr - z * sxr;
      var z1 = y * sxr + z * cxr;
      var cyr = Math.cos(ry), syr = Math.sin(ry);
      var x2 = x * cyr + z1 * syr;
      var z2 = -x * syr + z1 * cyr + s.z;
      var sc = 740 / (740 - z2);
      return { x: cx + x2 * sc, y: cy + y1 * sc, z: z2 };
    });
    return { pts: pts, light: 0.8 + 0.2 * Math.max(0, Math.cos(rx) * Math.cos(ry)) };
  }

  function grow(pts, amt) {
    var cx = 0, cy = 0, i, dx, dy, len;
    for (i = 0; i < pts.length; i++) { cx += pts[i].x; cy += pts[i].y; }
    cx /= pts.length; cy /= pts.length;
    return pts.map(function (p) {
      dx = p.x - cx; dy = p.y - cy; len = Math.hypot(dx, dy) || 1;
      return { x: p.x + dx / len * amt, y: p.y + dy / len * amt, z: p.z };
    });
  }

  function fillPoly(pts, color) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawCloth(item, now, alpha) {
    var rect = contentRect(item);
    if (rect.w < 1 || rect.h < 1) return;
    var nx = Math.max(4, Math.min(16, Math.ceil(rect.w / 22)));
    var ny = Math.max(4, Math.min(16, Math.ceil(rect.h / 22)));
    var j, i, p00, p10, p11, p01, area, restA, bulge, light;
    ctx.globalAlpha = alpha;
    for (j = 0; j < ny; j++) {
      for (i = 0; i < nx; i++) {
        p00 = sample(rect.x + rect.w * i / nx, rect.y + rect.h * j / ny, now);
        p10 = sample(rect.x + rect.w * (i + 1) / nx, rect.y + rect.h * j / ny, now);
        p11 = sample(rect.x + rect.w * (i + 1) / nx, rect.y + rect.h * (j + 1) / ny, now);
        p01 = sample(rect.x + rect.w * i / nx, rect.y + rect.h * (j + 1) / ny, now);
        area = (p10.x - p00.x) * (p01.y - p00.y) - (p10.y - p00.y) * (p01.x - p00.x);
        restA = (rect.w / nx) * (rect.h / ny);
        bulge = restA ? area / restA : 1;
        light = clamp(1 + (bulge - 1) * 0.18, 0.92, 1.04);
        fillPoly(grow([p00, p10, p11, p01], 0.6), shade(item.color, light));
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawDebug(now, k) {
    var frame = frameRect();
    var cards = [];
    items.forEach(function (item) {
      var alpha = item.match ? Math.max(item.rest.a, k) : 0;
      if (alpha < 0.03) return;
      var rect = contentRect(item);
      var cloth = [
        sample(rect.x, rect.y, now),
        sample(rect.x + rect.w, rect.y, now),
        sample(rect.x + rect.w, rect.y + rect.h, now),
        sample(rect.x, rect.y + rect.h, now)
      ];
      var card = projectCard(item, now);
      var pts = cloth.map(function (c, i) {
        return {
          x: c.x + (card.pts[i].x - c.x) * k,
          y: c.y + (card.pts[i].y - c.y) * k,
          z: card.pts[i].z
        };
      });
      var z = (pts[0].z + pts[1].z + pts[2].z + pts[3].z) / 4;
      var light = 1 + (card.light - 1) * k;
      cards.push({ pts: pts, z: z, color: shade(item.color, light), alpha: alpha });
    });
    cards.sort(function (a, b) { return a.z - b.z; });
    if (k > 0.14) {
      ctx.globalAlpha = Math.min(1, (k - 0.14) / 0.4);
      ctx.strokeStyle = '#d5d5d5';
      ctx.lineWidth = 1;
      ctx.strokeRect(frame.x + 0.5, frame.y + 0.5, frame.w, frame.h);
      ctx.globalAlpha = 1;
    }
    cards.forEach(function (card) {
      ctx.globalAlpha = card.alpha;
      fillPoly(card.pts, card.color);
    });
    ctx.globalAlpha = 1;
  }

  function updateHits(now) {
    items.forEach(function (item) {
      var show = item.rest.a > 0.62 && item.match && debugMix < 0.25 && item.rest.w > 0.04 && item.rest.h > 0.04;
      item.el.hidden = !show;
      if (!show) return;
      var rect = contentRect(item);
      var c = sample(rect.x + rect.w * 0.5, rect.y + rect.h * 0.5, now);
      item.el.style.left = rect.x + 'px';
      item.el.style.top = rect.y + 'px';
      item.el.style.width = rect.w + 'px';
      item.el.style.height = rect.h + 'px';
      item.el.style.transform = 'translate(' + (c.x - rect.x - rect.w * 0.5) + 'px,' + (c.y - rect.y - rect.h * 0.5) + 'px)';
    });
  }

  function step(now, dt) {
    var u, e;
    if (morphDur === 0) u = 1;
    else {
      morphT += dt;
      u = clamp(morphT / morphDur, 0, 1);
    }
    e = smooth(u);
    items.forEach(function (item) {
      item.rest.x = item.from.x + (item.to.x - item.from.x) * e;
      item.rest.y = item.from.y + (item.to.y - item.from.y) * e;
      item.rest.w = item.from.w + (item.to.w - item.from.w) * e;
      item.rest.h = item.from.h + (item.to.h - item.from.h) * e;
      item.rest.a = item.from.a + (item.to.a - item.from.a) * e;
    });
    var target = debugOn ? 1 : 0;
    if (reduced) debugMix = target;
    else debugMix += (target - debugMix) * (1 - Math.pow(0.001, dt / 1000));
    if (Math.abs(debugMix - target) < 0.001) debugMix = target;
    stepPhysics(dt);
    if (mode === 'index' && !debugOn && !reduced && !query && morphT >= morphDur && now >= holdUntil) advance();
  }

  function draw(now) {
    ctx.fillStyle = '#fbfbfb';
    ctx.fillRect(0, 0, width, height);
    if (debugMix < 0.08) {
      items.forEach(function (item) {
        var alpha = item.match ? item.rest.a : 0;
        if (alpha < 0.03) return;
        drawCloth(item, now, alpha);
      });
    } else {
      drawDebug(now, debugMix);
    }
    updateHits(now);
  }

  function loop(now) {
    if (!running) return;
    if (!last) last = now;
    var dt = clamp(now - last, 0, 34);
    last = now;
    step(now, dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      running = false;
    } else if (!running) {
      running = true;
      last = 0;
      requestAnimationFrame(loop);
    }
  });

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  placeInstant('wall');
  holdUntil = performance.now() + (reduced ? 1e12 : 3600);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
