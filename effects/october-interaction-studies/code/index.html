<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交互研究：拨盘、对话框、人数与思考</title>
  <style>
    :root {
      --bg: #e4ddd0;
      --ink: #1c1915;
      --muted: #5f584e;
      --card: #f7f4ee;
      --line: #ddd4c6;
      --clay: #b5481f;
      --clay-soft: #f0d2c4;
      --track: #efe8dc;
      --dim: rgba(22, 16, 12, .48);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100%;
      background:
        radial-gradient(900px 280px at 10% -10%, #efe6d6, transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .page { width: min(1160px, calc(100% - 28px)); margin: 0 auto; padding: 14px 0 18px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.04em; line-height: 1.15; }
    header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .mark { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
    .study {
      display: grid;
      grid-template-columns: minmax(180px, 230px) minmax(0, 1fr);
      gap: 8px 18px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      margin: 0 0 8px;
    }
    .kicker { margin: 0 0 3px; color: var(--clay); font-size: 11px; letter-spacing: .14em; font-weight: 700; }
    h2 { margin: 0; font-size: 16px; letter-spacing: -0.03em; }
    .copy p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    button, [role="slider"] { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    .dial-wrap { display: flex; align-items: center; justify-content: center; gap: 22px; min-height: 148px; }
    .dial {
      position: relative;
      width: 148px; height: 148px;
      border-radius: 50%;
      touch-action: none;
      user-select: none;
      background: radial-gradient(circle at 50% 42%, #fff, #f3eee6 62%, #e7dfd2);
      box-shadow: inset 0 0 0 1px #e4dacb, 0 8px 20px rgba(60, 40, 20, .06);
    }
    .arc { position: absolute; inset: 0; width: 100%; height: 100%; }
    .arc .track { fill: none; stroke: #e3d9cb; stroke-width: 6; stroke-linecap: round; }
    .arc .fill { fill: none; stroke: var(--clay); stroke-width: 6; stroke-linecap: round; }
    .rotor { position: absolute; inset: 0; transition: transform .09s linear; }
    .knob {
      position: absolute; left: 50%; top: 7px; width: 16px; height: 16px; margin-left: -8px;
      border-radius: 50%; background: var(--clay);
      box-shadow: 0 0 0 4px #f7f4ee, 0 0 0 6px var(--clay);
    }
    .tick {
      position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
      display: grid; place-items: start center;
    }
    .tick i { width: 2px; height: 11px; border-radius: 2px; background: #8d8478; }
    .tick.is-on i { height: 14px; background: var(--clay); }
    .readout {
      position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    }
    .readout b { font-size: 32px; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; line-height: 1; }
    .now { min-width: 92px; }
    .now span { display: block; color: var(--muted); font-size: 12px; }
    .now strong { display: block; font-size: 28px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }

    .stage {
      position: relative; height: 136px; border-radius: 14px;
      background: #fbf7f1; border: 1px dashed #e3d8c8; overflow: hidden;
    }
    .trigger {
      position: absolute; left: 16px; top: 16px;
      border: 0; border-radius: 999px; padding: 8px 14px;
      background: var(--ink); color: #fff; cursor: pointer;
    }
    .ghost-note { position: absolute; right: 18px; bottom: 16px; color: #b3a89a; font-size: 13px; }
    .stage:has(.backdrop.is-open) .ghost-note { opacity: 0; }
    .backdrop {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: transparent; transition: background .22s ease;
    }
    .backdrop[hidden] { display: none; }
    .backdrop.is-open { background: var(--dim); }
    .sheet {
      width: min(300px, calc(100% - 28px));
      background: #fffdf9; color: var(--ink);
      border-radius: 14px; padding: 12px 12px 10px;
      box-shadow: 0 16px 40px rgba(30, 18, 8, .24);
      transform: scale(.16); opacity: 0;
      transition: transform .24s cubic-bezier(.16, .84, .28, 1), opacity .16s linear;
    }
    .sheet.is-open { transform: scale(1); opacity: 1; }
    .sheet h3 { margin: 0; font-size: 15px; letter-spacing: -0.03em; }
    .sheet p { margin: 6px 0 10px; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .sheet button, .think-btn, .choice {
      border: 1px solid transparent; border-radius: 999px; cursor: pointer; background: transparent;
    }
    .texty { padding: 7px 10px; color: var(--muted); }
    .sheet button.solid { padding: 7px 12px; background: var(--ink); color: #fff; }

    .sizes { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .track { position: relative; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--track); border-radius: 999px; }
    .pill {
      position: absolute; left: 0; top: 0; border-radius: 999px; background: var(--ink);
      transition: transform .22s cubic-bezier(.2, .8, .2, 1), width .22s cubic-bezier(.2, .8, .2, 1), height .22s;
      z-index: 0;
    }
    .choice {
      position: relative; z-index: 1;
      padding: 7px 12px; color: var(--ink);
      transition: color .22s ease;
    }
    .choice[aria-checked="true"] { color: #fff; }
    .picked { margin: 0; font-size: 13px; color: var(--muted); }
    .picked b { color: var(--ink); font-weight: 700; }

    .think { display: flex; align-items: center; gap: 16px; min-height: 72px; }
    .think-btn { padding: 8px 14px; background: var(--clay); color: #fff; }
    .think-view { min-width: 220px; }
    .dots { display: flex; gap: 8px; height: 18px; align-items: center; transition: opacity .2s ease, transform .2s ease; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--clay); opacity: .35;
    }
    [data-state="thinking"] .dot { animation: breathe 1.05s ease-in-out infinite; }
    [data-state="thinking"] .dot:nth-child(2) { animation-delay: .14s; }
    [data-state="thinking"] .dot:nth-child(3) { animation-delay: .28s; }
    @keyframes breathe {
      0%, 100% { transform: scale(.7); opacity: .3; }
      50% { transform: scale(1); opacity: 1; }
    }
    [data-state="done"] .dots { opacity: 0; transform: scale(.6); height: 0; overflow: hidden; }
    .think-label { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.3em; }
    [data-state="done"] .think-label { color: var(--ink); font-weight: 650; }
    @media (max-width: 760px) {
      header { flex-direction: column; align-items: flex-start; }
      .study { grid-template-columns: 1fr; }
      .dial-wrap { justify-content: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rotor, .backdrop, .sheet, .pill, .choice, .dots, .dot, .think-label {
        transition: none !important;
        animation: none !important;
      }
      [data-state="thinking"] .dot { transform: none; opacity: .85; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>交互研究</h1>
        <p>四件事上下排开：拨盘选数、从触发点长开的对话框、人数选择、思考中的节奏。</p>
      </div>
      <div class="mark">同一页</div>
    </header>

    <section class="study" aria-labelledby="dial-title">
      <div class="copy">
        <p class="kicker">01 拨盘</p>
        <h2 id="dial-title">拨盘选数</h2>
        <p>拖动或点刻度。数值会吸到刻度上，并立刻显示。</p>
      </div>
      <div class="dial-wrap">
        <div class="dial" id="dial" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7" aria-valuetext="7" aria-label="拨盘">
          <svg class="arc" viewBox="0 0 148 148" aria-hidden="true">
            <path class="track" id="arc-track"></path>
            <path class="fill" id="arc-fill"></path>
          </svg>
          <div class="rotor" id="rotor"><span class="knob"></span></div>
          <div id="ticks"></div>
          <div class="readout"><b id="dial-num">7</b></div>
        </div>
        <p class="now"><span>当前数值</span><strong id="dial-now">7</strong></p>
        <span class="sr" id="dial-live" aria-live="polite">当前数值 7</span>
      </div>
    </section>

    <section class="study" aria-labelledby="modal-title">
      <div class="copy">
        <p class="kicker">02 对话框</p>
        <h2 id="modal-title">从触发点长开</h2>
        <p>背景压暗。Esc 或点暗处关闭，焦点回到按钮。</p>
      </div>
      <div class="stage" id="stage">
        <button class="trigger" id="open-modal" type="button">打开记录</button>
        <span class="ghost-note">点按钮看它长开</span>
        <div class="backdrop" id="backdrop" hidden>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-copy">
            <h3 id="sheet-title">记下这个手感</h3>
            <p id="sheet-copy">刻度要吸得住。关上之后，焦点回到刚才那个按钮。</p>
            <div class="sheet-actions">
              <button class="texty" id="sheet-close" type="button">关闭</button>
              <button class="solid" id="sheet-ok" type="button">知道了</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="study" aria-labelledby="size-title">
      <div class="copy">
        <p class="kicker">03 人数</p>
        <h2 id="size-title">选一个规模</h2>
        <p>方向键移动焦点，Enter 才选中。选中的一块会滑过去。</p>
      </div>
      <div class="sizes">
        <div class="track" id="size-group" role="radiogroup" aria-label="人数">
          <span class="pill" id="size-pill" aria-hidden="true"></span>
          <button class="choice" type="button" role="radio" aria-checked="false" tabindex="-1" data-label="1 人">1</button>
          <button class="choice" type="button" role="radio" aria-checked="false" tabindex="-1" data-label="2–4 人">2–4</button>
          <button class="choice" type="button" role="radio" aria-checked="true" tabindex="0" data-label="5–10 人">5–10</button>
          <button class="choice" type="button" role="radio" aria-checked="false" tabindex="-1" data-label="11–20 人">11–20</button>
          <button class="choice" type="button" role="radio" aria-checked="false" tabindex="-1" data-label="21 人以上">21+</button>
        </div>
        <p class="picked" id="size-picked">已选 <b>5–10 人</b></p>
      </div>
    </section>

    <section class="study" aria-labelledby="think-title">
      <div class="copy">
        <p class="kicker">04 思考</p>
        <h2 id="think-title">想一下再收束</h2>
        <p>节奏点会呼吸。点一下，或等它自己收成结果。</p>
      </div>
      <div class="think" id="think" data-state="idle">
        <button class="think-btn" id="think-btn" type="button">开始想</button>
        <div class="think-view">
          <div class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
          <p class="think-label" id="think-label" aria-live="polite">还没开始</p>
        </div>
      </div>
    </section>
  </div>
  <script>
    const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const MIN = 0;
    const MAX = 10;
    const ARC_START = -140;
    const ARC_SWEEP = 280;

    function polar(cx, cy, r, deg) {
      const rad = deg * Math.PI / 180;
      return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
    }
    function arcPath(from, to) {
      const r = 59;
      const [x1, y1] = polar(74, 74, r, from);
      const [x2, y2] = polar(74, 74, r, to);
      const large = to - from > 180 ? 1 : 0;
      return "M " + x1.toFixed(2) + " " + y1.toFixed(2) + " A " + r + " " + r + " 0 " + large + " 1 " + x2.toFixed(2) + " " + y2.toFixed(2);
    }
    function valueToAngle(value) {
      return ARC_START + ((value - MIN) / (MAX - MIN)) * ARC_SWEEP;
    }
    function nearestEnd(deg) {
      const end = ARC_START + ARC_SWEEP;
      const gap = (a, b) => {
        const d = Math.abs(a - b) % 360;
        return Math.min(d, 360 - d);
      };
      return gap(deg, ARC_START) <= gap(deg, end) ? MIN : MAX;
    }
    function angleToValue(deg) {
      const end = ARC_START + ARC_SWEEP;
      if (deg < ARC_START || deg > end) return nearestEnd(deg);
      return Math.round(MIN + ((deg - ARC_START) / ARC_SWEEP) * (MAX - MIN));
    }
    function pointerAngle(event, el) {
      const rect = el.getBoundingClientRect();
      const x = event.clientX - (rect.left + rect.width / 2);
      const y = event.clientY - (rect.top + rect.height / 2);
      return Math.atan2(x, -y) * 180 / Math.PI;
    }

    const dial = document.getElementById("dial");
    const rotor = document.getElementById("rotor");
    const dialNum = document.getElementById("dial-num");
    const dialNow = document.getElementById("dial-now");
    const dialLive = document.getElementById("dial-live");
    const ticks = document.getElementById("ticks");
    const arcTrack = document.getElementById("arc-track");
    const arcFill = document.getElementById("arc-fill");
    let dialValue = 7;
    arcTrack.setAttribute("d", arcPath(ARC_START, ARC_START + ARC_SWEEP));

    for (let value = MIN; value <= MAX; value += 1) {
      const tick = document.createElement("span");
      tick.className = "tick";
      tick.dataset.value = String(value);
      tick.style.transform = "rotate(" + valueToAngle(value) + "deg) translateY(-59px)";
      tick.innerHTML = "<i></i>";
      tick.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        setDial(value);
        dial.focus();
      });
      ticks.appendChild(tick);
    }

    function setDial(next) {
      dialValue = Math.max(MIN, Math.min(MAX, next));
      const angle = valueToAngle(dialValue);
      rotor.style.transform = "rotate(" + angle + "deg)";
      arcFill.setAttribute("d", Math.abs(angle - ARC_START) < 0.01 ? "" : arcPath(ARC_START, angle));
      dialNum.textContent = String(dialValue);
      dialNow.textContent = String(dialValue);
      dial.setAttribute("aria-valuenow", String(dialValue));
      dial.setAttribute("aria-valuetext", String(dialValue));
      dialLive.textContent = "当前数值 " + dialValue;
      ticks.querySelectorAll(".tick").forEach((tick) => {
        tick.classList.toggle("is-on", Number(tick.dataset.value) <= dialValue);
      });
    }
    setDial(dialValue);

    let dragging = false;
    dial.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".tick")) return;
      const rect = dial.getBoundingClientRect();
      const x = event.clientX - (rect.left + rect.width / 2);
      const y = event.clientY - (rect.top + rect.height / 2);
      if (Math.hypot(x, y) < 26) return;
      dragging = true;
      try { dial.setPointerCapture(event.pointerId); } catch (err) { /* 没有真实指针时仍按坐标拨 */ }
      setDial(angleToValue(pointerAngle(event, dial)));
    });
    dial.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      setDial(angleToValue(pointerAngle(event, dial)));
    });
    function endDrag() { dragging = false; }
    dial.addEventListener("pointerup", endDrag);
    dial.addEventListener("pointercancel", endDrag);
    dial.addEventListener("keydown", (event) => {
      let next = null;
      if (event.key === "ArrowRight" || event.key === "ArrowUp") next = dialValue + 1;
      else if (event.key === "ArrowLeft" || event.key === "ArrowDown") next = dialValue - 1;
      else if (event.key === "Home") next = MIN;
      else if (event.key === "End") next = MAX;
      else return;
      event.preventDefault();
      setDial(next);
    });

    const openBtn = document.getElementById("open-modal");
    const backdrop = document.getElementById("backdrop");
    const sheet = document.getElementById("sheet");
    const closeBtn = document.getElementById("sheet-close");
    const okBtn = document.getElementById("sheet-ok");
    let modalOpen = false;
    let closeTimer = 0;
    let modalTicket = 0;

    function focusables() {
      return [closeBtn, okBtn].filter((el) => !el.disabled);
    }
    function openModal() {
      const ticket = ++modalTicket;
      window.clearTimeout(closeTimer);
      sheet.inert = false;
      backdrop.hidden = false;
      sheet.style.transition = "none";
      sheet.style.transform = "none";
      const trigger = openBtn.getBoundingClientRect();
      const box = sheet.getBoundingClientRect();
      sheet.style.transformOrigin = (trigger.left + trigger.width / 2 - box.left) + "px " + (trigger.top + trigger.height / 2 - box.top) + "px";
      sheet.style.transform = "";
      const show = () => {
        if (ticket !== modalTicket) return;
        backdrop.classList.add("is-open");
        sheet.classList.add("is-open");
        sheet.style.transition = "";
        modalOpen = true;
        okBtn.focus();
      };
      if (reduceMotion()) {
        show();
        return;
      }
      sheet.getBoundingClientRect();
      sheet.style.transition = "";
      requestAnimationFrame(show);
    }
    function closeModal() {
      if (backdrop.hidden) return;
      modalTicket += 1;
      modalOpen = false;
      sheet.inert = true;
      backdrop.classList.remove("is-open");
      sheet.classList.remove("is-open");
      openBtn.focus();
      const hide = () => {
        backdrop.hidden = true;
        sheet.inert = false;
      };
      if (reduceMotion()) hide();
      else closeTimer = window.setTimeout(hide, 240);
    }
    openBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);
    okBtn.addEventListener("click", closeModal);
    backdrop.addEventListener("click", (event) => {
      if (event.target === backdrop) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (!modalOpen) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeModal();
        return;
      }
      if (event.key !== "Tab") return;
      const nodes = focusables();
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (!sheet.contains(document.activeElement)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
        return;
      }
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });

    const group = document.getElementById("size-group");
    const pill = document.getElementById("size-pill");
    const picked = document.getElementById("size-picked");
    const choices = Array.from(group.querySelectorAll(".choice"));
    function placePill(button, animate) {
      if (!animate || reduceMotion()) pill.style.transition = "none";
      pill.style.width = button.offsetWidth + "px";
      pill.style.height = button.offsetHeight + "px";
      pill.style.transform = "translate(" + button.offsetLeft + "px, " + button.offsetTop + "px)";
      if (!animate || reduceMotion()) {
        pill.getBoundingClientRect();
        pill.style.transition = "";
      }
    }
    function selectChoice(button) {
      choices.forEach((choice) => {
        const on = choice === button;
        choice.setAttribute("aria-checked", on ? "true" : "false");
        choice.tabIndex = on ? 0 : -1;
      });
      picked.innerHTML = "已选 <b>" + button.dataset.label + "</b>";
      placePill(button, true);
    }
    choices.forEach((choice) => {
      choice.addEventListener("click", () => {
        selectChoice(choice);
        choice.focus();
      });
    });
    group.addEventListener("keydown", (event) => {
      const index = choices.indexOf(document.activeElement);
      if (index < 0) return;
      let next = null;
      if (event.key === "ArrowRight" || event.key === "ArrowDown") next = (index + 1) % choices.length;
      else if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = (index - 1 + choices.length) % choices.length;
      else return;
      event.preventDefault();
      choices.forEach((choice, i) => { choice.tabIndex = i === next ? 0 : -1; });
      choices[next].focus();
    });
    function placeSelected(animate) {
      const current = group.querySelector('[aria-checked="true"]');
      if (current) placePill(current, animate);
    }
    placeSelected(false);
    window.addEventListener("load", () => placeSelected(false));
    window.addEventListener("resize", () => {
      const current = group.querySelector('[aria-checked="true"]');
      if (current) placePill(current, false);
    });

    const think = document.getElementById("think");
    const thinkBtn = document.getElementById("think-btn");
    const thinkLabel = document.getElementById("think-label");
    let thinkState = "idle";
    let thinkTimer = 0;
    function finishThink() {
      if (thinkState !== "thinking") return;
      window.clearTimeout(thinkTimer);
      thinkState = "done";
      think.dataset.state = "done";
      thinkLabel.textContent = "可以先定范围，再把这句话收成结果。";
      thinkBtn.textContent = "再看一次";
    }
    function startThink() {
      window.clearTimeout(thinkTimer);
      thinkState = "thinking";
      think.dataset.state = "thinking";
      thinkLabel.textContent = "思考中";
      thinkBtn.textContent = "先看结果";
      thinkTimer = window.setTimeout(finishThink, reduceMotion() ? 700 : 2000);
    }
    thinkBtn.addEventListener("click", () => {
      if (thinkState === "thinking") finishThink();
      else startThink();
    });
  </script>
</body>
</html>
