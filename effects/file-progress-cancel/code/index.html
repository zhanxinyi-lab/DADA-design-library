<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件上传进度</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: #f7f4ee; color: #241f1b;
      font: 15px/1.4 "Segoe UI", "PingFang SC", sans-serif;
    }
    .card {
      width: min(440px, 100%); padding: 16px; border-radius: 18px; background: #fffdf8;
      box-shadow: 0 10px 30px #241f1b14; display: grid; gap: 10px;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .muted { color: #6d665c; }
    .track { height: 6px; border-radius: 999px; background: #e6dfd4; overflow: hidden; }
    .bar { height: 100%; width: 0; background: #241f1b; }
    .bar.is-preview { height: 10px; border-radius: 999px; }
    .drop[hidden] { display: none; }
    .drop:not([hidden]) {
      min-height: 120px; border-radius: 14px; border: 1px dashed #c9c0b4;
      display: grid; place-items: center; text-align: center; padding: 16px;
      background: radial-gradient(circle, #d9d1c6 1px, transparent 1.4px) 0 0 / 12px 12px;
    }
    .chip {
      display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 8px;
      background: #fff; border: 1px solid #e6dfd4;
    }
    button {
      border: 1px solid #241f1b; border-radius: 10px; background: #fffdf8; color: #241f1b;
      font: inherit; padding: 8px 12px; cursor: pointer;
    }
    button.solid { background: #241f1b; color: #f7f4ee; }
    button:focus-visible { outline: 2px solid #241f1b; outline-offset: 3px; }
    .phase { min-height: 1.4em; margin: 0; }
  </style>
</head>
<body>
  <section class="card" id="card" aria-label="文件上传">
    <div class="row">
      <strong id="title">3 份已备好</strong>
      <span class="muted" id="meta">4.8 MB</span>
    </div>
    <div class="track" id="track"><div class="bar" id="bar"></div></div>
    <div class="row">
      <span id="detail">北窗说明.pdf 和另外 2 份</span>
      <button type="button" id="go" class="solid">开始上传</button>
    </div>
    <div class="drop" id="drop" hidden>
      <div>
        <strong>松开即可放入</strong>
        <div class="muted">或点此选择，单份不超过 10 MB</div>
        <div class="chip" id="chip" hidden>台阶记录.mp4</div>
      </div>
    </div>
    <p class="phase" id="phase" role="status"></p>
  </section>
  <script>
    const title = document.querySelector("#title");
    const meta = document.querySelector("#meta");
    const detail = document.querySelector("#detail");
    const go = document.querySelector("#go");
    const bar = document.querySelector("#bar");
    const drop = document.querySelector("#drop");
    const chip = document.querySelector("#chip");
    const phase = document.querySelector("#phase");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let timer = 0;
    let mode = "ready";

    function say(text) { phase.textContent = text; }
    function stop() { clearInterval(timer); timer = 0; }
    function showDrop(on) { drop.hidden = !on; chip.hidden = !on; }

    function ready() {
      stop();
      mode = "ready";
      showDrop(false);
      title.textContent = "3 份已备好";
      meta.textContent = "4.8 MB";
      detail.textContent = "北窗说明.pdf 和另外 2 份";
      go.hidden = false;
      go.textContent = "开始上传";
      go.className = "solid";
      bar.style.width = "0";
      bar.classList.remove("is-preview");
      say("");
    }

    function uploadThree() {
      stop();
      mode = "upload-3";
      showDrop(false);
      title.textContent = "正在上传 3 份";
      meta.textContent = "剩余 2 秒  40%";
      detail.textContent = "第 1 份 / 3  北窗说明.pdf";
      go.hidden = false;
      go.textContent = "取消";
      go.className = "";
      bar.classList.remove("is-preview");
      bar.style.width = "40%";
      say("正在上传，尚未完成");
      if (reduce.matches) return;
      timer = setTimeout(processing, 900);
    }

    function processing() {
      if (mode !== "upload-3") return;
      mode = "processing";
      title.textContent = "正在处理 3 份";
      meta.textContent = "";
      detail.textContent = "正在做预览";
      go.textContent = "取消";
      bar.classList.add("is-preview");
      bar.style.width = "72%";
      say("正在做预览，尚未完成");
      if (reduce.matches) return;
      timer = setTimeout(more, 900);
    }

    function more() {
      if (mode !== "processing") return;
      mode = "more";
      title.textContent = "还可以再传";
      meta.textContent = "";
      detail.textContent = "";
      go.hidden = false;
      go.textContent = "再传一份";
      go.className = "";
      bar.classList.remove("is-preview");
      bar.style.width = "70%";
      say("");
    }

    function armDrop() {
      mode = "drop";
      showDrop(true);
      title.textContent = "等待放入";
      meta.textContent = "";
      detail.textContent = "";
      go.hidden = true;
      bar.style.width = "0";
      say("松开后开始第二批，不会直接完成");
    }

    function uploadTwo() {
      stop();
      mode = "upload-2";
      showDrop(true);
      title.textContent = "正在上传 2 份";
      meta.textContent = "0%";
      detail.textContent = "第 1 份 / 2  台阶记录.mp4";
      go.hidden = false;
      go.textContent = "取消";
      go.className = "";
      bar.classList.remove("is-preview");
      bar.style.width = "0";
      say("正在上传，尚未完成");
      if (reduce.matches) {
        meta.textContent = "21%";
        bar.style.width = "21%";
        return;
      }
      timer = setTimeout(() => {
        if (mode !== "upload-2") return;
        meta.textContent = "21%";
        bar.style.width = "21%";
      }, 700);
    }

    go.addEventListener("click", () => {
      if (mode === "ready") uploadThree();
      else if (mode === "more") armDrop();
      else ready();
    });
    drop.addEventListener("dragover", (event) => {
      event.preventDefault();
      if (mode === "drop") say("松开即可放入");
    });
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      if (mode === "drop") uploadTwo();
    });
    drop.addEventListener("click", () => { if (mode === "drop") uploadTwo(); });
    ready();
  </script>
</body>
</html>
