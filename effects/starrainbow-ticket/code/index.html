<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StarRainbow Ticket</title>
  <style>
    :root {
      --page: #faf8fb;
      --ink: #101218;
      --copy: #6e7686;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .stage {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 28px 16px 8px;
    }
    .ticket {
      position: relative;
      width: min(92vw, 980px);
      aspect-ratio: 1.55 / 1;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .copy { position: absolute; inset: 0; }
    .brand, h1, .when { margin: 0; position: absolute; }
    .brand {
      left: 13%;
      top: 17%;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.16em;
      font-size: clamp(15px, 2.2vw, 22px);
    }
    h1 {
      left: 7.5%;
      top: 42%;
      color: var(--copy);
      font-weight: 560;
      font-size: clamp(16px, 2.35vw, 26px);
      letter-spacing: -0.01em;
    }
    .when {
      left: 3.5%;
      color: var(--copy);
      font-weight: 500;
      font-size: clamp(14px, 2.05vw, 22px);
      letter-spacing: 0.01em;
    }
    .start { top: 51%; }
    .end { top: 58%; }
    .controls {
      display: flex;
      justify-content: center;
      padding: 8px 16px 22px;
    }
    button {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid rgba(16, 18, 24, 0.18);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #3a4a88; outline-offset: 2px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="stage">
      <article class="ticket" aria-labelledby="title">
        <canvas id="foil" aria-hidden="true"></canvas>
        <div class="copy">
          <p class="brand">COTA</p>
          <h1 id="title">StarRainbow</h1>
          <p class="when start">Start Time: 8:00 A.M.</p>
          <p class="when end">End Time: 11:00 A.M.</p>
        </div>
      </article>
    </div>
    <div class="controls">
      <button type="button" id="toggle">暂停</button>
    </div>
  </main>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <script>
    const LOOP = 2900;
    const canvas = document.getElementById('foil');
    const toggle = document.getElementById('toggle');
    const live = document.getElementById('live');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const ctx = canvas.getContext('2d');
    const blobs = [
      { rgb: [186, 196, 228], a: 0.9, rx: 0.42, ry: 0.7, x: 0.22, y: 0.48, dx: 0.03, dy: 0.02, f: 1, p: 0.2 },
      { rgb: [114, 142, 244], a: 0.88, rx: 0.34, ry: 0.5, x: 0.46, y: 0.46, dx: 0.05, dy: 0.03, f: 1, p: 0.5 },
      { rgb: [176, 146, 242], a: 0.75, rx: 0.36, ry: 0.55, x: 0.84, y: 0.5, dx: 0.04, dy: 0.03, f: 1, p: 0.7 },
      { rgb: [214, 150, 244], a: 0.55, rx: 0.16, ry: 0.22, x: 0.58, y: 0.42, dx: 0.07, dy: 0.05, f: 2, p: 1.1 },
      { rgb: [112, 244, 246], a: 0.9, rx: 0.18, ry: 0.7, x: 0.7, y: 0.48, dx: 0.045, dy: 0.035, f: 1, p: 2.2 }
    ];
    let mask = null;
    let maskW = 0;
    let maskH = 0;
    let playing = !motion.matches;
    let origin = performance.now();
    let elapsed = 0;
    let raf = 0;

    function spreadAt(u) {
      const a = Math.exp(-(((u - 0.24) / 0.08) ** 2));
      const b = Math.exp(-(((u - 0.62) / 0.09) ** 2));
      return 1 - 0.18 * (a + b);
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        mask = null;
      }
    }

    function featherMask(w, h) {
      if (mask && maskW === w && maskH === h) return mask;
      mask = document.createElement('canvas');
      mask.width = w;
      mask.height = h;
      maskW = w;
      maskH = h;
      const g = mask.getContext('2d');
      const radius = Math.min(w, h) * 0.2;
      g.filter = 'blur(' + Math.max(10, h * 0.035) + 'px)';
      g.fillStyle = '#fff';
      g.beginPath();
      g.roundRect(w * 0.05, h * 0.07, w * 0.9, h * 0.86, radius);
      g.fill();
      return mask;
    }

    function blob(g, x, y, rx, ry, rgb, alpha) {
      g.save();
      g.translate(x, y);
      g.scale(rx, ry);
      const shade = g.createRadialGradient(0, 0, 0, 0, 0, 1);
      shade.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha + ')');
      shade.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
      g.fillStyle = shade;
      g.beginPath();
      g.arc(0, 0, 1, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }

    function draw(ms) {
      resize();
      const w = canvas.width;
      const h = canvas.height;
      const u = (ms % LOOP) / LOOP;
      const wave = u * Math.PI * 2;
      const spread = spreadAt(u);
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      const base = ctx.createLinearGradient(0, h * 0.2, w, h * 0.7);
      base.addColorStop(0, '#e7ebf6');
      base.addColorStop(0.42, '#d5def8');
      base.addColorStop(1, '#efe4fb');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      for (const item of blobs) {
        const x = w * (0.62 + (item.x - 0.62) * spread + Math.sin(wave * item.f + item.p) * item.dx);
        const y = h * (item.y + Math.cos(wave * item.f + item.p) * item.dy);
        blob(ctx, x, y, w * item.rx * (0.92 + 0.08 * spread), h * item.ry, item.rgb, item.a);
      }
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(featherMask(w, h), 0, 0);
      ctx.restore();
    }

    function frame(now) {
      if (!playing) return;
      elapsed = (now - origin) % LOOP;
      draw(elapsed);
      raf = requestAnimationFrame(frame);
    }

    function setPlaying(on) {
      if (on && motion.matches) on = false;
      playing = on;
      toggle.textContent = playing ? '暂停' : '播放';
      toggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
      cancelAnimationFrame(raf);
      live.textContent = playing
        ? 'StarRainbow 票卡。全息色带每 2.9 秒循环，大约在 0.7 秒和 1.8 秒各收一次。'
        : '全息色带已暂停。';
      if (playing) {
        origin = performance.now() - elapsed;
        raf = requestAnimationFrame(frame);
      }
    }

    toggle.addEventListener('click', () => setPlaying(!playing));
    motion.addEventListener('change', () => setPlaying(!motion.matches));
    addEventListener('resize', () => { if (!playing) draw(elapsed); });
    toggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
    draw(0);
    live.textContent = playing
      ? 'StarRainbow 票卡。全息色带每 2.9 秒循环，大约在 0.7 秒和 1.8 秒各收一次。'
      : '已按减少动态效果停在可读的一帧。';
    if (!playing) toggle.textContent = '播放';
    if (playing) raf = requestAnimationFrame(frame);
  </script>
</body>
</html>
