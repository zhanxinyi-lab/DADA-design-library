<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交互文件夹卡片</title>
  <style>
    :root { --page: #f1f1f2; --ink: #1c1c1c; --muted: #8a8a8a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--page); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    .defs { position: absolute; width: 0; height: 0; }
    .stage { min-height: 100%; display: grid; place-items: center; padding: 120px 28px 72px; }
    .board { display: grid; grid-template-columns: repeat(2, 252px); column-gap: 72px; row-gap: 64px; }
    .folder { position: relative; z-index: 0; width: 252px; height: 168px; margin: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; overflow: visible; }
    .folder[data-state="peek"], .folder[data-state="open"] { z-index: 4; }
    .folder:focus-visible .pocket { outline: 2px solid var(--ink); outline-offset: 6px; }
    .back, .plate { position: absolute; inset: 0; clip-path: url(#folderClip); }
    .back { background: #ececee; opacity: 0; transform: translateY(-14px); transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
    .folder[data-tone="dark"] .back { background: #9b9ba0; opacity: 1; transform: translateY(-22px); }
    .folder[data-state="open"] .back { opacity: 1; }
    .folder[data-tone="light"][data-state="open"] .back { background: #f6f6f7; transform: translateY(-12px); }
    .pocket { position: absolute; inset: 0; z-index: 2; }
    .plate { background: rgba(255,255,255,.94); transition: background .35s ease; filter: drop-shadow(0 16px 28px rgba(20,20,20,.10)); }
    .folder[data-tone="dark"] .plate { background: #17171a; }
    .folder[data-state="open"][data-tone="light"] .plate { background: #fff; }
    .folder[data-state="open"][data-tone="dark"] .plate { background: #1c1c1f; }
    .window { position: absolute; inset: 7px; clip-path: url(#folderClip); transition: opacity .35s ease; }
    .folder[data-state="open"] .window { opacity: 0; }
    .ghost { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .folder[data-tone="dark"] .ghost { filter: brightness(.62) saturate(.82); }
    .frost { position: absolute; left: 0; right: 0; bottom: 0; height: 48%; background: linear-gradient(to top, #fff 0 32%, rgba(255,255,255,.9) 58%, rgba(255,255,255,0) 100%); }
    .folder[data-tone="dark"] .frost { background: linear-gradient(to top, #121214 0 34%, rgba(18,18,20,.88) 60%, rgba(18,18,20,0) 100%); }
    .folder[data-state="peek"] .frost { height: 70%; }
    .stack { position: absolute; z-index: 1; left: 26px; bottom: 18px; width: 200px; height: 126px; }
    .sheet { position: absolute; inset: 0; padding: 4px; border-radius: 18px; background: #fff; box-shadow: 0 14px 28px rgba(20,20,20,.16); transform-origin: 50% 120%; opacity: 0; transform: translate(calc(var(--rest-x, 0) * 1px), calc(var(--rest-y, 0) * 1px)) rotate(calc(var(--rest-r, 0) * 1deg)); transition: transform .58s cubic-bezier(.2,.85,.2,1), opacity .35s ease; z-index: var(--i); }
    .sheet img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
    .folder[data-count="3"] .sheet:nth-child(1) { --i: 1; --peek-x: -34; --peek-y: -42; --peek-r: -10; --open-x: -84; --open-y: -78; --open-r: -14; }
    .folder[data-count="3"] .sheet:nth-child(2) { --i: 2; --peek-x: -12; --peek-y: -64; --peek-r: -3; --open-x: 2; --open-y: -118; --open-r: -2; }
    .folder[data-count="3"] .sheet:nth-child(3) { --i: 3; --peek-x: 12; --peek-y: -92; --peek-r: 4; --open-x: 52; --open-y: -86; --open-r: 9; }
    .folder[data-count="4"] .sheet:nth-child(1) { --i: 1; --peek-x: -40; --peek-y: -36; --peek-r: -12; --open-x: -102; --open-y: -68; --open-r: -16; }
    .folder[data-count="4"] .sheet:nth-child(2) { --i: 2; --peek-x: -18; --peek-y: -54; --peek-r: -6; --open-x: -36; --open-y: -108; --open-r: -7; }
    .folder[data-count="4"] .sheet:nth-child(3) { --i: 3; --peek-x: 2; --peek-y: -74; --peek-r: 1; --open-x: 22; --open-y: -124; --open-r: 2; }
    .folder[data-count="4"] .sheet:nth-child(4) { --i: 4; --peek-x: 16; --peek-y: -96; --peek-r: 5; --open-x: 70; --open-y: -84; --open-r: 12; }
    .folder[data-tone="dark"] .sheet:nth-child(2) { --rest-y: -46; --rest-x: 8; --rest-r: -1; opacity: 1; } .folder[data-state="peek"] .sheet, .folder[data-state="open"] .sheet { opacity: 1; }
    .folder[data-state="peek"] .sheet { transform: translate(calc(var(--peek-x) * 1px), calc(var(--peek-y) * 1px)) rotate(calc(var(--peek-r) * 1deg)); }
    .folder[data-state="open"] .sheet { transform: translate(calc(var(--open-x) * 1px), calc(var(--open-y) * 1px)) rotate(calc(var(--open-r) * 1deg)); }
    .meta { position: absolute; z-index: 3; left: 20px; right: 14px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
    .name, .count { display: block; }
    .name { font-size: 15px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    .count { margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.2; }
    .folder[data-tone="dark"] .name { color: #fff; }
    .folder[data-tone="dark"] .count { color: rgba(255,255,255,.74); }
    .mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
    .folder[data-icon="plus"] .mark { background: #111; color: #fff; }
    .folder[data-icon="more"] .mark { background: rgba(255,255,255,.72); color: #222; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); } .folder[data-state="open"][data-icon="more"] .mark { background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.16); }
    .ico { display: none; }
    .folder[data-icon="plus"]:not([data-state="open"]) .ico-plus,
    .folder[data-icon="more"]:not([data-state="open"]) .ico-more,
    .folder[data-state="open"] .ico-x { display: block; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .stage { padding: 96px 16px 56px; }
      .board { grid-template-columns: minmax(0, 252px); row-gap: 84px; }
      .folder[data-count="3"] .sheet:nth-child(1) { --open-x: -64; --open-r: -12; }
      .folder[data-count="3"] .sheet:nth-child(3) { --open-x: 38; --open-r: 8; }
      .folder[data-count="4"] .sheet:nth-child(1) { --open-x: -76; --open-r: -14; }
      .folder[data-count="4"] .sheet:nth-child(4) { --open-x: 50; --open-r: 10; }
    }
    @media (prefers-reduced-motion: reduce) { .sheet, .back, .window, .plate { transition: none; } }
  </style>
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <clipPath id="folderClip" clipPathUnits="objectBoundingBox">
      <path d="M0.07 0 H0.40 Q0.47 0 0.47 0.09 V0.11 Q0.47 0.18 0.55 0.18 H0.93 Q1 0.18 1 0.28 V0.90 Q1 1 0.90 1 H0.10 Q0 1 0 0.90 V0.10 Q0 0 0.07 0 Z"/>
    </clipPath>
  </svg>
  <div class="stage">
    <div class="board">
      <button type="button" class="folder" data-id="files" data-tone="light" data-icon="plus" data-count="3" data-state="rest" aria-expanded="false">
        <span class="back" aria-hidden="true"></span>
        <span class="stack" aria-hidden="true">
          <span class="sheet"><img src="files-1.jpg" alt=""></span>
          <span class="sheet"><img src="files-2.jpg" alt=""></span>
          <span class="sheet"><img src="files-3.jpg" alt=""></span>
        </span>
        <span class="pocket">
          <span class="plate"></span>
          <span class="window"><img class="ghost" src="files-3.jpg" alt=""><span class="frost"></span></span>
          <span class="meta">
            <span class="copy"><span class="name">My Files</span><span class="count">3 items</span></span>
            <span class="mark" aria-hidden="true">
              <svg class="ico ico-plus" viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              <svg class="ico ico-more" viewBox="0 0 24 24" width="16" height="16"><circle cx="6" cy="12" r="1.45" fill="currentColor"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/><circle cx="18" cy="12" r="1.45" fill="currentColor"/></svg>
              <svg class="ico ico-x" viewBox="0 0 24 24" width="15" height="15"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
          </span>
        </span>
      </button>
      <button type="button" class="folder" data-id="archives" data-tone="light" data-icon="more" data-count="4" data-state="rest" aria-expanded="false">
        <span class="back" aria-hidden="true"></span>
        <span class="stack" aria-hidden="true">
          <span class="sheet"><img src="archives-1.jpg" alt=""></span>
          <span class="sheet"><img src="archives-2.jpg" alt=""></span>
          <span class="sheet"><img src="archives-3.jpg" alt=""></span>
          <span class="sheet"><img src="archives-4.jpg" alt=""></span>
        </span>
        <span class="pocket">
          <span class="plate"></span>
          <span class="window"><img class="ghost" src="archives-4.jpg" alt=""><span class="frost"></span></span>
          <span class="meta">
            <span class="copy"><span class="name">Archives</span><span class="count">4 items</span></span>
            <span class="mark" aria-hidden="true">
              <svg class="ico ico-plus" viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              <svg class="ico ico-more" viewBox="0 0 24 24" width="16" height="16"><circle cx="6" cy="12" r="1.45" fill="currentColor"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/><circle cx="18" cy="12" r="1.45" fill="currentColor"/></svg>
              <svg class="ico ico-x" viewBox="0 0 24 24" width="15" height="15"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
          </span>
        </span>
      </button>
      <button type="button" class="folder" data-id="studio" data-tone="dark" data-icon="plus" data-count="3" data-state="rest" aria-expanded="false">
        <span class="back" aria-hidden="true"></span>
        <span class="stack" aria-hidden="true">
          <span class="sheet"><img src="studio-1.jpg" alt=""></span>
          <span class="sheet"><img src="studio-2.jpg" alt=""></span>
          <span class="sheet"><img src="studio-3.jpg" alt=""></span>
        </span>
        <span class="pocket">
          <span class="plate"></span>
          <span class="window"><img class="ghost" src="studio-3.jpg" alt=""><span class="frost"></span></span>
          <span class="meta">
            <span class="copy"><span class="name">Studio</span><span class="count">3 items</span></span>
            <span class="mark" aria-hidden="true">
              <svg class="ico ico-plus" viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              <svg class="ico ico-more" viewBox="0 0 24 24" width="16" height="16"><circle cx="6" cy="12" r="1.45" fill="currentColor"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/><circle cx="18" cy="12" r="1.45" fill="currentColor"/></svg>
              <svg class="ico ico-x" viewBox="0 0 24 24" width="15" height="15"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
          </span>
        </span>
      </button>
      <button type="button" class="folder" data-id="collection" data-tone="light" data-icon="more" data-count="3" data-state="rest" aria-expanded="false">
        <span class="back" aria-hidden="true"></span>
        <span class="stack" aria-hidden="true">
          <span class="sheet"><img src="collection-1.jpg" alt=""></span>
          <span class="sheet"><img src="collection-2.jpg" alt=""></span>
          <span class="sheet"><img src="collection-3.jpg" alt=""></span>
        </span>
        <span class="pocket">
          <span class="plate"></span>
          <span class="window"><img class="ghost" src="collection-3.jpg" alt=""><span class="frost"></span></span>
          <span class="meta">
            <span class="copy"><span class="name">Collection</span><span class="count">3 items</span></span>
            <span class="mark" aria-hidden="true">
              <svg class="ico ico-plus" viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              <svg class="ico ico-more" viewBox="0 0 24 24" width="16" height="16"><circle cx="6" cy="12" r="1.45" fill="currentColor"/><circle cx="12" cy="12" r="1.45" fill="currentColor"/><circle cx="18" cy="12" r="1.45" fill="currentColor"/></svg>
              <svg class="ico ico-x" viewBox="0 0 24 24" width="15" height="15"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
          </span>
        </span>
      </button>
    </div>
  </div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <script>
    const folders = [...document.querySelectorAll(".folder")];
    const live = document.getElementById("live");
    const fine = matchMedia("(hover: hover) and (pointer: fine)");
    const say = { files: "My Files", archives: "Archives", studio: "Studio", collection: "Collection" };
    function setState(folder, state) {
      folder.dataset.state = state;
      folder.setAttribute("aria-expanded", state === "open" ? "true" : "false");
    }
    function announce(folder, state) {
      const name = say[folder.dataset.id] || "文件夹";
      const count = folder.dataset.count;
      if (state === "open") live.textContent = name + " 摊开，" + count + " 张卡片。";
      else if (state === "peek") live.textContent = name + " 抽出一沓卡片。";
      else live.textContent = name + " 合上。";
    }
    for (const folder of folders) {
      folder.addEventListener("pointerenter", () => {
        if (fine.matches && folder.dataset.state !== "open") setState(folder, "peek");
      });
      folder.addEventListener("pointerleave", () => {
        if (folder.dataset.state === "peek") setState(folder, "rest");
      });
      folder.addEventListener("focus", () => {
        if (folder.dataset.state === "rest") setState(folder, "peek");
      });
      folder.addEventListener("blur", () => {
        if (folder.dataset.state === "peek") setState(folder, "rest");
      });
      folder.addEventListener("click", () => {
        const open = folder.dataset.state === "open";
        for (const other of folders) {
          if (other !== folder && other.dataset.state === "open") setState(other, "rest");
        }
        const next = open ? (fine.matches ? "peek" : "rest") : "open";
        setState(folder, next);
        announce(folder, next);
      });
    }
    const pose = new URLSearchParams(location.search).get("pose");
    if (pose) {
      const parts = pose.split(":");
      const folder = folders.find((item) => item.dataset.id === parts[0]);
      if (folder && (parts[1] === "peek" || parts[1] === "open")) setState(folder, parts[1]);
    }
  </script>
</body>
</html>
