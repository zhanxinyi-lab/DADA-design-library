<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>让网页更高级的6种背景</title>
  <style>
    :root {
      --bg: #f7f8fd;
      --ink: #14141c;
      --muted: #8b8a96;
      --lead: #3c3e4a;
      --footer: #5c6070;
      --kicker: #6150c2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2rem 3rem 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      font-weight: 700;
    }
    .kicker { color: var(--kicker); }
    .live { color: var(--muted); }
    h1 {
      margin: 1.45rem 0 0.4rem;
      font-size: clamp(1.65rem, 3.1vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .lead {
      margin: 0 0 1.55rem;
      color: var(--lead);
      font-size: 0.98rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 2.4rem;
      row-gap: 1.25rem;
    }
    .swatch {
      display: block;
      width: 100%;
      aspect-ratio: 338 / 125;
      border: 0;
      border-radius: 8px;
      background: #eceaf6;
    }
    .en {
      margin: 0.55rem 0 0;
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.01em;
    }
    .zh {
      margin: 0.12rem 0 0;
      font-size: 0.98rem;
      font-weight: 650;
    }
    footer {
      margin-top: 1.45rem;
      color: var(--footer);
      font-size: 0.82rem;
    }
    @media (max-width: 800px) {
      .stage { padding: 1.15rem 1.05rem 1.4rem; }
      header { letter-spacing: 0.08em; }
      .grid { grid-template-columns: 1fr; row-gap: 1rem; }
      .swatch { aspect-ratio: 16 / 7; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <header>
      <div class="kicker">WEBBG/01</div>
      <div class="live">LIVE · 6 DEMOS</div>
    </header>
    <h1>让网页更高级的6种背景</h1>
    <p class="lead">六种视觉语言，让AI准确理解背景质感</p>
    <div class="grid">
      <article>
        <canvas class="swatch" data-kind="mesh" aria-label="网格渐变"></canvas>
        <p class="en">Mesh Gradient</p>
        <p class="zh">网格渐变</p>
      </article>
      <article>
        <canvas class="swatch" data-kind="aurora" aria-label="极光背景"></canvas>
        <p class="en">Aurora Background</p>
        <p class="zh">极光背景</p>
      </article>
      <article>
        <canvas class="swatch" data-kind="noise" aria-label="噪点纹理"></canvas>
        <p class="en">Noise Texture</p>
        <p class="zh">噪点纹理</p>
      </article>
      <article>
        <canvas class="swatch" data-kind="dots" aria-label="点阵网格"></canvas>
        <p class="en">Dot Grid</p>
        <p class="zh">点阵网格</p>
      </article>
      <article>
        <canvas class="swatch" data-kind="spot" aria-label="聚光灯"></canvas>
        <p class="en">Spotlight Effect</p>
        <p class="zh">聚光灯</p>
      </article>
      <article>
        <canvas class="swatch" data-kind="gradient" aria-label="动态渐变"></canvas>
        <p class="en">Animated Gradient</p>
        <p class="zh">动态渐变</p>
      </article>
    </div>
    <footer>6种背景效果 · 同屏动态演示</footer>
  </main>
  <script>
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dprCap = 2;
    const canvases = [...document.querySelectorAll("canvas.swatch")];
    const spot = canvases.find((c) => c.dataset.kind === "spot");
    const pointer = { on: false, x: 0.62, y: 0.58 };
    const light = { x: 0.62, y: 0.58 };

    const grain = document.createElement("canvas");
    grain.width = 160;
    grain.height = 160;
    {
      const g = grain.getContext("2d", { alpha: true });
      const img = g.createImageData(grain.width, grain.height);
      let n = 2166136261;
      for (let i = 0; i < img.data.length; i += 4) {
        n = Math.imul(n ^ (n >>> 15), 2246822519);
        const v = n >>> 24;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }

    function fade(hex, alpha) {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
    }

    function blob(ctx, w, h, hex, x, y, r) {
      const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, hex);
      grd.addColorStop(1, fade(hex, 0));
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, w, h);
    }

    function drawMesh(ctx, w, h, t) {
      ctx.fillStyle = "#e4e0f4";
      ctx.fillRect(0, 0, w, h);
      const unit = Math.min(w, h);
      const P = [
        ["#d8ccf8", 0.2, 0.32, 1.7],
        ["#cfc4f4", 0.46, 0.7, 1.45],
        ["#e7e4f0", 0.74, 0.28, 1.55],
        ["#d5dbe8", 0.84, 0.72, 1.35],
        ["#ddd2f2", 0.38, 0.4, 1.2],
      ];
      for (const [color, x, y, r] of P) {
        const px = w * (x + Math.sin(t * 0.22 + x * 8) * 0.05);
        const py = h * (y + Math.cos(t * 0.18 + y * 7) * 0.07);
        blob(ctx, w, h, color, px, py, unit * r);
      }
    }

    function drawAurora(ctx, w, h, t) {
      const base = ctx.createLinearGradient(0, 0, 0, h);
      base.addColorStop(0, "#4d84ac");
      base.addColorStop(0.48, "#6a8ec6");
      base.addColorStop(1, "#554fa6");
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      const unit = Math.min(w, h);
      const bands = [
        ["#57a9c2", 0.1, 0.24, 1.25, 0.55],
        ["#3e76ae", 0.32, 0.16, 1.05, 0.4],
        ["#7ea8d5", 0.56, 0.4, 1.35, 0.36],
        ["#6a74d8", 0.84, 0.28, 1.15, 0.48],
        ["#8e8ccb", 0.2, 0.78, 1.2, 0.3],
        ["#4e50a1", 0.5, 0.84, 1.1, 0.42],
        ["#7472c8", 0.76, 0.68, 1.2, 0.33],
        ["#62c0d0", 0.92, 0.52, 0.95, 0.5],
      ];
      for (const [color, x, y, r, speed] of bands) {
        const px = w * (x + Math.sin(t * speed + y * 9) * 0.07);
        const py = h * (y + Math.cos(t * speed * 0.8 + x * 6) * 0.1);
        blob(ctx, w, h, color, px, py, unit * r);
      }
    }

    function drawNoise(ctx, w, h, t) {
      const base = ctx.createLinearGradient(0, 0, w, h);
      base.addColorStop(0, "#f1eefb");
      base.addColorStop(0.55, "#efe6f7");
      base.addColorStop(1, "#f1dceb");
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.globalCompositeOperation = "overlay";
      const ox = Math.round(Math.sin(t * 0.35) * 6);
      const oy = Math.round(Math.cos(t * 0.27) * 4);
      for (let y = -grain.height; y < h + grain.height; y += grain.height) {
        for (let x = -grain.width; x < w + grain.width; x += grain.width) {
          ctx.drawImage(grain, x + ox, y + oy);
        }
      }
      ctx.restore();
    }

    function drawDots(ctx, w, h, t) {
      ctx.fillStyle = "#f3f1ff";
      ctx.fillRect(0, 0, w, h);
      const pitch = Math.max(11, w / 20);
      const amp = pitch * 0.22;
      const ox = (Math.sin(t * 0.8) * amp + pitch) % pitch;
      const oy = (Math.cos(t * 0.55) * amp + pitch) % pitch;
      const radius = Math.max(1.15, pitch * 0.105);
      ctx.fillStyle = "#6d62c6";
      for (let y = oy - pitch; y < h + pitch; y += pitch) {
        for (let x = ox - pitch; x < w + pitch; x += pitch) {
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawSpot(ctx, w, h, t) {
      ctx.fillStyle = "#161044";
      ctx.fillRect(0, 0, w, h);
      let tx = 0.5 + Math.sin(t * 0.45) * 0.28;
      let ty = 0.56 + Math.cos(t * 0.33) * 0.2;
      if (reduce) { tx = 0.66; ty = 0.55; }
      if (pointer.on) { tx = pointer.x; ty = pointer.y; }
      const follow = reduce ? 1 : 0.08;
      light.x += (tx - light.x) * follow;
      light.y += (ty - light.y) * follow;
      const px = light.x * w;
      const py = light.y * h;
      const radius = Math.max(w, h) * 0.72;
      const glow = ctx.createRadialGradient(px, py, 0, px, py, radius);
      glow.addColorStop(0, "#b7a4e2");
      glow.addColorStop(0.22, "#8364b2");
      glow.addColorStop(0.55, "#3a2d72");
      glow.addColorStop(1, "#161044");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);
    }

    function drawGradient(ctx, w, h, t) {
      const ang = reduce ? 0.6 : t * 0.22;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const len = Math.hypot(w, h) * 0.55;
      const x0 = cx - Math.cos(ang) * len;
      const y0 = cy - Math.sin(ang) * len;
      const x1 = cx + Math.cos(ang) * len;
      const y1 = cy + Math.sin(ang) * len;
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, "#d2cbf6");
      g.addColorStop(0.42, "#e7b6ee");
      g.addColorStop(0.72, "#d4b0f4");
      g.addColorStop(1, "#c6b4f8");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      const drift = reduce ? 0 : Math.sin(t * 0.3) * 0.08;
      blob(ctx, w, h, "#e7b4ee", w * (0.55 + drift), h * 0.5, Math.min(w, h) * 1.15);
    }

    const draw = {
      mesh: drawMesh,
      aurora: drawAurora,
      noise: drawNoise,
      dots: drawDots,
      spot: drawSpot,
      gradient: drawGradient,
    };

    function resize(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(dprCap, devicePixelRatio || 1);
      const w = Math.max(2, Math.round(rect.width * dpr));
      const h = Math.max(2, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function frame(now) {
      const t = reduce ? 1.4 : now / 1000;
      for (const canvas of canvases) {
        resize(canvas);
        const ctx = canvas.getContext("2d");
        draw[canvas.dataset.kind](ctx, canvas.width, canvas.height, t);
      }
      if (!reduce) requestAnimationFrame(frame);
    }

    spot.addEventListener("pointermove", (e) => {
      const r = spot.getBoundingClientRect();
      pointer.on = true;
      pointer.x = (e.clientX - r.left) / r.width;
      pointer.y = (e.clientY - r.top) / r.height;
      if (reduce) frame(0);
    });
    spot.addEventListener("pointerleave", () => { pointer.on = false; });
    spot.addEventListener("pointerdown", (e) => { spot.setPointerCapture(e.pointerId); });

    addEventListener("resize", () => { if (reduce) frame(0); });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
