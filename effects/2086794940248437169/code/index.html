<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXION</title>
  <style>
    :root {
      --lime: #A3FF00;
      --cyan: #00E5FF;
      --bg: #000000;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.58);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Helvetica, Arial, system-ui, sans-serif;
      overflow: hidden;
      color-scheme: dark;
      -webkit-font-smoothing: antialiased;
    }
    @media (pointer: fine) {
      html, body, a, button { cursor: none !important; }
    }
    #view {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
    }
    #view.ready { opacity: 1; }

    .ui {
      position: relative;
      z-index: 2;
      height: 100%;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.85s ease, transform 0.85s ease;
      pointer-events: none;
    }
    .ui.ready {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }
    .ui a { pointer-events: auto; }

    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 1.35rem 2.2rem;
      z-index: 3;
    }
    .logo {
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      justify-self: start;
      color: #fff;
      text-decoration: none;
    }
    nav {
      display: flex;
      gap: 1.55rem;
      justify-content: center;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.82;
      transition: opacity 0.2s ease;
    }
    nav a:hover { opacity: 1; }
    .btn-nav {
      justify-self: end;
      background: var(--lime);
      color: #000;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0.58rem 1.05rem;
      border-radius: 999px;
      transition: transform 0.25s ease, filter 0.25s ease;
      display: inline-flex;
      align-items: center;
    }
    .btn-nav:hover { transform: scale(1.06); }

    .hero-copy {
      position: absolute;
      left: 4.4vw;
      top: max(92px, 24vh);
      max-width: min(78vw, 920px);
    }
    .brand-line {
      display: block;
      font-size: clamp(44px, 7.4vw, 124px);
      font-weight: 800;
      letter-spacing: -0.038em;
      line-height: 0.92;
      text-transform: uppercase;
      color: #fff;
    }
    .title-line {
      display: block;
      font-size: clamp(22px, 3.15vw, 52px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.12;
      margin-top: 0.22em;
      color: #fff;
    }
    .sub {
      margin-top: 1.35em;
      font-size: clamp(12px, 1.05vw, 15px);
      line-height: 1.55;
      color: var(--muted);
      max-width: 34ch;
      font-weight: 400;
    }

    .hero-bottom {
      position: absolute;
      right: 2.4rem;
      bottom: 2.1rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
      max-width: min(92vw, 560px);
    }
    .note {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.78);
      letter-spacing: 0.01em;
    }
    .note-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }
    .hero-actions {
      display: flex;
      gap: 0.55rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.72rem 1.15rem;
      transition: transform 0.25s ease, background 0.2s ease, border-color 0.2s ease;
      line-height: 1;
      white-space: nowrap;
    }
    .btn:hover { transform: scale(1.06); }
    .btn-primary {
      background: var(--lime);
      color: #000;
    }
    .btn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #000;
      display: inline-block;
    }
    .btn-ghost {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      padding-right: 1.05rem;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.55); }
    .btn-ghost svg { display: block; }

    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      will-change: transform, opacity, width, height;
      transition: width 0.22s ease, height 0.22s ease, opacity 0.22s ease, margin 0.22s ease;
    }
    .cursor.on { opacity: 1; }
    .cursor.hot {
      width: 0;
      height: 0;
      margin: 0;
      opacity: 0;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #000;
      display: grid;
      place-items: center;
      pointer-events: none;
      transition: background 0.55s ease 0.18s;
    }
    .loader-halo {
      position: absolute;
      width: 28vmin;
      height: 28vmin;
      will-change: transform, opacity;
      transition: transform 1s cubic-bezier(0.14, 0.82, 0.22, 1), opacity 0.55s ease 0.28s;
    }
    .blob {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      filter: blur(18px);
      -webkit-mask-image: radial-gradient(circle, transparent 34%, #000 46%, #000 58%, transparent 74%);
      mask-image: radial-gradient(circle, transparent 34%, #000 46%, #000 58%, transparent 74%);
    }
    .blob-a {
      background: var(--lime);
      opacity: 0.92;
      transform: translate(-7%, -5%) scale(1.04);
    }
    .blob-b {
      background: var(--cyan);
      opacity: 0.88;
      transform: translate(8%, 6%) scale(1.08);
      mix-blend-mode: screen;
    }
    .ring {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        transparent 42%,
        rgba(255,255,255,0.55) 50%,
        var(--lime) 56%,
        var(--cyan) 64%,
        transparent 74%
      );
      filter: blur(10px);
      opacity: 0.95;
    }
    .loader-pct {
      position: relative;
      z-index: 2;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.28s ease;
    }
    .loader.burst {
      background: transparent;
    }
    .loader.burst .loader-halo {
      transform: scale(18);
      opacity: 0;
    }
    .loader.burst .loader-pct { opacity: 0; }
    .loader.gone {
      display: none;
    }

    @media (max-width: 768px) {
      nav { display: none; }
      header { grid-template-columns: 1fr auto; padding: 1.1rem 1.15rem; }
      .hero-copy { left: 1.15rem; right: 1.15rem; top: max(78px, 18vh); }
      .brand-line { font-size: clamp(40px, 14vw, 72px); }
      .title-line { font-size: clamp(18px, 6.2vw, 32px); }
      .hero-bottom {
        left: 1.15rem;
        right: 1.15rem;
        bottom: 1.2rem;
        align-items: stretch;
      }
      .note { justify-content: flex-start; }
      .hero-actions { justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.2s !important;
      }
      .ui { transform: none; }
      .loader-halo { transition: opacity 0.25s ease; }
      .loader.burst .loader-halo { transform: none; opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="cursor" id="cursor"></div>

  <div class="loader" id="loader">
    <div class="loader-halo" id="halo">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="ring"></div>
    </div>
    <div class="loader-pct" id="pct">%0</div>
  </div>

  <div class="ui" id="ui">
    <header>
      <a class="logo" id="logo" href="#top"></a>
      <nav id="nav"></nav>
      <a class="btn-nav hot" id="cta" href="#talk"></a>
    </header>
    <div class="hero-copy">
      <h1>
        <span class="brand-line" id="brandName"></span>
        <span class="title-line" id="titleLine"></span>
      </h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="hero-bottom">
      <div class="note">
        <span class="note-dot"></span>
        <span id="noteText"></span>
      </div>
      <div class="hero-actions">
        <a class="btn btn-primary hot" id="btnPrimary" href="#start">
          <span class="btn-dot"></span>
          <span id="btnPrimaryLabel"></span>
        </a>
        <a class="btn btn-ghost hot" id="btnSecondary" href="#work">
          <span id="btnSecondaryLabel"></span>
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 11L11 3M11 3H4.5M11 3V9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    const BRAND = {
      name: 'AXION',
      logo: 'AXION',
      title: 'We sculpt light into brands.',
      subtitle: 'An independent studio for luminous identities, immersive sites and campaigns that linger in the dark.',
      nav: ['Index', 'Work', 'Studio', 'Expertise', 'Journal', 'Contact'],
      cta: "Let's talk",
      note: 'Currently booking new collaborations for 2026',
      btnPrimary: 'Start a project',
      btnSecondary: 'See the work',
      lime: '#A3FF00',
      cyan: '#00E5FF',
      bg: '#000000',
      loadPrefix: '%'
    };

    (function () {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const finePointer = window.matchMedia('(pointer: fine)').matches;

      const root = document.documentElement;
      root.style.setProperty('--lime', BRAND.lime);
      root.style.setProperty('--cyan', BRAND.cyan);
      root.style.setProperty('--bg', BRAND.bg);
      document.title = BRAND.name;
      document.body.style.background = BRAND.bg;

      document.getElementById('logo').textContent = BRAND.logo;
      document.getElementById('brandName').textContent = BRAND.name;
      document.getElementById('titleLine').textContent = BRAND.title;
      document.getElementById('subtitle').textContent = BRAND.subtitle;
      document.getElementById('cta').textContent = BRAND.cta;
      document.getElementById('noteText').textContent = BRAND.note;
      document.getElementById('btnPrimaryLabel').textContent = BRAND.btnPrimary;
      document.getElementById('btnSecondaryLabel').textContent = BRAND.btnSecondary;

      const nav = document.getElementById('nav');
      BRAND.nav.forEach(function (label, i) {
        const a = document.createElement('a');
        a.href = '#' + label.toLowerCase().replace(/\s+/g, '-');
        a.textContent = label;
        a.className = 'hot';
        nav.appendChild(a);
      });

      function hexToRgb(hex) {
        var h = String(hex || '').replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var n = parseInt(h, 16);
        if (isNaN(n)) return [0, 0, 0];
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      function hexToVec(hex) {
        return hexToRgb(hex).map(function (v) { return v / 255; });
      }
      function hash(n) {
        var s = Math.sin(n * 127.1) * 43758.5453;
        return s - Math.floor(s);
      }
      function noise1(x) {
        var i = Math.floor(x);
        var f = x - i;
        var u = f * f * (3 - 2 * f);
        return hash(i) * (1 - u) + hash(i + 1) * u;
      }
      function fbm(x) {
        return noise1(x) * 0.55 + noise1(x * 2.07 + 11.3) * 0.3 + noise1(x * 4.13 + 23.7) * 0.15;
      }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      var lime = hexToVec(BRAND.lime);
      var cyan = hexToVec(BRAND.cyan);
      var bg = hexToVec(BRAND.bg);

      var BEAM_N = 20;
      var beams = [];
      for (var i = 0; i < BEAM_N; i++) {
        var t = (i + 0.35 + hash(i * 3.1) * 0.4) / BEAM_N;
        var wide = hash(i * 9.7) > 0.62;
        beams.push({
          baseX: clamp(t * 1.12 - 0.06, -0.05, 1.05),
          w: wide ? (0.08 + hash(i * 2.2) * 0.07) : (0.02 + hash(i * 4.8) * 0.055),
          mix: hash(i * 6.6),
          amp: 0.025 + hash(i * 1.9) * 0.07,
          speed: 0.07 + hash(i * 5.5) * 0.16,
          phase: hash(i * 8.1) * 40,
          bSpeed: 0.25 + hash(i * 3.3) * 0.55,
          bPhase: hash(i * 7.4) * 12,
          baseI: (wide ? 0.45 : 0.7) + hash(i * 2.8) * 0.55,
          x: 0.5,
          i: 1
        });
      }

      var gapX = 0.58;
      var gapTarget = 0.58;
      var gapA = 1;
      var pointerLive = false;
      var lastPointer = 0;
      var pointerX = 0.58;

      function setPointer(clientX) {
        pointerLive = true;
        lastPointer = performance.now();
        pointerX = clamp(clientX / window.innerWidth, 0, 1);
        gapTarget = pointerX;
      }
      window.addEventListener('pointermove', function (e) { setPointer(e.clientX); }, { passive: true });
      window.addEventListener('pointerdown', function (e) { setPointer(e.clientX); }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches[0]) setPointer(e.touches[0].clientX);
      }, { passive: true });
      window.addEventListener('pointerleave', function () { pointerLive = false; });

      var cursor = document.getElementById('cursor');
      var curX = window.innerWidth * 0.5;
      var curY = window.innerHeight * 0.5;
      var curTX = curX;
      var curTY = curY;
      var cursorOn = false;
      var cursorHot = false;

      if (finePointer) {
        window.addEventListener('mousemove', function (e) {
          curTX = e.clientX;
          curTY = e.clientY;
          if (!cursorOn) {
            cursorOn = true;
            curX = curTX;
            curY = curTY;
            cursor.classList.add('on');
          }
        });
        document.addEventListener('mouseover', function (e) {
          var t = e.target;
          var hot = t && t.closest && t.closest('a, button, .hot');
          if (!!hot !== cursorHot) {
            cursorHot = !!hot;
            cursor.classList.toggle('hot', cursorHot);
          }
        });
        window.addEventListener('mouseleave', function () {
          cursor.classList.remove('on');
          cursorOn = false;
        });
      }

      var canvas = document.getElementById('view');
      var gl = null;
      var glState = null;
      var ctx2d = null;
      var noiseTile = null;

      function makeShader(gl, type, src) {
        var sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          gl.deleteShader(sh);
          return null;
        }
        return sh;
      }

      function initGL() {
        var opts = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' };
        gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
        if (!gl) return false;
        var vs = makeShader(gl, gl.VERTEX_SHADER,
          'attribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }');
        var fs = makeShader(gl, gl.FRAGMENT_SHADER, [
          '#ifdef GL_FRAGMENT_PRECISION_HIGH',
          'precision highp float;',
          '#else',
          'precision mediump float;',
          '#endif',
          'uniform vec2 uRes;',
          'uniform vec3 uLime;',
          'uniform vec3 uCyan;',
          'uniform vec3 uBg;',
          'uniform float uGapX;',
          'uniform float uGapW;',
          'uniform float uGapA;',
          'uniform float uGrain;',
          'uniform float uTime;',
          'uniform vec4 uBeams[20];',
          'void main(){',
          '  vec2 uv = gl_FragCoord.xy / uRes;',
          '  vec3 col = uBg;',
          '  for (int i = 0; i < 20; i++){',
          '    vec4 b = uBeams[i];',
          '    float d = abs(uv.x - b.x);',
          '    float sigma = max(b.y * 0.33, 0.004);',
          '    float g = exp(-0.5 * (d / sigma) * (d / sigma));',
          '    float core = exp(-0.5 * (d / (sigma * 0.42)) * (d / (sigma * 0.42)));',
          '    vec3 bc = mix(uLime, uCyan, clamp(b.z, 0.0, 1.0));',
          '    col += bc * (g * 0.48 + core * 0.28) * b.w;',
          '    col += vec3(0.85, 0.95, 0.88) * core * 0.12 * b.w;',
          '  }',
          '  float dg = abs(uv.x - uGapX);',
          '  float hole = exp(-0.5 * pow(dg / max(uGapW, 0.001), 2.0));',
          '  col *= 1.0 - hole * uGapA;',
          '  float n = fract(sin(dot(gl_FragCoord.xy + vec2(uTime * 37.0, uTime * 19.0), vec2(12.9898, 78.233))) * 43758.5453);',
          '  col += (n - 0.5) * uGrain;',
          '  col = col / (1.0 + col * 0.18);',
          '  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
          '}'
        ].join('\n'));
        if (!vs || !fs) return false;
        var prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.bindAttribLocation(prog, 0, 'aPos');
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
        gl.useProgram(prog);
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        var locs = {
          uRes: gl.getUniformLocation(prog, 'uRes'),
          uLime: gl.getUniformLocation(prog, 'uLime'),
          uCyan: gl.getUniformLocation(prog, 'uCyan'),
          uBg: gl.getUniformLocation(prog, 'uBg'),
          uGapX: gl.getUniformLocation(prog, 'uGapX'),
          uGapW: gl.getUniformLocation(prog, 'uGapW'),
          uGapA: gl.getUniformLocation(prog, 'uGapA'),
          uGrain: gl.getUniformLocation(prog, 'uGrain'),
          uTime: gl.getUniformLocation(prog, 'uTime'),
          beams: []
        };
        for (var i = 0; i < BEAM_N; i++) {
          locs.beams[i] = gl.getUniformLocation(prog, 'uBeams[' + i + ']');
        }
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        glState = { prog: prog, locs: locs };
        return true;
      }

      function init2D() {
        ctx2d = canvas.getContext('2d', { alpha: false });
        if (!ctx2d) return false;
        noiseTile = document.createElement('canvas');
        noiseTile.width = 128;
        noiseTile.height = 128;
        var nctx = noiseTile.getContext('2d');
        var img = nctx.createImageData(128, 128);
        for (var p = 0; p < img.data.length; p += 4) {
          var v = (hash(p * 0.13) * 255) | 0;
          img.data[p] = v;
          img.data[p + 1] = v;
          img.data[p + 2] = v;
          img.data[p + 3] = 28;
        }
        nctx.putImageData(img, 0, 0);
        return true;
      }

      var useGL = initGL();
      if (!useGL) init2D();

      function resize() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var scale = 0.42;
        var rw = Math.max(280, Math.floor(w * scale));
        var rh = Math.max(160, Math.floor(h * scale));
        if (canvas.width !== rw || canvas.height !== rh) {
          canvas.width = rw;
          canvas.height = rh;
        }
      }
      resize();
      window.addEventListener('resize', resize);

      function updateBeams(now, dt) {
        var t = now * 0.001;
        var idle = !pointerLive || (now - lastPointer > 1600);
        if (idle) {
          gapTarget = clamp(0.5 + (fbm(t * 0.18) - 0.5) * 1.05, 0.12, 0.88);
        } else {
          gapTarget = pointerX;
        }
        var k = 1 - Math.exp(-(reduced ? 18 : 5.2) * dt);
        gapX = lerp(gapX, gapTarget, k);

        for (var i = 0; i < beams.length; i++) {
          var b = beams[i];
          if (reduced) {
            b.x = b.baseX;
            b.i = b.baseI * 0.85;
          } else {
            var n = fbm(t * b.speed + b.phase);
            b.x = b.baseX + (n - 0.5) * 2 * b.amp;
            b.i = b.baseI * (0.72 + 0.28 * Math.sin(t * b.bSpeed + b.bPhase));
          }
        }
      }

      function drawGL(now) {
        var w = canvas.width;
        var h = canvas.height;
        gl.viewport(0, 0, w, h);
        var L = glState.locs;
        gl.uniform2f(L.uRes, w, h);
        gl.uniform3fv(L.uLime, lime);
        gl.uniform3fv(L.uCyan, cyan);
        gl.uniform3fv(L.uBg, bg);
        gl.uniform1f(L.uGapX, gapX);
        gl.uniform1f(L.uGapW, 0.04);
        gl.uniform1f(L.uGapA, gapA);
        gl.uniform1f(L.uGrain, reduced ? 0.015 : 0.035);
        gl.uniform1f(L.uTime, now * 0.001);
        for (var i = 0; i < BEAM_N; i++) {
          var b = beams[i];
          gl.uniform4f(L.beams[i], b.x, b.w, b.mix, b.i);
        }
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      function rgbCss(vec, a) {
        return 'rgba(' + ((vec[0] * 255) | 0) + ',' + ((vec[1] * 255) | 0) + ',' + ((vec[2] * 255) | 0) + ',' + a + ')';
      }

      function draw2D() {
        var w = canvas.width;
        var h = canvas.height;
        var c = ctx2d;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.globalCompositeOperation = 'source-over';
        c.fillStyle = BRAND.bg;
        c.fillRect(0, 0, w, h);
        c.globalCompositeOperation = 'lighter';
        for (var i = 0; i < beams.length; i++) {
          var b = beams[i];
          var x = b.x * w;
          var hw = b.w * w * 0.95;
          var col = [
            lerp(lime[0], cyan[0], b.mix),
            lerp(lime[1], cyan[1], b.mix),
            lerp(lime[2], cyan[2], b.mix)
          ];
          var g = c.createLinearGradient(x - hw, 0, x + hw, 0);
          g.addColorStop(0, rgbCss(col, 0));
          g.addColorStop(0.38, rgbCss(col, 0.18 * b.i));
          g.addColorStop(0.5, rgbCss([1, 1, 1], 0.22 * b.i));
          g.addColorStop(0.62, rgbCss(col, 0.18 * b.i));
          g.addColorStop(1, rgbCss(col, 0));
          c.fillStyle = g;
          c.fillRect(x - hw, 0, hw * 2, h);
        }
        c.globalCompositeOperation = 'destination-out';
        var gx = gapX * w;
        var gw = 0.04 * w * 3.2;
        var gg = c.createLinearGradient(gx - gw, 0, gx + gw, 0);
        gg.addColorStop(0, 'rgba(0,0,0,0)');
        gg.addColorStop(0.5, 'rgba(0,0,0,' + (0.96 * gapA) + ')');
        gg.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = gg;
        c.fillRect(gx - gw, 0, gw * 2, h);
        c.globalCompositeOperation = 'source-over';
        if (noiseTile) {
          c.globalAlpha = 0.12;
          var pat = c.createPattern(noiseTile, 'repeat');
          c.fillStyle = pat;
          c.fillRect(0, 0, w, h);
          c.globalAlpha = 1;
        }
      }

      var lastT = performance.now();
      function tick(now) {
        var dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        updateBeams(now, dt);
        if (useGL && gl) drawGL(now);
        else if (ctx2d) draw2D();

        if (finePointer && cursorOn) {
          var ck = 1 - Math.exp(-18 * dt);
          curX = lerp(curX, curTX, ck);
          curY = lerp(curY, curTY, ck);
          cursor.style.transform = 'translate3d(' + curX + 'px,' + curY + 'px,0)';
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      var pctEl = document.getElementById('pct');
      var loader = document.getElementById('loader');
      var ui = document.getElementById('ui');

      function reveal() {
        pctEl.textContent = BRAND.loadPrefix + '100';
        loader.classList.add('burst');
        ui.classList.add('ready');
        canvas.classList.add('ready');
        var hideAt = reduced ? 240 : 1100;
        setTimeout(function () { loader.classList.add('gone'); }, hideAt);
      }

      function runLoader() {
        if (reduced) {
          pctEl.textContent = BRAND.loadPrefix + '100';
          reveal();
          return;
        }
        var start = performance.now();
        var dur = 1000;
        function step(now) {
          var t = clamp((now - start) / dur, 0, 1);
          var eased = 1 - Math.pow(1 - t, 2.2);
          var p = Math.round(eased * 100);
          pctEl.textContent = BRAND.loadPrefix + p;
          if (t < 1) requestAnimationFrame(step);
          else reveal();
        }
        requestAnimationFrame(step);
      }
      runLoader();
    })();
  </script>
</body>
</html>
