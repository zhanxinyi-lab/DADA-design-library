<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天气感知搜索栏</title>
  <style>
    :root {
      color-scheme: dark;
      --sky-a: #070b14;
      --sky-b: #10182a;
      --ink: #e7eefc;
      --muted: #a9b4c9;
      --accent: #c5d4f2;
      --bar: rgba(16, 20, 32, .78);
      --line: rgba(255, 255, 255, .1);
      --cloud: .55;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100%;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse 28% 18% at 78% 16%, rgba(255, 255, 255, calc(var(--cloud) * .22)), transparent 70%),
        radial-gradient(ellipse 18% 12% at 86% 22%, rgba(255, 255, 255, calc(var(--cloud) * .12)), transparent 72%),
        linear-gradient(180deg, var(--sky-a), var(--sky-b) 58%, #05070d);
      transition: background .55s ease, color .55s ease;
    }
    body[data-theme="clear"] { --sky-a: #0c1228; --sky-b: #1a2b4d; --accent: #d5e4ff; --cloud: .2; }
    body[data-theme="rain"] { --sky-a: #070c16; --sky-b: #122033; --accent: #b7c8e4; --bar: rgba(12, 18, 30, .8); --cloud: .7; }
    body[data-theme="storm"] { --sky-a: #05060c; --sky-b: #16141f; --accent: #d4d0ff; --bar: rgba(8, 8, 14, .86); --cloud: .28; }
    body[data-theme="snow"] { --sky-a: #151c28; --sky-b: #2a384c; --accent: #f2f6fb; --bar: rgba(32, 42, 58, .78); --cloud: .85; }
    body[data-theme="fog"] { --sky-a: #23262c; --sky-b: #3a3e46; --ink: #f3f4f6; --muted: #d0d3d8; --accent: #e4e6ea; --bar: rgba(52, 56, 64, .7); --cloud: .15; }
    body[data-theme="dawn"] { --sky-a: #2a1c28; --sky-b: #6a4038; --ink: #fff6ef; --accent: #ffc7a8; --bar: rgba(42, 28, 34, .78); --cloud: .4; }
    body[data-theme="day"] {
      color-scheme: light;
      --sky-a: #8ebfe0;
      --sky-b: #d7ebf8;
      --ink: #102033;
      --muted: #3d5168;
      --accent: #c98416;
      --bar: rgba(255, 255, 255, .82);
      --line: rgba(16, 32, 51, .14);
      --cloud: .9;
    }
    body[data-theme="dusk"] { --sky-a: #2a1428; --sky-b: #6a3044; --ink: #fff3ea; --accent: #ff8d62; --bar: rgba(42, 22, 34, .8); --cloud: .35; }
    body[data-theme="night"] { --sky-a: #070b14; --sky-b: #12182a; --accent: #c5d4f2; --cloud: .55; }
    .scene, .flash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .flash { background: #f4f7ff; opacity: 0; }
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 16px 40px;
    }
    h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--muted);
    }
    .search { width: min(640px, 100%); }
    .bar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 64px;
      padding: 8px 10px 8px 16px;
      border-radius: 18px;
      background: var(--bar);
      border: 1px solid var(--line);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .12);
      overflow: hidden;
      transition: background .55s ease, border-color .55s ease, box-shadow .55s ease;
    }
    .bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 18px 50px rgba(0, 0, 0, .28);
    }
    .specks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .icon {
      position: relative;
      z-index: 1;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      color: var(--accent);
      transition: color .55s ease;
    }
    .icon svg { display: block; width: 28px; height: 28px; }
    input {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 18px/1.4 inherit;
      caret-color: var(--accent);
    }
    input::placeholder { color: var(--muted); }
    .clear {
      position: relative;
      z-index: 1;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: var(--ink);
      font: 14px/1 inherit;
      cursor: pointer;
    }
    .clear:focus-visible, .chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      width: max-content;
      max-width: 100%;
      margin: 12px auto 0;
      padding: 6px;
      border-radius: 999px;
      background: rgba(8, 10, 16, .72);
      border: 1px solid rgba(255, 255, 255, .06);
    }
    .chip {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: transparent;
      color: #d5dbe8;
      font: 14px/1.2 inherit;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      background: #e8edf6;
      color: #1b212c;
    }
    .state, .empty, .results { width: min(640px, 100%); }
    .state {
      min-height: 1.4em;
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .empty {
      margin: 0;
      padding: 16px;
      border-radius: 14px;
      border: 1px dashed color-mix(in srgb, var(--ink) 35%, transparent);
      text-align: center;
      color: var(--ink);
    }
    .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .results[hidden], .empty[hidden] { display: none; }
    .results li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bar);
      border: 1px solid var(--line);
    }
    .results strong { font-weight: 600; }
    .results span { color: var(--muted); font-size: 14px; }
    .keys { margin: 8px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body data-theme="night">
  <canvas class="scene" id="scene" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <main class="stage">
    <h1>天气感知搜索栏</h1>
    <form class="search" role="search" id="form">
      <div class="bar" id="bar">
        <span class="icon" id="icon" aria-hidden="true"></span>
        <label class="sr" for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">搜索天气或地点</label>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="搜索天气或地点" aria-describedby="state keys">
        <button class="clear" id="clear" type="button" hidden>清空</button>
        <canvas class="specks" id="specks" aria-hidden="true"></canvas>
      </div>
      <div class="modes" role="group" aria-label="天气">
        <button class="chip" type="button" data-word="晴" aria-pressed="false">晴</button>
        <button class="chip" type="button" data-word="小雨" aria-pressed="false">小雨</button>
        <button class="chip" type="button" data-word="暴风" aria-pressed="false">暴风</button>
        <button class="chip" type="button" data-word="雪" aria-pressed="false">雪</button>
        <button class="chip" type="button" data-word="雾" aria-pressed="false">雾</button>
      </div>
    </form>
    <p class="state" id="state" aria-live="polite"></p>
    <p class="empty" id="empty" hidden>没有匹配的地点</p>
    <ul class="results" id="results" hidden></ul>
    <p class="keys" id="keys">Tab 移动焦点，Esc 清空</p>
  </main>
  <script>
    const KEYS = [
      ["light rain", "rain"], ["小雨", "rain"], ["暴风", "storm"], ["thunder", "storm"],
      ["lightning", "storm"], ["storm", "storm"], ["snow", "snow"], ["blizzard", "snow"], ["sunset", "dusk"],
      ["sunrise", "dawn"], ["morning", "dawn"], ["drizzle", "rain"], ["clear", "clear"],
      ["sunny", "clear"], ["night", "night"], ["dusk", "dusk"], ["dawn", "dawn"],
      ["noon", "day"], ["fog", "fog"], ["mist", "fog"], ["rain", "rain"],
      ["黄昏", "dusk"], ["傍晚", "dusk"], ["清晨", "dawn"], ["早晨", "dawn"],
      ["夜晚", "night"], ["夜里", "night"], ["白天", "day"], ["中午", "day"],
      ["雪", "snow"], ["雾", "fog"], ["霾", "fog"], ["雨", "rain"], ["晴", "clear"],
      ["雷", "storm"], ["夜", "night"]
    ].sort((a, b) => b[0].length - a[0].length);

    const PLACES = [
      { name: "晴川渡口", note: "无云", keys: ["晴", "clear", "sunny"] },
      { name: "小雨巷", note: "细雨", keys: ["小雨", "雨", "rain", "drizzle"] },
      { name: "暴风港", note: "先避一避", keys: ["暴风", "storm", "thunder", "雷"] },
      { name: "雪线客栈", note: "正在下雪", keys: ["雪", "snow"] },
      { name: "雾中车站", note: "能见度低", keys: ["雾", "fog", "mist", "霾"] },
      { name: "清晨坡", note: "天刚亮", keys: ["清晨", "早晨", "dawn", "morning"] },
      { name: "黄昏台", note: "天色转暖", keys: ["黄昏", "傍晚", "dusk", "sunset"] },
      { name: "夜航栈桥", note: "灯已亮", keys: ["夜", "夜晚", "night"] }
    ];

    const CHIPS = { clear: "晴", rain: "小雨", storm: "暴风", snow: "雪", fog: "雾" };
    const NAMES = {
      clear: "晴", rain: "小雨", storm: "暴风", snow: "雪", fog: "雾",
      dawn: "清晨", day: "白天", dusk: "黄昏", night: "夜晚"
    };
    const ICONS = {
      clear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18"/></svg>',
      rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 15a4 4 0 0 1 .4-7.4A5 5 0 0 1 17 9a3.2 3.2 0 0 1 1 6"/><path d="M8 18.5 7 21M12 18.5 11 21M16 18.5 15 21"/></svg>',
      storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 14a4 4 0 0 1 .4-7.4A5 5 0 0 1 17 8a3.2 3.2 0 0 1 .2 6"/><path d="M11 14.5 8.5 19h3L10 22.5"/></svg>',
      snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M5.2 6.8l13.6 10.4M18.8 6.8 5.2 17.2"/><path d="M12 7.2 10.6 5.2M12 7.2l1.4-2M12 16.8 10.6 18.8M12 16.8l1.4 2"/></svg>',
      fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 9h14M4 12h16M6 15h12M8 18h8"/></svg>',
      dawn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 16h16"/><path d="M12 16a4 4 0 0 1 0-8 4 4 0 0 1 0 8Z"/><path d="M12 4.5v2M6 8l1.4 1.4M18 8l-1.4 1.4"/></svg>',
      day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18"/></svg>',
      dusk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 17h16"/><path d="M7 17a5 5 0 0 1 10 0"/><path d="M12 7.5v2"/></svg>',
      night: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 3.5A7.5 7.5 0 1 0 20.5 14 6.2 6.2 0 0 1 15 3.5Z"/></svg>'
    };

    const q = document.querySelector("#q");
    const clearBtn = document.querySelector("#clear");
    const stateEl = document.querySelector("#state");
    const emptyEl = document.querySelector("#empty");
    const resultsEl = document.querySelector("#results");
    const iconEl = document.querySelector("#icon");
    const chips = [...document.querySelectorAll(".chip")];
    const scene = document.querySelector("#scene");
    const specks = document.querySelector("#specks");
    const flash = document.querySelector("#flash");
    const sceneCtx = scene.getContext("2d");
    const speckCtx = specks.getContext("2d");
    const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let theme = "night";
    let raf = 0;
    let iconName = "";
    let cleared = false;

    function timeTheme(date) {
      const h = date.getHours();
      if (h >= 5 && h < 8) return "dawn";
      if (h >= 8 && h < 16) return "day";
      if (h >= 16 && h < 19) return "dusk";
      return "night";
    }

    function themeFromQuery(value) {
      const s = value.trim().toLowerCase();
      if (!s) return null;
      for (const [word, id] of KEYS) {
        if (s.includes(word.toLowerCase())) return id;
      }
      return null;
    }

    function hits(value) {
      const s = value.trim().toLowerCase();
      if (!s) return [];
      return PLACES.filter((place) => place.name.toLowerCase().includes(s) || place.keys.some((key) => s.includes(key.toLowerCase())));
    }

    function resizeCanvas(canvas, width, height) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(width));
      const h = Math.max(1, Math.round(height));
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w, h };
    }

    function makeDrops(count, w, h) {
      const drops = [];
      for (let i = 0; i < count; i++) {
        drops.push({
          x: Math.random() * w,
          y: Math.random() * h,
          len: 8 + Math.random() * 12,
          v: 2.2 + Math.random() * 3.4
        });
      }
      return drops;
    }

    let sceneDrops = [];
    let barDrops = [];
    let flakes = [];

    function layout() {
      const view = resizeCanvas(scene, window.innerWidth, window.innerHeight);
      const bar = specks.getBoundingClientRect();
      const box = resizeCanvas(specks, bar.width, bar.height);
      sceneDrops = makeDrops(70, view.w, view.h);
      barDrops = makeDrops(28, box.w, box.h);
      flakes = Array.from({ length: 40 }, () => ({
        x: Math.random() * view.w,
        y: Math.random() * view.h,
        r: 1 + Math.random() * 2.2,
        v: .35 + Math.random() * .8
      }));
      return { view, box };
    }

    let viewSize = layout();

    function paint(now, still) {
      const { w, h } = viewSize.view;
      const ctx = sceneCtx;
      ctx.clearRect(0, 0, w, h);
      const kind = theme === "storm" ? "rain" : theme;
      if (kind === "rain" || theme === "storm") {
        ctx.strokeStyle = theme === "storm" ? "rgba(226,226,240,.45)" : "rgba(198,214,232,.38)";
        ctx.lineWidth = theme === "storm" ? 1.4 : 1;
        for (const d of sceneDrops) {
          if (!still) {
            d.y += theme === "storm" ? d.v * 1.8 : d.v;
            d.x += theme === "storm" ? 1.4 : .35;
            if (d.y > h) { d.y = -20; d.x = Math.random() * w; }
          }
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + 2, d.y + d.len);
          ctx.stroke();
        }
      } else if (kind === "snow") {
        ctx.fillStyle = "rgba(255,255,255,.8)";
        for (const f of flakes) {
          if (!still) {
            f.y += f.v;
            f.x += Math.sin((now / 700) + f.y) * .3;
            if (f.y > h) f.y = -4;
          }
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (kind === "clear" || kind === "night") {
        ctx.fillStyle = "rgba(255,255,255,.75)";
        for (let i = 0; i < 48; i++) {
          const x = (i * 97) % w;
          const y = (i * 53) % (h * .7);
          ctx.globalAlpha = still ? .8 : .45 + .55 * Math.abs(Math.sin(now / 800 + i));
          ctx.fillRect(x, y, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
        }
        ctx.globalAlpha = 1;
      } else if (kind === "fog") {
        ctx.fillStyle = "rgba(255,255,255,.08)";
        ctx.beginPath();
        ctx.ellipse(w * .3, h * .62, w * .35, 80, 0, 0, Math.PI * 2);
        ctx.ellipse(w * .7, h * .7, w * .4, 90, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      const bw = viewSize.box.w;
      const bh = viewSize.box.h;
      speckCtx.clearRect(0, 0, bw, bh);
      if (theme === "rain" || theme === "storm") {
        speckCtx.fillStyle = "rgba(230,238,248,.8)";
        for (const d of barDrops) {
          if (!still) {
            d.y += theme === "storm" ? d.v * 1.5 : d.v * .8;
            if (d.y > bh) d.y = -6;
          }
          speckCtx.fillRect(d.x, d.y, 1.4, 1.4);
        }
      } else if (theme === "snow") {
        speckCtx.fillStyle = "rgba(255,255,255,.9)";
        for (const d of barDrops) {
          if (!still) {
            d.y += .6;
            if (d.y > bh) d.y = -4;
          }
          speckCtx.beginPath();
          speckCtx.arc(d.x, d.y, 1.3, 0, Math.PI * 2);
          speckCtx.fill();
        }
      } else if (theme === "fog") {
        speckCtx.fillStyle = "rgba(255,255,255,.16)";
        speckCtx.fillRect(0, bh * .35, bw, bh * .3);
      }
      if (theme === "storm" && !still && (now % 2600) < 90) flash.style.opacity = ".4";
      else flash.style.opacity = "0";
    }

    function loop(now) {
      paint(now, false);
      raf = requestAnimationFrame(loop);
    }

    function startMotion() {
      cancelAnimationFrame(raf);
      if (motion.matches || document.hidden) paint(0, true);
      else raf = requestAnimationFrame(loop);
    }

    function setIcon(name) {
      if (name === iconName) return;
      iconName = name;
      iconEl.innerHTML = ICONS[name] || ICONS.night;
    }

    function render() {
      const value = q.value;
      const typed = themeFromQuery(value);
      theme = typed || timeTheme(new Date());
      document.body.dataset.theme = theme;
      setIcon(theme);
      const found = hits(value);
      const focused = document.activeElement === q;
      clearBtn.hidden = value.length === 0;
      chips.forEach((chip) => {
        chip.setAttribute("aria-pressed", CHIPS[theme] === chip.dataset.word ? "true" : "false");
      });
      const bits = [];
      if (focused) bits.push("已聚焦");
      if (!value.trim()) {
        bits.push(cleared ? "已清空" : "尚未输入");
        bits.push(`氛围跟着${NAMES[theme]}`);
      } else if (!found.length) bits.push("没有匹配的地点", NAMES[theme]);
      else bits.push(`${found.length} 个地点`, NAMES[theme]);
      stateEl.textContent = bits.join("。") + "。";
      emptyEl.hidden = !value.trim() || found.length > 0;
      resultsEl.hidden = found.length === 0;
      resultsEl.replaceChildren(...found.map((place) => {
        const li = document.createElement("li");
        const name = document.createElement("strong");
        name.textContent = place.name;
        const note = document.createElement("span");
        note.textContent = place.note;
        li.append(name, note);
        return li;
      }));
    }

    document.querySelector("#form").addEventListener("submit", (event) => event.preventDefault());
    function writeQuery(next, asClear) {
      q.value = next;
      cleared = asClear;
      q.focus();
      render();
    }
    q.addEventListener("input", () => {
      cleared = q.value.length === 0;
      render();
    });
    q.addEventListener("focus", render);
    q.addEventListener("blur", render);
    clearBtn.addEventListener("click", () => writeQuery("", true));
    chips.forEach((chip) => chip.addEventListener("click", () => {
      const on = chip.getAttribute("aria-pressed") === "true";
      writeQuery(on ? "" : chip.dataset.word, on);
    }));
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || event.isComposing || !q.value) return;
      event.preventDefault();
      writeQuery("", true);
    });
    window.addEventListener("resize", () => {
      viewSize = layout();
      startMotion();
    });
    document.addEventListener("visibilitychange", startMotion);
    motion.addEventListener("change", startMotion);
    render();
    startMotion();
  </script>
</body>
</html>
