<html lang="en">
<head>
  <meta charset="utf-8">

  <title>MATRIXPAY 粒子字标</title>
  <script>
    (function () {
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce && location.search.indexOf("freeze=1") === -1) document.documentElement.classList.add("play");
    })();
  </script>
  <style>
    :root {
      --bg: #050806;
      --mint: #3ee7a0;
      --mint-ink: #062117;
      --paper: #f4f7f5;
      --muted: #c5d0cb;
      --dim: rgba(244, 247, 245, 0.78);
      --nav-a: 1;
      --copy-a: 1;
      --chrome-a: 1;
    }
    html.play { --nav-a: 0; --copy-a: 0; --chrome-a: 0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--paper);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid #b8ffe4; outline-offset: 3px; }
    .stage { position: relative; height: 100%; display: flex; flex-direction: column; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
    header, .mid, footer { position: relative; z-index: 1; }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      padding: 16px 28px 6px;
      background: linear-gradient(#050806 55%, rgba(5, 8, 6, 0));
    }
    .brand, .menu, .account { opacity: var(--nav-a); }
    .copy, .tick { opacity: var(--copy-a); }
    .os, footer { opacity: var(--chrome-a); }
    html.play:not(.in-nav) .brand,
    html.play:not(.in-nav) .menu,
    html.play:not(.in-nav) .account,
    html.play:not(.in-copy) .copy,
    html.play:not(.in-copy) .tick,
    html.play:not(.in-chrome) .os,
    html.play:not(.in-chrome) footer { pointer-events: none; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.14em;
      font-size: 13px;
      font-weight: 700;
    }
    .brand svg { width: 22px; height: 22px; display: block; }
    .menu {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 22px;
      min-width: 0;
    }
    .menu button { background: none; border: 0; padding: 6px 0; color: var(--dim); }
    .menu button:hover, .menu button[aria-current="true"] { color: var(--paper); }
    .account {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      border: 1px solid rgba(62, 231, 160, 0.45);
      background: rgba(6, 20, 14, 0.78);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 0 18px rgba(62, 231, 160, 0.18);
    }
    .account i {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--mint); box-shadow: 0 0 8px var(--mint);
    }
    .mid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 1.05fr) minmax(180px, 0.85fr) minmax(230px, 0.8fr);
      align-items: center;
      gap: 12px;
      padding: 0 4vw 8px;
    }
    .slot { align-self: stretch; min-height: 320px; }
    .tick {
      position: absolute;
      left: 2.2vw;
      top: 42%;
      width: 1px;
      height: 42px;
      background: rgba(255, 255, 255, 0.8);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 4.2vw, 60px);
      line-height: 0.92;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }
    h1 span { display: block; }
    h1 em {
      font-family: Georgia, "Palatino Linotype", Palatino, serif;
      font-style: italic;
      font-weight: 500;
      color: #6ff5cf;
      letter-spacing: 0;
      margin-right: 0.18em;
    }
    .lede {
      max-width: 36ch;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .actions { display: flex; align-items: center; gap: 22px; margin-top: 22px; flex-wrap: wrap; }
    .go {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: var(--mint);
      color: var(--mint-ink);
      font-weight: 700;
      border-radius: 999px;
      padding: 7px 8px 7px 18px;
    }
    .go b {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--mint-ink); color: #e9fff6; font-weight: 500;
    }
    .explore { background: none; border: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.85); padding: 0 0 2px; }
    .os { justify-self: end; max-width: 280px; }
    .kicker, .meta { margin: 0; color: var(--dim); font-size: 11px; letter-spacing: 0.14em; }
    .os h2 { margin: 8px 0; font-size: clamp(28px, 3vw, 40px); font-weight: 500; letter-spacing: 0.04em; }
    .os-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
    .view {
      border: 0; background: var(--mint); color: var(--mint-ink);
      font-weight: 800; letter-spacing: 0.08em; font-size: 12px;
      border-radius: 999px; padding: 10px 16px;
    }
    .pager { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); }
    .pager button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--paper); }
    .pager button:hover { background: rgba(255, 255, 255, 0.08); }
    .pager span { min-width: 3.2em; text-align: center; letter-spacing: 0.08em; font-size: 13px; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;

      font-size: 11px;
      letter-spacing: 0.12em;

    .stats { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
    .stats b { color: var(--paper); font-weight: 650; letter-spacing: 0.04em; }
    .pill {
      display: inline-block; margin-left: 8px; background: #12392c; color: var(--mint);
      border-radius: 999px; padding: 3px 7px; letter-spacing: 0.04em;
    }
    .live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 820px) {
      html, body { max-width: 100%; overflow-x: hidden; overflow-y: auto; }
      .stage { height: auto; min-height: 100%; width: 100%; max-width: 100%; }
      .stage { min-width: 0; }
      header, .mid, footer { min-width: 0; width: 100%; }
      header { display: block; position: relative; padding: 12px 12px 4px; }
      .brand { font-size: 12px; letter-spacing: 0.08em; }
      .account { position: absolute; top: 10px; right: 12px; margin-left: 0; padding: 6px 10px; font-size: 13px; }
      .menu { width: 100%; min-width: 0; margin-top: 8px; justify-content: flex-start; overflow-x: auto; gap: 14px; font-size: 14px; }
      .actions { flex-direction: column; align-items: flex-start; gap: 12px; }
      .mid { grid-template-columns: 1fr; align-content: start; padding: 8px 16px 12px; }
      .copy { min-width: 0; max-width: 100%; }
      .slot { min-height: 42vh; margin-top: 8px; }
      .os { justify-self: start; }
      footer { flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px 16px 16px; }
      .tick { display: none; }
      h1 { font-size: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand, .menu, .account, .copy, .os, footer, .tick { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="view" aria-hidden="true"></canvas>
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path fill="#3ee7a0" d="M4 28V4h7.2l4.8 9.2L20.8 4H28v24h-6.2V14.2L16 23.2 10.2 14.2V28z"/>
        </svg>

      </div>

    </header>
    <div class="mid">
      <div class="tick" aria-hidden="true"></div>
      <section class="copy">
        <h1>
          <span>FINANCIAL</span>
          <span>INTELLIGENCE.</span>

        <p class="kicker" id="kicker">SYSTEM 01 / CORE</p>

            <button type="button" id="prev" aria-label="Previous system">‹</button>

    </footer>
    <p class="live" id="live" aria-live="polite"></p>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var stage = document.getElementById("stage");
      var canvas = document.getElementById("view");
      var slot = document.getElementById("slot");
      var foot = document.querySelector("footer");
      var ctx = canvas.getContext("2d", { alpha: false });
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches || location.search.indexOf("freeze=1") !== -1;
      var seek = Number(new URLSearchParams(location.search).get("at"));
      if (!isFinite(seek)) seek = 0;
      var origin = performance.now() - seek * 1000;
      var pointer = { x: 0.5, y: 0.46, speed: 0, energy: 0 };
      var yaw = 0;
      var pitch = 0;
      var system = 1;
      var view = { w: 1, h: 1, dpr: 1 };
      var mark = { cx: 640, cy: 360 };
      var ring = { cx: 640, cy: 120, rx: 220, ry: 36 };
      var podiumY = 640;
      var parts = [];
      var leaves = [];
      var failsafe = 0;

      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
      function smooth(t, a, b) {
        if (t <= a) return 0;
        if (t >= b) return 1;
        var u = (t - a) / (b - a);
        return u * u * (3 - 2 * u);
      }
      function ease(u) { return u * u * (3 - 2 * u); }
      function elapsed() { return reduce ? 8 : (performance.now() - origin) / 1000; }

      function fade(t) {
        var nav = reduce ? 1 : smooth(t, 0.45, 1.05);
        var copy = reduce ? 1 : smooth(t, 1.1, 1.75);
        var chrome = reduce ? 1 : smooth(t, 1.55, 2.2);
        root.style.setProperty("--nav-a", nav.toFixed(3));
        root.style.setProperty("--copy-a", copy.toFixed(3));
        root.style.setProperty("--chrome-a", chrome.toFixed(3));
        root.classList.toggle("in-nav", nav > 0.85);
        root.classList.toggle("in-copy", copy > 0.85);
        root.classList.toggle("in-chrome", chrome > 0.85);
      }

      function armFailsafe() {
        clearTimeout(failsafe);
        if (!reduce) {
          failsafe = setTimeout(function () {
            root.style.setProperty("--nav-a", "1");
            root.style.setProperty("--copy-a", "1");
            root.style.setProperty("--chrome-a", "1");
            root.classList.add("in-nav", "in-copy", "in-chrome");
          }, 2300);
        }
      }

      function sampleMark() {
        var c = document.createElement("canvas");
        c.width = 240;
        c.height = 260;
        var g = c.getContext("2d");
        var poly = [[6, 246], [6, 12], [62, 12], [120, 138], [178, 12], [234, 12], [234, 246], [178, 246], [178, 86], [120, 198], [62, 86], [62, 246]];
        g.fillStyle = "#fff";
        g.beginPath();
        poly.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); });
        g.closePath();
        g.fill();
        var img = g.getImageData(0, 0, 240, 260).data;
        var pts = [];
        var y, x;
        for (y = 0; y < 260; y += 3) {
          for (x = 0; x < 240; x += 3) {
            if (img[(y * 240 + x) * 4 + 3] > 40) pts.push([(x - 120) / 120, (y - 128) / 130]);
          }
        }
        return pts;
      }

      function build() {
        var pts = sampleMark();
        var shells = [-1, -0.35, 0.35, 1];
        parts = [];
        var i, s;
        for (i = 0; i < pts.length; i++) {
          for (s = 0; s < shells.length; s++) {
            if (s % 2 === 1 && i % 2 === 0) continue;
            parts.push({
              tx: pts[i][0] * 112,
              ty: pts[i][1] * 128,
              tz: shells[s] * 28 + ((i * 13) % 9) - 4,
              delay: (i % 19) / 18,
              seed: ((i * 37) % 100) / 100,
              ang: (i * 2.399) % 6.2832
            });
          }
        }
        if (parts.length > 2200) {
          var slim = [];
          var step = Math.ceil(parts.length / 2200);
          for (i = 0; i < parts.length; i += step) slim.push(parts[i]);
          parts = slim;
        }
        leaves = [];
        var n = 11;
        function rnd() { n = (n * 16807 + 11) % 2147483647; return n / 2147483647; }
        for (i = 0; i < 70; i++) {
          leaves.push({
            side: i < 36 ? 0 : 1,
            u: rnd(),
            v: rnd(),
            r: 4 + rnd() * 11,
            a: 0.12 + rnd() * 0.22
          });
        }
      }

      function resize() {
        var rect = canvas.getBoundingClientRect();
        var w = Math.max(1, Math.round(rect.width));
        var h = Math.max(1, Math.round(rect.height));
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        if (w === view.w && h === view.h && dpr === view.dpr && canvas.width) return;
        view.w = w;
        view.h = h;
        view.dpr = dpr;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }

      function layout() {
        var cr = canvas.getBoundingClientRect();
        var sr = slot.getBoundingClientRect();
        var fr = foot.getBoundingClientRect();
        mark.cx = (sr.left - cr.left) + sr.width / 2;
        var narrow = view.w < 820;
        mark.cy = (sr.top - cr.top) + sr.height * (narrow ? 0.64 : 0.56);
        ring.cx = mark.cx;
        ring.cy = (sr.top - cr.top) + Math.max(18, sr.height * (narrow ? 0.2 : 0.06));
        ring.rx = Math.min(sr.width * 0.62, view.w * 0.22);
        ring.ry = Math.max(14, Math.min(sr.height * 0.08, 42));
        podiumY = Math.max(mark.cy + 40, (fr.top - cr.top) - 8);
      }

      function project(x, y, z, useYaw, usePitch) {
        var cy = Math.cos(useYaw);
        var sy = Math.sin(useYaw);
        var x1 = x * cy - z * sy;
        var z1 = x * sy + z * cy;
        var cp = Math.cos(usePitch);
        var sp = Math.sin(usePitch);
        var y1 = y * cp - z1 * sp;
        var z2 = y * sp + z1 * cp;
        var persp = 340 / (340 + z2);
        var slotW = slot.clientWidth || view.w;
        var slotH = slot.clientHeight || view.h;
        var scale = Math.min(slotW, slotH) / (slotW < 520 ? 460 : 300);
        return {
          x: mark.cx + x1 * scale * persp,
          y: mark.cy + y1 * scale * persp,
          z: z2,
          s: Math.max(1.15, 2.05 * persp)
        };
      }

      function ringPoint(p) {
        var a = p.ang * 3.1;
        var rad = 0.22 + p.seed * 0.78;
        return {
          x: ring.cx + Math.cos(a) * ring.rx * rad,
          y: ring.cy + Math.sin(a) * ring.ry * rad
        };
      }

      function drawRoom(t) {
        var w = view.w;
        var h = view.h;
        var g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#070b09");
        g.addColorStop(1, "#08110e");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        var i, leaf, x0, y0;
        for (i = 0; i < leaves.length; i++) {
          leaf = leaves[i];
          x0 = leaf.side ? w * 0.9 : w * 0.02;
          y0 = ring.cy;
          ctx.fillStyle = "rgba(64, 122, 74, " + leaf.a + ")";
          ctx.beginPath();
          ctx.ellipse(x0 + leaf.u * w * 0.1, y0 + leaf.v * (podiumY - y0) * 0.85, leaf.r, leaf.r * 0.7, leaf.u * 2, 0, 6.2832);
          ctx.fill();
        }
        var shaft = 0.1 - smooth(t, 2.2, 3.4) * 0.04;
        ctx.fillStyle = "rgba(214, 228, 220, " + shaft + ")";
        ctx.beginPath();
        ctx.moveTo(ring.cx, ring.cy);
        ctx.lineTo(mark.cx - view.w * 0.08, podiumY);
        ctx.lineTo(mark.cx + view.w * 0.06, podiumY);
        ctx.closePath();
        ctx.fill();
      }

      function drawRing(t) {
        var fade = 1 - smooth(t, 0.35, 1.35);
        ctx.save();
        ctx.translate(ring.cx, ring.cy);
        ctx.scale(1, ring.ry / Math.max(ring.rx, 1));
        ctx.strokeStyle = "rgba(226, 234, 230, " + (0.28 + fade * 0.4) + ")";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(0, 0, ring.rx, 0, 6.2832);
        ctx.stroke();
        ctx.restore();
        var i, a, inner;
        ctx.lineWidth = 1.2;
        for (i = 0; i < 64; i++) {
          a = (i / 64) * 6.2832 + t * 0.12;
          inner = 0.42 + (i % 5) * 0.05;
          ctx.strokeStyle = "rgba(255,255,255," + (0.18 + fade * 0.55) + ")";
          ctx.beginPath();
          ctx.moveTo(ring.cx + Math.cos(a) * ring.rx * inner, ring.cy + Math.sin(a) * ring.ry * inner);
          ctx.lineTo(ring.cx + Math.cos(a) * ring.rx * 0.94, ring.cy + Math.sin(a) * ring.ry * 0.94);
          ctx.stroke();
        }
      }

      function drawPodium() {
        ctx.strokeStyle = "rgba(62, 231, 160, 0.9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(mark.cx, podiumY, Math.min(view.w * 0.16, 180), 14, 0, 0, 6.2832);
        ctx.stroke();
        ctx.strokeStyle = "rgba(62, 231, 160, 0.25)";
        ctx.beginPath();
        ctx.ellipse(mark.cx, podiumY + 16, Math.min(view.w * 0.22, 240), 18, 0, 0, 6.2832);
        ctx.stroke();
      }

      function drawParticle(p, t, gather, burst, glow) {
        var born = reduce ? 1 : smooth(t, 0.35, 0.85);
        if (born <= 0) return;
        var spot = ringPoint(p);
        var life = Math.max(0, t - 0.42 - p.delay * 1.15);
        var fall = reduce ? 1 : clamp(life / 1.35, 0, 1);
        var gth = reduce ? 1 : smooth(t, 1.55 + p.delay * 0.35, 3.05);
        var kick = burst * (0.35 + p.seed * 0.75);
        var tgt = project(
          p.tx + Math.cos(p.ang) * 72 * kick,
          p.ty + Math.sin(p.ang) * 54 * kick,
          p.tz * (1 + kick),
          yaw * gth,
          pitch * gth
        );
        var e = ease(gth);
        var x = spot.x + Math.sin(t * 1.5 + p.ang) * 10 * fall;
        var y = spot.y + fall * ((mark.cy - ring.cy) * 0.85 + p.seed * 36);
        x = x + (tgt.x - x) * e;
        y = y + (tgt.y - y) * e;
        var radius = glow ? tgt.s * 2.6 : tgt.s * (0.95 + kick);
        var alpha = (glow ? 0.045 : 0.42 + e * 0.5) * born + (glow ? 0 : burst * 0.25);
        ctx.fillStyle = "rgba(" + (glow ? 190 : Math.round(230 + burst * 25)) + "," + (glow ? 255 : 250) + "," + (glow ? 220 : 236) + "," + alpha + ")";
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, 6.2832);
        ctx.fill();
        if (!glow && fall > 0.08 && gth < 0.7) {
          ctx.fillRect(x, y, 1.2, (1 - gth) * 14);
        }
      }

      function frame(now) {
        var t = elapsed();
        fade(t);
        if (!ctx) return;
        resize();
        layout();
        var idle = reduce ? 0 : Math.sin(now / 1600) * 0.22;
        var aimYaw = (pointer.x - mark.cx / Math.max(view.w, 1)) * 1.5 + idle;
        var aimPitch = (pointer.y - mark.cy / Math.max(view.h, 1)) * 0.75;
        var follow = reduce ? 1 : 0.08;
        yaw += (aimYaw - yaw) * follow;
        pitch += (aimPitch - pitch) * follow;
        pointer.energy *= reduce ? 0 : 0.94;
        ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        drawRoom(t);
        drawRing(t);
        ctx.globalCompositeOperation = "lighter";
        var burst = pointer.energy;
        var i;
        for (i = 0; i < parts.length; i++) drawParticle(parts[i], t, 0, burst, true);
        for (i = 0; i < parts.length; i++) drawParticle(parts[i], t, 0, burst, false);
        ctx.globalCompositeOperation = "source-over";
        drawPodium();
        requestAnimationFrame(frame);
      }

      function setSystem(n) {
        system = ((n - 1) % 7 + 7) % 7 + 1;
        var label = system < 10 ? "0" + system : String(system);
        document.getElementById("fraction").textContent = label + "/07";
        document.getElementById("kicker").textContent = "SYSTEM " + label + " / CORE";
        document.getElementById("live").textContent = "System " + label + " of 07";
      }

      function replay() {
        if (reduce) return;
        root.classList.remove("in-nav", "in-copy", "in-chrome");
        origin = performance.now();
        pointer.energy = 0;
        armFailsafe();
      }

      function flare() { if (!reduce) pointer.energy = 1; }

      stage.addEventListener("pointermove", function (e) {
        var rect = stage.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var nx = x / Math.max(1, rect.width);
        var ny = y / Math.max(1, rect.height);
        pointer.speed = Math.hypot(nx - pointer.x, ny - pointer.y) * 50;
        pointer.x = nx;
        pointer.y = ny;
        var near = Math.hypot(x - mark.cx, y - mark.cy) < Math.min(rect.width, rect.height) * 0.18;
        if (near && pointer.speed > 0.4 && elapsed() > 3.1) pointer.energy = Math.min(1, pointer.energy + 0.55);
      });

      document.getElementById("replay").addEventListener("click", replay);
      document.getElementById("explore").addEventListener("click", flare);
      document.getElementById("view-system").addEventListener("click", flare);
      document.getElementById("prev").addEventListener("click", function () { setSystem(system - 1); });
      document.getElementById("next").addEventListener("click", function () { setSystem(system + 1); });
      Array.prototype.forEach.call(document.querySelectorAll(".menu button"), function (button) {
        button.addEventListener("click", function () {
          Array.prototype.forEach.call(document.querySelectorAll(".menu button"), function (other) {
            other.removeAttribute("aria-current");
          });
          button.setAttribute("aria-current", "true");
          document.getElementById("live").textContent = button.textContent;
        });
      });

      if (reduce) {
        root.style.setProperty("--nav-a", "1");
        root.style.setProperty("--copy-a", "1");
        root.style.setProperty("--chrome-a", "1");
        root.classList.add("in-nav", "in-copy", "in-chrome");
      } else armFailsafe();
      if (ctx) {
        build();
        resize();
        window.addEventListener("resize", resize);
        requestAnimationFrame(frame);
      }
    })();
  </script>
</body>
</html>
