<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>等高线球切换项目</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; max-width: 100%; }
    body {
      min-height: 100%;
      overflow-x: hidden;
      background: linear-gradient(180deg, #fffbf6 0%, #ffe2c4 100%);
      color: #17191d;
      font: 16px/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 22px 16px 32px;
      min-width: 0;
    }
    .hint {
      margin: 0 0 8px;
      color: #5c6168;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .board {
      display: grid;
      grid-template-columns: minmax(0, 220px) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .names {
      position: relative;
      height: 280px;
      min-width: 0;
    }
    .name {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      margin: 0;
      padding: 6px 8px;
      border: 0;
      background: transparent;
      color: #17191d;
      text-align: left;
      cursor: pointer;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .name:focus, .ball:focus { outline: none; }
    .name:focus-visible {
      outline: 3px solid #14213d;
      outline-offset: 3px;
      border-radius: 10px;
    }
    .ball:focus-visible::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 43%;
      width: 88%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      box-shadow: 0 0 0 3px #14213d;
      pointer-events: none;
    }
    .ball {
      position: relative;
      display: block;
      width: min(100%, 640px);
      margin-inline: auto;
      aspect-ratio: 5 / 5.35;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 720px) {
      .wrap { padding: 12px 10px 24px; }
      .board { grid-template-columns: minmax(0, 1fr); }
      .names { height: 184px; }
      .ball { aspect-ratio: 5 / 4.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="hint" id="hint">点球体到下一项，或点左侧名字。左右方向键走同一段形变。</p>
    <div class="board">
      <div class="names" role="radiogroup" aria-label="项目" aria-describedby="hint">
        <button type="button" class="name" role="radio" id="project-0" aria-checked="true" tabindex="0">澄湾记录</button>
        <button type="button" class="name" role="radio" id="project-1" aria-checked="false" tabindex="-1">霜岭样本</button>
        <button type="button" class="name" role="radio" id="project-2" aria-checked="false" tabindex="-1">暖丘手稿</button>
      </div>
      <button type="button" class="ball" id="ball" aria-label="切换到霜岭样本">
        <canvas id="stage" width="640" height="680" aria-hidden="true"></canvas>
      </button>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var PROJECTS = [
        {
          name: "澄湾记录",
          ink: [24, 42, 128],
          top: [255, 251, 246],
          bot: [255, 226, 196],
          shape: [1.12, 3.5, 0.35, 0.2, 0.2, 2, 0.45, 0, 0, 1, 0, 1]
        },
        {
          name: "霜岭样本",
          ink: [14, 98, 80],
          top: [245, 252, 248],
          bot: [214, 236, 222],
          shape: [1.18, 4.9, 0.9, 1.2, 0.14, 3, 1.05, 0, 0, 1, 0, 1]
        },
        {
          name: "暖丘手稿",
          ink: [28, 64, 150],
          top: [246, 248, 252],
          bot: [214, 224, 242],
          shape: [1.12, 3.3, 1.8, -0.62, 0.48, 2, 0.7, 0, 0, 1, 0, 1]
        }
      ];
      var N = PROJECTS.length;
      var NU = 132;
      var NV = 70;
      var GW = NU + 1;
      var GH = NV + 1;
      var TILT = 0.46;
      var COS = Math.cos(TILT);
      var SIN = Math.sin(TILT);
      var CASE = [
        [],
        [3, 0],
        [0, 1],
        [3, 1],
        [1, 2],
        [3, 0, 1, 2],
        [0, 2],
        [3, 2],
        [2, 3],
        [0, 2],
        [0, 1, 2, 3],
        [1, 2],
        [1, 3],
        [0, 1],
        [0, 3],
        []
      ];
      var VAL = new Float32Array(GW * GH);
      var OX = new Float32Array(GW * GH);
      var OY = new Float32Array(GW * GH);
      var OZ = new Float32Array(GW * GH);
      var X = new Float32Array(GW * GH);
      var Y = new Float32Array(GW * GH);
      var Z = new Float32Array(GW * GH);
      var lines = [];
      var lineN = 0;
      var E = new Float32Array(6);
      var MAXSEG = NU * NV * 16;
      var linkNext = new Int32Array(MAXSEG);
      var linkPrev = new Int32Array(MAXSEG);
      var seen = new Uint8Array(MAXSEG);
      (function initGrid() {
        var v, u, i, phi, theta, sp, cp, x, y, z;
        for (v = 0; v < GH; v++) {
          phi = v / NV * Math.PI;
          sp = Math.sin(phi);
          cp = Math.cos(phi);
          for (u = 0; u < GW; u++) {
            theta = u / NU * Math.PI * 2;
            x = sp * Math.cos(theta);
            y = cp;
            z = sp * Math.sin(theta);
            i = v * GW + u;
            OX[i] = x;
            OY[i] = y;
            OZ[i] = z;
            X[i] = x;
            Y[i] = y * COS - z * SIN;
            Z[i] = y * SIN + z * COS;
          }
        }
      })();
      var metrics = { row: 86, base: 32 };
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var canvas = document.getElementById("stage");
      var ctx = canvas.getContext("2d");
      var namesEl = document.querySelector(".names");
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".name"));
      var ball = document.getElementById("ball");
      var live = document.getElementById("live");
      var progress = 0;
      var target = 0;
      var raf = 0;
      var gen = 0;
      var dpr = 1;

      function reduced() { return motion.matches; }

      function mod(a, n) { return ((a % n) + n) % n; }

      function smoother(t) {
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        return t * t * (3 - 2 * t);
      }

      function ease(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function mix(a, b, t) {
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      }

      function rgb(c) {
        return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
      }

      function rgba(c, a) {
        return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")";
      }

      function mixShape(a, b, t) {
        var out = new Array(12);
        var i;
        for (i = 0; i < 12; i++) out[i] = a[i] + (b[i] - a[i]) * t;
        var len = Math.hypot(out[7], out[8], out[9]) || 1;
        out[7] /= len;
        out[8] /= len;
        out[9] /= len;
        return out;
      }

      function circ(i, p) {
        var d = i - mod(p, N);
        if (d > N / 2) d -= N;
        else if (d < -N / 2) d += N;
        return d;
      }

      function toward(index) {
        var cur = mod(target, N);
        var delta = index - cur;
        if (delta > N / 2) delta -= N;
        if (delta < -N / 2) delta += N;
        return target + delta;
      }

      function stop() {
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
        gen += 1;
        return gen;
      }

      function putEdge(iA, iB, level, o) {
        var va = VAL[iA];
        var vb = VAL[iB];
        var t = va === vb ? 0.5 : (level - va) / (vb - va);
        if (t < 0) t = 0;
        else if (t > 1) t = 1;
        E[o] = X[iA] + (X[iB] - X[iA]) * t;
        E[o + 1] = Y[iA] + (Y[iB] - Y[iA]) * t;
        E[o + 2] = Z[iA] + (Z[iB] - Z[iA]) * t;
      }

      var SADDLE_A = [0, 1, 2, 3];
      var SADDLE_B = [3, 0, 1, 2];

      function putNamedEdge(edge, i00, i10, i01, i11, level, o) {
        var iA, iB;
        if (edge === 0) { iA = i00; iB = i10; }
        else if (edge === 1) { iA = i10; iB = i11; }
        else if (edge === 2) { iA = i11; iB = i01; }
        else { iA = i01; iB = i00; }
        putEdge(iA, iB, level, o);
      }

      function addClipped(cx, cy, R, scaleX, scaleY) {
        var ax = E[0], ay = E[1], az = E[2];
        var bx = E[3], by = E[4], bz = E[5];
        var t, mx, my;
        if (az < -0.03 && bz < -0.03) return;
        if (az < -0.03 || bz < -0.03) {
          t = (az + 0.03) / (az - bz);
          mx = ax + (bx - ax) * t;
          my = ay + (by - ay) * t;
          if (az < -0.03) { ax = mx; ay = my; az = -0.03; }
          else { bx = mx; by = my; bz = -0.03; }
        }
        if (lineN / 4 >= MAXSEG) return;
        var pa = 1 / (1 - az * 0.26);
        var pb = 1 / (1 - bz * 0.26);
        var o = lineN;
        lines[o] = cx + ax * R * scaleX * pa;
        lines[o + 1] = cy - ay * R * scaleY * pa;
        lines[o + 2] = cx + bx * R * scaleX * pb;
        lines[o + 3] = cy - by * R * scaleY * pb;
        lineN = o + 4;
      }

      function buildLines(shape, cx, cy, R, scaleX, scaleY) {
        var min = Infinity;
        var max = -Infinity;
        var count = GW * GH;
        var ct = Math.cos(shape[3]);
        var st = Math.sin(shape[3]);
        var amp = shape[0], freq = shape[1], phase = shape[2];
        var wAmp = shape[4], wFreq = shape[5], wPhase = shape[6];
        var px = shape[7], py = shape[8], pz = shape[9], pw = shape[10], ps = shape[11];
        var i, x, y, z, along, across, h, dx, dy, dz;
        for (i = 0; i < count; i++) {
          x = OX[i];
          y = OY[i];
          z = OZ[i];
          along = y * ct + x * st;
          across = x * ct - y * st;
          h = amp * Math.sin(freq * along + phase + 0.7 * Math.sin(2.2 * across + phase));
          h += wAmp * Math.sin(wFreq * Math.atan2(z, x) + wPhase * y);
          if (pw > 0.001) {
            dx = x - px;
            dy = y - py;
            dz = z - pz;
            h += pw * Math.exp(-(dx * dx + dy * dy + dz * dz) * ps);
          }
          VAL[i] = h;
          if (h < min) min = h;
          if (h > max) max = h;
        }
        lineN = 0;
        if (!(max > min)) return;
        var levels = 8;
        var lo = min + (max - min) * 0.07;
        var hi = max - (max - min) * 0.05;
        var step = (hi - lo) / (levels - 1);
        var lv, v, u, i00, i10, i01, i11, bits, edges, e, center, a, b;
        for (lv = 0; lv < levels; lv++) {
          h = lo + step * lv;
          for (v = 0; v < NV; v++) {
            for (u = 0; u < NU; u++) {
              i00 = v * GW + u;
              i10 = i00 + 1;
              i01 = i00 + GW;
              i11 = i01 + 1;
              if (Z[i00] < -0.03 && Z[i10] < -0.03 && Z[i11] < -0.03 && Z[i01] < -0.03) continue;
              bits = 0;
              if (VAL[i00] >= h) bits |= 1;
              if (VAL[i10] >= h) bits |= 2;
              if (VAL[i11] >= h) bits |= 4;
              if (VAL[i01] >= h) bits |= 8;
              if (bits === 0 || bits === 15) continue;
              edges = CASE[bits];
              if (bits === 5 || bits === 10) {
                center = (VAL[i00] + VAL[i10] + VAL[i11] + VAL[i01]) * 0.25;
                if ((bits === 5 && center < h) || (bits === 10 && center >= h)) edges = SADDLE_A;
                else edges = SADDLE_B;
              }
              for (e = 0; e < edges.length; e += 2) {
                putNamedEdge(edges[e], i00, i10, i01, i11, h, 0);
                putNamedEdge(edges[e + 1], i00, i10, i01, i11, h, 3);
                addClipped(cx, cy, R, scaleX, scaleY);
              }
            }
          }
        }
        chainLines();
      }

      function chainLines() {
        var n = lineN / 4;
        var ends = new Map();
        var i, ks, ke, pred;
        for (i = 0; i < n; i++) {
          linkNext[i] = -1;
          linkPrev[i] = -1;
        }
        for (i = 0; i < n; i++) {
          ks = ((lines[i * 4] * 32 + 0.5) | 0) + "," + ((lines[i * 4 + 1] * 32 + 0.5) | 0);
          ke = ((lines[i * 4 + 2] * 32 + 0.5) | 0) + "," + ((lines[i * 4 + 3] * 32 + 0.5) | 0);
          pred = ends.get(ks);
          if (pred !== undefined && linkNext[pred] < 0 && pred !== i) {
            linkNext[pred] = i;
            linkPrev[i] = pred;
            ends.delete(ks);
          }
          ends.set(ke, i);
        }
      }

      function strokeLines() {
        var n = lineN / 4;
        var i, cur, guard;
        seen.fill(0, 0, n);
        ctx.beginPath();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        for (i = 0; i < n; i++) {
          if (seen[i] || linkPrev[i] >= 0) continue;
          cur = i;
          ctx.moveTo(lines[cur * 4], lines[cur * 4 + 1]);
          guard = 0;
          while (cur >= 0 && !seen[cur] && guard++ <= n) {
            seen[cur] = 1;
            ctx.lineTo(lines[cur * 4 + 2], lines[cur * 4 + 3]);
            cur = linkNext[cur];
          }
        }
        for (i = 0; i < n; i++) {
          if (seen[i]) continue;
          cur = i;
          ctx.moveTo(lines[cur * 4], lines[cur * 4 + 1]);
          guard = 0;
          while (cur >= 0 && !seen[cur] && guard++ <= n) {
            seen[cur] = 1;
            ctx.lineTo(lines[cur * 4 + 2], lines[cur * 4 + 3]);
            cur = linkNext[cur];
          }
        }
        ctx.stroke();
      }

      function paintNames(p) {
        var i, d, ad, emphasis, opacity, size;
        for (i = 0; i < N; i++) {
          d = circ(i, p);
          ad = Math.abs(d);
          emphasis = Math.max(0, 1 - ad);
          opacity = ad > 1.4 ? 0 : 0.18 + 0.82 * emphasis;
          size = metrics.base * (0.64 + 0.36 * emphasis);
          buttons[i].style.transform = "translateY(calc(-50% + " + (d * metrics.row).toFixed(2) + "px))";
          buttons[i].style.opacity = opacity.toFixed(3);
          buttons[i].style.fontSize = size.toFixed(2) + "px";
          buttons[i].style.fontWeight = String(Math.round(500 + 260 * emphasis));
          buttons[i].style.color = rgb(mix([138, 144, 152], [23, 25, 29], emphasis));
          buttons[i].style.zIndex = String(Math.round(emphasis * 10));
          buttons[i].style.pointerEvents = opacity < 0.04 ? "none" : "auto";
        }
      }

      function syncSelection() {
        var idx = mod(target, N);
        var i;
        for (i = 0; i < N; i++) {
          var on = i === idx;
          buttons[i].setAttribute("aria-checked", on ? "true" : "false");
          buttons[i].tabIndex = on ? 0 : -1;
        }
        ball.setAttribute("aria-label", "切换到" + PROJECTS[mod(target + 1, N)].name);
      }

      function announce() {
        live.textContent = "当前是" + PROJECTS[mod(target, N)].name + "。";
      }

      function paint() {
        syncSelection();
        var base = Math.floor(progress);
        var frac = progress - base;
        var pinch = Math.sin(Math.PI * frac);
        var blend = smoother((frac - 0.3) / 0.4);
        var from = PROJECTS[mod(base, N)];
        var to = PROJECTS[mod(base + 1, N)];
        var shape = mixShape(from.shape, to.shape, blend);
        var ink = mix(from.ink, to.ink, blend);
        var top = mix(from.top, to.top, blend);
        var bot = mix(to.bot, from.bot, 1 - blend);
        var scaleX = 0.07 + 0.93 * (1 - pinch);
        var scaleY = 1 + 0.07 * pinch;
        document.body.style.background = "linear-gradient(180deg," + rgb(top) + "," + rgb(bot) + ")";
        paintNames(progress);
        if (!ctx) return;
        var cssW = canvas.width / dpr;
        var cssH = canvas.height / dpr;
        if (cssW < 2 || cssH < 2) return;
        var R = Math.min(cssW * 0.46, cssH * 0.4);
        var cx = cssW * 0.5;
        var cy = cssH * 0.43;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssW, cssH);
        ctx.save();
        ctx.translate(cx, cy + R * 0.9);
        ctx.scale(Math.max(0.12, scaleX) * 0.95, 0.16);
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(48, 56, 78, 0.15)";
        ctx.filter = "blur(12px)";
        ctx.fill();
        ctx.filter = "none";
        ctx.restore();

        buildLines(shape, cx, cy, R, scaleX, scaleY);
        var pivot = cy + R * scaleY * 0.98;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, pivot - 2, cssW, cssH);
        ctx.clip();
        ctx.translate(0, pivot);
        ctx.scale(1, -0.32);
        ctx.translate(0, -pivot);
        ctx.globalAlpha = 0.14;
        ctx.lineWidth = 1.35;
        ctx.lineCap = "round";
        ctx.strokeStyle = rgba(ink, 0.9);
        strokeLines();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(0.6, R * scaleX), Math.max(0.6, R * scaleY), 0, 0, Math.PI * 2);
        var body = ctx.createRadialGradient(cx - R * 0.28 * scaleX, cy - R * 0.34, R * 0.08, cx + R * 0.1 * scaleX, cy + R * 0.12, R * 1.05);
        body.addColorStop(0, "rgba(255,255,255,0.98)");
        body.addColorStop(0.55, "rgba(255,255,255,0.9)");
        body.addColorStop(1, rgba(mix(ink, [255, 255, 255], 0.82), 0.95));
        ctx.fillStyle = body;
        ctx.fill();
        var shade = ctx.createRadialGradient(cx + R * 0.42 * scaleX, cy + R * 0.4, R * 0.05, cx, cy, R);
        shade.addColorStop(0, rgba(ink, 0.16));
        shade.addColorStop(1, rgba(ink, 0));
        ctx.fillStyle = shade;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(0.6, R * scaleX) + 1.4, Math.max(0.6, R * scaleY) + 1.4, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.globalAlpha = 1;
        ctx.lineWidth = Math.max(1.15, R * 0.0125);
        ctx.lineCap = "round";
        ctx.strokeStyle = rgb(ink);
        strokeLines();
        ctx.restore();

        ctx.beginPath();
        ctx.ellipse(cx, cy, R * scaleX, R * scaleY, 0, 0, Math.PI * 2);
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = rgba(ink, 0.35);
        ctx.stroke();
      }

      function seek(next) {
        next = Math.round(next);
        var changed = next !== target;
        target = next;
        if (changed) announce();
        if (reduced()) {
          stop();
          progress = target;
          paint();
          return;
        }
        var from = progress;
        var to = target;
        var id = stop();
        if (from === to) {
          paint();
          return;
        }
        var t0 = performance.now();
        var dur = 1080 * Math.min(N, Math.abs(to - from));
        function frame(now) {
          if (id !== gen) return;
          var t = Math.min(1, (now - t0) / dur);
          progress = from + (to - from) * ease(t);
          paint();
          if (t < 1) raf = requestAnimationFrame(frame);
          else {
            raf = 0;
            progress = to;
            paint();
          }
        }
        raf = requestAnimationFrame(frame);
      }

      function push(delta) { seek(target + delta); }

      function focusIndex(index) {
        var btn = buttons[mod(index, N)];
        if (!btn) return;
        try { btn.focus({ preventScroll: true }); }
        catch (err) { btn.focus(); }
      }

      function onKey(e, fromBall) {
        var dir = 0;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") dir = 1;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") dir = -1;
        else if (e.key === "Home") {
          e.preventDefault();
          seek(toward(0));
          if (!fromBall) focusIndex(0);
          return;
        } else if (e.key === "End") {
          e.preventDefault();
          seek(toward(N - 1));
          if (!fromBall) focusIndex(N - 1);
          return;
        }
        if (!dir) return;
        e.preventDefault();
        push(dir);
        if (!fromBall) focusIndex(target);
      }

      buttons.forEach(function (btn, i) {
        btn.addEventListener("click", function () { seek(toward(i)); });
      });
      namesEl.addEventListener("keydown", function (e) { onKey(e, false); });
      ball.addEventListener("click", function () { push(1); });
      ball.addEventListener("keydown", function (e) { onKey(e, true); });

      function onReduce() {
        stop();
        if (reduced()) progress = target;
        paint();
      }
      if (motion.addEventListener) motion.addEventListener("change", onReduce);
      else if (motion.addListener) motion.addListener(onReduce);

      function layout() {
        var rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(1, Math.round(rect.width * dpr));
        var h = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        if (namesEl.clientHeight > 0 && namesEl.clientWidth > 0) {
          var nh = namesEl.clientHeight;
          var nw = namesEl.clientWidth;
          metrics.base = Math.max(18, Math.min(34, Math.min(nw * 0.15, nh * 0.16)));
          metrics.row = Math.max(metrics.base * 1.9, nh * 0.3);
        }
        paint();
      }

      window.addEventListener("resize", layout);
      window.addEventListener("load", layout);
      layout();
    })();
  </script>
</body>
</html>
