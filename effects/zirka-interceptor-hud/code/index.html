<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIRKA interceptor HUD</title>
  <style>
    :root {
      --bg: #07080b;
      --ink: #f3f1ee;
      --muted: rgba(243, 241, 238, 0.62);
      --faint: rgba(243, 241, 238, 0.38);
      --coral: #ff5a3c;
      --line: rgba(243, 241, 238, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .stage {
      min-height: 100%;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 58% 46%, rgba(255, 255, 255, 0.055), transparent 36%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, 0.72), transparent 46%),
        var(--bg);
    }
    .craft {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(86vw, 920px);
      height: auto;
      transform: translate(-50%, -50%);
      transform-origin: 62% 50%;
      pointer-events: none;
    }
    .ring {
      position: absolute;
      left: 50%;
      top: 42%;
      width: min(52vmin, 420px);
      height: min(52vmin, 420px);
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
    }
    .hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 22px 28px 72px;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 22px;
      min-height: 36px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.22em;
      font-size: 12px;
      font-weight: 650;
    }
    .brand svg { display: block; }
    .links {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .swatch {
      width: 28px;
      height: 8px;
      background: var(--coral);
      flex: none;
    }
    .aside {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .lang { color: var(--faint); }
    .contact {
      border: 1px solid var(--line);
      padding: 6px 10px;
      color: var(--muted);
    }
    .sides {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(88px, 1fr) auto minmax(88px, 1fr);
      align-items: center;
      gap: 8px;
    }
    .label, .index {
      font-size: 15px;
      letter-spacing: 0.04em;
      font-weight: 520;
    }
    .index { text-align: right; color: var(--muted); }
    .readout {
      position: relative;
      min-width: min(64vw, 420px);
      text-align: center;
    }
    .tick {
      position: absolute;
      left: 50%;
      top: 8%;
      width: 1px;
      height: 46px;
      background: var(--coral);
      opacity: 0;
      transform: translateX(-50%);
    }
    .num {
      font-size: clamp(84px, 15vw, 156px);
      line-height: 0.86;
      font-weight: 560;
      letter-spacing: -0.045em;
      color: var(--coral);
      font-variant-numeric: tabular-nums;
    }
    .unit {
      min-height: 1.2em;
      margin-top: 8px;
      color: var(--faint);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: lowercase;
    }
    .replay {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 8px 14px;
      font: 600 13px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .replay:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 3px;
    }
    @media (max-width: 720px) {
      .hud { padding: 16px 16px 68px; }
      .links, .swatch, .lang { display: none; }
      .sides {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        align-self: center;
      }
      .readout { grid-column: 1 / -1; grid-row: 1; min-width: 0; }
      .label { grid-row: 2; }
      .index { grid-row: 2; }
      .num { font-size: 92px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .replay { display: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg class="craft" id="craft" viewBox="0 0 900 520" aria-hidden="true">
      <g fill="#14171c" stroke="#3c424c" stroke-width="2" stroke-linejoin="round">
        <path d="M280 268 L455 78 L590 132 L500 270 Z"></path>
        <path d="M280 286 L455 476 L590 422 L500 284 Z"></path>
        <path d="M168 278 C250 214 470 206 700 236 L778 268 L700 300 C470 328 250 322 168 278 Z"></path>
        <path d="M196 270 L132 176 L188 206 L236 262 Z"></path>
        <path d="M196 292 L140 392 L194 354 L236 300 Z"></path>
      </g>
      <path d="M520 242 C558 214 630 214 678 244" fill="none" stroke="#8d93a0" stroke-width="3"></path>
      <path d="M760 258 L836 248" stroke="#ff5a3c" stroke-width="3"></path>
      <circle cx="778" cy="268" r="3.5" fill="#ff5a3c"></circle>
    </svg>
    <div class="hud">
      <header class="bar">
        <div class="brand">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0 L9.4 6.6 L16 8 L9.4 9.4 L8 16 L6.6 9.4 L0 8 L6.6 6.6 Z" fill="#f3f1ee"></path>
          </svg>
          <span>ZIRKA</span>
        </div>
        <nav class="links" aria-label="Sections">
          <span>Threat</span>
          <span>Features</span>
          <span>Effectiveness</span>
          <span>System</span>
        </nav>
        <span class="swatch" aria-hidden="true"></span>
        <div class="aside">
          <span class="lang">EN</span>
          <span class="contact">Contact</span>
        </div>
      </header>
      <div class="sides">
        <div class="label" id="label">Max speed</div>
        <div class="readout">
          <svg class="ring" id="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(243,241,238,0.72)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.15 6.4"></circle>
            <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(243,241,238,0.28)" stroke-width="1" stroke-dasharray="1 10"></circle>
          </svg>
          <div class="tick" id="tick"></div>
          <div class="num" id="num">224</div>
          <div class="unit" id="unit">km/h</div>
        </div>
        <div class="index" id="index">001</div>
      </div>
    </div>
    <button class="replay" id="replay" type="button">再看一次</button>
  </main>
  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      var numEl = document.getElementById("num");
      var unitEl = document.getElementById("unit");
      var labelEl = document.getElementById("label");
      var indexEl = document.getElementById("index");
      var ring = document.getElementById("ring");
      var craft = document.getElementById("craft");
      var tick = document.getElementById("tick");
      var CYCLE = 9200;
      var start = performance.now();

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function smooth(t) {
        t = clamp(t, 0, 1);
        return t * t * (3 - 2 * t);
      }

      function render(now) {
        var elapsed = reduce.matches ? 3050 : (now - start) % CYCLE;
        var speedT = smooth(clamp((elapsed - 150) / 2900, 0, 1));
        var flightT = clamp((elapsed - 3700) / 4300, 0, 1);
        var cross = elapsed >= 3400 && elapsed < 3750;
        var crossU = cross ? (elapsed - 3400) / 350 : 0;
        var inFlight = elapsed >= 3575;
        var value = inFlight ? Math.round(lerp(14, 24, flightT)) : Math.round(lerp(224, 340, speedT));
        var ringP = inFlight ? 0 : clamp((speedT - 0.32) / 0.68, 0, 1);
        if (elapsed >= 3200 && elapsed < 3575) ringP = 1 - clamp((elapsed - 3200) / 375, 0, 1);

        numEl.textContent = String(value);
        numEl.style.opacity = cross ? String(crossU < 0.5 ? 1 - crossU * 2 : (crossU - 0.5) * 2) : "1";
        labelEl.textContent = inFlight ? "Flight time" : "Max speed";
        unitEl.textContent = inFlight ? "" : "km/h";
        indexEl.textContent = inFlight ? "002" : "001";
        ring.style.opacity = String(ringP);
        ring.style.transform = "translate(-50%, -50%) scale(" + lerp(0.86, 1, ringP) + ")";
        tick.style.opacity = elapsed > 3300 && elapsed < 4100 ? "0.9" : "0";

        var push = inFlight ? flightT : 0;
        craft.style.transform = "translate(calc(-50% + " + lerp(0, 4, push) + "%), calc(-50% + " + lerp(0, 2, push) + "%)) scale(" + lerp(1, 1.18, push) + ") rotate(" + lerp(-8, 4, push) + "deg)";
        if (!reduce.matches) requestAnimationFrame(render);
      }

      document.getElementById("replay").addEventListener("click", function () {
        start = performance.now();
        if (reduce.matches) render(start);
      });
      render(performance.now());
    })();
  </script>
</body>
</html>
