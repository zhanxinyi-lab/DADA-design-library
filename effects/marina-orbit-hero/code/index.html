<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>budarina</title>
  <style>
    :root { --bg: #050505; --title: #f4f0ea; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--title);
      overflow: hidden;
      font-family: Georgia, 'Times New Roman', serif;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .top {
      position: absolute;
      top: 22px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      font-family: Inter, Helvetica, Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      z-index: 2;
    }
    .links { display: flex; gap: 10px; opacity: 0.85; }
    .hero {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
      pointer-events: none;
    }
    .hero h1 {
      font-size: clamp(64px, 14vw, 168px);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.85;
      text-align: center;
    }
    .home {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 2;
      font-family: Inter, Helvetica, Arial, sans-serif;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #f4f0ea;
      color: #111;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="top">
    <div id="name"></div>
    <div class="links" id="links"></div>
  </div>
  <div class="hero"><h1 id="hero"></h1></div>
  <div class="home" id="home"></div>
  <script>
    // 改这里即可换品牌
    const BRAND = {
      name: 'budarina',
      hero: 'Gift Card',
      links: ['contact', 'buy', 'edit'],
      home: 'home',
      bg: '#050505',
      title: '#f4f0ea',
      petals: ['#e23b3b', '#f2a0c0', '#f0c43a', '#e86a2a', '#2f7a32']
    };

    (function () {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.title = BRAND.name;
      document.body.style.background = BRAND.bg;
      document.documentElement.style.setProperty('--bg', BRAND.bg);
      document.documentElement.style.setProperty('--title', BRAND.title);
      document.getElementById('name').textContent = BRAND.name;
      document.getElementById('hero').textContent = BRAND.hero;
      document.getElementById('home').textContent = BRAND.home;
      const links = document.getElementById('links');
      BRAND.links.forEach(function (label, i) {
        if (i) links.appendChild(document.createTextNode(' / '));
        const s = document.createElement('span');
        s.textContent = label;
        links.appendChild(s);
      });

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let mx = 0, my = 0;
      addEventListener('pointermove', function (e) {
        mx = (e.clientX / innerWidth - 0.5) * 30;
        my = (e.clientY / innerHeight - 0.5) * 18;
      });

      const flowers = [];
      for (let i = 0; i < 8; i++) {
        flowers.push({
          r: 90 + i * 28,
          a: i * 0.8,
          s: (0.004 + i * 0.0012) * (i % 2 ? 1 : -1),
          scale: 0.55 + (i % 3) * 0.22,
          color: BRAND.petals[i % BRAND.petals.length],
          stem: BRAND.petals[4],
          z: i
        });
      }
      flowers[2].r = 70;
      flowers[2].scale = 1.05;

      function flower(x, y, scale, color, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.strokeStyle = BRAND.petals[4];
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.moveTo(0, 18 * scale);
        ctx.quadraticCurveTo(6 * scale, 80 * scale, 0, 160 * scale);
        ctx.stroke();
        for (let p = 0; p < 6; p++) {
          ctx.save();
          ctx.rotate((p / 6) * Math.PI * 2);
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.ellipse(0, -22 * scale, 16 * scale, 28 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = '#f6e27a';
        ctx.beginPath();
        ctx.arc(0, 0, 10 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1208';
        ctx.beginPath();
        ctx.arc(0, 0, 4 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function butterfly(x, y, t) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t) * 0.4);
        ctx.fillStyle = '#c45aa0';
        ctx.beginPath();
        ctx.ellipse(-8, 0, 10, 6, -0.4, 0, Math.PI * 2);
        ctx.ellipse(8, 0, 10, 6, 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f0c43a';
        ctx.beginPath();
        ctx.ellipse(-6, 8, 7, 4, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function resize() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      addEventListener('resize', resize);

      let t0 = performance.now();
      function tick(now) {
        const t = (now - t0) / (reduced ? 4000 : 1000);
        ctx.fillStyle = BRAND.bg;
        ctx.fillRect(0, 0, innerWidth, innerHeight);
        const cx = innerWidth / 2 + mx;
        const cy = innerHeight / 2 + 20 + my;
        flowers.forEach(function (f) {
          const ang = f.a + t * f.s * 60;
          const x = cx + Math.cos(ang) * f.r;
          const y = cy + Math.sin(ang) * f.r * 0.42 + 40;
          flower(x, y, f.scale, f.color, ang);
        });
        butterfly(cx + Math.cos(t * 0.7) * 160, cy - 90 + Math.sin(t * 0.9) * 30, t * 3);
        butterfly(cx + Math.cos(t * 0.5 + 2) * 200, cy - 40 + Math.sin(t * 0.6) * 40, t * 2.2);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
