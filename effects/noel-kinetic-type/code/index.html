<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOEL</title>
  <style>
    :root { --bg: #e7e7e7; --ink: #111111; --bubble: #111111; --bubble-text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: Helvetica, Arial, system-ui, sans-serif;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }
    .set {
      position: absolute;
      left: 50%;
      top: 54%;
      width: min(520px, 86vw);
      height: min(280px, 42vh);
      transform: translate(-50%, -50%);
    }
    .ottoman {
      position: absolute;
      left: 8%;
      bottom: 18%;
      width: 34%;
      height: 38%;
      background: #5a3d32;
      border-radius: 10px 10px 6px 6px;
      box-shadow: 10px 14px 0 #3d2a22;
    }
    .chair {
      position: absolute;
      right: 18%;
      bottom: 16%;
      width: 22%;
      height: 52%;
    }
    .chair .seat { position: absolute; bottom: 28%; left: 8%; right: 8%; height: 18%; background: #f4f4f4; border-radius: 6px; }
    .chair .back { position: absolute; top: 0; left: 12%; right: 12%; height: 58%; background: #f7f7f7; border-radius: 8px; }
    .chair .leg { position: absolute; bottom: 0; width: 8%; height: 32%; background: #ececec; }
    .chair .leg.l { left: 16%; }
    .chair .leg.r { right: 16%; }
    .cloth {
      position: absolute;
      right: 6%;
      bottom: 12%;
      width: 18%;
      height: 22%;
      background: #2a62d4;
      transform: skewX(-12deg);
    }
    .bust {
      position: absolute;
      left: 4%;
      bottom: 0;
      width: 70px;
      height: 90px;
      background: #d8d2c8;
      border-radius: 40px 40px 18px 18px;
    }
    .bust:after {
      content: '';
      position: absolute;
      left: 16px; top: 10px;
      width: 38px; height: 42px;
      background: #eee8de;
      border-radius: 50%;
    }
    .crt {
      position: absolute;
      right: 2%;
      bottom: 0;
      width: 110px;
      height: 72px;
      background: #6a6a6a;
      border: 8px solid #2b2b2b;
    }
    .crt i {
      display: block;
      height: 100%;
      background: repeating-linear-gradient(#8fd, #8fd 2px, #3a3 2px, #3a3 4px);
      opacity: 0.7;
    }
    .word {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--ink);
      text-align: center;
      white-space: nowrap;
      transform-origin: center;
      pointer-events: none;
    }
    .bubble {
      position: absolute;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      background: var(--bubble);
      color: var(--bubble-text);
      font-weight: 800;
      font-size: clamp(22px, 4vw, 42px);
      padding: 18px 28px;
      clip-path: polygon(0 0, 100% 0, 100% 78%, 62% 78%, 54% 100%, 50% 78%, 0 78%);
      display: none;
    }
    .select {
      position: absolute;
      border: 2px solid #2f6dff;
      box-shadow: 0 0 0 1px #fff inset;
      display: none;
      pointer-events: none;
    }
    .brand {
      position: absolute;
      left: 16px;
      bottom: 12px;
      font-size: 11px;
      letter-spacing: 0.28em;
      color: #888;
    }
    @media (prefers-reduced-motion: reduce) {
      .word, .bubble { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="set">
      <div class="ottoman"></div>
      <div class="chair"><div class="back"></div><div class="seat"></div><div class="leg l"></div><div class="leg r"></div></div>
      <div class="cloth"></div>
    </div>
    <div class="bust"></div>
    <div class="crt"><i></i></div>
    <div class="word" id="word"></div>
    <div class="bubble" id="bubble"></div>
    <div class="select" id="select"></div>
    <div class="brand" id="brand"></div>
  </div>
  <script>
    // 改这里即可换品牌
    const BRAND = {
      name: 'NOEL',
      bg: '#e7e7e7',
      ink: '#111111',
      bubble: '#111111',
      bubbleText: '#ffffff',
      beats: [
        { t: 0.00, kind: 'word', text: "WHAT'S NEXT?" },
        { t: 0.55, kind: 'bubble', text: "WHAT'S NEXT?" },
        { t: 1.10, kind: 'stack', text: 'STUDIO' },
        { t: 1.65, kind: 'select', text: 'BRAND FILM' },
        { t: 2.20, kind: 'flip3d', text: 'KINETIC' },
        { t: 2.75, kind: 'word', text: 'TYPE' }
      ]
    };

    (function () {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const root = document.documentElement;
      root.style.setProperty('--bg', BRAND.bg);
      root.style.setProperty('--ink', BRAND.ink);
      root.style.setProperty('--bubble', BRAND.bubble);
      root.style.setProperty('--bubble-text', BRAND.bubbleText);
      document.title = BRAND.name;
      document.body.style.background = BRAND.bg;
      document.getElementById('brand').textContent = BRAND.name;

      const word = document.getElementById('word');
      const bubble = document.getElementById('bubble');
      const select = document.getElementById('select');
      const LOOP = 3.2;

      function apply(beat, now) {
        word.style.display = 'none';
        bubble.style.display = 'none';
        select.style.display = 'none';
        word.style.transform = 'translateX(-50%)';
        word.textContent = beat.text;
        if (beat.kind === 'bubble') {
          bubble.style.display = 'block';
          bubble.textContent = beat.text;
          return;
        }
        word.style.display = 'block';
        if (beat.kind === 'stack') {
          word.style.fontSize = 'clamp(40px, 9vw, 96px)';
          word.style.letterSpacing = '-0.08em';
          word.style.transform = 'translateX(-50%) scaleY(1.35)';
        } else if (beat.kind === 'select') {
          word.style.fontSize = 'clamp(28px, 6vw, 64px)';
          select.style.display = 'block';
          const r = word.getBoundingClientRect();
          select.style.left = (r.left - 8) + 'px';
          select.style.top = (r.top - 8) + 'px';
          select.style.width = (r.width + 16) + 'px';
          select.style.height = (r.height + 16) + 'px';
        } else if (beat.kind === 'flip3d') {
          word.style.fontSize = 'clamp(36px, 8vw, 88px)';
          const k = reduced ? 0 : Math.sin(now * 6);
          word.style.transform = 'translateX(-50%) rotateY(' + (k * 70) + 'deg) scale(' + (1.05 + Math.abs(k) * 0.2) + ')';
        } else {
          word.style.fontSize = 'clamp(32px, 7vw, 78px)';
          const s = reduced ? 1 : 1 + Math.sin(now * 8) * 0.04;
          word.style.transform = 'translateX(-50%) scale(' + s + ')';
        }
      }

      function current(t) {
        let beat = BRAND.beats[0];
        for (let i = 0; i < BRAND.beats.length; i++) {
          if (t + 0.001 >= BRAND.beats[i].t) beat = BRAND.beats[i];
        }
        return beat;
      }

      apply(BRAND.beats[0], 0);
      const t0 = performance.now();
      function tick(now) {
        const t = ((now - t0) / 1000) % LOOP;
        apply(current(t), t);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
