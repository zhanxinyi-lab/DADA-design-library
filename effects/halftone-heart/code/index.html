<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>半调心脏</title>
  <style>
    :root {
      --bg: #09070f;
      --ink: #ddd8f4;
      --dim: #9b96b8;
      --line: rgba(214, 208, 255, 0.55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { overflow: hidden; }
    .app {
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    canvas {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    .dock {
      flex: none;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px 10px;
      align-items: center;
      width: 100%;
      max-width: 100%;
      padding: 8px 12px 12px;
      font: 12px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    .readout {
      margin: 0;
      min-width: 4.5em;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .readout span { color: var(--dim); font-size: 11px; margin-left: 4px; }
    .rate { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rate input {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      margin: 0;
      accent-color: #8d86ff;
    }
    .presets, .hint { grid-column: 1 / -1; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid rgba(221, 216, 244, 0.28);
      border-radius: 999px;
      padding: 5px 10px;
      max-width: 100%;
    }
    button[aria-pressed="true"] {
      border-color: var(--line);
      color: white;
    }
    .hint { margin: 0; color: var(--dim); }
    @media (max-width: 390px) {
      .dock { padding: 8px 10px 10px; font-size: 11px; }
      button { padding: 5px 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="view" aria-label="半调点阵心脏。指针改变视角，滑杆或上下方向键改变心率。"></canvas>
    <div class="dock">
      <p class="readout"><output id="bpm">72</output><span>BPM</span></p>
      <label class="rate">心率
        <input id="rate" type="range" min="42" max="168" step="1" value="72" aria-label="心率，每分钟次数">
      </label>
      <div class="presets" role="group" aria-label="颜色">
        <button type="button" data-palette="0" aria-pressed="true">蓝紫</button>
        <button type="button" data-palette="1" aria-pressed="false">冰</button>
        <button type="button" data-palette="2" aria-pressed="false">烬</button>
        <button type="button" data-palette="3" aria-pressed="false">信号</button>
      </div>
      <p class="hint">指针转动视角 · ↑↓ 改变心率</p>
    </div>
  </div>
  <script>
    (function () {
      var canvas = document.getElementById("view");
      var bpmOut = document.getElementById("bpm");
      var rateInput = document.getElementById("rate");
      var buttons = Array.prototype.slice.call(document.querySelectorAll("[data-palette]"));
      var ctx = canvas.getContext("2d", { alpha: false });
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var reduced = motion.matches;
      var raf = 0;
      var last = 0;

      var PRESETS = [
        { deep: [16, 18, 72], mid: [62, 74, 228], pale: [244, 242, 255] },
        { deep: [8, 48, 72], mid: [36, 150, 176], pale: [226, 252, 255] },
        { deep: [72, 16, 24], mid: [196, 64, 48], pale: [255, 214, 186] },
        { deep: [8, 48, 40], mid: [28, 150, 104], pale: [214, 255, 226] }
      ];
      var REST_YAW = 0.7;
      var REST_PITCH = 0.28;
      var state = {
        yaw: REST_YAW,
        pitch: REST_PITCH,
        targetYaw: REST_YAW,
        targetPitch: REST_PITCH,
        bpm: 72,
        targetBpm: 72,
        phase: 0,
        palette: 0
      };

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function smin(a, b, k) {
        var h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1);
        return b * (1 - h) + a * h - k * h * (1 - h);
      }
      function len3(x, y, z) { return Math.hypot(x, y, z); }
      function sdEllipsoid(x, y, z, rx, ry, rz) {
        var k0 = len3(x / rx, y / ry, z / rz);
        var k1 = len3(x / (rx * rx), y / (ry * ry), z / (rz * rz));
        return k0 * (k0 - 1) / Math.max(k1, 1e-8);
      }
      function sdCapsule(x, y, z, ax, ay, az, bx, by, bz, r) {
        var pax = x - ax, pay = y - ay, paz = z - az;
        var bax = bx - ax, bay = by - ay, baz = bz - az;
        var h = clamp((pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz), 0, 1);
        return len3(pax - bax * h, pay - bay * h, paz - baz * h) - r;
      }
      function heart(px, py, pz) {
        var c1 = Math.cos(0.18), s1 = Math.sin(0.18);
        var y = c1 * py - s1 * pz, z = s1 * py + c1 * pz, x = px;
        var c2 = Math.cos(-0.22), s2 = Math.sin(-0.22);
        var x2 = c2 * x - s2 * y, y2 = s2 * x + c2 * y;
        x = x2; y = y2;
        var c3 = Math.cos(0.15), s3 = Math.sin(0.15);
        var x3 = c3 * x + s3 * z, z3 = -s3 * x + c3 * z;
        x = x3; z = z3;
        var d = smin(smin(
          sdEllipsoid(x - 0.10, y + 0.08, z, 0.58, 0.74, 0.46),
          sdEllipsoid(x + 0.28, y - 0.06, z - 0.10, 0.46, 0.58, 0.38),
          0.22
        ), sdEllipsoid(x - 0.28, y + 0.78, z - 0.02, 0.24, 0.40, 0.22), 0.2);
        d = smin(d, smin(
          sdEllipsoid(x + 0.46, y - 0.32, z - 0.04, 0.34, 0.32, 0.28),
          sdEllipsoid(x - 0.30, y - 0.40, z + 0.16, 0.30, 0.24, 0.26),
          0.16
        ), 0.18);
        d = smin(d, sdCapsule(x, y, z, -0.36, 0.52, 0.02, -0.50, 1.28, 0, 0.105), 0.12);
        d = smin(d, sdCapsule(x, y, z, -0.34, 0.05, 0.02, -0.40, -0.48, 0.06, 0.09), 0.1);
        d = smin(d, sdCapsule(x, y, z, 0.02, 0.48, 0.06, 0, 1.18, 0.02, 0.125), 0.12);
        d = smin(d, sdCapsule(x, y, z, 0, 1.18, 0.02, -0.28, 1.32, -0.08, 0.10), 0.1);
        d = smin(d, sdCapsule(x, y, z, -0.28, 1.32, -0.08, -0.22, 1.05, -0.16, 0.085), 0.08);
        d = smin(d, sdCapsule(x, y, z, 0.12, 0.46, 0.14, 0.78, 0.62, 0.08, 0.115), 0.12);
        d = smin(d, sdCapsule(x, y, z, 0.62, 0.60, 0.10, 0.95, 0.92, 0.02, 0.09), 0.08);
        return d;
      }

      function cardiac(turns) {
        var w = turns * Math.PI * 2;
        return 0.1626
          - 0.1069 * Math.cos(w) - 0.0423 * Math.sin(w)
          - 0.0349 * Math.cos(2 * w) - 0.1615 * Math.sin(2 * w)
          + 0.1435 * Math.cos(3 * w) - 0.1100 * Math.sin(3 * w)
          + 0.1410 * Math.cos(4 * w) + 0.0740 * Math.sin(4 * w)
          + 0.0026 * Math.cos(5 * w) + 0.1161 * Math.sin(5 * w)
          - 0.0560 * Math.cos(6 * w) + 0.0483 * Math.sin(6 * w);
      }

      var restPhase = 0.62;
      state.phase = restPhase;

      var STEP = 0.032;
      var model = null;
      function build() {
        var seeds = [];
        var x, y, z, d;
        for (x = -1.15; x <= 1.25; x += STEP) {
          for (y = -1.35; y <= 1.55; y += STEP) {
            for (z = -0.85; z <= 0.85; z += STEP) {
              d = heart(x, y, z);
              if (Math.abs(d) < STEP * 0.95) seeds.push(x, y, z);
            }
          }
        }
        var e = 0.004;
        var cell = STEP * 0.86;
        var seen = new Set();
        var px = [], py = [], pz = [];
        var i, k, gx, gy, gz, n2, s, key, dist;
        for (i = 0; i < seeds.length; i += 3) {
          x = seeds[i]; y = seeds[i + 1]; z = seeds[i + 2];
          for (k = 0; k < 5; k++) {
            gx = (heart(x + e, y, z) - heart(x - e, y, z)) / (2 * e);
            gy = (heart(x, y + e, z) - heart(x, y - e, z)) / (2 * e);
            gz = (heart(x, y, z + e) - heart(x, y, z - e)) / (2 * e);
            n2 = gx * gx + gy * gy + gz * gz;
            dist = heart(x, y, z);
            s = dist / Math.max(n2, 1e-8);
            x -= gx * s; y -= gy * s; z -= gz * s;
          }
          if (Math.abs(heart(x, y, z)) > 0.025) continue;
          key = (Math.round(x / cell) + 80) + ":" + (Math.round(y / cell) + 80) + ":" + (Math.round(z / cell) + 80);
          if (seen.has(key)) continue;
          seen.add(key);
          px.push(x); py.push(y); pz.push(z);
        }
        var n = px.length;
        var nx = new Float32Array(n), ny = new Float32Array(n), nz = new Float32Array(n);
        var cx = 0, cy = 0, cz = 0;
        for (i = 0; i < n; i++) {
          x = px[i]; y = py[i]; z = pz[i];
          gx = (heart(x + e, y, z) - heart(x - e, y, z)) / (2 * e);
          gy = (heart(x, y + e, z) - heart(x, y - e, z)) / (2 * e);
          gz = (heart(x, y, z + e) - heart(x, y, z - e)) / (2 * e);
          s = Math.hypot(gx, gy, gz) || 1;
          nx[i] = gx / s; ny[i] = gy / s; nz[i] = gz / s;
          cx += x; cy += y; cz += z;
        }
        model = {
          x: Float32Array.from(px),
          y: Float32Array.from(py),
          z: Float32Array.from(pz),
          nx: nx, ny: ny, nz: nz,
          cx: cx / n, cy: cy / n, cz: cz / n,
          n: n,
          order: new Uint32Array(n),
          vx: new Float32Array(n),
          vy: new Float32Array(n),
          vz: new Float32Array(n),
          vnx: new Float32Array(n),
          vny: new Float32Array(n),
          vnz: new Float32Array(n)
        };
        for (i = 0; i < n; i++) model.order[i] = i;
      }

      var view = { w: 1, h: 1, dpr: 1 };
      function resize() {
        var rect = canvas.getBoundingClientRect();
        view.w = Math.max(1, rect.width);
        view.h = Math.max(1, rect.height);
        view.dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(view.w * view.dpr);
        canvas.height = Math.round(view.h * view.dpr);
      }

      function mix(a, b, t) {
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      }
      function smooth(a, b, x) {
        var t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      }

      var KEY = [-0.86, 0.36, 0.36];
      var FILL = [0.2, -0.12, 0.62];
      (function () {
        var a = Math.hypot(KEY[0], KEY[1], KEY[2]);
        var b = Math.hypot(FILL[0], FILL[1], FILL[2]);
        KEY = [KEY[0] / a, KEY[1] / a, KEY[2] / a];
        FILL = [FILL[0] / b, FILL[1] / b, FILL[2] / b];
      })();

      function draw() {
        if (!model) return;
        var w = canvas.width, h = canvas.height;
        var dpr = view.dpr;
        var pal = PRESETS[state.palette];
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#09070f";
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = "rgba(255,255,255,0.035)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        var g;
        for (g = 28; g < view.w; g += 56) { ctx.moveTo(g, 0); ctx.lineTo(g, view.h); }
        for (g = 28; g < view.h; g += 56) { ctx.moveTo(0, g); ctx.lineTo(view.w, g); }
        ctx.stroke();

        var beat = cardiac(state.phase);
        var scaleX = 1 + 0.09 * beat;
        var scaleY = 1 + 0.06 * beat;
        var scaleZ = 1 + 0.09 * beat;
        var cyaw = Math.cos(state.yaw), syaw = Math.sin(state.yaw);
        var cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
        var unit = Math.min(view.w, view.h) * 0.34;
        var originX = view.w * 0.5;
        var originY = view.h * 0.46;
        var focal = 4.4;
        var n = model.n;
        var i, x, y, z, nx, ny, nz, x1, z1, y2, z2, nx1, nz1, ny2, nz2, inv;
        for (i = 0; i < n; i++) {
          x = (model.x[i] - model.cx) * scaleX;
          y = (model.y[i] - model.cy) * scaleY;
          z = (model.z[i] - model.cz) * scaleZ;
          x1 = cyaw * x + syaw * z;
          z1 = -syaw * x + cyaw * z;
          y2 = cp * y - sp * z1;
          z2 = sp * y + cp * z1;
          model.vx[i] = x1; model.vy[i] = y2; model.vz[i] = z2;
          nx = model.nx[i] / scaleX; ny = model.ny[i] / scaleY; nz = model.nz[i] / scaleZ;
          inv = 1 / (Math.hypot(nx, ny, nz) || 1);
          nx *= inv; ny *= inv; nz *= inv;
          nx1 = cyaw * nx + syaw * nz;
          nz1 = -syaw * nx + cyaw * nz;
          ny2 = cp * ny - sp * nz1;
          nz2 = sp * ny + cp * nz1;
          model.vnx[i] = nx1; model.vny[i] = ny2; model.vnz[i] = nz2;
        }
        var order = model.order;
        order.sort(function (a, b) { return model.vz[a] - model.vz[b]; });

        var buckets = [];
        for (i = 0; i < 24; i++) buckets.push([]);
        var countDrawn = 0;
        for (var oi = 0; oi < n; oi++) {
          i = order[oi];
          if (model.vnz[i] < -0.02) continue;
          z2 = model.vz[i];
          var persp = focal / (focal - z2 * 0.16);
          var sx = originX + model.vx[i] * unit * persp;
          var sy = originY - model.vy[i] * unit * persp;
          if (sx < -20 || sy < -20 || sx > view.w + 20 || sy > view.h + 20) continue;
          var ndl = model.vnx[i] * KEY[0] + model.vny[i] * KEY[1] + model.vnz[i] * KEY[2];
          var fill = model.vnx[i] * FILL[0] + model.vny[i] * FILL[1] + model.vnz[i] * FILL[2];
          var light = clamp(Math.pow(Math.max(0, ndl), 1.35) + Math.max(0, fill) * 0.2, 0, 1);
          var height = clamp((model.y[i] + 0.9) / 2.15, 0, 1);
          var shadow = mix(pal.deep, pal.mid, 0.35 + height * 0.65);
          var tone = smooth(0.12, 0.9, light);
          var col = mix(shadow, pal.pale, tone);
          var rad = Math.max(0.7, STEP * unit * persp * (0.18 + 0.46 * light));
          var bi = Math.round(light * 11) * 2 + (height > 0.62 ? 1 : 0);
          buckets[bi].push(sx, sy, rad, col[0], col[1], col[2]);
          countDrawn++;
        }
        for (i = 0; i < buckets.length; i++) {
          var b = buckets[i];
          if (!b.length) continue;
          var cr = 0, cg = 0, cb = 0, samples = 0;
          for (var j = 0; j < b.length; j += 6) { cr += b[j + 3]; cg += b[j + 4]; cb += b[j + 5]; samples++; }
          ctx.fillStyle = "rgb(" + (cr / samples | 0) + "," + (cg / samples | 0) + "," + (cb / samples | 0) + ")";
          ctx.beginPath();
          for (j = 0; j < b.length; j += 6) {
            ctx.moveTo(b[j] + b[j + 2], b[j + 1]);
            ctx.arc(b[j], b[j + 1], b[j + 2], 0, Math.PI * 2);
          }
          ctx.fill();
        }

        var baseY = view.h - 28;
        ctx.beginPath();
        ctx.strokeStyle = "rgba(" + pal.pale[0] + "," + pal.pale[1] + "," + pal.pale[2] + ",0.45)";
        ctx.lineWidth = 1.25;
        var span = Math.min(view.w - 32, 420);
        var left = (view.w - span) / 2;
        for (i = 0; i <= 96; i++) {
          var u = i / 96;
          var ph = reduced ? u : (state.phase - (1 - u) * 3);
          var yy = baseY - cardiac(ph) * 22;
          if (i === 0) ctx.moveTo(left, yy);
          else ctx.lineTo(left + span * u, yy);
        }
        ctx.stroke();
        ctx.restore();
        if (!countDrawn) {
          ctx.fillStyle = "#9b96b8";
          ctx.font = "14px sans-serif";
          ctx.fillText("心脏点阵没有生成", 16, 28);
        }
      }

      function syncReadout() {
        var shown = Math.round(state.bpm);
        bpmOut.textContent = String(shown);
        if (document.activeElement !== rateInput) rateInput.value = String(shown);
      }

      function setBpm(next) {
        state.targetBpm = clamp(next, 42, 168);
        rateInput.value = String(Math.round(state.targetBpm));
        if (reduced) {
          state.bpm = state.targetBpm;
          syncReadout();
          draw();
        }
      }

      function setPalette(index) {
        state.palette = index;
        buttons.forEach(function (btn) {
          btn.setAttribute("aria-pressed", String(Number(btn.getAttribute("data-palette")) === index));
        });
        if (reduced) draw();
      }

      function onPointer(e) {
        if (e.target.closest && e.target.closest("button, input, label")) return;
        var rect = canvas.getBoundingClientRect();
        var nx = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        var ny = clamp((e.clientY - rect.top) / rect.height, 0, 1);
        state.targetYaw = clamp(REST_YAW + (nx - 0.5) * 1.55, -1.15, 1.35);
        state.targetPitch = clamp(REST_PITCH + (0.42 - ny) * 0.95, -0.65, 0.85);
        if (reduced) {
          state.yaw = state.targetYaw;
          state.pitch = state.targetPitch;
          draw();
        }
      }

      function loop(now) {
        if (reduced) { raf = 0; return; }
        var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        var aim = 1 - Math.exp(-dt * 7);
        state.yaw += (state.targetYaw - state.yaw) * aim;
        state.pitch += (state.targetPitch - state.pitch) * aim;
        state.bpm += (state.targetBpm - state.bpm) * (1 - Math.exp(-dt * 5));
        state.phase += dt * (state.bpm / 60);
        syncReadout();
        draw();
        raf = window.requestAnimationFrame(loop);
      }

      function still() {
        if (raf) window.cancelAnimationFrame(raf);
        raf = 0;
        last = 0;
        state.yaw = state.targetYaw;
        state.pitch = state.targetPitch;
        state.bpm = state.targetBpm;
        state.phase = restPhase;
        syncReadout();
        draw();
      }

      function start() {
        if (reduced || raf) return;
        last = 0;
        raf = window.requestAnimationFrame(loop);
      }

      rateInput.addEventListener("input", function () { setBpm(Number(rateInput.value)); });
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () { setPalette(Number(btn.getAttribute("data-palette"))); });
      });
      canvas.addEventListener("pointermove", onPointer);
      canvas.addEventListener("pointerdown", onPointer);
      window.addEventListener("keydown", function (e) {
        if (e.target === rateInput) return;
        var next = null;
        if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") next = state.targetBpm + 4;
        else if (e.key === "ArrowDown" || e.key === "-" || e.key === "_") next = state.targetBpm - 4;
        else if (e.key === "1" || e.key === "2" || e.key === "3" || e.key === "4") setPalette(Number(e.key) - 1);
        if (next == null) return;
        e.preventDefault();
        setBpm(next);
      });
      window.addEventListener("resize", function () {
        resize();
        if (reduced) draw();
      });
      if (motion.addEventListener) {
        motion.addEventListener("change", function () {
          reduced = motion.matches;
          if (reduced) still();
          else start();
        });
      }

      build();
      resize();
      syncReadout();
      draw();
      if (reduced) still();
      else start();
    })();
  </script>
</body>
</html>
