<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辉光海报卡</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #f5f7f2;
  }
  body {
    display: grid;
    place-items: center;
    height: 100%;
    overflow: hidden;
  }
  .frame {
    position: relative;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font: 500 clamp(10px, 1.55vw, 13px) / 1.35 ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.9);
  }
  .hud span { position: absolute; white-space: nowrap; }
  .tl { top: 3.4%; left: 4.4%; }
  .tr { top: 3.4%; right: 4.4%; }
  .bl { bottom: 3.6%; left: 4.4%; }
  .bc { bottom: 3.6%; left: 50%; transform: translateX(-50%); }
  .br { right: 4.4%; bottom: 3.2%; text-align: right; }
  #replay {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  #replay:focus { outline: none; }
  #replay:focus-visible {
    outline: 2px solid #fff;
    outline-offset: -8px;
  }
  #fail {
    display: none;
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 24px;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #000;
    color: #f5f7f2;
    font: 15px/1.5 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #fail.on { display: flex; }
</style>
</head>
<body>
<div class="frame">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="hud">
    <span class="tl" id="count">001</span>
    <span class="tr">creator platform</span>
    <span class="bl">VL.FIELD ARCHIVE</span>
    <span class="bc">all rights reserved</span>
    <span class="br">© 2026<br>[Vireo Lab].</span>
  </div>
  <button type="button" id="replay" aria-label="重播标志聚合"></button>
  <p id="fail" role="status"></p>
</div>
<script>
"use strict";
(function () {
  var canvas = document.getElementById("c");
  var frame = canvas.parentNode;
  var countEl = document.getElementById("count");
  var failEl = document.getElementById("fail");
  var replayBtn = document.getElementById("replay");
  var ctx = canvas.getContext("2d");
  if (!ctx) {
    failEl.textContent = "这个浏览器画不出这块海报。";
    failEl.className = "on";
    return;
  }

  var FORM = 2400;
  var CYCLE = 6000;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var origin = 0;
  var raf = 0;
  var running = false;

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(t) {
    t = clamp01(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function smooth(t) {
    t = clamp01(t);
    return t * t * (3 - 2 * t);
  }
  function pad(n) {
    n = String(n);
    while (n.length < 3) n = "0" + n;
    return n;
  }

  function shape(mode, trace) {
    ctx.beginPath();
    trace();
    if (mode === "fill") ctx.fill();
    else ctx.stroke();
  }

  function drawV(mode) {
    shape(mode, function () {
      ctx.moveTo(0, 0);
      ctx.lineTo(0.20, 0);
      ctx.lineTo(0.38, 0.58);
      ctx.lineTo(0.56, 0);
      ctx.lineTo(0.76, 0);
      ctx.lineTo(0.38, 1);
      ctx.closePath();
    });
  }
  function drawI(mode) {
    shape(mode, function () { ctx.rect(0, 0, 0.20, 1); });
  }
  function drawR(mode) {
    var t = 0.20;
    shape(mode, function () { ctx.rect(0, 0, t, 1); });
    shape(mode, function () {
      ctx.arc(t, 0.30, 0.30, -Math.PI / 2, Math.PI / 2);
      ctx.arc(t, 0.30, 0.12, Math.PI / 2, -Math.PI / 2, true);
      ctx.closePath();
    });
    shape(mode, function () {
      ctx.moveTo(0.22, 0.50);
      ctx.lineTo(0.40, 0.50);
      ctx.lineTo(0.68, 1);
      ctx.lineTo(0.46, 1);
      ctx.closePath();
    });
  }
  function drawE(mode) {
    var t = 0.20;
    shape(mode, function () { ctx.rect(0, 0, t, 1); });
    shape(mode, function () { ctx.rect(0, 0, 0.58, t); });
    shape(mode, function () { ctx.rect(0, 0.40, 0.44, t); });
    shape(mode, function () { ctx.rect(0, 0.80, 0.58, t); });
  }
  function drawO(mode) {
    var cx = 0.5;
    var cy = 0.5;
    var ro = 0.5;
    var ri = 0.26;
    if (mode === "fill") {
      ctx.beginPath();
      ctx.arc(cx, cy, ro, 0, Math.PI * 2);
      ctx.arc(cx, cy, ri, 0, Math.PI * 2, true);
      ctx.fill("evenodd");
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, ro, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, ri, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  function drawArc(mode, a0, a1) {
    shape(mode, function () {
      ctx.arc(0, 0, 1, a0, a1);
      ctx.arc(0, 0, 0.56, a1, a0, true);
      ctx.closePath();
    });
  }
  function drawLeft(mode) { drawArc(mode, Math.PI * 0.58, Math.PI * 1.42); }
  function drawRight(mode) { drawArc(mode, Math.PI * -0.42, Math.PI * 0.42); }
  function drawLatch(mode) {
    shape(mode, function () {
      var x = -0.82;
      var y = -0.13;
      var w = 1.64;
      var h = 0.26;
      var r = 0.13;
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    });
  }

  var letters = [
    { w: 0.76, draw: drawV, ox: -72, oy: 22, rot: -0.28 },
    { w: 0.20, draw: drawI, ox: 16, oy: -64, rot: 0.2 },
    { w: 0.68, draw: drawR, ox: 58, oy: 18, rot: 0.12 },
    { w: 0.58, draw: drawE, ox: -22, oy: 54, rot: -0.16 },
    { w: 1.00, draw: drawO, ox: 86, oy: -26, rot: 0.2 }
  ];
  var markParts = [
    { draw: drawLeft, ox: -96, oy: 18, rot: -0.4 },
    { draw: drawRight, ox: 108, oy: -22, rot: 0.34 },
    { draw: drawLatch, ox: 4, oy: -96, rot: 0.5 }
  ];

  function orb(cx, cy, rx, ry) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx, ry);
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, "rgba(212, 255, 60, 1)");
    g.addColorStop(0.34, "rgba(198, 246, 52, 0.96)");
    g.addColorStop(0.52, "rgba(90, 196, 150, 0.72)");
    g.addColorStop(0.7, "rgba(58, 176, 206, 0.55)");
    g.addColorStop(0.86, "rgba(14, 52, 68, 0.28)");
    g.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function paintGlow(w, h, now) {
    var t = now / 1000;
    var breath = 0.9 + 0.14 * (0.5 + 0.5 * Math.sin(t * 0.85));
    var driftX = Math.sin(t * 0.37) * w * 0.018;
    var driftY = Math.cos(t * 0.29) * h * 0.012;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    orb(w * 0.30 + driftX, h * 0.50 + driftY, w * 0.50 * breath, h * 0.56 * breath);
    orb(w * 0.74 - driftX * 0.8, h * 0.50 - driftY, w * 0.48 * (1.04 - (breath - 0.9)), h * 0.54 * breath);
    var veil = ctx.createLinearGradient(0, 0, 0, h);
    veil.addColorStop(0, "rgba(0, 0, 0, 0.94)");
    veil.addColorStop(0.16, "rgba(0, 0, 0, 0)");
    veil.addColorStop(0.80, "rgba(0, 0, 0, 0)");
    veil.addColorStop(1, "rgba(0, 0, 0, 0.92)");
    ctx.fillStyle = veil;
    ctx.fillRect(0, 0, w, h);
  }

  function paintPiece(draw, gather, fillK, ghostK, unit) {
    if (ghostK > 0.02) {
      ctx.save();
      ctx.globalAlpha = ghostK * (0.35 + 0.65 * gather);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
      ctx.lineWidth = 2.4 / unit;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      draw("stroke");
      ctx.restore();
    }
    if (fillK > 0.02) {
      ctx.save();
      ctx.globalAlpha = fillK;
      ctx.fillStyle = "#0a0c0b";
      draw("fill");
      ctx.restore();
    }
  }

  function placePiece(px, py, ox, oy, rot, gather, unit, scatter, draw, fillK, ghostK) {
    var left = 1 - gather;
    ctx.save();
    ctx.translate(px + ox * scatter * left, py + oy * scatter * left);
    ctx.rotate(rot * left);
    ctx.scale(unit, unit);
    paintPiece(draw, gather, fillK, ghostK, unit);
    ctx.restore();
  }

  function paintLockup(w, h, elapsed) {
    var gather = reduced ? 1 : ease(elapsed / FORM);
    var fillK = reduced ? 1 : smooth((elapsed - 1200) / 1200);
    var ghostK = reduced ? 0 : 1 - smooth((elapsed - 1400) / 1000);
    var H = h * 0.092;
    var gap = H * 0.10;
    var textW = 0;
    var i;
    for (i = 0; i < letters.length; i++) textW += letters[i].w * H + gap;
    textW -= gap;
    var mark = H * 1.05;
    var lockW = mark + H * 0.16 + textW;
    if (lockW > w * 0.88) {
      H = H * (w * 0.88) / lockW;
      gap = H * 0.10;
      textW = 0;
      for (i = 0; i < letters.length; i++) textW += letters[i].w * H + gap;
      textW -= gap;
      mark = H * 1.05;
      lockW = mark + H * 0.16 + textW;
    }
    var x0 = (w - lockW) / 2;
    var y0 = h * 0.5 - H * 0.5;

    if (!reduced && ghostK > 0.15 && gather > 0.2 && gather < 0.9) {
      ctx.save();
      ctx.globalAlpha = ghostK * 0.28;
      var streak = ctx.createLinearGradient(w / 2, y0 - H, w / 2, y0 + H * 2);
      streak.addColorStop(0, "rgba(255,255,255,0)");
      streak.addColorStop(0.5, "rgba(230,255,180,1)");
      streak.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = streak;
      ctx.fillRect(w / 2 - Math.max(1, w * 0.0015), y0 - H * 0.4, Math.max(2, w * 0.003), H * 1.8);
      ctx.restore();
    }

    var scatter = H / 100;
    for (i = 0; i < markParts.length; i++) {
      var part = markParts[i];
      placePiece(x0 + mark / 2, y0 + H * 0.5, part.ox, part.oy, part.rot, gather, mark * 0.52, scatter, part.draw, fillK, ghostK);
    }

    var x = x0 + mark + H * 0.16;
    for (i = 0; i < letters.length; i++) {
      var letter = letters[i];
      placePiece(x + letter.w * H / 2, y0 + H / 2, letter.ox, letter.oy, letter.rot, gather, H, scatter, function (mode) {
        ctx.save();
        ctx.translate(-letter.w / 2, -0.5);
        letter.draw(mode);
        ctx.restore();
      }, fillK, ghostK);
      x += letter.w * H + gap;
    }

    if (fillK > 0.02) {
      ctx.save();
      ctx.globalAlpha = fillK;
      ctx.fillStyle = "#0a0c0b";
      ctx.font = "700 " + Math.max(8, H * 0.16) + "px ui-monospace, Consolas, monospace";
      ctx.textBaseline = "top";
      ctx.fillText("TM", x - gap * 0.2, y0);
      ctx.restore();
    }
  }

  function layoutCard() {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var w = vw;
    var h = Math.round(vw * 4 / 3);
    if (h > vh) {
      h = vh;
      w = Math.round(vh * 3 / 4);
    }
    frame.style.width = w + "px";
    frame.style.height = h + "px";
  }

  function render(now) {
    layoutCard();
    var rect = frame.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.max(1, Math.round(rect.width * dpr));
    var h = Math.max(1, Math.round(rect.height * dpr));
    if (rect.width < 2 || rect.height < 2) return;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    var elapsed = reduced ? FORM : (now - origin) % CYCLE;
    if (elapsed < 0) elapsed = 0;
    paintGlow(w, h, reduced ? 0 : now);
    paintLockup(w, h, elapsed);
    var n = reduced ? 5 : Math.min(5, 1 + Math.floor(elapsed / 1200));
    var label = pad(n);
    if (countEl.textContent !== label) countEl.textContent = label;
  }

  function tick(now) {
    render(now);
    if (running) raf = window.requestAnimationFrame(tick);
  }
  function start() {
    if (reduced || running) return;
    running = true;
    raf = window.requestAnimationFrame(tick);
  }
  function stop() {
    running = false;
    if (raf) window.cancelAnimationFrame(raf);
    raf = 0;
  }

  replayBtn.addEventListener("click", function () {
    if (reduced) return;
    origin = performance.now();
    render(origin);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop();
    else start();
  });
  window.addEventListener("resize", function () { render(performance.now()); });

  var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (motion.addEventListener) {
    motion.addEventListener("change", function () {
      reduced = motion.matches;
      if (reduced) {
        stop();
        render(0);
      } else {
        origin = performance.now();
        start();
      }
    });
  }

  origin = performance.now();
  render(origin);
  start();
})();
</script>
</body>
</html>
