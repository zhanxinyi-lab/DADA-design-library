<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑洞吸入 · Three.js 粒子</title>
<!-- AI 复刻：@Kaberikram「吸尘器把整个房间吸进黑洞」WebXR 效果的桌面版。Three.js（CDN）+ 自定义 shader 粒子 + 吸积盘 -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,"PingFang SC"}#hint{position:fixed;left:16px;bottom:14px;color:#fff8;font-size:12px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body>
<div id="hint">按住鼠标 = 开启吸力 · 松开 = 物体回弹</div>
<script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);cam.position.set(0,2.2,7);cam.lookAt(0,0,0);
// "room" = point cloud of a box room + furniture-ish blocks
const N=26000,pos=new Float32Array(N*3),home=new Float32Array(N*3),col=new Float32Array(N*3),rnd=new Float32Array(N);
const pal=[[.85,.78,.66],[.55,.5,.45],[.95,.7,.4],[.3,.32,.36]];
for(let i=0;i<N;i++){let x,y,z,f=Math.random(),c;
 if(f<.25){x=(Math.random()-.5)*10;y=-1.5;z=(Math.random()-.5)*8;c=pal[1]}          // floor
 else if(f<.5){x=(Math.random()-.5)*10;y=-1.5+Math.random()*5;z=-4;c=pal[0]}          // back wall
 else if(f<.62){x=-5;y=-1.5+Math.random()*5;z=(Math.random()-.5)*8;c=pal[0]}
 else if(f<.74){x=-2.2+(Math.random()-.5)*2.4;y=-.2+(Math.random()-.5)*1.4;z=-3.9;c=pal[3]} // TV
 else if(f<.86){const a=Math.random()*6.28,h=Math.random();x=2.8+Math.cos(a)*.15;z=-2.5+Math.sin(a)*.15;y=-1.5+h*2.6;c=h>.9?pal[2]:pal[1]} // lamp
 else{x=1+Math.random()*2.2;y=-1.5+Math.random()*.9;z=-1+Math.random()*1.3;c=pal[2]}  // cabinet
 home.set([x,y,z],i*3);pos.set([x,y,z],i*3);col.set(c,i*3);rnd[i]=Math.random()}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));sc.add(pts);
// black hole core + lensing glow + accretion disk shader
const BH=new THREE.Vector3(0,.6,0);
const core=new THREE.Mesh(new THREE.SphereGeometry(.32,48,48),new THREE.MeshBasicMaterial({color:0}));core.position.copy(BH);sc.add(core);
const diskMat=new THREE.ShaderMaterial({transparent:true,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{t:{value:0},k:{value:0}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec2 vUv;uniform float t,k;void main(){vec2 p=vUv-.5;float r=length(p)*2.;float a=atan(p.y,p.x);
 float ring=smoothstep(.28,.36,r)*smoothstep(1.,.45,r);float sw=.5+.5*sin(a*6.-t*4.+r*18.);vec3 c=mix(vec3(1.,.45,.1),vec3(1.,.9,.7),sw*(1.-r));
 gl_FragColor=vec4(c,ring*(.25+.75*k)*(.6+.4*sw));}`});
const disk=new THREE.Mesh(new THREE.PlaneGeometry(3,3),diskMat);disk.position.copy(BH);disk.rotation.x=-1.25;sc.add(disk);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({color:0xffa050,transparent:true,opacity:.0,blending:THREE.AdditiveBlending,map:(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const gr=x.createRadialGradient(64,64,10,64,64,64);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#0000');x.fillStyle=gr;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})()}));
halo.scale.set(3,3,1);halo.position.copy(BH);sc.add(halo);
let suck=0,target=0,demo=true;addEventListener('pointerdown',()=>{demo=false;target=1});addEventListener('pointerup',()=>target=0);
const v=new THREE.Vector3(),clk=new THREE.Clock();
function loop(){const t=clk.getElapsedTime();if(demo)target=(t%8)<5?1:0;suck+=(target-suck)*.02;
 for(let i=0;i<N;i++){const j=i*3;const hx=home[j],hy=home[j+1],hz=home[j+2];
  const s=Math.min(1,Math.max(0,suck*1.6-rnd[i]*.6));            // staggered release
  const e=s*s*(3-2*s);const ang=e*(6+rnd[i]*6)+t*e*2;           // spiral in
  v.set(hx-BH.x,hy-BH.y,hz-BH.z);const d=v.length()*(1-e*.985);
  v.normalize();const ca=Math.cos(ang),sa=Math.sin(ang);const nx=v.x*ca-v.z*sa,nz=v.x*sa+v.z*ca,ny=v.y*(1-e*.85);
  pos[j]=BH.x+nx*d;pos[j+1]=BH.y+ny*d;pos[j+2]=BH.z+nz*d}
 g.attributes.position.needsUpdate=true;diskMat.uniforms.t.value=t;diskMat.uniforms.k.value=suck;halo.material.opacity=suck*.5;
 core.scale.setScalar(.6+suck*.8+Math.sin(t*20)*.02*suck);cam.position.x=Math.sin(t*.15)*1.2;cam.lookAt(0,.3,0);
 r.render(sc,cam);requestAnimationFrame(loop)}loop();
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
</script></body></html>
