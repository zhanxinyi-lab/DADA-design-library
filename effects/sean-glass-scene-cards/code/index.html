<!DOCTYPE html>
<html lang="zh-CN">
<!-- 原创预览：玻璃场景卡片。clean-room，不是原片、截帧或房间照片。 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玻璃场景卡片</title>
<style>
  @property --wall-top { syntax: "<color>"; inherits: true; initial-value: #6a7860; }
  @property --wall-mid { syntax: "<color>"; inherits: true; initial-value: #c2b39a; }
  @property --wall-bot { syntax: "<color>"; inherits: true; initial-value: #f0e4d4; }
  @property --art-a { syntax: "<color>"; inherits: true; initial-value: #e39a55; }
  @property --art-b { syntax: "<color>"; inherits: true; initial-value: #d06a34; }
  @property --sofa-a { syntax: "<color>"; inherits: true; initial-value: #f4eee6; }
  @property --sofa-b { syntax: "<color>"; inherits: true; initial-value: #ddd4c8; }
  @property --table { syntax: "<color>"; inherits: true; initial-value: #d5cdc2; }
  @property --plant { syntax: "<color>"; inherits: true; initial-value: #4e8a58; }
  @property --win { syntax: "<number>"; inherits: true; initial-value: 1; }
  @property --lamp { syntax: "<number>"; inherits: true; initial-value: 1; }
  @property --screen { syntax: "<number>"; inherits: true; initial-value: 0; }
  @property --pend { syntax: "<number>"; inherits: true; initial-value: 0; }
  @property --path { syntax: "<number>"; inherits: true; initial-value: 0; }
  @property --frame { syntax: "<number>"; inherits: true; initial-value: 0.9; }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #14120f;
    color: #fff;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { min-height: 100%; position: relative; }
  .world {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none;
    --wall-top: #6a7860; --wall-mid: #c2b39a; --wall-bot: #f0e4d4;
    --art-a: #e39a55; --art-b: #d06a34;
    --sofa-a: #f4eee6; --sofa-b: #ddd4c8; --table: #d5cdc2; --plant: #4e8a58;
    --win: 1; --lamp: 1; --screen: 0; --pend: 0; --path: 0; --frame: 0.9;
    transition:
      --wall-top 880ms ease, --wall-mid 880ms ease, --wall-bot 880ms ease,
      --art-a 880ms ease, --art-b 880ms ease,
      --sofa-a 880ms ease, --sofa-b 880ms ease, --table 880ms ease, --plant 880ms ease,
      --win 880ms ease, --lamp 880ms ease, --screen 880ms ease, --pend 880ms ease, --path 880ms ease,
      --frame 880ms ease;
  }
  .stage[data-scene="movie"] .world {
    --wall-top: #0e1218; --wall-mid: #1a2230; --wall-bot: #10141c;
    --art-a: #2a3a52; --art-b: #1a2436;
    --sofa-a: #2a3344; --sofa-b: #222a38; --table: #1c222c; --plant: #1a2a22;
    --win: 0; --lamp: 0.12; --screen: 1; --pend: 0; --path: 0; --frame: 0.35;
  }
  .stage[data-scene="dinner"] .world {
    --wall-top: #3a261c; --wall-mid: #7a4a32; --wall-bot: #4a2e22;
    --art-a: #c46a38; --art-b: #8a4018;
    --sofa-a: #6e5348; --sofa-b: #5a4036; --table: #5a4036; --plant: #3a4030;
    --win: 0.22; --lamp: 0.18; --screen: 0; --pend: 1; --path: 0; --frame: 0.7;
  }
  .stage[data-scene="night"] .world {
    --wall-top: #0c0e12; --wall-mid: #14181e; --wall-bot: #0e1014;
    --art-a: #1a1c20; --art-b: #121418;
    --sofa-a: #1a1e24; --sofa-b: #15181e; --table: #14181c; --plant: #121814;
    --win: 0; --lamp: 0; --screen: 0; --pend: 0; --path: 1; --frame: 0.12;
  }
  .soft { position: absolute; inset: -4%; filter: blur(8px); }
  .sky, .art, .frame, .sofa, .table, .plant, .plant i, .blinds, .rug, .glow, .paths i {
    position: absolute; display: block;
  }
  .sky {
    inset: 0;
    background: linear-gradient(180deg, var(--wall-top) 0%, var(--wall-mid) 46%, var(--wall-bot) 100%);
  }
  .glow { border-radius: 50%; }
  .window {
    left: 2%; top: 8%; width: 28%; height: 48%;
    opacity: var(--win);
    background: radial-gradient(circle at 40% 45%, rgba(255, 250, 236, 0.95), rgba(255, 236, 200, 0.28) 52%, transparent 74%);
  }
  .blinds {
    left: 8%; top: 14%; width: 16%; height: 32%;
    border-radius: 2px;
    opacity: var(--win);
    background:
      linear-gradient(90deg, rgba(70, 54, 32, 0.28), transparent 7%, transparent 93%, rgba(70, 54, 32, 0.28)),
      repeating-linear-gradient(90deg, rgba(255, 248, 230, 0.28) 0 9px, rgba(255, 232, 180, 0.88) 9px 16px);
  }
  .lamp {
    left: 28%; top: 34%; width: 160px; height: 160px;
    opacity: var(--lamp);
    background: radial-gradient(circle, rgba(255, 206, 110, 0.95), rgba(255, 206, 110, 0) 68%);
  }
  .frame {
    left: 41.6%; top: 11%; width: 22.8%; height: 22%;
    border-radius: 2px;
    background: #6d4c34;
    opacity: var(--frame);
  }
  .art {
    left: 43%; top: 12.4%; width: 20%; height: 19%;
    border-radius: 2px;
    background: linear-gradient(160deg, var(--art-a), var(--art-b));
  }
  .screen {
    left: 42%; top: 11%; width: 22%; height: 22%;
    opacity: var(--screen);
    border-radius: 4px;
    background: radial-gradient(circle, rgba(214, 224, 255, 0.92), rgba(140, 166, 230, 0.35) 62%, transparent 78%);
  }
  .pend { width: 220px; height: 220px; opacity: var(--pend); background: radial-gradient(circle, rgba(255, 176, 80, 0.95), rgba(255, 140, 50, 0) 68%); }
  .pend.a { left: 34%; top: 0; }
  .pend.b { left: 50%; top: 2%; width: 180px; height: 180px; }
  .plant { right: -28px; top: 46%; width: 150px; height: 170px; }
  .plant i { border-radius: 50%; background: var(--plant); }
  .plant i:nth-child(1) { width: 96px; height: 118px; left: 24px; top: 28px; }
  .plant i:nth-child(2) { width: 72px; height: 86px; left: 0; top: 58px; }
  .plant i:nth-child(3) { width: 68px; height: 78px; left: 68px; top: 0; }
  .sofa {
    left: 10%; top: 58%; width: 80%; height: 15%;
    border-radius: 16px 16px 28px 28px;
    background: linear-gradient(180deg, var(--sofa-a), var(--sofa-b));
  }
  .sofa::before {
    content: "";
    position: absolute; left: 5%; right: 5%; top: -34%; height: 58%;
    border-radius: 14px 14px 6px 6px;
    background: var(--sofa-b);
  }
  .rug {
    left: 16%; top: 76%; width: 68%; height: 16%;
    border-radius: 50%;
    background: color-mix(in srgb, var(--wall-bot) 72%, white);
    opacity: 0.72;
  }
  .table {
    left: 33%; top: 74%; width: 34%; height: 7%;
    border-radius: 40%;
    background: var(--table);
  }
  .paths { position: absolute; left: 10%; right: 10%; bottom: 14%; height: 28px; }
  .paths i {
    width: 22px; height: 22px; border-radius: 50%;
    opacity: var(--path);
    background: radial-gradient(circle, #ffc27a, rgba(255, 160, 70, 0) 70%);
  }
  .paths i:nth-child(1) { left: 8%; }
  .paths i:nth-child(2) { left: 32%; }
  .paths i:nth-child(3) { left: 58%; }
  .paths i:nth-child(4) { left: 80%; }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0, 0, 0, 0.28) 100%);
  }

  .stack {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 1.6vh, 16px);
    padding: 28px 16px;
  }
  .card {
    position: relative;
    width: min(440px, calc(100vw - 32px));
    height: clamp(72px, 11vh, 92px);
    border: 0; padding: 0; margin: 0;
    border-radius: 999px;
    background: transparent;
    color: #fff;
    cursor: pointer;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .card:focus { outline: none; }
  .card:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .rim, .glowrim {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    padding: 2px;
    background: conic-gradient(from 24deg, #ff8fab, #ffd27a, #fff4c2, #9dffd8, #8fd4ff, #c9a6ff, #ff8fab);
    opacity: 0.42;
    -webkit-mask-image: linear-gradient(#fff 0 0), linear-gradient(#fff 0 0);
    -webkit-mask-clip: content-box, border-box;
    -webkit-mask-composite: xor;
    mask-image: linear-gradient(#fff 0 0), linear-gradient(#fff 0 0);
    mask-clip: content-box, border-box;
    mask-composite: exclude;
  }
  .glowrim { inset: -4px; padding: 6px; filter: blur(4px); opacity: 0; }
  .card[aria-checked="true"] .rim {
    background: conic-gradient(from var(--spin), #ff7d9c, #ffd27a, #fff6c4, #8dffd0, #7ecbff, #c9a6ff, #ff7d9c);
    opacity: 1;
    animation: spin 14s linear infinite;
  }
  .card[aria-checked="true"] .glowrim { opacity: 0.85; }
  @keyframes spin { to { --spin: 360deg; } }
  .glass {
    position: absolute; inset: 3px; border-radius: inherit; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      0 14px 28px rgba(0, 0, 0, 0.16);
    transition: background 880ms ease, backdrop-filter 880ms ease, -webkit-backdrop-filter 880ms ease;
  }
  .glass::after {
    content: "";
    position: absolute; left: 10%; right: 10%; top: 0; height: 46%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent);
    pointer-events: none;
  }
  .card[aria-checked="true"] .glass {
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(10px) saturate(1.5) brightness(1.05);
    -webkit-backdrop-filter: blur(10px) saturate(1.5) brightness(1.05);
  }
  .card:hover .glass { background: rgba(255, 255, 255, 0.24); }
  .copy {
    position: relative; z-index: 1;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
  .name {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 4.5em; padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.62);
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.35;
  }
  .card[aria-checked="true"] .name {
    background: #fff; color: #1c1c1c; border-color: transparent;
    text-shadow: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .sub {
    display: block; margin-top: 3px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.01em;
    opacity: 0.78;
  }
  .meter {
    display: flex; align-items: baseline; justify-content: center; gap: 4px;
    margin-top: 1px;
  }
  .num {
    font-size: clamp(22px, 3vh, 28px);
    font-weight: 560; letter-spacing: -0.04em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 12px; font-weight: 500; opacity: 0.8; }
  .dot {
    position: absolute; z-index: 1;
    right: 18px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.28);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }
  .card[aria-checked="true"] .dot {
    background: #d6f25a;
    box-shadow: 0 0 8px rgba(214, 242, 90, 0.95);
  }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .world, .glass { transition: none; }
    .card[aria-checked="true"] .rim { animation: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass, .card[aria-checked="true"] .glass, .card:hover .glass {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: #2c2a28;
    }
    .stage[data-scene="morning"] .card[aria-checked="true"] .glass { background: #5a4636; }
    .stage[data-scene="movie"] .card[aria-checked="true"] .glass { background: #121820; }
    .stage[data-scene="dinner"] .card[aria-checked="true"] .glass { background: #4a2e22; }
    .stage[data-scene="night"] .card[aria-checked="true"] .glass { background: #101216; }
  }
</style>
</head>
<body>
<div class="stage" id="stage" data-scene="morning">
  <div class="world" aria-hidden="true">
    <div class="soft">
      <div class="sky"></div>
      <div class="glow window"></div>
      <div class="blinds"></div>
      <div class="glow lamp"></div>
      <div class="frame"></div>
      <div class="art"></div>
      <div class="glow screen"></div>
      <div class="glow pend a"></div>
      <div class="glow pend b"></div>
      <div class="plant"><i></i><i></i><i></i></div>
      <div class="sofa"></div>
      <div class="rug"></div>
      <div class="table"></div>
      <div class="paths"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="vignette"></div>
  </div>
  <div class="stack" id="scenes" role="radiogroup" aria-label="房间场景">
    <button class="card" type="button" role="radio" data-scene="morning" aria-checked="true" tabindex="0">
      <span class="glowrim" aria-hidden="true"></span>
      <span class="rim" aria-hidden="true"></span>
      <span class="glass">
        <span class="copy">
          <span class="name">Morning</span>
          <span class="sub">Blinds open · 5000 K</span>
          <span class="meter"><span class="num">80</span><span class="unit">% light</span></span>
        </span>
        <span class="dot" aria-hidden="true"></span>
      </span>
    </button>
    <button class="card" type="button" role="radio" data-scene="movie" aria-checked="false" tabindex="-1">
      <span class="glowrim" aria-hidden="true"></span>
      <span class="rim" aria-hidden="true"></span>
      <span class="glass">
        <span class="copy">
          <span class="name">Movie</span>
          <span class="sub">Projector · blinds down</span>
          <span class="meter"><span class="num">12</span><span class="unit">% light</span></span>
        </span>
        <span class="dot" aria-hidden="true"></span>
      </span>
    </button>
    <button class="card" type="button" role="radio" data-scene="dinner" aria-checked="false" tabindex="-1">
      <span class="glowrim" aria-hidden="true"></span>
      <span class="rim" aria-hidden="true"></span>
      <span class="glass">
        <span class="copy">
          <span class="name">Dinner</span>
          <span class="sub">Pendant lights · 2700 K</span>
          <span class="meter"><span class="num">46</span><span class="unit">% light</span></span>
        </span>
        <span class="dot" aria-hidden="true"></span>
      </span>
    </button>
    <button class="card" type="button" role="radio" data-scene="night" aria-checked="false" tabindex="-1">
      <span class="glowrim" aria-hidden="true"></span>
      <span class="rim" aria-hidden="true"></span>
      <span class="glass">
        <span class="copy">
          <span class="name">Night</span>
          <span class="sub">Path lights only</span>
          <span class="meter"><span class="num">4</span><span class="unit">% light</span></span>
        </span>
        <span class="dot" aria-hidden="true"></span>
      </span>
    </button>
  </div>
  <p class="sr" id="status" aria-live="polite"></p>
</div>
<script>
'use strict';
(function () {
  var stage = document.getElementById('stage');
  var group = document.getElementById('scenes');
  var status = document.getElementById('status');
  var cards = Array.prototype.slice.call(group.querySelectorAll('.card'));

  function select(scene, announce) {
    cards.forEach(function (card) {
      var on = card.getAttribute('data-scene') === scene;
      card.setAttribute('aria-checked', on ? 'true' : 'false');
      card.tabIndex = on ? 0 : -1;
    });
    stage.setAttribute('data-scene', scene);
    if (announce) {
      var current = cards.filter(function (card) { return card.getAttribute('data-scene') === scene; })[0];
      status.textContent = current ? current.innerText.replace(/\s+/g, ' ').trim() : scene;
    }
  }

  group.addEventListener('click', function (event) {
    var card = event.target.closest('.card');
    if (!card || !group.contains(card)) return;
    select(card.getAttribute('data-scene'), true);
  });

  group.addEventListener('keydown', function (event) {
    var keys = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(event.key) === -1) return;
    event.preventDefault();
    var index = cards.findIndex(function (card) { return card.getAttribute('aria-checked') === 'true'; });
    if (index < 0) index = 0;
    var next = index;
    if (event.key === 'ArrowDown' || event.key === 'ArrowRight') next = (index + 1) % cards.length;
    else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') next = (index - 1 + cards.length) % cards.length;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = cards.length - 1;
    select(cards[next].getAttribute('data-scene'), true);
    cards[next].focus();
  });
})();
</script>
</body>
</html>
