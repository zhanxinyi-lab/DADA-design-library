<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面折成纸飞机</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0f2cf6;
      color: #fff;
      font: 15px/1.45 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #send {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #0f2cf6;
      color: inherit;
      cursor: pointer;
    }
    #send:focus { outline: none; }
    #send:focus-visible { outline: 2px solid #fff; outline-offset: -6px; }
    #view { display: block; width: 100%; height: 100%; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (forced-colors: active) {
      #send:focus-visible { outline: 2px solid Highlight; }
    }
  </style>
</head>
<body>
  <button type="button" id="send" aria-pressed="false">
    <span class="sr" id="name">把这页折成纸飞机，送进收件箱</span>
    <canvas id="view" width="720" height="362" aria-hidden="true"></canvas>
  </button>
  <p class="sr" id="live" aria-live="polite"></p>
  <script>
    (function () {
      var BLUE = "#0f2cf6";
      var COLS = 4;
      var ROWS = 6;
      var DURATION = 4600;
      var btn = document.getElementById("send");
      var nameEl = document.getElementById("name");
      var live = document.getElementById("live");
      var canvas = document.getElementById("view");
      var ctx = canvas.getContext("2d");
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var sheet = document.createElement("canvas");
      var sheetCtx = sheet.getContext("2d");
      var sheetKey = "";
      var progress = 0;
      var raf = 0;
      var gen = 0;
      var said = false;

      function clamp(n, a, b) {
        if (n < a) return a;
        if (n > b) return b;
        return n;
      }
      function smooth(t) {
        var x = clamp(t, 0, 1);
        return x * x * (3 - 2 * x);
      }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function ease(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }
      function quad(a, b, c, t) {
        var u = 1 - t;
        return u * u * a + 2 * u * t * b + t * t * c;
      }
      function reduced() { return motion.matches; }
      function shown() { return reduced() ? 1 : progress; }

      function stop() {
        gen += 1;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
      }

      function wrap(g, text, x, y, maxW, lineH) {
        var rest = text;
        var row = 0;
        while (rest) {
          var take = rest.length;
          while (take > 1 && g.measureText(rest.slice(0, take)).width > maxW) take -= 1;
          var cut = rest.lastIndexOf(" ", take);
          if (cut > 0 && take < rest.length) take = cut;
          g.fillText(rest.slice(0, take).trim(), x, y + row * lineH);
          rest = rest.slice(take).trim();
          row += 1;
          if (row > 8) break;
        }
        return row;
      }

      function ensureSheet(w, h) {
        var key = w + "x" + h;
        if (key === sheetKey) return;
        sheetKey = key;
        sheet.width = Math.max(2, Math.round(w));
        sheet.height = Math.max(2, Math.round(h));
        var g = sheetCtx;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = "#f6f6f4";
        g.fillRect(0, 0, sheet.width, sheet.height);
        var col = Math.min(sheet.width * 0.46, sheet.height * 0.72);
        var x = sheet.width * 0.27;
        var y = sheet.height * 0.2;
        var title = Math.max(18, sheet.width * 0.028);
        var body = Math.max(13, sheet.width * 0.016);
        g.fillStyle = "#1c1c1c";
        g.font = "700 " + title + "px system-ui, 'Segoe UI', 'PingFang SC', sans-serif";
        g.textBaseline = "top";
        g.fillText("一张短笺", x, y);
        g.font = "400 " + body + "px system-ui, 'Segoe UI', 'PingFang SC', sans-serif";
        g.fillStyle = "#3f3f3f";
        var lines = [
          "这几行只是占位，不是名单。",
          "点一下，或按回车、空格。",
          "整页会折出折痕，收成纸飞机。",
          "然后飞进右上角的线框收件箱。"
        ];
        var ly = y + title * 1.8;
        var i;
        for (i = 0; i < lines.length; i++) {
          var used = wrap(g, lines[i], x, ly, col, body * 1.45);
          ly += used * body * 1.45 + body * 0.45;
        }
      }

      function inboxBox(vw, vh) {
        var margin = Math.max(8, Math.min(20, vw * 0.045));
        var w = Math.min(vw * 0.34, 160);
        var h = w * 0.62;
        var s = h * 0.78;
        var gap = Math.max(6, w * 0.12);
        var budget = Math.max(40, vw - margin * 2);
        var need = s + gap + w;
        if (need > budget) {
          var k = budget / need;
          w *= k;
          h *= k;
          s *= k;
          gap *= k;
        }
        var x = vw - margin - w;
        var y = Math.max(margin, Math.min(vh * 0.14, vh * 0.22));
        if (y + h + 32 > vh) y = Math.max(margin, vh - h - 32);
        return { x: x, y: y, w: w, h: h, s: s, gap: gap };
      }

      function localPoint(u, v, bend, morph, page) {
        var W = page.w;
        var H = page.h;
        var x = (u - 0.5) * W;
        var y = (0.5 - v) * H;
        var z = 0;
        if (u > 0.5) {
          var ang = bend * 1.05;
          var dx = x;
          x = Math.cos(ang) * dx;
          z = Math.sin(ang) * dx;
        }
        var side = (u - 0.5) * 2;
        var s = Math.abs(side);
        var back = v;
        var unit = Math.min(W, H);
        var length = unit * 0.9;
        var wing = unit * 0.58;
        var tip = 0.72;
        var width = back < tip ? back / tip : 1 - (back - tip) * 0.35;
        var dxn = (0.46 - back) * length - s * length * 0.16 * Math.max(0, back - 0.2);
        var dyn = (side < 0 ? -1 : 1) * s * wing * 0.5 * width;
        var dzn = (1 - s) * unit * 0.025 - s * wing * 0.06 * width;
        return [lerp(x, dxn, morph), lerp(y, dyn, morph), lerp(z, dzn, morph)];
      }

      function rotate(p, rx, ry, rz) {
        var x = p[0];
        var y = p[1];
        var z = p[2];
        var cx = Math.cos(rx);
        var sx = Math.sin(rx);
        var y1 = y * cx - z * sx;
        var z1 = y * sx + z * cx;
        var cy = Math.cos(ry);
        var sy = Math.sin(ry);
        var x2 = x * cy + z1 * sy;
        var z2 = -x * sy + z1 * cy;
        var cz = Math.cos(rz);
        var sz = Math.sin(rz);
        return [x2 * cz - y1 * sz, x2 * sz + y1 * cz, z2];
      }

      function poseOf(p, box, vw, vh) {
        var fold = clamp(p / 0.62, 0, 1);
        var bend = smooth(clamp(fold / 0.42, 0, 1));
        var morph = smooth(clamp((fold - 0.46) / 0.54, 0, 1));
        var fly = smooth(clamp((p - 0.4) / 0.6, 0, 1));
        var aim = smooth(clamp((p - 0.34) / 0.2, 0, 1));
        var endX = box.x + box.w * 0.48 - vw / 2;
        var endY = box.y + box.h * 0.58 - vh / 2;
        var unit = Math.min(vw, vh);
        var land = clamp(Math.min(box.w, box.h) * 0.9 / (unit * 0.7), 0.05, 0.16);
        return {
          fold: fold,
          bend: bend,
          morph: morph,
          fly: fly,
          rx: 0.18 * aim,
          ry: -0.12 * aim,
          rz: -0.48 * aim * (1 - fly * 0.45),
          s: lerp(1, land, smooth(fly)),
          ox: quad(0, endX * 0.2, endX, fly),
          oy: quad(0, Math.min(vh * 0.08, endY * 0.35), endY, fly)
        };
      }

      function project(p, pose, camZ) {
        var r = rotate(p, pose.rx, pose.ry, pose.rz);
        var x = r[0] * pose.s;
        var y = r[1] * pose.s;
        var z = r[2] * pose.s;
        var denom = camZ - z;
        if (denom < 80) denom = 80;
        var k = camZ / denom;
        return { x: x * k, y: y * k, z: z, k: k };
      }

      function drawTri(img, a, b, c, ta, tb, tc, front, shade) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y);
        ctx.closePath();
        if (!front) {
          ctx.fillStyle = "#e4e0d8";
          ctx.fill();
          return;
        }
        ctx.fillStyle = "#f6f6f4";
        ctx.fill();
        var den = ta.x * (tb.y - tc.y) + tb.x * (tc.y - ta.y) + tc.x * (ta.y - tb.y);
        if (Math.abs(den) < 0.01) return;
        function coeff(s0, s1, s2) {
          return [
            (s0 * (tb.y - tc.y) + s1 * (tc.y - ta.y) + s2 * (ta.y - tb.y)) / den,
            (s0 * (tc.x - tb.x) + s1 * (ta.x - tc.x) + s2 * (tb.x - ta.x)) / den,
            (s0 * (tb.x * tc.y - tc.x * tb.y) + s1 * (tc.x * ta.y - ta.x * tc.y) + s2 * (ta.x * tb.y - tb.x * ta.y)) / den
          ];
        }
        var X = coeff(a.x, b.x, c.x);
        var Y = coeff(a.y, b.y, c.y);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y);
        ctx.closePath();
        ctx.clip();
        ctx.transform(X[0], Y[0], X[1], Y[1], X[2], Y[2]);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
        if (shade > 0.03) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.closePath();
          ctx.fillStyle = "rgba(40, 40, 48, " + shade + ")";
          ctx.fill();
        }
      }

      function growTri(a, b, c, amt) {
        var cx = (a.x + b.x + c.x) / 3;
        var cy = (a.y + b.y + c.y) / 3;
        function g(p) {
          var dx = p.x - cx;
          var dy = p.y - cy;
          var len = Math.hypot(dx, dy) || 1;
          return { x: p.x + dx / len * amt, y: p.y + dy / len * amt };
        }
        return [g(a), g(b), g(c)];
      }

      function drawInbox(box, p) {
        var x = box.x;
        var y = box.y;
        var w = box.w;
        var h = box.h;
        ctx.lineWidth = Math.max(1.25, w * 0.012);
        ctx.strokeStyle = "#fff";
        ctx.lineJoin = "round";
        var gap = box.gap;
        var s = box.s;
        var sx = x - gap - s;
        var sy = y + (h - s) * 0.45;
        if (sx > 8) ctx.strokeRect(sx, sy, s, s * 0.92);
        ctx.beginPath();
        ctx.moveTo(x + w * 0.16, y);
        ctx.lineTo(x + w, y + h * 0.08);
        ctx.lineTo(x + w * 0.84, y + h);
        ctx.lineTo(x, y + h * 0.74);
        ctx.closePath();
        ctx.stroke();
        var arrive = smooth(clamp((p - 0.9) / 0.1, 0, 1));
        ctx.font = "italic 700 " + Math.max(13, Math.round(w * 0.15)) + "px system-ui, 'Segoe UI', 'PingFang SC', sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#fff";
        var tx = x + w * 0.04;
        var ty = y + h + Math.max(3, h * 0.08);
        ctx.globalAlpha = 1 - arrive;
        ctx.fillText("收件箱", tx, ty);
        ctx.globalAlpha = arrive;
        ctx.fillText("已送达", tx, ty);
        ctx.globalAlpha = 1;
      }

      function paint() {
        var rect = canvas.getBoundingClientRect();
        var vw = Math.max(1, rect.width);
        var vh = Math.max(1, rect.height);
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var bw = Math.max(1, Math.round(vw * dpr));
        var bh = Math.max(1, Math.round(vh * dpr));
        if (canvas.width !== bw || canvas.height !== bh) {
          canvas.width = bw;
          canvas.height = bh;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, vw, vh);
        ctx.fillStyle = BLUE;
        ctx.fillRect(0, 0, vw, vh);

        var p = shown();
        var box = inboxBox(vw, vh);
        var pose = poseOf(p, box, vw, vh);
        var page = { w: vw * 1.04, h: vh * 1.04 };
        ensureSheet(Math.round(page.w * dpr), Math.round(page.h * dpr));
        var camZ = Math.max(vw, vh) * 2.6;
        function place(u, v) {
          var local = localPoint(u, v, pose.bend, pose.morph, page);
          var pr = project(local, pose, camZ);
          return {
            x: vw / 2 + pr.x + pose.ox,
            y: vh / 2 - pr.y + pose.oy,
            z: pr.z,
            tu: u * sheet.width,
            tv: v * sheet.height,
            lx: local[0],
            ly: local[1],
            lz: local[2]
          };
        }
        var pts = new Array((COLS + 1) * (ROWS + 1));
        var i, j, n;
        for (j = 0; j <= ROWS; j++) {
          for (i = 0; i <= COLS; i++) pts[j * (COLS + 1) + i] = place(i / COLS, j / ROWS);
        }

        var anchor = project([0, 0, 0], pose, camZ);
        var ax = vw / 2 + anchor.x + pose.ox;
        var ay = vh / 2 - anchor.y + pose.oy;
        if (p > 0.04 && p < 0.98) {
          var shadowA = Math.min(0.34, p * 0.5) * (1 - smooth(clamp((p - 0.78) / 0.2, 0, 1)) * 0.45);
          ctx.save();
          ctx.translate(ax, ay + Math.max(18, vh * 0.08) * (0.35 + pose.fly));
          ctx.scale(1, 0.38);
          ctx.fillStyle = "rgba(0, 18, 120, " + shadowA + ")";
          ctx.beginPath();
          ctx.ellipse(0, 0, page.w * 0.22 * pose.s + 30, page.w * 0.22 * pose.s + 30, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        var cover = ax > box.x - box.w * 0.2 && ax < box.x + box.w && ay > box.y - box.h && ay < box.y + box.h * 1.15 && pose.fly > 0.72;
        if (!cover) drawInbox(box, p);

        var tris = [];
        for (j = 0; j < ROWS; j++) {
          for (i = 0; i < COLS; i++) {
            var a = j * (COLS + 1) + i;
            var b = a + 1;
            var c = a + (COLS + 1);
            var d = c + 1;
            tris.push([a, b, d]);
            tris.push([a, d, c]);
          }
        }
        tris.sort(function (t1, t2) {
          return (pts[t1[0]].z + pts[t1[1]].z + pts[t1[2]].z) - (pts[t2[0]].z + pts[t2[1]].z + pts[t2[2]].z);
        });
        for (n = 0; n < tris.length; n++) {
          var tri = tris[n];
          var p0 = pts[tri[0]];
          var p1 = pts[tri[1]];
          var p2 = pts[tri[2]];
          var ax1 = p1.lx - p0.lx;
          var ay1 = p1.ly - p0.ly;
          var az1 = p1.lz - p0.lz;
          var bx1 = p2.lx - p0.lx;
          var by1 = p2.ly - p0.ly;
          var bz1 = p2.lz - p0.lz;
          var nz = ax1 * by1 - ay1 * bx1;
          var nx = ay1 * bz1 - az1 * by1;
          var ny = az1 * bx1 - ax1 * bz1;
          var nl = Math.hypot(nx, ny, nz) || 1;
          var light = (nx / nl) * -0.15 + (ny / nl) * 0.35 + (nz / nl) * -0.9;
          var front = nz < 0;
          var shade = front ? clamp(0.16 - light * 0.35, 0, 0.18) : 0;
          if (front && p0.lx > 2 && pose.morph < 0.2) shade = Math.max(shade, pose.bend * 0.14);
          var grown = growTri(p0, p1, p2, 1.1);
          drawTri(sheet, grown[0], grown[1], grown[2], { x: p0.tu, y: p0.tv }, { x: p1.tu, y: p1.tv }, { x: p2.tu, y: p2.tv }, front, shade);
        }
        if (pose.bend > 0.08 && pose.morph < 0.85) {
          var ct = place(0.5, 0);
          var cb = place(0.5, 1);
          ctx.beginPath();
          ctx.moveTo(ct.x, ct.y);
          ctx.lineTo(cb.x, cb.y);
          ctx.strokeStyle = "rgba(60, 64, 78, " + ((1 - pose.morph) * (0.2 + pose.bend * 0.55)) + ")";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        if (cover) drawInbox(box, p);

        var done = p >= 0.98;
        btn.setAttribute("aria-pressed", done ? "true" : "false");
        nameEl.textContent = done ? "已送达" : "把这页折成纸飞机，送进收件箱";
        if (done && !said) {
          said = true;
          live.textContent = "已送达";
        }
      }

      function confirmSend() {
        if (reduced()) {
          stop();
          progress = 1;
          paint();
          return;
        }
        if (raf || progress >= 1) return;
        var from = progress;
        var t0 = performance.now();
        var id = ++gen;
        function frame(now) {
          if (id !== gen) return;
          if (reduced()) {
            raf = 0;
            progress = 1;
            paint();
            return;
          }
          var t = Math.min(1, (now - t0) / DURATION);
          progress = from + (1 - from) * ease(t);
          paint();
          if (t < 1) raf = requestAnimationFrame(frame);
          else raf = 0;
        }
        raf = requestAnimationFrame(frame);
      }

      function onMotion() {
        stop();
        if (reduced()) progress = 1;
        paint();
      }

      btn.addEventListener("click", confirmSend);
      window.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
        if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
        e.preventDefault();
        confirmSend();
      });
      if (motion.addEventListener) motion.addEventListener("change", onMotion);
      else if (motion.addListener) motion.addListener(onMotion);
      window.addEventListener("resize", function () { paint(); });

      var at = Number(new URLSearchParams(location.search).get("at"));
      if (reduced()) progress = 1;
      else if (isFinite(at)) progress = clamp(at, 0, 1);
      paint();
    })();
  </script>
</body>
</html>
