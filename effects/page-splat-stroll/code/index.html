<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页上的软点散步</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#140e18;color:#f3e6d4;font:14px/1.4 ui-sans-serif,system-ui,"PingFang SC","Noto Sans SC",sans-serif}
body{overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:2;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.top{top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0}
.card{width:min(440px,calc(100% - 24px));padding:10px 12px;border-radius:14px;background:rgba(18,10,16,.72);border:1px solid rgba(243,230,212,.16);backdrop-filter:blur(8px)}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.04em}
p{margin:4px 0 0;color:#d9c3ae;font-size:12px}
.bottom{bottom:0;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.controls{width:min(520px,100%);pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{touch-action:manipulation;appearance:none;border:1px solid rgba(243,230,212,.28);background:rgba(18,10,16,.78);color:#f3e6d4;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover,button:focus-visible{border-color:#f0b36a;outline:2px solid #f0b36a;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;border-color:rgba(243,230,212,.28)}
#status{width:100%;text-align:center;min-height:1.2em;color:#f0b36a;font-size:12px}
@media (max-width:360px){h1{font-size:15px}button{padding:7px 10px}}
</style>
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>
<div class="hud top"><div class="card"><h1>网页上的软点散步</h1><p>原创石柱长廊。拖动张望，或用按钮、陀螺仪。不是原帖里的医院和角色。</p></div></div>
<div class="hud bottom"><div class="card controls">
<button type="button" id="left">向左看</button>
<button type="button" id="right">向右看</button>
<button type="button" id="up">抬头</button>
<button type="button" id="down">低头</button>
<button type="button" id="reset">回正</button>
<button type="button" id="walk">停步</button>
<button type="button" id="gyro">启用陀螺仪</button>
<div id="status" role="status" aria-live="polite"></div>
</div></div>
<script>
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
const COLORS = ['42,32,28','92,74,62','168,142,112','58,46,40','96,78,66','255,150,70','255,214,150','44,58,92','122,146,196','230,210,190','92,48,64','196,140,150','10,6,8','74,58,72'];
const sprites = COLORS.map((rgb) => {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const rad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  rad.addColorStop(0, `rgba(${rgb},.95)`);
  rad.addColorStop(.42, `rgba(${rgb},.42)`);
  rad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = rad;
  g.fillRect(0, 0, size, size);
  return c;
});

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const env = [];
const rand = mulberry32(211763);
function blob(x, y, z, r, squash, color, alpha) {
  env.push({ x, y, z, r, squash, color, alpha });
}
for (let z = 0.2; z <= 13.2; z += 0.46) {
  for (let x = -2.3; x <= 2.3; x += 0.46) {
    const edge = Math.abs(x) > 1.65;
    const speck = rand() > 0.82;
    blob(x + (rand() - 0.5) * 0.05, 0, z, 0.28, 0.24, edge ? 0 : speck ? 4 : 3, edge ? 0.55 : 0.72);
  }
}
for (let i = 0; i < 7; i++) {
  const z = 2.1 + i * 1.55;
  for (const side of [-1, 1]) {
    const x = side * 1.62;
    for (let k = 0; k < 8; k++) {
      blob(x + (rand() - 0.5) * 0.06, 0.16 + k * 0.26, z + (rand() - 0.5) * 0.06, 0.24 - k * 0.006, 1, k % 3 === 0 ? 2 : 1, 0.88);
    }
    blob(x, 2.28, z, 0.36, 0.42, 2, 0.8);
  }
  blob(0, 2.15, z + 0.78, 0.1, 1, 6, 0.95);
  blob(0, 2.15, z + 0.78, 0.32, 1, 5, 0.5);
}
for (let a = 0; a < 18; a++) {
  const ang = (a / 18) * Math.PI;
  blob(Math.cos(ang) * 1.15, 0.4 + Math.sin(ang) * 1.35, 12.4, 0.22, 1, a % 2 ? 12 : 13, 0.75);
}
for (let i = 0; i < 36; i++) blob((rand() - 0.5) * 4, 0.4 + rand() * 2.2, 1 + rand() * 11, 0.035 + rand() * 0.03, 1, rand() > 0.5 ? 6 : 2, 0.35);

let width = 1;
let height = 1;
let lookX = 0;
let lookY = 0;
let paused = false;
let reduceOn = reduceQuery.matches;
let gyroOn = false;
let raf = 0;
let clock = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, window.innerWidth);
  height = Math.max(1, window.innerHeight);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function say(text) { statusEl.textContent = text; }
function project(x, y, z, yaw, pitch) {
  const cy = Math.cos(yaw);
  const sy = Math.sin(yaw);
  const cp = Math.cos(pitch);
  const sp = Math.sin(pitch);
  const dx = x;
  const dy = y - 1.42;
  const dz = z + 0.15;
  const x1 = cy * dx + sy * dz;
  const z1 = -sy * dx + cy * dz;
  const y1 = cp * dy - sp * z1;
  const z2 = sp * dy + cp * z1;
  if (z2 < 0.35) return null;
  const f = height * 0.92 / z2;
  return { x: width * 0.5 + x1 * f, y: height * 0.46 - y1 * f, f, z: z2 };
}
function pushBlob(draw, x, y, z, r, squash, color, alpha, yaw, pitch) {
  if (alpha < 0.02) return;
  const p = project(x, y, z, yaw, pitch);
  if (!p) return;
  const fog = Math.min(1, Math.max(0, (p.z - 1.1) / 11));
  const radius = r * p.f;
  if (radius < 0.3 || radius > height) return;
  draw.push({ x: p.x, y: p.y, z: p.z, w: radius * 2, h: radius * 2 * squash, color, alpha: alpha * (1 - fog * 0.82) });
}
function addFigure(draw, ox, oz, face, phase, cloak, highlight, fade, yaw, pitch) {
  if (fade < 0.02) return;
  const c = Math.cos(face);
  const s = Math.sin(face);
  const bob = Math.abs(Math.sin(phase)) * 0.035;
  const put = (lx, ly, lz, r, squash, color, alpha) => {
    pushBlob(draw, ox + lx * c - lz * s, ly + bob, oz + lx * s + lz * c, r, squash, color, alpha * fade, yaw, pitch);
  };
  put(0, 1.08, 0, 0.2, 1.2, cloak, 0.92);
  put(0, 0.84, 0.02, 0.25, 1.05, cloak, 0.88);
  put(0, 0.62, 0.03, 0.29, 0.9, highlight, 0.72);
  put(0, 1.46, 0.03, 0.125, 1.08, 9, 0.96);
  put(0, 1.54, -0.02, 0.11, 0.72, cloak, 0.84);
  for (const side of [-1, 1]) {
    const swing = Math.sin(phase + (side < 0 ? 0 : Math.PI)) * 0.5;
    const ax = side * 0.18;
    const ex = side * 0.22;
    const ez = 0.04 + swing * 0.24;
    put((ax + ex) / 2, 1.02, ez * 0.55, 0.07, 1.5, highlight, 0.8);
    put(ex, 0.78, ez, 0.055, 1, 9, 0.86);
    const leg = Math.sin(phase + (side < 0 ? Math.PI : 0));
    const thigh = leg * 0.7;
    const kneeBend = Math.max(0, -leg) * 0.9 + 0.08;
    const hx = side * 0.08;
    const hy = 0.68;
    const kx = hx;
    const ky = hy - Math.cos(thigh) * 0.34;
    const kz = Math.sin(thigh) * 0.34;
    const sang = thigh - kneeBend;
    const fx = kx;
    const fy = Math.max(0.05, ky - Math.cos(sang) * 0.32);
    const fz = kz + Math.sin(sang) * 0.32;
    put((hx + kx) / 2, (hy + ky) / 2, (0 + kz) / 2, 0.07, 1.55, cloak, 0.9);
    put((kx + fx) / 2, (ky + fy) / 2, (kz + fz) / 2, 0.055, 1.35, highlight, 0.86);
    put(fx, 0.05, fz, 0.075, 0.42, cloak, 0.9);
  }
  pushBlob(draw, ox, 0.02, oz, 0.36, 0.28, 12, 0.42 * fade, yaw, pitch);
}
function paint(now) {
  const t = paused || reduceOn ? 1.4 : now / 1000;
  clock = t;
  const yaw = lookX * 0.42;
  const pitch = -0.06 + lookY * 0.2;
  const sky = ctx.createLinearGradient(0, 0, 0, height);
  sky.addColorStop(0, '#140e18');
  sky.addColorStop(0.42, '#3c2434');
  sky.addColorStop(0.7, '#7a4638');
  sky.addColorStop(1, '#1c1210');
  ctx.globalAlpha = 1;
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
  const draw = [];
  for (const item of env) pushBlob(draw, item.x, item.y, item.z, item.r, item.squash, item.color, item.alpha, yaw, pitch);
  const approach = (t * 0.62) % 6.5;
  const az = 8.3 - approach;
  const aFade = Math.min(1, Math.max(0, (az - 1.35) / 0.7), Math.max(0, (8.3 - az) / 0.8));
  addFigure(draw, -0.28, az, Math.PI, approach * 5.4, 7, 8, aFade, yaw, pitch);
  const u = (t * 0.16) % 1;
  const bx = -1.2 + u * 2.4;
  const bFade = Math.min(1, u * 5, (1 - u) * 5);
  addFigure(draw, bx, 5.7, -Math.PI / 2, u * 16, 10, 11, bFade, yaw, pitch);
  draw.sort((a, b) => b.z - a.z);
  for (const s of draw) {
    ctx.globalAlpha = s.alpha;
    ctx.drawImage(sprites[s.color], s.x - s.w / 2, s.y - s.h / 2, s.w, s.h);
  }
  ctx.globalAlpha = 1;
}
function frame(now) {
  paint(now);
  if (!paused && !reduceOn) raf = requestAnimationFrame(frame);
}
function start() {
  cancelAnimationFrame(raf);
  if (paused || reduceOn) paint(clock * 1000);
  else raf = requestAnimationFrame(frame);
}
function nudge(x, y, label) {
  lookX = Math.max(-1, Math.min(1, lookX + x));
  lookY = Math.max(-1, Math.min(1, lookY + y));
  say(label);
  if (paused || reduceOn) paint(clock * 1000);
}
document.getElementById('left').addEventListener('click', () => nudge(-0.28, 0, '向左看'));
document.getElementById('right').addEventListener('click', () => nudge(0.28, 0, '向右看'));
document.getElementById('up').addEventListener('click', () => nudge(0, -0.28, '抬头'));
document.getElementById('down').addEventListener('click', () => nudge(0, 0.28, '低头'));
document.getElementById('reset').addEventListener('click', () => { lookX = 0; lookY = 0; say('视线回正'); if (paused || reduceOn) paint(clock * 1000); });
const walkBtn = document.getElementById('walk');
function syncWalkControl() {
  if (reduceOn) {
    walkBtn.disabled = true;
    walkBtn.textContent = '已停步';
    walkBtn.title = '系统开启了减少动态，不能从这里恢复散步';
    say('系统开启了减少动态，散步保持静止。关闭该设置后，才会按暂停状态恢复。');
    return;
  }
  walkBtn.disabled = false;
  walkBtn.title = '';
  walkBtn.textContent = paused ? '继续走' : '停步';
}
walkBtn.addEventListener('click', () => {
  if (reduceOn || walkBtn.disabled) return;
  paused = !paused;
  syncWalkControl();
  say(paused ? '已停步' : '继续散步');
  start();
});
document.getElementById('gyro').addEventListener('click', async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const state = await DeviceOrientationEvent.requestPermission();
      if (state !== 'granted') { say('没有拿到陀螺仪权限'); return; }
    }
    if (typeof DeviceOrientationEvent === 'undefined') { say('这台设备没有陀螺仪'); return; }
    if (!gyroOn) {
      window.addEventListener('deviceorientation', (event) => {
        if (event.gamma == null || event.beta == null) return;
        lookX = Math.max(-1, Math.min(1, event.gamma / 32));
        lookY = Math.max(-1, Math.min(1, (event.beta - 42) / 36));
        if (paused || reduceOn) paint(clock * 1000);
      });
      gyroOn = true;
    }
    say('陀螺仪已启用，转动设备张望');
  } catch { say('这台设备不能启用陀螺仪'); }
});
window.addEventListener('pointermove', (event) => {
  if (event.target.closest('button')) return;
  const rect = canvas.getBoundingClientRect();
  lookX = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
  lookY = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
  if (paused || reduceOn) paint(clock * 1000);
});
reduceQuery.addEventListener('change', () => {
  reduceOn = reduceQuery.matches;
  syncWalkControl();
  if (!reduceOn) say(paused ? '减少动态已关闭，当前仍停步' : '减少动态已关闭，继续散步');
  start();
});
window.addEventListener('resize', () => { resize(); paint(clock * 1000); });
resize();
syncWalkControl();
start();
</script>
</body>
</html>
