<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>伪彩渐变</title>
  <style>
    :root {
      --ink: #161616;
      --bolt: #f6f3ec;
      --panel: rgba(14, 14, 16, 0.84);
      --line: rgba(255, 255, 255, 0.2);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #d23a22;
      color: #f6f3ec;
      font: 15px/1.35 "Segoe UI", system-ui, sans-serif;
    }
    .stage {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: linear-gradient(#d23a22, #f0c14a 46%, #7ddea0);
      touch-action: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .mark {
      position: absolute;
      left: 50%;
      top: 46%;
      width: min(92%, 680px);
      transform: translate(-50%, -54%);
      color: var(--ink);
      pointer-events: none;
    }
    .mark svg { display: block; width: 100%; height: auto; }
    .bolts { fill: none; stroke: var(--bolt); stroke-width: 3.5; stroke-linejoin: round; }
    .bar {
      flex: none;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }
    .switch {
      display: flex;
      flex: none;
      gap: 6px;
    }
    button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: #f6f3ec;
      color: #161616;
      border-color: #f6f3ec;
    }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid #f6f3ec; outline-offset: 3px; }
    .readout {
      flex: 1 1 160px;
      min-width: 0;
      margin: 0;
      font-variant-numeric: tabular-nums;
    }
    .readout small {
      display: block;
      margin-top: 2px;
      color: rgba(246, 243, 236, 0.72);
      font-size: 12px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="mark" id="mark"></div>
  </main>
  <div class="bar">
    <div class="switch" role="group" aria-label="色表">
      <button type="button" id="jet" aria-pressed="true">Jet</button>
      <button type="button" id="turbo" aria-pressed="false">Turbo</button>
    </div>
    <p class="readout" id="readout"><span id="state">Jet · 中心 78%</span><small>方向键与按钮切换同一色表，指针移动改映射中心</small></p>
  </div>
  <script>
    const TURBO = [
      [0, 48, 18, 59],
      [0.1, 62, 73, 176],
      [0.2, 33, 144, 235],
      [0.3, 24, 190, 214],
      [0.4, 30, 220, 160],
      [0.5, 90, 235, 80],
      [0.6, 170, 230, 40],
      [0.7, 225, 200, 30],
      [0.8, 245, 150, 25],
      [0.9, 220, 70, 20],
      [1, 122, 4, 3]
    ];
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d", { alpha: false });
    const jetBtn = document.getElementById("jet");
    const turboBtn = document.getElementById("turbo");
    const state = document.getElementById("state");
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

    let center = 0.78;
    let table = "jet";
    let mix = 0;
    let blend = 0;

    function clamp01(v) { return Math.min(1, Math.max(0, v)); }

    function jet(t) {
      const band = (k) => clamp01(1.5 - Math.abs(4 * t - k));
      return [band(3), band(2), band(1)];
    }

    function turbo(t) {
      let i = 1;
      while (i < TURBO.length - 1 && TURBO[i][0] < t) i += 1;
      const a = TURBO[i - 1];
      const b = TURBO[i];
      const u = (t - a[0]) / (b[0] - a[0] || 1);
      return [1, 2, 3].map((c) => (a[c] + (b[c] - a[c]) * u) / 255);
    }

    function sample(t) {
      const a = jet(t);
      const b = turbo(t);
      return a.map((v, i) => v + (b[i] - v) * mix);
    }

    function css(rgb) {
      return "rgb(" + rgb.map((v) => Math.round(clamp01(v) * 255)).join(",") + ")";
    }

    function luminance(rgb) {
      const f = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
      const [r, g, b] = rgb.map(f);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function paint() {
      const w = canvas.width;
      const h = canvas.height;
      if (!ctx || w < 1 || h < 1) return;
      const span = 0.58;
      const g = ctx.createLinearGradient(0, 0, 0, h);
      for (let i = 0; i <= 28; i += 1) {
        const ny = i / 28;
        g.addColorStop(ny, css(sample(clamp01(center - (ny - 0.5) * span))));
      }
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      const inkDark = luminance(sample(center)) > 0.42;
      document.documentElement.style.setProperty("--ink", inkDark ? "#161616" : "#f6f3ec");
      document.documentElement.style.setProperty("--bolt", inkDark ? "#f6f3ec" : "#161616");
      state.textContent = (table === "jet" ? "Jet" : "Turbo") + " · 中心 " + Math.round(center * 100) + "%";
      stage.dataset.table = table;
      stage.dataset.center = center.toFixed(3);
      stage.dataset.mix = mix.toFixed(3);
      stage.dataset.blending = blend ? "1" : "0";
    }

    function commit() {
      state.textContent = (table === "jet" ? "Jet" : "Turbo") + " · 中心 " + Math.round(center * 100) + "%";
      stage.dataset.table = table;
      stage.dataset.center = center.toFixed(3);
      stage.dataset.mix = mix.toFixed(3);
      stage.dataset.blending = blend ? "1" : "0";
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, stage.clientWidth);
      const h = Math.max(1, stage.clientHeight);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      paint();
    }

    function reduced() { return motionQuery.matches; }

    function setTable(next) {
      table = next;
      jetBtn.setAttribute("aria-pressed", next === "jet" ? "true" : "false");
      turboBtn.setAttribute("aria-pressed", next === "turbo" ? "true" : "false");
      const target = next === "turbo" ? 1 : 0;
      if (blend) cancelAnimationFrame(blend);
      blend = 0;
      commit();
      if (reduced() || Math.abs(mix - target) < 0.001) {
        mix = target;
        paint();
        return;
      }
      const from = mix;
      const t0 = performance.now();
      const step = (now) => {
        if (reduced()) {
          mix = target;
          blend = 0;
          paint();
          return;
        }
        const u = Math.min(1, (now - t0) / 180);
        mix = from + (target - from) * u;
        if (u >= 1) {
          mix = target;
          blend = 0;
        } else {
          blend = requestAnimationFrame(step);
        }
        paint();
      };
      blend = requestAnimationFrame(step);
    }

    function setCenter(value) {
      center = clamp01(value);
      paint();
    }

    function pointerCenter(event) {
      const rect = stage.getBoundingClientRect();
      if (rect.width <= 0) return;
      setCenter((event.clientX - rect.left) / rect.width);
    }

    stage.addEventListener("pointerdown", pointerCenter);
    stage.addEventListener("pointermove", (event) => {
      if (event.pointerType === "mouse" || event.buttons) pointerCenter(event);
    });

    jetBtn.addEventListener("click", () => setTable("jet"));
    turboBtn.addEventListener("click", () => setTable("turbo"));

    document.addEventListener("keydown", (event) => {
      const next = { ArrowLeft: "jet", ArrowUp: "jet", ArrowRight: "turbo", ArrowDown: "turbo" }[event.key];
      if (!next) return;
      event.preventDefault();
      setTable(next);
      const focus = document.activeElement;
      if (focus === jetBtn || focus === turboBtn) (next === "jet" ? jetBtn : turboBtn).focus();
    });

    motionQuery.addEventListener("change", () => {
      if (reduced()) setTable(table);
    });

    function svg(name, attrs) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    }

    function thick(x1, y1, x2, y2, width) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const px = (-dy / len) * width / 2;
      const py = (dx / len) * width / 2;
      return [x1 + px, y1 + py, x2 + px, y2 + py, x2 - px, y2 - py, x1 - px, y1 - py]
        .map((n) => n.toFixed(1)).join(" ");
    }

    function hex(cx, cy, radius) {
      const pts = [];
      for (let i = 0; i < 6; i += 1) {
        const a = Math.PI / 6 + i * Math.PI / 3;
        pts.push((cx + Math.cos(a) * radius).toFixed(1), (cy + Math.sin(a) * radius).toFixed(1));
      }
      return pts.join(" ");
    }

    function buildMark() {
      const root = svg("svg", { viewBox: "0 0 640 168", role: "img", "aria-label": "几何字标" });
      const mask = svg("mask", { id: "slots", maskUnits: "userSpaceOnUse", x: "0", y: "0", width: "640", height: "168" });
      mask.append(svg("rect", { x: "0", y: "0", width: "640", height: "168", fill: "#fff" }));
      const letters = svg("g", { fill: "currentColor", mask: "url(#slots)" });
      const bars = [
        [24, 18, 24, 150, 32],
        [152, 18, 152, 150, 32],
        [24, 84, 152, 84, 32],
        [214, 18, 214, 150, 32],
        [214, 34, 360, 34, 32],
        [214, 84, 330, 84, 32],
        [214, 134, 360, 134, 32],
        [430, 22, 616, 146, 34],
        [616, 22, 430, 146, 34]
      ];
      for (const bar of bars) letters.append(svg("polygon", { points: thick(...bar) }));
      const bolts = svg("g", { class: "bolts" });
      for (const [cx, cy] of [[88, 84], [286, 84], [523, 84]]) {
        mask.append(svg("rect", { x: cx - 18, y: cy - 4.5, width: 36, height: 9, rx: 1.5, fill: "#000" }));
        bolts.append(svg("polygon", { points: hex(cx, cy, 20) }));
      }
      root.append(mask, letters, bolts);
      document.getElementById("mark").append(root);
    }

    buildMark();
    resize();
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
