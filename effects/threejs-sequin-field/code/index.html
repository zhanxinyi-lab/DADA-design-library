<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SEQUIN</title>
  <style>
    :root { --dark: #777b82; --lit: #ffffff; --back: #4b5058; --background: #17191d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #17191d;
      overflow: hidden;
      font-family: Inter, Helvetica, Arial, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .name {
      position: absolute;
      left: 16px;
      bottom: 12px;
      font-size: 11px;
      letter-spacing: 0.32em;
      color: #e5e7eb;
      pointer-events: none;
    }
    .controls {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    .controls button {
      padding: 7px 12px;
      border: 1px solid rgba(45, 45, 45, 0.28);
      border-radius: 999px;
      background: rgba(244, 244, 244, 0.88);
      color: #333;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .controls button:hover { background: #fff; }
    .controls button:focus-visible {
      outline: 2px solid #333;
      outline-offset: 2px;
    }
    .instructions {
      position: absolute;
      top: 50px;
      right: 16px;
      max-width: min(360px, calc(100vw - 32px));
      color: #c5c9cf;
      font-size: 10px;
      line-height: 1.4;
      text-align: right;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .controls { right: 12px; }
      .instructions { right: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="c" aria-label="交互式亮片点阵" aria-describedby="instructions"></canvas>
  <div class="name" id="name"></div>
  <div class="controls" role="group" aria-label="亮片翻面控制">
    <button type="button" id="flip" aria-label="翻转亮片">翻面</button>
    <button type="button" id="reset" aria-label="复位亮片">复位</button>
  </div>
  <p class="instructions" id="instructions">上滑或向上拖动翻面，下滑或向下拖动复位；也可按 Tab 聚焦按钮，再按 Enter 或空格。</p>
  <script>
    // 改这里即可换品牌
    const BRAND = {
      name: 'SEQUIN',
      background: '#17191d',
      dark: '#777b82',
      lit: '#ffffff',
      back: '#4b5058'
    };

    (function () {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.title = BRAND.name;
      document.getElementById('name').textContent = BRAND.name;
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const flipButton = document.getElementById('flip');
      const resetButton = document.getElementById('reset');
      const colorSteps = 64;
      const maxCells = 1200;
      const spotRadius = 140;
      let W = 0, H = 0, cols = 0, rows = 0, cellW = 0, cellH = 0, plateW = 0, plateH = 0, corner = 0, tiles = [];
      let mx = null, my = null, t0 = performance.now(), rafId = 0;
      let activePointerId = null, pointerStartY = null, flipProgress = 0, flipTarget = 0;

      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return { r: n >> 16 & 255, g: n >> 8 & 255, b: n & 255 };
      }
      function mix(a, b, t) {
        return {
          r: a.r + (b.r - a.r) * t,
          g: a.g + (b.g - a.g) * t,
          b: a.b + (b.b - a.b) * t
        };
      }
      function rgb(c) { return 'rgb(' + (c.r | 0) + ',' + (c.g | 0) + ',' + (c.b | 0) + ')'; }
      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function seeded(x, y, salt) {
        const value = Math.sin(x * 127.1 + y * 311.7 + salt * 74.7) * 43758.5453;
        return value - Math.floor(value);
      }
      function platePath(cut) {
        ctx.beginPath();
        ctx.moveTo(-plateW / 2 + cut, -plateH / 2);
        ctx.lineTo(plateW / 2 - cut, -plateH / 2);
        ctx.lineTo(plateW / 2, -plateH / 2 + cut);
        ctx.lineTo(plateW / 2, plateH / 2 - cut);
        ctx.lineTo(plateW / 2 - cut, plateH / 2);
        ctx.lineTo(-plateW / 2 + cut, plateH / 2);
        ctx.lineTo(-plateW / 2, plateH / 2 - cut);
        ctx.lineTo(-plateW / 2, -plateH / 2 + cut);
        ctx.closePath();
      }

      const dark = hexToRgb(BRAND.dark);
      const lit = hexToRgb(BRAND.lit);
      const back = hexToRgb(BRAND.back);
      const frontPalette = [];
      const reversePalette = [];
      for (let i = 0; i <= colorSteps; i++) {
        const tone = i / colorSteps;
        frontPalette.push(rgb(mix(dark, lit, tone * 0.78)));
        reversePalette.push(rgb(mix(back, lit, tone * 0.38)));
      }

      function resize() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        W = Math.max(1, innerWidth);
        H = Math.max(1, innerHeight);
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.max(1, Math.min(W < 600 ? 36 : 96, Math.floor(W / 4)));
        rows = Math.max(1, Math.ceil(H / (W / cols)));
        if (cols * rows > maxCells) {
          cols = Math.max(1, Math.min(cols, Math.floor(Math.sqrt(maxCells * W / H))));
          rows = Math.max(1, Math.floor(maxCells / cols));
        }
        rows = Math.max(1, Math.min(rows, Math.floor(maxCells / cols)));
        cellW = W / cols;
        cellH = H / rows;
        plateW = Math.max(2, cellW * 0.74);
        plateH = Math.max(2, cellH * 0.74);
        corner = Math.min(plateW, plateH) * 0.16;
        tiles = [];
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            tiles.push({
              x, y,
              rotation: (seeded(x, y, 1) - 0.5) * 0.24,
              delay: seeded(x, y, 2) * 0.28,
              sparkle: seeded(x, y, 3) * Math.PI * 2
            });
          }
        }
      }

      function drawSequin(tile, px, py, t) {
        const cx = tile.x * cellW + cellW / 2;
        const cy = tile.y * cellH + cellH / 2;
        const dx = cx - px;
        const dy = cy - py;
        const distanceSquared = dx * dx + dy * dy;
        const influence = distanceSquared < spotRadius * spotRadius
          ? 1 - Math.sqrt(distanceSquared) / spotRadius
          : 0;
        const progress = clamp((flipProgress - tile.delay) / (1 - tile.delay), 0, 1);
        const angle = progress * Math.PI + influence * 0.3 * (1 - progress);
        const cosine = Math.cos(angle);
        const sine = Math.abs(Math.sin(angle));
        const front = cosine >= 0;
        const shimmer = Math.pow(Math.max(0, Math.sin(t * 1.8 + tile.sparkle + tile.x * 0.04 + tile.y * 0.03)), 12);
        const tone = Math.round(clamp(0.16 + influence * 0.3 + shimmer * 0.52, 0, 1) * colorSteps);
        const faceScaleY = Math.max(0.09, Math.abs(cosine));

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(tile.rotation);
        ctx.save();
        ctx.scale(front ? 1 : -1, faceScaleY);
        platePath(corner);
        ctx.fillStyle = front ? frontPalette[tone] : reversePalette[tone];
        ctx.fill();
        ctx.strokeStyle = 'rgba(8,10,13,0.82)';
        ctx.lineWidth = Math.max(0.45, Math.min(cellW, cellH) * 0.055);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-plateW * 0.34, -plateH * 0.38);
        ctx.lineTo(plateW * 0.32, -plateH * 0.38);
        ctx.lineTo(plateW * 0.06, -plateH * 0.12);
        ctx.lineTo(-plateW * 0.34, -plateH * 0.12);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + influence * 0.18 + shimmer * 0.58) + ')';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(plateW * 0.38, -plateH * 0.2);
        ctx.lineTo(plateW * 0.38, plateH * 0.34);
        ctx.lineTo(plateW * 0.1, plateH * 0.42);
        ctx.lineTo(plateW * 0.1, -plateH * 0.08);
        ctx.closePath();
        ctx.fillStyle = 'rgba(0,0,0,' + (front ? 0.2 : 0.38) + ')';
        ctx.fill();
        if (shimmer > 0.72) {
          ctx.beginPath();
          ctx.moveTo(-plateW * 0.08, -plateH * 0.3);
          ctx.lineTo(plateW * 0.28, -plateH * 0.16);
          ctx.strokeStyle = 'rgba(255,255,255,' + (shimmer * 0.9) + ')';
          ctx.lineWidth = Math.max(0.5, Math.min(cellW, cellH) * 0.045);
          ctx.stroke();
        }
        ctx.restore();
        if (sine > 0.12) {
          ctx.beginPath();
          ctx.moveTo(-plateW * 0.47, 0);
          ctx.lineTo(plateW * 0.47, 0);
          ctx.strokeStyle = front ? 'rgba(238,242,248,' + (sine * 0.72) + ')' : 'rgba(8,10,13,' + (sine * 0.8) + ')';
          ctx.lineWidth = Math.max(0.7, Math.min(cellW, cellH) * 0.13 * sine);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawFrame(now) {
        const t = (now - t0) / 1000;
        const speed = reduced ? 0 : 1;
        const vx = W * 0.5 + Math.sin(t * 0.9 * speed) * W * 0.28;
        const vy = H * 0.5 + Math.sin(t * 1.3 * speed) * H * 0.22;
        const px = mx === null ? vx : mx;
        const py = my === null ? vy : my;
        if (reduced) flipProgress = flipTarget;
        else flipProgress += (flipTarget - flipProgress) * 0.12;

        ctx.fillStyle = BRAND.background;
        ctx.fillRect(0, 0, W, H);
        for (const tile of tiles) drawSequin(tile, px, py, t);
      }

      function tick(now) {
        rafId = 0;
        drawFrame(now);
        if (!reduced) rafId = requestAnimationFrame(tick);
      }
      function redraw() {
        if (reduced) {
          drawFrame(t0);
        } else if (!rafId) {
          rafId = requestAnimationFrame(tick);
        }
      }
      function setFlipTarget(target) {
        flipTarget = target;
        redraw();
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (activePointerId !== null) return;
        activePointerId = e.pointerId;
        pointerStartY = e.clientY;
        mx = e.clientX;
        my = e.clientY;
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
        redraw();
      });
      canvas.addEventListener('pointermove', function (e) {
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        mx = e.clientX;
        my = e.clientY;
        if (reduced) redraw();
      });
      canvas.addEventListener('pointerup', function (e) {
        if (e.pointerId !== activePointerId) return;
        const deltaY = e.clientY - pointerStartY;
        if (Math.abs(deltaY) > Math.max(36, H * 0.06)) flipTarget = deltaY < 0 ? 1 : 0;
        activePointerId = null;
        pointerStartY = null;
        redraw();
      });
      canvas.addEventListener('pointercancel', function (e) {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        pointerStartY = null;
        redraw();
      });
      canvas.addEventListener('pointerleave', function (e) {
        if (activePointerId !== null || e.pointerType !== 'mouse') return;
        mx = null;
        my = null;
        if (reduced) redraw();
      });
      flipButton.addEventListener('click', function () { setFlipTarget(1); });
      resetButton.addEventListener('click', function () { setFlipTarget(0); });
      addEventListener('resize', function () {
        resize();
        redraw();
      });

      resize();
      if (reduced) drawFrame(t0);
      else rafId = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
