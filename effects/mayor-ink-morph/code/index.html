<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨色软团循环</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6e6e4; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<p class="sr">浅灰底上两枚竖向墨色胶囊和右侧一团圆角墨块。约 10 秒循环：胀开，向左靠拢合成一块，再分开回到开头。</p>
<canvas id="stage" aria-hidden="true"></canvas>
<script>
// 四团软边椭圆。关键帧来自原片 0 / 1.6 / 3.2 / 4.8 / 6.4 / 8 / 10 秒的左右墨块位置。
const LOOP = 10;
const KEYS = [
  [0,   [0.22, 0.32, 0.070, 0.130], [0.33, 0.58, 0.065, 0.120], [0.74, 0.56, 0.200, 0.220], [0.86, 0.40, 0.110, 0.140]],
  [1.6, [0.20, 0.34, 0.080, 0.150], [0.31, 0.58, 0.075, 0.140], [0.72, 0.55, 0.220, 0.240], [0.84, 0.38, 0.120, 0.150]],
  [3.2, [0.18, 0.38, 0.090, 0.170], [0.30, 0.56, 0.090, 0.160], [0.66, 0.52, 0.240, 0.240], [0.78, 0.36, 0.130, 0.160]],
  [4.8, [0.20, 0.42, 0.120, 0.180], [0.34, 0.54, 0.120, 0.160], [0.56, 0.50, 0.220, 0.220], [0.70, 0.40, 0.130, 0.160]],
  [6.4, [0.16, 0.46, 0.100, 0.160], [0.28, 0.60, 0.100, 0.150], [0.55, 0.55, 0.180, 0.200], [0.66, 0.40, 0.110, 0.140]],
  [8,   [0.18, 0.38, 0.075, 0.140], [0.30, 0.58, 0.070, 0.130], [0.68, 0.56, 0.180, 0.200], [0.80, 0.42, 0.110, 0.140]],
  [10,  [0.22, 0.32, 0.070, 0.130], [0.33, 0.58, 0.065, 0.120], [0.74, 0.56, 0.200, 0.220], [0.86, 0.40, 0.110, 0.140]]
];
const BG = [230, 230, 228];
const INK = [43, 43, 43];
const N = 280;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
const field = document.createElement('canvas');
field.width = field.height = N;
const fx = field.getContext('2d', { willReadFrequently: true });
const grid = new Float32Array(N * N);

const params = new URLSearchParams(location.search);
const freezeArg = params.get('freeze');
const freezeAt = freezeArg == null || freezeArg === '' ? null : Math.min(LOOP, Math.max(0, Number(freezeArg) || 0));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function smooth(t) { return t * t * (3 - 2 * t); }

function pose(time) {
  const T = ((time % LOOP) + LOOP) % LOOP;
  let i = 0;
  while (i < KEYS.length - 2 && KEYS[i + 1][0] <= T) i++;
  const a = KEYS[i];
  const b = KEYS[i + 1];
  const u = smooth(b[0] === a[0] ? 0 : (T - a[0]) / (b[0] - a[0]));
  const blobs = [];
  for (let k = 1; k < a.length; k++) {
    const p = a[k];
    const q = b[k];
    blobs.push([
      p[0] + (q[0] - p[0]) * u,
      p[1] + (q[1] - p[1]) * u,
      p[2] + (q[2] - p[2]) * u,
      p[3] + (q[3] - p[3]) * u
    ]);
  }
  return blobs;
}

function paint(time) {
  grid.fill(0);
  const blobs = pose(time);
  for (let y = 0; y < N; y++) {
    const fy = (y + 0.5) / N;
    for (let x = 0; x < N; x++) {
      const fxn = (x + 0.5) / N;
      let sum = 0;
      for (let i = 0; i < blobs.length; i++) {
        const b = blobs[i];
        const dx = (fxn - b[0]) / b[2];
        const dy = (fy - b[1]) / b[3];
        const d2 = dx * dx + dy * dy;
        if (d2 < 3.4) sum += Math.exp(-d2 * 1.05);
      }
      grid[y * N + x] = sum;
    }
  }
  const img = fx.createImageData(N, N);
  const data = img.data;
  for (let i = 0; i < grid.length; i++) {
    const a = Math.min(1, Math.max(0, (grid[i] - 0.42) / 0.30));
    const o = i * 4;
    data[o] = BG[0] + (INK[0] - BG[0]) * a;
    data[o + 1] = BG[1] + (INK[1] - BG[1]) * a;
    data[o + 2] = BG[2] + (INK[2] - BG[2]) * a;
    data[o + 3] = 255;
  }
  fx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(field, 0, 0, canvas.width, canvas.height);
}

function resize() {
  const size = Math.max(1, Math.round(Math.min(innerWidth, innerHeight) * Math.min(devicePixelRatio || 1, 2)));
  if (canvas.width !== size || canvas.height !== size) {
    canvas.width = size;
    canvas.height = size;
  }
}

let start = performance.now();
function frame(now) {
  resize();
  const t = freezeAt != null ? freezeAt : reduced ? 0 : ((now - start) / 1000) % LOOP;
  paint(t);
  if (freezeAt == null && !reduced) requestAnimationFrame(frame);
}

resize();
paint(freezeAt != null ? freezeAt : 0);
if (freezeAt == null && !reduced) requestAnimationFrame(frame);
addEventListener('resize', () => { resize(); if (freezeAt != null || reduced) paint(freezeAt != null ? freezeAt : 0); });
</script>
</body>
</html>
