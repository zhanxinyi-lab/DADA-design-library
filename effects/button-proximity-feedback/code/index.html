<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>按钮接近反馈</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; background: #f4efe6; color: #201c18;
      font: 16px/1.4 "Segoe UI", "PingFang SC", sans-serif;
    }
    .wrap { position: relative; display: grid; place-items: center; width: min(100%, 320px); height: 220px; }
    .cta {
      --wipe: 0;
      position: relative; display: inline-grid; place-items: center; overflow: clip;
      border: 0; border-radius: 999px; padding: 16px 32px; background: #201c18; color: #f4efe6;
      font: inherit; font-weight: 700; cursor: pointer;
      transition: transform .12s linear;
    }
    .fill {
      position: absolute; inset: 0; z-index: 0; background: #f4efe6; pointer-events: none;
      transform: scaleY(var(--wipe)); transform-origin: bottom center;
      transition: transform .48s cubic-bezier(.22, .7, .2, 1);
    }
    .fizz { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
    .face, .ink { grid-area: 1 / 1; }
    .face {
      position: relative; z-index: 2;
      clip-path: inset(0 0 calc(var(--wipe) * 100%) 0);
      transition: clip-path .48s cubic-bezier(.22, .7, .2, 1);
    }
    .ink {
      position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
      color: #201c18; pointer-events: none;
      clip-path: inset(calc((1 - var(--wipe)) * 100%) 0 0 0);
      transition: clip-path .48s cubic-bezier(.22, .7, .2, 1);
    }
    .cta::after {
      content: ""; position: absolute; inset: 0; z-index: 4; border-radius: inherit; pointer-events: none;
      box-shadow: inset 0 0 0 1.5px #201c18;
    }
    @media (hover: hover) and (pointer: fine) {
      .cta:hover { --wipe: 1; }
    }
    .cta:focus-visible { --wipe: 1; outline: 2px solid #201c18; outline-offset: 5px; }
    .cta:active { transform: translateY(1px); }
    .status { position: absolute; left: 16px; right: 16px; bottom: 16px; margin: 0; text-align: center; color: #6d665c; }
    @media (pointer: coarse) { .fizz { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .fizz { display: none; }
      .cta, .fill, .face, .ink { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="cta" type="button" id="cta">
      <span class="fill" aria-hidden="true"></span>
      <canvas class="fizz" id="fizz" aria-hidden="true"></canvas>
      <span class="face">预约看样</span>
      <span class="ink" aria-hidden="true">预约看样</span>
    </button>
  </div>
  <p class="status" id="status" role="status"></p>
  <script>
    const button = document.querySelector("#cta");
    const canvas = document.querySelector("#fizz");
    const status = document.querySelector("#status");
    const ctx = canvas.getContext("2d");
    const scratch = document.createElement("canvas");
    const hidden = scratch.getContext("2d");
    const fineQuery = matchMedia("(hover: hover) and (pointer: fine)");
    const reduceQuery = matchMedia("(prefers-reduced-motion: reduce)");
    const WAKE = 130;
    const REVEAL = 65;
    const ON_DARK = ["#f4efe6", "#e0a15a", "#d4654a"];
    const ON_LIGHT = ["#201c18", "#3f6f5b", "#8c3d32"];
    let pointer = null;
    let particles = [];
    let raf = 0;
    let last = 0;
    let sim = 0;
    let dpr = 1;

    function edgeDistance(x, y) {
      const rect = button.getBoundingClientRect();
      const radius = rect.height / 2;
      const inner = Math.max(0, rect.width / 2 - radius);
      const dx = Math.abs(x - (rect.left + rect.width / 2)) - inner;
      const dy = Math.abs(y - (rect.top + rect.height / 2));
      return Math.max(0, Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - radius);
    }

    function phase() {
      if (!fineQuery.matches || reduceQuery.matches) return "off";
      if (button.matches(":hover") || button.matches(":focus-visible")) return "hot";
      if (!pointer) return "idle";
      const dist = edgeDistance(pointer.x, pointer.y);
      if (dist >= WAKE) return "idle";
      if (dist > REVEAL) return "wake";
      return "reveal";
    }

    function fit() {
      const rect = button.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      scratch.width = canvas.width;
      scratch.height = canvas.height;
    }

    function makeParticles() {
      const w = button.clientWidth;
      const h = button.clientHeight;
      particles = Array.from({ length: 24 }, (_, index) => ({
        x: 8 + Math.random() * Math.max(8, w - 16),
        y: 8 + Math.random() * Math.max(8, h - 16),
        w: 4 + (index % 3) * 2,
        h: index % 2 === 0 ? 4 : 7,
        vx: (index % 2 === 0 ? 1 : -1) * (24 + (index % 5) * 7),
        vy: (index % 3 === 0 ? 1 : -1) * (18 + (index % 4) * 6),
        color: index % 3
      }));
    }

    function step(dt, speed) {
      const w = button.clientWidth;
      const h = button.clientHeight;
      for (const speck of particles) {
        speck.x += speck.vx * speed * dt;
        speck.y += speck.vy * speed * dt;
        if (speck.x < 8 || speck.x > w - 8) speck.vx *= -1;
        if (speck.y < 8 || speck.y > h - 8) speck.vy *= -1;
        speck.x = Math.max(8, Math.min(w - 8, speck.x));
        speck.y = Math.max(8, Math.min(h - 8, speck.y));
      }
      sim += 1;
    }

    function draw(target, alpha, palette) {
      const w = button.clientWidth;
      const h = button.clientHeight;
      target.save();
      target.setTransform(dpr, 0, 0, dpr, 0, 0);
      target.clearRect(0, 0, w, h);
      target.beginPath();
      target.roundRect(0, 0, w, h, h / 2);
      target.clip();
      target.globalAlpha = alpha;
      for (const speck of particles) {
        target.fillStyle = palette[speck.color];
        target.fillRect(speck.x - speck.w / 2, speck.y - speck.h / 2, speck.w, speck.h);
      }
      target.restore();
    }

    function paint(current) {
      const dist = pointer ? edgeDistance(pointer.x, pointer.y) : 0;
      const alpha = current === "hot" ? 1 : Math.max(0, 1 - dist / REVEAL);
      button.dataset.fizz = alpha.toFixed(3);
      if (current === "wake") {
        draw(hidden, 1, ON_DARK);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, button.clientWidth, button.clientHeight);
        return;
      }
      draw(ctx, alpha, current === "hot" ? ON_LIGHT : ON_DARK);
    }

    function stop() {
      cancelAnimationFrame(raf);
      raf = 0;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, button.clientWidth, button.clientHeight);
      button.dataset.fizz = "0";
      button.dataset.speed = "0";
    }

    function frame(now) {
      const current = phase();
      const dist = pointer ? edgeDistance(pointer.x, pointer.y) : 0;
      button.dataset.phase = current;
      button.dataset.dist = pointer ? dist.toFixed(1) : "";
      button.dataset.sim = String(sim);
      if (current === "off" || current === "idle") {
        stop();
        button.dataset.phase = current;
        return;
      }
      const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
      last = now;
      const speed = current === "hot" ? 2.7 : 1;
      button.dataset.speed = String(speed);
      step(dt, speed);
      paint(current);
      button.dataset.sim = String(sim);
      raf = requestAnimationFrame(frame);
    }

    function sync() {
      const current = phase();
      const dist = pointer ? edgeDistance(pointer.x, pointer.y) : 0;
      button.dataset.phase = current;
      button.dataset.dist = pointer ? dist.toFixed(1) : "";
      if (current === "off" || current === "idle") {
        stop();
        button.dataset.phase = current;
        return;
      }
      if (!raf) {
        last = 0;
        raf = requestAnimationFrame(frame);
      }
    }

    fineQuery.addEventListener("change", sync);
    reduceQuery.addEventListener("change", sync);
    window.addEventListener("pointermove", (event) => {
      pointer = { x: event.clientX, y: event.clientY };
      sync();
    });
    document.addEventListener("pointerout", (event) => {
      if (event.relatedTarget) return;
      pointer = null;
      sync();
    });
    button.addEventListener("focus", sync);
    button.addEventListener("blur", sync);
    button.addEventListener("click", () => { status.textContent = "已记录一次点击。"; });
    window.addEventListener("resize", () => { fit(); sync(); });
    fit();
    makeParticles();
    sync();
  </script>
</body>
</html>
