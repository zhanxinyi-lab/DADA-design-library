<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>a web page in a sunlit window</title>
  <style>
    :root {
      --accent: #e39a45;
      --wall: #f4eee6;
      --floor: #e4d2bc;
      --ink: #2a241c;
      --muted: #6a5e52;
      --frame: #fbf8f3;
      --mullion: #2c2824;
      --sky-a: #f6d7b4;
      --sky-b: #f7f1e8;
      --sun-core: #ffe0a8;
      --mode-sun: 1;
      --sun-strength: 0.92;
      --patch-x: 46%;
      --patch-y: 18%;
      --patch-w: 28%;
      --patch-h: 34%;
      --patch-rot: -8deg;
      --floor-x: 34%;
      --floor-w: 42%;
      --floor-h: 16%;
      --sun-left: 58%;
      --sun-top: 22%;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      background: var(--wall);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .room {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 70% 0%, transparent 0 40%, rgba(70, 48, 28, 0.08) 100%),
        var(--wall);
      transition: background-color 640ms ease, color 640ms ease;
    }

    .sky, .window, .patch, .sun, .floor {
      transition: background 640ms ease, opacity 640ms ease, transform 640ms ease, left 640ms ease, top 640ms ease, width 640ms ease, height 640ms ease;
    }

    .floor {
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: 0;
      height: 34%;
      background:
        linear-gradient(180deg, rgba(90, 62, 36, 0.05), transparent 18%),
        linear-gradient(90deg, #dcc7ae 0%, var(--floor) 42%, #c9ae92 100%);
      clip-path: polygon(0 22%, 100% 0, 100% 100%, 0 100%);
      transform-origin: center bottom;
    }

    .window {
      position: absolute;
      top: 7%;
      right: 6%;
      width: min(42vw, 520px);
      height: 58%;
      background: var(--frame);
      border: 10px solid var(--frame);
      box-shadow:
        0 24px 50px rgba(60, 40, 20, 0.12),
        inset 0 0 0 1px rgba(44, 40, 36, 0.35);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.15fr 0.85fr;
      gap: 8px;
      z-index: 2;
    }

    .pane {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-a), var(--sky-b));
    }

    .sun {
      position: absolute;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50%;
      left: var(--sun-left);
      top: var(--sun-top);
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, #fff 0 18%, var(--sun-core) 42%, transparent 72%);
      opacity: calc(var(--sun-strength) * var(--mode-sun));
      z-index: 1;
      pointer-events: none;
    }

    .patch {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      background: var(--sun-core);
      filter: blur(16px);
      opacity: calc(var(--sun-strength) * var(--mode-sun));
    }

    .patch--wall {
      left: var(--patch-x);
      top: var(--patch-y);
      width: var(--patch-w);
      height: var(--patch-h);
      transform: rotate(var(--patch-rot));
      border-radius: 18% 30% 26% 20%;
    }

    .patch--floor {
      left: var(--floor-x);
      bottom: 8%;
      width: var(--floor-w);
      height: var(--floor-h);
      border-radius: 46% 40% 48% 42%;
      z-index: 3;
    }

    .patch--sill {
      right: 10%;
      top: 60%;
      width: 18%;
      height: 7%;
      border-radius: 40%;
      opacity: calc(var(--sun-strength) * var(--mode-sun) * 0.75);
      z-index: 3;
    }

    .copy {
      position: relative;
      z-index: 4;
      max-width: 38rem;
      padding: clamp(1.5rem, 5vw, 4.2rem) clamp(1.2rem, 4vw, 3.4rem) 8.5rem;
    }

    .kicker {
      margin: 0 0 0.85rem;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      max-width: 11em;
      font-family: Palatino, "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.15rem, 5vw, 4.35rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
    }

    .greet {
      margin: 1.15rem 0 0;
      font-family: Palatino, Georgia, serif;
      font-style: italic;
      font-size: clamp(1.35rem, 2.4vw, 1.9rem);
    }

    .lede {
      margin: 0.85rem 0 0;
      max-width: 28em;
      font-size: 1.02rem;
      line-height: 1.45;
    }

    .flip {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin: 1.35rem 0 0;
      padding: 0.35rem 0.2rem;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    .switch {
      width: 2.7rem;
      height: 1.45rem;
      border: 1.5px solid currentColor;
      border-radius: 999px;
      position: relative;
      flex: none;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 0.16rem;
      left: 0.16rem;
      width: 0.92rem;
      height: 0.92rem;
      border-radius: 50%;
      background: var(--accent);
      transition: transform 240ms ease;
    }

    .note {
      margin: 0.45rem 0 0;
      max-width: 28em;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .dock {
      position: absolute;
      z-index: 5;
      left: clamp(1.2rem, 4vw, 3.4rem);
      right: clamp(1.2rem, 4vw, 3.4rem);
      bottom: clamp(1rem, 3vw, 1.8rem);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .dial {
      width: 7.4rem;
      height: 7.4rem;
      border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--ink) 55%, transparent);
      background:
        radial-gradient(circle at 50% 50%, var(--wall) 0 68%, transparent 69%),
        repeating-conic-gradient(from -8deg, color-mix(in srgb, var(--ink) 55%, transparent) 0 1.4deg, transparent 1.4deg 15deg),
        var(--wall);
      box-shadow: 0 10px 24px rgba(50, 36, 20, 0.12);
      position: relative;
      touch-action: none;
      cursor: grab;
      color: var(--ink);
    }

    .dial:active { cursor: grabbing; }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.55rem;
      height: 0.55rem;
      margin: -0.28rem;
      border-radius: 50%;
      background: var(--accent);
      transform: rotate(var(--hand-rot, -20deg)) translateY(-2.55rem);
    }

    .time {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      letter-spacing: -0.03em;
      pointer-events: none;
    }

    .credit {
      margin: 0 0 0.35rem;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .live {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .room[data-mode="dark"] {
      --wall: #221c18;
      --floor: #3a2e24;
      --ink: #f4ece3;
      --muted: #cbbbaa;
      --frame: #3c342c;
      --mullion: #1a1613;
      --sky-a: #243140;
      --sky-b: #14181d;
      --mode-sun: 0.2;
      color-scheme: dark;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 70% 0%, transparent 0 36%, rgba(0, 0, 0, 0.28) 100%),
        var(--wall);
    }

    .room[data-mode="dark"] .switch::after { transform: translateX(1.22rem); }
    .room[data-mode="dark"] .floor {
      background: linear-gradient(90deg, #2a221b, var(--floor) 50%, #241c16);
    }
    .room[data-mode="dark"] .window {
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 236, 214, 0.16);
    }

    @media (max-width: 720px) {
      .window { width: 70vw; height: 42%; top: auto; bottom: 7.5rem; right: -6%; opacity: 0.95; }
      .copy { max-width: none; padding-bottom: 11rem; }
      h1 { font-size: clamp(2rem, 11vw, 3.1rem); }
      .dial { width: 6.2rem; height: 6.2rem; }
      .hand { transform: rotate(var(--hand-rot, -20deg)) translateY(-2.15rem); }
      .patch--wall { filter: blur(12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .room, .sky, .window, .patch, .sun, .floor, .switch::after { transition: none; }
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="room" id="room" data-mode="light">
    <div class="sun" aria-hidden="true"></div>
    <div class="patch patch--wall" aria-hidden="true"></div>
    <div class="window" aria-hidden="true">
      <div class="pane"></div>
      <div class="pane"></div>
      <div class="pane"></div>
      <div class="pane"></div>
    </div>
    <div class="floor" aria-hidden="true"></div>
    <div class="patch patch--floor" aria-hidden="true"></div>
    <div class="patch patch--sill" aria-hidden="true"></div>

    <div class="copy">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="greet" id="greet"></p>
      <p class="lede" id="lede"></p>
      <button class="flip" id="flip" type="button">
        <span class="switch" aria-hidden="true"></span>
        <span id="cta"></span>
      </button>
      <p class="note" id="note"></p>
    </div>

    <div class="dock">
      <div
        class="dial"
        id="dial"
        role="slider"
        tabindex="0"
        aria-valuemin="360"
        aria-valuemax="600"
        aria-valuenow="570"
        aria-label="Morning time"
      >
        <span class="hand" aria-hidden="true"></span>
        <p class="time" id="time">9:30 am</p>
      </div>
      <p class="credit" id="credit"></p>
    </div>
    <p class="live" id="live" aria-live="polite"></p>
  </main>
  <script>
    const BRAND = {
      name: "Techartist",
      year: "2026",
      title: "a web page in a sunlit window",
      greeting: "Good morning.",
      body: "This page is a window. Whatever it shows, the sun carries into the room.",
      cta: "Flip the switch.",
      note: "Light mode lets the morning in, dark mode blocks it.",
      lightLabel: "Light mode",
      darkLabel: "Dark mode",
      accent: "#e39a45"
    };

    const MIN = 360;
    const MAX = 600;
    const room = document.getElementById("room");
    const dial = document.getElementById("dial");
    const flip = document.getElementById("flip");
    const live = document.getElementById("live");
    let minutes = 570;
    let mode = "light";

    document.getElementById("title").textContent = BRAND.title;
    document.getElementById("greet").textContent = BRAND.greeting;
    document.getElementById("lede").textContent = BRAND.body;
    document.getElementById("cta").textContent = BRAND.cta;
    document.getElementById("note").textContent = BRAND.note;
    document.getElementById("credit").textContent = "© " + BRAND.year + " " + BRAND.name;
    document.documentElement.style.setProperty("--accent", BRAND.accent);

    function mix(a, b, t) {
      const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
      const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
      const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
      return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
    }

    function label(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h + ":" + String(m).padStart(2, "0") + " am";
    }

    function apply() {
      const t = (minutes - MIN) / (MAX - MIN);
      const low = 1 - t;
      room.style.setProperty("--sun-strength", (0.78 + t * 0.22).toFixed(3));
      room.style.setProperty("--sun-core", mix("#ff8d4a", mix("#ffd39a", "#fff1d6", t), t));
      room.style.setProperty("--sky-a", mode === "dark" ? "#243140" : mix("#f3b48a", "#f7e2c4", t));
      room.style.setProperty("--sky-b", mode === "dark" ? "#14181d" : mix("#f6d8bf", "#f8f4ee", t));
      room.style.setProperty("--sun-left", (28 + t * 36) + "%");
      room.style.setProperty("--sun-top", (68 - t * 48) + "%");
      room.style.setProperty("--patch-x", (28 + low * 10) + "%");
      room.style.setProperty("--patch-y", (14 + low * 16) + "%");
      room.style.setProperty("--patch-w", (22 + low * 18) + "%");
      room.style.setProperty("--patch-h", (24 + low * 16) + "%");
      room.style.setProperty("--patch-rot", (-16 + t * 14) + "deg");
      room.style.setProperty("--floor-x", (22 + low * 8) + "%");
      room.style.setProperty("--floor-w", (30 + low * 24) + "%");
      room.style.setProperty("--floor-h", (12 + low * 10) + "%");
      room.style.setProperty("--hand-rot", (-150 + t * 120) + "deg");
      room.dataset.mode = mode;
      const text = label(minutes);
      document.getElementById("time").textContent = text;
      document.getElementById("kicker").textContent = mode === "dark" ? BRAND.darkLabel : BRAND.lightLabel;
      dial.setAttribute("aria-valuenow", String(minutes));
      dial.setAttribute("aria-valuetext", text);
      flip.setAttribute("aria-pressed", mode === "dark" ? "true" : "false");
      flip.setAttribute("aria-label", BRAND.cta + " Now " + (mode === "dark" ? BRAND.darkLabel : BRAND.lightLabel) + ", " + text + ".");
      live.textContent = (mode === "dark" ? BRAND.darkLabel : BRAND.lightLabel) + ", " + text;
    }

    function setMinutes(next) {
      minutes = Math.max(MIN, Math.min(MAX, Math.round(next)));
      apply();
    }

    function fromPoint(clientX, clientY) {
      const r = dial.getBoundingClientRect();
      const ang = Math.atan2(clientY - (r.top + r.height / 2), clientX - (r.left + r.width / 2));
      let deg = (ang * 180 / Math.PI + 90 + 360) % 360;
      setMinutes(MIN + (deg / 360) * (MAX - MIN));
    }

    let dragging = false;
    dial.addEventListener("pointerdown", (e) => {
      dragging = true;
      dial.setPointerCapture(e.pointerId);
      fromPoint(e.clientX, e.clientY);
    });
    dial.addEventListener("pointermove", (e) => { if (dragging) fromPoint(e.clientX, e.clientY); });
    dial.addEventListener("pointerup", () => { dragging = false; });
    dial.addEventListener("pointercancel", () => { dragging = false; });
    dial.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 30 : 5;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") { setMinutes(minutes + step); e.preventDefault(); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { setMinutes(minutes - step); e.preventDefault(); }
      else if (e.key === "Home") { setMinutes(MIN); e.preventDefault(); }
      else if (e.key === "End") { setMinutes(MAX); e.preventDefault(); }
    });

    flip.addEventListener("click", () => {
      mode = mode === "light" ? "dark" : "light";
      apply();
    });

    apply();
  </script>
</body>
</html>
