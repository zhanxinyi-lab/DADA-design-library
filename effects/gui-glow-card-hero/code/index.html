<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guillaume Colombel — Portfolio 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #2a120e; }
    #scene-control {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: crosshair;
    }
    #scene-control:focus-visible { outline: 2px solid #f6e4d4; outline-offset: -4px; }
    canvas { display: block; width: 100%; height: 100%; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <button id="scene-control" type="button" aria-label="Show the next award card. Activate with Enter or Space." aria-describedby="card-announcement">
    <canvas id="scene" aria-hidden="true"></canvas>
  </button>
  <p id="card-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <script>
    // Self-contained recreation of the portfolio hero: warm glass, pointer light,
    // floating W. mark, reflection, and the card-breaking award transition.
    const BRAND = {
      name: 'Guillaume Colombel',
      mark: 'W.',
      cards: [
        { kicker: 'Site of the Day', date: 'Oct 28, 2026', title: 'G. Colombel — Portfolio 2026' },
        { kicker: 'Developer Award', date: 'Oct 28, 2026', title: 'G. Colombel — Portfolio 2026' }
      ]
    };

    const canvas = document.getElementById('scene');
    const control = document.getElementById('scene-control');
    const announcement = document.getElementById('card-announcement');
    const ctx = canvas.getContext('2d');
    const cardCanvas = document.createElement('canvas');
    const cardCtx = cardCanvas.getContext('2d');
    const noiseCanvas = document.createElement('canvas');
    const noiseCtx = noiseCanvas.getContext('2d');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    let reducedMotion = motionPreference.matches;
    const pointer = { x: 0, y: 0, active: false };
    const shards = [];
    let width = 0;
    let height = 0;
    let dpr = 1;
    let cardIndex = 0;
    let phase = 'glass';
    let phaseTime = 0;
    let lastFrame = performance.now();
    let frameRequest = 0;

    noiseCanvas.width = noiseCanvas.height = 128;
    {
      const image = noiseCtx.createImageData(128, 128);
      for (let i = 0; i < image.data.length; i += 4) {
        const value = 30 + Math.random() * 200;
        image.data[i] = image.data[i + 1] = image.data[i + 2] = value;
        image.data[i + 3] = Math.random() < 0.72 ? 180 : 0;
      }
      noiseCtx.putImageData(image, 0, 0);
    }

    function bounds() {
      const w = Math.min(230, width * 0.34, height * 0.48);
      const h = Math.min(420, height * 0.62);
      const x = (width - w) / 2 - width * 0.05;
      const y = Math.max(24, (height - h) * 0.36);
      return { x, y, w, h, cx: x + w / 2, cy: y + h * 0.48, rx: w * 0.48, ry: h * 0.46 };
    }

    function inside(b, x, y) {
      const dx = (x - b.cx) / b.rx;
      const dy = (y - b.cy) / b.ry;
      return dx * dx + dy * dy <= 1;
    }

    function wrapText(context, text, maxWidth) {
      const lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        const candidate = line ? `${line} ${word}` : word;
        if (line && context.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = word;
        } else line = candidate;
      }
      if (line) lines.push(line);
      return lines;
    }

    function syncAccessibleCard() {
      const card = BRAND.cards[cardIndex];
      const text = `${card.kicker}. ${card.date}. ${card.title}.`;
      if (announcement.textContent !== text) announcement.textContent = text;
    }

    function paintCard() {
      const b = bounds();
      const card = BRAND.cards[cardIndex];
      syncAccessibleCard();
      cardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cardCtx.clearRect(0, 0, width, height);
      cardCtx.save();
      cardCtx.beginPath();
      cardCtx.ellipse(b.cx, b.cy, b.rx, b.ry, 0, 0, Math.PI * 2);

      const glass = cardCtx.createRadialGradient(
        b.cx - b.w * 0.16, b.cy - b.h * 0.2, b.w * 0.04,
        b.cx, b.cy, b.ry * 1.2
      );
      glass.addColorStop(0, 'rgba(255,224,203,0.96)');
      glass.addColorStop(0.28, 'rgba(237,126,91,0.94)');
      glass.addColorStop(0.68, 'rgba(190,68,46,0.96)');
      glass.addColorStop(1, 'rgba(91,27,20,0.98)');
      cardCtx.fillStyle = glass;
      cardCtx.shadowColor = 'rgba(245,112,75,0.42)';
      cardCtx.shadowBlur = 24;
      cardCtx.fill();
      cardCtx.shadowBlur = 0;
      cardCtx.clip();

      cardCtx.globalAlpha = 0.24;
      cardCtx.fillStyle = cardCtx.createPattern(noiseCanvas, 'repeat');
      cardCtx.fillRect(b.cx - b.rx, b.cy - b.ry, b.rx * 2, b.ry * 2);
      cardCtx.globalAlpha = 1;

      const compact = width < 520;
      const titleSize = compact ? Math.max(13, Math.min(17, b.w * 0.078)) : 21;
      cardCtx.textAlign = 'center';
      cardCtx.fillStyle = 'rgba(255,244,236,0.94)';
      cardCtx.font = '600 12px Inter, Helvetica, Arial, sans-serif';
      cardCtx.fillText(card.kicker, b.cx, b.cy - 42, b.w * 0.82);
      cardCtx.globalAlpha = 0.78;
      cardCtx.font = '12px Inter, Helvetica, Arial, sans-serif';
      cardCtx.fillText(card.date, b.cx, b.cy - 21, b.w * 0.82);
      cardCtx.globalAlpha = 1;
      cardCtx.font = `650 ${titleSize}px Inter, Helvetica, Arial, sans-serif`;
      const lines = wrapText(cardCtx, card.title, b.w * 0.8);
      const lineHeight = titleSize * 1.16;
      const titleTop = b.cy + 8 - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((line, index) => cardCtx.fillText(line, b.cx, titleTop + index * lineHeight, b.w * 0.82));
      cardCtx.globalAlpha = 0.64;
      cardCtx.font = '8px Inter, Helvetica, Arial, sans-serif';
      cardCtx.fillText('By Guillaume Colombel', b.cx, titleTop + lines.length * lineHeight + 22, b.w * 0.82);
      cardCtx.restore();
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, '#2a120e');
      sky.addColorStop(0.44, '#84371f');
      sky.addColorStop(0.72, '#5c2518');
      sky.addColorStop(1, '#170907');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      const glow = ctx.createRadialGradient(width * 0.48, height * 0.42, 8, width * 0.48, height * 0.42, height * 0.68);
      glow.addColorStop(0, 'rgba(225,91,55,0.2)');
      glow.addColorStop(1, 'rgba(33,10,7,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      const ground = ctx.createLinearGradient(0, height * 0.72, 0, height);
      ground.addColorStop(0, 'rgba(29,12,9,0)');
      ground.addColorStop(0.36, 'rgba(23,9,7,0.72)');
      ground.addColorStop(1, '#0c0504');
      ctx.fillStyle = ground;
      ctx.fillRect(0, height * 0.72, width, height * 0.28);
    }

    function drawReflection(b) {
      ctx.save();
      ctx.translate(b.cx, b.y + b.h + 18);
      ctx.scale(1, -0.28);
      const reflection = ctx.createRadialGradient(0, 0, 6, 0, 0, b.rx * 1.2);
      reflection.addColorStop(0, 'rgba(224,112,80,0.46)');
      reflection.addColorStop(1, 'rgba(224,112,80,0)');
      ctx.fillStyle = reflection;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.rx * 0.88, b.ry * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWordmark(b) {
      const size = Math.min(78, Math.max(46, width * 0.065));
      ctx.save();
      ctx.translate(b.cx + b.rx * 0.96, b.cy - b.h * 0.06);
      ctx.transform(1, 0, -0.28, 1, 0, 0);
      ctx.font = `800 ${size}px Inter, Helvetica, Arial, sans-serif`;
      ctx.fillStyle = '#c95745';
      ctx.fillText(BRAND.mark, 0, 0);
      ctx.fillStyle = '#3a100c';
      ctx.fillText(BRAND.mark, 9, 7);
      ctx.restore();
    }

    function drawGlass(now) {
      const b = bounds();
      const step = width < 520 ? 10 : 8;
      const idleX = reducedMotion ? b.cx : b.cx + Math.sin(now / 900) * b.rx * 0.35;
      const idleY = reducedMotion ? b.cy : b.cy + Math.cos(now / 1100) * b.ry * 0.28;
      const lightX = pointer.active ? pointer.x : idleX;
      const lightY = pointer.active ? pointer.y : idleY;
      const aura = ctx.createRadialGradient(b.cx, b.cy, b.rx * 0.18, b.cx, b.cy, b.ry * 1.1);
      aura.addColorStop(0, 'rgba(231,101,67,0.18)');
      aura.addColorStop(1, 'rgba(231,101,67,0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.ellipse(b.cx, b.cy, b.rx * 1.35, b.ry * 1.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(b.cx, b.cy, b.rx, b.ry, 0, 0, Math.PI * 2);
      ctx.clip();
      for (let y = b.cy - b.ry; y < b.cy + b.ry; y += step) {
        for (let x = b.cx - b.rx; x < b.cx + b.rx; x += step) {
          const dx = x + step / 2 - lightX;
          const dy = y + step / 2 - lightY;
          const falloff = Math.exp(-(dx * dx + dy * dy) / 12000);
          const ox = pointer.active ? dx * falloff * 0.12 : 0;
          const oy = pointer.active ? dy * falloff * 0.12 : 0;
          ctx.drawImage(cardCanvas,
            (x + ox) * dpr, (y + oy) * dpr, step * dpr, step * dpr,
            x, y, step + 0.6, step + 0.6
          );
        }
      }
      const highlight = ctx.createRadialGradient(lightX, lightY, 4, lightX, lightY, 96);
      highlight.addColorStop(0, 'rgba(255,255,255,0.38)');
      highlight.addColorStop(0.42, 'rgba(255,205,176,0.1)');
      highlight.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = highlight;
      ctx.fillRect(b.cx - b.rx, b.cy - b.ry, b.rx * 2, b.ry * 2);
      ctx.restore();
      drawReflection(b);
      drawWordmark(b);
    }

    function makeShards() {
      const b = bounds();
      shards.length = 0;
      const columns = 3;
      const rows = 4;
      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const x = b.cx - b.rx + column * (b.rx * 2 / columns);
          const y = b.cy - b.ry + row * (b.ry * 2 / rows);
          if (!inside(b, x + b.rx / columns, y + b.ry / rows)) continue;
          shards.push({
            x, y, sourceX: x, sourceY: y, w: b.rx * 2 / columns, h: b.ry * 2 / rows,
            vx: (column - 1) * 86, vy: -36 + row * 26,
            rotation: 0, spin: (column - 1) * 1.1
          });
        }
      }
    }

    function drawShards(dt) {
      for (const shard of shards) {
        shard.vy += 340 * dt;
        shard.x += shard.vx * dt;
        shard.y += shard.vy * dt;
        shard.rotation += shard.spin * dt;
        ctx.save();
        ctx.translate(shard.x + shard.w / 2, shard.y + shard.h / 2);
        ctx.rotate(shard.rotation);
        ctx.drawImage(cardCanvas,
          shard.sourceX * dpr, shard.sourceY * dpr, shard.w * dpr, shard.h * dpr,
          -shard.w / 2, -shard.h / 2, shard.w, shard.h
        );
        ctx.restore();
      }
      drawWordmark(bounds());
    }

    function beginTransition() {
      if (reducedMotion) {
        cardIndex = (cardIndex + 1) % BRAND.cards.length;
        paintCard();
        requestDraw();
        return;
      }
      phase = 'break';
      phaseTime = 0;
      makeShards();
    }

    function nextCard() {
      if (phase === 'break') return;
      beginTransition();
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = cardCanvas.width = Math.round(width * dpr);
      canvas.height = cardCanvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      pointer.x = width * 0.58;
      pointer.y = height * 0.46;
      paintCard();
      if (phase === 'break') makeShards();
      requestDraw();
    }

    function drawBranding() {
      ctx.globalAlpha = 0.58;
      ctx.fillStyle = '#f6e4d4';
      ctx.font = '11px Inter, Helvetica, Arial, sans-serif';
      ctx.letterSpacing = '0.18em';
      ctx.fillText(BRAND.name.toUpperCase(), 18, height - 16);
      ctx.globalAlpha = 1;
    }

    function requestDraw() {
      if (!frameRequest) frameRequest = requestAnimationFrame(frame);
    }

    function frame(now) {
      frameRequest = 0;
      const dt = Math.min(0.033, (now - lastFrame) / 1000);
      lastFrame = now;
      drawSky();
      if (reducedMotion) {
        drawGlass(now);
        drawBranding();
        return;
      }
      if (phase === 'glass') {
        drawGlass(now);
        phaseTime += dt;
        if (phaseTime > 4) {
          phase = 'break';
          phaseTime = 0;
          makeShards();
        }
      } else {
        drawShards(dt);
        phaseTime += dt;
        if (phaseTime > 1.25) {
          cardIndex = (cardIndex + 1) % BRAND.cards.length;
          paintCard();
          phase = 'glass';
          phaseTime = 0;
        }
      }
      drawBranding();
      requestDraw();
    }

    canvas.addEventListener('pointermove', (event) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;
      pointer.active = true;
      requestDraw();
    });
    canvas.addEventListener('pointerleave', () => {
      pointer.active = false;
      requestDraw();
    });
    control.addEventListener('click', nextCard);
    motionPreference.addEventListener('change', (event) => {
      reducedMotion = event.matches;
      if (reducedMotion) {
        phase = 'glass';
        phaseTime = 0;
        shards.length = 0;
      }
      if (frameRequest) {
        cancelAnimationFrame(frameRequest);
        frameRequest = 0;
      }
      requestDraw();
    });
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
