<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滚动网格重排</title>
<style>
  :root {
    --bg: #131417;
    --text: #f4f1ea;
    --muted: #b7b3aa;
    --base: min(16vh, 8.2vw);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", serif;
  }
  .hint {
    position: fixed;
    z-index: 3;
    top: 18px;
    left: 22px;
    margin: 0;
    font: 500 12px/1.4 "Segoe UI", "PingFang SC", sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stage { height: 320vh; position: relative; }
  .sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    --p: 0;
  }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.1vw, 18px);
    width: min(96vw, 1180px);
    min-height: 70vh;
  }
  .tile {
    flex: none;
    width: auto;
    aspect-ratio: 2 / 3;
    border-radius: 2px;
    background:
      radial-gradient(circle at 50% 42%, var(--hi), transparent 42%),
      linear-gradient(160deg, var(--a), var(--b));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .tile.s { height: var(--base); }
  .tile.m { height: calc(var(--base) * (1.25 - 0.25 * var(--p))); }
  .tile.l { height: calc(var(--base) * (2.5 - 1.5 * var(--p))); }
  .tile.xl { height: calc(var(--base) * 3.15); z-index: 1; }
  .t1 { --a: #f2d7c4; --b: #c9847a; --hi: #fff6ee; }
  .t2 { --a: #d7e4d2; --b: #7ea3a0; --hi: #f7fff8; }
  .t3 { --a: #f0e2b8; --b: #d08a4c; --hi: #fff8e6; }
  .t4 { --a: #f6efe6; --b: #e7b7a2; --hi: #fff; }
  .t5 { --a: #d5d0ea; --b: #8d7eb5; --hi: #f8f6ff; }
  .t6 { --a: #ead7c8; --b: #a86b58; --hi: #fff4ec; }
  .t7 { --a: #d9e7ea; --b: #6f8f98; --hi: #f4fbff; }
  .tile::after {
    content: "";
    display: block;
    width: 46%;
    height: 28%;
    margin: 38% auto 0;
    border: 2px solid rgba(255,255,255,0.72);
    border-radius: 999px;
  }
  .t3::after, .t6::after { height: 46%; border-radius: 40% 40% 12% 12%; }
  .t2::after, .t5::after { width: 18%; height: 58%; border-radius: 999px; }
  .caption {
    position: absolute;
    left: 0;
    right: 0;
    margin: 0 auto;
    max-width: 34rem;
    padding: 0 6vw;
    text-align: left;
    font-size: clamp(1.35rem, 3vw, 2.15rem);
    line-height: 1.25;
    color: var(--text);
  }
  .row .caption {
    bottom: calc((1 - var(--p)) * -42vh);
    opacity: var(--p);
  }
  .field-wrap {
    position: relative;
    width: min(92vw, 1080px);
    height: min(78vh, 720px);
  }
  .field {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 2px;
    overflow: hidden;
    background:
      linear-gradient(#163e78 0 38%, transparent 38%),
      linear-gradient(180deg, #d7b56a, #8d5a2b);
    filter: hue-rotate(calc((1 - var(--p)) * 90deg)) brightness(calc(1.05 - 0.28 * var(--p)));
    transform: scale(calc(2.35 - 1.35 * var(--p)));
    transform-origin: 60% 45%;
  }
  .field::before,
  .field::after {
    content: "";
    position: absolute;
  }
  .field::before {
    left: 18%;
    right: 22%;
    top: 46%;
    height: 38%;
    background:
      linear-gradient(#f0d48a, #c4924a) 0 0 / 18% 100% no-repeat,
      linear-gradient(#e7c56e, #a87434) 28% 8% / 14% 92% no-repeat,
      linear-gradient(#f3dba0, #b8843e) 52% 0 / 22% 100% no-repeat,
      linear-gradient(#e2bc62, #9a6a30) 80% 12% / 16% 88% no-repeat;
  }
  .field::after {
    width: 18%;
    height: 22%;
    left: 58%;
    top: 18%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff6d2, #f0c56a 55%, transparent 70%);
  }
  .field-wrap .caption {
    top: calc(10% + (1 - var(--p)) * 70vh);
    opacity: var(--p);
    max-width: 22rem;
    text-align: center;
    text-shadow: 0 1px 16px rgba(0,0,0,0.45);
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { height: auto; }
    .sticky { position: relative; --p: 1; }
    .hint { position: absolute; }
  }
  @media (max-width: 720px) {
    .row .caption, .field-wrap .caption { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<p class="hint">向下滚动</p>
<section class="stage" data-stage>
  <div class="sticky">
    <div class="row">
      <div class="tile s t1"></div>
      <div class="tile m t2"></div>
      <div class="tile l t3"></div>
      <div class="tile xl t4"></div>
      <div class="tile l t5"></div>
      <div class="tile m t6"></div>
      <div class="tile s t7"></div>
      <p class="caption">高低不一的一排，收成中间那一张。</p>
    </div>
  </div>
</section>
<section class="stage" data-stage>
  <div class="sticky">
    <div class="field-wrap">
      <div class="field" role="img" aria-label="放大并偏色的整幅画面收回框内，上蓝下金"></div>
      <p class="caption">放大的整幅，收回框里。</p>
    </div>
  </div>
</section>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var stages = Array.prototype.slice.call(document.querySelectorAll('[data-stage]'));
  function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
  function apply() {
    var reduced = reduce.matches;
    for (var i = 0; i < stages.length; i++) {
      var stage = stages[i];
      var sticky = stage.querySelector('.sticky');
      var p = 1;
      if (!reduced) {
        var total = stage.offsetHeight - window.innerHeight;
        var scrolled = -stage.getBoundingClientRect().top;
        p = total <= 0 ? 1 : clamp(scrolled / total, 0, 1);
      }
      sticky.style.setProperty('--p', p.toFixed(4));
    }
  }
  window.addEventListener('scroll', apply, { passive: true });
  window.addEventListener('resize', apply);
  if (reduce.addEventListener) reduce.addEventListener('change', apply);
  else if (reduce.addListener) reduce.addListener(apply);
  apply();
})();
</script>
</body>
</html>
