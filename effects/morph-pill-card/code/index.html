<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>胶囊原地展开</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 32px 16px;
      background: #f3efe7; color: #1d1a16;
      font: 16px/1.45 "Segoe UI", "PingFang SC", sans-serif;
    }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: center; width: min(920px, 100%); }
    .pill {
      width: max-content; max-width: 100%; padding: 0; border: 1px solid #1d1a16; border-radius: 999px;
      background: #fffdf8; color: inherit; text-align: left; cursor: pointer; overflow: hidden;
      display: flex; flex-direction: column;
      transition: width .42s cubic-bezier(.2,.8,.2,1), border-radius .42s;
    }
    .pill.is-open { width: min(460px, 100%); border-radius: 22px; }
    .face { min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 6px; font-weight: 700; }
    .mark { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6, transparent 42%), var(--swatch); flex: none; }
    .detail { display: none; }
    .pill.is-open .detail { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; padding: 0 14px 14px; }
    .detail .copy { display: block; margin: 0; color: #5e584f; font-size: 14px; font-weight: 500; }
    .swatch { height: 112px; border-radius: 16px; background: linear-gradient(160deg, var(--swatch), #1d1a16 78%); }
    .pill:focus-visible { outline: 2px solid #1d1a16; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .pill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="row" id="pills">
    <button class="pill" type="button" style="--swatch:#d36b45" aria-expanded="false">
      <span class="face">北向<span class="mark"></span></span>
      <span class="detail" aria-hidden="true" inert><span class="swatch"></span><span class="copy">同一张胶囊向下展开。这里只有色块和两句说明，没有外部图片。</span></span>
    </button>
    <button class="pill" type="button" style="--swatch:#3f6f62" aria-expanded="false">
      <span class="face">折页<span class="mark"></span></span>
      <span class="detail" aria-hidden="true" inert><span class="swatch"></span><span class="copy">细指针移出后收回。触控和键盘会把展开态钉住，直到再次关闭。</span></span>
    </button>
    <button class="pill" type="button" style="--swatch:#d2a24c" aria-expanded="false">
      <span class="face">暖点<span class="mark"></span></span>
      <span class="detail" aria-hidden="true" inert><span class="swatch"></span><span class="copy">按 Escape 或点空白即可退出，焦点仍留在刚才的胶囊上。</span></span>
    </button>
  </div>
  <script>
    const pills = [...document.querySelectorAll(".pill")];
    const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    let pinned = null;
    function setOpen(target) {
      for (const pill of pills) {
        const on = pill === target;
        const detail = pill.querySelector(".detail");
        pill.classList.toggle("is-open", on);
        pill.setAttribute("aria-expanded", on ? "true" : "false");
        detail.setAttribute("aria-hidden", on ? "false" : "true");
        if (on) detail.removeAttribute("inert");
        else detail.setAttribute("inert", "");
      }
    }
    for (const pill of pills) {
      pill.addEventListener("click", () => {
        pinned = pinned === pill ? null : pill;
        setOpen(pinned);
      });
      if (!fine) continue;
      pill.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "touch" || pinned) return;
        setOpen(pill);
      });
      pill.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "touch" || pinned) return;
        setOpen(null);
      });
    }
    document.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".pill")) return;
      pinned = null;
      setOpen(null);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      pinned = null;
      setOpen(null);
    });
  </script>
</body>
</html>
