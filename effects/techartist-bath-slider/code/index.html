<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Just Right</title>
  <style>
    :root {
      --pos: 0.5;
      --lift: 0;
      --bob: 0px;
      --tilt: 0deg;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background: #12163d;
      color: #fff;
      font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
    }
    header { padding: clamp(16px, 3vw, 28px) clamp(16px, 3vw, 32px) 0; }
    h1 {
      margin: 0;
      font-size: clamp(18px, 2.5vw, 22px);
      font-weight: 720;
      letter-spacing: -0.02em;
    }
    header p { margin: 3px 0 0; color: rgba(255,255,255,.64); font-size: clamp(12px, 2vw, 14px); }
    .scene {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 12px 0 4px;
    }
    #air {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .tub {
      position: relative;
      z-index: 1;
      width: min(820px, 94vw, 150vh);
      aspect-ratio: 2.5 / 1;
      border-radius: 999px;
      background: linear-gradient(#fff, #f3f6fa 70%, #e7edf3);
      box-shadow:
        0 28px 40px rgba(0,0,0,.28),
        inset 0 2px 0 rgba(255,255,255,.9),
        inset 0 -16px 24px rgba(170,184,198,.35);
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .tub.dragging { cursor: grabbing; }
    .water {
      position: absolute;
      left: 7%;
      top: 16%;
      width: 86%;
      height: 70%;
      border-radius: 999px;
      overflow: hidden;
      pointer-events: none;
    }
    #pool { display: block; width: 100%; height: 100%; }
    .tap {
      position: absolute;
      z-index: 3;
      top: 8%;
      width: 12%;
      height: 28%;
      pointer-events: none;
    }
    .tap.cold { left: 6%; }
    .tap.hot { right: 6%; }
    .tap svg { width: 100%; height: 100%; overflow: visible; }
    .duck {
      position: absolute;
      z-index: 3;
      top: calc(66% - var(--lift) * 52% + var(--bob));
      left: 50%;
      width: min(22%, 148px);
      transform: translate(-50%, -50%) rotate(var(--tilt));
      background: none;
      border: 0;
      padding: 0;
      cursor: grab;
      touch-action: none;
    }
    .duck:focus { outline: none; }
    .duck:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 6px;
      border-radius: 999px;
    }
    .duck svg { display: block; width: 100%; height: auto; transform-origin: 50% 58%; }
    .duck[data-face="left"] svg { transform: scaleX(-1); }
    .bubble {
      position: absolute;
      left: 50%;
      bottom: 92%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      align-items: baseline;
      padding: 4px 10px 5px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,.16);
      white-space: nowrap;
      pointer-events: none;
      font-size: clamp(11px, 2.2vw, 14px);
    }
    .bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 9px;
      height: 9px;
      background: #fff;
      transform: translateX(-50%) rotate(45deg);
    }
    .bubble b { font-weight: 750; letter-spacing: -0.02em; color: #2a3340; }
    .bubble em { font-style: normal; color: #66707c; font-weight: 600; }
    .foot {
      text-align: center;
      padding: 6px 16px 22px;
    }
    .hint {
      margin: 0 auto;
      max-width: 40rem;
      color: rgba(255,255,255,.84);
      font-size: clamp(12px, 2.3vw, 14px);
      text-wrap: balance;
    }
    .credit {
      margin: 16px 0 0;
      color: rgba(255,255,255,.42);
      font-size: 12px;
    }
    @media (max-width: 640px) {
      .tub { aspect-ratio: 2.05 / 1; }
      .duck { width: min(28%, 132px); }
      .bubble { gap: 4px; padding: 3px 8px 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .duck { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Just Right</h1>
    <p>a bath temperature slider</p>
  </header>
  <div class="scene" id="scene">
    <canvas id="air"></canvas>
    <div class="tub" id="tub">
      <div class="water" id="water"><canvas id="pool"></canvas></div>
      <div class="tap cold" aria-hidden="true">
        <svg viewBox="0 0 70 48">
          <path d="M18 34c0-14 10-22 22-22" fill="none" stroke="#d5dde6" stroke-width="7" stroke-linecap="round"/>
          <rect x="36" y="8" width="22" height="8" rx="4" fill="#e7eef5"/>
          <circle cx="22" cy="34" r="7" fill="#7ec8f0"/>
          <circle cx="20" cy="32" r="2" fill="#fff" opacity=".8"/>
        </svg>
      </div>
      <div class="tap hot" aria-hidden="true">
        <svg viewBox="0 0 70 48">
          <path d="M52 34c0-14-10-22-22-22" fill="none" stroke="#d5dde6" stroke-width="7" stroke-linecap="round"/>
          <rect x="12" y="8" width="22" height="8" rx="4" fill="#e7eef5"/>
          <circle cx="48" cy="34" r="7" fill="#f3a0b5"/>
          <circle cx="46" cy="32" r="2" fill="#fff" opacity=".8"/>
        </svg>
      </div>
      <div class="duck" id="duck" role="slider" tabindex="0" aria-label="Bath temperature" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38" aria-valuetext="38°C, just right" aria-describedby="hint">
        <span class="bubble" id="bubble"><b id="num">38°C</b> <em id="word">just right</em></span>
        <svg viewBox="0 0 140 110" aria-hidden="true">
          <ellipse cx="62" cy="74" rx="40" ry="28" fill="#ffd84a"/>
          <ellipse cx="58" cy="80" rx="22" ry="14" fill="#ffe78a" opacity=".55"/>
          <ellipse cx="86" cy="48" rx="28" ry="26" fill="#ffe14d"/>
          <ellipse cx="48" cy="76" rx="16" ry="11" fill="#f0b62a"/>
          <ellipse cx="112" cy="52" rx="16" ry="9" fill="#ff8a3d"/>
          <path d="M100 52h20" stroke="#e86f28" stroke-width="1.4"/>
          <circle cx="96" cy="40" r="7" fill="#fff"/>
          <circle cx="98" cy="40.5" r="3.6" fill="#1c1c1c"/>
          <circle cx="99.4" cy="39.1" r="1.3" fill="#fff"/>
        </svg>
      </div>
    </div>
  </div>
  <footer class="foot">
    <p class="hint" id="hint"><b>Push the duck</b> toward the cold tap or the hot tap, or use the arrow keys</p>
    <p class="credit">© 2026 Techartist</p>
  </footer>
  <script>
    var GAMMA = 1.4;
    var BG = [
      [0, [10, 48, 62]],
      [17, [12, 40, 58]],
      [38, [18, 22, 61]],
      [48, [41, 9, 45]],
      [70, [52, 11, 22]],
      [100, [54, 11, 12]]
    ];
    var duck = document.getElementById("duck");
    var tub = document.getElementById("tub");
    var water = document.getElementById("water");
    var scene = document.getElementById("scene");
    var num = document.getElementById("num");
    var word = document.getElementById("word");
    var bubble = document.getElementById("bubble");
    var air = document.getElementById("air");
    var pool = document.getElementById("pool");
    var reduceQ = window.matchMedia("(prefers-reduced-motion: reduce)");
    var goalPos = posFromTemp(38);
    var shownPos = goalPos;
    var dragging = false;
    var pointerId = null;
    var sim = 0;
    var last = 0;
    var loopOn = false;
    var rand = mulberry32(212075);
    var steams = make(16, function () { return { x: rand(), k: rand(), s: rand() }; });
    var sparks = make(32, function () { return { x: rand(), k: rand(), s: rand(), drift: rand() * 2 - 1 }; });
    var suds = make(14, function () { return { x: rand(), y: rand() * 0.45, k: rand(), s: 0.4 + rand() }; });
    var bubbles = make(18, function () { return { x: rand(), k: rand(), s: rand(), speed: 0.35 + rand() }; });
    var shards = make(18, function () {
      return { x: 0.08 + rand() * 0.84, y: 0.18 + rand() * 0.7, w: 0.05 + rand() * 0.1, h: 0.04 + rand() * 0.07, rot: rand() * 6.28, k: rand() };
    });
    var caustics = make(7, function () {
      return { x: rand(), y: rand(), s: rand(), k: rand(), rot: rand() * 3 };
    });

    function mulberry32(seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function make(n, fn) {
      var list = [];
      for (var i = 0; i < n; i++) list.push(fn());
      return list;
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function mix(a, b, t) { return a + (b - a) * t; }
    function mix3(a, b, t) { return [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)]; }
    function css(rgb, alpha) {
      var body = rgb.map(function (v) { return Math.round(v); }).join(",");
      return alpha == null ? "rgb(" + body + ")" : "rgba(" + body + "," + alpha + ")";
    }
    function sample(stops, temp) {
      if (temp <= stops[0][0]) return stops[0][1].slice();
      for (var i = 1; i < stops.length; i++) {
        if (temp <= stops[i][0]) {
          var t = (temp - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
          return mix3(stops[i - 1][1], stops[i][1], t);
        }
      }
      return stops[stops.length - 1][1].slice();
    }
    function posFromTemp(t) { return Math.pow(clamp(t, 0, 100) / 100, 1 / GAMMA); }
    function tempFromPos(p) { return 100 * Math.pow(clamp(p, 0, 1), GAMMA); }
    function reduced() { return reduceQ.matches; }
    function describe(t) {
      if (t >= 94) return "boiling!";
      if (t >= 84) return "scalding";
      if (t >= 45) return "toasty";
      if (t >= 34) return "just right";
      if (t >= 22) return "lukewarm";
      if (t >= 8) return "chilly";
      return "freezing";
    }
    function setTemp(next) {
      goalPos = posFromTemp(clamp(Math.round(next), 0, 100));
    }
    function setPos(p) {
      goalPos = clamp(p, 0, 1);
    }
    function posFromEvent(e) {
      var rect = water.getBoundingClientRect();
      if (!rect.width) return goalPos;
      return clamp((e.clientX - rect.left) / rect.width, 0, 1);
    }
    function fit(canvas) {
      var rect = canvas.getBoundingClientRect();
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, Math.round(rect.width * dpr));
      var h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      var g = canvas.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { g: g, w: rect.width, h: rect.height };
    }
    function requestDraw() {
      if (reduced()) {
        shownPos = goalPos;
        paint();
        return;
      }
      if (loopOn) return;
      loopOn = true;
      last = performance.now();
      requestAnimationFrame(loop);
    }
    function loop(now) {
      if (reduced()) {
        loopOn = false;
        shownPos = goalPos;
        paint();
        return;
      }
      var dt = Math.min(40, now - last);
      last = now;
      if (dragging) shownPos = goalPos;
      else shownPos += (goalPos - shownPos) * (1 - Math.exp(-dt / 90));
      sim += dt / 1000;
      paint();
      requestAnimationFrame(loop);
    }
    function paint() {
      var visual = tempFromPos(shownPos);
      var shown = Math.round(visual);
      var bg = sample(BG, visual);
      var glow = bg.map(function (v, i) { return v + [26, 12, 14][i]; });
      document.body.style.background =
        "radial-gradient(70% 55% at 50% 42%, " + css(glow) + " 0%, " + css(bg) + " 62%)";
      num.textContent = shown + "°C";
      num.style.color = shown >= 60 ? "#e24b4b" : "#2a3340";
      word.textContent = describe(shown);
      duck.setAttribute("aria-valuenow", String(shown));
      duck.setAttribute("aria-valuetext", shown + "°C, " + describe(shown));
      var lift = clamp((visual - 93) / 7, 0, 1);
      var bob = !reduced() && lift > 0 ? Math.sin(sim * 9) * 5 * lift : 0;
      var face = shownPos < 0.48 ? "left" : "right";
      duck.dataset.face = face;
      var tubW = tub.getBoundingClientRect().width || 1;
      var half = (duck.getBoundingClientRect().width / 2 / tubW) * 100;
      var edge = Math.min(40, 8 + half);
      duck.style.left = (edge + shownPos * (100 - edge * 2)).toFixed(3) + "%";
      duck.style.setProperty("--lift", lift.toFixed(3));
      duck.style.setProperty("--bob", bob.toFixed(2) + "px");
      duck.style.setProperty("--tilt", ((face === "left" ? 14 : -14) * lift).toFixed(2) + "deg");
      var bubW = bubble.offsetWidth || 0;
      var center = duck.getBoundingClientRect().left + duck.getBoundingClientRect().width / 2;
      var sceneBox = scene.getBoundingClientRect();
      var bubLeft = center - bubW / 2;
      var shift = 0;
      if (bubLeft < sceneBox.left + 8) shift = sceneBox.left + 8 - bubLeft;
      else if (bubLeft + bubW > sceneBox.right - 8) shift = sceneBox.right - 8 - (bubLeft + bubW);
      bubble.style.transform = "translateX(calc(-50% + " + shift.toFixed(1) + "px))";
      drawPool(visual);
      drawAir(visual);
    }
    function drawPool(temp) {
      var box = fit(pool);
      var g = box.g;
      var w = box.w;
      var h = box.h;
      if (w < 2 || h < 2) return;
      var still = reduced();
      var cold = clamp((40 - temp) / 40, 0, 1);
      var hot = clamp((temp - 45) / 55, 0, 1);
      var top = mix3(mix3([176, 226, 232], [236, 250, 252], cold), [214, 248, 255], hot);
      var bot = mix3(mix3([96, 190, 208], [168, 214, 224], cold), [126, 214, 226], hot);
      g.clearRect(0, 0, w, h);
      var wash = g.createLinearGradient(0, 0, 0, h);
      wash.addColorStop(0, css(top));
      wash.addColorStop(1, css(bot));
      g.fillStyle = wash;
      g.fillRect(0, 0, w, h);
      for (var i = 0; i < caustics.length; i++) {
        var c = caustics[i];
        var drift = still ? 0 : Math.sin(sim * 0.7 + c.k * 6) * 0.035;
        var x = (c.x + drift) * w;
        var y = (0.22 + c.y * 0.62) * h;
        var rx = w * (0.07 + c.s * 0.07);
        var ry = h * (0.07 + c.s * 0.05);
        var a = 0.16 + hot * 0.2 - cold * 0.06;
        g.save();
        g.translate(x, y);
        g.rotate(c.rot + (still ? 0 : sim * 0.15));
        var cg = g.createRadialGradient(0, 0, rx * 0.15, 0, 0, rx);
        cg.addColorStop(0, "rgba(255,255,255," + a + ")");
        cg.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = cg;
        g.beginPath();
        g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }
      var comfort = Math.exp(-Math.pow(temp - 34, 2) / 280);
      for (var s = 0; s < suds.length; s++) {
        var sud = suds[s];
        var gate = clamp((comfort - sud.k) / 0.15, 0, 1);
        if (gate <= 0) continue;
        var sx = (sud.x + (still ? 0 : Math.sin(sim * 0.4 + sud.k * 5) * 0.02)) * w;
        var sy = (0.08 + sud.y * 0.42) * h;
        g.fillStyle = "rgba(255,255,255," + (0.28 * gate) + ")";
        g.beginPath();
        g.ellipse(sx, sy, w * 0.035 * sud.s, h * 0.045 * sud.s, 0, 0, Math.PI * 2);
        g.fill();
      }
      var haze = clamp((temp - 50) / 50, 0, 1);
      if (haze > 0) {
        var fog = g.createLinearGradient(0, 0, 0, h);
        fog.addColorStop(0, "rgba(255,255,255," + (haze * 0.5) + ")");
        fog.addColorStop(0.62, "rgba(255,255,255," + (haze * 0.14) + ")");
        fog.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = fog;
        g.fillRect(0, 0, w, h);
      }
      var boil = clamp((temp - 78) / 22, 0, 1);
      for (var b = 0; b < bubbles.length; b++) {
        var bub = bubbles[b];
        var show = clamp((boil - bub.k) / 0.12, 0, 1);
        if (show <= 0) continue;
        var life = still ? bub.k : (bub.k + sim * bub.speed * (0.25 + boil)) % 1;
        var bx = bub.x * w;
        var by = h * (0.92 - life * 0.78);
        g.strokeStyle = "rgba(255,255,255," + (0.45 * show * Math.sin(life * Math.PI)) + ")";
        g.lineWidth = 1.4;
        g.beginPath();
        g.arc(bx, by, (2 + bub.s * 5) * (0.6 + life), 0, Math.PI * 2);
        g.stroke();
      }
      var ice = clamp((16 - temp) / 16, 0, 1);
      if (ice > 0) {
        g.fillStyle = "rgba(236,248,252," + (ice * 0.55) + ")";
        g.fillRect(0, 0, w, h);
        for (var k = 0; k < shards.length; k++) {
          var shard = shards[k];
          var appear = clamp((ice - shard.k) / 0.12, 0, 1);
          if (appear <= 0) continue;
          var rw = Math.max(16, shard.w * w * 0.42);
          var rh = Math.max(11, rw * 0.46);
          g.save();
          g.translate(shard.x * w, shard.y * h);
          g.rotate((shard.rot - 3.14) * 0.2);
          g.globalAlpha = 0.55 + appear * 0.4;
          g.fillStyle = "#f7fdff";
          g.strokeStyle = "rgba(140,196,214,.95)";
          g.lineWidth = 1.25;
          g.beginPath();
          g.moveTo(-rw, rh * 0.15);
          g.lineTo(-rw * 0.2, -rh);
          g.lineTo(rw * 0.85, -rh * 0.2);
          g.lineTo(rw * 0.35, rh);
          g.closePath();
          g.fill();
          g.stroke();
          g.restore();
        }
        g.globalAlpha = 1;
      }
    }
    function drawAir(temp) {
      var box = fit(air);
      var g = box.g;
      var w = box.w;
      var h = box.h;
      if (w < 2 || h < 2) return;
      var still = reduced();
      var sceneBox = scene.getBoundingClientRect();
      var waterBox = water.getBoundingClientRect();
      var origin = {
        x: waterBox.left - sceneBox.left,
        y: waterBox.top - sceneBox.top,
        w: waterBox.width,
        h: waterBox.height
      };
      g.clearRect(0, 0, w, h);
      var steam = clamp((temp - 46) / 48, 0, 1);
      for (var i = 0; i < steams.length; i++) {
        var p = steams[i];
        var gate = clamp((steam - p.k) / 0.1, 0, 1);
        if (gate <= 0) continue;
        var life = still ? 0.42 : (p.k * 0.2 + sim * (0.07 + steam * 0.1)) % 1;
        var x = origin.x + (0.08 + p.x * 0.84) * origin.w + (still ? 0 : Math.sin(sim + p.k * 8) * 14);
        var y = origin.y + origin.h * 0.42 - life * (origin.h * 0.55 + 110 * steam);
        var rad = (36 + p.s * 78) * (0.75 + steam * 0.85);
        var alpha = gate * (0.1 + steam * 0.32) * Math.sin(Math.max(0, life) * Math.PI);
        var sg = g.createRadialGradient(x, y, rad * 0.2, x, y, rad);
        sg.addColorStop(0, "rgba(255,255,255," + alpha + ")");
        sg.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = sg;
        g.beginPath();
        g.arc(x, y, rad, 0, Math.PI * 2);
        g.fill();
      }
      var spark = clamp((temp - 88) / 12, 0, 1);
      var duckX = origin.x + shownPos * origin.w;
      for (var j = 0; j < sparks.length; j++) {
        var q = sparks[j];
        var on = clamp((spark - q.k) / 0.08, 0, 1);
        if (on <= 0) continue;
        var age = still ? q.k : (q.k + sim * (0.35 + spark * 0.8)) % 1;
        var sx = mix(origin.x + q.x * origin.w, duckX, 0.55) + q.drift * 36 * age;
        var sy = origin.y - 8 - age * (50 + spark * 90);
        var fade = on * Math.sin(age * Math.PI);
        g.fillStyle = "rgba(255,244,220," + fade + ")";
        g.beginPath();
        g.arc(sx, sy, 1.8 + q.s * 2.4, 0, Math.PI * 2);
        g.fill();
      }
    }

    tub.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      dragging = true;
      pointerId = e.pointerId;
      tub.classList.add("dragging");
      tub.setPointerCapture(e.pointerId);
      duck.focus({ preventScroll: true });
      setPos(posFromEvent(e));
      shownPos = goalPos;
      requestDraw();
    });
    tub.addEventListener("pointermove", function (e) {
      if (!dragging || e.pointerId !== pointerId) return;
      setPos(posFromEvent(e));
      shownPos = goalPos;
      if (reduced()) requestDraw();
    });
    function endDrag(e) {
      if (e.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      tub.classList.remove("dragging");
      if (reduced()) requestDraw();
    }
    tub.addEventListener("pointerup", endDrag);
    tub.addEventListener("pointercancel", endDrag);
    duck.addEventListener("keydown", function (e) {
      var dir = { ArrowLeft: -1, ArrowRight: 1, ArrowDown: -1, ArrowUp: 1 }[e.key] || 0;
      if (e.key === "Home") dir = -1000;
      else if (e.key === "End") dir = 1000;
      else if (e.key === "PageDown") dir = -5;
      else if (e.key === "PageUp") dir = 5;
      else if (!dir) return;
      if (e.shiftKey && Math.abs(dir) === 1) dir *= 5;
      var current = Math.round(tempFromPos(goalPos));
      setTemp(dir <= -1000 ? 0 : dir >= 1000 ? 100 : current + dir);
      e.preventDefault();
      requestDraw();
    });
    if (reduceQ.addEventListener) reduceQ.addEventListener("change", requestDraw);
    else if (reduceQ.addListener) reduceQ.addListener(requestDraw);
    window.addEventListener("resize", requestDraw);
    requestDraw();
  </script>
</body>
</html>
