<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>色块从中心弯着飞入</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #60baaa;
      color: #16302c;
      font: 15px/1.4 Georgia, "Times New Roman", serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #60baaa;
      touch-action: none;
      cursor: ns-resize;
    }
    #stage:focus { outline: none; }
    #stage:focus-visible { outline: 2px solid #16302c; outline-offset: -6px; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hint {
      position: absolute;
      left: 16px;
      top: 14px;
      margin: 0;
      max-width: calc(100% - 32px);
      font: 12px/1.4 system-ui, "Segoe UI", sans-serif;
      color: #16302c;
      pointer-events: none;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="stage" tabindex="0" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="色块还收在中心" aria-label="色块从中心飞入">
    <canvas id="view" aria-hidden="true"></canvas>
    <p id="hint">滚轮、拖动或方向键。色块从中心弯着飞开。</p>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var canvas = document.getElementById("view");
      var hint = document.getElementById("hint");
      var live = document.getElementById("live");
      var ctx = canvas.getContext("2d");
      var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var progress = 0;
      var touchY = null;
      var announced = "";
      var SPAN = 920;
      var TAU = Math.PI * 2;
      var warp = document.createElement("canvas");
      warp.width = 480;
      warp.height = 270;
      var warpCtx = warp.getContext("2d");
      var raster = warpCtx.createImageData(warp.width, warp.height);
      var tiles = [
        { x: 0.14, y: 0.16, w: 0.24, h: 0.13, c: "#1b3330", k: 0.40, r: -0.05 },
        { x: 0.30, y: 0.13, w: 0.18, h: 0.10, c: "#d9d3c4", k: 0.85, r: 0.06 },
        { x: 0.48, y: 0.12, w: 0.16, h: 0.09, c: "#3d5246", k: 1.25, r: -0.04 },
        { x: 0.68, y: 0.15, w: 0.25, h: 0.12, c: "#152824", k: 0.55, r: 0.05 },
        { x: 0.86, y: 0.24, w: 0.20, h: 0.15, c: "#243842", k: 0.95, r: -0.06 },
        { x: 0.12, y: 0.40, w: 0.22, h: 0.14, c: "#6a5142", k: 0.25, r: 0.04 },
        { x: 0.24, y: 0.32, w: 0.15, h: 0.09, c: "#8aa08a", k: 1.35, r: -0.08 },
        { x: 0.78, y: 0.38, w: 0.19, h: 0.11, c: "#1c2a31", k: 0.65, r: 0.07 },
        { x: 0.88, y: 0.52, w: 0.17, h: 0.13, c: "#35564f", k: 1.05, r: -0.04 },
        { x: 0.14, y: 0.62, w: 0.23, h: 0.13, c: "#2a2420", k: 0.48, r: 0.03 },
        { x: 0.32, y: 0.74, w: 0.25, h: 0.12, c: "#3c4936", k: 0.90, r: -0.05 },
        { x: 0.50, y: 0.80, w: 0.22, h: 0.12, c: "#172220", k: 1.20, r: 0.04 },
        { x: 0.70, y: 0.70, w: 0.23, h: 0.14, c: "#8d6a55", k: 0.35, r: -0.06 },
        { x: 0.86, y: 0.76, w: 0.20, h: 0.15, c: "#22362e", k: 0.78, r: 0.08 },
        { x: 0.40, y: 0.26, w: 0.13, h: 0.08, c: "#121e1c", k: 1.50, r: 0.10 },
        { x: 0.60, y: 0.30, w: 0.13, h: 0.08, c: "#c4b49a", k: 1.15, r: -0.09 },
        { x: 0.18, y: 0.86, w: 0.28, h: 0.11, c: "#1c2e2b", k: 0.60, r: 0.02 },
        { x: 0.62, y: 0.90, w: 0.30, h: 0.10, c: "#2c3e36", k: 1.00, r: -0.03 }
      ];
      tiles.forEach(function (tile) {
        var n = parseInt(tile.c.slice(1), 16);
        tile.rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      });

      function clamp(n) { return n < 0 ? 0 : n > 1 ? 1 : n; }
      function smooth(t) { return t * t * (3 - 2 * t); }
      function shown() { return motion.matches ? 1 : progress; }

      function paintWarp(open) {
        var w = warp.width;
        var h = warp.height;
        var d = raster.data;
        var cx = (w - 1) / 2;
        var cy = (h - 1) / 2;
        var scale = h * 0.52;
        var reach = 0.55 + 1.35 * open;
        var reach2 = reach * reach * 0.55;
        var twistK = open * 0.42;
        var i = 0;
        for (var y = 0; y < h; y++) {
          var dy = (y - cy) / scale;
          for (var x = 0; x < w; x++) {
            var dx = (x - cx) / scale;
            var r2 = dx * dx + dy * dy;
            var r = Math.sqrt(r2);
            var a = Math.atan2(dy, dx) + twistK * Math.exp(-r * 0.7);
            var t = (a / TAU + 0.5) * 8;
            var ft = Math.floor(t);
            var edge = (Math.abs(t - ft - 0.5) * 2 - 0.08) / 0.75;
            if (edge < 0) edge = 0;
            else if (edge > 1) edge = 1;
            edge = edge * edge * (3 - 2 * edge);
            var fade = Math.exp(-r2 / reach2);
            var odd = ft & 1;
            var br = odd ? 206 : 198;
            var bgc = odd ? 78 : 240;
            var bbc = odd ? 112 : 230;
            var mr = 96 + (br - 96) * edge;
            var mg = 186 + (bgc - 186) * edge;
            var mb = 170 + (bbc - 170) * edge;
            var rr = 96 + (mr - 96) * fade;
            var gg = 186 + (mg - 186) * fade;
            var bb = 170 + (mb - 170) * fade;
            var core = 1 - r / 0.04;
            if (core < 0) core = 0;
            else core = Math.pow(core, 1.5);
            d[i] = rr + (255 - rr) * core;
            d[i + 1] = gg + (240 - gg) * core;
            d[i + 2] = bb + (240 - bb) * core;
            d[i + 3] = 255;
            i += 4;
          }
        }
        warpCtx.putImageData(raster, 0, 0);
      }

      function drawTile(px, py, bw, bh, ang, bend, rgb) {
        var strips = 12;
        var ca = Math.cos(ang);
        var sa = Math.sin(ang);
        for (var s = 0; s < strips; s++) {
          var v0 = s / strips;
          var v1 = (s + 1) / strips;
          var b0 = bend * Math.sin(v0 * Math.PI);
          var b1 = bend * Math.sin(v1 * Math.PI);
          var y0 = -bh / 2 + v0 * bh;
          var y1 = -bh / 2 + v1 * bh + 0.6;
          var local = [
            [-bw / 2 + b0, y0],
            [bw / 2 + b0, y0],
            [bw / 2 + b1, y1],
            [-bw / 2 + b1, y1]
          ];
          var shade = 0.9 + 0.1 * Math.sin(v0 * Math.PI);
          ctx.beginPath();
          for (var p = 0; p < 4; p++) {
            var lx = local[p][0];
            var ly = local[p][1];
            var sx = px + lx * ca - ly * sa;
            var sy = py + lx * sa + ly * ca;
            if (p === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.closePath();
          ctx.fillStyle = "rgb(" +
            ((rgb[0] * shade) | 0) + "," +
            ((rgb[1] * shade) | 0) + "," +
            ((rgb[2] * shade) | 0) + ")";
          ctx.fill();
        }
      }

      function phrase(p) {
        if (motion.matches) return "已直接停在落定的色块。";
        if (p < 0.04) return "色块还收在中心。进度 " + Math.round(p * 100) + "。";
        if (p > 0.96) return "色块已经散开落定。进度 " + Math.round(p * 100) + "。";
        return "色块正在弯着飞开。进度 " + Math.round(p * 100) + "。";
      }

      function paint() {
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        if (w < 2 || h < 2) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var bw = Math.round(w * dpr);
        var bh = Math.round(h * dpr);
        if (canvas.width !== bw || canvas.height !== bh) {
          canvas.width = bw;
          canvas.height = bh;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var p = shown();
        var open = 0.1 + 0.9 * smooth(p);
        paintWarp(open);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(warp, 0, 0, w, h);

        var size = Math.max(22, Math.min(w * 0.105, h * 0.16));
        ctx.fillStyle = "#161412";
        ctx.font = "500 " + size + "px Georgia, 'Times New Roman', serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("SAMPLE", w / 2, h * 0.46 - size * 0.52);
        ctx.fillText("BOARD", w / 2, h * 0.46 + size * 0.52);

        var unit = Math.min(w, h);
        var cx = w / 2;
        var cy = h / 2;
        var order = tiles.map(function (tile, index) {
          return { i: index, u: p <= 0 ? 0 : Math.pow(p, 0.55 + tile.k * 0.45) };
        });
        order.sort(function (a, b) { return a.u - b.u; });
        for (var n = 0; n < order.length; n++) {
          var tile = tiles[order[n].i];
          var s = smooth(order[n].u);
          var tx = tile.x * w;
          var ty = tile.y * h;
          var px = cx + (tx - cx) * s;
          var py = cy + (ty - cy) * s;
          var aim = Math.atan2(ty - cy, tx - cx);
          var ang = aim * (1 - s) + tile.r * s;
          var grow = 0.16 + 0.84 * s;
          var stretch = 1 + (1 - s) * 1.15;
          var thin = 0.62 + 0.38 * s;
          var tw = tile.w * unit * grow * stretch;
          var th = tile.h * unit * grow * thin;
          var bend = Math.sin(Math.PI * s) * tw * 0.16;
          drawTile(px, py, tw, th, ang, bend, tile.rgb);
        }

        var now = String(Math.round(p * 100));
        var text = phrase(p);
        stage.setAttribute("aria-valuenow", now);
        stage.setAttribute("aria-valuetext", text);
        hint.hidden = motion.matches || p > 0.03;
        if (text !== announced) {
          announced = text;
          live.textContent = text;
        }
      }

      function setProgress(next) {
        if (motion.matches) return;
        progress = clamp(next);
        paint();
      }

      function onMotion() { paint(); }

      window.addEventListener("wheel", function (e) {
        e.preventDefault();
        var dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 16;
        else if (e.deltaMode === 2) dy *= stage.clientHeight;
        setProgress(progress + dy / SPAN);
      }, { passive: false });

      stage.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) touchY = e.touches[0].clientY;
      }, { passive: true });

      stage.addEventListener("touchmove", function (e) {
        if (touchY == null) return;
        var y = e.touches[0].clientY;
        var dy = touchY - y;
        touchY = y;
        e.preventDefault();
        setProgress(progress + dy / SPAN);
      }, { passive: false });

      stage.addEventListener("touchend", function () { touchY = null; });
      stage.addEventListener("touchcancel", function () { touchY = null; });

      window.addEventListener("keydown", function (e) {
        var step = null;
        if (e.key === "ArrowDown") step = 0.06;
        else if (e.key === "ArrowUp") step = -0.06;
        else if (e.key === "PageDown" || e.key === " ") step = 0.18;
        else if (e.key === "PageUp") step = -0.18;
        else if (e.key === "Home") step = -progress;
        else if (e.key === "End") step = 1 - progress;
        if (step == null) return;
        e.preventDefault();
        setProgress(progress + step);
      });

      if (motion.addEventListener) motion.addEventListener("change", onMotion);
      else if (motion.addListener) motion.addListener(onMotion);
      window.addEventListener("resize", function () { paint(); });

      var params = new URLSearchParams(location.search);
      if (params.has("at")) {
        var n = Number(params.get("at"));
        if (isFinite(n)) progress = clamp(n > 1 ? n / 100 : n);
      }
      paint();
    })();
  </script>
</body>
</html>
